[package]
name = "understand-book-local-debug"
version = "0.3.8"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
server = { path = "../../../crates/server" }
runtime = { path = "../../../crates/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

[[bin]]
name = "UnderstandBookLocalDebug"
path = "src/main.rs"
