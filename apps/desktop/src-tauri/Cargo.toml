[package]
name = "understand-book-desktop"
version = "0.3.8"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desktop-support = { path = "../../../crates/desktop-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2.12.1", features = ["json"] }
url = "2.5.7"

[[bin]]
name = "UnderstandBook"
path = "src/main.rs"
