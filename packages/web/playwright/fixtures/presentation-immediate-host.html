<!doctype html>
<html><head><meta charset="utf-8"></head><body><div id="app"></div>
<script type="module">
import { createApp, h } from 'vue';
import AgentPresentation from '/src/components/AgentPresentation.vue';
import { installIdentity, installWorkspace } from '/src/network-context.ts';
const scene = await fetch('/api/test-scene').then(response => response.json());
installIdentity({ user_id: 'presentation-test', csrf_token: 'presentation-test' });
installWorkspace(scene);
window.followUps = [];
createApp({ render: () => h(AgentPresentation, {
  sessionId: 's', turnId: 't', reference: { presentation_id: 'p', revision: 2 },
  onFollowUp: (...args) => window.followUps.push(args),
}) }).mount('#app');
</script></body></html>
