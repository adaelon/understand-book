<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>速度输入与显示结果</title>
<style>
  body { margin: 0; padding: 24px; color: #233e40; background: #f5f4ed; font: 16px/1.6 sans-serif; }
  main { max-width: 620px; margin: auto; }
  label { display: block; margin: 12px 0; }
  input, button { font: inherit; min-height: 44px; }
  input { width: 90px; }
  button { margin: 4px; padding: 4px 12px; }
  svg { display: block; width: 100%; }
</style>
<main>
  <h1>改了输入，画面为什么还没变？</h1>
  <p>A 的速度固定为 1 m/s。B 的速度在应用完成后更新，两辆车使用同一时钟。</p>
  <label>B 的输入速度（m/s） <input data-presentation-parameter="input_speed_b_m_s" id="speed" type="number" min="0" max="3" step=".5" value="1"></label>
  <button data-presentation-action="apply" id="apply">应用</button><button id="cancel" disabled>取消计算</button>
  <button id="play">播放</button><button id="pause">暂停</button><button data-presentation-action="reset" id="reset">重置</button>
  <p id="phase"></p>
  <svg viewBox="0 0 360 100" role="img" aria-label="共同时间下的距离对照">
    <text x="4" y="30">A</text><rect id="a" x="30" y="12" height="20" fill="#18857e"></rect>
    <text x="4" y="75">B</text><rect id="b" x="30" y="57" height="20" fill="#c38a35"></rect>
  </svg>
  <p id="result"></p>
  <p id="relation" hidden>同一时间内，速度翻倍，距离也翻倍。</p>
  <p id="annotation" hidden>比较时保持共同时间不变。</p>
</main>
<script>
  const defaults = { input_speed_b_m_s: 1, applied_speed_b_m_s: 1, time_s: 10, phase: 'ready', revealed: false, annotated: false };
  const model = { ...defaults, ...window.presentation?.initialState, playing: false };
  const $ = id => document.getElementById(id);
  let calculation, playback, rejectCalculation;
  function cancelCalculation() { clearTimeout(calculation); rejectCalculation?.(new Error("Calculation cancelled")); rejectCalculation = undefined; }
  const result = () => ({
    speed_b_m_s: model.applied_speed_b_m_s, time_s: model.time_s,
    distance_a_m: model.time_s, distance_b_m: model.applied_speed_b_m_s * model.time_s,
  });
  const commit = () => window.presentation?.commitState();
  function stop() { clearInterval(playback); model.playing = false; }
  function render() {
    const shown = result();
    $('speed').value = model.input_speed_b_m_s;
    $('relation').hidden = !model.revealed; $('annotation').hidden = !model.annotated;
    $('phase').textContent = { ready: '结果已应用', awaiting_apply: '等待应用', calculating: '计算中，仍显示旧结果', cancelled: '计算已取消，仍显示旧结果' }[model.phase];
    $('result').textContent = `画面：${shown.time_s.toFixed(1)} 秒，A 走 ${shown.distance_a_m.toFixed(1)} 米，B 走 ${shown.distance_b_m.toFixed(1)} 米；已应用 B 速度 ${shown.speed_b_m_s} m/s。`;
    $('a').setAttribute('width', shown.distance_a_m * 10);
    $('b').setAttribute('width', shown.distance_b_m * 10);
    $('cancel').disabled = model.phase !== 'calculating';
  }
  function setSpeed(value) {
    cancelCalculation();
    model.input_speed_b_m_s = Number(value);
    model.phase = model.input_speed_b_m_s === model.applied_speed_b_m_s ? 'ready' : 'awaiting_apply';
    render();
  };
  $('speed').oninput = () => setSpeed($('speed').value);
  function apply(signal) {
    cancelCalculation(); stop();
    const speed = model.input_speed_b_m_s;
    model.phase = 'calculating'; render();
    return new Promise((resolve, reject) => {
      const abort = () => { cancelCalculation(); model.phase = 'cancelled'; render(); };
      rejectCalculation = failure => { signal?.removeEventListener('abort', abort); reject(failure); };
      signal?.addEventListener('abort', abort, { once: true });
      calculation = setTimeout(() => {
        signal?.removeEventListener('abort', abort); rejectCalculation = undefined;
        model.applied_speed_b_m_s = speed; model.phase = 'ready'; render(); commit(); resolve();
      }, 500);
    });
  };
  $('apply').onclick = () => { void apply().catch(() => {}); };
  $('cancel').onclick = () => { cancelCalculation(); model.phase = 'cancelled'; render(); commit(); };
  $('play').onclick = () => {
    stop(); model.playing = true;
    if (model.time_s === 10) model.time_s = 0;
    render();
    playback = setInterval(() => {
      model.time_s = Math.min(10, Math.round((model.time_s + .1) * 10) / 10);
      if (model.time_s === 10) { stop(); render(); commit(); } else render();
    }, 100);
  };
  $('pause').onclick = () => { stop(); render(); commit(); };
  function reset() { cancelCalculation(); stop(); Object.assign(model, defaults); render(); commit(); }
  $('reset').onclick = reset;
  window.presentation?.registerActionHandler?.(async (action, { signal } = {}) => {
    if (action.kind === 'set_parameters') setSpeed(action.values.input_speed_b_m_s);
    else if (action.kind === 'invoke' && action.action_id === 'apply') await apply(signal);
    else if (action.kind === 'invoke' && action.action_id === 'reset') reset();
    else if (action.kind === 'reveal') { model.revealed = true; render(); }
    else if (action.kind === 'annotate') { model.annotated = true; render(); }
  });
  window.presentation?.registerStateReader(() => ({
    values: { input_speed_b_m_s: model.input_speed_b_m_s, applied_speed_b_m_s: model.applied_speed_b_m_s, time_s: model.time_s, phase: model.phase, revealed: model.revealed, annotated: model.annotated },
    visible_step: model.phase,
    observation: {
      summary: `B 的输入速度为 ${model.input_speed_b_m_s} m/s；画面按 ${model.applied_speed_b_m_s} m/s 显示 ${model.time_s} 秒、${result().distance_b_m} 米。${$('phase').textContent}`,
      state: { speed_b_m_s: model.input_speed_b_m_s, time_s: model.time_s, phase: model.phase, playing: model.playing },
      rendered: result(),
    },
  }));
  window.presentation?.registerStateRestorer(saved => {
    clearTimeout(calculation); stop();
    Object.assign(model, saved.values.page);
    if (model.phase === 'calculating') model.phase = 'awaiting_apply';
    render();
  });
  render();
</script>
</html>
