    .stage { aspect-ratio:1; width:100%; border-radius:22px; transition:background-color .2s; }

    body[data-background=white] .stage { background:#fff; }

    .caption { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:14px 8px 0; }

    .controls { margin:0 8px; display:flex; align-items:center; gap:12px; }
    .toggle { border:0; background:var(--orange); color:white; padding:9px 16px; border-radius:24px; font-size:12px; min-width:66px; }
    .toggle:disabled { opacity:.5; cursor:wait; }
    .scrub { min-width:0; flex:1; accent-color:var(--orange); height:3px; cursor:pointer; }
    .clock { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:28px; text-align:right; }
    footer { display:flex; justify-content:space-between; gap:24px; border-top:1px solid #ded2c4; margin-top:44px; padding-top:18px; color:var(--muted); font-size:11px; line-height:1.8; }
    footer p { margin:0; }
    footer a { color:var(--orange); text-decoration:none; }
    footer a:hover { text-decoration:underline; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:2px solid var(--orange); outline-offset:4px; }
    @media(max-width:760px) { main{padding:28px 22px} header{align-items:flex-start;flex-direction:column;gap:18px} h1{font-size:26px} .gallery{grid-template-columns:1fr;margin-top:20px;gap:36px} article{max-width:410px;width:100%;margin:auto} .stage{max-height:390px} .description{min-height:0} footer{flex-direction:column;gap:8px} }
