<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>源码导读</title>
  <!--TOUR_STYLE-->
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="book-mark" aria-hidden="true"></span>源码导读</div>
    <span class="project" id="project"></span>
  </header>
  <main>
    <header class="intro">
      <h1 id="lesson-title"></h1>
      <p id="summary"></p>
    </header>
    <nav class="mobile-switch" aria-label="切换阅读视图">
      <button type="button" data-view="flow" aria-pressed="true">流程图</button>
      <button type="button" data-view="code" aria-pressed="false">对应源码</button>
    </nav>
    <div class="workspace" data-view="flow">
      <section class="source-panel" aria-labelledby="source-heading">
        <header class="panel-heading code-heading">
          <h2 id="source-heading"><span class="code-mark" aria-hidden="true">&lt;/&gt;</span>源代码</h2>
          <span class="file-stat" id="file-stat"></span>
        </header>
        <nav class="file-tabs" id="file-tabs" aria-label="源码文件"></nav>
        <div class="source-path" id="source-path"></div>
        <div class="code-viewport" id="code-viewport" tabindex="0" aria-label="可滚动的真实源码">
          <div class="code-lines" id="code-lines"></div>
        </div>
        <div class="code-footer"><span><i aria-hidden="true"></i>当前步骤</span><span id="line-range"></span></div>
      </section>
      <section class="flow-panel" aria-labelledby="flow-heading">
        <header class="panel-heading">
          <h2 id="flow-heading"><span class="route-mark" aria-hidden="true">⑂</span>执行流程</h2>
          <span class="panel-meta" id="node-count"></span>
        </header>
        <div class="flow-viewport" id="flow-viewport">
          <div class="flow-map" id="flow-map">
            <canvas id="edges" aria-hidden="true"></canvas>
            <div class="flow-rows" id="flow-rows"></div>
          </div>
        </div>
      </section>
      <section class="detail-panel" aria-label="当前步骤详解">
        <div class="detail-controls">
          <span class="detail-progress" id="progress"></span>
          <div class="pager">
            <button type="button" id="previous" aria-label="上一步" title="上一步">←</button>
            <button type="button" id="next" aria-label="下一步" title="下一步">→</button>
          </div>
        </div>
        <div aria-live="polite" aria-atomic="true">
          <h2 id="step-title"></h2>
          <p id="explanation"></p>
        </div>
        <button type="button" class="source-jump" id="source-jump"></button>
      </section>
    </div>
  </main>
  <!--TOUR_DATA-->
  <!--TOUR_SCRIPT-->
</body>
</html>
