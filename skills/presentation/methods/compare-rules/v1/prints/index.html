<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尺变，向量不换</title><style>
*{box-sizing:border-box}body{margin:0;padding:clamp(10px,3vw,28px);background:#f4efe3;color:#2d2c28;font:16px/1.4 system-ui,sans-serif}main{max-width:870px;margin:auto;padding:clamp(12px,3vw,32px);border:1px solid #b8b6a0;background:radial-gradient(#7f795526 .7px,transparent .9px) 0 0/4px 4px}header{border-bottom:3px solid #be452f}h1{font:900 clamp(34px,7vw,70px)/1.08 system-ui;margin:0 0 12px;color:#17666b;text-shadow:1.5px 1px #d6573e}small{font:600 13px monospace;letter-spacing:.09em}.measure{margin:20px 0}.scale{display:flex;justify-content:space-between;font:12px monospace;color:#55594d;border-bottom:1px solid #777}figure{margin:10px 0}.track{position:relative;border-left:2px solid #374741;margin:4px 0 12px;background:repeating-linear-gradient(90deg,#26372c24 0 1px,transparent 1px calc(100% / 7));height:32px}.ink{display:block;height:100%;color:#fff;text-align:right;padding-right:7px;font:700 20px/32px monospace;background:repeating-linear-gradient(45deg,#ffffff24 0 1px,transparent 1px 4px),var(--spot);mix-blend-mode:multiply}figcaption{font-size:14px}nav{display:flex;gap:6px;flex-wrap:wrap}button{min-width:58px;min-height:44px;padding:4px 10px;background:#f4efe3;color:#14565a;border:2px solid #14565a;border-radius:0;font:bold 16px system-ui}button[aria-pressed=true]{color:#fff;background:#a4392b;border-color:#a4392b;box-shadow:2px 2px #166a6b}#readout{font-weight:700;margin:12px 0 0}@media(prefers-reduced-motion:no-preference){.print{animation:wipe .5s ease-out}@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}}
</style></head><body><main><header><small>双色套印 / 两个端点</small><h1>尺变，向量不换</h1></header><p>换一张印版，沿同一条刻度比较长度。</p><section class="measure" aria-label="共用刻度的印痕"><div class="scale" aria-label="零至七"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div><figure><figcaption>甲 (3,4) · 朱红</figcaption><div class="track"><output class="ink" id="a" style="--spot:#d34a32"></output></div></figure><figure><figcaption>乙 (0,5) · 孔雀青</figcaption><div class="track"><output class="ink" id="b" style="--spot:#187578"></output></div></figure></section>
<nav aria-label="选择印版"><button id="l1">L1</button><button id="l2">L2</button><button id="linf">L∞</button></nav><p id="readout" aria-live="polite"></p></main><script>(()=>{const host=window.presentation, points=[[3,4],[0,5]], names={l1:'L1',l2:'L2',linf:'L∞'};
const length=(m,[x,y])=>m==='l1'?Math.abs(x)+Math.abs(y):m==='l2'?Math.hypot(x,y):Math.max(Math.abs(x),Math.abs(y));
const valid=m=>Object.hasOwn(names,m);
const $=id=>document.getElementById(id);
function compare(m){const [a,b]=points.map(p=>length(m,p));return '甲 '+a+'　乙 '+b+'　'+(a===b?'一样长':a>b?'甲更长':'乙更长')}
let metric='l1';
function draw(){points.forEach((p,i)=>{const out=$(i?'b':'a'),value=length(metric,p);out.style.width=(100*value/7)+'%';out.value=value;out.classList.remove('print');void out.offsetWidth;out.classList.add('print')});$('readout').textContent=names[metric]+'　'+compare(metric)}
function select(m){if(!valid(m))return;metric=m;for(const k of Object.keys(names))$(k).setAttribute('aria-pressed',String(k===m));draw()}
for(const k of Object.keys(names))$(k).onclick=()=>select(k);
select(valid(host?.initialState?.metric)?host.initialState.metric:metric);
host?.registerStateReader(()=>({values:{metric},visible_step:names[metric],observation:{summary:$('readout').textContent,state:{metric}}}));
host?.registerStateRestorer(saved=>select(saved.values.page.metric));})();</script></body></html>
