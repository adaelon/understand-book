"use strict";
(() => {
  // skills/presentation/methods/_shared/linked-v1.js
  var $ = (id) => document.getElementById(id);
  var clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  var mix = (a, b, u) => a + (b - a) * u;
  var fmt = (x, d = 3) => Number(x.toFixed(d)).toString();
  var C = { ink: "#233e40", muted: "#768683", teal: "#18857e", gold: "#c38a35", coral: "#cf6851", blue: "#5b83ae", line: "#d4ded7", paper: "#f5f4ed" };
  var line = (x1, y1, x2, y2, color = C.line, width = 1, extra = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`;
  var rect = (x, y, w, h, fill, extra = "") => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${Math.max(0, h)}" fill="${fill}" ${extra}/>`;
  var circle = (x, y, r, fill, extra = "") => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;

  var path = (d, color = C.teal, width = 3, extra = "") => `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  var plot = (pts) => pts.map((p, i) => (i ? "L" : "M") + p.join(",")).join(" ");
  var label = (x, y, v, c = C.ink) => text(x, y, v, c, 22, 'text-anchor="middle"');
  function createDemo(topic) {

    const fields = Object.keys(topic.defaults);
    const control = (p) => `<label class="parameter" for="${p.id}"><span>${p.label}</span><output id="${p.id}-value"></output>${p.options ? `<select id="${p.id}" data-param="${p.id}">${p.options.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>` : p.type === "checkbox" ? `<input id="${p.id}" data-param="${p.id}" type="checkbox">` : `<input id="${p.id}" data-param="${p.id}" type="range" min="${p.min}" max="${p.max}" step="${p.step}">`}</label>`;
    document.body.innerHTML = `<main><header><div class="eyebrow">EXPLORABLE EXPLANATIONS <span>${topic.number} / 09</span></div><p class="method-name">${topic.method}</p><h1>${topic.title}</h1><p class="lead">${topic.lead}</p></header>
  <section class="experiment" aria-label="${topic.mainLabel}"><div class="figure-heading"><span>01 / ${topic.mainLabel}</span><span class="live-tag" id="status">\u53EF\u64CD\u4F5C</span></div><svg id="scene" viewBox="0 0 720 380" role="img" tabindex="0" aria-label="${topic.directHint}"></svg><p class="gesture">\u2194 ${topic.directHint}</p><div id="readout" aria-live="off"><div id="metrics" class="metrics"></div><p id="reading"></p></div></section>
  <section class="controls" aria-label="\u89C2\u5BDF\u63A7\u5236"><div class="transport"><button id="play" aria-pressed="false">\u64AD\u653E</button><button id="back" aria-label="\u524D\u4E00\u6B65">\u2190</button><input id="position" aria-label="\u89C2\u5BDF\u4F4D\u7F6E" type="range" min="0" max="${topic.max}" step="0.001"><button id="next" aria-label="\u540E\u4E00\u6B65">\u2192</button><button id="reset">\u91CD\u7F6E</button></div><p class="position-row"><span>${topic.timelineLabel}</span><output id="position-label"></output></p><div class="parameters">${topic.parameters.map(control).join("")}</div><div class="presets">${topic.presets.map((p, i) => `<button data-preset="${i}">${p.label}</button>`).join("")}</div></section>
  <section class="linked"><div class="essay"><p class="eyebrow">02 / ${topic.detailLabel}</p><h2>${topic.question}</h2><p>${topic.answer}</p><div class="formula">${topic.formula}</div><p class="small">${topic.detailCaption}</p></div><div class="detail-figure"><svg id="detail" viewBox="0 0 640 300" role="img" tabindex="0" aria-label="${topic.detailHint || "\u8054\u52A8\u7EC6\u8282\u56FE\uFF1B\u5DE6\u53F3\u65B9\u5411\u952E\u79FB\u52A8\u89C2\u5BDF\u4F4D\u7F6E"}"></svg><p id="detail-reading" class="small"></p></div></section>
  <section class="walkthrough"><p class="eyebrow">03 / \u4EB2\u624B\u8BD5\u4E00\u8BD5</p><div class="chapters">${topic.chapters.map((c, i) => `<button data-chapter="${i}"><span class="chapter-number">0${i + 1}</span><strong>${c.title}</strong><span>${c.body}</span><em>\u89C2\u5BDF\u8FD9\u4E00\u523B \u2197</em></button>`).join("")}</div></section><footer><p>${topic.takeaway}</p><details><summary>\u6A21\u578B\u4E0E\u9002\u7528\u8303\u56F4</summary><p>${topic.limits}</p></details></footer></main>`;
    let frame = 0, last = 0, visible = true, disposed = false;
    const snapshot = () => ({ ...state });
    const commit = () => window.presentation?.commitState();
    function position(q) {
      q = clamp(q, 0, topic.max);
      state.semantic_state = Math.floor(q);
      state.transition_progress = q - state.semantic_state;
    }
    function pause() {
      cancelAnimationFrame(frame);
      frame = 0;
      state.playing = false;
      last = 0;
    }
    function render() {
      const m = topic.derive(state);
      $("scene").innerHTML = topic.drawMain(m, state);
      $("detail").innerHTML = topic.drawDetail(m, state);
      $("metrics").innerHTML = topic.metrics(m, state).map(([label2, value, unit = ""]) => `<div><span>${label2}</span><output>${value}<small>${unit}</small></output></div>`).join("");
      $("reading").textContent = topic.explain(m, state);
      $("detail-reading").textContent = topic.detailReading(m, state);
      $("position").value = state.semantic_state + state.transition_progress;
      $("position-label").textContent = topic.positionLabel(m, state);
      for (const p of topic.parameters) {
        const el = $(p.id);
        if (p.type === "checkbox") el.checked = state[p.id];
        else el.value = state[p.id];
        $(p.id + "-value").textContent = p.options ? "" : p.format ? p.format(state[p.id]) : fmt(state[p.id]);
      }
      $("play").textContent = state.playing ? "\u6682\u505C" : "\u64AD\u653E";
      $("play").setAttribute("aria-pressed", String(state.playing));
      $("status").textContent = state.playing ? "\u6B63\u5728\u6F14\u793A" : "\u505C\u4E0B\u6765\uFF0C\u89C2\u5BDF";
      $("play").disabled = state.semantic_state === topic.max;
      $("back").disabled = state.semantic_state === 0 && state.transition_progress === 0;
      $("next").disabled = state.semantic_state === topic.max;
      return m;
    }
    function seek({ semantic_state, transition_progress = 0 }) {
      pause();
      position(semantic_state + transition_progress);
      render();
      return snapshot();
    }
    function apply({ values = {}, q = 0 } = {}) {
      pause();
      for (const key of fields) if (key in values) state[key] = values[key];
      position(q);
      render();
    }
    const current = () => state.semantic_state + state.transition_progress;
    function tick(t) {
      frame = 0;
      if (!state.playing || !visible || document.hidden || disposed) {
        last = 0;
        return;
      }
      if (last) position(current() + Math.min((t - last) / 1e3, 0.06) / (topic.secondsPerStep || 2));
      last = t;
      if (current() === topic.max) pause();
      render();
      if (state.playing) frame = requestAnimationFrame(tick);
    }
    function resume() {
      if (state.playing && !frame && !document.hidden && visible && !disposed) {
        last = 0;
        frame = requestAnimationFrame(tick);
      }
    }
    $("play").onclick = () => {
      if (state.playing) pause();
      else {
        state.playing = true;
        resume();
      }
      render();
      commit();
    };
    $("back").onclick = () => {
      seek({ semantic_state: state.transition_progress > 0 ? state.semantic_state : state.semantic_state - 1 });
      commit();
    };
    $("next").onclick = () => {
      seek({ semantic_state: state.semantic_state + 1 });
      commit();
    };
    $("reset").onclick = () => {
      seek({ semantic_state: 0 });
      commit();
    };
    $("position").oninput = (e) => seek({ semantic_state: Number(e.target.value) });
    $("position").onchange = commit;
    for (const p of topic.parameters) {
      $(p.id).oninput = (e) => apply({ values: { [p.id]: p.type === "checkbox" ? e.target.checked : typeof defaults[p.id] === "number" ? Number(e.target.value) : e.target.value } });
      $(p.id).onchange = commit;
    }
    document.querySelectorAll("[data-preset]").forEach((b) => b.onclick = () => {
      apply(topic.presets[Number(b.dataset.preset)]);
      commit();
    });
    document.querySelectorAll("[data-chapter]").forEach((b) => b.onclick = () => {
      apply(topic.chapters[Number(b.dataset.chapter)]);
      commit();
    });
    function direct(id, handler) {
      const el = $(id);
      let down = false;
      const update = (e) => {
        const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(el.getScreenCTM().inverse());
        const change = handler?.(p, state, e);
        if (change) apply(change);
      };
      el.onpointerdown = (e) => {
        if (e.button !== 0) return;
        down = true;
        el.setPointerCapture(e.pointerId);
        update(e);
      };
      el.onpointermove = (e) => {
        if (down) update(e);
      };
      el.onpointerup = el.onpointercancel = () => {
        if (down) {
          down = false;
          commit();
        }
      };
      el.onkeydown = (e) => {
        if (!["ArrowRight", "ArrowLeft", "Home", "End"].includes(e.key)) return;
        e.preventDefault();
        const change = topic.key?.(id, e.key, state);
        if (change) apply(change);
        else seek({ semantic_state: e.key === "Home" ? 0 : e.key === "End" ? topic.max : current() + (e.key === "ArrowRight" ? 0.05 : -0.05) });
        commit();
      };
    }
    direct("scene", topic.pointer);
    direct("detail", topic.detailPointer);
    const visibility = () => {
      if (document.hidden) {
        cancelAnimationFrame(frame);
        frame = 0;
        last = 0;
      } else resume();
    };
    document.addEventListener("visibilitychange", visibility);
    const observer = new IntersectionObserver((entries) => {
      visible = entries[0].isIntersecting;
      if (!visible) {
        cancelAnimationFrame(frame);
        frame = 0;
        last = 0;
      } else resume();
    });
    observer.observe(document.querySelector("main"));
    window.addEventListener("pagehide", () => {
      disposed = true;
      pause();
      observer.disconnect();
      document.removeEventListener("visibilitychange", visibility);
    }, { once: true });
    window.presentationScene = { seek, snapshot };
    window.explanationDemo = { inspect: () => structuredClone(topic.derive(state)) };
    window.presentation?.registerStateReader(() => ({ values: Object.fromEntries([...fields, "semantic_state", "transition_progress"].map((k) => [k, state[k]])), visible_step: topic.positionLabel(topic.derive(state), state) }));
    window.presentation?.registerStateRestorer((saved) => {
      const values = saved.values.page;
      apply({ values, q: (values.semantic_state ?? 0) + (values.transition_progress ?? 0) });
    });
    position(state.semantic_state + state.transition_progress);
    render();
  }

  // skills/presentation/methods/discrete-update/v3/topic.js
  function derive(s) {
    const values = [4];
    for (let i = 0; i < 8; i++) values.push(values[i] - s.eta * 2 * (values[i] - 2));
    const k = s.semantic_state, p = s.transition_progress, current = values[k], next = values[Math.min(k + 1, 8)], visual = mix(current, next, p);
    const lo = Math.min(0, ...values), hi = Math.max(4, ...values), margin = (hi - lo) * 0.12, xmin = lo - margin, xmax = hi + margin, ymax = Math.max((xmin - 2) ** 2, (xmax - 2) ** 2);
    return { values, k, p, current, next, visual, gradient: 2 * (current - 2), delta: k < 8 ? next - current : 0, xmin, xmax, ymax, q: k + p };
  }
  var X = (m, x) => 64 + (x - m.xmin) / (m.xmax - m.xmin) * 592;
  var Y = (m, x) => 324 - (x - 2) ** 2 / m.ymax * 265;
  var behavior = (eta) => eta === 0 ? "\u539F\u5730\u4E0D\u52A8" : eta < 0.5 ? "\u4ECE\u540C\u4FA7\u63A5\u8FD1" : eta === 0.5 ? "\u4E00\u6B65\u5230\u8FBE" : eta < 1 ? "\u4EA4\u66FF\u63A5\u8FD1" : eta === 1 ? "\u7B49\u5E45\u5F80\u8FD4" : "\u4EA4\u66FF\u8FDC\u79BB";
  createDemo({
    id: "discrete-update",
    method: "\u8FFD\u8E2A\u4E00\u6B21\u79BB\u6563\u66F4\u65B0",
    number: "01",
    title: "\u4E00\u6B65\uFF0C\u79BB\u8C37\u5E95\u66F4\u8FD1\uFF1F",
    lead: "\u6CBF\u7740\u5761\u5EA6\u5F80\u4E0B\u8D70\uFF0C\u6B65\u5B50\u8D8A\u5927\u8D8A\u597D\u5417\uFF1F\u628A\u5B66\u4E60\u7387\u8C03\u9AD8\uFF0C\u770B\u540C\u4E00\u6761\u66F4\u65B0\u89C4\u5219\u600E\u6837\u4ECE\u9760\u8FD1\uFF0C\u53D8\u6210\u8D8A\u8FC7\uFF0C\u518D\u53D8\u6210\u8FDC\u79BB\u3002",
    mainLabel: "\u4E00\u6761\u66F2\u7EBF\uFF0C\u516B\u6B21\u9009\u62E9",
    directHint: "\u70B9\u51FB\u8F68\u8FF9\u70B9\u8DF3\u5230\u90A3\u4E00\u6B65\uFF1B\u5728\u4E0B\u65B9\u8BEF\u5DEE\u56FE\u4E2D\u62D6\u52A8\u89C2\u5BDF\u7EBF\u3002",
    detailLabel: "\u628A\u6BCF\u4E00\u6B65\u8FDE\u8D77\u6765",
    question: "\u65B9\u5411\u5BF9\u4E86\uFF0C\u4E3A\u4EC0\u4E48\u8FD8\u4F1A\u8D70\u8FDC\uFF1F",
    answer: "\u68AF\u5EA6\u53EA\u544A\u8BC9\u4F60\u5C40\u90E8\u5411\u4E0A\u7684\u65B9\u5411\u3002\u66F4\u65B0\u53D6\u53CD\u65B9\u5411\uFF0C\u4F46\u8DE8\u51FA\u591A\u8FDC\u7531\u5B66\u4E60\u7387\u51B3\u5B9A\u3002\u6B65\u5B50\u592A\u5927\uFF0C\u4E00\u6B21\u8D8A\u8FC7\u8C37\u5E95\u540E\u7684\u8BEF\u5DEE\uFF0C\u4F1A\u6BD4\u51FA\u53D1\u65F6\u8FD8\u5927\u3002",
    formula: "x\u2096\u208A\u2081 = x\u2096 \u2212 \u03B7 \xB7 2(x\u2096 \u2212 2)",
    detailCaption: "\u4E3B\u56FE\u6309\u5F53\u524D\u5B66\u4E60\u7387\u7684\u5B8C\u6574\u516B\u6B65\u56FA\u5B9A\u5750\u6807\u8303\u56F4\u3002\u8BEF\u5DEE\u56FE\u7684\u7EB5\u8F74\u4FDD\u7559\u6B63\u8D1F\u53F7\uFF1B\u7A7F\u8FC7\u4E2D\u7EBF\u610F\u5473\u7740\u8D8A\u8FC7\u8C37\u5E95\u3002",
    takeaway: "\u5148\u8FA8\u8BA4\u5F53\u524D\u70B9\u3001\u66F4\u65B0\u91CF\u548C\u4E0B\u4E00\u70B9\uFF0C\u518D\u8BA8\u8BBA\u201C\u6536\u655B\u201D\u3002\u52A8\u753B\u4E2D\u7684\u6A59\u8272\u70B9\u8FDE\u63A5\u4E24\u6B21\u8FED\u4EE3\uFF0C\u4E0D\u662F\u989D\u5916\u505A\u4E86\u4E00\u6B21\u8BA1\u7B97\u3002",
    limits: "\u65E0\u91CF\u7EB2\u6559\u5B66\u6A21\u578B f(x)=(x\u22122)\xB2\uFF0Cx\u2080=4\uFF0C0\u2264\u03B7\u22641.2\uFF0C\u5C55\u793A\u516B\u6B21\u663E\u5F0F\u66F4\u65B0\u3002\u7ED3\u8BBA\u53EA\u9002\u7528\u4E8E\u8FD9\u4E2A\u4E8C\u6B21\u51FD\u6570\u53CA\u7ED9\u5B9A\u89C4\u5219\u3002",
    defaults: { eta: 0.25 },
    max: 8,
    secondsPerStep: 1.5,
    timelineLabel: "\u5DF2\u5B8C\u6210\u66F4\u65B0 / 8",
    parameters: [{ id: "eta", label: "\u5B66\u4E60\u7387 \u03B7", min: 0, max: 1.2, step: 0.01 }],
    presets: [{ label: "\u5C0F\u6B65\u9760\u8FD1", values: { eta: 0.25 }, q: 2.35 }, { label: "\u4E00\u6B65\u5230\u8FBE", values: { eta: 0.5 }, q: 1 }, { label: "\u6765\u56DE\u8D8A\u8FC7", values: { eta: 0.75 }, q: 2.35 }, { label: "\u8D8A\u8D70\u8D8A\u8FDC", values: { eta: 1.2 }, q: 5.35 }],
    chapters: [{ title: "\u5148\u770B\u65B9\u5411", body: "\u5F53\u524D\u68AF\u5EA6\u4E3A\u6B63\uFF0C\u66F4\u65B0\u671D\u5DE6\uFF1B\u8DDD\u79BB\u7531 \u03B7 \u51B3\u5B9A\u3002", values: { eta: 0.25 }, q: 0.35 }, { title: "\u7A7F\u8FC7\u8C37\u5E95", body: "\u03B7=0.75\uFF0C\u6BCF\u6B21\u8D8A\u8FC7 x=2\uFF0C\u4F46\u8BEF\u5DEE\u8D8A\u6765\u8D8A\u5C0F\u3002", values: { eta: 0.75 }, q: 3.35 }, { title: "\u627E\u5230\u8FB9\u754C", body: "\u03B7=1 \u5728\u4E24\u7AEF\u7B49\u5E45\u5F80\u8FD4\uFF0C\u516B\u6B65\u4E5F\u4E0D\u9760\u8FD1\u3002", values: { eta: 1 }, q: 5.35 }],
    derive,
    drawMain(m) {
      let h = `<defs><clipPath id="plot-clip">${rect(50, 35, 620, 295, "white")}</clipPath></defs>`;
      for (let j = 1; j <= 4; j++) h += line(64, 324 - j * 62, 656, 324 - j * 62);
      h += line(64, 324, 656, 324, C.muted) + line(X(m, 2), 45, X(m, 2), 324, C.gold, 1, 'stroke-dasharray="5 6"');
      h += text(64, 30, "f(x) = (x \u2212 2)\xB2", C.muted, 21) + label(X(m, 2), 356, "2", C.gold) + text(657, 356, "x", C.muted, 22);
      h += path(plot(Array.from({ length: 121 }, (_, i) => {
        const x = m.xmin + (m.xmax - m.xmin) * i / 120;
        return [X(m, x), Y(m, x)];
      })), C.ink, 3);
      const slope = 2 * (m.current - 2), a = m.current - (m.xmax - m.xmin) * 0.13, b = m.current + (m.xmax - m.xmin) * 0.13;
      const tangent = (x) => 324 - ((m.current - 2) ** 2 + slope * (x - m.current)) / m.ymax * 265;
      h += line(X(m, a), tangent(a), X(m, b), tangent(b), C.gold, 2, 'clip-path="url(#plot-clip)"');
      h += path(plot(m.values.slice(0, m.k + 1).map((x) => [X(m, x), Y(m, x)])), C.teal, 2, 'stroke-dasharray="4 6"');
      m.values.forEach((x, i) => {
        h += circle(X(m, x), Y(m, x), i <= m.k ? 5 : 3, i <= m.k ? C.teal : C.line, `data-step="${i}"`);
      });
      if (m.k < 8) h += circle(X(m, m.next), Y(m, m.next), 11, "none", `stroke="${C.teal}" stroke-width="2" id="next-point"`);
      if (m.delta !== 0) {
        const end = X(m, m.next), direction = Math.sign(m.delta);
        h += line(X(m, m.current), 335, end, 335, C.teal, 3) + `<path id="update-arrow" d="M${end},335 L${end - direction * 8},330 L${end - direction * 8},340Z" fill="${C.teal}"/>`;
      }
      h += rect(X(m, m.current) - 7, Y(m, m.current) - 7, 14, 14, C.ink, 'id="current-point" rx="2"');
      h += circle(X(m, m.visual), Y(m, m.visual), 7, C.coral, 'id="moving-point" stroke="#fff" stroke-width="2"');
      h += label(360, 30, "\u25A1 \u5F53\u524D   \u25CB \u4E0B\u4E00\u6B65   \u25CF \u753B\u9762\u4F4D\u7F6E", C.muted);
      return h;
    },
    drawDetail(m) {
      const max = Math.max(2, ...m.values.map((x) => Math.abs(x - 2))), dx = (i) => 50 + 67.5 * i, dy = (x) => 146 - (x - 2) / max * 106;
      let h = line(50, 146, 590, 146, C.muted, 1) + text(20, 35, "x \u2212 2", C.muted, 20) + text(12, 151, "0", C.muted, 18);
      h += path(plot(m.values.map((x, i) => [dx(i), dy(x)])), C.line, 2) + path(plot([...m.values.slice(0, m.k + 1).map((x, i) => [dx(i), dy(x)]), [dx(m.q), dy(m.visual)]]), C.teal, 3);
      m.values.forEach((x, i) => {
        h += circle(dx(i), dy(x), 5, i <= m.k ? C.teal : C.line) + label(dx(i), 280, i, C.muted);
      });
      h += line(dx(m.q), 30, dx(m.q), 255, C.coral, 1, 'stroke-dasharray="4 4"') + circle(dx(m.q), dy(m.visual), 7, C.coral, 'id="error-point"');
      return h;
    },
    metrics: (m) => [["\u5F53\u524D x\u2096", fmt(m.current)], ["\u66F4\u65B0 \u0394x", fmt(m.delta)], ["\u4E0B\u4E00 x\u2096\u208A\u2081", m.k === 8 ? "\u2014" : fmt(m.next)]],
    explain: (m, s) => `${behavior(s.eta)} \xB7 \u753B\u9762 x\u0303=${fmt(m.visual)}\uFF1B\u5DF2\u5B8C\u6210 ${m.k} \u6B21\u66F4\u65B0\uFF0C\u8FC7\u6E21 ${fmt(m.p * 100, 1)}%\u3002`,
    detailReading: (m, s) => `\u6BCF\u6B21\u8BEF\u5DEE\u4E58\u4EE5 ${fmt(1 - 2 * s.eta)}\u3002\u5F53\u524D\u771F\u5B9E\u8FED\u4EE3\u8BEF\u5DEE\u4E3A ${fmt(m.current - 2)}\uFF0C\u753B\u9762\u8BEF\u5DEE\u4E3A ${fmt(m.visual - 2)}\u3002`,
    positionLabel: (m) => `${m.k} + ${fmt(m.p, 2)}`,
    pointer: (p, s) => {
      const m = derive(s);
      let best = 0, d = Infinity;
      m.values.forEach((x, i) => {
        const n = (X(m, x) - p.x) ** 2 + (Y(m, x) - p.y) ** 2;
        if (n < d) {
          d = n;
          best = i;
        }
      });
      return { q: best };
    },
    detailPointer: (p) => ({ q: clamp((p.x - 50) / 540 * 8, 0, 8) })
  });
})();
