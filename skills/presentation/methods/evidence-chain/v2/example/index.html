:#e5ede2;color:#477163;border-radius:20px;padding:3px 10px}svg{display:block;width:100%;height:auto;font-family:"Segoe UI","Microsoft YaHei",sans-serif;touch-action:none;user-select:none;overflow:hidden}#scene{max-height:450px;margin:4px auto 0;cursor:ew-resize}#detail{cursor:ew-resize}svg text{font-variant-numeric:tabular-nums}svg .hit{cursor:pointer}.gesture{font-size:12px;color:var(--muted);margin:0;padding:4px 24px 18px}#readout{border-top:1px solid var(--line);padding:18px 24px 16px;background:#ffffff70}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.metrics>div>span{display:block;font-size:12px;color:var(--muted)}.metrics output{display:block;font:500 28px/1.6 Georgia,"Segoe UI",serif;color:var(--ink);font-variant-numeric:tabular-nums}.metrics output small{font:12px "Segoe UI",sans-serif;margin-left:6px;color:var(--muted)}#reading{font-size:13px;color:#526e66;margin:10px 0 0;min-height:22px}.controls{padding:20px 4px 28px}.transport{display:grid;grid-template-columns:auto 44px minmax(44px,1fr) 44px auto;gap:8px;align-items:center}#play{background:var(--teal);color:#fff;border-color:var(--teal);min-width:72px}.transport #back,.transport #next{padding:0;font-size:20px}.position-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:16px;margin:5px 0 18px}output{font-variant-numeric:tabular-nums}.parameters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 28px}.parameter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;font-size:13px;gap:2px 10px}.parameter input[type=range],.parameter select{grid-column:1/-1}.parameter output{color:var(--teal)}.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.presets button{font-size:12px;background:transparent;padding:7px 12px}.linked{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px;border-top:1px solid var(--line);padding:38px 0}.essay p{font-size:14px}.formula{white-space:pre-line;background:#e6ece2;border-left:3px solid var(--teal);padding:16px;margin:20px 0;font:17px/1.7 Georgia,"Segoe UI",serif;overflow-wrap:anywhere}.small{font-size:12px!important;color:var(--muted);line-height:1.8}.detail-figure{align-self:center;min-width:0}.detail-figure>p{padding:0 12px}.walkthrough{border-top:1px solid var(--line);padding-top:24px}.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 32px}.chapters button{display:flex;flex-direction:column;gap:10px;padding:20px;text-align:left;white-space:normal;background:#fafbf5;line-height:1.7}.chapter-number{color:var(--gold);font:22px Georgia,serif}.chapters strong{font-weight:600;font-size:15px}.chapters button>span:not(.chapter-number){font-size:12px;color:var(--muted)}.chapters em{font-size:11px;color:var(--teal);font-style:normal;margin-top:auto}footer{border-top:1px solid var(--line);font-size:13px;padding-top:14px}footer>p{max-width:760px}details{margin-top:22px;color:var(--muted);font-size:12px}summary{cursor:pointer;min-height:44px;padding:8px 0}details p{margin-top:0}@media(max-width:760px){main{padding:30px 24px 22px}.linked{grid-template-columns:1fr;gap:12px}.detail-figure{max-width:660px;width:100%}.chapters{gap:8px}.chapters button{padding:14px}h1{font-size:46px}}@media(max-width:440px){main{padding:24px 14px 18px}h1{font-size:38px}.lead{font-size:15px}.figure-heading{padding:15px 12px 0;font-size:11px}.live-tag{display:none}.gesture{padding:3px 12px 13px;font-size:11px}#readout{padding:13px 12px}.metrics{gap:8px}.metrics output{font-size:23px}.metrics>div>span{font-size:11px}.metrics output small{display:block;margin:0;font-size:10px}.transport{grid-template-columns:auto 44px minmax(44px,1fr) 44px;gap:5px}#reset{grid-column:4;grid-row:2}.position-row{margin-top:-44px;margin-right:56px;min-height:44px;align-items:center;font-size:11px}.parameters{grid-template-columns:1fr}.chapters{grid-template-columns:1fr}.chapters button{padding:16px;display:grid;grid-template-columns:25px 1fr;gap:5px 12px}.chapter-number{grid-row:1/4}.chapters em,.chapters button>span:not(.chapter-number){grid-column:2}.linked{padding:28px 0}.controls{padding-left:0;padding-right:0}}

</style></head><body><script>
"use strict";
(() => {
  // skills/presentation/methods/_shared/linked-v1.js
  var $ = (id) => document.getElementById(id);
  var clamp = (x, a2, b2) => Math.min(b2, Math.max(a2, x));
  var fmt = (x, d = 3) => Number(x.toFixed(d)).toString();
  var C = { ink: "#233e40", muted: "#768683", teal: "#18857e", gold: "#c38a35", coral: "#cf6851", blue: "#5b83ae", line: "#d4ded7", paper: "#f5f4ed" };
  var line = (x1, y1, x2, y2, color = C.line, width = 1, extra = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`;
  var rect = (x, y, w, h, fill, extra = "") => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${Math.max(0, h)}" fill="${fill}" ${extra}/>`;
  var circle = (x, y, r, fill, extra = "") => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
  var text = (x, y, value, color = C.muted, size = 20, extra = "") => `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" ${extra}>${value}</text>`;
  var label = (x, y, v, c = C.ink) => text(x, y, v, c, 22, 'text-anchor="middle"');
  function createDemo(topic) {
    const defaults = { ...topic.defaults, semantic_state: 0, transition_progress: 0 };
    const state = { ...defaults, ...window.presentation?.initialState, playing: false };
    const fields = Object.keys(topic.defaults);
    const control = (p) => `<label class="parameter" for="${p.id}"><span>${p.label}</span><output id="${p.id}-value"></output>${p.options ? `<select id="${p.id}" data-param="${p.id}">${p.options.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>` : p.type === "checkbox" ? `<input id="${p.id}" data-param="${p.id}" type="checkbox">` : `<input id="${p.id}" data-param="${p.id}" type="range" min="${p.min}" max="${p.max}" step="${p.step}">`}</label>`;
    document.body.innerHTML = `<main><header><div class="eyebrow">EXPLORABLE EXPLANATIONS <span>${topic.number} / 09</span></div><p class="method-name">${topic.method}</p><h1>${topic.title}</h1><p class="lead">${topic.lead}</p></header>
  <section class="experiment" aria-label="${topic.mainLabel}"><div class="figure-heading"><span>01 / ${topic.mainLabel}</span><span class="live-tag" id="status">\u53EF\u64CD\u4F5C</span></div><svg id="scene" viewBox="0 0 720 380" role="img" tabindex="0" aria-label="${topic.directHint}"></svg><p class="gesture">\u2194 ${topic.directHint}</p><div id="readout" aria-live="off"><div id="metrics" class="metrics"></div><p id="reading"></p></div></section>
  <section class="controls" aria-label="\u89C2\u5BDF\u63A7\u5236"><div class="transport"><button id="play" aria-pressed="false">\u64AD\u653E</button><button id="back" aria-label="\u524D\u4E00\u6B65">\u2190</button><input id="position" aria-label="\u89C2\u5BDF\u4F4D\u7F6E" type="range" min="0" max="${topic.max}" step="0.001"><button id="next" aria-label="\u540E\u4E00\u6B65">\u2192</button><button id="reset">\u91CD\u7F6E</button></div><p class="position-row"><span>${topic.timelineLabel}</span><output id="position-label"></output></p><div class="parameters">${topic.parameters.map(control).join("")}</div><div class="presets">${topic.presets.map((p, i) => `<button data-preset="${i}">${p.label}</button>`).join("")}</div></section>
  <section class="linked"><div class="essay"><p class="eyebrow">02 / ${topic.detailLabel}</p><h2>${topic.question}</h2><p>${topic.answer}</p><div class="formula">${topic.formula}</div><p class="small">${topic.detailCaption}</p></div><div class="detail-figure"><svg id="detail" viewBox="0 0 640 300" role="img" tabindex="0" aria-label="${topic.detailHint || "\u8054\u52A8\u7EC6\u8282\u56FE\uFF1B\u5DE6\u53F3\u65B9\u5411\u952E\u79FB\u52A8\u89C2\u5BDF\u4F4D\u7F6E"}"></svg><p id="detail-reading" class="small"></p></div></section>
  <section class="walkthrough"><p class="eyebrow">03 / \u4EB2\u624B\u8BD5\u4E00\u8BD5</p><div class="chapters">${topic.chapters.map((c, i) => `<button data-chapter="${i}"><span class="chapter-number">0${i + 1}</span><strong>${c.title}</strong><span>${c.body}</span><em>\u89C2\u5BDF\u8FD9\u4E00\u523B \u2197</em></button>`).join("")}</div></section><footer><p>${topic.takeaway}</p><details><summary>\u6A21\u578B\u4E0E\u9002\u7528\u8303\u56F4</summary><p>${topic.limits}</p></details></footer></main>`;
    let frame = 0, last = 0, visible = true, disposed = false;
    const snapshot = () => ({ ...state });
    const commit = () => window.presentation?.commitState();
    function position(q) {
      q = clamp(q, 0, topic.max);
      state.semantic_state = Math.floor(q);
      state.transition_progress = q - state.semantic_state;
    }
    function pause() {
      cancelAnimationFrame(frame);
      frame = 0;
      state.playing = false;
      last = 0;
    }
    function render() {
      const m = topic.derive(state);
      $("scene").innerHTML = topic.drawMain(m, state);
      $("detail").innerHTML = topic.drawDetail(m, state);
      $("metrics").innerHTML = topic.metrics(m, state).map(([label2, value, unit = ""]) => `<div><span>${label2}</span><output>${value}<small>${unit}</small></output></div>`).join("");
      $("reading").textContent = topic.explain(m, state);
      $("detail-reading").textContent = topic.detailReading(m, state);
      $("position").value = state.semantic_state + state.transition_progress;
      $("position-label").textContent = topic.positionLabel(m, state);
      for (const p of topic.parameters) {
        const el = $(p.id);
        if (p.type === "checkbox") el.checked = state[p.id];
        else el.value = state[p.id];
        $(p.id + "-value").textContent = p.options ? "" : p.format ? p.format(state[p.id]) : fmt(state[p.id]);
      }
      $("play").textContent = state.playing ? "\u6682\u505C" : "\u64AD\u653E";
      $("play").setAttribute("aria-pressed", String(state.playing));
      $("status").textContent = state.playing ? "\u6B63\u5728\u6F14\u793A" : "\u505C\u4E0B\u6765\uFF0C\u89C2\u5BDF";
      $("play").disabled = state.semantic_state === topic.max;
      $("back").disabled = state.semantic_state === 0 && state.transition_progress === 0;
      $("next").disabled = state.semantic_state === topic.max;
      return m;
    }
    function seek({ semantic_state, transition_progress = 0 }) {
      pause();
      position(semantic_state + transition_progress);
      render();
      return snapshot();
    }
    function apply({ values = {}, q = 0 } = {}) {
      pause();
      for (const key of fields) if (key in values) state[key] = values[key];
      position(q);
      render();
    }
    const current = () => state.semantic_state + state.transition_progress;
    function tick(t) {
      frame = 0;
      if (!state.playing || !visible || document.hidden || disposed) {
        last = 0;
        return;
      }
      if (last) position(current() + Math.min((t - last) / 1e3, 0.06) / (topic.secondsPerStep || 2));
      last = t;
      if (current() === topic.max) pause();
      render();
      if (state.playing) frame = requestAnimationFrame(tick);
    }
    function resume() {
      if (state.playing && !frame && !document.hidden && visible && !disposed) {
        last = 0;
        frame = requestAnimationFrame(tick);
      }
    }
    $("play").onclick = () => {
      if (state.playing) pause();
      else {
        state.playing = true;
        resume();
      }
      render();
      commit();
    };
    $("back").onclick = () => {
      seek({ semantic_state: state.transition_progress > 0 ? state.semantic_state : state.semantic_state - 1 });
      commit();
    };
    $("next").onclick = () => {
      seek({ semantic_state: state.semantic_state + 1 });
      commit();
    };
    $("reset").onclick = () => {
      seek({ semantic_state: 0 });
      commit();
    };
    $("position").oninput = (e) => seek({ semantic_state: Number(e.target.value) });
    $("position").onchange = commit;
    for (const p of topic.parameters) {
      $(p.id).oninput = (e) => apply({ values: { [p.id]: p.type === "checkbox" ? e.target.checked : typeof defaults[p.id] === "number" ? Number(e.target.value) : e.target.value } });
      $(p.id).onchange = commit;
    }
    document.querySelectorAll("[data-preset]").forEach((b2) => b2.onclick = () => {
      apply(topic.presets[Number(b2.dataset.preset)]);
      commit();
    });
    document.querySelectorAll("[data-chapter]").forEach((b2) => b2.onclick = () => {
      apply(topic.chapters[Number(b2.dataset.chapter)]);
      commit();
    });
    function direct(id, handler) {
      const el = $(id);
      let down = false;
      const update = (e) => {
        const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(el.getScreenCTM().inverse());
        const change = handler?.(p, state, e);
        if (change) apply(change);
      };
      el.onpointerdown = (e) => {
        if (e.button !== 0) return;
        down = true;
        el.setPointerCapture(e.pointerId);
        update(e);
      };
      el.onpointermove = (e) => {
        if (down) update(e);
      };
      el.onpointerup = el.onpointercancel = () => {
        if (down) {
          down = false;
          commit();
        }
      };
      el.onkeydown = (e) => {
        if (!["ArrowRight", "ArrowLeft", "Home", "End"].includes(e.key)) return;
        e.preventDefault();
        const change = topic.key?.(id, e.key, state);
        if (change) apply(change);
        else seek({ semantic_state: e.key === "Home" ? 0 : e.key === "End" ? topic.max : current() + (e.key === "ArrowRight" ? 0.05 : -0.05) });
        commit();
      };
    }
    direct("scene", topic.pointer);
    direct("detail", topic.detailPointer);
    const visibility = () => {
      if (document.hidden) {
        cancelAnimationFrame(frame);
        frame = 0;
        last = 0;
      } else resume();
    };
    document.addEventListener("visibilitychange", visibility);
    const observer = new IntersectionObserver((entries) => {
      visible = entries[0].isIntersecting;
      if (!visible) {
        cancelAnimationFrame(frame);
        frame = 0;
        last = 0;
      } else resume();
    });
    observer.observe(document.querySelector("main"));
    window.addEventListener("pagehide", () => {
      disposed = true;
      pause();
      observer.disconnect();
      document.removeEventListener("visibilitychange", visibility);
    }, { once: true });
    window.presentationScene = { seek, snapshot };
    window.explanationDemo = { inspect: () => structuredClone(topic.derive(state)) };
    window.presentation?.registerStateReader(() => ({ values: Object.fromEntries([...fields, "semantic_state", "transition_progress"].map((k) => [k, state[k]])), visible_step: topic.positionLabel(topic.derive(state), state) }));
    window.presentation?.registerStateRestorer((saved) => {
      const values = saved.values.page;
      apply({ values, q: (values.semantic_state ?? 0) + (values.transition_progress ?? 0) });
    });
    position(state.semantic_state + state.transition_progress);
    render();
  }

  // skills/presentation/methods/evidence-chain/v2/topic.js
  var a = [12, 10, 11];
  var b = [10, 8, 9];
  function derive(s) {
    const meanA = a.reduce((x, y) => x + y, 0) / a.length, meanB = b.reduce((x, y) => x + y, 0) / b.length;
    return { q: s.semantic_state + s.transition_progress, k: s.semantic_state, p: s.transition_progress, meanA, meanB, difference: meanA - meanB, selected: s.selected, controlled: s.controlled };
  }
  createDemo({
    id: "evidence-chain",
    method: "\u4ECE\u8BC1\u636E\u8D70\u5230\u6709\u8FB9\u754C\u7684\u7ED3\u8BBA",
    number: "06",
    title: "\u5FEB\u4E86\u4E24\u79D2\uFF0C\u80FD\u8BF4\u660E\u4EC0\u4E48\uFF1F",
    lead: "\u4E09\u7EC4\u8017\u65F6\u8BB0\u5F55\uFF0C\u8DB3\u591F\u7B97\u51FA\u4E00\u4E2A\u5DEE\u503C\u3002\u8981\u4ECE\u8FD9\u4E2A\u5DEE\u503C\u8D70\u5230\u7ED3\u8BBA\uFF0C\u8FD8\u9700\u8981\u54EA\u4E9B\u6761\u4EF6\uFF1F\u70B9\u5F00\u8BB0\u5F55\uFF0C\u5C55\u5F00\u63A8\u7406\uFF0C\u518D\u8BD5\u7740\u62FF\u6389\u4E00\u4E2A\u524D\u63D0\u3002",
    mainLabel: "\u5148\u8BA9\u6BCF\u4E2A\u6570\u5B57\u6709\u51FA\u5904",
    directHint: "\u70B9\u51FB\u4E00\u7EC4\u8BB0\u5F55\u9AD8\u4EAE\u5176\u5747\u503C\u8D21\u732E\uFF1B\u65B9\u5411\u952E\u5207\u6362\u8BB0\u5F55\u3002",
    detailLabel: "\u7B97\u5F97\u5BF9\uFF0C\u4E0D\u7B49\u4E8E\u63A8\u5F97\u8FDC",
    question: "\u4E24\u79D2\uFF0C\u662F\u8BB0\u5F55\u91CC\u7684\u5DEE\uFF0C\u8FD8\u662F\u666E\u904D\u4F18\u52BF\uFF1F",
    answer: "\u539F\u59CB\u8BB0\u5F55\u53EF\u4EE5\u652F\u6301\u63CF\u8FF0\uFF0C\u5747\u503C\u53EF\u4EE5\u603B\u7ED3\u8FD9\u4E09\u6B21\u6D4B\u91CF\u3002\u5373\u4F7F\u786C\u4EF6\u3001\u8D1F\u8F7D\u4E0E\u8BA1\u65F6\u65B9\u5F0F\u76F8\u540C\uFF0C\u4E5F\u8FD8\u4E0D\u80FD\u51ED\u4E09\u4E2A\u6837\u672C\u63A8\u51FA\u6240\u6709\u573A\u666F\u90FD\u66F4\u5FEB\uFF1B\u6761\u4EF6\u4E0D\u540C\uFF0C\u66F4\u65E0\u6CD5\u628A\u5DEE\u5F02\u5F52\u7ED9\u5355\u4E00\u65B9\u6848\u3002",
    formula: "\u5E73\u5747\u8017\u65F6\uFF1AA = 33/3 = 11 s\nB = 27/3 = 9 s\u3000 \u5DEE\u503C = 2 s",
    detailCaption: "\u6784\u9020\u6570\u636E\uFF0C\u7528\u4E8E\u7EC3\u4E60\u8BC1\u636E\u7ED3\u6784\u3002\u524D\u63D0\u5F00\u5173\u6539\u53D8\u7ED3\u8BBA\u7684\u8FB9\u754C\uFF0C\u539F\u59CB\u6D4B\u91CF\u4E0E\u7B97\u672F\u7ED3\u679C\u4FDD\u6301\u4E0D\u53D8\u3002",
    takeaway: "\u53EF\u56DE\u6EAF\u7684\u89E3\u91CA\u8981\u540C\u65F6\u7ED9\u51FA\u8BB0\u5F55\u3001\u8BA1\u7B97\u3001\u6BD4\u8F83\u6761\u4EF6\u548C\u7ED3\u8BBA\u8FB9\u754C\u3002\u6BCF\u4E00\u5C42\u53EA\u80FD\u8BF4\u51FA\u524D\u4E00\u5C42\u771F\u6B63\u652F\u6301\u7684\u8BDD\u3002",
    limits: "\u672C\u4F8B\u7684\u4E09\u7EC4\u8017\u65F6\u4E3A\u6784\u9020\u6570\u636E\uFF0C\u6CA1\u6709\u5916\u90E8\u6D4B\u91CF\u6765\u6E90\u3002\u6CA1\u6709\u7EDF\u8BA1\u663E\u8457\u6027\u3001\u603B\u4F53\u63A8\u65AD\u6216\u56E0\u679C\u8BC1\u660E\u3002\u6539\u5199\u5230\u771F\u5B9E\u4E66\u7C4D\u65F6\u987B\u7528\u53EF\u56DE\u5230\u539F\u6587\u7684\u8BC1\u636E\u66FF\u6362\u793A\u4F8B\u8BB0\u5F55\u548C\u6765\u6E90\u3002",
    defaults: { controlled: true, selected: 0 },
    max: 3,
    secondsPerStep: 2.4,
    timelineLabel: "\u8BB0\u5F55 \u2192 \u5747\u503C \u2192 \u6BD4\u8F83 \u2192 \u7ED3\u8BBA",
    parameters: [{ id: "controlled", label: "\u786C\u4EF6\u3001\u8D1F\u8F7D\u3001\u8BA1\u65F6\u65B9\u5F0F\u76F8\u540C", type: "checkbox", format: (v) => v ? "\u6761\u4EF6\u4E00\u81F4" : "\u6761\u4EF6\u4E0D\u540C" }],
    presets: [{ label: "\u6761\u4EF6\u4E00\u81F4\u65F6", values: { controlled: true }, q: 3 }, { label: "\u62FF\u6389\u6BD4\u8F83\u524D\u63D0", values: { controlled: false }, q: 3 }],
    chapters: [{ title: "\u56DE\u5230\u8BB0\u5F55", body: "\u6BCF\u4E2A\u70B9\u90FD\u662F\u4E00\u6B21\u6784\u9020\u6D4B\u91CF\uFF0C\u5148\u8BFB\u6570\u3002", values: { selected: 0, controlled: true }, q: 0 }, { title: "\u53EA\u505A\u7B97\u672F", body: "\u5747\u503C\u4E3A 11 s \u4E0E 9 s\uFF0C\u5DEE\u503C\u786E\u5B9E\u4E3A 2 s\u3002", values: { controlled: true }, q: 2 }, { title: "\u6536\u4F4F\u7ED3\u8BBA", body: "\u6761\u4EF6\u4E0D\u4E00\u81F4\u65F6\uFF0C\u5DEE\u503C\u4ECD\u5728\uFF0C\u5F52\u56E0\u4E0D\u6210\u7ACB\u3002", values: { controlled: false }, q: 3 }],
    derive,
    drawMain(m) {
      const X = (v) => 145 + v * 36;
      let h = text(145, 35, "\u8017\u65F6 / s \xB7 \u6784\u9020\u8BB0\u5F55", C.muted, 22);
      for (let t = 0; t <= 14; t += 2) h += line(X(t), 61, X(t), 321, C.line) + label(X(t), 355, t, C.muted);
      for (let i = 0; i < 3; i++) {
        const y = 100 + i * 87;
        h += rect(33, y - 35, 650, 71, i === m.selected ? "#e3eadf" : "transparent", 'rx="8"') + text(40, y + 7, `\u8BB0\u5F55 ${i + 1}`, C.muted, 22) + line(X(b[i]), y, X(a[i]), y, i === m.selected ? C.ink : C.muted, 2) + circle(X(a[i]), y, 9, C.teal) + circle(X(b[i]), y, 9, C.gold);
        h += text(X(a[i]) + 15, y + 7, a[i], C.teal, 20) + text(X(b[i]) - 16, y + 7, b[i], C.gold, 20, 'text-anchor="end"');
      }
      if (m.q >= 1) h += line(X(m.meanA), 59, X(m.meanA), 322, C.teal, 2, 'stroke-dasharray="5 5" id="mean-a"') + line(X(m.meanB), 59, X(m.meanB), 322, C.gold, 2, 'stroke-dasharray="5 5" id="mean-b"');
      h += text(485, 35, "\u25CF A", C.teal, 21) + text(570, 35, "\u25CF B", C.gold, 21);
      return h;
    },
    drawDetail(m) {
      let h = "";
      const labels = ["\u8BB0\u5F55", "\u8BA1\u7B97", "\u524D\u63D0", "\u7ED3\u8BBA"];
      labels.forEach((v, i) => {
        const x = 78 + i * 160, active = m.q >= i;
        h += circle(x, 85, 27, active ? i === 2 && !m.controlled ? C.coral : C.teal : "#dce3d8") + label(x, 93, i + 1, active ? "#fff" : C.muted) + label(x, 143, v, active ? C.ink : C.muted);
        if (i < 3) h += line(x + 33, 85, x + 33 + 94 * clamp(m.q - i, 0, 1), 85, i === 1 && !m.controlled ? C.coral : C.teal, 3);
      });
      if (m.q >= 2) h += rect(28, 181, 584, 82, m.controlled ? "#e2ebe0" : "#f1e3db", 'rx="8"') + label(320, 216, m.controlled ? "\u6BD4\u8F83\u6761\u4EF6\u4E00\u81F4" : "\u6BD4\u8F83\u6761\u4EF6\u4E0D\u540C", m.controlled ? C.teal : C.coral) + label(320, 247, m.controlled ? "\u4ECD\u53EA\u63CF\u8FF0\u8FD9\u4E09\u6B21\u6D4B\u91CF" : "\u4E0D\u80FD\u5C06\u5DEE\u5F02\u5F52\u56E0\u4E8E\u65B9\u6848", C.ink);
      return h;
    },
    metrics: (m) => [["A \u5E73\u5747", m.q >= 1 ? m.meanA : "\u2014", "s"], ["B \u5E73\u5747", m.q >= 1 ? m.meanB : "\u2014", "s"], ["A \u2212 B", m.q >= 2 ? m.difference : "\u2014", "s"]],
    explain: (m) => m.q < 1 ? `\u8BB0\u5F55 ${m.selected + 1}\uFF1AA=${a[m.selected]} s\uFF0CB=${b[m.selected]} s\u3002\u5747\u503C\u5C1A\u672A\u5C55\u5F00\u3002` : m.q < 2 ? "\u8BA1\u7B97\uFF1A(12+10+11)/3 = 11 s\uFF1B(10+8+9)/3 = 9 s\u3002" : m.q < 3 ? "\u6BD4\u8F83\uFF1A11 s \u2212 9 s = 2 s\u3002\u63A5\u4E0B\u6765\u68C0\u67E5\u8FD9\u4E2A\u5DEE\u503C\u652F\u6301\u591A\u5927\u7684\u7ED3\u8BBA\u3002" : m.controlled ? "\u8FD9\u4E09\u6B21\u540C\u6761\u4EF6\u8BB0\u5F55\u4E2D\uFF0CB \u7684\u5E73\u5747\u8017\u65F6\u5C11 2 s\uFF1B\u5C1A\u4E0D\u80FD\u63A8\u51FA\u5176\u4ED6\u8D1F\u8F7D\u6216\u603B\u4F53\u4F18\u52BF\u3002" : "\u8FD9\u4E09\u6B21\u8BB0\u5F55\u4E2D\uFF0CB \u7684\u5E73\u5747\u8017\u65F6\u5C11 2 s\uFF1B\u6761\u4EF6\u4E0D\u540C\uFF0C\u4E0D\u80FD\u5C06\u5DEE\u5F02\u5F52\u56E0\u4E8E\u65B9\u6848\u3002",
    detailReading: (m) => `\u8BB0\u5F55 ${m.selected + 1} \u5BF9 A \u5747\u503C\u8D21\u732E ${fmt(a[m.selected] / 3)} s\uFF0C\u5BF9 B \u5747\u503C\u8D21\u732E ${fmt(b[m.selected] / 3)} s\u3002${m.q >= 3 ? "\u7ED3\u8BBA\u5FC5\u987B\u4FDD\u7559\u6837\u672C\u8303\u56F4\u3002" : "\u6CBF\u65F6\u95F4\u8F74\u5C55\u5F00\u5230\u7ED3\u8BBA\u3002"}`,
    positionLabel: (m) => `${m.k} / 3 \xB7 ${fmt(m.p * 100, 0)}%`,
    pointer: (p, s) => ({ values: { selected: clamp(Math.round((p.y - 100) / 87), 0, 2) }, q: s.semantic_state + s.transition_progress }),
    detailPointer: (p) => ({ q: clamp((p.x - 78) / 480 * 3, 0, 3) }),
    key: (id, k, s) => id === "scene" ? { values: { selected: k === "Home" ? 0 : k === "End" ? 2 : clamp(s.selected + (k === "ArrowRight" ? 1 : -1), 0, 2) }, q: s.semantic_state + s.transition_progress } : null
  });
})();
