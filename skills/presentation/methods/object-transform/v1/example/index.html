<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保持身份的对象变换</title><style>
:root{color-scheme:light;--ink:#193538;--muted:#526669;--paper:#f4f3ee;--line:#cdd8d5;--teal:#087d77;--orange:#bd501e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:760px;margin:auto;padding:24px}h1{font-size:clamp(25px,4vw,34px);line-height:1.3;letter-spacing:-.035em;margin:5px 0 12px}p{margin:8px 0}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:750}.intro{color:var(--muted)}
.figure{margin:22px 0 12px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}.scene{display:block;width:100%;height:auto;max-height:420px}.scene text{font:20px system-ui,sans-serif;fill:var(--ink)}.scene .small{font-size:16px}.scene .grid{stroke:#e3e9e6;stroke-width:1}.scene .axis{stroke:#7a9393;stroke-width:1.5}.scene .accent{fill:var(--teal)}
.caption{padding:0 16px 14px;font-size:14px;color:var(--muted)}.readout{border-left:3px solid var(--teal);padding:4px 14px;margin:16px 0;min-height:72px}.readout strong,output{font-variant-numeric:tabular-nums}.readout strong{font-size:22px}.controls{background:#e9eee9;border-radius:14px;padding:16px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
button,input,select{font:inherit;min-height:44px}button{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:8px 14px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d6883f;outline-offset:3px}#play{background:var(--teal);color:#fff;border-color:var(--teal)}label{display:block;margin:8px 0 0}input[type=range]{width:100%;margin:0;accent-color:var(--teal)}input[type=checkbox]{width:22px;min-height:22px;vertical-align:middle;accent-color:var(--teal)}select{max-width:100%;padding:4px 8px;background:#fff;border:1px solid var(--line);border-radius:6px}.note{font-size:14px;color:var(--muted);margin-top:14px}.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}.evidence{margin:12px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}.evidence p{margin:0}.data-table{border-collapse:collapse;width:100%;font-size:14px}.data-table th,.data-table td{padding:4px 10px;text-align:left;border-bottom:1px solid var(--line)}[hidden]{display:none!important}
@media(max-width:400px){main{padding:14px 12px}.controls{padding:12px}.scene text{font-size:24px}.scene .small{font-size:21px}.caption{padding:0 12px 10px}}
</style></head>
<body><main><div class="eyebrow">EXPLANATION STUDY / 02</div><h1>保持身份的对象变换</h1><p class="intro">把单位正方形剪切成平行四边形。追踪同一个角点，观察面积为什么始终为 1。</p>
<section class="figure" aria-label="解释图形"><svg id="scene" class="scene" viewBox="0 0 480 310" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">保持身份的对象变换</title><desc id="scene-desc">灰色虚线保留原形；青色是同一对象的当前位置，橙点始终对应右上角。</desc><path class="grid" d="M80 40V250 M180 40V250 M280 40V250 M380 40V250 M60 130H440 M60 230H440"/><path class="axis" d="M60 230H440 M180 250V30"/><text x="430" y="260">x</text><text x="150" y="30">y</text><text x="158" y="258">0</text><text x="270" y="258">1</text><text x="145" y="135">1</text><polygon points="180,230 280,230 280,130 180,130" fill="none" stroke="#93a4a4" stroke-width="2" stroke-dasharray="5 5"/><polygon id="shape" fill="#bce6de" stroke="#087d77" stroke-width="3"/><circle id="tracked" r="7" fill="#bd501e"/><text id="point-label" class="small" x="300" y="100"></text></svg><p class="caption">灰色虚线保留原形；青色是同一对象的当前位置，橙点始终对应右上角。</p></section>
<section id="readout" class="readout" aria-label="当前结果"><strong>面积 <output id="area">1</output></strong><p id="mapping"></p></section>
<section class="controls" aria-label="观察控件"><div class="buttons"><button id="back">前一步</button><button id="play" aria-pressed="false">播放</button><button id="next">后一步</button><button id="reset">重置</button></div><label for="position">讲解位置 <output id="position-label"></output></label><input id="position" type="range" min="0" max="1" step="0.001" value="0"><label for="shear">目标剪切 s：<output id="shear-value"></output></label><input id="shear" type="range" min="-1" max="1" step="0.1"></section><p class="note">显式模型：x′=x+s·y，y′=y。过程参数 u 从 0 到 1，当前剪切系数为 u·s；每一帧都是这个明确映射。</p></main>
<script>(()=>{const TITLE="保持身份的对象变换",MAX_STEP=1,DEFAULTS={"shear": 1};
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n.toFixed(4)).toString();
  const clamp = (n,lo=0,hi=1) => Math.max(lo,Math.min(hi,n));
  const attr = (id,key,value) => $(id).setAttribute(key,value);
  const initial = {...DEFAULTS,...(window.presentation?.initialState ?? {})};
  const state = {...initial,semantic_state:0,transition_progress:0,playing:false};
  let frame=0,lastTime=0;
  const snapshot=()=>({...state});
  const commit=()=>window.presentation?.commitState();
  function pause(){cancelAnimationFrame(frame);state.playing=false;}
  function position(q){q=clamp(q,0,MAX_STEP);state.semantic_state=Math.floor(q);state.transition_progress=q-state.semantic_state;}
function renderAt(s,k,p){const u=k+p,a=s.shear*u;const points=[[0,0],[1,0],[1+a,1],[a,1]];attr('shape','points',points.map(([x,y])=>`${180+x*100},${230-y*100}`).join(' '));attr('tracked','cx',280+a*100);attr('tracked','cy',130);$('point-label').textContent=`(${fmt(1+a)}, 1)`;attr('point-label','x',Math.min(350,Math.max(70,260+a*100)));$('mapping').textContent=`u=${fmt(u)}：右上角 (1,1) → (${fmt(1+a)},1)，底 1 × 高 1 = 1。`; }
  function render(){
    renderAt(state,state.semantic_state,state.transition_progress);
    $('position').value=state.semantic_state+state.transition_progress;
    $('position-label').textContent=`${state.semantic_state} + ${fmt(state.transition_progress)}`;
    $('play').textContent=state.playing?'暂停':'播放';$('play').setAttribute('aria-pressed',state.playing);
    $('play').disabled=state.semantic_state===MAX_STEP;
    $('back').disabled=state.semantic_state===0&&state.transition_progress===0;
    $('next').disabled=state.semantic_state===MAX_STEP;
    for(const key of Object.keys(DEFAULTS)){
      const control=$(key);if(!control)continue;
      if(control.type==='checkbox')control.checked=state[key];else control.value=state[key];
      const output=$(key+'-value');if(output)output.textContent=typeof state[key]==='number'?fmt(state[key]):state[key];
    }
  }
  function seek({semantic_state,transition_progress=0}){pause();position(semantic_state+transition_progress);render();return snapshot();}
  function tick(now){position(state.semantic_state+state.transition_progress+(now-lastTime)/1500);lastTime=now;if(state.semantic_state===MAX_STEP)state.playing=false;render();if(state.playing)frame=requestAnimationFrame(tick);else commit();}
  $('play').onclick=()=>{if(state.playing){pause();render();commit();}else{state.playing=true;lastTime=performance.now();render();frame=requestAnimationFrame(tick);}};
  $('back').onclick=()=>{seek({semantic_state:Math.max(0,state.semantic_state-1)});commit();};
  $('next').onclick=()=>{seek({semantic_state:Math.min(MAX_STEP,state.semantic_state+1)});commit();};
  $('reset').onclick=()=>{seek({semantic_state:0});commit();};
  $('position').oninput=e=>seek({semantic_state:0,transition_progress:Number(e.target.value)});$('position').onchange=commit;
  for(const [key,value] of Object.entries(DEFAULTS)){
    const control=$(key);if(!control)continue;
    control.addEventListener('input',()=>{state[key]=typeof value==='boolean'?control.checked:typeof value==='number'?Number(control.value):control.value;seek({semantic_state:0});});
    control.addEventListener('change',commit);
  }
  window.presentationScene={seek,snapshot};
  seek({semantic_state:initial.semantic_state??0,transition_progress:initial.transition_progress??0});
  window.presentation?.registerStateReader(()=>({values:Object.fromEntries([...Object.keys(DEFAULTS),'semantic_state','transition_progress'].map(key=>[key,state[key]])),visible_step:`${TITLE} · ${state.semantic_state} + ${fmt(state.transition_progress)}`}));
  window.presentation?.registerStateRestorer(saved=>{const values=saved.values.page;for(const key of Object.keys(DEFAULTS))state[key]=values[key];seek({semantic_state:values.semantic_state,transition_progress:values.transition_progress});});
})();</script></body></html>
