<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快一倍，会远一倍吗？</title><style>
:root{color-scheme:light;--paper:#f5f4ed;--ink:#233e40;--muted:#697d79;--teal:#18857e;--line:#d4ded7;--gold:#c38a35}*{box-sizing:border-box}body{margin:0;padding:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1080px;margin:auto;padding:45px 44px 28px}header{padding:0 0 30px;max-width:850px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:650;color:var(--teal);display:flex;justify-content:space-between;gap:16px}.method-name{font-size:13px;color:var(--muted);margin:27px 0 10px}h1{font-family:Georgia,"Songti SC","SimSun",serif;font-weight:500;font-size:clamp(38px,6.5vw,64px);line-height:1.16;letter-spacing:-.045em;margin:0 0 22px}h2{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(24px,3.5vw,32px);font-weight:500;line-height:1.4;margin:16px 0}.lead{font-size:17px;line-height:1.9;max-width:680px;color:#566e68;margin:0}p{margin:12px 0}button,input,select{font:inherit;min-height:44px;min-width:44px}button{border:1px solid var(--line);border-radius:7px;background:#fcfcf7;color:var(--ink);padding:8px 14px;cursor:pointer;white-space:nowrap}button:hover{background:#e8eee6;border-color:#9cb7ac}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,svg:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}select{max-width:100%;background:#fcfcf7;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 10px}input[type=range]{min-width:0;width:100%;margin:0;accent-color:var(--teal);cursor:ew-resize}input[type=checkbox]{accent-color:var(--teal);width:44px;margin:0;justify-self:end}.experiment{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,#fafaf4,#ecefe6);overflow:hidden}.figure-heading{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:19px 24px 0;color:var(--muted);font-size:12px}.live-tag{font-size:11px;white-space:nowrap;background:#e5ede2;color:#477163;border-radius:20px;padding:3px 10px}svg{display:block;width:100%;height:auto;font-family:"Segoe UI","Microsoft YaHei",sans-serif;touch-action:none;user-select:none;overflow:hidden}#scene{max-height:450px;margin:4px auto 0;cursor:ew-resize}#detail{cursor:ew-resize}svg text{font-variant-numeric:tabular-nums}svg .hit{cursor:pointer}.gesture{font-size:12px;color:var(--muted);margin:0;padding:4px 24px 18px}#readout{border-top:1px solid var(--line);padding:18px 24px 16px;background:#ffffff70}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.metrics>div>span{display:block;font-size:12px;color:var(--muted)}.metrics output{display:block;font:500 28px/1.6 Georgia,"Segoe UI",serif;color:var(--ink);font-variant-numeric:tabular-nums}.metrics output small{font:12px "Segoe UI",sans-serif;margin-left:6px;color:var(--muted)}#reading{font-size:13px;color:#526e66;margin:10px 0 0;min-height:22px}.controls{padding:20px 4px 28px}.transport{display:grid;grid-template-columns:auto 44px minmax(44px,1fr) 44px auto;gap:8px;align-items:center}#play{background:var(--teal);color:#fff;border-color:var(--teal);min-width:72px}.transport #back,.transport #next{padding:0;font-size:20px}.position-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:16px;margin:5px 0 18px}output{font-variant-numeric:tabular-nums}.parameters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 28px}.parameter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;font-size:13px;gap:2px 10px}.parameter input[type=range],.parameter select{grid-column:1/-1}.parameter output{color:var(--teal)}.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.presets button{font-size:12px;background:transparent;padding:7px 12px}.linked{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px;border-top:1px solid var(--line);padding:38px 0}.essay p{font-size:14px}.formula{white-space:pre-line;background:#e6ece2;border-left:3px solid var(--teal);padding:16px;margin:20px 0;font:17px/1.7 Georgia,"Segoe UI",serif;overflow-wrap:anywhere}.small{font-size:12px!important;color:var(--muted);line-height:1.8}.detail-figure{align-self:center;min-width:0}.detail-figure>p{padding:0 12px}.walkthrough{border-top:1px solid var(--line);padding-top:24px}.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 32px}.chapters button{display:flex;flex-direction:column;gap:10px;padding:20px;text-align:left;white-space:normal;background:#fafbf5;line-height:1.7}.chapter-number{color:var(--gold);font:22px Georgia,serif}.chapters strong{font-weight:600;font-size:15px}.chapters button>span:not(.chapter-number){font-size:12px;color:var(--muted)}.chapters em{font-size:11px;color:var(--teal);font-style:normal;margin-top:auto}footer{border-top:1px solid var(--line);font-size:13px;padding-top:14px}footer>p{max-width:760px}details{margin-top:22px;color:var(--muted);font-size:12px}summary{cursor:pointer;min-height:44px;padding:8px 0}details p{margin-top:0}@media(max-width:760px){main{padding:30px 24px 22px}.linked{grid-template-columns:1fr;gap:12px}.detail-figure{max-width:660px;width:100%}.chapters{gap:8px}.chapters button{padding:14px}h1{font-size:46px}}@media(max-width:440px){main{padding:24px 14px 18px}h1{font-size:38px}.lead{font-size:15px}.figure-heading{padding:15px 12px 0;font-size:11px}.live-tag{display:none}.gesture{padding:3px 12px 13px;font-size:11px}#readout{padding:13px 12px}.metrics{gap:8px}.metrics output{font-size:23px}.metrics>div>span{font-size:11px}.metrics output small{display:block;margin:0;font-size:10px}.transport{grid-template-columns:auto 44px minmax(44px,1fr) 44px;gap:5px}#reset{grid-column:4;grid-row:2}.position-row{margin-top:-44px;margin-right:56px;min-height:44px;align-items:center;font-size:11px}.parameters{grid-template-columns:1fr}.chapters{grid-template-columns:1fr}.chapters button{padding:16px;display:grid;grid-template-columns:25px 1fr;gap:5px 12px}.chapter-number{grid-row:1/4}.chapters em,.chapters button>span:not(.chapter-number){grid-column:2}.linked{padding:28px 0}.controls{padding-left:0;padding-right:0}}


[hidden]{display:none!important}.pending{color:#94531e}.handoff{margin:12px 0;color:var(--muted)}
</style></head><body><main>
<header><p class="eyebrow">固定条件，只改变一个因素</p><h1>快一倍，会远一倍吗？</h1><p class="lead">两辆小车共用同一只时钟。先改变 B 的速度，再应用到图中，看看同一时间走了多远。</p></header>
<section class="experiment"><div class="figure-heading">同一起点，同一时刻，同一尺度</div><svg id="scene" viewBox="0 0 720 380" role="img" tabindex="0" aria-label="两条跑道；拖动或左右键改变共同时间"></svg><div id="result" data-teaching-region="result"><div id="readout"><div class="metrics" id="metrics"></div><p id="reading"></p></div></div></section>
<section class="controls"><label class="parameter" for="speed">B 的输入速度 / 米每秒 <output id="speed-value"></output><input id="speed" type="range" min="0" max="3" step="0.1" data-presentation-parameter="input_speed"></label>
<div class="transport"><button id="apply" data-presentation-action="apply">应用速度</button><button id="reset" data-presentation-action="reset">重置</button></div><p id="phase" role="status"></p>
<label for="time">共同时间 / 秒 <output id="time-value"></output></label><input id="time" type="range" min="0" max="10" step="0.1" data-presentation-parameter="time_s"><p class="handoff">你可以直接改速度、应用、拖动时间，或带着当前画面提问。</p></section>
<section class="linked"><div class="essay"><h2>距离如何随时间变化</h2><button id="show-relation">显示距离关系</button><p id="relation" data-teaching-region="relation" hidden>匀速运动中，距离 = 速度 × 时间。保持同一正时间，速度翻倍，距离也翻倍。</p><button id="show-annotation">显示共同条件</button><p id="annotation" data-teaching-region="annotation" hidden>两车从同一起点出发，共用同一时钟和固定的距离尺度；A 的速度始终为 1 米/秒。</p></div><div class="detail-figure"><svg id="detail" viewBox="0 0 640 300" role="img" tabindex="0" aria-label="距离曲线；拖动或左右键改变共同时间"></svg><p id="detail-reading"></p></div></section>
<footer><details><summary>模型与适用范围</summary><p>构造的匀速运动。A 固定 1 米/秒，B 为 0–3 米/秒，无加速、摩擦或碰撞，观察 0–10 秒。</p></details></footer>
</main><script>
// Author adaptation seam: change the topic's pure derive/draw functions and
// content. This clock, native controls and Reader bridge stay shared.
const $ = id => document.getElementById(id);
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
const mix = (a,b,u) => a+(b-a)*u;
const fmt = (x,d=3) => Number(x.toFixed(d)).toString();
const C = {ink:'#233e40',muted:'#768683',teal:'#18857e',gold:'#c38a35',coral:'#cf6851',blue:'#5b83ae',line:'#d4ded7',paper:'#f5f4ed'};
const line=(x1,y1,x2,y2,color=C.line,width=1,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`;
const rect=(x,y,w,h,fill,extra='')=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" fill="${fill}" ${extra}/>`;
const circle=(x,y,r,fill,extra='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
const text=(x,y,value,color=C.muted,size=20,extra='')=>`<text x="${x}" y="${y}" fill="${color}" font-size="${size}" ${extra}>${value}</text>`;
const path=(d,color=C.teal,width=3,extra='')=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const points=pts=>pts.map(p=>p.join(',')).join(' ');
const plot=pts=>pts.map((p,i)=>(i?'L':'M')+p.join(',')).join(' ');
const label=(x,y,v,c=C.ink)=>text(x,y,v,c,22,'text-anchor="middle"');


function cart(x,y,c){return `<g transform="translate(${x},${y})">${rect(-22,-27,44,22,c,'rx="6"')}${rect(-11,-39,22,14,c,'rx="4"')}${circle(-13,-3,6,C.ink)}${circle(13,-3,6,C.ink)}</g>`;}

const drawing={drawMain(m){const X=d=>80+18*d;let h=label(360,42,'共同时间  '+fmt(m.t,2)+' s',C.ink);[155,280].forEach((y,i)=>{h+=rect(65,y-53,590,58,'#e3e9df','rx="9"')+line(65,y+8,655,y+8,C.line,2);for(let d=0;d<=30;d+=5)h+=line(X(d),y+8,X(d),y+17,C.muted)+label(X(d),y+42,d,C.muted);h+=text(25,y-14,i?'B':'A',i?C.gold:C.teal,26);});h+=line(X(0),74,X(0),324,C.muted,1,'stroke-dasharray="4 5"')+rect(X(0),136,m.a*18,5,C.teal,'rx="2"')+rect(X(0),261,m.b*18,5,C.gold,'rx="2"');h+=cart(X(m.a),151,C.teal)+cart(X(m.b),276,C.gold);h+=circle(X(m.a),151,0,C.teal,'id="runner-a"')+circle(X(m.b),276,0,C.gold,'id="runner-b"');h+=label(360,365,'距离 / m · 两条跑道使用同一比例',C.muted);return h;},
drawDetail(m){const X=t=>58+t*51,Y=d=>250-d*7;let h='';for(let d=0;d<=30;d+=10)h+=line(58,Y(d),568,Y(d),C.line)+text(15,Y(d)+7,d,C.muted,18);for(let t=0;t<=10;t+=2)h+=label(X(t),280,t,C.muted);h+=path(plot([[X(0),Y(0)],[X(10),Y(10)]]),C.teal,3)+path(plot([[X(0),Y(0)],[X(10),Y(10*m.speed)]]),C.gold,3);h+=line(X(m.t),30,X(m.t),250,C.coral,1,'stroke-dasharray="5 5"')+line(X(m.t),Y(m.a),X(m.t),Y(m.b),C.coral,4)+circle(X(m.t),Y(m.a),6,C.teal,'id="distance-a"')+circle(X(m.t),Y(m.b),6,C.gold,'id="distance-b"');h+=text(58,22,'距离 / m',C.muted,18)+text(582,280,'s',C.muted,18);return h;}};
const defaults={input_speed:1,applied_speed:1,time_s:10,revealed:false,annotated:false};
const state={...defaults,...window.presentation?.initialState};
const model=()=>({t:state.time_s,a:state.time_s,b:state.applied_speed*state.time_s,gap:(state.applied_speed-1)*state.time_s,speed:state.applied_speed});
function render(){const m=model();$('scene').innerHTML=drawing.drawMain(m);$('detail').innerHTML=drawing.drawDetail(m);
 $('metrics').innerHTML=[['A 已走',m.a],['B 已走',m.b],['B − A',m.gap]].map(([k,v])=>`<div><span>${k}</span><output>${fmt(v)}<small>米</small></output></div>`).join('');
 $('reading').textContent=`共同 ${fmt(m.t)} 秒；A 走 ${fmt(m.a)} 米，B 走 ${fmt(m.b)} 米。图中 B 的速度为 ${fmt(m.speed)} 米/秒。`;
 $('detail-reading').textContent=m.t===0?'出发时距离都是零，距离比尚未定义。':`当前距离比 B / A = ${fmt(m.speed)}。`;
 $('speed').value=state.input_speed;$('speed-value').textContent=fmt(state.input_speed);$('time').value=state.time_s;$('time-value').textContent=fmt(state.time_s);
 const pending=state.input_speed!==state.applied_speed;$('phase').textContent=pending?`输入为 ${fmt(state.input_speed)} 米/秒，等待应用；图仍按 ${fmt(state.applied_speed)} 米/秒显示。`:'输入已应用，可继续改变条件。';$('phase').className=pending?'pending':'';
 $('relation').hidden=!state.revealed;$('annotation').hidden=!state.annotated;
}
function set(values){Object.assign(state,values);render();}
function apply(){set({applied_speed:state.input_speed});}
function reset(){set({...defaults});}
function reveal(id){set(id==='relation'?{revealed:true}:{annotated:true});$(id).scrollIntoView({block:'center',behavior:'instant'});}
const commit=()=>window.presentation?.commitState();
$('speed').oninput=e=>set({input_speed:Number(e.target.value)});$('speed').onchange=commit;
$('time').oninput=e=>set({time_s:Number(e.target.value)});$('time').onchange=commit;
$('apply').onclick=()=>{apply();commit();};$('reset').onclick=()=>{reset();commit();};
// Match this move id to the TeachingMove that delivers the adapted page.
for(const [button,region] of [['show-relation','relation'],['show-annotation','annotation']])$(button).onclick=async()=>{reveal(region);commit();try{await window.presentation?.reportTeachingHelp('compare-speed','explanation',region);}catch{$('phase').textContent='内容已显示；帮助记录未确认，请稍后再试。';}};
for(const [id,start,scale] of [['scene',80,54],['detail',58,51]]){const node=$(id);let down=false;const seek=e=>{const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(node.getScreenCTM().inverse());set({time_s:clamp((p.x-start)/scale,0,10)});};node.onpointerdown=e=>{if(e.button!==0)return;down=true;node.setPointerCapture(e.pointerId);seek(e);};node.onpointermove=e=>{if(down)seek(e);};node.onpointerup=node.onpointercancel=()=>{if(down){down=false;commit();}};node.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();set({time_s:e.key==='Home'?0:e.key==='End'?10:clamp(state.time_s+(e.key==='ArrowRight'?.5:-.5),0,10)});commit();};}
window.presentation?.registerStateReader(()=>({values:{...state},visible_step:state.input_speed===state.applied_speed?'applied':'awaiting_apply',observation:{summary:$('phase').textContent+' '+$('reading').textContent,state:{speed_b_m_s:state.input_speed,time_s:state.time_s,phase:state.input_speed===state.applied_speed?'ready':'awaiting_apply'},rendered:{speed_b_m_s:state.applied_speed,time_s:state.time_s,distance_a_m:state.time_s,distance_b_m:state.applied_speed*state.time_s}}}));
window.presentation?.registerStateRestorer(saved=>set(saved.values.page));
window.presentation?.registerActionHandler(async(action,{signal})=>{signal.throwIfAborted();if(action.kind==='set_parameters')set(action.values);else if(action.kind==='invoke'){if(action.action_id==='apply')apply();else if(action.action_id==='reset')reset();}else if(['reveal','annotate'].includes(action.kind))reveal(action.region_id);});
render();
</script></body></html>
