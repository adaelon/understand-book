<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><style>{{style}}</style></head><body><main>
<header><div class="eyebrow">SPATIAL STUDY / {{number}}</div><h1>{{title}}</h1><p>{{intro}}</p></header>
<div id="experiment"><figure class="stage"><div class="figure-head"><h2>{{sceneTitle}}</h2><span>DRAG TO EXPLORE</span></div><canvas id="spatial" tabindex="0" aria-label="三维模型，拖动或使用方向键改变观察角度"></canvas><p id="fallback" hidden>当前环境无法显示三维模型。下方图解和参数仍可操作。</p><p class="stage-note">拖动旋转 · 方向键微调 · 拆开看结构</p><div class="view-tools"><button id="front">正视</button><button id="view-reset">恢复视角</button><label for="explode">拆解 <input id="explode" type="range" min="0" max="1" step="0.01" value="0"><output id="explode-value">0%</output></label></div></figure>
<section class="controls" aria-label="实验控制"><div class="timeline"><button id="play" aria-pressed="false">播放</button><button id="reset">回到起点</button><input id="position" aria-label="周期位置" type="range" min="0" max="4" step="0.001" value="0"><label for="position">沿过程观察<output id="position-value"></output></label></div><div class="parameters">{{controls}}</div></section>
<div class="legend">{{legend}}</div><div class="diagrams"><figure><h2><span class="index">01</span>{{diagramTitle}}</h2><canvas id="diagram" tabindex="0" aria-label="{{diagramTitle}}"></canvas><p>{{diagramCaption}}</p></figure><figure><h2><span class="index">02</span>{{detailTitle}}</h2><canvas id="detail" aria-label="{{detailTitle}}"></canvas><p>{{detailCaption}}</p></figure></div><section id="readout" class="readout" aria-live="off"></section></div>
<section class="explanation"><h2>{{question}}</h2><p>{{answer}}</p><div class="formula">{{formula}}</div><p>{{takeaway}}</p></section><p class="assumption">{{assumptions}}</p>
</main><script data-presentation-library="three" src="{{library}}"></script><script>{{script}}</script></body></html>
