<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>解释语法 · 模板库</title><style>
*{box-sizing:border-box}body{margin:0;color:#193538;background:#f4f3ee;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}header,main,footer{max-width:1460px;margin:auto;padding:28px 40px}header{padding-top:48px;border-bottom:1px solid #c8d4cd}.eyebrow{font-size:12px;color:#087d77;letter-spacing:.18em;font-weight:750}h1{font-size:clamp(36px,5vw,64px);letter-spacing:-.05em;line-height:1.15;margin:16px 0}header p{max-width:760px;color:#526669}.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:24px}.meta span{padding:5px 12px;border:1px solid #c8d4cd;border-radius:30px}main{display:grid;grid-template-columns:360px minmax(0,1fr);gap:32px;align-items:start}nav{display:grid;gap:8px}.method{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;padding:15px;background:transparent;border:1px solid transparent;border-radius:12px;cursor:pointer}.method[aria-pressed=true]{background:#e0ece4;border-color:#9cbeb1}.method:hover{border-color:#9cbeb1}.method b{font-size:16px}.method small{display:block;font-size:13px;color:#526669;margin-top:5px}.number{font-size:12px;color:#087d77;padding-top:4px}.arrow{margin-left:auto;color:#087d77}.preview{min-width:0;background:#fff;border:1px solid #c8d4cd;border-radius:20px;overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid #c8d4cd}.toolbar h2{font-size:17px;margin:0}a{color:#087d77;text-underline-offset:4px}.links{display:flex;gap:16px;font-size:14px}iframe{display:block;width:100%;height:760px;border:0;background:#f4f3ee}.boundary{margin:0;padding:14px 20px;font-size:13px;color:#526669;border-top:1px solid #c8d4cd}button:focus-visible,a:focus-visible{outline:3px solid #d6883f;outline-offset:3px}footer{font-size:13px;color:#526669;border-top:1px solid #c8d4cd}@media(max-width:1000px){main{grid-template-columns:290px minmax(0,1fr);gap:16px}header,main,footer{padding-left:22px;padding-right:22px}}@media(max-width:720px){main{display:block}nav{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:20px;gap:5px}.method{padding:10px;gap:7px}.method small{display:none}.method b{font-size:14px}.arrow{display:none}header{padding-top:28px}iframe{height:760px}}@media(max-width:380px){header,main,footer{padding-left:12px;padding-right:12px}.number{display:none}}
.choices{padding:10px 20px;background:#edf2eb}.choices[hidden]{display:none}#scene-appearance{margin:6px 0 0;font-size:14px;color:#405b59}.choices select{max-width:100%;min-height:44px;padding:4px 6px;font:inherit}#boundary{display:block;color:#536967;font-size:13px;max-width:68ch}#demo{width:100%;min-height:560px}.method:focus-visible,a:focus-visible{outline:3px solid #0e8375;outline-offset:2px}@media(max-width:640px){#demo{min-height:460px}.choices{padding:8px}.choices label{display:block}}</style></head><body><header><div class="eyebrow">UNDERSTAND BOOK / EXPLANATION METHODS</div><h1>让关系<br>变得可观察。</h1><p>先选读者卡住的关系，再选能把它讲清的场景。打开作品亲手试，或带着源码改写。</p><div class="meta"><span id="count"></span><span>按理解障碍选用</span><span>离线可用 · 可改写</span></div></header><main><nav id="methods" aria-label="选择解释方法"></nav><section class="preview" aria-label="作品与来源"><div class="toolbar"><div><h2 id="preview-title"></h2><span id="boundary"></span></div><div class="links"><a id="open" target="_blank" rel="noopener">单独打开 ↗</a><a id="card">方法卡</a><a id="guide">改写说明</a></div></div><div id="choices" class="choices" hidden><label for="scene">观察场景</label> <select id="scene"></select><p id="scene-appearance"></p></div><iframe id="demo" title="可操作示范"></iframe></section></main><footer>讲解所用的公式、对象和证据都应随新题核实。作品可以借鉴，结论需要依据。</footer>
<script id="directory" type="application/json">[{"id":"discrete-update","revision":3,"name":"追踪一次离散更新","obstacle":"混淆当前状态、更新量、下一状态或动画中间帧","boundary":"明确定义的离散更新；静态定义优先文本，连续物理过程使用自身时间模型","path":"discrete-update/v3","entrypoint":"example/index.html"},{"id":"object-transform","revision":2,"name":"保持身份的对象变换","obstacle":"读者能看见前后两张图，但无法对应同一对象或说明不变量","boundary":"同一对象有明确映射和对应点；不同量纲或无对应关系的对象不作形变","path":"object-transform/v2","entrypoint":"example/index.html"},{"id":"compare-one-factor","revision":3,"name":"固定条件，只改变一个因素","obstacle":"同页对照中的待应用输入、教师演示与学习者接手","boundary":"有共同起点、时间和单位的明确模型；观察性数据不能直接解释为因果","path":"compare-one-factor/v3","entrypoint":"example/index.html"},{"id":"compare-one-factor","revision":2,"name":"固定条件，只改变一个因素","obstacle":"读者把初始条件、时间和参数变化混在一起，无法解释结果差异","boundary":"有共同起点、时间和单位的明确模型；观察性数据不能直接解释为因果","path":"compare-one-factor/v2","entrypoint":"example/index.html"},{"id":"part-whole","revision":2,"name":"整体与部分保持对应","obstacle":"拆开以后丢失整体，或把面积、长度和占比混为一谈","boundary":"互不重叠且穷尽整体的非负部分；重叠集合和有负贡献的数据须另建表示","path":"part-whole/v2","entrypoint":"example/index.html"},{"id":"process-reveal","revision":2,"name":"沿关系逐步展开过程","obstacle":"读者只记住步骤名字，无法追踪每一步如何改变同一批输入","boundary":"有明确输入、变换和依赖的有限流程；并行与循环需明确表示，不能画成错误线性顺序","path":"process-reveal/v2","entrypoint":"example/index.html"},{"id":"evidence-chain","revision":2,"name":"从证据走到有边界的结论","obstacle":"读者看到结论，却分不清原始记录、计算、前提和可推断范围","boundary":"每条关键主张有可展示依据；构造材料必须标明，统计描述不能自行升级为因果或总体结论","path":"evidence-chain/v2","entrypoint":"example/index.html"},{"id":"chart-reveal","revision":2,"name":"先建立尺度，再揭示数据","obstacle":"动画先吸引注意，读者却找不到单位、基线或数值差异","boundary":"准确数据、统一单位和明确基线；负起点不用增长倍数，示意数据不得冒充观测","path":"chart-reveal/v2","entrypoint":"example/index.html"},{"id":"scale-zoom","revision":2,"name":"保留定位的尺度缩放","obstacle":"读者看到放大细节，却丢失真实大小、单位和在整体中的位置","boundary":"可建立尺度与位置关系的对象；概念层级或示意大小不可伪装成物理比例","path":"scale-zoom/v2","entrypoint":"example/index.html"},{"id":"spatial-linked-views","revision":1,"name":"三维结构与图解共用一个模型","obstacle":"读者无法把空间结构、运动、公式和图表对应，参数变化后各表示容易脱节","boundary":"有明确空间关系和可验证模型；相机只改变观察方式，三维不替代模型准确性","path":"spatial-linked-views/v1","entrypoint":"example/index.html"},{"id":"compare-rules","revision":1,"name":"固定对象，换规则比较结果","obstacle":"同一批对象换度量、计费或移动规则后读数、到达顺序或排名为什么改变","boundary":"可明确计算和解释的规则；严密证明保留前提和推导，不用演示替代证明","path":"compare-rules/v1","entrypoint":"example/index.html","scenes":[{"file":"example/index.html","metadata":"example/author.json","when":"关心等值边界或几何位置；在工程蓝图中固定两点，换尺看点在哪条边界上","appearance":"整块工程图纸作为绘图区，深蓝图底与细网格承托亮色等距线，基准点和量尺标注固定在纸面。"},{"file":"routes/index.html","metadata":"routes/author.json","when":"关心过程、谁先到或想亲手走；像素街区里两人消耗相同步数，路程短的先停","appearance":"低分辨率街区占据主画面，街口、像素人物与走过的路一起记录步数，人物停在真实格点。"},{"file":"prints/index.html","metadata":"prints/author.json","when":"只比较读数或排序；用两色印痕在同一标尺上对齐起点、揭示终点","appearance":"孔版印刷的粗标题、双色网点和套印痕迹构成一张印样。两个印迹由同一条印刷刻度读数。"}]},{"id":"inspect-space","revision":1,"name":"拆开或剖切，辨认被遮挡的关系","obstacle":"从外观看不见内部部件顺序、连接或截口，平面列表无法说明空间关系","boundary":"已有结构依据或明确的教学几何；视角与模型分离，不将示意件当作工程实物或仿真","path":"inspect-space/v1","entrypoint":"example/index.html","scenes":[{"file":"example/index.html","metadata":"example/author.json","when":"想看实物如何装配；沿装配轴分开真实部件，旋转后仍能对应各自安装位置","appearance":"产品拆解摄影棚里的大幅立体装配体。材质、轮廓和开孔区分部件，拉开后用随视角定位的引线认件。"},{"file":"sections/index.html","metadata":"sections/author.json","when":"想看隐藏截面随位置如何改变；移动真实剖面，用点云和截线保留整体参照","appearance":"深色扫描空间中保留疏密有别的表面点，半透明水平面和一条亮截线标出当前切口。"}]}]</script><script>
(() => {
  const $ = id => document.getElementById(id);
  const methods = JSON.parse($('directory').textContent);
  $('count').textContent = new Set(methods.map(m => m.id)).size + ' 种解释关系 · ' + methods.length + ' 个版本';
  function render() {
    const [id, revision, sceneName] = location.hash.slice(1).split('/');
    const method = methods.find(m => m.id === id && String(m.revision) === revision) || methods[0];
    const scenes = method.scenes || [];
    const scene = scenes.find(s => s.file.split('/')[0] === sceneName) || scenes[0];
    $('preview-title').textContent = method.name;
    $('boundary').textContent = method.boundary;
    document.querySelectorAll('[data-index]').forEach(b => b.setAttribute('aria-pressed', String(methods[b.dataset.index] === method)));
    $('scene').replaceChildren(...scenes.map(s => new Option(s.when, s.file.split('/')[0])));
    if (scene) $('scene').value = scene.file.split('/')[0];
    $('choices').hidden = !scenes.length;
    $('scene-appearance').textContent = scene?.appearance || '';
    $('scene').onchange = () => { location.hash = [method.id, method.revision, $('scene').value].join('/') };
    let file = scene?.file || method.entrypoint;
    if (method.id === 'spatial-linked-views') file = 'preview.html';
    if (method.id === 'inspect-space') file = 'preview.html?scene=' + (file.startsWith('sections/') ? 'section' : 'assembly');
    $('open').href = $('demo').src = method.path + '/' + file;
    $('card').href = method.path + '/card.md';
    $('guide').href = method.path + '/example/README.md';
  }
  methods.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'method';
    b.dataset.index = i;
    b.setAttribute('aria-label', m.name + ' · v' + m.revision);
    const n = document.createElement('span'), body = document.createElement('span');
    const title = document.createElement('b'), caption = document.createElement('small');
    n.className = 'number';
    n.textContent = String(i + 1).padStart(2, '0');
    title.textContent = m.name + ' · v' + m.revision;
    caption.textContent = m.obstacle;
    body.append(title, caption);
    b.append(n, body);
    b.onclick = () => { location.hash = m.id + '/' + m.revision };
    $('methods').append(b);
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script></body></html>
