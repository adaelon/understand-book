<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>解释语法 · 模板库</title><style>
*{box-sizing:border-box}body{margin:0;color:#193538;background:#f4f3ee;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}header,main,footer{max-width:1460px;margin:auto;padding:28px 40px}header{padding-top:48px;border-bottom:1px solid #c8d4cd}.eyebrow{font-size:12px;color:#087d77;letter-spacing:.18em;font-weight:750}h1{font-size:clamp(36px,5vw,64px);letter-spacing:-.05em;line-height:1.15;margin:16px 0}header p{max-width:760px;color:#526669}.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:24px}.meta span{padding:5px 12px;border:1px solid #c8d4cd;border-radius:30px}main{display:grid;grid-template-columns:360px minmax(0,1fr);gap:32px;align-items:start}nav{display:grid;gap:8px}.method{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;padding:15px;background:transparent;border:1px solid transparent;border-radius:12px;cursor:pointer}.method[aria-pressed=true]{background:#e0ece4;border-color:#9cbeb1}.method:hover{border-color:#9cbeb1}.method b{font-size:16px}.method small{display:block;font-size:13px;color:#526669;margin-top:5px}.number{font-size:12px;color:#087d77;padding-top:4px}.arrow{margin-left:auto;color:#087d77}.preview{min-width:0;background:#fff;border:1px solid #c8d4cd;border-radius:20px;overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid #c8d4cd}.toolbar h2{font-size:17px;margin:0}a{color:#087d77;text-underline-offset:4px}.links{display:flex;gap:16px;font-size:14px}iframe{display:block;width:100%;height:760px;border:0;background:#f4f3ee}.boundary{margin:0;padding:14px 20px;font-size:13px;color:#526669;border-top:1px solid #c8d4cd}button:focus-visible,a:focus-visible{outline:3px solid #d6883f;outline-offset:3px}footer{font-size:13px;color:#526669;border-top:1px solid #c8d4cd}@media(max-width:1000px){main{grid-template-columns:290px minmax(0,1fr);gap:16px}header,main,footer{padding-left:22px;padding-right:22px}}@media(max-width:720px){main{display:block}nav{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:20px;gap:5px}.method{padding:10px;gap:7px}.method small{display:none}.method b{font-size:14px}.arrow{display:none}header{padding-top:28px}iframe{height:760px}}@media(max-width:380px){header,main,footer{padding-left:12px;padding-right:12px}.number{display:none}}
</style></head><body><header><div class="eyebrow">UNDERSTAND BOOK / EXPLANATION METHODS</div><h1>让关系<br>变得可观察。</h1><p>从读者卡住的地方开始。选择一个解释关系，操作示例，带着完整源码去讲清新的内容。</p><div class="meta"><span>09 种解释关系</span><span>8 个联动升级 + 三维模板</span><span>离线可用 · 可改写</span></div></header><main><nav aria-label="选择解释方法"><button class="method" data-index="0" aria-label="追踪一次离散更新" aria-pressed="true"><span class="number">01</span><span><b>离散更新</b><small>混淆当前状态、更新量、下一状态或动画中间帧</small></span><span class="arrow">↗</span></button><button class="method" data-index="1" aria-label="保持身份的对象变换" aria-pressed="false"><span class="number">02</span><span><b>对象变换</b><small>读者能看见前后两张图，但无法对应同一对象或说明不变量</small></span><span class="arrow">↗</span></button><button class="method" data-index="2" aria-label="固定条件，只改变一个因素" aria-pressed="false"><span class="number">03</span><span><b>单因素对照</b><small>读者把初始条件、时间和参数变化混在一起，无法解释结果差异</small></span><span class="arrow">↗</span></button><button class="method" data-index="3" aria-label="整体与部分保持对应" aria-pressed="false"><span class="number">04</span><span><b>整体与部分</b><small>拆开以后丢失整体，或把面积、长度和占比混为一谈</small></span><span class="arrow">↗</span></button><button class="method" data-index="4" aria-label="沿关系逐步展开过程" aria-pressed="false"><span class="number">05</span><span><b>过程展开</b><small>读者只记住步骤名字，无法追踪每一步如何改变同一批输入</small></span><span class="arrow">↗</span></button><button class="method" data-index="5" aria-label="从证据走到有边界的结论" aria-pressed="false"><span class="number">06</span><span><b>证据与结论</b><small>读者看到结论，却分不清原始记录、计算、前提和可推断范围</small></span><span class="arrow">↗</span></button><button class="method" data-index="6" aria-label="先建立尺度，再揭示数据" aria-pressed="false"><span class="number">07</span><span><b>数据图表</b><small>动画先吸引注意，读者却找不到单位、基线或数值差异</small></span><span class="arrow">↗</span></button><button class="method" data-index="7" aria-label="保留定位的尺度缩放" aria-pressed="false"><span class="number">08</span><span><b>尺度缩放</b><small>读者看到放大细节，却丢失真实大小、单位和在整体中的位置</small></span><span class="arrow">↗</span></button><button class="method" data-index="8" aria-label="三维结构与图解共用一个模型" aria-pressed="false"><span class="number">09</span><span><b>三维与图解联动</b><small>同一模型连接空间结构、运动和可读结果</small></span><span class="arrow">↗</span></button></nav><section class="preview"><div class="toolbar"><h2 id="preview-title"></h2><div class="links"><a id="open-example" target="_blank" rel="noopener">独立打开</a><a id="open-card">语法卡</a><a id="open-guide">适配说明</a></div></div><iframe id="demo" title="交互示例" src="discrete-update/v3/example/index.html"></iframe><p class="boundary" id="boundary"></p></section></main><footer>参考 <a href="https://github.com/alchaincyf/huashu-art-motion" target="_blank" rel="noopener">huashu-art-motion</a> 的表达机制，按交互阅读场景重写。<a href="SOURCES.md">来源与许可</a> · <a href="README.md">使用说明</a></footer><script>const methods=[{"name": "追踪一次离散更新", "path": "discrete-update/v3", "boundary": "明确定义的离散更新；静态定义优先文本，连续物理过程使用自身时间模型"}, {"name": "保持身份的对象变换", "path": "object-transform/v2", "boundary": "同一对象有明确映射和对应点；不同量纲或无对应关系的对象不作形变"}, {"name": "固定条件，只改变一个因素", "path": "compare-one-factor/v2", "boundary": "有共同起点、时间和单位的明确模型；观察性数据不能直接解释为因果"}, {"name": "整体与部分保持对应", "path": "part-whole/v2", "boundary": "互不重叠且穷尽整体的非负部分；重叠集合和有负贡献的数据须另建表示"}, {"name": "沿关系逐步展开过程", "path": "process-reveal/v2", "boundary": "有明确输入、变换和依赖的有限流程；并行与循环需明确表示，不能画成错误线性顺序"}, {"name": "从证据走到有边界的结论", "path": "evidence-chain/v2", "boundary": "每条关键主张有可展示依据；构造材料必须标明，统计描述不能自行升级为因果或总体结论"}, {"name": "先建立尺度，再揭示数据", "path": "chart-reveal/v2", "boundary": "准确数据、统一单位和明确基线；负起点不用增长倍数，示意数据不得冒充观测"}, {"name": "保留定位的尺度缩放", "path": "scale-zoom/v2", "boundary": "可建立尺度与位置关系的对象；概念层级或示意大小不可伪装成物理比例"}, {"name":"三维结构与图解共用一个模型","path":"spatial-linked-views/v1","preview":"preview.html","boundary":"有明确空间关系和可验证模型；包含齿轮与弹簧两个主题"}];function select(i){const m=methods[i];document.querySelectorAll('.method').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));document.getElementById('preview-title').textContent=m.name;document.getElementById('demo').src=m.path+'/'+(m.preview||'example/index.html');document.getElementById('demo').title=m.name+'交互示例';document.getElementById('open-example').href=m.path+'/'+(m.preview||'example/index.html');document.getElementById('open-card').href=m.path+'/card.md';document.getElementById('open-guide').href=m.path+'/example/README.md';document.getElementById('boundary').textContent='适用范围：'+m.boundary;}document.querySelectorAll('.method').forEach(b=>b.onclick=()=>select(Number(b.dataset.index)));select(0);</script></body></html>
