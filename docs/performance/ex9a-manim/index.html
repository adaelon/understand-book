<h1>同样的损失，不同的路</h1>
<p>三种学习率，同一标尺。看清每次更新怎样跨越最优点，以及误差怎样缩小或放大。</p>
<video id="film" controls playsinline preload="metadata" src="learning-rate-final.mp4"></video>
<nav id="chapters" aria-label="视频章节"><button data-time="0">从头播放</button><button id="toggle">暂停 / 继续</button></nav>
<small>字幕讲解，无音轨。播放器支持暂停与拖动定位。圆环标记真实迭代；移动中的实心点仅是视觉插值。</small>
<section id="comparison"><h2>浏览器交互版 · 同题对照</h2>
<p>浏览器版可以改 η、逐步前进或回退，并先预测再揭示；下方播放按钮控制浏览器动画。</p>

<script>
const film=document.querySelector('#film'), nav=document.querySelector('#chapters');
nav.addEventListener('click',e=>{if(e.target.dataset.time!==undefined){film.currentTime=Number(e.target.dataset.time);film.play();}});
document.querySelector('#toggle').addEventListener('click',()=>film.paused?film.play():film.pause());
fetch('scene-evidence.json').then(r=>r.json()).then(data=>{
  const events=data.events;
  const chapters=[['红色跨越',events.find(e=>e.k===0&&e.crossing_eta===1.1)?.time],
    ['橙色跨越',events.find(e=>e.k===0&&e.crossing_eta===0.8)?.time],
    ['第一步的真实结果',events.find(e=>e.k===1&&e.endpoint)?.time],
    ['第五步的真实结果',events.find(e=>e.k===5&&e.endpoint)?.time],['归纳规律',data.duration-5]];
  for(const [title,time] of chapters){if(time===undefined)continue;const b=document.createElement('button');b.textContent=title;b.dataset.time=String(time);nav.append(b);}
});
</script>
