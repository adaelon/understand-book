<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Understand Book · 登录</title><link rel="stylesheet" href="/auth.css"><script type="module" src="/auth.js"></script></head>
<body><main><p class="eyebrow">UNDERSTAND BOOK</p><h1>回到你的阅读</h1><p>使用已验证邮箱或现有账号登录。</p>
<form id="login"><label>邮箱或账号<input name="username" autocomplete="username" required maxlength="254"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button>登录</button></form>
<p>请在正式阅读站点使用<a href="/?account=register">注册账号</a>或<a href="/?account=forgot-password">找回密码</a>。</p><p id="notice" role="status" aria-live="polite"></p><section id="library" hidden><div class="account"><p id="identity"></p><button id="logout" type="button">退出登录</button></div><p>绑定邮箱请在正式阅读站点的“个人设置”中操作。</p><h2>你的书库</h2><ul id="books"></ul><p id="empty" hidden>暂时没有可阅读的材料，请联系管理员授权。</p></section></main></body></html>
