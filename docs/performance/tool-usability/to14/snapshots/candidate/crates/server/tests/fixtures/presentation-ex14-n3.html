<title>必要条件与充分条件</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; color: #203044; background: #f5f7fa; font: 16px/1.75 system-ui, sans-serif; }
main { max-width: 720px; margin: auto; }
h1 { font-size: 26px; line-height: 1.4; }

<body><main id="page">
<h1>必要条件与充分条件</h1>
<p>先确定推理的方向：A 成立能推出 B，不保证反向推理。</p>
<section id="definition"><h2>同一个关系，两种说法</h2>
<p class="relation">只要 A 就 B</p>
<p>A 是 B 的充分条件；B 是 A 的必要条件。</p>
<p>“充分”表示 A 足以保证 B；“必要”表示没有 B，就没有 A。</p></section>
<section id="example-one"><h2>例子一：整数整除</h2>
<p>A：整数能被 4 整除。B：它是偶数。</p>
<p>能被 4 整除足以保证是偶数。例如 8 同时满足 A 和 B。</p>
<p>反向不成立：6 是偶数，却不能被 4 整除。</p></section>
<section id="example-two"><h2>例子二：平面欧氏几何</h2>
<p>A：一个四边形是正方形。B：它是矩形。</p>
<p>正方形一定是矩形，因此成为矩形是成为正方形的必要条件。</p>
<p>反向不成立：长 3、宽 2 的矩形不是正方形。</p></section>
</main></body>
