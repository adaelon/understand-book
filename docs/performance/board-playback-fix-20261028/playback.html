<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下文状态 · 画板播放验收</title>
  <style>html,body,#app{height:100%;margin:0}body{overflow:hidden}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createApp, defineComponent, h, ref } from '/node_modules/.vite/deps/vue.js';
import BoardWorkspace from '/src/components/BoardWorkspace.vue';
import { boardFixture } from '/src/fixtures/board-workspace';
import '/src/style.css';

// Run inside the existing Vite server. All board data lives in this page;
// the production component and rendering paths are imported without replacements.
const storageKey = 'board-playback-fix-20261028:view';
const params = new URLSearchParams(location.search);
if (params.has('reset')) localStorage.removeItem(storageKey);
const seed = boardFixture();
const boardId = 'board-context-playback';
const stamp = '2026-10-28T08:00:00Z';
const itemTarget = item_id => ({ kind: 'item', item_id });
const blockRef = number => ({ item_id: 'context', block_id: `explain-${number}` });
const explanations = [
  '## 一、上下文状态在保存什么\n\n模型每生成一个 token，都要利用之前留下的状态。先分清两个问题：**总共占多少容量**，以及**每一步需要读取多少内容**。\n\n这两条线共同决定长上下文的成本。',
  '## 二、四类做法的区别\n\n**固定递推**不断改写固定大小的状态。**滑动窗口**只保留最近一段位置。**压缩**把多个位置合并为较少的条目。**全量 KV**保留每一个历史位置。\n\n沿着连线看：它们回答的是同一个问题，但改变的部分不同。',
  '## 三、固定状态怎样更新\n\n外积把当前 token 的键和值写成矩阵；递推把新信息合并到已有状态。\n\n$$S_t = S_{t-1} + k_t v_t^T$$\n\n状态的形状固定，内容随着输入不断改变。',
  '## 四、它们之间是什么关系\n\n**关系一：容量与读取是两条线，不能并成一个数。** 同一份状态，「总共占多大」和「每步读多少」是两个问题。一份表可以被压得很小，却仍要每步读一遍。\n\n**关系二：它们改变的是不同的东西。** 窗口改变读取范围，压缩改变条目数量，索引改变访问方式，递推改变状态本身。\n\n沿着状态更新到查询读取的连线，可以看到信息如何被保留和利用。',
  '## 五、把形状和长度分开\n\n固定状态中的两个维度表示键和值的特征空间，不表示 token 数量。\n\n**短上下文**主要看起始容量，**长上下文**还要看状态随长度增长的速度和每一步的读取量。\n\n现在所有节点和它们之间的关系都应保留在画板上。',
];
function drawing(id, title, text, x, y, width, height, color) {
  return {
    item_id: id, title, readable_content: text, explanation_blocks: [],
    position: { x, y }, size: { width, height }, created_at: stamp, source_bindings: [],
    target: { kind: 'drawing', graphic: { kind: 'shape', shape: 'rectangle', text, color },
      session_id: 'context-session', turn_id: 'context-turn', based_on: [] },
  };
}
const items = [
  drawing('context', '上下文状态', '上下文状态\n留下什么形状？\n下一步怎么读？', 0, 0, 185, 92, '#596779'),
  drawing('axes', '两条尺子', '两条尺子\n容量怎么长？每步读什么？\n不能统称为上下文长度', 260, 0, 270, 92, '#596779'),
  drawing('trunk', '贯穿主干的例子', '贯穿主干的例子\n固定递推 · 窗口 · 压缩 · 全量 KV\n用同一组问题进行比较', 610, 0, 370, 92, '#596779'),
  drawing('state', '固定递推', '固定递推\n一张 d_k × d_v 状态表\n每个 token 原地改写\n容量与 token 数无关', 0, 185, 215, 110, '#3c928b'),
  drawing('window', '滑动窗口', '滑动窗口\n只保留最近一段位置\n容量受窗口长度限制\n每步只读窗口范围', 255, 185, 215, 110, '#6478d8'),
  drawing('compress', '压缩', '压缩\n多位置 → 更少条目\n保留重要信息\n压缩率影响容量', 510, 185, 215, 110, '#a477df'),
  drawing('kv', '全量 KV', '全量 KV\n容量随上下文增长\n每步读取所有条目\n全量 ≠ 每步读全部之外的定义', 765, 185, 215, 110, '#c17945'),
  drawing('outer', '外积落格', '① 外积落格\n键维 i 乘以值维 j\n填进第 (i,j) 格\n共 d_k × d_v 格', 0, 385, 240, 115, '#3c928b'),
  drawing('update', '状态更新', '② 状态更新\n读旧表 → 写入新信息 → 写回\nS_t = S_(t-1) + k_t v_t^T\n写的是信息，不追加 token 行', 320, 385, 300, 115, '#3c928b'),
  drawing('read', '查询读取', '③ 查询读取\nq 的每个分量 × 第 i 行\n再沿键维汇总\no_t = q_t^T S_t', 700, 385, 280, 115, '#3c928b'),
  drawing('meaning', '为什么这两个维度不随上下文增长', '为什么这两个维度不随上下文增长？\ni、j 对应键和值的特征维度；不是 token 的位置\n同一张固定形状的表，内容随着输入改变', 180, 590, 620, 100, '#596779'),
];
items[0].explanation_blocks = explanations.map((markdown, index) => ({ block_id: `explain-${index + 1}`, markdown, answer_parts: [] }));
items[0].readable_content = explanations.join('\n\n');
const edges = [
  ['context-axes', 'context', 'axes', '分开衡量'],
  ['axes-trunk', 'axes', 'trunk', '统一比较'],
  ['axes-state', 'axes', 'state', '固定形状'],
  ['axes-window', 'axes', 'window', '限定范围'],
  ['axes-compress', 'axes', 'compress', '减少条目'],
  ['trunk-kv', 'trunk', 'kv', '保留位置'],
  ['state-outer', 'state', 'outer', '展开来看'],
  ['outer-update', 'outer', 'update', '写入状态'],
  ['update-read', 'update', 'read', '按查询读取'],
  ['read-meaning', 'read', 'meaning', '维度的含义'],
];
const links = edges.map(([link_id, from, to, label]) => ({ link_id, from: itemTarget(from), to: itemTarget(to), label, based_on: [] }));
const groups = [['context', 'axes', 'trunk'], ['state', 'window', 'compress', 'kv'], ['outer', 'update'], ['read'], ['meaning']];
const route = {
  route_id: 'node-only', title: '从四类做法到固定状态三步',
  steps: groups.map((ids, index) => ({
    step_id: `step-${index + 1}`, explanation: blockRef(index + 1),
    reveal_targets: ids.map(itemTarget), focus_targets: ids.map(itemTarget),
    transition: 'draw', duration_ms: 2600,
  })),
};
const explicitRoute = structuredClone(route);
explicitRoute.route_id = 'explicit-link';
explicitRoute.title = '连线时序：第 3 步出现「分开衡量」';
explicitRoute.steps[2].reveal_targets.push({ kind: 'link', link_id: 'context-axes' });
seed.document = {
  ...seed.document, board_id: boardId, title: '上下文状态', items, links,
  book_id: 'context-state-fixture', created_at: stamp, updated_at: stamp,
  routes: [route, explicitRoute],
  mappings: groups.flatMap((ids, index) => ids.map(item_id => ({
    mapping_id: `map-${item_id}`, explanation: blockRef(index + 1), visual: itemTarget(item_id),
  }))),
};
seed.view = {
  ...seed.view, x: 55, y: 35, zoom: .7, selected_item_id: null,
  reading_item_id: 'context', selected_block_id: 'explain-4',
  playback: { route_id: 'node-only', step_id: 'step-1', show_all: true, following: false },
};
const savedView = localStorage.getItem(storageKey);
if (savedView) seed.view = JSON.parse(savedView);
const realFetch = window.fetch.bind(window);
const respond = (value, status = 200) => Promise.resolve(new Response(JSON.stringify(value), {
  status, headers: { 'Content-Type': 'application/json' },
}));
const summary = document => ({ ...document, item_count: document.items.length });
window.fetch = async (input, init) => {
  const url = new URL(typeof input === 'string' ? input : input instanceof URL ? input.href : input.url, location.href);
  const marker = url.pathname.indexOf('/boards/');
  if (marker < 0) return realFetch(input, init);
  const command = url.pathname.slice(marker);
  const body = JSON.parse(init?.body || '{}');
  if (command === '/boards/read') return respond(seed);
  if (command === '/boards/list') return respond({ items: [summary(seed.document)] });
  if (command === '/boards/conversation') return respond({ board_id: boardId, sessions: [] });
  if (command === '/boards/view.save') {
    seed.view = structuredClone(body.view);
    localStorage.setItem(storageKey, JSON.stringify(seed.view));
    return respond({ saved: true });
  }
  // An unexpected board endpoint must remain local, never reach a running backend.
  return respond({ error_code: 'FIXTURE_ENDPOINT', category: 'validation', message: `本地播放夹具未定义 ${command}` }, 400);
};

createApp(defineComponent({ setup() {
  const opened = ref(true);
  return () => h('main', { style: 'height:100%;position:relative' }, [
    !opened.value ? h('div', { style: 'padding:40px;font:16px system-ui' }, [
      h('h1', '上下文状态 · 播放验收'),
      h('p', '这个页面使用真实知识画板组件和本地数据。刷新会恢复最近保存的视图。'),
      h('button', { onClick: () => { opened.value = true; } }, '返回画板'),
      h('p', [h('a', { href: `${location.pathname}?reset=1` }, '重置为初始全图')]),
    ]) : h(BoardWorkspace, {
      boardId, style: 'position:absolute;inset:0',
      onClose: () => { opened.value = false; },
    }),
  ]);
} })).mount('#app');
</script>
</body>
</html>
