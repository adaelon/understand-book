<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下文状态 · 画板</title>
  <style>
    html,body,#app{height:100%;margin:0}body{overflow:hidden}
    .example{height:100%;display:flex;flex-direction:column;background:#fbfaf7}
    .example-header{padding:22px 36px;border-bottom:1px solid #e6dfd8;background:#fffdf8;display:flex;justify-content:space-between;gap:18px;align-items:center;font-family:var(--sans)}
    .example-header small{color:#787b74;font-size:12px;letter-spacing:.08em}.example-header h1{margin:7px 0 0;font-size:27px;font-weight:550;color:#283b38}
    .example-header nav{display:flex;gap:8px;flex-wrap:wrap}.example-header button{padding:8px 13px;border:1px solid #d9e0d9;background:transparent;border-radius:7px;color:#446d60;font:13px var(--sans);cursor:pointer}
    .example>.board-canvas{flex:1}.example-header button:hover{background:#eaf1eb}
    @media(max-width:700px){.example-header{padding:16px 18px;align-items:flex-start}.example-header h1{font-size:21px}.example-header nav{max-width:140px;justify-content:flex-end}.example-header button{font-size:12px;padding:7px}}
  </style>
</head>
<body><div id="app"></div>
<script type="module">
import { createApp, defineComponent, h, nextTick, onMounted, ref } from '/node_modules/.vite/deps/vue.js';
import BoardCanvas from '/src/components/BoardCanvas.vue';
import { defaultBoardView } from '/src/board-workspace';
import '/src/style.css';

const stamp = '2026-10-28T08:00:00Z';
function item(id,title,text,x,y,width,height,color='#528c80',kind='shape') {
  return { item_id:id,title,readable_content:text,explanation_blocks:[],position:{x,y},size:{width,height},created_at:stamp,source_bindings:[],
    target:{kind:'drawing',graphic:kind==='text'?{kind,text}:{kind:'shape',shape:'rectangle',text,color},session_id:'example',turn_id:'example',based_on:[]} };
}
const items = [
  item('intro','两条观察线','容量随长度怎么变化？每一步需要读取什么？',0,0,1080,44,'','text'),
  item('state','固定递推','固定递推\n一张 d_k × d_v 状态表\n每个 token 原地改写',0,85,240,140,'#528c80'),
  item('window','滑动窗口','滑动窗口\n只保留最近一段位置\n读取范围由窗口决定',280,85,240,140,'#557da5'),
  item('compress','压缩','压缩\n多个位置 → 更少条目\n用较少条目保留信息',560,85,240,140,'#9275ad'),
  item('kv','全量 KV','全量 KV\n保留每个历史位置\n容量随上下文增长',840,85,240,140,'#b18b48'),
  item('section','固定递推的三个动作','固定递推：三步复用同一张表',0,288,1080,46,'','text'),
  item('outer','外积落格',String.raw`① 外积落格
$d_k \times d_v$ 个位置
$k_t v_t^{\mathsf T}$`,0,386,290,152,'#528c80'),
  item('update','原地更新',String.raw`② 原地更新
$S_t = S_{t-1} + k_t v_t^{\mathsf T}$
形状不变，内容持续累积`,390,386,300,152,'#528c80'),
  item('read','查询读取',String.raw`③ 查询读取
$o_t = q_t^{\mathsf T} S_t$
从同一份状态取出结果`,790,386,290,152,'#528c80'),
  item('meaning','维度的含义','键和值决定表的形状，token 改变表的内容。',0,600,1080,45,'','text'),
];
const target = item_id => ({kind:'item',item_id});
const links = [['write','outer','update','写入'],['query','update','read','读取']].map(([link_id,from,to,label])=>({link_id,from:target(from),to:target(to),label,based_on:[]}));
window.boardAppearanceExample = { items, links };
createApp(defineComponent({setup(){
  const view=ref(defaultBoardView()),canvas=ref();
  onMounted(async()=>{await nextTick();await document.fonts.ready;canvas.value.fit();});
  const focus=ids=>canvas.value.focusTargets((innerWidth<700?[ids.length===3?ids[1]:ids[0]]:ids).map(target));
  return ()=>h('main',{class:'example'},[
    h('header',{class:'example-header'},[
      h('div',[h('small','知识画板 / ATTENTION'),h('h1','上下文状态：记住什么，怎样读取？')]),
      h('nav',{'aria-label':'画板区域'},[
        h('button',{onClick:()=>canvas.value.fit()},'全图'),
        h('button',{onClick:()=>focus(['state','window','compress','kv'])},'四类做法'),
        h('button',{onClick:()=>focus(['outer','update','read'])},'状态更新'),
      ]),
    ]),
    h(BoardCanvas,{ref:canvas,items,links,view:view.value,onView:value=>view.value=value,
      onSelect:id=>view.value={...view.value,selected_item_id:id},
      onMove:(id,position)=>{items.find(item=>item.item_id===id).position=position;view.value={...view.value};},
    }),
  ]);
}})).mount('#app');
</script></body></html>
