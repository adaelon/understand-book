&lt;h1>一张显卡能留住多少上下文？&lt;/h1>
&lt;p class=&quot;lead&quot;>24 GiB 显存里，权重 10 GiB 和其他开销 2 GiB 是固定的；剩下 12 GiB 用来装 KV 缓存。缓存大小 = B × T × 65 536 × s 字节，随并发序列数 B、序列长度 T 与每元素字节数 s 一起变化。下面从缓存记住什么讲起，最后落在判定式上。&lt;/p>

&lt;div class=&quot;card hi&quot;>
&lt;p>&lt;b>先看结论&lt;/b>（以初始参数 B＝4 条、T＝8192 token、s＝2 字节为例）&lt;/p>
&lt;ul>
&lt;li>每缓存一个 token：32 层 × 8 头 × 128 元素 × 2（K、V）＝ 65 536 个元素，s＝2 时是 131 072 字节，正好 &lt;b>128 KiB&lt;/b>。&lt;/li>
&lt;li>一条 8192 token 的序列占 8192 × 128 KiB ＝ &lt;b>1 GiB&lt;/b>；4 条并发互不共享，占 &lt;b>4 GiB&lt;/b>。&lt;/li>
&lt;li>总占用 12 ＋ 4 ＝ &lt;b>16 GiB&lt;/b>，缓存还剩 8 GiB，每条序列最长能到 &lt;b>24 576 token&lt;/b>。&lt;/li>
&lt;li>所以对话变长（T 变大）、同时服务的人变多（B 变大），涨的都是这 12 GiB 预算里的缓存。&lt;/li>
&lt;/ul>
&lt;/div>

&lt;h2>1 · KV 缓存记住的是什么&lt;/h2>
&lt;p>模型逐个 token 生成。生成一个新 token 时，它要在此前每一个已缓存 token 上做一次比对：给每个 token 算出一对向量，&lt;b>K&lt;/b> 用来被检索到，&lt;b>V&lt;/b> 是检索到之后取走的内容。新 token 用自己的查询向量去和前面所有 token 的 K 比对，再按相似程度把对应的 V 加权取回。&lt;/p>
&lt;p>前文的 token 一旦固定，它们的 K 和 V 就不再变化。实现上的选择是把它们存下来，下一步直接取用：省下重复计算，代价是占住显存。存下来的这一块就是 KV 缓存。&lt;/p>
&lt;p>因此缓存里装的是每一层、每个缓存头、每个已缓存 token 的一对 K 和 V 向量；对话文本另存。缓存需要多大，取决于要记住多少个 token——这就是它随对话变长的原因。&lt;/p>

&lt;div class=&quot;fig&quot;>
  &lt;div class=&quot;cells&quot; aria-hidden=&quot;true&quot;>
    &lt;div class=&quot;cell&quot;>&lt;/div>&lt;div class=&quot;cell&quot;>&lt;/div>&lt;div class=&quot;cell&quot;>&lt;/div>&lt;div class=&quot;cell&quot;>&lt;/div>&lt;div class=&quot;cell&quot;>&lt;/div>&lt;div class=&quot;cell&quot;>&lt;/div>&lt;div class=&quot;cell&quot;>&lt;/div>&lt;div class=&quot;cell&quot;>&lt;/div>&lt;div class=&quot;cell last&quot;>…&lt;/div>
  &lt;/div>
  &lt;p class=&quot;cap&quot;>示意（不按比例）：一条序列的缓存按 token 排开，T 个 token 就是 T 摞数。&lt;/p>
  &lt;div class=&quot;layers&quot; aria-hidden=&quot;true&quot;>
    &lt;div class=&quot;lrow&quot;>&lt;span>第 1 层&lt;/span>&lt;span class=&quot;lbar&quot;>&lt;/span>&lt;span>8 头 × 128 元素 × 2&lt;/span>&lt;/div>
    &lt;div class=&quot;lrow&quot;>&lt;span>第 2 层&lt;/span>&lt;span class=&quot;lbar&quot;>&lt;/span>&lt;span>8 头 × 128 元素 × 2&lt;/span>&lt;/div>
    &lt;div class=&quot;lrow&quot;>&lt;span>…&lt;/span>&lt;span class=&quot;lbar&quot;>&lt;/span>&lt;span>共 32 层，各一份&lt;/span>&lt;/div>
    &lt;div class=&quot;lrow&quot;>&lt;span>第 32 层&lt;/span>&lt;span class=&quot;lbar&quot;>&lt;/span>&lt;span>8 头 × 128 元素 × 2&lt;/span>&lt;/div>
  &lt;/div>
  &lt;p class=&quot;cap&quot;>示意（不按比例）：把其中一摞数展开，它由 32 层构成，每层存 8 个头的 K 和 V。&lt;/p>
&lt;/div>

&lt;h2>2 · 每缓存一个 token 要存多少个元素&lt;/h2>
&lt;p>从最小的单位往上加：&lt;/p>
&lt;ol>
&lt;li>一层里的一份 K：8 个头，每个头的向量 128 个元素，即 8 × 128 ＝ 1 024 个元素。&lt;/li>
&lt;li>K 和 V 形状相同、各存一份：1 024 × 2 ＝ 2 048 个元素。&lt;/li>
&lt;li>32 层每层各存一份：2 048 × 32 ＝ &lt;b>65 536 个元素&lt;/b>。&lt;/li>
&lt;li>每个元素占 s 字节：s × 65 536 字节。s＝2 时是 131 072 字节，即 128 KiB。&lt;/li>
&lt;/ol>
&lt;p>这里出现乘法，是因为每个位置都要各自占一块内存：第 3 层第 5 个头里的第 77 个元素，和第 9 层第 2 个头里的第 12 个元素，是两个不同的数，谁也不能由对方算出来。层、头、元素位置的所有组合都要有一个数，组合总数就是相乘的结果。这和你熟悉的&quot;数组元素个数决定占用&quot;是同一条规则，差别只在于元素是被层、头、K/V 三个维度分隔开的。&lt;/p>

&lt;h2>3 · 再乘 T 和 B：从一条序列到整块缓存&lt;/h2>
&lt;p>一条序列缓存了 T 个 token，每个 token 一摞数，所以这条序列占 T × 65 536 × s 字节。代入 s＝2、T＝8192：8192 × 128 KiB ＝ 1 GiB。&lt;/p>
&lt;p>同时服务 B 条序列时，每条序列有自己的对话历史，缓存之间不共享内容，每条都要完整的一份：&lt;/p>
&lt;div class=&quot;eq&quot;>KV 缓存字节数 ＝ B × T × 65 536 × s　　且 B·T·65 536·s ≤ 12 × 2³⁰ 才算装得下&lt;/div>
&lt;p>缓存对 B、T、s 都是正比关系：B 翻倍缓存翻倍，T 翻倍缓存翻倍，s 从 2 变 4 缓存也翻倍。权重和其他开销不受影响。&lt;/p>

&lt;h2>4 · 固定占用与随上下文增长的占用&lt;/h2>
&lt;p>权重在模型装进显存时确定，这台机器上占 10 GiB，与 B、T、s 都无关。其他运行开销（中间结果、调度所需的临时空间等）你给定为 2 GiB，同样不随对话增长。两项合计 12 GiB，是常数项。&lt;/p>
&lt;p>剩下 12 GiB 是唯一会被缓存竞争的空间。1 GiB ＝ 2³⁰ 字节，所以可用预算是 12 × 2³⁰ ＝ 12 884 901 888 字节。判定就一句话：缓存不超过这个数就装得下，恰好相等也算装得下。&lt;/p>
&lt;div class=&quot;eq&quot;>总占用 ＝ 12 GiB ＋ B × T × 65 536 × s ÷ 2³⁰ GiB&lt;/div>

&lt;h2>5 · 调一调，看这台机器装不装得下&lt;/h2>
&lt;p>B 是你同时服务几条序列，T 是每条序列记多少个 token，s 是缓存里每个元素占几个字节。三个控件改的是同一个状态，下面的堆叠条、四个读数和判定句一起重算。&lt;/p>

&lt;div class=&quot;card&quot; id=&quot;panel&quot;>
  &lt;div class=&quot;controls&quot;>
    &lt;div class=&quot;ctl&quot;>
      &lt;div class=&quot;top&quot;>&lt;label for=&quot;inB&quot;>并发序列数 B&lt;/label>&lt;span class=&quot;val&quot; id=&quot;vB&quot;>4 条&lt;/span>&lt;/div>
      &lt;input id=&quot;inB&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;16&quot; step=&quot;1&quot; value=&quot;4&quot; data-presentation-parameter=&quot;B&quot; aria-label=&quot;并发序列数 B，1 到 16&quot;>
    &lt;/div>
    &lt;div class=&quot;ctl&quot;>
      &lt;div class=&quot;top&quot;>&lt;label for=&quot;inT&quot;>每条序列的缓存长度 T&lt;/label>&lt;span class=&quot;val&quot; id=&quot;vT&quot;>8 192 token&lt;/span>&lt;/div>
      &lt;input id=&quot;inT&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;32768&quot; step=&quot;1&quot; value=&quot;8192&quot; data-presentation-parameter=&quot;T&quot; aria-label=&quot;每条序列的缓存长度 T，0 到 32768 token&quot;>
      &lt;div class=&quot;numin&quot;>&lt;input id=&quot;numT&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;32768&quot; step=&quot;1&quot; inputmode=&quot;numeric&quot; value=&quot;8192&quot; aria-label=&quot;直接输入 T 的数值&quot;> &lt;span>token（可直接输入，便于检验边界）&lt;/span>&lt;/div>
    &lt;/div>
    &lt;div class=&quot;ctl&quot;>
      &lt;div class=&quot;top&quot;>&lt;span class=&quot;lbl&quot; id=&quot;lblS&quot;>缓存中每个元素占 s 字节&lt;/span>&lt;span class=&quot;val&quot; id=&quot;vS&quot;>2 字节&lt;/span>&lt;/div>
      &lt;select id=&quot;inS&quot; data-presentation-parameter=&quot;s&quot; aria-labelledby=&quot;lblS&quot;>
        &lt;option value=&quot;1&quot;>1 字节&lt;/option>
        &lt;option value=&quot;2&quot; selected=&quot;&quot;>2 字节&lt;/option>
        &lt;option value=&quot;4&quot;>4 字节&lt;/option>
      &lt;/select>
    &lt;/div>
  &lt;/div>

  &lt;div class=&quot;bar&quot; aria-hidden=&quot;true&quot;>
    &lt;div class=&quot;seg w&quot;>&lt;/div>
    &lt;div class=&quot;seg o&quot;>&lt;/div>
    &lt;div class=&quot;seg c&quot; id=&quot;barC&quot; style=&quot;width:16.6667%&quot;>&lt;/div>
    &lt;div class=&quot;mark&quot;>&lt;/div>
  &lt;/div>
  &lt;div class=&quot;scale&quot; aria-hidden=&quot;true&quot;>&lt;span>0&lt;/span>&lt;span>6&lt;/span>&lt;span>12 GiB&lt;/span>&lt;span>18&lt;/span>&lt;span>24 GiB&lt;/span>&lt;/div>
  &lt;div class=&quot;legend&quot;>
    &lt;span>&lt;i class=&quot;sw&quot; style=&quot;background:var(--cw)&quot;>&lt;/i>权重 10 GiB（固定）&lt;/span>
    &lt;span>&lt;i class=&quot;sw&quot; style=&quot;background:var(--co)&quot;>&lt;/i>其他开销 2 GiB（固定）&lt;/span>
    &lt;span>&lt;i class=&quot;sw&quot; style=&quot;background:var(--cc)&quot;>&lt;/i>KV 缓存（随 B、T、s 变）&lt;/span>
  &lt;/div>
  &lt;p class=&quot;cap&quot; id=&quot;barNote&quot;>蓝段从 12 GiB 边界（黑线）向右延伸。&lt;/p>

  &lt;div class=&quot;grid4&quot;>
    &lt;div class=&quot;ro&quot;>&lt;div class=&quot;k&quot;>总占用&lt;/div>&lt;div class=&quot;v&quot; id=&quot;rTotal&quot;>16.000 GiB&lt;/div>&lt;div class=&quot;n&quot;>上限 24 GiB&lt;/div>&lt;/div>
    &lt;div class=&quot;ro&quot;>&lt;div class=&quot;k&quot;>KV 缓存&lt;/div>&lt;div class=&quot;v&quot; id=&quot;rCache&quot;>4.000 GiB&lt;/div>&lt;div class=&quot;n&quot;>预算 12 GiB&lt;/div>&lt;/div>
    &lt;div class=&quot;ro&quot;>&lt;div class=&quot;k&quot;>缓存余量&lt;/div>&lt;div class=&quot;v&quot; id=&quot;rSlack&quot;>8.000 GiB&lt;/div>&lt;div class=&quot;n&quot; id=&quot;rSlackN&quot;>可以继续增长这么多&lt;/div>&lt;/div>
    &lt;div class=&quot;ro&quot;>&lt;div class=&quot;k&quot;>每条序列最长&lt;/div>&lt;div class=&quot;v&quot; id=&quot;rMaxT&quot;>24 576&lt;/div>&lt;div class=&quot;n&quot; id=&quot;rMaxTN&quot;>token；超出这个长度就装不下&lt;/div>&lt;/div>
  &lt;/div>

  &lt;div class=&quot;verdict&quot; id=&quot;verdict&quot;>&lt;/div>

  &lt;div class=&quot;btnrow&quot;>
    &lt;button class=&quot;primary&quot; type=&quot;button&quot; id=&quot;btnAdd&quot; data-presentation-action=&quot;add-sequence&quot;>再加一条序列&lt;/button>
    &lt;button type=&quot;button&quot; id=&quot;btnDbl&quot; data-presentation-action=&quot;double-length&quot;>T 翻倍&lt;/button>
    &lt;button type=&quot;button&quot; id=&quot;btnInit&quot; data-presentation-action=&quot;preset-initial&quot;>回到初始参数&lt;/button>
    &lt;button type=&quot;button&quot; id=&quot;btnExact&quot; data-presentation-action=&quot;preset-exact&quot;>恰好装满：B=3、T=32768、s=2&lt;/button>
    &lt;button type=&quot;button&quot; id=&quot;btnOver&quot; data-presentation-action=&quot;preset-over&quot;>超载：B=4、T=32768、s=2&lt;/button>
    &lt;button type=&quot;button&quot; id=&quot;btnHalf&quot; data-presentation-action=&quot;preset-half&quot;>s=1 也刚好装满：B=6、T=32768&lt;/button>
  &lt;/div>
  &lt;p class=&quot;feedback&quot; id=&quot;fb&quot;>拖动滑块、改下拉框或按上面的按钮，条和读数会一起更新。&lt;/p>
&lt;/div>

&lt;h2>6 · 三个能自己回答的问题&lt;/h2>

&lt;div class=&quot;card&quot; id=&quot;qcard&quot;>
&lt;h3>增加一条同样长的序列，多占多少&lt;/h3>
&lt;p>一条序列的缓存是 T × 65 536 × s 字节，固定部分（权重、其他开销）与 B 无关。所以每多一条序列，只多这一整份。当前参数下：&lt;span id=&quot;q1&quot;>—&lt;/span>&lt;/p>

&lt;h3>长度翻倍时，哪些量翻倍&lt;/h3>
&lt;p>T 只出现在缓存项里。T 翻倍时缓存翻倍，权重 10 GiB 和其他 2 GiB 不动，所以总占用变成 12 GiB 加上两倍的缓存，而不是总量翻倍。当前参数下：&lt;span id=&quot;q2&quot;>—&lt;/span>&lt;/p>

&lt;h3>这组参数还能容纳多长的上下文&lt;/h3>
&lt;p>把判定式解出 T：T ≤ 12 × 2³⁰ ÷ (B × 65 536 × s) ＝ 196 608 ÷ (B × s)，取整数下界，再与 T 的参数上限 32 768 取较小值。当前参数下：&lt;span id=&quot;q3&quot;>—&lt;/span>&lt;/p>
&lt;/div>

&lt;h2>7 · 一条序列最长能有多长（对照表）&lt;/h2>
&lt;p>下表按同一判定式算出每条序列能取的最大 token 数，蓝色行是当前的 B。&lt;/p>
&lt;div class=&quot;wrapx&quot;>
&lt;table>
&lt;thead>&lt;tr>&lt;th scope=&quot;col&quot;>并发序列数 B&lt;/th>&lt;th scope=&quot;col&quot;>s＝1 字节&lt;/th>&lt;th scope=&quot;col&quot;>s＝2 字节&lt;/th>&lt;th scope=&quot;col&quot;>s＝4 字节&lt;/th>&lt;/tr>&lt;/thead>
&lt;tbody id=&quot;tblBody&quot;>&lt;/tbody>
&lt;/table>
&lt;/div>
&lt;p class=&quot;foot&quot;>✦ 表示缓存正好用满 12 GiB（总占用正好 24 GiB，按约定算装得下）。&quot;≥ 32 768&quot; 表示 12 GiB 预算还够放更多 token，但本页 T 的上限是 32 768，所以填满上限即可。&lt;/p>

&lt;h2>8 · 这个教学模型的边界&lt;/h2>
&lt;ul>
&lt;li>不计分块留白、显存碎片和临时分配，所以算出的容量是这组假设下的上限。&lt;/li>
&lt;li>s 只改变缓存大小，权重 10 GiB 和其他 2 GiB 都不变；本页不讨论精度对数值结果的影响。&lt;/li>
&lt;li>所有序列等长、缓存内容不共享；实际服务里长度往往不一致，那时要把每条序列的长度分别相加。&lt;/li>
&lt;/ul>

&lt;/div>

&lt;script>
(function(){
  var GIB = 1073741824;
  var LAYERS = 32, HEADS = 8, DIM = 128, KV = 2;
  var ELEMS = LAYERS * HEADS * DIM * KV;
  var BUDGET_GIB = 12, TOTAL_GIB = 24, BUDGET = BUDGET_GIB * GIB;
  var T_CAP = 32768, B_CAP = 16;

  var host = (window.presentation &amp;&amp; window.presentation.initialState) || {};
  function nz(v, d){ return (typeof v === 'number' &amp;&amp; isFinite(v)) ? v : d; }
  function clampI(v, lo, hi, d){
    var x = Math.round(Number(v));
    if (!isFinite(x)) return d;
    return Math.min(hi, Math.max(lo, x));
  }
  var st = {
    B: clampI(nz(host.B, 4), 1, B_CAP, 4),
    T: clampI(nz(host.T, 8192), 0, T_CAP, 8192),
    s: ([1,2,4].indexOf(nz(host.s, 2)) >= 0 ? nz(host.s, 2) : 2)
  };

  function $(id){ return document.getElementById(id); }
  var el = {
    inB: $('inB'), inT: $('inT'), inS: $('inS'), numT: $('numT'),
    vB: $('vB'), vT: $('vT'), vS: $('vS'),
    barC: $('barC'), barNote: $('barNote'),
    rTotal: $('rTotal'), rCache: $('rCache'), rSlack: $('rSlack'), rSlackN: $('rSlackN'),
    rMaxT: $('rMaxT'), rMaxTN: $('rMaxTN'),
    verdict: $('verdict'), fb: $('fb'), tblBody: $('tblBody'),
    q1: $('q1'), q2: $('q2'), q3: $('q3')
  };

  function tk(x){ return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function gib(bytes){ return (bytes / GIB).toFixed(3) + ' GiB'; }
  function byt(bytes){ return tk(bytes) + ' 字节'; }

  function calc(){
    var perToken = ELEMS * st.s;
    var cacheBytes = st.B * st.T * perToken;
    var totalBytes = BUDGET_GIB * GIB + cacheBytes;
    var surplus = BUDGET - cacheBytes;
    var maxTRaw = Math.floor(BUDGET / (ELEMS * st.s * st.B));
    return {
      perToken: perToken,
      cacheBytes: cacheBytes,
      totalBytes: totalBytes,
      surplus: surplus,
      fit: cacheBytes &lt;= BUDGET,
      exact: cacheBytes === BUDGET,
      maxTRaw: maxTRaw,
      maxT: Math.min(T_CAP, maxTRaw)
    };
  }

  function render(){
    var c = calc();

    el.inB.value = String(st.B);
    el.inT.value = String(st.T);
    el.inS.value = String(st.s);
    if (document.activeElement !== el.numT) el.numT.value = String(st.T);
    el.vB.textContent = st.B + ' 条';
    el.vT.textContent = tk(st.T) + ' token';
    el.vS.textContent = st.s + ' 字节';

    var drawn = Math.min(c.cacheBytes / GIB, BUDGET_GIB);
    el.barC.style.width = (drawn / TOTAL_GIB * 100).toFixed(4) + '%';
    el.barC.setAttribute('class', 'seg c' + (c.fit ? '' : ' over'));
    el.barNote.textContent = c.fit
      ? '蓝段从 12 GiB 边界（黑线）向右延伸 ' + gib(c.cacheBytes) + '；整条的长度是 24 GiB。'
      : '蓝段已顶到条的最右端并标上红色斜纹；超出 24 GiB 的 ' + gib(c.cacheBytes - BUDGET) + ' 在条外，画不出来。';

    el.rTotal.textContent = gib(c.totalBytes);
    el.rCache.textContent = gib(c.cacheBytes);
    if (c.fit){
      el.rSlack.textContent = gib(c.surplus);
      el.rSlackN.textContent = '可以继续增长这么多';
    } else {
      el.rSlack.textContent = '超 ' + gib(c.cacheBytes - BUDGET);
      el.rSlackN.textContent = '缓存越过 12 GiB 预算的量';
    }
    el.rMaxT.textContent = tk(c.maxT);
    el.rMaxTN.textContent = (c.maxTRaw > T_CAP)
      ? '预算够 ' + tk(c.maxTRaw) + '，受 32 768 上限限制'
      : 'token；到这一档正好把预算用尽';

    if (!c.fit){
      el.verdict.className = 'verdict bad';
      el.verdict.innerHTML = '&lt;b>装不下。&lt;/b>总占用 ' + gib(c.totalBytes) + '，比 24 GiB 多 ' + gib(c.cacheBytes - BUDGET) + '。'
        + '同样是 ' + st.B + ' 条序列，每条要降到 ' + tk(c.maxT) + ' token 以内才装得下（当前 ' + tk(st.T)
        + ' token，需减少 ' + tk(st.T - c.maxT) + '）；或者把 B 减小。';
    } else if (c.exact){
      el.verdict.className = 'verdict exact';
      el.verdict.innerHTML = '&lt;b>恰好装满。&lt;/b>缓存正好 12 GiB，总占用正好 24 GiB——按你的约定，这仍然算装得下；再多一个 token 就装不下。';
    } else if (st.T === 0){
      el.verdict.className = 'verdict';
      el.verdict.innerHTML = '&lt;b>装得下。&lt;/b>T＝0，还没有 token 进缓存，占用只有固定的 12 GiB（权重 10 ＋ 其他 2）。';
    } else {
      var extra = Math.min(B_CAP - st.B, Math.floor(c.surplus / (st.T * c.perToken)));
      var tail;
      if (st.B >= B_CAP){
        tail = 'B 已经是 16 条的上限。';
      } else if (extra > 0){
        tail = '按当前长度 ' + tk(st.T) + ' token，还能再加 ' + extra + ' 条同样长的序列。';
      } else {
        tail = '再开一条同样长的序列就装不下了，需要把 T 调小或减少 B。';
      }
      el.verdict.className = 'verdict';
      el.verdict.innerHTML = '&lt;b>装得下。&lt;/b>总占用 ' + gib(c.totalBytes) + '，缓存还剩 ' + gib(c.surplus) + ' 预算。' + tail;
    }

    if (st.T === 0){
      el.q1.textContent = '当前 T＝0，没有 token 进缓存，多一条序列也不占缓存；把 T 调大才会出现这份成本。';
    } else {
      var m = st.T * c.perToken;
      el.q1.textContent = '每条 ' + tk(st.T) + ' token 的序列占 ' + tk(st.T) + ' × ' + byt(c.perToken) + ' ＝ '
        + gib(m) + '（' + byt(m) + '）。B 每增加 1 条，缓存就多这一份，权重和其他开销都不变。';
    }

    if (st.T === 0){
      el.q2.textContent = '当前 T＝0，缓存为 0，翻倍后仍是 0；把 T 设成一个正数才能看到翻倍。';
    } else {
      var cache2 = st.B * st.T * 2 * c.perToken;
      var note2 = (st.T * 2 > T_CAP) ? '（' + tk(st.T * 2) + ' token 超过了 32 768 的上限，这组数字只用来对照倍数关系。）' : '';
      el.q2.textContent = 'T 从 ' + tk(st.T) + ' 变成 ' + tk(st.T * 2) + '：缓存从 ' + gib(c.cacheBytes) + ' 变成 '
        + gib(cache2) + '，固定部分仍是 12 GiB，总占用从 ' + gib(c.totalBytes) + ' 变成 ' + gib(BUDGET_GIB * GIB + cache2) + '。翻倍的只有缓存项。' + note2;
    }

    var base = '196 608 ÷ (' + st.B + ' × ' + st.s + ') ＝ ' + tk(Math.floor(196608 / (st.B * st.s)));
    if (c.maxTRaw > T_CAP){
      el.q3.textContent = '预算允许每条序列 ' + tk(c.maxTRaw) + ' token（' + base + ' 向上取整前的结果），超过上限 32 768，所以每条可以取满 32 768 token。当前 T＝' + tk(st.T) + '，装得下。';
    } else {
      el.q3.textContent = '每条序列最多 ' + tk(c.maxT) + ' token（' + base + '）。当前 T＝' + tk(st.T)
        + (c.fit ? '，没有超过这个上限，装得下。' : '，超出 ' + tk(st.T - c.maxT) + ' token，装不下。');
    }

    var rows = '';
    var Bs = [1,2,3,4,6,8,12,16], Ss = [1,2,4];
    for (var bi = 0; bi &lt; Bs.length; bi++){
      var b = Bs[bi];
      rows += '&lt;tr' + (b === st.B ? ' class=&quot;sel&quot;' : '') + '>&lt;th scope=&quot;row&quot;>' + b + '&lt;/th>';
      for (var si = 0; si &lt; Ss.length; si++){
        var t = Math.floor(BUDGET / (ELEMS * Ss[si] * b));
        var cell = (t > T_CAP) ? '≥ 32 768' : (t === T_CAP ? '32 768 ✦' : tk(t));
        rows += '&lt;td>' + cell + '&lt;/td>';
      }
      rows += '&lt;/tr>';
    }
    el.tblBody.innerHTML = rows;
  }

  function fb(){ /* 参数变化的结果由下方判定句呈现；这一行保持固定提示，使恢复后的画面与操作后的画面一致 */ }
  function commit(){ if (window.presentation &amp;&amp; window.presentation.commitState) window.presentation.commitState(); }

  function setState(B, T, s, msg){
    st.B = clampI(B, 1, B_CAP, st.B);
    st.T = clampI(T, 0, T_CAP, st.T);
    st.s = ([1,2,4].indexOf(Number(s)) >= 0 ? Number(s) : st.s);
    render();
    if (msg) fb(msg);
    commit();
  }

  function addSeq(){
    if (st.B >= B_CAP){ fb('B 已经是 16 条的上限，再加就超出模型范围了。'); return; }
    var before = calc();
    setState(st.B + 1, st.T, st.s,
      'B：' + st.B + ' 条 → ' + (st.B) + ' 条；缓存 ' + gib(before.cacheBytes) + ' → ' + gib(calc().cacheBytes)
      + '，每条序列多占 ' + (st.T === 0 ? '0 字节（T＝0）' : gib(st.T * before.perToken)) + '。');
    fb('B 现在是 ' + st.B + ' 条：缓存 ' + gib(calc().cacheBytes) + '，总占用 ' + gib(calc().totalBytes) + '。');
  }

  function doubleLen(){
    if (st.T === 0){ fb('T＝0 时翻倍仍是 0，先把长度调大。'); return; }
    var oldT = st.T, oldCache = calc().cacheBytes;
    var newT = Math.min(T_CAP, st.T * 2);
    setState(st.B, newT, st.s,
      'T：' + tk(oldT) + ' → ' + tk(newT) + ' token；缓存 ' + gib(oldCache) + ' → ' + gib(calc().cacheBytes)
      + (oldT * 2 > T_CAP ? '（受 32 768 上限截断）' : '（正好翻倍）') + '。');
  }

  el.inB.addEventListener('input', function(){ st.B = clampI(this.value, 1, B_CAP, st.B); render(); });
  el.inT.addEventListener('input', function(){ st.T = clampI(this.value, 0, T_CAP, st.T); render(); });
  el.inS.addEventListener('change', function(){ st.s = ([1,2,4].indexOf(Number(this.value)) >= 0 ? Number(this.value) : st.s); render(); });
  el.numT.addEventListener('change', function(){ st.T = clampI(this.value, 0, T_CAP, st.T); render(); commit(); });

  $('btnAdd').addEventListener('click', addSeq);
  $('btnDbl').addEventListener('click', doubleLen);
  $('btnInit').addEventListener('click', function(){ setState(4, 8192, 2, '回到初始参数：B＝4、T＝8192、s＝2。'); });
  $('btnExact').addEventListener('click', function(){ setState(3, 32768, 2, 'B＝3、T＝32768、s＝2：缓存正好 12 GiB，总占用正好 24 GiB。'); });
  $('btnOver').addEventListener('click', function(){ setState(4, 32768, 2, 'B＝4、T＝32768、s＝2：缓存 16 GiB，比预算多 4 GiB。'); });
  $('btnHalf').addEventListener('click', function(){ setState(6, 32768, 1, 's＝1：每个元素少占一半，B＝6、T＝32768 时缓存正好 12 GiB。'); });

  if (window.presentation &amp;&amp; window.presentation.registerStateReader){
    window.presentation.registerStateReader(function(){
      var c = calc();
      return {
        values: { B: st.B, T: st.T, s: st.s },
        visible_step: null,
        observation: {
          summary: 'B＝' + st.B + ' 条、T＝' + tk(st.T) + ' token、s＝' + st.s + ' 字节：KV 缓存 ' + gib(c.cacheBytes)
            + '，总占用 ' + gib(c.totalBytes) + '，' + (c.fit ? (c.exact ? '恰好装满、仍算装得下' : '装得下') : '装不下')
            + '，每条序列最长 ' + tk(c.maxT) + ' token。',
          state: { B: st.B, T: st.T, s: st.s, cache_gib: Number((c.cacheBytes / GIB).toFixed(3)),
            total_gib: Number((c.totalBytes / GIB).toFixed(3)), fits: c.fit, exact: c.exact, max_tok_per_seq: c.maxT }
        }
      };
    });
  }

  if (window.presentation &amp;&amp; window.presentation.registerStateRestorer){
    window.presentation.registerStateRestorer(function(saved){
      var v = (saved &amp;&amp; saved.values) || {};
      var p = (v.page &amp;&amp; typeof v.page === 'object') ? v.page : v;
      if (typeof p.B === 'number') st.B = clampI(p.B, 1, B_CAP, st.B);
      if (typeof p.T === 'number') st.T = clampI(p.T, 0, T_CAP, st.T);
      if (typeof p.s === 'number') st.s = ([1,2,4].indexOf(p.s) >= 0 ? p.s : st.s);
      render();
    });
  }

  if (window.presentation &amp;&amp; window.presentation.registerActionHandler){
    window.presentation.registerActionHandler(function(action){
      if (!action) return;
      if (action.kind === 'set_parameters'){
        setState(
          clampI(Number(el.inB.value), 1, B_CAP, st.B),
          clampI(Number(el.inT.value), 0, T_CAP, st.T),
          Number(el.inS.value)
        );
        return;
      }
      if (action.kind === 'invoke'){
        var id = action.action_id;
        if (id === 'add-sequence') addSeq();
        else if (id === 'double-length') doubleLen();
        else if (id === 'preset-initial') setState(4, 8192, 2, '回到初始参数：B＝4、T＝8192、s＝2。');
        else if (id === 'preset-exact') setState(3, 32768, 2, 'B＝3、T＝32768、s＝2：缓存正好 12 GiB。');
        else if (id === 'preset-over') setState(4, 32768, 2, 'B＝4、T＝32768、s＝2：缓存 16 GiB，超出预算 4 GiB。');
