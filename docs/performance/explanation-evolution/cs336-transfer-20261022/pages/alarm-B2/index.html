&lt;body>
&lt;div class=&quot;wrap&quot;>
  &lt;h1>报警的零件，大多真的有缺陷吗？&lt;/h1>
  &lt;p class=&quot;lead&quot;>一批 10000 件零件，每件只有“有缺陷”或“无缺陷”两种真实状态；检测器对每件只给出“报警”或“不报警”。下面数的是长期平均的期望件数，所以数可以带小数。先把这批零件数成四格，再只看报了警的那一堆。&lt;/p>

  &lt;h2>一、先把这 10000 件数成四格&lt;/h2>
  &lt;p class=&quot;note&quot; id=&quot;gridNote&quot;>当前 p=1%、d=95%、f=5%。三个比例各自作用在固定的一群人身上，四格就是这群人分出来的四份。&lt;/p>
  &lt;table class=&quot;grid&quot;>
    &lt;caption class=&quot;barCap&quot; style=&quot;text-align:left&quot;>期望件数（每件只落在其中一格）&lt;/caption>
    &lt;thead>
      &lt;tr>
        &lt;th class=&quot;rHead&quot;>检测器&lt;/th>
        &lt;th class=&quot;hDef&quot;>有缺陷&lt;span class=&quot;tag&quot;>d 的分母 · &lt;b id=&quot;hDef&quot;>100&lt;/b> 件&lt;/span>&lt;/th>
        &lt;th class=&quot;hGood&quot;>无缺陷&lt;span class=&quot;tag&quot;>f 的分母 · &lt;b id=&quot;hGood&quot;>9900&lt;/b> 件&lt;/span>&lt;/th>
        &lt;th>合计&lt;/th>
      &lt;/tr>
    &lt;/thead>
    &lt;tbody>
      &lt;tr>
        &lt;td class=&quot;rHead&quot;>报警&lt;span class=&quot;tag&quot;>可信度的分母&lt;/span>&lt;/td>
        &lt;td>&lt;span class=&quot;v&quot; id=&quot;cTA&quot;>95&lt;/span>&lt;span class=&quot;k&quot;>正确报警&lt;/span>&lt;/td>
        &lt;td>&lt;span class=&quot;v&quot; id=&quot;cFA&quot;>495&lt;/span>&lt;span class=&quot;k&quot;>误报&lt;/span>&lt;/td>
        &lt;td class=&quot;sum&quot;>&lt;span class=&quot;v&quot; id=&quot;rAlarm&quot;>590&lt;/span>&lt;span class=&quot;k&quot;>全部报警&lt;/span>&lt;/td>
      &lt;/tr>
      &lt;tr>
        &lt;td class=&quot;rHead&quot;>不报警&lt;/td>
        &lt;td>&lt;span class=&quot;v&quot; id=&quot;cM&quot;>5&lt;/span>&lt;span class=&quot;k&quot;>漏检&lt;/span>&lt;/td>
        &lt;td>&lt;span class=&quot;v&quot; id=&quot;cCR&quot;>9405&lt;/span>&lt;span class=&quot;k&quot;>正确放行&lt;/span>&lt;/td>
        &lt;td class=&quot;sum&quot;>&lt;span class=&quot;v&quot; id=&quot;rNoAlarm&quot;>9410&lt;/span>&lt;span class=&quot;k&quot;>没报警&lt;/span>&lt;/td>
      &lt;/tr>
      &lt;tr>
        &lt;td class=&quot;rHead&quot;>合计&lt;/td>
        &lt;td class=&quot;sum&quot;>&lt;span class=&quot;v&quot; id=&quot;cDef&quot;>100&lt;/span>&lt;span class=&quot;k&quot;>有缺陷&lt;/span>&lt;/td>
        &lt;td class=&quot;sum&quot;>&lt;span class=&quot;v&quot; id=&quot;cGood&quot;>9900&lt;/span>&lt;span class=&quot;k&quot;>无缺陷&lt;/span>&lt;/td>
        &lt;td class=&quot;sum&quot;>&lt;span class=&quot;v&quot;>10000&lt;/span>&lt;span class=&quot;k&quot;>整批&lt;/span>&lt;/td>
      &lt;/tr>
    &lt;/tbody>
  &lt;/table>
  &lt;p style=&quot;margin-top:10px&quot;>四格的算法都是从整批出发连乘出来的：先用 p 把 10000 件切成两列，再用 d 切“有缺陷”那一列、用 f 切“无缺陷”那一列。&lt;/p>
  &lt;ul>
    &lt;li>&lt;b>有缺陷件&lt;/b> = 10000 ÷ 100 × p = &lt;span class=&quot;num&quot; id=&quot;qDef&quot;>100&lt;/span> 件；&lt;b>无缺陷件&lt;/b> = 10000 − 有缺陷件 = &lt;span class=&quot;num&quot; id=&quot;qGood&quot;>9900&lt;/span> 件。&lt;/li>
    &lt;li>&lt;b>正确报警&lt;/b> = 有缺陷件 × d = &lt;span class=&quot;num&quot; id=&quot;qTA&quot;>95&lt;/span> 件；&lt;b>漏检&lt;/b> = 有缺陷件 − 正确报警 = &lt;span class=&quot;num&quot; id=&quot;qM&quot;>5&lt;/span> 件。&lt;/li>
    &lt;li>&lt;b>误报&lt;/b> = 无缺陷件 × f = &lt;span class=&quot;num&quot; id=&quot;qFA&quot;>495&lt;/span> 件；&lt;b>正确放行&lt;/b> = 无缺陷件 − 误报 = &lt;span class=&quot;num&quot; id=&quot;qCR&quot;>9405&lt;/span> 件。&lt;/li>
    &lt;li>&lt;b>全部报警&lt;/b> = 正确报警 + 误报 = &lt;span class=&quot;num&quot; id=&quot;qTA2&quot;>95&lt;/span> + &lt;span class=&quot;num&quot; id=&quot;qFA2&quot;>495&lt;/span> = &lt;span class=&quot;num&quot; id=&quot;qTot&quot;>590&lt;/span> 件；这 590 件就是报警可信度的分母。&lt;/li>
  &lt;/ul>

  &lt;h2>二、三个比例，三个分母&lt;/h2>
  &lt;p>你分不清的那两句话，区别就在分母上。下面三行把所有数固定在当前这组参数上，右边的分数就是每个比例的出处。&lt;/p>
  &lt;table class=&quot;mini&quot;>
    &lt;thead>
      &lt;tr>&lt;th>说法&lt;/th>&lt;th>算式&lt;/th>&lt;th style=&quot;text-align:right&quot;>结果&lt;/th>&lt;/tr>
    &lt;/thead>
    &lt;tbody>
      &lt;tr>
        &lt;td>检出率 d&lt;br>&lt;span class=&quot;note&quot;>有缺陷件中会报警的比例&lt;/span>&lt;/td>
        &lt;td>&lt;span id=&quot;dNum&quot;>95&lt;/span> ÷ &lt;span id=&quot;dDen&quot;>100&lt;/span>&lt;br>&lt;span class=&quot;note&quot;>分母：有缺陷件&lt;/span>&lt;/td>
        &lt;td class=&quot;num&quot; id=&quot;dVal&quot;>95%&lt;/td>
      &lt;/tr>
      &lt;tr>
        &lt;td>误报率 f&lt;br>&lt;span class=&quot;note&quot;>无缺陷件中会报警的比例&lt;/span>&lt;/td>
        &lt;td>&lt;span id=&quot;fNum&quot;>495&lt;/span> ÷ &lt;span id=&quot;fDen&quot;>9900&lt;/span>&lt;br>&lt;span class=&quot;note&quot;>分母：无缺陷件&lt;/span>&lt;/td>
        &lt;td class=&quot;num&quot; id=&quot;fVal&quot;>5%&lt;/td>
      &lt;/tr>
      &lt;tr>
        &lt;td>报警可信度&lt;br>&lt;span class=&quot;note&quot;>一次报警里真有缺陷的比例（有的教材叫精确率）&lt;/span>&lt;/td>
        &lt;td>&lt;span id=&quot;pNum&quot;>95&lt;/span> ÷ &lt;span id=&quot;pDen&quot;>590&lt;/span>&lt;br>&lt;span class=&quot;note&quot;>分母：全部报警件&lt;/span>&lt;/td>
        &lt;td class=&quot;num&quot; id=&quot;pVal&quot;>16.1%&lt;/td>
      &lt;/tr>
    &lt;/tbody>
  &lt;/table>
  &lt;p style=&quot;margin-top:10px&quot;>前两行沿着列往下数：从一群人出发，数出其中报警的有多少。第三行横着数：从已经报警的那一堆出发，回头看其中真有缺陷的有多少。方向反过来，分母就跟着换。&lt;/p>

  &lt;h2>三、整批的分段：谁占满了这批货&lt;/h2>
  &lt;p class=&quot;barCap&quot;>整批 10000 件 · 四段相加 = 10000&lt;/p>
  &lt;div class=&quot;bar&quot; id=&quot;barAll&quot; role=&quot;img&quot; aria-label=&quot;整批 10000 件的四段构成&quot;>
    &lt;i id=&quot;sgTA&quot; style=&quot;background:var(--c-true)&quot;>&lt;/i>
    &lt;i id=&quot;sgM&quot; style=&quot;background:var(--c-miss)&quot;>&lt;/i>
    &lt;i id=&quot;sgFA&quot; style=&quot;background:var(--c-false)&quot;>&lt;/i>
    &lt;i id=&quot;sgCR&quot; style=&quot;background:var(--c-ok)&quot;>&lt;/i>
  &lt;/div>
  &lt;div class=&quot;legend&quot;>
    &lt;div>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-true)&quot;>&lt;/span>有缺陷 · 报警（正确报警）&lt;b id=&quot;lTA&quot;>95&lt;/b> 件&lt;/div>
    &lt;div>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-miss)&quot;>&lt;/span>有缺陷 · 不报警（漏检）&lt;b id=&quot;lM&quot;>5&lt;/b> 件&lt;/div>
    &lt;div>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-false)&quot;>&lt;/span>无缺陷 · 报警（误报）&lt;b id=&quot;lFA&quot;>495&lt;/b> 件&lt;/div>
    &lt;div>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-ok)&quot;>&lt;/span>无缺陷 · 不报警（正确放行）&lt;b id=&quot;lCR&quot;>9405&lt;/b> 件&lt;/div>
  &lt;/div>
  &lt;p style=&quot;margin-top:10px&quot; id=&quot;barAllNote&quot;>整批里只有 1% 是有缺陷的，所以左边两段被挤成一条细缝。这条细缝正好是整篇的问题所在：它很短，可是报警主要从右边那段长条里冒出来。要看清楚，就把报警件单独摊开。&lt;/p>

  &lt;h2>四、只数报警的那一堆&lt;/h2>
  &lt;p class=&quot;barCap&quot; id=&quot;barBCap&quot;>只数报了警的 590 件 · 两段相加 = 全部报警&lt;/p>
  &lt;div class=&quot;bar&quot; id=&quot;barAlarm&quot; role=&quot;img&quot; aria-label=&quot;报警件的构成：正确报警与误报&quot;>
    &lt;i id=&quot;sgT2&quot; style=&quot;background:var(--c-true)&quot;>&lt;/i>
    &lt;i id=&quot;sgF2&quot; style=&quot;background:var(--c-false)&quot;>&lt;/i>
  &lt;/div>
  &lt;div class=&quot;legend&quot;>
    &lt;div>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-true)&quot;>&lt;/span>真有缺陷&lt;b id=&quot;l2T&quot;>95&lt;/b> 件&lt;/div>
    &lt;div>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-false)&quot;>&lt;/span>其实无缺陷（误报）&lt;b id=&quot;l2F&quot;>495&lt;/b> 件&lt;/div>
  &lt;/div>
  &lt;p class=&quot;read&quot; id=&quot;precLine&quot;>报警可信度 = 95 ÷ 590 = 16.1%&lt;/p>
  &lt;p id=&quot;precRest&quot;>意思是：随手拿起一件报了警的零件，它在长期平均里属于“真有缺陷”的部分占 16.1%，其余 83.9% 是冤枉的。&lt;/p>
  &lt;div class=&quot;card&quot;>
    &lt;h3>“误报率 5%”和“报警里只有 5% 是误报”是不是同一句话？&lt;/h3>
    &lt;p>不是。这两句话的分子可以是同一个数，分母却换了对象。&lt;/p>
    &lt;p>&lt;b>误报率 5%&lt;/b>：&lt;span id=&quot;fRateFrac&quot;>495 ÷ 9900&lt;/span>。分母是没有缺陷的 &lt;span id=&quot;fRateDen&quot;>9900&lt;/span> 件，这句话在说这群健康零件里有多少被冤枉报警。&lt;/p>
    &lt;p>&lt;b>报警里误报占 &lt;span id=&quot;fShare&quot;>83.9%&lt;/span>&lt;/b>：&lt;span id=&quot;fShareFrac&quot;>495 ÷ 590&lt;/span>。分母是全部报警的 &lt;span id=&quot;fShareDen&quot;>590&lt;/span> 件，这句话在说报警这堆货里有多少是冤枉的。&lt;/p>
    &lt;p id=&quot;fWhy&quot;>5% 之所以这么小、83.9% 之所以这么大，是因为 495 件误报摊在 9900 件健康零件上只占一点点，摊在 590 件报警上就占了大半。&lt;/p>
  &lt;/div>

  &lt;h2>五、三个参数交给你&lt;/h2>
  &lt;p>拖动滑块，上面的表格、两条分段和所有读数会一起重算。整批始终 10000 件；d 与 f 按定义各自作用在自己那群人身上，不随 p 改变。&lt;/p>
  &lt;div class=&quot;ctrl&quot;>
    &lt;label for=&quot;pIn&quot;>缺陷率 p&lt;/label>
    &lt;output id=&quot;pOut&quot; for=&quot;pIn&quot;>1%&lt;/output>
    &lt;input type=&quot;range&quot; id=&quot;pIn&quot; data-presentation-parameter=&quot;p&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;1&quot;>
    &lt;p class=&quot;hint&quot;>这批零件里有多大比例真有缺陷。它决定“有缺陷”那一列有多长。&lt;/p>
  &lt;/div>
  &lt;div class=&quot;ctrl&quot;>
    &lt;label for=&quot;dIn&quot;>检出率 d&lt;/label>
    &lt;output id=&quot;dOut&quot; for=&quot;dIn&quot;>95%&lt;/output>
    &lt;input type=&quot;range&quot; id=&quot;dIn&quot; data-presentation-parameter=&quot;d&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;95&quot;>
    &lt;p class=&quot;hint&quot;>有缺陷件中会报警的比例。它只在“有缺陷”那一列里移动件数。&lt;/p>
  &lt;/div>
  &lt;div class=&quot;ctrl&quot;>
    &lt;label for=&quot;fIn&quot;>误报率 f&lt;/label>
    &lt;output id=&quot;fOut&quot; for=&quot;fIn&quot;>5%&lt;/output>
    &lt;input type=&quot;range&quot; id=&quot;fIn&quot; data-presentation-parameter=&quot;f&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;5&quot;>
    &lt;p class=&quot;hint&quot;>无缺陷件中会报警的比例。它只在“无缺陷”那一列里移动件数。&lt;/p>
  &lt;/div>
  &lt;div class=&quot;presets&quot;>
    &lt;button type=&quot;button&quot; data-preset=&quot;init&quot;>回到初始值&lt;/button>
    &lt;button type=&quot;button&quot; data-preset=&quot;sparse&quot;>缺陷更少的批次&lt;/button>
    &lt;button type=&quot;button&quot; data-preset=&quot;lowf&quot;>只把误报降到 1%&lt;/button>
    &lt;button type=&quot;button&quot; data-preset=&quot;fulld&quot;>只把检出率拉满&lt;/button>
    &lt;button type=&quot;button&quot; data-preset=&quot;zero&quot;>没有缺陷也不误报&lt;/button>
    &lt;button type=&quot;button&quot; data-preset=&quot;zerof&quot;>没有缺陷但仍误报 5%&lt;/button>
  &lt;/div>

  &lt;h2>六、为什么缺陷变少，报警就变得不可信&lt;/h2>
  &lt;p>拿两批零件对比，两批用同一个检测器：d 都是 95%，f 都是 5%，只有缺陷率不同。&lt;/p>
  &lt;table class=&quot;cmp&quot;>
    &lt;thead>
      &lt;tr>&lt;th>同一台检测器&lt;/th>&lt;th>这批 p=1%&lt;/th>&lt;th>那批 p=0.1%&lt;/th>&lt;/tr>
    &lt;/thead>
    &lt;tbody>
      &lt;tr>&lt;td>有缺陷件&lt;/td>&lt;td>100&lt;/td>&lt;td>10&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>正确报警（= 有缺陷件 × 95%）&lt;/td>&lt;td>95&lt;/td>&lt;td>9.5&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>误报（≈ 无缺陷件 × 5%）&lt;/td>&lt;td>495&lt;/td>&lt;td>499.5&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>全部报警&lt;/td>&lt;td>590&lt;/td>&lt;td>509&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>&lt;b>报警可信度&lt;/b>&lt;/td>&lt;td>&lt;b>16.1%&lt;/b>&lt;/td>&lt;td>&lt;b>1.87%&lt;/b>&lt;/td>&lt;/tr>
    &lt;/tbody>
  &lt;/table>
  &lt;p style=&quot;margin-top:10px&quot;>缺陷率从 1% 降到 0.1%，有缺陷件从 100 件掉到 10 件，正确报警跟着从 95 件掉到 9.5 件；无缺陷件从 9900 件变成 9990 件，误报几乎没动，从 495 件变成 499.5 件。分子缩小了十倍，分母却主要被那近 500 件误报撑着，于是 95÷590 变成 9.5÷509，可信度从 16.1% 掉到 1.87%。&lt;/p>
  &lt;p>这台检测器的 d 和 f 一个百分点都没变。变的是它们各自乘上的那群人有多大：正确报警乘在少数缺陷件上，误报乘在几乎整批的健康零件上。缺陷越少，这个落差越大，报警里真缺陷的份额就越低。这就是“灵敏的检测器仍然带来大量误报”的来历——灵敏说的是它在缺陷件里的表现，大量说的是它在健康件里的绝对件数。&lt;/p>
  &lt;p class=&quot;note&quot;>点上面的“缺陷更少的批次”，可以把这条对比换成你自己动手核对。&lt;/p>

  &lt;h2>七、降误报和提高检出，各自在改什么&lt;/h2>
  &lt;p>&lt;b>提高 d&lt;/b>：把“有缺陷”那一列里原本漏掉的一些件改判成报警。这一步只动这一列（当前 &lt;span id=&quot;leverDScope&quot;>100&lt;/span> 件有缺陷件），误报一件不动；分子变大，分母同步变大。&lt;/p>
  &lt;p>&lt;b>降低 f&lt;/b>：把“无缺陷”那一列里被冤枉的一些件改判成不报警。这一步只动这一列（当前 &lt;span id=&quot;leverFScope&quot;>9900&lt;/span> 件无缺陷件），正确报警一件不动；分母变小，分子不动。&lt;/p>
  &lt;p>两句话都在说“改一个百分点”，挪动的件数却差得很远，因为两个百分点乘的人群大小不同。下面用当前这组参数各走一步：&lt;/p>
  &lt;div class=&quot;card&quot;>
    &lt;p class=&quot;lever&quot; id=&quot;leverD&quot;>—&lt;/p>
    &lt;p class=&quot;lever&quot; id=&quot;leverF&quot;>—&lt;/p>
    &lt;p class=&quot;lever&quot; id=&quot;leverWhy&quot; style=&quot;margin-bottom:0&quot;>—&lt;/p>
  &lt;/div>
  &lt;p class=&quot;note&quot;>每一步都以当前参数为基准，其余两个参数保持不变。d 到 100% 或 f 到 0% 时，对应的那一步就没有空间可走了。&lt;/p>

  &lt;h2>八、一件都不报警时，这个比例怎么理解&lt;/h2>
  &lt;p id=&quot;zeroNow&quot;>—&lt;/p>
  &lt;p>把 p 拖到 0% 并且 f 拖到 0%（预设“没有缺陷也不误报”），这批零件里既没有缺陷件，也没有任何报警：分子是 0，分母也是 0。算术里 0 ÷ 0 没有结果，所以“报警件中有缺陷的比例”这时没有对象可数，说成 0% 或者 100% 都不对——它不是零，是没有定义。&lt;/p>
  &lt;p>如果 p 是 0% 但 f 还是 5%（预设“没有缺陷但仍误报”），报警会来 495 件，全是误报。分子 0、分母 495，这个比例算得出来，等于 0%：每一次报警的把握都是零。&lt;/p>
  &lt;p>两种情形的分界只在分母：分母不为零，比例就算得出来（哪怕等于 0%）；分母为零，比例就没有定义。&lt;/p>

  &lt;h2>九、把这几句带走&lt;/h2>
  &lt;ul>
    &lt;li>d 沿着“有缺陷”这一列往下数，报警可信度横着从“报警”这一行往回数。方向不同，分母就不同。&lt;/li>
    &lt;li>一次报警的把握 = 正确报警 ÷ 全部报警，而全部报警 = 有缺陷件 × d + 无缺陷件 × f。&lt;/li>
    &lt;li>缺陷率下降时，正确报警按缺陷件数缩小，误报按无缺陷件数几乎不变，所以报警可信度下降；d 与 f 都没有变。&lt;/li>
    &lt;li>提高 d 只在有缺陷那一列移件，降低 f 只在无缺陷那一列移件。同样一个百分点，挪动多少件取决于那一列有多长。&lt;/li>
    &lt;li>f=5% 讲的是健康零件里被冤枉的比例；“报警里 5% 是误报”讲的是报警堆里的构成。两者分母不同，数字自然不同。&lt;/li>
  &lt;/ul>
&lt;/div>
&lt;script>
(function(){
  var P = window.presentation || {};
  var N = 10000;
  var INIT = {p:1, d:95, f:5};
  var LIM = {p:[0,10], d:[0,100], f:[0,10]};
  var st = {p:INIT.p, d:INIT.d, f:INIT.f};
  var PRESETS = {
    init:{p:1,d:95,f:5},
    sparse:{p:0.1,d:95,f:5},
    lowf:{p:1,d:95,f:1},
    fulld:{p:1,d:100,f:5},
    zero:{p:0,d:95,f:0},
    zerof:{p:0,d:95,f:5}
  };
  function $(id){ return document.getElementById(id); }
  function clamp(k, v){
    if (!isFinite(v)) return st[k];
    var lo = LIM[k][0], hi = LIM[k][1];
    return Math.min(hi, Math.max(lo, v));
  }
  function nf(x){
    if (!isFinite(x)) return '—';
    if (Math.abs(x - Math.round(x)) &lt; 1e-9) return String(Math.round(x));
    return x.toFixed(1);
  }
  function pnum(x){
    if (!isFinite(x)) return '—';
    if (Math.abs(x) &lt; 1e-9) return '0';
    var v = x &lt; 10 ? x.toFixed(2) : x.toFixed(1);
    return v.indexOf('.') >= 0 ? v.replace(/\.?0+$/, '') : v;
  }
  function compute(s){
    var def = N * s.p / 100;
    var good = N - def;
    var tDef = def * s.d / 100;
    var miss = def - tDef;
    var fa = good * s.f / 100;
    var cr = good - fa;
    var tot = tDef + fa;
    return {def:def, good:good, tDef:tDef, miss:miss, fa:fa, cr:cr, tot:tot};
  }
  function setSeg(id, val, total){
    var el = $(id);
    if (!el) return;
    var w = total > 0 ? (val / total) * 100 : 0;
    el.style.width = Math.max(0, w).toFixed(4) + '%';
    el.style.display = val > 0 ? 'block' : 'none';
  }
  function syncInputs(){
    if ($('pIn')) $('pIn').value = st.p;
    if ($('dIn')) $('dIn').value = st.d;
    if ($('fIn')) $('fIn').value = st.f;
    $('pOut').textContent = nf(st.p) + '%';
    $('dOut').textContent = nf(st.d) + '%';
    $('fOut').textContent = nf(st.f) + '%';
    $('gridNote').textContent = '当前 p=' + nf(st.p) + '%、d=' + nf(st.d) + '%、f=' + nf(st.f) + '%。三个比例各自作用在固定的一群人身上，四格就是这群人分出来的四份。';
  }
  function render(){
    var r = compute(st);
    var prec = r.tot > 0 ? r.tDef / r.tot * 100 : NaN;

    $('cTA').textContent = nf(r.tDef);
    $('cFA').textContent = nf(r.fa);
    $('cM').textContent = nf(r.miss);
    $('cCR').textContent = nf(r.cr);
    $('rAlarm').textContent = nf(r.tot);
    $('rNoAlarm').textContent = nf(r.miss + r.cr);
    $('cDef').textContent = nf(r.def);
    $('cGood').textContent = nf(r.good);
    $('hDef').textContent = nf(r.def);
    $('hGood').textContent = nf(r.good);

    $('qDef').textContent = nf(r.def);
    $('qGood').textContent = nf(r.good);
    $('qTA').textContent = nf(r.tDef);
    $('qM').textContent = nf(r.miss);
    $('qFA').textContent = nf(r.fa);
    $('qCR').textContent = nf(r.cr);
    $('qTA2').textContent = nf(r.tDef);
    $('qFA2').textContent = nf(r.fa);
    $('qTot').textContent = nf(r.tot);

    $('dNum').textContent = nf(r.tDef);
    $('dDen').textContent = nf(r.def);
    $('dVal').textContent = nf(st.d) + '%';
    $('fNum').textContent = nf(r.fa);
    $('fDen').textContent = nf(r.good);
    $('fVal').textContent = nf(st.f) + '%';
    $('pNum').textContent = nf(r.tDef);
    $('pDen').textContent = nf(r.tot);
    $('pVal').textContent = r.tot > 0 ? pnum(prec) + '%' : '未定义（0 ÷ 0）';

    setSeg('sgTA', r.tDef, N);
    setSeg('sgM', r.miss, N);
    setSeg('sgFA', r.fa, N);
    setSeg('sgCR', r.cr, N);
    $('lTA').textContent = nf(r.tDef);
    $('lM').textContent = nf(r.miss);
    $('lFA').textContent = nf(r.fa);
    $('lCR').textContent = nf(r.cr);

    setSeg('sgT2', r.tDef, r.tot);
    setSeg('sgF2', r.fa, r.tot);
    $('l2T').textContent = nf(r.tDef);
    $('l2F').textContent = nf(r.fa);
    $('barBCap').textContent = '只数报了警的 ' + nf(r.tot) + ' 件 · 两段相加 = 全部报警';
    $('barAlarm').setAttribute('aria-label', '报警件的构成：真有缺陷 ' + nf(r.tDef) + ' 件，误报 ' + nf(r.fa) + ' 件');
    $('barAll').setAttribute('aria-label', '整批 10000 件的四段构成：正确报警 ' + nf(r.tDef) + ' 件，漏检 ' + nf(r.miss) + ' 件，误报 ' + nf(r.fa) + ' 件，正确放行 ' + nf(r.cr) + ' 件');

    $('precLine').textContent = r.tot > 0
      ? '报警可信度 = ' + nf(r.tDef) + ' ÷ ' + nf(r.tot) + ' = ' + pnum(prec) + '%'
      : '报警可信度 = 0 ÷ 0：这批没有报警，比例未定义';

    $('fRateFrac').textContent = nf(r.fa) + ' ÷ ' + nf(r.good);
    $('fRateDen').textContent = nf(r.good);
    $('fShare').textContent = r.tot > 0 ? pnum(r.fa / r.tot * 100) + '%' : '—（没有报警）';
    $('fShareFrac').textContent = nf(r.fa) + ' ÷ ' + nf(r.tot);
    $('fShareDen').textContent = nf(r.tot);

    $('precRest').textContent = r.tot > 0
      ? '意思是：随手拿起一件报了警的零件，它在长期平均里属于“真有缺陷”的部分占 ' + pnum(prec) + '%，其余 ' + pnum(100 - prec) + '% 是冤枉的。'
      : '这批零件里没有任何报警，随手拿不到“一件报了警的零件”，这句话在这里没有对象。';

    if (r.tot &lt;= 0) {
      $('fWhy').textContent = '这批零件没有任何报警，也就无从比较这两个比例。';
    } else if (r.fa &lt;= 0) {
      $('fWhy').textContent = '这批参数下一件误报都没有：' + nf(r.fa) + ' 件误报摊在 ' + nf(r.good) + ' 件健康零件上是 0%，报警堆里也就没有冤枉的。';
    } else {
      $('fWhy').textContent = pnum(r.fa / r.good * 100) + '% 之所以这么小、' + pnum(r.fa / r.tot * 100) + '% 之所以这么大，是因为 ' + nf(r.fa) + ' 件误报摊在 ' + nf(r.good) + ' 件健康零件上只占一点点，摊在 ' + nf(r.tot) + ' 件报警上就占了大半。';
    }

    $('leverDScope').textContent = nf(r.def);
    $('leverFScope').textContent = nf(r.good);
    $('barAllNote').textContent = (r.def > 0
      ? '整批里只有 ' + nf(st.p) + '% 是有缺陷的，所以左边两段被挤成一条细缝。这条细缝正好是整篇的问题所在：它很短，可是报警主要从右边那段长条里冒出来。要看清楚，就把报警件单独摊开。'
      : '这批零件里没有缺陷件，左边两段全是空的，报警只可能从右边那段长条里冒出来。');

    if (st.d >= 100) {
      $('leverD').textContent = '把 d 再提高 1 个百分点这一步已经做不了：d 已经是 100%，有缺陷件全部报警。';
    } else {
      var t2 = r.def * (st.d + 1) / 100;
      var tot2 = t2 + r.fa;
      $('leverD').textContent = '只把 d 提高 1 个百分点（p、f 不变）：正确报警 ' + nf(r.tDef) + ' → ' + nf(t2) + ' 件（多 ' + nf(t2 - r.tDef) + ' 件），全部报警 ' + nf(r.tot) + ' → ' + nf(tot2) + ' 件，报警可信度 ' + (r.tot > 0 ? pnum(prec) + '%' : '未定义') + ' → ' + (tot2 > 0 ? pnum(t2 / tot2 * 100) + '%' : '未定义') + '。';
    }
    if (st.f &lt;= 0) {
      $('leverF').textContent = '把 f 再降低 1 个百分点这一步已经做不了：f 已经是 0%，没有误报。';
    } else {
      var fa2 = r.good * (st.f - 1) / 100;
      var tot3 = r.tDef + fa2;
      $('leverF').textContent = '只把 f 降低 1 个百分点（p、d 不变）：误报 ' + nf(r.fa) + ' → ' + nf(fa2) + ' 件（少 ' + nf(r.fa - fa2) + ' 件），全部报警 ' + nf(r.tot) + ' → ' + nf(tot3) + ' 件，报警可信度 ' + (r.tot > 0 ? pnum(prec) + '%' : '未定义') + ' → ' + (tot3 > 0 ? pnum(r.tDef / tot3 * 100) + '%' : '未定义') + '。';
    }
    $('leverWhy').textContent = '同样是一步，为什么要挪动的件数差这么多：这一步里 d 作用在 ' + nf(r.def) + ' 件有缺陷件上，f 作用在 ' + nf(r.good) + ' 件无缺陷件上。';

    $('zeroNow').textContent = r.tot > 0
      ? '当前这组参数下有 ' + nf(r.tot) + ' 件报警，其中真有缺陷 ' + nf(r.tDef) + ' 件，所以可信度算得出来：' + pnum(prec) + '%。'
      : '当前这组参数下一件都不报警（全部报警 = 0），可信度是 0 ÷ 0，未定义。';
  }
  function commit(){
    if (typeof P.commitState === 'function') P.commitState();
  }
  function applyPreset(name){
    var v = PRESETS[name];
    if (!v) return;
    st.p = v.p; st.d = v.d; st.f = v.f;
    syncInputs(); render(); commit();
  }
  ['p','d','f'].forEach(function(k){
    var el = $(k + 'In');
    if (!el) return;
    el.addEventListener('input', function(){
      st[k] = clamp(k, parseFloat(el.value));
      syncInputs(); render();
    });
    el.addEventListener('change', function(){
      st[k] = clamp(k, parseFloat(el.value));
      syncInputs(); render(); commit();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function(b){
    b.addEventListener('click', function(){ applyPreset(b.getAttribute('data-preset')); });
  });
  if (typeof P.registerActionHandler === 'function') {
    P.registerActionHandler(function(action){
      if (action &amp;&amp; action.kind === 'set_parameters' &amp;&amp; action.values) {
        ['p','d','f'].forEach(function(k){
          if (typeof action.values[k] === 'number') st[k] = clamp(k, action.values[k]);
        });
        syncInputs(); render(); commit();
      }
      return Promise.resolve();
    });
  }
  if (typeof P.registerStateReader === 'function') {
    P.registerStateReader(function(){
      var r = compute(st);
      var summary = r.tot > 0
        ? 'p=' + nf(st.p) + '%、d=' + nf(st.d) + '%、f=' + nf(st.f) + '%：报警 ' + nf(r.tot) + ' 件，其中真有缺陷 ' + nf(r.tDef) + ' 件，报警可信度 ' + pnum(r.tDef / r.tot * 100) + '%。'
        : 'p=' + nf(st.p) + '%、d=' + nf(st.d) + '%、f=' + nf(st.f) + '%：这批没有任何报警，报警可信度是 0 ÷ 0，未定义。';
      return {
        values:{p:st.p, d:st.d, f:st.f},
        visible_step:null,
        observation:{
          summary:summary,
          state:{
            p_percent:st.p, d_percent:st.d, f_percent:st.f,
            defective:r.def, nondefective:r.good,
            true_alarm:r.tDef, missed:r.miss, false_alarm:r.fa, correct_reject:r.cr,
            total_alarm:r.tot,
            alarm_credibility_percent:(r.tot > 0 ? r.tDef / r.tot * 100 : null)
          }
        }
      };
    });
  }
  if (typeof P.registerStateRestorer === 'function') {
    P.registerStateRestorer(function(saved){
      var v = (saved &amp;&amp; saved.values &amp;&amp; (saved.values.page || saved.values)) || {};
      ['p','d','f'].forEach(function(k){
        if (typeof v[k] === 'number') st[k] = clamp(k, v[k]);
      });
      syncInputs(); render();
    });
  }
  syncInputs();
  render();
})();
&lt;/script>
