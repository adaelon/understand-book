&lt;body>
&lt;main>

&lt;h1>报警的零件，大多真的有缺陷吗&lt;/h1>

&lt;p class=&quot;lead&quot;>&lt;strong>按初始值直接回答：不会。&lt;/strong>10000 件、缺陷率 1%、检出率 95%、误报率 5% 时，一共 590 次报警，其中只有 95 件真有缺陷。报警件中有缺陷的比例是 95 ÷ 590 ≈ 16.1%，也就是每 6.2 次报警里大约 1 次指向真正的缺陷件。&lt;/p>

&lt;h2>两个百分比，分母是不同的人群&lt;/h2>
&lt;p>你说分不清的两句话，落在同一张表的不同行和不同列上。&lt;/p>
&lt;div class=&quot;lead&quot;>
&lt;p>&lt;strong>“缺陷件会报警的比例”＝检出率 d＝95%&lt;/strong>。它的分母是&lt;strong>全部缺陷件&lt;/strong>：这 100 件缺陷件里有 95 件报警，5 件漏检。这句话只描述缺陷件那一堆内部的情况。&lt;/p>
&lt;p>&lt;strong>“报警件中有缺陷的比例”＝95 ÷ 590 ≈ 16.1%&lt;/strong>。它的分母是&lt;strong>全部报警件&lt;/strong>：590 次报警里有 95 次落在缺陷件上。这句话把两堆产生的报警合在一起看。&lt;/p>
&lt;/div>
&lt;p>d＝95% 这个数字不随这批零件的缺陷率变化，因为它只看缺陷件内部。而一次报警有多可信，要把两堆报警合起来算，缺陷率 p 就进入了这个计算。&lt;/p>

&lt;h2>从 10000 件出发：四步算出四类结果&lt;/h2>
&lt;p>全文共用这一批零件，所有数字都是长期平均的&lt;strong>期望数量&lt;/strong>，允许出现小数。四类结果的名称固定为&lt;span class=&quot;t-true&quot;>正确报警&lt;/span>、&lt;span class=&quot;t-miss&quot;>漏检&lt;/span>、&lt;span class=&quot;t-false&quot;>误报&lt;/span>、&lt;span class=&quot;t-keep&quot;>正确放行&lt;/span>。&lt;/p>

&lt;h3>第一步：按缺陷率 p 把 10000 件分成两堆&lt;/h3>
&lt;div class=&quot;eq&quot;>缺陷件　＝ 10000 × 1% ＝ 100 件&lt;br>无缺陷件 ＝ 10000 − 100 ＝ 9900 件&lt;/div>
&lt;p>p 的范围是 0%–10%，所以无缺陷件那一堆总是大得多，这也是后面所有现象的根源。&lt;/p>

&lt;h3>第二步：用检出率 d 把缺陷件内部分开&lt;/h3>
&lt;div class=&quot;eq&quot;>正确报警 ＝ 100 × 95% ＝ 95 件&lt;br>漏检　　＝ 100 − 95 ＝ 5 件&lt;/div>
&lt;p>d 的分母是 100 件缺陷件，所以 95% 描述的是这一堆内部的检出情况。&lt;/p>

&lt;h3>第三步：用误报率 f 把无缺陷件内部分开&lt;/h3>
&lt;div class=&quot;eq&quot;>误报　　＝ 9900 × 5% ＝ 495 件&lt;br>正确放行 ＝ 9900 − 495 ＝ 9405 件&lt;/div>
&lt;p>f 的分母是 9900 件无缺陷件，所以 5% 描述的是这一堆内部的触发情况。分母大，5% 乘出来的绝对数量就大。&lt;/p>

&lt;h3>第四步：核对合计&lt;/h3>
&lt;div class=&quot;eq&quot;>95 ＋ 5 ＋ 495 ＋ 9405 ＝ 10000 件&lt;/div>
&lt;p>四类结果互不重叠，合起来正好是整批零件。&lt;/p>

&lt;h2>一次报警，究竟提供多大把握&lt;/h2>
&lt;p>把检测器给出“报警”的那些零件单独拎出来，它们来自上面两堆。&lt;/p>
&lt;div class=&quot;eq&quot;>全部报警 ＝ 正确报警 ＋ 误报 ＝ 95 ＋ 495 ＝ 590 次&lt;br>报警件中有缺陷的比例 ＝ 95 ÷ 590 ≈ 16.1%&lt;/div>
&lt;p>16.1% 的含义是：一次报警落到真正缺陷件上的机会大约是六分之一。换句话说，看到报警之后，更可能发生的情况是那 9900 件无缺陷件中的某一件偶然触发了检测器。&lt;/p>
&lt;p>这也就解释了“看起来很灵敏”的检测器为什么仍然制造大量误报：d＝95% 只说明缺陷件里绝大多数会被抓住，它没有对那 9900 件无缺陷件做出任何承诺；而后者数量是前者的 99 倍，即使只有 5% 触发，绝对数量也远超正确报警。&lt;/p>

&lt;h2>为什么缺陷更少，报警就更不可信&lt;/h2>
&lt;p>把两种报警的数量做成比值，可以直接看出它由什么决定：&lt;/p>
&lt;div class=&quot;eq&quot;>误报 ÷ 正确报警 ＝ (无缺陷件 × f) ÷ (缺陷件 × d)&lt;br>　　　　　　　　　＝ ((1 − p) ÷ p) × (f ÷ d)&lt;/div>
&lt;p>固定 d 与 f 时，这个比值只由 p 决定：p 越小，(1−p)/p 越大。以同一台检测器（d＝95%、f＝5%）换一批缺陷更少的零件，p 从 1% 降到 0.5%：&lt;/p>
&lt;div class=&quot;eq&quot;>缺陷件 50 件　→ 正确报警 47.5 件&lt;br>无缺陷件 9950 件 → 误报 497.5 件&lt;br>全部报警 545 次　→ 47.5 ÷ 545 ≈ 8.7%&lt;/div>
&lt;p>正确报警从 95 件掉到 47.5 件，正好减半；误报从 495 件变成 497.5 件，几乎没动。原因是正确报警乘的是 p，批次越稀它越小；误报乘的是 (1−p)，那堆几乎没变，所以它的绝对数量也几乎不变。分子腰斩、分母基本不变，比值自然被拉低。&lt;/p>

&lt;h2>两个旋钮各自在改变什么&lt;/h2>
&lt;p>用同一个初始情形（p＝1%、d＝95%、f＝5%）单独动一个参数，可以看出它们作用在不同的位置上。&lt;/p>
&lt;h3>提高检出率 d：只增加分子里的正确报警&lt;/h3>
&lt;div class=&quot;eq&quot;>d＝99% → 正确报警 99 件，误报仍 495 件，99 ÷ 594 ≈ 16.7%&lt;br>d＝100% → 100 ÷ 595 ≈ 16.8%&lt;/div>
&lt;p>即使把检出率提到 100%，比例也只到 16.8%。这个上限可以写成 p ÷ (p + (1−p)·f)：它只取决于缺陷率和误报率。在很稀的批次里，提高 d 抓得住更多真缺陷，却治不了“真缺陷本来就少”这件事。&lt;/p>
&lt;h3>降低误报率 f：只减少分母里的误报&lt;/h3>
&lt;div class=&quot;eq&quot;>f＝1%　 → 误报 99 件，95 ÷ 194 ≈ 49.0%&lt;br>f＝0.1% → 误报 9.9 件，95 ÷ 104.9 ≈ 90.6%&lt;/div>
&lt;p>f 下降时，正确报警仍是 95 件，被移走的全是误报，所以比例会一路升上去。f 趋近 0 时，上限也就被拆掉了。两个旋钮的分工因此很清楚：d 负责别漏掉真缺陷，f 负责别让大量完好的零件把报警淹没。&lt;/p>

&lt;h2>“误报率 5%”等于“报警里 5% 是误报”吗&lt;/h2>
&lt;p>不等于，两个百分比量的是不同人群里的比例。&lt;/p>
&lt;ul>
&lt;li>5% 的分母是 &lt;strong>9900 件无缺陷件&lt;/strong>，它回答“无缺陷件里有多少会报警”，产生的数量是 495 件。&lt;/li>
&lt;li>“报警里误报占多少”的分母是 &lt;strong>590 次报警&lt;/strong>，它是 495 ÷ 590 ≈ 83.9%。&lt;/li>
&lt;/ul>
&lt;p>两者要接近，需要两堆零件数量相当，也就是 p 接近 50%。本场景 p 最多 10%，两堆至少相差 9 倍，所以报警里误报占多数是常态。同样是“5%”，在 590 次报警这一侧量出来的结果是 83.9%。&lt;/p>

&lt;h2>如果某组参数下根本没有报警&lt;/h2>
&lt;p>总报警等于“缺陷件 × d”加上“无缺陷件 × f”。要让它为 0，需要 f＝0，并且是 p＝0 或 d＝0 之一。这时报警件中有缺陷的比例的分子和分母同时为 0，它&lt;strong>没有定义&lt;/strong>：这批里一次报警都没有，谈不上报警有多可信，说 0% 或 100% 都不对。&lt;/p>
&lt;p>另有一种看起来相似的 0 需要区分：p＝0 但 f＞0 时，报警全部来自无缺陷件，比例确实是 0.0%，这是有定义的 0，含义是“报警里没有一件真有缺陷”。下面的交互区会把这两种情况分别显示。&lt;/p>

&lt;section class=&quot;panel&quot; id=&quot;lab&quot; aria-labelledby=&quot;lab-title&quot;>
&lt;h2 id=&quot;lab-title&quot;>自己核对：拖动三个参数看报警构成&lt;/h2>
&lt;p class=&quot;note&quot;>改任一滑块，四格表、两条堆叠条和右侧读数会同时重算。数字都是期望数量，可以出现小数。&lt;/p>

&lt;div class=&quot;controls&quot;>
  &lt;div class=&quot;ctl&quot;>
    &lt;div class=&quot;ctlhead&quot;>&lt;label for=&quot;s-p&quot;>缺陷率 p&lt;/label>&lt;output id=&quot;o-p&quot; for=&quot;s-p&quot;>1.0%&lt;/output>&lt;/div>
    &lt;input id=&quot;s-p&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;1&quot;>
    &lt;p class=&quot;note&quot;>范围 0%–10%。p 决定两堆的大小：缺陷件 = 10000 × p。&lt;/p>
  &lt;/div>
  &lt;div class=&quot;ctl&quot;>
    &lt;div class=&quot;ctlhead&quot;>&lt;label for=&quot;s-d&quot;>检出率 d&lt;/label>&lt;output id=&quot;o-d&quot; for=&quot;s-d&quot;>95%&lt;/output>&lt;/div>
    &lt;input id=&quot;s-d&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;95&quot;>
    &lt;p class=&quot;note&quot;>范围 0%–100%。分母是缺陷件：这部分缺陷件会报警。&lt;/p>
  &lt;/div>
  &lt;div class=&quot;ctl&quot;>
    &lt;div class=&quot;ctlhead&quot;>&lt;label for=&quot;s-f&quot;>误报率 f&lt;/label>&lt;output id=&quot;o-f&quot; for=&quot;s-f&quot;>5.0%&lt;/output>&lt;/div>
    &lt;input id=&quot;s-f&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;5&quot;>
    &lt;p class=&quot;note&quot;>范围 0%–10%。分母是无缺陷件：这部分完好的零件也会报警。&lt;/p>
  &lt;/div>
&lt;/div>

&lt;div class=&quot;presets&quot; role=&quot;group&quot; aria-label=&quot;预设参数组&quot;>
  &lt;button type=&quot;button&quot; id=&quot;b-init&quot; data-p=&quot;1&quot; data-d=&quot;95&quot; data-f=&quot;5&quot; aria-pressed=&quot;true&quot;>初始值&lt;/button>
  &lt;button type=&quot;button&quot; id=&quot;b-half&quot; data-p=&quot;0.5&quot; data-d=&quot;95&quot; data-f=&quot;5&quot; aria-pressed=&quot;false&quot;>缺陷率减半&lt;/button>
  &lt;button type=&quot;button&quot; id=&quot;b-lowf&quot; data-p=&quot;1&quot; data-d=&quot;95&quot; data-f=&quot;1&quot; aria-pressed=&quot;false&quot;>误报降到 1%&lt;/button>
  &lt;button type=&quot;button&quot; id=&quot;b-highd&quot; data-p=&quot;1&quot; data-d=&quot;99&quot; data-f=&quot;5&quot; aria-pressed=&quot;false&quot;>检出率提到 99%&lt;/button>
  &lt;button type=&quot;button&quot; id=&quot;b-none&quot; data-p=&quot;1&quot; data-d=&quot;0&quot; data-f=&quot;0&quot; aria-pressed=&quot;false&quot;>无报警&lt;/button>
&lt;/div>

&lt;p class=&quot;params&quot;>当前参数：p＝&lt;span id=&quot;r-p&quot;>1.0%&lt;/span>，d＝&lt;span id=&quot;r-d&quot;>95%&lt;/span>，f＝&lt;span id=&quot;r-f&quot;>5.0%&lt;/span>　｜　批次 10000 件&lt;/p>

&lt;div style=&quot;overflow-x:auto;margin-top:.6em&quot;>
&lt;table id=&quot;grid&quot;>
  &lt;caption>同一批 10000 件零件的期望数量（行＝真实状态，列＝检测器结论）&lt;/caption>
  &lt;thead>
    &lt;tr>&lt;th scope=&quot;col&quot;>真实&lt;br>状态&lt;/th>&lt;th scope=&quot;col&quot;>检测器&lt;br>报警&lt;/th>&lt;th scope=&quot;col&quot;>检测器&lt;br>不报警&lt;/th>&lt;th scope=&quot;col&quot;>行&lt;br>合计&lt;/th>&lt;/tr>
  &lt;/thead>
  &lt;tbody>
    &lt;tr>
      &lt;th scope=&quot;row&quot;>有缺陷&lt;/th>
      &lt;td>&lt;b id=&quot;g-true&quot;>95.0&lt;/b>&lt;small>正确报警&lt;/small>&lt;/td>
      &lt;td>&lt;b id=&quot;g-miss&quot;>5.0&lt;/b>&lt;small>漏检&lt;/small>&lt;/td>
      &lt;td>&lt;b id=&quot;g-def&quot;>100.0&lt;/b>&lt;small>缺陷件&lt;/small>&lt;/td>
    &lt;/tr>
    &lt;tr>
      &lt;th scope=&quot;row&quot;>无缺陷&lt;/th>
      &lt;td>&lt;b id=&quot;g-false&quot;>495.0&lt;/b>&lt;small>误报&lt;/small>&lt;/td>
      &lt;td>&lt;b id=&quot;g-keep&quot;>9405.0&lt;/b>&lt;small>正确放行&lt;/small>&lt;/td>
      &lt;td>&lt;b id=&quot;g-snd&quot;>9900.0&lt;/b>&lt;small>无缺陷件&lt;/small>&lt;/td>
    &lt;/tr>
    &lt;tr>
      &lt;th scope=&quot;row&quot; class=&quot;tot&quot;>列合计&lt;/th>
      &lt;td>&lt;b id=&quot;g-alarm&quot;>590.0&lt;/b>&lt;small>全部报警&lt;/small>&lt;/td>
      &lt;td>&lt;b id=&quot;g-silent&quot;>9410.0&lt;/b>&lt;small>全部不报警&lt;/small>&lt;/td>
      &lt;td>&lt;b id=&quot;g-all&quot;>10000.0&lt;/b>&lt;small>总计&lt;/small>&lt;/td>
    &lt;/tr>
  &lt;/tbody>
&lt;/table>
&lt;/div>

&lt;h3>四类结果在这一批里各占多少&lt;/h3>
&lt;div class=&quot;stack&quot; id=&quot;bar-all&quot; role=&quot;img&quot; aria-label=&quot;四类结果的构成条&quot;>
  &lt;span id=&quot;seg-true&quot; style=&quot;background:var(--c-true);width:0.95%&quot;>&lt;/span>
  &lt;span id=&quot;seg-miss&quot; style=&quot;background:var(--c-miss);width:0.05%&quot;>&lt;/span>
  &lt;span id=&quot;seg-false&quot; style=&quot;background:var(--c-false);width:4.95%&quot;>&lt;/span>
  &lt;span id=&quot;seg-keep&quot; style=&quot;background:var(--c-keep);width:94.05%&quot;>&lt;/span>
&lt;/div>
&lt;ul class=&quot;legend&quot;>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-true)&quot;>&lt;/span>正确报警&lt;/li>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-miss)&quot;>&lt;/span>漏检&lt;/li>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-false)&quot;>&lt;/span>误报&lt;/li>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-keep)&quot;>&lt;/span>正确放行&lt;/li>
&lt;/ul>

&lt;h3>把报警这一列单独拉出来&lt;/h3>
&lt;div class=&quot;stack&quot; id=&quot;bar-alarm&quot; role=&quot;img&quot; aria-label=&quot;报警件的构成条&quot;>
  &lt;span id=&quot;seg2-true&quot; style=&quot;background:var(--c-true);width:16.1%&quot;>&lt;/span>
  &lt;span id=&quot;seg2-false&quot; style=&quot;background:var(--c-false);width:83.9%&quot;>&lt;/span>
&lt;/div>
&lt;ul class=&quot;legend&quot;>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-true)&quot;>&lt;/span>正确报警&lt;/li>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--c-false)&quot;>&lt;/span>误报&lt;/li>
&lt;/ul>

&lt;div class=&quot;readout&quot;>
  &lt;span class=&quot;bignum&quot; id=&quot;r-prec&quot;>16.1%&lt;/span>
  &lt;p>报警件中有缺陷的比例 ＝ &lt;span id=&quot;r-frac&quot;>95.0 ÷ 590.0&lt;/span>&lt;/p>
  &lt;p id=&quot;r-plain&quot;>每 6.2 次报警里，大约 1 次指向真有缺陷的零件。&lt;/p>
  &lt;p id=&quot;r-share&quot;>报警里误报占 83.9%（495.0 ÷ 590.0）。&lt;/p>
  &lt;p id=&quot;r-ratio&quot;>误报数是正确报警数的 5.2 倍：((1−p)÷p)×(f÷d)＝99.0 × 0.053＝5.2。&lt;/p>
&lt;/div>

&lt;p class=&quot;warn&quot; id=&quot;r-zero&quot; hidden=&quot;&quot;>这批里一次报警都没有：正确报警和误报同时为 0，所以“报警件中有缺陷的比例”的分母为 0，它没有定义。此时谈不上一次报警有多大把握；说 0% 或 100% 都不对。&lt;/p>

&lt;p class=&quot;note&quot; style=&quot;margin-top:.8em&quot;>读法提示：只按住 p 向左拖，d 和 f 不动，你会看到正确报警按比例缩小、误报几乎不变，比例读数掉得比 p 快；只按住 f 向左拖，正确报警始终不动，比例读数一路升高。&lt;/p>
&lt;/section>

&lt;/main>

&lt;script>
(function(){
  var N = 10000;
  var state = {p:1, d:95, f:5};

  function $(id){ return document.getElementById(id); }
  function setText(id, t){ var e = $(id); if(e){ e.textContent = t; } }
  function w(id, frac){ var e = $(id); if(e){ e.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(3) + '%'; } }
  function fmt(v){ return v.toFixed(1); }
  function pct(x){ return (x * 100).toFixed(1) + '%'; }

  function calc(s){
    var def = N * s.p / 100;
    var snd = N - def;
    var t = def * s.d / 100;
    var m = def - t;
    var fa = snd * s.f / 100;
    var keep = snd - fa;
    var al = t + fa;
    var silent = m + keep;
    return {def:def, snd:snd, t:t, m:m, fa:fa, keep:keep, al:al, silent:silent};
  }

  function render(){
    var c = calc(state);

    setText('g-true', fmt(c.t));
    setText('g-miss', fmt(c.m));
    setText('g-false', fmt(c.fa));
    setText('g-keep', fmt(c.keep));
    setText('g-def', fmt(c.def));
    setText('g-snd', fmt(c.snd));
    setText('g-alarm', fmt(c.al));
    setText('g-silent', fmt(c.silent));
    setText('g-all', fmt(N));

    setText('o-p', state.p.toFixed(1) + '%');
    setText('o-d', state.d.toFixed(0) + '%');
    setText('o-f', state.f.toFixed(1) + '%');
    setText('r-p', state.p.toFixed(1) + '%');
    setText('r-d', state.d.toFixed(0) + '%');
    setText('r-f', state.f.toFixed(1) + '%');

    w('seg-true', c.t / N);
    w('seg-miss', c.m / N);
    w('seg-false', c.fa / N);
    w('seg-keep', c.keep / N);
    w('seg2-true', c.al > 0 ? c.t / c.al : 0);
    w('seg2-false', c.al > 0 ? c.fa / c.al : 0);
    $('bar-all').setAttribute('aria-label', '四类结果构成：正确报警 ' + fmt(c.t) + '，漏检 ' + fmt(c.m) + '，误报 ' + fmt(c.fa) + '，正确放行 ' + fmt(c.keep) + ' 件');
    $('bar-alarm').setAttribute('aria-label', '全部报警 ' + fmt(c.al) + ' 次，其中正确报警 ' + fmt(c.t) + '，误报 ' + fmt(c.fa));

    var zero = (c.al &lt;= 1e-9);
    $('r-zero').hidden = !zero;

    if(zero){
      setText('r-prec', '—');
      setText('r-frac', fmt(c.t) + ' ÷ ' + fmt(c.al));
      setText('r-plain', '这批里没有报警，比例没有分母，无从谈起。');
      setText('r-share', '没有报警，也就没有“报警里误报占多少”这个比例。');
      setText('r-ratio', '误报 ÷ 正确报警：两者都是 0，比值同样没有定义。');
    } else if(c.t &lt;= 1e-9){
      setText('r-prec', '0.0%');
      setText('r-frac', fmt(c.t) + ' ÷ ' + fmt(c.al));
      setText('r-plain', '报警全部来自无缺陷件：报警件中没有一件真有缺陷。');
      setText('r-share', '报警里误报占 ' + pct(c.fa / c.al) + '（' + fmt(c.fa) + ' ÷ ' + fmt(c.al) + '）。');
      setText('r-ratio', '误报数是正确报警数的无穷多倍：正确报警为 0，比值没有上限。');
    } else {
      setText('r-prec', pct(c.t / c.al));
      setText('r-frac', fmt(c.t) + ' ÷ ' + fmt(c.al));
      setText('r-plain', '每 ' + (c.al / c.t).toFixed(1) + ' 次报警里，大约 1 次指向真有缺陷的零件。');
      setText('r-share', '报警里误报占 ' + pct(c.fa / c.al) + '（' + fmt(c.fa) + ' ÷ ' + fmt(c.al) + '）。');
      var rp = (1 - state.p / 100) / (state.p / 100);
      var rd = state.f / state.d;
      setText('r-ratio', '误报数是正确报警数的 ' + (c.fa / c.t).toFixed(1) + ' 倍：((1−p)÷p)×(f÷d)＝' + rp.toFixed(1) + ' × ' + rd.toFixed(3) + '＝' + (rp * rd).toFixed(1) + '。');
    }

    var btns = document.querySelectorAll('.presets button');
    for(var i = 0; i &lt; btns.length; i++){
      var b = btns[i];
      var same = (Math.abs(parseFloat(b.getAttribute('data-p')) - state.p) &lt; 1e-9) &amp;&amp;
                 (Math.abs(parseFloat(b.getAttribute('data-d')) - state.d) &lt; 1e-9) &amp;&amp;
                 (Math.abs(parseFloat(b.getAttribute('data-f')) - state.f) &lt; 1e-9);
      b.setAttribute('aria-pressed', same ? 'true' : 'false');
    }
  }

  function apply(s){
    state.p = clamp(s.p, 0, 10);
    state.d = clamp(s.d, 0, 100);
    state.f = clamp(s.f, 0, 10);
    $('s-p').value = state.p;
    $('s-d').value = state.d;
    $('s-f').value = state.f;
    render();
  }

  function clamp(v, lo, hi){
    var n = Number(v);
    if(!isFinite(n)){ return lo; }
    return Math.min(hi, Math.max(lo, n));
  }

  $('s-p').addEventListener('input', function(){
    state.p = clamp(this.value, 0, 10);
    setText('o-p', state.p.toFixed(1) + '%');
    render();
  });
  $('s-d').addEventListener('input', function(){
    state.d = clamp(this.value, 0, 100);
    setText('o-d', state.d.toFixed(0) + '%');
    render();
  });
  $('s-f').addEventListener('input', function(){
    state.f = clamp(this.value, 0, 10);
    setText('o-f', state.f.toFixed(1) + '%');
    render();
  });

  var btns = document.querySelectorAll('.presets button');
  for(var i = 0; i &lt; btns.length; i++){
    btns[i].addEventListener('click', function(){
      apply({
        p: parseFloat(this.getAttribute('data-p')),
        d: parseFloat(this.getAttribute('data-d')),
        f: parseFloat(this.getAttribute('data-f'))
      });
      if(window.presentation &amp;&amp; window.presentation.commitState){ window.presentation.commitState(); }
    });
  }

  render();

  if(window.presentation){
    if(window.presentation.registerStateReader){
      window.presentation.registerStateReader(function(){
        var c = calc(state);
        return {
          values: {p: state.p, d: state.d, f: state.f},
          visible_step: null,
          observation: {
            summary: 'p=' + state.p.toFixed(1) + '%，d=' + state.d.toFixed(0) + '%，f=' + state.f.toFixed(1) + '%；全部报警 ' + fmt(c.al) + ' 次，其中正确报警 ' + fmt(c.t) + '、误报 ' + fmt(c.fa) + '；报警件中有缺陷的比例 ' + (c.al > 0 ? pct(c.t / c.al) : '无定义'),
            state: {
              part_count: N,
              defect_rate_percent: state.p,
              detection_rate_percent: state.d,
              false_alarm_rate_percent: state.f,
              defective_parts: c.def,
              sound_parts: c.snd,
              correct_alarms: c.t,
              missed: c.m,
              false_alarms: c.fa,
              correct_releases: c.keep,
              all_alarms: c.al,
              precision: c.al > 0 ? c.t / c.al : null
            }
          }
        };
      });
    }
    if(window.presentation.registerStateRestorer){
      window.presentation.registerStateRestorer(function(saved){
        if(!saved){ return; }
        var v = saved.values || saved;
        if(v &amp;&amp; v.page){ v = v.page; }
        if(!v){ return; }
        apply({
          p: (typeof v.p === 'number') ? v.p : 1,
          d: (typeof v.d === 'number') ? v.d : 95,
          f: (typeof v.f === 'number') ? v.f : 5
        });
      });
    }
  }
})();
&lt;/script>

&lt;/body>&lt;/html>"></iframe></body></html>
