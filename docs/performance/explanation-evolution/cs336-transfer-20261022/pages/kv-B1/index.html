&lt;p class=&quot;lead&quot;>模型装进 24 GiB 显卡之后，有两块占用就固定了：模型权重 10 GiB，其他运行开销 2 GiB，合计 &lt;b>12 GiB 固定占用&lt;/b>。此后仍然会往上涨的，是给每个已缓存 token 保存的 K/V 缓存。这篇讲解先说明这份缓存记住的是什么，再解释 32、8、128、B、T、s 这些数为什么连乘，最后落到&quot;这台机器装不装得下&quot;的判断，并附一个可以自己拖动参数的计算器。&lt;/p>

&lt;section class=&quot;panel&quot;>
&lt;h2>一、K/V 缓存记住的是什么&lt;/h2>
&lt;p>模型在每一层处理一个 token 时，会用这一层的权重把它变成一对向量。K 向量像这张 token 的&quot;检索标签&quot;，同一层里，后面进到这个位置的 token 靠它判断该关注前面哪些位置；V 向量是被关注时真正被取走的内容。这对向量算过一次就不会再变，后面每来一个新 token 都要回头和全部历史比对，所以必须把它们存下来重复使用。缓存里存的就是这些已经算过的 K 和 V。&lt;/p>

&lt;/svg>
&lt;p class=&quot;note&quot;>示意：每行是一层，每格是一个缓存头，左块是 K、右块是 V；实际每行 8 个格、每格 128 个元素。整张表只对应&quot;一个 token 在一条序列里&quot;。&lt;/p>

&lt;p>这里回答了你最初的疑问：权重是模型装进去就定下来的常量，缓存是运行期不断追加的记录。对话每多一个 token，每条序列就多一行这样的记录；只要这条对话还活着，旧记录就不能扔，因为下一个 token 还要回头看全部历史。同时服务多个用户时，每条对话各自留一份，互不共享。所以模型装好之后，显存还会继续往上涨。&lt;/p>
&lt;/section>

&lt;section class=&quot;panel&quot;>
&lt;h2>二、这些数为什么要相乘&lt;/h2>
&lt;p>用你熟悉的话说：把一条序列的缓存看成一个数组，维度依次是 [token][层][头][K 或 V][元素]。数组里元素的总数等于各维长度相乘，因为每一维上的每一种取值组合都对应一个真实存下来的数，没有任何两组组合共用同一个格子。这正是连乘的理由。&lt;/p>
&lt;div class=&quot;chain&quot;>
&lt;span class=&quot;chip&quot;>32 层&lt;/span>&lt;span class=&quot;op&quot;>×&lt;/span>
&lt;span class=&quot;chip&quot;>8 个头&lt;/span>&lt;span class=&quot;op&quot;>×&lt;/span>
&lt;span class=&quot;chip&quot;>K、V 各一份 = 2&lt;/span>&lt;span class=&quot;op&quot;>×&lt;/span>
&lt;span class=&quot;chip&quot;>128 元素&lt;/span>&lt;span class=&quot;op&quot;>=&lt;/span>
&lt;span class=&quot;chip result-chip&quot;>65,536 元素 /（token·序列）&lt;/span>
&lt;/div>
&lt;p class=&quot;note&quot;>这个 65,536 只和模型结构有关，与 B、T、s 都无关：它是&quot;一个 token 在一条序列里&quot;的记录量。它同时也是 2 的整数次幂（2¹⁶），后面的除法因此很干净。&lt;/p>
&lt;p>三个可调参数分别放大其中一维：&lt;/p>
&lt;ul>
&lt;li>&lt;b>B（并发序列数）&lt;/b>放大&quot;序列&quot;这一维。B 条对话各有一份完整记录，内容不共享，所以整张表复制 B 份。&lt;/li>
&lt;li>&lt;b>T（每条序列的缓存长度）&lt;/b>放大&quot;token&quot;这一维：一条序列上一共存了多少个 token 的记录。&lt;/li>
&lt;li>&lt;b>s（每个元素几个字节）&lt;/b>不增加元素个数，它把元素数换算成字节数。&lt;/li>
&lt;/ul>
&lt;div class=&quot;formula&quot;>KV 字节数 = B × T × 32 × 8 × 2 × 128 × s = B × T × 65,536 × s&lt;/div>
&lt;div class=&quot;formula&quot;>KV 缓存（GiB）= B × T × 65,536 × s ÷ 2³⁰ = B × T × s ÷ 16,384&lt;/div>
&lt;p>第二个式子里的 16,384 只来自单位换算：65,536 ÷ 2³⁰ = 1 ÷ 16,384。它和你的参数无关，也不代表新增了什么物理量。判断容量时用 GiB 计，比一路数到十亿字节要省事。&lt;/p>
&lt;/section>

&lt;section class=&quot;panel&quot;>
&lt;h2>三、固定占用与会增长的占用&lt;/h2>
&lt;p>这台机器的账分两块：&lt;/p>
&lt;table class=&quot;cmp&quot;>
&lt;tbody>&lt;tr>&lt;th>占用&lt;/th>&lt;th>这次模型里的数值&lt;/th>&lt;th>由什么决定&lt;/th>&lt;/tr>
&lt;tr>&lt;td>模型权重&lt;/td>&lt;td>10 GiB&lt;/td>&lt;td>模型装进显卡时定下来，运行中不变&lt;/td>&lt;/tr>
&lt;tr>&lt;td>其他运行开销&lt;/td>&lt;td>2 GiB&lt;/td>&lt;td>固定，与 B、T、s 无关&lt;/td>&lt;/tr>
&lt;tr>&lt;td>K/V 缓存&lt;/td>&lt;td>B × T × s ÷ 16,384 GiB&lt;/td>&lt;td>随并发数、缓存长度、每元素字节数增长&lt;/td>&lt;/tr>
&lt;/tbody>&lt;/table>
&lt;div class=&quot;formula&quot;>合计占用 = 12 GiB + B × T × s ÷ 16,384 GiB ≤ 24 GiB&lt;/div>
&lt;p>把固定部分扣掉，留给 K/V 缓存的上限就是 24 − 12 = &lt;b>12 GiB&lt;/b>。所以判断装不装得下，等价于问一句：KV 缓存有没有超过 12 GiB。恰好等于 12 GiB（也就是合计恰好 24 GiB）时容量用满但没溢出，算装得下。&lt;/p>
&lt;/section>

&lt;section class=&quot;panel&quot;>
&lt;h2>四、用初始参数算一遍：B＝4、T＝8192、s＝2&lt;/h2>
&lt;ol class=&quot;steps&quot;>
&lt;li>一个 token 的元素数：32 × 8 × 2 × 128 = &lt;b>65,536&lt;/b> 个元素；乘 s＝2 字节，得 &lt;b>131,072 字节&lt;/b>，也就是 128 KiB。&lt;/li>
&lt;li>一条序列：8192 个 token × 128 KiB = 1,048,576 KiB = 1024 MiB = &lt;b>1 GiB&lt;/b>。&lt;/li>
&lt;li>四条序列：4 × 1 GiB = &lt;b>4 GiB&lt;/b> 的 KV 缓存。&lt;/li>
&lt;li>合计：12 GiB 固定占用 + 4 GiB = &lt;b>16 GiB&lt;/b>，低于 24 GiB，还剩 &lt;b>8 GiB&lt;/b>。&lt;/li>
&lt;/ol>
&lt;p>直接用公式一步校验：4 × 8192 × 2 ÷ 16,384 = 65,536 ÷ 16,384 = 4 GiB，与逐条相加的结果一致。这一步值得动手核一次，因为后面所有判断都用同一把尺子。&lt;/p>
&lt;/section>

&lt;section class=&quot;panel&quot;>
&lt;h2>五、拖动参数，看这 24 GiB 还剩多少&lt;/h2>
&lt;div class=&quot;controls&quot;>
  &lt;div class=&quot;ctrl&quot;>
    &lt;label for=&quot;bRange&quot;>并发序列数 B &lt;span class=&quot;hint&quot;>1–16，整数&lt;/span>&lt;/label>
    &lt;output id=&quot;bOut&quot; for=&quot;bRange&quot;>4&lt;/output>
    &lt;input id=&quot;bRange&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;16&quot; step=&quot;1&quot; value=&quot;4&quot; data-presentation-parameter=&quot;B&quot;>
  &lt;/div>
  &lt;div class=&quot;ctrl&quot;>
    &lt;label for=&quot;tRange&quot;>每条序列的缓存长度 T &lt;span class=&quot;hint&quot;>0–32768 token，整数&lt;/span>&lt;/label>
    &lt;output id=&quot;tOut&quot; for=&quot;tRange&quot;>8,192&lt;/output>
    &lt;input id=&quot;tRange&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;32768&quot; step=&quot;1&quot; value=&quot;8192&quot; data-presentation-parameter=&quot;T&quot;>
  &lt;/div>
  &lt;div class=&quot;ctrl&quot;>
    &lt;label for=&quot;sSelect&quot;>每个缓存元素占 s 字节 &lt;span class=&quot;hint&quot;>只改变 KV 缓存大小&lt;/span>&lt;/label>
    &lt;output id=&quot;sOut&quot; for=&quot;sSelect&quot;>2&lt;/output>
    &lt;select id=&quot;sSelect&quot; data-presentation-parameter=&quot;s&quot;>
      &lt;option value=&quot;1&quot;>1 字节 / 元素&lt;/option>
      &lt;option value=&quot;2&quot; selected=&quot;&quot;>2 字节 / 元素&lt;/option>
      &lt;option value=&quot;4&quot;>4 字节 / 元素&lt;/option>
    &lt;/select>
  &lt;/div>
&lt;/div>
&lt;div class=&quot;presets&quot; role=&quot;group&quot; aria-label=&quot;参数预设&quot;>
  &lt;button type=&quot;button&quot; data-preset=&quot;4,8192,2&quot;>初始：4 / 8192 / 2&lt;/button>
  &lt;button type=&quot;button&quot; data-preset=&quot;4,8192,1&quot;>s 减半：4 / 8192 / 1&lt;/button>
  &lt;button type=&quot;button&quot; data-preset=&quot;4,24576,2&quot;>恰好装满：4 / 24576 / 2&lt;/button>
  &lt;button type=&quot;button&quot; data-preset=&quot;16,32768,4&quot;>装不下：16 / 32768 / 4&lt;/button>
  &lt;button type=&quot;button&quot; data-preset=&quot;4,0,2&quot;>没有缓存：4 / 0 / 2&lt;/button>
&lt;/div>

&lt;p class=&quot;bar-title&quot;>整条宽度 = 24 GiB 上限。深蓝是随参数变化的 KV 缓存，浅灰是还没用到的空间；超出容量时，下面会单独画一条橙红条纹，长度表示超出多少。&lt;/p>
&lt;div class=&quot;track&quot; id=&quot;track&quot; role=&quot;img&quot; aria-label=&quot;24 GiB 显存占用构成条：模型权重、其他运行开销、KV 缓存、剩余空间&quot;>
  &lt;div class=&quot;seg seg-w&quot; id=&quot;segW&quot; style=&quot;width:41.6667%&quot;>&lt;/div>
  &lt;div class=&quot;seg seg-o&quot; id=&quot;segO&quot; style=&quot;width:8.3333%&quot;>&lt;/div>
  &lt;div class=&quot;seg seg-kv&quot; id=&quot;segKV&quot; style=&quot;width:16.6667%&quot;>&lt;/div>
  &lt;div class=&quot;seg seg-free&quot; id=&quot;segFree&quot; style=&quot;width:33.3333%&quot;>&lt;/div>
&lt;/div>
&lt;div class=&quot;track-ends&quot;>&lt;span>0 GiB&lt;/span>&lt;span>整条 = 24 GiB 上限&lt;/span>&lt;/div>
&lt;div class=&quot;over&quot; id=&quot;overWrap&quot; hidden=&quot;&quot;>
  &lt;div class=&quot;track track-over&quot; aria-hidden=&quot;true&quot;>
    &lt;div class=&quot;seg seg-over&quot; id=&quot;segOver&quot; style=&quot;width:0%&quot;>&lt;/div>
  &lt;/div>
  &lt;div class=&quot;note&quot; id=&quot;overLabel&quot;>&lt;/div>
&lt;/div>
&lt;ul class=&quot;legend&quot;>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--seg-w)&quot;>&lt;/span>模型权重 &lt;b id=&quot;lgW&quot;>10 GiB&lt;/b>&lt;/li>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--seg-o)&quot;>&lt;/span>其他运行开销 &lt;b id=&quot;lgO&quot;>2 GiB&lt;/b>&lt;/li>
  &lt;li>&lt;span class=&quot;sw&quot; style=&quot;background:var(--accent)&quot;>&lt;/span>K/V 缓存 &lt;b id=&quot;lgKV&quot;>4 GiB&lt;/b>&lt;/li>
  &lt;li>&lt;span class=&quot;sw&quot; id=&quot;lgFreeSwatch&quot; style=&quot;background:var(--free);border-color:#c7cedb&quot;>&lt;/span>&lt;span id=&quot;lgFreeKey&quot;>剩余空间&lt;/span> &lt;b id=&quot;lgFree&quot;>8 GiB&lt;/b>&lt;/li>
&lt;/ul>
&lt;p class=&quot;verdict&quot; id=&quot;verdict&quot; aria-live=&quot;polite&quot;>装得下：KV 缓存 4 GiB，合计 16 GiB，还剩 8 GiB 没用到。&lt;/p>

&lt;div class=&quot;readouts&quot;>
  &lt;div class=&quot;card&quot;>&lt;div class=&quot;k&quot;>每个 token 的元素数&lt;/div>&lt;div class=&quot;v&quot; id=&quot;vElem&quot;>65,536 个&lt;/div>&lt;div class=&quot;note&quot;>32 层 × 8 头 × 2（K、V）× 128 元素，与 B、T、s 无关&lt;/div>&lt;/div>
  &lt;div class=&quot;card&quot;>&lt;div class=&quot;k&quot;>每个 token 的字节数&lt;/div>&lt;div class=&quot;v&quot; id=&quot;vBpt&quot;>131,072 字节&lt;/div>&lt;div class=&quot;note&quot; id=&quot;nBpt&quot;>&lt;/div>&lt;/div>
  &lt;div class=&quot;card&quot;>&lt;div class=&quot;k&quot;>每条序列的 K/V 缓存&lt;/div>&lt;div class=&quot;v&quot; id=&quot;vPerSeq&quot;>1 GiB&lt;/div>&lt;div class=&quot;note&quot; id=&quot;nPerSeq&quot;>&lt;/div>&lt;/div>
  &lt;div class=&quot;card&quot;>&lt;div class=&quot;k&quot;>K/V 缓存合计&lt;/div>&lt;div class=&quot;v&quot; id=&quot;vKV&quot;>4 GiB&lt;/div>&lt;div class=&quot;note&quot; id=&quot;nKV&quot;>&lt;/div>&lt;/div>
  &lt;div class=&quot;card&quot;>&lt;div class=&quot;k&quot;>合计占用&lt;/div>&lt;div class=&quot;v&quot; id=&quot;vTotal&quot;>16 GiB&lt;/div>&lt;div class=&quot;note&quot; id=&quot;nTotal&quot;>&lt;/div>&lt;/div>
  &lt;div class=&quot;card&quot;>&lt;div class=&quot;k&quot; id=&quot;kMargin&quot;>剩余空间&lt;/div>&lt;div class=&quot;v&quot; id=&quot;vMargin&quot;>8 GiB&lt;/div>&lt;div class=&quot;note&quot; id=&quot;nMargin&quot;>&lt;/div>&lt;/div>
&lt;/div>

&lt;div class=&quot;answers&quot;>
  &lt;p id=&quot;maxT&quot;>&lt;/p>
  &lt;p id=&quot;marginal&quot;>&lt;/p>
  &lt;p id=&quot;doubling&quot;>&lt;/p>
&lt;/div>
&lt;/section>

&lt;section class=&quot;panel&quot;>
&lt;h2>六、你最后要能自己回答的三个问题&lt;/h2>

&lt;h3>1. 增加一条同样长的序列，要多占多少空间&lt;/h3>
&lt;p>只改 B，T 和 s 不动，那么新增的是整整一条序列的记录，也就是 T × s ÷ 16,384 GiB。初始参数下是 8192 × 2 ÷ 16,384 = &lt;b>1 GiB&lt;/b>。这个代价随条数线性叠加：B 从 4 到 5，KV 缓存从 4 GiB 变成 5 GiB，合计从 16 GiB 变成 17 GiB；再加一条就再多 1 GiB。所以并发数和 KV 缓存是正比关系，没有&quot;第二条更便宜&quot;的折扣。&lt;/p>

&lt;h3>2. 长度翻倍时，哪些量翻倍，哪些不翻&lt;/h3>
&lt;p>翻倍的是和 token 数直接相连的量：每条序列缓存的行数、KV 缓存的元素数、KV 缓存的字节数，以及 KV 缓存占用的那块显存。初始参数下 T 从 8192 到 16,384，KV 缓存从 4 GiB 变成 8 GiB，每条序列从 1 GiB 变成 2 GiB。&lt;/p>
&lt;p>保持不变的是：固定的 12 GiB、每个 token 仍然占 65,536 个元素、每个元素仍是 s 字节、24 GiB 的上限也没有变。因此合计占用只是&quot;固定部分 + 翻倍的缓存&quot;，从 16 GiB 变成 20 GiB。把合计也当成翻倍（以为要 32 GiB）是这一步最容易出的错。&lt;/p>

&lt;h3>3. 这组参数还能容纳多长的上下文&lt;/h3>
&lt;p>把判据当成不等式解：B × T × s ÷ 16,384 ≤ 12，两边整理得 T ≤ 196,608 ÷ (B × s)，再向下取整。初始 B＝4、s＝2 时，196,608 ÷ 8 = &lt;b>24,576&lt;/b> 个 token。也就是说每条序列从现在的 8192 还能涨到 24,576，再多就溢出。&lt;/p>
&lt;p>如果算出的上限超过 32,768，实际就受参数上限 32,768 的约束：例如 B＝1、s＝2 时容量允许 98,304 个 token，但这个模型里 T 只到 32,768，此时 KV 缓存只用了 4 GiB。恰好取到上限值时 KV 缓存正好 12 GiB、合计正好 24 GiB，属于装得下。&lt;/p>
&lt;/section>

&lt;section class=&quot;panel&quot;>
&lt;h2>七、装不下的情形怎么读&lt;/h2>
&lt;p>合计占用超过 24 GiB 就是装不下，缺口有确切的大小：&lt;/p>
&lt;div class=&quot;formula&quot;>超出量 = 合计 − 24 GiB = KV 缓存 − 12 GiB&lt;/div>
&lt;p>换句更直观的话：超出量就是 KV 缓存越过 12 GiB 这条线的部分。举一个明确装不下的组合：B＝16、T＝32768、s＝4。先算 KV 缓存：16 × 32768 × 4 = 2,097,152，再 ÷ 16,384 = &lt;b>128 GiB&lt;/b>；合计 12 + 128 = &lt;b>140 GiB&lt;/b>，比上限多出 &lt;b>116 GiB&lt;/b>。这个数字说明，光靠调度省一点没用，必须改参数：这一组里 T 要降到 196,608 ÷ (16 × 4) = &lt;b>3,072&lt;/b> 才刚好装满；把 s 换小或把并发降下来也同样有效。&lt;/p>
&lt;p>反过来看，这条判据也有一个乐观的地方需要清醒对待：本模型没有计入分块留白、内存碎片和临时分配。真实机器上按这里算出的上限去配置，会比&quot;刚好装满&quot;更紧一些，因为那些开销还要再从余量里扣。&lt;/p>
&lt;/section>

&lt;section class=&quot;panel&quot;>
&lt;h2>八、一页速查&lt;/h2>
&lt;ul>
&lt;li>一个 token 在一条序列里：32 × 8 × 2 × 128 = &lt;b>65,536 个元素&lt;/b>，与 B、T、s 无关。&lt;/li>
&lt;li>字节数：&lt;b>B × T × 65,536 × s&lt;/b>；换成 GiB 就是 &lt;b>B × T × s ÷ 16,384&lt;/b>。&lt;/li>
&lt;li>合计占用：&lt;b>12 GiB + KV 缓存&lt;/b>；留给 KV 的上限是 &lt;b>12 GiB&lt;/b>。&lt;/li>
&lt;li>判据：KV 缓存 ≤ 12 GiB 装得下；等于 12 GiB 也算装得下；超过多少，就超出 24 GiB 多少。&lt;/li>
&lt;li>加一条序列：多占 &lt;b>T × s ÷ 16,384 GiB&lt;/b>，与条数成正比。&lt;/li>
&lt;li>T 翻倍：KV 缓存翻倍，固定 12 GiB 不翻，合计不会翻倍。&lt;/li>
&lt;li>还能留多长：&lt;b>T ≤ 196,608 ÷ (B × s)&lt;/b>，向下取整，且不超过 32,768。&lt;/li>
&lt;/ul>
&lt;p class=&quot;note&quot;>这套算式只覆盖本题给出的教学模型：权重 10 GiB、其他开销 2 GiB、32 层的 8 个缓存头、每头 128 个元素，1 GiB 按 2³⁰ 字节计，不计留白、碎片和临时分配。换模型时，把 65,536 换成新模型的（层数 × 头数 × 2 × 每头元素数），其余步骤不变。&lt;/p>
&lt;/section>

&lt;/main>

&lt;script>
(function(){
  var GIB = 1073741824, ELEM = 65536, FIXED = 12, CAP = 24, KV_MAX = 12, T_CAP = 32768, TOKENS_BUDGET = 196608;
  var bR = document.getElementById('bRange');
  var tR = document.getElementById('tRange');
  var sR = document.getElementById('sSelect');
  var bOut = document.getElementById('bOut');
  var tOut = document.getElementById('tOut');
  var sOut = document.getElementById('sOut');
  var segW = document.getElementById('segW'), segO = document.getElementById('segO'),
      segKV = document.getElementById('segKV'), segFree = document.getElementById('segFree');
  var overWrap = document.getElementById('overWrap'), segOver = document.getElementById('segOver'),
      overLabel = document.getElementById('overLabel');
  var lgKV = document.getElementById('lgKV'), lgFree = document.getElementById('lgFree'),
      lgFreeKey = document.getElementById('lgFreeKey'), lgFreeSwatch = document.getElementById('lgFreeSwatch');
  var verdict = document.getElementById('verdict');
  var vElem = document.getElementById('vElem'), vBpt = document.getElementById('vBpt'), nBpt = document.getElementById('nBpt');
  var vPerSeq = document.getElementById('vPerSeq'), nPerSeq = document.getElementById('nPerSeq');
  var vKV = document.getElementById('vKV'), nKV = document.getElementById('nKV');
  var vTotal = document.getElementById('vTotal'), nTotal = document.getElementById('nTotal');
  var kMargin = document.getElementById('kMargin'), vMargin = document.getElementById('vMargin'), nMargin = document.getElementById('nMargin');
  var maxT = document.getElementById('maxT'), marginal = document.getElementById('marginal'), doubling = document.getElementById('doubling');
  var cur = null;
  var EPS = 1e-9;

  function fmt(x, d){
    var f = Math.pow(10, d);
    var r = Math.round(x * f) / f;
    return r.toLocaleString('zh-CN', {maximumFractionDigits: d});
  }
  function G(x){ return fmt(x, 4) + ' GiB'; }
  function BZ(n){ return n.toLocaleString('zh-CN') + ' 字节'; }
  function human(n){
    if (n === 0) return '0';
    if (n % GIB === 0) return (n / GIB).toLocaleString('zh-CN') + ' GiB';
    if (n % 1048576 === 0) return (n / 1048576).toLocaleString('zh-CN') + ' MiB';
    if (n % 1024 === 0) return (n / 1024).toLocaleString('zh-CN') + ' KiB';
    return BZ(n);
  }

  function render(){
    var B = +bR.value, T = +tR.value, s = +sR.value;
    var kv = B * T * s / 16384;
    var total = FIXED + kv;
    var free = CAP - total;
    var raw = Math.floor(TOKENS_BUDGET / (B * s));
    var tmax = Math.min(T_CAP, raw);
    var perSeq = T * s / 16384;
    cur = {B:B, T:T, s:s, kv:kv, total:total, free:free, tmax:tmax, perSeq:perSeq, raw:raw};

    bOut.textContent = String(B);
    tOut.textContent = fmt(T, 0);
    sOut.textContent = String(s);

    segW.style.width = (10 / CAP * 100) + '%';
    segO.style.width = (2 / CAP * 100) + '%';
    segKV.style.width = (Math.min(kv, KV_MAX) / CAP * 100) + '%';
    segFree.style.width = (Math.max(0, KV_MAX - kv) / CAP * 100) + '%';

    lgKV.textContent = G(kv);
    if (kv > KV_MAX + EPS){
      lgFreeKey.textContent = '超出容量';
      lgFree.textContent = G(kv - KV_MAX);
      lgFreeSwatch.style.background = 'var(--warn)';
      lgFreeSwatch.style.borderColor = 'var(--warn)';
    } else {
      lgFreeKey.textContent = '剩余空间';
      lgFree.textContent = G(KV_MAX - kv);
      lgFreeSwatch.style.background = 'var(--free)';
      lgFreeSwatch.style.borderColor = '#c7cedb';
    }

    if (kv > KV_MAX + EPS){
      var over = kv - KV_MAX;
      overWrap.hidden = false;
      segOver.style.width = (Math.min(over, CAP) / CAP * 100) + '%';
      overLabel.textContent = '橙红条纹 = 超出 24 GiB 上限的 ' + G(over) + (over > CAP ? '（这条只画到 24 GiB 宽，实际超出更多）' : '');
    } else {
      overWrap.hidden = true;
    }

    if (kv > KV_MAX + EPS){
      verdict.className = 'verdict bad';
      verdict.textContent = '装不下：K/V 缓存需要 ' + G(kv) + '，合计 ' + G(total) + '，比 24 GiB 上限多出 ' + G(kv - KV_MAX) + '。';
    } else if (kv >= KV_MAX - EPS){
      verdict.className = 'verdict exact';
      verdict.textContent = '装得下：K/V 缓存正好 ' + G(KV_MAX) + '，合计恰好 24 GiB，容量用满，仍算装得下。';
    } else {
      verdict.className = 'verdict';
      verdict.textContent = '装得下：K/V 缓存 ' + G(kv) + '，合计 ' + G(total) + '，还剩 ' + G(KV_MAX - kv) + ' 没用到。';
    }

    vElem.textContent = '65,536 个';
    vBpt.textContent = BZ(ELEM * s);
    nBpt.textContent = '= 65,536 元素 × ' + s + ' 字节（' + human(ELEM * s) + '）；s 只改字节数，元素个数不变';

    vPerSeq.textContent = G(perSeq);
    nPerSeq.textContent = '= T（' + fmt(T, 0) + ' 个 token）× 每 token ' + human(ELEM * s) + '（' + BZ(T * ELEM * s) + '）';

    vKV.textContent = G(kv);
    nKV.textContent = '= B（' + B + ' 条）× 每条 ' + G(perSeq) + (kv > 0 ? '，共 ' + BZ(B * T * ELEM * s) : '');

    vTotal.textContent = G(total);
    nTotal.textContent = '= 12 GiB 固定占用 + K/V 缓存 ' + G(kv);

    if (free >= 0){
      kMargin.textContent = '剩余空间';
      vMargin.textContent = G(free);
      vMargin.style.color = '';
      nMargin.textContent = '= 24 GiB − 合计占用；恰好 0 也算装得下';
    } else {
      kMargin.textContent = '超出多少';
      vMargin.textContent = G(-free);
      vMargin.style.color = 'var(--warn)';
      nMargin.textContent = '= 合计占用 − 24 GiB，也就是 K/V 缓存越过 12 GiB 的部分';
    }

    var a1 = '还能留多长：B＝' + B + '、s＝' + s + ' 时，留给 K/V 缓存的 12 GiB 最多支撑 T＝' + fmt(tmax, 0) + ' 个 token 的上下文。';
    if (raw > T_CAP){
      a1 += '容量侧算出的上限是 ' + fmt(raw, 0) + '，但本模型的 T 只到 32,768，所以实际取 32,768。';
    }
    if (T &lt; tmax){
      a1 += '当前 T＝' + fmt(T, 0) + '，还能再加 ' + fmt(tmax - T, 0) + ' 个 token。';
    } else if (T === tmax){
      a1 += '当前 T＝' + fmt(T, 0) + ' 正好压在这个上限上：K/V 缓存正好 12 GiB，合计正好 24 GiB，恰好装满，仍算装得下。';
    } else {
      a1 += '当前 T＝' + fmt(T, 0) + ' 已经超出上限 ' + fmt(T - tmax, 0) + ' 个 token，所以装不下。';
    }
    maxT.textContent = a1;

    var a2 = '多一条同样长的序列：T 和 s 不变时，每多一条序列多占 ' + G(perSeq) + '（= T × s ÷ 16,384）。';
    if (B >= 16){
      a2 += 'B 已经是上限 16，加不了第 17 条。';
    } else {
      a2 += 'B 从 ' + B + ' 加到 ' + (B + 1) + ' 时，K/V 缓存从 ' + G(kv) + ' 变成 ' + G(kv + perSeq) + '，合计从 ' + G(total) + ' 变成 ' + G(total + perSeq) + '。';
    }
    if (perSeq === 0){
      a2 += 'T＝0 时没有 token 需要缓存，多加序列也不增加 K/V 缓存。';
    }
    marginal.textContent = a2;

    var a3;
    if (T === 0){
      a3 = 'T＝0 时没有任何 token 被缓存，K/V 缓存是 0 GiB，合计只有固定的 12 GiB；把它翻倍仍然是 0。';
    } else {
      a3 = 'T 翻倍：从 ' + fmt(T, 0) + ' 到 ' + fmt(2 * T, 0) + ' 时，每条序列的行数、K/V 缓存的元素数、字节数和占用量都翻一倍，K/V 缓存从 ' + G(kv) + ' 到 ' + G(2 * kv) + '；固定的 12 GiB 不翻倍，所以合计从 ' + G(total) + ' 变成 ' + G(12 + 2 * kv) + '。';
      if (2 * T > T_CAP){
        a3 += '（2 × T 已超过本模型的 32,768 上限，界面只画到上限，倍数关系本身不变。）';
      }
    }
    doubling.textContent = a3;
  }

  bR.addEventListener('input', render);
  tR.addEventListener('input', render);
  sR.addEventListener('input', render);
  bR.addEventListener('change', render);
  tR.addEventListener('change', render);
  sR.addEventListener('change', render);

  var presets = document.querySelectorAll('[data-preset]');
  for (var i = 0; i &lt; presets.length; i++){
    (function(btn){
      btn.addEventListener('click', function(){
        var p = btn.getAttribute('data-preset').split(',').map(Number);
        bR.value = String(p[0]);
        tR.value = String(p[1]);
        sR.value = String(p[2]);
        render();
        try {
          if (window.presentation &amp;&amp; window.presentation.commitState) window.presentation.commitState();
        } catch (e) {}
      });
    })(presets[i]);
  }

  var P = window.presentation;
  if (P &amp;&amp; P.registerStateReader){
    P.registerStateReader(function(){
      var r = cur || {B:4, T:8192, s:2, kv:4, total:16, free:8, tmax:24576, perSeq:1};
      return {
        values: {B:r.B, T:r.T, s:r.s},
        visible_step: null,
        observation: {
          summary: 'B＝' + r.B + '、T＝' + r.T + '、s＝' + r.s + '：K/V 缓存 ' + G(r.kv) + '，合计 ' + G(r.total) + '，' + (r.free >= 0 ? '剩余 ' + G(r.free) + '，装得下' : '超出 ' + G(-r.free) + '，装不下') + '。',
          state: {
            B: r.B, T: r.T, s: r.s,
            kv_cache_GiB: r.kv,
            total_GiB: r.total,
            headroom_GiB: Math.max(0, r.free),
            overflow_GiB: Math.max(0, -r.free),
            fits: r.free >= 0,
            max_context_tokens: r.tmax,
            cost_per_extra_sequence_GiB: r.perSeq
          }
        }
      };
    });
  }
  if (P &amp;&amp; P.registerStateRestorer){
    P.registerStateRestorer(function(saved){
      var p = saved &amp;&amp; saved.values &amp;&amp; saved.values.page;
      if (p){
        if (typeof p.B === 'number') bR.value = String(Math.min(16, Math.max(1, Math.round(p.B))));
        if (typeof p.T === 'number') tR.value = String(Math.min(T_CAP, Math.max(0, Math.round(p.T))));
        if (typeof p.s === 'number'){
          var sv = Math.round(p.s);
          sR.value = (sv === 1 || sv === 2 || sv === 4) ? String(sv) : '2';
        }
      }
      render();
    });
  }
  if (P &amp;&amp; P.registerActionHandler){
    P.registerActionHandler(async function(action){
      if (!action || action.kind !== 'set_parameters') return;
      var v = action.values || action.parameters || {};
      if (typeof v.B === 'number') bR.value = String(Math.min(16, Math.max(1, Math.round(v.B))));
      if (typeof v.T === 'number') tR.value = String(Math.min(T_CAP, Math.max(0, Math.round(v.T))));
      if (typeof v.s === 'number'){
        var sv = Math.round(v.s);
        if (sv === 1 || sv === 2 || sv === 4) sR.value = String(sv);
      }
      render();
    });
  }

  render();
})();
&lt;/script>

&lt;/body>&lt;/html>"></iframe></body></html>
