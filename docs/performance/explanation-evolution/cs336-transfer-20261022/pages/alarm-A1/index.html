&lt;main>
&lt;h1>报警的零件，大多真的有缺陷吗？&lt;/h1>
&lt;p class=&quot;lead&quot;>这批有 10000 件零件，每件只有两个标签：真实状态（有缺陷 / 无缺陷）和检测结果（报警 / 不报警）。两个标签一交叉，10000 件就分成四组。下面的数字都是长期平均下的期望数量，可以带小数，不模拟某一批的随机波动；检测器的检出率和误报率不随这批零件的缺陷率变化。&lt;/p>

&lt;section aria-labelledby=&quot;s1&quot;>
&lt;h2 id=&quot;s1&quot;>一、两句话的主语不同，分母也不同&lt;/h2>
&lt;p>「缺陷件会报警的比例」先挑出有缺陷的零件，再看其中多少件报警；「报警件中有缺陷的比例」先挑出所有报警件，再看其中多少件真有缺陷。两句话的分子可以是同一批零件，分母却落在两个不同的人群上。&lt;/p>
&lt;div class=&quot;cards&quot;>
&lt;div class=&quot;card&quot;>
&lt;h3>缺陷件中报警的比例（检出率 d）&lt;/h3>
&lt;p class=&quot;muted&quot;>分母：有缺陷的 100 件&lt;/p>
&lt;p>有缺陷的零件里，95 件报了警，所以 95 ÷ 100 = 95%。这里的 95% 说的是一件有缺陷的零件被抓住的可能性。&lt;/p>
&lt;p class=&quot;eq&quot;>95 ÷ 100 = 95%&lt;/p>
&lt;/div>
&lt;div class=&quot;card&quot;>
&lt;h3>报警件中真有缺陷的比例（报警可信度）&lt;/h3>
&lt;p class=&quot;muted&quot;>分母：报警的 590 件&lt;/p>
&lt;p>报警的 590 件里，只有 95 件真有缺陷，所以 95 ÷ 590 ≈ 16.1%。这里的 16.1% 说的是一次报警有多大的把握。&lt;/p>
&lt;p class=&quot;eq&quot;>95 ÷ 590 ≈ 16.1%&lt;/p>
&lt;/div>
&lt;/div>
&lt;p>两个分式共用同一个分子「95 件正确报警」，分母换成 590 件报警件之后，结果从 95% 变成 16.1%。这就是两句容易混的原因：95% 和 16.1% 描述的是同一批 95 件零件，只是在两个不同的人群里算出的份额。&lt;/p>
&lt;h3>每个比率各自除的是哪一群人&lt;/h3>
&lt;table>
&lt;caption>初始值 p = 1%、d = 95%、f = 5% 下的分子与分母（件数为期望值）&lt;/caption>
&lt;thead>&lt;tr>&lt;th scope=&quot;col&quot;>名称&lt;/th>&lt;th scope=&quot;col&quot;>分子&lt;/th>&lt;th scope=&quot;col&quot;>分母&lt;/th>&lt;th scope=&quot;col&quot;>初始值&lt;/th>&lt;/tr>&lt;/thead>
&lt;tbody>
&lt;tr>&lt;th scope=&quot;row&quot;>缺陷率 p&lt;/th>&lt;td>有缺陷 100 件&lt;/td>&lt;td>全部 10000 件&lt;/td>&lt;td>1%&lt;/td>&lt;/tr>
&lt;tr>&lt;th scope=&quot;row&quot;>检出率 d&lt;/th>&lt;td>正确报警 95 件&lt;/td>&lt;td>有缺陷 100 件&lt;/td>&lt;td>95%&lt;/td>&lt;/tr>
&lt;tr>&lt;th scope=&quot;row&quot;>漏检率 1 − d&lt;/th>&lt;td>漏检 5 件&lt;/td>&lt;td>有缺陷 100 件&lt;/td>&lt;td>5%&lt;/td>&lt;/tr>
&lt;tr>&lt;th scope=&quot;row&quot;>误报率 f&lt;/th>&lt;td>误报 495 件&lt;/td>&lt;td>无缺陷 9900 件&lt;/td>&lt;td>5%&lt;/td>&lt;/tr>
&lt;tr>&lt;th scope=&quot;row&quot;>报警可信度&lt;/th>&lt;td>正确报警 95 件&lt;/td>&lt;td>报警 590 件&lt;/td>&lt;td>16.1%&lt;/td>&lt;/tr>
&lt;/tbody>
&lt;/table>
&lt;/section>

&lt;section aria-labelledby=&quot;s2&quot;>
&lt;h2 id=&quot;s2&quot;>二、拖动参数，看四类数量怎么变&lt;/h2>
&lt;p>三个滑块分别控制缺陷率 p、检出率 d、误报率 f。每动一下，下面的四类数量、条块长度和报警可信度会一起重算。不拖动时，页面显示的就是初始值 p = 1%、d = 95%、f = 5% 的结果。&lt;/p>

&lt;div class=&quot;ctl&quot;>
&lt;div class=&quot;ctl-head&quot;>&lt;label for=&quot;p&quot;>缺陷率 p&lt;/label>&lt;output id=&quot;pOut&quot; for=&quot;p&quot;>1%&lt;/output>&lt;/div>
&lt;input id=&quot;p&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.1&quot; value=&quot;1&quot; data-presentation-parameter=&quot;p_percent&quot;>
&lt;p class=&quot;help&quot;>分母：本批全部 10000 件&lt;/p>
&lt;/div>
&lt;div class=&quot;ctl&quot;>
&lt;div class=&quot;ctl-head&quot;>&lt;label for=&quot;d&quot;>检出率 d&lt;/label>&lt;output id=&quot;dOut&quot; for=&quot;d&quot;>95%&lt;/output>&lt;/div>
&lt;input id=&quot;d&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;1&quot; value=&quot;95&quot; data-presentation-parameter=&quot;d_percent&quot;>
&lt;p class=&quot;help&quot;>分母：有缺陷的零件&lt;/p>
&lt;/div>
&lt;div class=&quot;ctl&quot;>
&lt;div class=&quot;ctl-head&quot;>&lt;label for=&quot;f&quot;>误报率 f&lt;/label>&lt;output id=&quot;fOut&quot; for=&quot;f&quot;>5%&lt;/output>&lt;/div>
&lt;input id=&quot;f&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;5&quot; data-presentation-parameter=&quot;f_percent&quot;>
&lt;p class=&quot;help&quot;>分母：无缺陷的零件&lt;/p>
&lt;/div>

&lt;table>
&lt;caption>这 10000 件的四类期望数量（件）。行合计是检出率的分母，列合计是报警可信度的分母。&lt;/caption>
&lt;thead>&lt;tr>&lt;th scope=&quot;col&quot;>真实状态&lt;/th>&lt;th scope=&quot;col&quot; class=&quot;col-alarm&quot;>报警&lt;/th>&lt;th scope=&quot;col&quot;>不报警&lt;/th>&lt;th scope=&quot;col&quot;>行合计&lt;/th>&lt;/tr>&lt;/thead>

&lt;td>&lt;b id=&quot;m-fn&quot;>5&lt;/b>&lt;span class=&quot;tag&quot;>漏检&lt;/span>&lt;/td>
&lt;td class=&quot;total&quot;>&lt;b id=&quot;m-D&quot;>100&lt;/b>&lt;/td>&lt;/tr>
&lt;tr>&lt;th scope=&quot;row&quot;>无缺陷&lt;span class=&quot;th-sub&quot;>误报率的分母&lt;/span>&lt;/th>
&lt;td class=&quot;col-alarm&quot;>&lt;b id=&quot;m-fa&quot;>495&lt;/b>&lt;span class=&quot;tag&quot;>误报&lt;/span>&lt;/td>
&lt;td>&lt;b id=&quot;m-tn&quot;>9405&lt;/b>&lt;span class=&quot;tag&quot;>正确放行&lt;/span>&lt;/td>
&lt;td class=&quot;total&quot;>&lt;b id=&quot;m-H&quot;>9900&lt;/b>&lt;/td>&lt;/tr>
&lt;/tbody>

&lt;td class=&quot;col-alarm total&quot;>&lt;b id=&quot;m-A&quot;>590&lt;/b>&lt;span class=&quot;tag&quot;>报警件：可信度的分母&lt;/span>&lt;/td>
&lt;td class=&quot;total&quot;>&lt;b id=&quot;m-N&quot;>9410&lt;/b>&lt;/td>
&lt;td class=&quot;total&quot;>&lt;b>10000&lt;/b>&lt;/td>&lt;/tr>
&lt;/tfoot>
&lt;/table>

&lt;span class=&quot;seg seg-ca&quot; id=&quot;seg-ca&quot;>&lt;/span>&lt;span class=&quot;seg seg-fn&quot; id=&quot;seg-fn&quot;>&lt;/span>&lt;span class=&quot;seg seg-fa&quot; id=&quot;seg-fa&quot;>&lt;/span>&lt;span class=&quot;seg seg-tn&quot; id=&quot;seg-tn&quot;>&lt;/span>
&lt;/div>
&lt;ul class=&quot;legend&quot;>
&lt;li>&lt;span class=&quot;sw sw-ca&quot;>&lt;/span>正确报警 &lt;b id=&quot;l-ca&quot;>95&lt;/b> 件&lt;/li>
&lt;li>&lt;span class=&quot;sw sw-fn&quot;>&lt;/span>漏检 &lt;b id=&quot;l-fn&quot;>5&lt;/b> 件&lt;/li>
&lt;li>&lt;span class=&quot;sw sw-fa&quot;>&lt;/span>误报 &lt;b id=&quot;l-fa&quot;>495&lt;/b> 件&lt;/li>

&lt;h3>两个比例摆在一起&lt;/h3>
&lt;div class=&quot;twin&quot;>
&lt;div class=&quot;twin-item&quot;>

&lt;p class=&quot;tv&quot;>&lt;span id=&quot;sens&quot;>95&lt;/span>&lt;span id=&quot;sensUnit&quot;>%&lt;/span>&lt;/p>

&lt;p class=&quot;muted&quot; id=&quot;alarmCap&quot;>报警件共 590 件：正确报警 95 件，误报 495 件。&lt;/p>

&lt;h3>换成下面几组参数核对&lt;/h3>
&lt;div class=&quot;presets&quot;>
&lt;button type=&quot;button&quot; data-preset=&quot;1,95,5&quot;>初始值&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;0.2,95,5&quot;>缺陷率降到 0.2%&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;1,95,1&quot;>误报率降到 1%&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;1,99,5&quot;>检出率提到 99%&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;0,95,0&quot;>一件都不报警&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;0,95,5&quot;>全部是误报&lt;/button>
&lt;/div>
&lt;p class=&quot;muted&quot;>按顺序看的结果：缺陷率 0.2% 时报警 518 件、可信度 3.7%；误报率 1% 时报警 194 件、可信度 49.0%；检出率 99% 时报警 594 件、可信度 16.7%；p = 0 且 f = 0 时报警 0 件，可信度是 0 ÷ 0，没有定义；p = 0 而 f = 5% 时报警 500 件全是误报，可信度 0%。&lt;/p>
&lt;/section>

&lt;section aria-labelledby=&quot;s3&quot;>
&lt;h2 id=&quot;s3&quot;>三、用初始值走一遍&lt;/h2>
&lt;ol>
&lt;li>有缺陷件 = 10000 × 1% = 100 件；无缺陷件 = 10000 − 100 = 9900 件。&lt;/li>
&lt;li>有缺陷的 100 件里，95% 会报警：100 × 95% = 95 件正确报警，剩下 5 件漏检。&lt;/li>
&lt;li>无缺陷的 9900 件里，5% 会报警：9900 × 5% = 495 件误报，剩下 9405 件正确放行。&lt;/li>
&lt;li>报警件 = 95 + 495 = 590 件。这就是可信度的分母。&lt;/li>
&lt;li>报警可信度 = 95 ÷ 590 ≈ 16.1%。一次报警提供的把握就是这个数：每 100 次报警，约 16 次落在真有缺陷的零件上，约 84 次落在无缺陷的零件上。&lt;/li>
&lt;/ol>
&lt;p>把四类加回去正好是全部零件：95 + 5 + 495 + 9405 = 10000。这批里被判报警的零件占 590 ÷ 10000 = 5.9%，而真正有缺陷的零件只占 1%。&lt;/p>
&lt;/section>

&lt;section aria-labelledby=&quot;s4&quot;>
&lt;h2 id=&quot;s4&quot;>四、灵敏的检测器为什么也带出大量误报&lt;/h2>
&lt;p>报警有两个来源。一个来源是有缺陷的零件，规模由缺陷件数决定：100 件。另一个来源是无缺陷的零件，规模由无缺陷件数决定：9900 件。两个池子相差约 99 倍。&lt;/p>
&lt;p>检出率作用在 100 件的小池子上：100 × 95% = 95 件。误报率作用在 9900 件的大池子上：9900 × 5% = 495 件。误报率只有 5%，乘以 99 倍大的池子，得到的件数是正确报警的五倍多。报警里自然以误报为主。&lt;/p>
&lt;p>把三个参数写成小数（p、d、f 各自在 0 到 1 之间），报警可信度就是两个池子贡献的件数之比：&lt;/p>
&lt;p class=&quot;formula&quot;>报警可信度 = (p × d) ÷ [ p × d + (1 − p) × f ]&lt;/p>
&lt;p>代入 p = 0.01、d = 0.95、f = 0.05：分子 0.0095，分母 0.0095 + 0.0495 = 0.059，相除得 0.161，也就是 16.1%。分子是无缺陷池子的对手，分母是两股报警加在一起的总量，其中 (1 − p) 这一项几乎等于 1，所以缺陷率越小，这一项越占上风。&lt;/p>
&lt;/section>

&lt;section aria-labelledby=&quot;s5&quot;>
&lt;h2 id=&quot;s5&quot;>五、换一批缺陷更少的零件，可信度为什么下降&lt;/h2>
&lt;p>保持 d = 95%、f = 5% 不变，把缺陷率从 1% 降到 0.2%：&lt;/p>
&lt;ul>
&lt;li>有缺陷件从 100 件降到 20 件，正确报警随之从 95 件降到 19 件，漏检 1 件。&lt;/li>
&lt;li>无缺陷件从 9900 件升到 9980 件，误报从 495 件升到 499 件，几乎没变。&lt;/li>
&lt;li>报警件 = 19 + 499 = 518 件，可信度 = 19 ÷ 518 ≈ 3.7%。&lt;/li>
&lt;/ul>
&lt;p>报警总数从 590 件降到 518 件，降幅不大，因为两股报警里只有小股在缩。真正变化的是报警件的成分：缺陷件贡献的那部分从 95 件掉到 19 件，而误报几乎原地不动，于是它在报警里所占的份额从 16.1% 掉到 3.7%。检出率仍是 95%，一次报警的把握却从 16% 掉到 4% 以下。极端情况是 p = 0：报警件全部来自无缺陷池子，可信度 0%。&lt;/p>
&lt;/section>

&lt;section aria-labelledby=&quot;s6&quot;>
&lt;h2 id=&quot;s6&quot;>六、降低误报率和提高检出率，各自动的是哪一块&lt;/h2>
&lt;h3>把误报率从 5% 降到 1%&lt;/h3>
&lt;p>误报作用在 9900 件上，每降 1 个百分点就少约 99 件报警：9900 × 1% = 99 件误报。报警件从 590 件降到 194 件，正确报警仍是 95 件，可信度 = 95 ÷ 194 ≈ 49.0%。这一招动的是分母里那部分误报，把不相关的零件从报警堆里拿掉。&lt;/p>
&lt;h3>把检出率从 95% 提到 99%&lt;/h3>
&lt;p>检出率作用在 100 件上，每升 1 个百分点只多约 1 件正确报警。95% 时漏检 5 件，99% 时漏检 1 件，正确报警从 95 件变成 99 件，报警件从 590 件变成 594 件，可信度 = 99 ÷ 594 ≈ 16.7%。这一招动的是分子。它的余地受缺陷件数限制：这批只有 100 件有缺陷，即使把检出率提到 100%，最多也只多找回那 5 件漏检的零件，可信度到 100 ÷ 595 ≈ 16.8%。&lt;/p>
&lt;p>两个杠杆的量级差别来自分母：误报率乘在 9900 件上，检出率乘在 100 件上。缺陷率很低时，减少误报能腾出的空间远比多抓几件缺陷大。&lt;/p>
&lt;/section>

&lt;section aria-labelledby=&quot;s7&quot;>
&lt;h2 id=&quot;s7&quot;>七、「误报率 5%」不等于「报警里 5% 是误报」&lt;/h2>
&lt;p>「误报率 5%」的分母是无缺陷的 9900 件，算出来是 495 件误报。要问「报警里有多少是误报」，分母换成 590 件报警件，答案是 495 ÷ 590 ≈ 83.9%。两个 5% 之间隔着两百多倍的件数差距和完全不同的人群。&lt;/p>
&lt;p>初始值里还有一个 5%：漏检率 1 − d = 5%，它除的是有缺陷的 100 件，只对应 5 件。同样写成 5%，一个落在 5 件上，一个落在 495 件上。看到百分数时，先问它除的是哪一群人，数量级就清楚了。&lt;/p>
&lt;/section>

&lt;section aria-labelledby=&quot;s8&quot;>
&lt;h2 id=&quot;s8&quot;>八、一件都不报警时，「报警件中的缺陷比例」怎么理解&lt;/h2>
&lt;p>报警件为 0 时，可信度是 0 ÷ 0。这个式子没有定义，既不能写成 0%，也不能写成 100%。出现这种情况的条件是两股报警同时为零：p = 0 且 f = 0（缺陷件为 0 时，检出率取什么值都不产生正确报警），或者 p 大于 0 但 d = 0 且 f = 0。这时候能说的事实是「本批没有报警发生」，而不是「报警里 0% 有缺陷」——没有报警件，就没有报警件内部的比例可言。&lt;/p>
&lt;p>和它相邻的两种情形不一样，那里分母不为零，结果有定义：p = 0 而 f 大于 0 时，报警件全部来自无缺陷的零件，可信度 0%，这个 0 说的是「每 100 次报警里真有缺陷的是 0 次」；f = 0 且 d、p 都大于 0 时，报警件全部来自有缺陷的零件，可信度 100%。页面上两组预设按钮可以直接把这两种情形调出来看。&lt;/p>
&lt;/section>

&lt;section aria-labelledby=&quot;s9&quot;>
&lt;h2 id=&quot;s9&quot;>九、把结论收起来&lt;/h2>
&lt;ul>
&lt;li>两个比例共用同一个分子，分母不同：检出率除有缺陷件，报警可信度除报警件。&lt;/li>
&lt;li>一次报警的把握由两股报警的相对大小决定，也就是由缺陷率和误报率共同决定，检出率单独并不决定它。&lt;/li>
&lt;li>缺陷率越低，无缺陷的池子越大，同样的误报率产出的误报件数越多，报警的可信度越低。&lt;/li>
&lt;li>降低误报率减少的是报警堆里的无关零件，提高检出率增加的是报警堆里的相关零件；哪一招更有效，取决于两个池子的规模。&lt;/li>
&lt;li>报警件为空时，可信度没有定义；报警件不为空时，0% 和 100% 都是正常结果。&lt;/li>
&lt;/ul>
&lt;p class=&quot;muted&quot;>页面数字按题目给定的模型计算：每件零件只有有缺陷 / 无缺陷两种状态，检测器只给出报警 / 不报警两种结果，检出率和误报率固定不变，数量是长期平均的期望值，可以是小数。不涉及复检成本、多个检测器或设备选型。&lt;/p>
&lt;/section>
&lt;/main>
&lt;script>
(function(){
  var TOTAL = 10000;
  var api = window.presentation || {};
  var init = api.initialState || {};
  function num(v, fb){ return (typeof v === 'number' &amp;&amp; isFinite(v)) ? v : fb; }
  var state = {p: num(init.p_percent, 1), d: num(init.d_percent, 95), f: num(init.f_percent, 5)};
  var pIn = document.getElementById('p');
  var dIn = document.getElementById('d');
  var fIn = document.getElementById('f');
  function el(id){ return document.getElementById(id); }
  function txt(id, v){ var e = el(id); if (e) { e.textContent = v; } }
  function fmt(n){ if (!isFinite(n)) { return '—'; } var r = Math.round(n); return Math.abs(n - r) &lt; 0.05 ? String(r) : n.toFixed(1); }
  function trim1(x){ return Math.abs(x - Math.round(x)) &lt; 0.05 ? String(Math.round(x)) : x.toFixed(1); }
  function calc(s){
    var D = TOTAL * s.p / 100;
    var H = TOTAL - D;
    var ca = D * s.d / 100;
    var fn = D - ca;
    var fa = H * s.f / 100;
    var tn = H - fa;
    var A = ca + fa;
    return {D: D, H: H, ca: ca, fn: fn, fa: fa, tn: tn, A: A, N: fn + tn, ppv: A > 0 ? ca / A : null};
  }
  function width(id, part, whole){
    var e = el(id);
    if (!e) { return; }
    if (!(whole > 0) || !(part > 0)) { e.style.display = 'none'; e.style.width = '0%'; return; }
    e.style.display = 'block';
    e.style.width = (part / whole * 100).toFixed(3) + '%';
  }
  function render(){
    var c = calc(state);
    if (pIn) { pIn.value = state.p; }
    if (dIn) { dIn.value = state.d; }
    if (fIn) { fIn.value = state.f; }
    txt('pOut', trim1(state.p) + '%');
    txt('dOut', trim1(state.d) + '%');
    txt('fOut', trim1(state.f) + '%');
    txt('m-ca', fmt(c.ca)); txt('m-fn', fmt(c.fn));
    txt('m-fa', fmt(c.fa)); txt('m-tn', fmt(c.tn));
    txt('m-D', fmt(c.D)); txt('m-H', fmt(c.H));
    txt('m-A', fmt(c.A)); txt('m-N', fmt(c.N));
    txt('l-ca', fmt(c.ca)); txt('l-fn', fmt(c.fn));
    txt('l-fa', fmt(c.fa)); txt('l-tn', fmt(c.tn));
    txt('twinDcap', c.D > 0 ? '分母：有缺陷的 ' + fmt(c.D) + ' 件' : '分母：有缺陷的 0 件，本批无从核对'); txt('twinA', fmt(c.A));
    txt('sensUnit', c.D > 0 ? '%' : ''); if (c.D > 0) { txt('sens', trim1(state.d)); } else { txt('sens', '—'); }
    width('seg-ca', c.ca, TOTAL); width('seg-fn', c.fn, TOTAL);
    width('seg-fa', c.fa, TOTAL); width('seg-tn', c.tn, TOTAL);
    var share = c.ppv === null ? null : (c.ppv * 100).toFixed(1);
    if (share === null) {
      txt('ppv', '无定义'); txt('ppvUnit', ''); txt('ratio', '0 ÷ 0');
      txt('ppvNote', '这一批里一件报警也没有：分子和分母同时是 0，0 ÷ 0 没有定义。此时报警件中的缺陷比例算不出来，不能填成 0%。');
    } else {
      txt('ppv', share); txt('ppvUnit', '%');
      txt('ratio', fmt(c.ca) + ' ÷ ' + fmt(c.A));
      if (c.ca &lt;= 0) {
        txt('ppvNote', '报警的 ' + fmt(c.A) + ' 件全部来自无缺陷的零件，可信度是 0%。这里分母不为零，0% 是一个有定义的结果。');
      } else if (c.fa &lt;= 0) {
        txt('ppvNote', '报警的 ' + fmt(c.A) + ' 件全部来自有缺陷的零件，可信度是 100%。');
      } else {
        txt('ppvNote', '每 100 次报警里，约 ' + share + ' 次来自真有缺陷的零件，其余约 ' + (100 - parseFloat(share)).toFixed(1) + ' 次来自无缺陷零件。');
      }
    }
    var abar = el('alarmBar');
    if (c.A > 0) {
      if (abar) { abar.classList.remove('empty'); }
      width('seg-ca2', c.ca, c.A); width('seg-fa2', c.fa, c.A);
      txt('alarmCap', '报警件共 ' + fmt(c.A) + ' 件：正确报警 ' + fmt(c.ca) + ' 件，误报 ' + fmt(c.fa) + ' 件。');
    } else {
      if (abar) { abar.classList.add('empty'); }
      width('seg-ca2', 0, 1); width('seg-fa2', 0, 1);
      txt('alarmCap', '这批没有报警件，报警件内部无从分解，也就没有可信度可言。');
    }
    var bar = el('bar');
    if (bar) {
      bar.setAttribute('aria-label', '10000 件中的期望分布：正确报警 ' + fmt(c.ca) + ' 件、漏检 ' + fmt(c.fn) + ' 件、误报 ' + fmt(c.fa) + ' 件、正确放行 ' + fmt(c.tn) + ' 件。');
    }
  }
  function bind(inp, key){
    if (!inp) { return; }
    inp.addEventListener('input', function(){ state[key] = parseFloat(inp.value); render(); });
    inp.addEventListener('change', function(){ state[key] = parseFloat(inp.value); render(); if (api.commitState) { api.commitState(); } });
  }
  bind(pIn, 'p'); bind(dIn, 'd'); bind(fIn, 'f');
  var buttons = document.querySelectorAll('[data-preset]');
  for (var i = 0; i &lt; buttons.length; i++) {
    buttons[i].addEventListener('click', function(){
      var v = this.getAttribute('data-preset').split(',');
      state.p = parseFloat(v[0]); state.d = parseFloat(v[1]); state.f = parseFloat(v[2]);
      render();
      if (api.commitState) { api.commitState(); }
    });
  }
  if (typeof api.registerStateReader === 'function') {
    api.registerStateReader(function(){
      var c = calc(state);
      var summary = c.ppv === null
        ? '缺陷率 ' + trim1(state.p) + '%、检出率 ' + trim1(state.d) + '%、误报率 ' + trim1(state.f) + '% 时，这批 10000 件里没有报警件，报警件中的缺陷比例没有定义。'
        : '缺陷率 ' + trim1(state.p) + '%、检出率 ' + trim1(state.d) + '%、误报率 ' + trim1(state.f) + '% 时，报警 ' + fmt(c.A) + ' 件，其中 ' + fmt(c.ca) + ' 件真有缺陷，报警可信度 ' + (c.ppv * 100).toFixed(1) + '%。';
      return {
        values: {p_percent: state.p, d_percent: state.d, f_percent: state.f},
        visible_step: null,
        observation: {
          summary: summary,
          state: {
            p_percent: state.p,
            d_percent: state.d,
            f_percent: state.f,
            defective: fmt(c.D),
            correct_alarm: fmt(c.ca),
            missed: fmt(c.fn),
            false_alarm: fmt(c.fa),
            alarms: fmt(c.A),
            ppv_percent: c.ppv === null ? null : parseFloat((c.ppv * 100).toFixed(1))
          }
        }
      };
    });
  }
  if (typeof api.registerStateRestorer === 'function') {
    api.registerStateRestorer(function(saved){
      var v = saved &amp;&amp; saved.values &amp;&amp; saved.values.page ? saved.values.page : null;
      if (!v) { return; }
      if (typeof v.p_percent === 'number') { state.p = v.p_percent; }
      if (typeof v.d_percent === 'number') { state.d = v.d_percent; }
      if (typeof v.f_percent === 'number') { state.f = v.f_percent; }
      render();
    });
  }
  if (typeof api.registerActionHandler === 'function') {
    api.registerActionHandler(function(action){
      if (!action) { return; }
      var v = action.values || action.parameters || {};
      if (typeof v.p_percent === 'number') { state.p = v.p_percent; }
      if (typeof v.d_percent === 'number') { state.d = v.d_percent; }
      if (typeof v.f_percent === 'number') { state.f = v.f_percent; }
      render();
    });
  }
  render();
})();
&lt;/script>

&lt;/body>&lt;/html>"></iframe></body></html>
