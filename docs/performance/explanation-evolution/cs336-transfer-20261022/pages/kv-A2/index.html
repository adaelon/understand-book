&lt;h1>一张显卡能留住多少上下文？&lt;/h1>
&lt;p class=&quot;lead&quot;>装好模型的显卡，显存里同时住着两笔账：一笔装进去就不再变，一笔随对话变长、并发变多而持续长大。这篇讲解用一套具体配置把两笔账分开算清：每个已缓存的 token 占多少、三条参数变化时哪些量跟着变、最后怎样判断这台机器装不装得下。所有数字都来自同一套教学模型，最后有一个参数实验台，供你把上面读到的关系自己动手验一遍。&lt;/p>

&lt;h2>一、两笔账：装进去的，和越用越多的&lt;/h2>
&lt;p>模型权重占 10 GiB。它是模型本身的参数，装进显存后大小就定了，跑一段对话、十个对话，它都是 10 GiB。&lt;/p>
&lt;p>另有一笔固定开销 2 GiB，用于推理过程中模型固定要预留的运行空间。它同样与对话长短无关。这两笔合起来是 12 GiB，下文称为&lt;strong>固定占用&lt;/strong>。&lt;/p>
&lt;p>剩下的部分才是会变动的那笔，称为 &lt;strong>K/V 缓存&lt;/strong>。它记录的是已经处理过的 token 在模型内部留下的中间结果，模型每多读一个 token、每多接一条序列，这份记录就多一截。&lt;/p>
&lt;div class=&quot;formula&quot;>显存总量 24 GiB ＝ 固定占用 12 GiB ＋ K/V 缓存&lt;br>可留给缓存的预算 ＝ 24 GiB − 12 GiB ＝ 12 GiB&lt;/div>
&lt;div class=&quot;bar&quot; role=&quot;img&quot; aria-label=&quot;24 GiB 显存中，12 GiB 是固定占用，另 12 GiB 可留给 K/V 缓存&quot;>
  &lt;div class=&quot;seg-fixed&quot; style=&quot;width:50%&quot;>&lt;/div>
  &lt;div class=&quot;seg-budget&quot; style=&quot;width:50%&quot;>&lt;/div>
&lt;/div>
&lt;div class=&quot;axis&quot;>&lt;span>0&lt;/span>&lt;span>12 GiB&lt;/span>&lt;span>24 GiB&lt;/span>&lt;/div>
&lt;div class=&quot;legend&quot;>&lt;span>&lt;i class=&quot;sw sw-fixed&quot;>&lt;/i>固定占用 12 GiB（权重 10 + 其他开销 2）&lt;/span>&lt;span>&lt;i class=&quot;sw sw-budget&quot;>&lt;/i>可留给缓存 12 GiB&lt;/span>&lt;/div>
&lt;p>于是容量判断只有一条：K/V 缓存填到 12 GiB 以内就装得下，正好等于 12 GiB 也算装得下；超过 12 GiB 就装不下。后文所有计算都只是在算这一笔缓存有多大。&lt;/p>

&lt;h2>二、K/V 缓存到底记住了什么&lt;/h2>
&lt;p>生成下一个 token 时，模型要让新 token 去“查看”它前面每一个 token。这个查看动作发生在每一层、每个缓存头上，用的是前面那些 token 当时算出的两样东西：&lt;strong>K&lt;/strong>（用来和其他 token 比相似度，决定该关注谁）和 &lt;strong>V&lt;/strong>（被取用的内容载体）。&lt;/p>
&lt;p>前面那些 token 的 K 和 V 一旦算出来，后面的每一步都要重复使用，重算一遍代价很大。所以模型把它们写进显存留着，这就是 K/V 缓存。缓存里存的单位很具体：对每一个已缓存的 token，在每一层、每个缓存头上，存一份 K 向量和一份 V 向量。&lt;/p>
&lt;p>你在应用里熟悉的数组直觉可以直接搬过来，只是维度多一些。把整个缓存看成一个多维数组：&lt;/p>
&lt;div class=&quot;formula&quot;>cache[ B ][ T ][ 32 层 × 8 头 ][ K 或 V ][ 128 元素 ]&lt;/div>
&lt;p>B 是并发序列数（同时处理的对话条数），T 是每条序列已缓存的 token 数，数组的元素是 s 字节的数。你熟悉的“数组元素占内存”在这里完全同构：缓存总量就是元素个数乘以每个元素的字节数。区别在于，这个数组的 B 和 T 两维由实际请求撑大，所以模型装好了，它还会继续长。&lt;/p>
&lt;p>由此可以直接回答开头那个疑问：显存继续涨，涨的是这份逐 token 的存档，权重和其他固定开销始终是 12 GiB。&lt;/p>

&lt;h2>三、为什么这些数量要相乘&lt;/h2>
&lt;p>把数组的每一维摊开，就得到一条乘法链。&lt;strong>每一维都对应一次复制&lt;/strong>：多一层，就多存一层的那一份；多一个头，就多一份；多一个 token，就多一份；多一条并发序列，再整体乘一次。&lt;/p>
&lt;ol class=&quot;steps&quot;>
&lt;li>单个 token、单条序列、单层单头：K 有 128 个元素，V 有 128 个元素，两者形状相同，合计 &lt;strong>256 个元素&lt;/strong>。&lt;/li>
&lt;li>一层有 8 个头：8 × 256 ＝ &lt;strong>2,048 个元素&lt;/strong>。&lt;/li>
&lt;li>模型有 32 层：32 × 2,048 ＝ &lt;strong>65,536 个元素&lt;/strong>。这个数就是“每个 token、每条序列”的开销，它与 T、B、s 都无关，只由模型结构决定。&lt;/li>
&lt;li>换成长度：一条序列缓存了 T 个 token，就有 T 份上述内容，即 T × 65,536 个元素。&lt;/li>
&lt;li>换成并发：B 条序列各自独立缓存、互不共享内容，所以再乘 B：&lt;strong>B × T × 65,536 个元素&lt;/strong>。&lt;/li>
&lt;li>换成字节：每个元素占 s 字节，乘 s 得到字节数。&lt;/li>
&lt;/ol>
&lt;div class=&quot;formula&quot;>K/V 缓存字节数 ＝ B × T × 32 × 8 × 128 × 2 × s ＝ B × T × 65,536 × s&lt;/div>
&lt;p>相加只出现在把不同性质的占用并到一起时（权重 10 GiB 加其他开销 2 GiB）。缓存内部这几维是同一份内容在层、头、token、序列上的重复，所以连乘。&lt;/p>
&lt;div class=&quot;anchor&quot;>&lt;strong>两个好用的锚点（s ＝ 2 时）：&lt;/strong>&lt;br>一个 token、一条序列的缓存 ＝ 65,536 × 2 ＝ 131,072 字节 ＝ 128 KiB。&lt;br>1 GiB ＝ 1,073,741,824 字节，除以 128 KiB 正好 8,192。所以 8,192 个 token 的缓存恰好 1 GiB；反过来，1 GiB 能存 8,192 个“token·序列”。&lt;/div>
&lt;p class=&quot;note&quot;>这里的条件要留住：正因为每条序列的缓存长度相同、内容互不共享，B 才是独立乘数。一旦序列之间能共用一部分缓存，这个乘法就不成立，按本页公式算出的容量会偏大。&lt;/p>

&lt;h2>四、把两笔账落到容量判断上&lt;/h2>
&lt;p>预算 12 GiB 换成字节是 12 × 2³⁰ ＝ 12,884,901,888 字节。装得下的条件写成：&lt;/p>
&lt;div class=&quot;formula&quot;>B × T × 65,536 × s ≤ 12,884,901,888 字节&lt;/div>
&lt;p>给定 B 和 s 时，能容下的每序列长度上限就是把预算除以“每个 token·序列的字节数”：&lt;/p>
&lt;div class=&quot;formula&quot;>T 上限 ＝ ⌊ 12,884,901,888 ÷ ( B × 65,536 × s ) ⌋，且 T 本身最多 32,768&lt;/div>
&lt;p>取整意味着上限是不会越界的那一档；恰好把预算用满也算装得下。&lt;/p>
&lt;h3>初始参数算一遍&lt;/h3>
&lt;p>B ＝ 4、T ＝ 8,192、s ＝ 2：每个 token·序列 131,072 字节；总共 4 × 8,192 ＝ 32,768 个 token·序列；32,768 × 131,072 ＝ 4,294,967,296 字节 ＝ 4 GiB。加上固定 12 GiB，总计 16 GiB，还剩 8 GiB。&lt;/p>
&lt;p>此时每条序列的长度上限：s ＝ 2 时全机可容纳 12,884,901,888 ÷ 131,072 ＝ 98,304 个 token·序列，平均给 4 条序列就是 24,576 个 token。若 B ＝ 2，按预算可到 49,152，但 T 自身最多 32,768，此时是 32,768 这个上限先卡住。&lt;/p>

&lt;h2>五、三个自问的答案&lt;/h2>
&lt;h3>1. 增加一条同样长的序列，多占多少&lt;/h3>
&lt;p>多出的量是 T × 65,536 × s。初始参数下是 8,192 × 131,072 ＝ 1,073,741,824 字节 ＝ 1 GiB，正好一整份。初始还剩 8 GiB 余量，所以还能再加 8 条：B 从 4 变成 12 时缓存 12 GiB，总计 24 GiB，正好装满，仍然算装得下；再加第 9 条就越界了。&lt;/p>
&lt;p>这条增量与 B 无关，只由当前的 T 和 s 决定：同样长度的序列，加第一条和加第八条各要 1 GiB。&lt;/p>
&lt;h3>2. 长度翻倍时，哪些量翻倍&lt;/h3>
&lt;p>保持 B 和 s 不变，T 翻倍，缓存内的 token 份数翻倍，所以 K/V 缓存翻倍；固定占用 12 GiB 一分不动；总计增加的量正好等于原来那一份缓存。初始参数把 T 从 8,192 翻到 16,384：缓存 4 GiB → 8 GiB，总计 16 GiB → 20 GiB，余量 8 GiB → 4 GiB。&lt;/p>
&lt;p>翻倍要用一下 T 的上限：T 已经是 16,384 时再想翻倍就是 32,768，刚好到顶；到顶之后就再不能靠加长上下文来翻倍了。&lt;/p>
&lt;h3>3. 这组参数还能容纳多长&lt;/h3>
&lt;p>用第四节的除法，一步得到每条序列的长度上限。初始参数（B ＝ 4、s ＝ 2）是 24,576 个 token。改 B 或 s 时这个上限按同样的比例变：B 加倍，上限减半；s 从 2 变 1，按预算算出的上限翻倍（B ＝ 4 时是 49,152，已经超过 T 的 32,768 上限，实际只能取 32,768）；s 从 2 变 4，上限减半（B ＝ 4 时是 12,288）。&lt;/p>
&lt;h3>装不下的时候会怎样&lt;/h3>
&lt;p>K/V 缓存一旦超过 12 GiB，总量就超过 24 GiB，这台机器装不下这组配置，差额就是缓存超出预算的那一截。要收回来，有三条各自起作用的路径，效果都能直接算：&lt;/p>
&lt;ul>
&lt;li>&lt;strong>减序列数 B&lt;/strong>：B 减半，缓存减半。&lt;/li>
&lt;li>&lt;strong>减长度 T&lt;/strong>：T 减半，缓存减半。这条会缩短每条序列能记住的上下文。&lt;/li>
&lt;li>&lt;strong>减小 s&lt;/strong>：s 从 4 降到 2、或从 2 降到 1，缓存减半。按本模型，s 只改变缓存的存储字节数，权重与其他开销仍是 12 GiB。&lt;/li>
&lt;/ul>
&lt;p>举例：B ＝ 16、T ＝ 16,384、s ＝ 4。每个 token·序列 65,536 × 4 ＝ 262,144 字节；token·序列总数 16 × 16,384 ＝ 262,144；缓存 262,144 × 262,144 ＝ 68,719,476,736 字节 ＝ 64 GiB，比预算多 52 GiB。把 s 降到 2，缓存减半为 32 GiB，仍超 20 GiB；再把 B 降到 8，缓存 16 GiB，仍超 4 GiB；B 降到 4 时缓存 8 GiB，总计 20 GiB，装得下。&lt;/p>

&lt;h2>六、参数实验台：自己动手验一遍&lt;/h2>
&lt;p>三档控件改的是同一份状态，下面的读数、条形和判定都跟着重算。固定占用那一段在任何参数下都不会变，这是本页最值得盯着看的一点。&lt;/p>

&lt;div class=&quot;card&quot;>
  &lt;div class=&quot;ctrl&quot;>
    &lt;div class=&quot;ctrl-head&quot;>&lt;label for=&quot;in-b&quot;>并发序列数 B&lt;/label>&lt;output id=&quot;out-b&quot;>4&lt;/output>&lt;span class=&quot;unit&quot;>条序列&lt;/span>&lt;/div>
    &lt;input id=&quot;in-b&quot; data-presentation-parameter=&quot;B&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;16&quot; step=&quot;1&quot; value=&quot;4&quot;>
  &lt;/div>
  &lt;div class=&quot;ctrl&quot;>
    &lt;div class=&quot;ctrl-head&quot;>&lt;label for=&quot;in-t&quot;>每条序列的缓存长度 T&lt;/label>&lt;output id=&quot;out-t&quot;>8,192&lt;/output>&lt;span class=&quot;unit&quot;>token&lt;/span>&lt;/div>
    &lt;input id=&quot;in-t&quot; data-presentation-parameter=&quot;T&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;32768&quot; step=&quot;1&quot; value=&quot;8192&quot;>
  &lt;/div>
  &lt;div class=&quot;ctrl&quot;>
    &lt;div class=&quot;ctrl-head&quot;>&lt;label for=&quot;in-s&quot;>缓存中每个元素占 s 字节&lt;/label>&lt;/div>
    &lt;select id=&quot;in-s&quot; data-presentation-parameter=&quot;s&quot;>
      &lt;option value=&quot;1&quot;>1 字节&lt;/option>
      &lt;option value=&quot;2&quot; selected=&quot;&quot;>2 字节&lt;/option>
      &lt;option value=&quot;4&quot;>4 字节&lt;/option>
    &lt;/select>
    &lt;p class=&quot;note&quot;>s 只改变缓存的存储字节数，权重与其他开销仍是 12 GiB。&lt;/p>
  &lt;/div>
  &lt;button class=&quot;btn&quot; id=&quot;btnReset&quot; data-presentation-action=&quot;reset&quot; type=&quot;button&quot;>回到初始参数：B ＝ 4、T ＝ 8192、s ＝ 2&lt;/button>

  &lt;div class=&quot;bar&quot; id=&quot;bar&quot; role=&quot;img&quot; aria-label=&quot;显存占用示意&quot;>
    &lt;div class=&quot;track&quot; id=&quot;track&quot;>
      &lt;div class=&quot;seg-fixed&quot; id=&quot;segFixed&quot;>&lt;/div>
      &lt;div class=&quot;seg-kv&quot; id=&quot;segKv&quot;>&lt;/div>
    &lt;/div>
    &lt;div class=&quot;seg-over&quot; id=&quot;segOver&quot;>&lt;/div>
  &lt;/div>
  &lt;div class=&quot;axis&quot; style=&quot;position:static;display:block;height:auto;margin-top:6px;color:#5a6675;font-size:.85rem;line-height:1.6&quot;>条形从 0 画到 24 GiB 显存上限：灰色是固定占用 12 GiB（灰绿交界处就是 12 GiB 预算线），绿色是当前 K/V 缓存，浅色是还没用到的余量。参数大到装不下时，右侧追加一段红色，它表示超出 24 GiB 的部分，按同样比例单独画在刻度之外。
  &lt;div class=&quot;legend&quot;>
    &lt;span>&lt;i class=&quot;sw sw-fixed&quot;>&lt;/i>固定占用 12 GiB（权重 10 + 其他 2）&lt;/span>
    &lt;span>&lt;i class=&quot;sw sw-kv&quot;>&lt;/i>&lt;span id=&quot;lgKv&quot;>K/V 缓存 4 GiB&lt;/span>&lt;/span>
    &lt;span id=&quot;lgOverWrap&quot;>&lt;i class=&quot;sw sw-over&quot;>&lt;/i>&lt;span id=&quot;lgOver&quot;>超出 0 GiB&lt;/span>&lt;/span>
  &lt;/div>

  &lt;div class=&quot;verdict ok&quot; id=&quot;verdict&quot;>装得下：还剩 8 GiB 余量&lt;/div>

  &lt;div class=&quot;stats&quot;>
    &lt;div class=&quot;stat&quot;>&lt;div class=&quot;k&quot;>K/V 缓存&lt;/div>&lt;div class=&quot;v&quot; id=&quot;kvVal&quot;>4 GiB&lt;/div>&lt;div class=&quot;sub&quot; id=&quot;kvSub&quot;>4,294,967,296 字节&lt;/div>&lt;/div>
    &lt;div class=&quot;stat&quot;>&lt;div class=&quot;k&quot;>总计占用&lt;/div>&lt;div class=&quot;v&quot; id=&quot;totalVal&quot;>16 GiB&lt;/div>&lt;div class=&quot;sub&quot; id=&quot;totalSub&quot;>上限 24 GiB&lt;/div>&lt;/div>
    &lt;div class=&quot;stat&quot;>&lt;div class=&quot;k&quot;>相对预算&lt;/div>&lt;div class=&quot;v&quot; id=&quot;spaceVal&quot;>剩 8 GiB&lt;/div>&lt;div class=&quot;sub&quot; id=&quot;spaceSub&quot;>预算即 24 − 12 = 12 GiB&lt;/div>&lt;/div>
    &lt;div class=&quot;stat&quot;>&lt;div class=&quot;k&quot;>每条序列最多缓存&lt;/div>&lt;div class=&quot;v&quot; style=&quot;white-space:nowrap&quot;>&lt;span id=&quot;tmaxVal&quot;>24,576&lt;/span>&lt;span style=&quot;font-size:.75em&quot;> token&lt;/span>&lt;/div>&lt;div class=&quot;sub&quot; id=&quot;tmaxSub&quot;>B = 4、s = 2 时每条序列的预算上限&lt;/div>&lt;/div>
    &lt;div class=&quot;stat&quot;>&lt;div class=&quot;k&quot;>再加一条同样长的序列&lt;/div>&lt;div class=&quot;v&quot; id=&quot;margVal&quot;>+1 GiB&lt;/div>&lt;div class=&quot;sub&quot; id=&quot;margSub&quot;>当前还能再加 8 条同长序列&lt;/div>&lt;/div>
  &lt;/div>

  &lt;div class=&quot;formula&quot; id=&quot;calc&quot;>KV = 4 × 8,192 × 32 层 × 8 头 × 128 元素 × 2（K 和 V）× 2 字节 = 4,294,967,296 字节 = 4 GiB&lt;/div>
&lt;/div>

&lt;h3>建议这样试&lt;/h3>
&lt;ul>
&lt;li>只拖 T 或只拖 B：看条形里绿的那段伸缩，深色的固定段一动不动。这就是“固定占用与增长占用”的区别。&lt;/li>
&lt;li>把 s 从 2 换成 1，再换成 4：绿段减半、翻倍，深色段仍不变。缓存的大小对 s 是成比例的。&lt;/li>
&lt;li>找“恰好装满”：B ＝ 3、T ＝ 32,768、s ＝ 2。此时缓存正好 12 GiB，总计 24 GiB，判定仍是可容纳。&lt;/li>
&lt;li>制造一次超界：B ＝ 16、T ＝ 16,384、s ＝ 4。条形右侧会多出一段红色的超出量，判定变成装不下，并给出差多少。&lt;/li>
&lt;li>盯住“再加一条同样长的序列”那一格：它只跟当前的 T 和 s 有关，改 B 时它不变。&lt;/li>
&lt;/ul>

&lt;h2>七、留三个判断给自己&lt;/h2>
&lt;p>下面三问的答案都能从上面的关系直接推出。先自己算，再展开对照。&lt;/p>

&lt;details>
&lt;summary>问 1：B 从 4 调到 5，T ＝ 8,192、s ＝ 2 不变，总计占用变成多少？&lt;/summary>
&lt;p>17 GiB。多出来的 1 GiB 全部落在缓存一侧：8,192 × 131,072 ＝ 1 GiB；固定占用仍是 12 GiB。缓存从 4 GiB 变 5 GiB，总计 12 ＋ 5 ＝ 17 GiB。&lt;/p>
&lt;/details>

&lt;details>
&lt;summary>问 2：B ＝ 4、s ＝ 2 不变，T 从 4,096 翻到 8,192，总计增加多少？哪些量翻倍？&lt;/summary>
&lt;p>总计从 14 GiB 增到 16 GiB，增加 2 GiB。翻倍的是缓存（2 GiB → 4 GiB）以及其中保存的 token 份数；固定 12 GiB 不变，所以总计只增加了缓存增加的那一份。&lt;/p>
&lt;/details>

&lt;details>
&lt;summary>问 3：B ＝ 6、T ＝ 32,768、s ＝ 2 装得下吗？如果装不下，差多少，T 要降到多少才刚好？&lt;/summary>
&lt;p>装不下。每个 token·序列 131,072 字节，6 × 32,768 ＝ 196,608 个 token·序列，缓存 25,769,803,776 字节 ＝ 24 GiB，比 12 GiB 预算多 12 GiB。把 T 降到 16,384 时缓存 12 GiB，正好装满预算，总计 24 GiB，可容纳。&lt;/p>
&lt;/details>

&lt;h2>八、适用范围&lt;/h2>
&lt;ul>
&lt;li>本页所有数字都在开头设定的教学模型下计算：24 GiB 显存、权重 10 GiB、其他开销 2 GiB、32 层、每层 8 个缓存头、每头 128 元素、每个 token 每层存一份 K 与一份 V，1 GiB ＝ 2³⁰ 字节。&lt;/li>
&lt;li>不计分块留白、显存碎片与临时分配，所以真实机器可用的缓存预算通常比这里的 12 GiB 更紧。&lt;/li>
&lt;li>所有并发序列的缓存长度相同，且内容互不共享；共享前缀能省下的那一部分不在本模型内。&lt;/li>
&lt;li>s 只改变缓存的存储字节数，不改变权重与其他开销；这里不讨论数值精度对效果的影响。&lt;/li>
&lt;li>K/V 缓存正好装满 12 GiB 时判为可容纳。&lt;/li>
&lt;/ul>

&lt;/div>

&lt;script>
(function(){
  var GIB=1073741824, TOTAL=24*GIB, FIXED=12*GIB, BUDGET=TOTAL-FIXED,
      ELEMS=65536, T_CAP=32768, DEFAULTS={B:4,T:8192,s:2};
  var st={B:DEFAULTS.B, T:DEFAULTS.T, s:DEFAULTS.s};

  function $(id){ return document.getElementById(id); }
  var elB=$('in-b'), elT=$('in-t'), elS=$('in-s');

  function num(n){ return Math.round(n).toLocaleString('en-US'); }
  function gib(bytes){
    var g=bytes/GIB;
    if(Math.abs(g-Math.round(g))&lt;1e-9){ return String(Math.round(g)); }
    var t=g.toFixed(3).replace(/0+$/,'');
    if(t.charAt(t.length-1)==='.'){ t=t.slice(0,-1); }
    return t;
  }
  function kvBytes(){ return st.B*st.T*ELEMS*st.s; }

  function render(){
    var kv=kvBytes(), total=FIXED+kv, head=BUDGET-kv;
    var overTotal=Math.max(0,total-TOTAL);

    $('out-b').textContent=String(st.B);
    $('out-t').textContent=num(st.T);

    $('kvVal').textContent=gib(kv)+' GiB';
    $('kvSub').textContent=num(kv)+' 字节';

    $('totalVal').textContent=gib(total)+' GiB';
    $('totalSub').textContent=(overTotal>0)?('超出上限 '+gib(overTotal)+' GiB'):'上限 24 GiB';

    $('spaceVal').textContent=(head>=0)?('剩 '+gib(head)+' GiB'):('超 '+gib(-head)+' GiB');
    $('spaceSub').textContent='预算即 24 − 12 = 12 GiB';

    var denom=st.B*ELEMS*st.s;
    var tmaxRaw=(denom>0)?Math.floor(BUDGET/denom):0;
    var tmaxShown=Math.min(tmaxRaw,T_CAP);
    $('tmaxVal').textContent=num(tmaxShown);
    $('tmaxSub').textContent=(tmaxRaw>T_CAP)
      ? ('按预算可到 '+num(tmaxRaw)+'，但 T 上限是 32,768')
      : ('B = '+st.B+'、s = '+st.s+' 时每条序列的预算上限');

    var perSeq=st.T*ELEMS*st.s;
    if(perSeq===0){
      $('margVal').textContent='+0 GiB';
      $('margSub').textContent='T = 0 时缓存为空，增加序列不增加占用';
    }else{
      $('margVal').textContent='+'+gib(perSeq)+' GiB';
      if(head>=0){
        $('margSub').textContent='当前还能再加 '+Math.floor(head/perSeq)+' 条同长序列';
      }else{
        $('margSub').textContent='已超出，需减少 '+Math.ceil((-head)/perSeq)+' 条序列才回到预算内';
      }
    }

    var v=$('verdict'), txt, cls;
    if(kv>BUDGET){ cls='bad'; txt='装不下：K/V 缓存比 12 GiB 预算多出 '+gib(kv-BUDGET)+' GiB'; }
    else if(kv===BUDGET){ cls='exact'; txt='恰好装满预算：装得下，缓存正好 12 GiB，总计 24 GiB'; }
    else { cls='ok'; txt='装得下：还剩 '+gib(BUDGET-kv)+' GiB 余量'; }
    v.className='verdict '+cls;
    v.textContent=txt;

    $('calc').textContent='KV = '+st.B+' × '+num(st.T)+' × 32 层 × 8 头 × 128 元素 × 2（K 和 V）× '+st.s+' 字节 = '+num(kv)+' 字节 = '+gib(kv)+' GiB';

    var kvInTrack=Math.min(kv,BUDGET);
    $('segFixed').style.width=(FIXED/TOTAL*100)+'%';
    $('segKv').style.width=(kvInTrack/TOTAL*100)+'%';
    var so=$('segOver');
    if(overTotal>0){ so.style.display='block'; so.style.flexGrow=String(overTotal/GIB); }
    else { so.style.display='none'; so.style.flexGrow='0'; }

    $('lgKv').textContent='K/V 缓存 '+gib(kv)+' GiB';
    $('lgOver').textContent='超出 '+gib(overTotal)+' GiB';
    $('lgOverWrap').style.display=(overTotal>0)?'inline-flex':'none';
    $('bar').setAttribute('aria-label','显存占用：固定 12 GiB，K/V 缓存 '+gib(kv)+' GiB，总计 '+gib(total)+' GiB，上限 24 GiB');
  }

  function sync(){
    elB.value=String(st.B);
    elT.value=String(st.T);
    elS.value=String(st.s);
  }
  function applyParams(p){
    if(!p){ return; }
    if(typeof p.B==='number' &amp;&amp; isFinite(p.B)){ st.B=Math.min(16,Math.max(1,Math.round(p.B))); }
    if(typeof p.T==='number' &amp;&amp; isFinite(p.T)){ st.T=Math.min(T_CAP,Math.max(0,Math.round(p.T))); }
    var sv=Number(p.s);
    if(sv===1||sv===2||sv===4){ st.s=sv; }
  }
  function readControls(){
    st.B=Number(elB.value); st.T=Number(elT.value); st.s=Number(elS.value);
  }
  function commit(){
    if(window.presentation &amp;&amp; window.presentation.commitState){ window.presentation.commitState(); }
  }

  elB.addEventListener('input',function(){ readControls(); render(); });
  elT.addEventListener('input',function(){ readControls(); render(); });
  elS.addEventListener('input',function(){ readControls(); render(); });
  elB.addEventListener('change',function(){ readControls(); render(); commit(); });
  elT.addEventListener('change',function(){ readControls(); render(); commit(); });
  elS.addEventListener('change',function(){ readControls(); render(); commit(); });
  $('btnReset').addEventListener('click',function(){
    st.B=DEFAULTS.B; st.T=DEFAULTS.T; st.s=DEFAULTS.s;
    sync(); render(); commit();
  });

  if(window.presentation &amp;&amp; window.presentation.registerStateReader){
    window.presentation.registerStateReader(function(){
      var kv=kvBytes(), head=BUDGET-kv;
      return {
        values:{B:st.B, T:st.T, s:st.s},
        visible_step:null,
        observation:{
          summary:'B='+st.B+'、T='+num(st.T)+'、s='+st.s+' 时 K/V 缓存为 '+gib(kv)+' GiB，相对 12 GiB 预算'+(head>=0?('剩余 '+gib(head)+' GiB'):('超出 '+gib(-head)+' GiB'))+'。',
          state:{B:st.B, T:st.T, s:st.s, kv_gib:Number(gib(kv)), budget_gib:12, headroom_gib:Number(gib(head))}
        }
      };
    });
  }

  if(window.presentation &amp;&amp; window.presentation.registerStateRestorer){
    window.presentation.registerStateRestorer(function(saved){
      var p=null;
      if(saved &amp;&amp; saved.values){ p=saved.values.page ? saved.values.page : saved.values; }
      applyParams(p); sync(); render();
    });
  }

  if(window.presentation &amp;&amp; window.presentation.registerActionHandler){
    window.presentation.registerActionHandler(async function(action){
      if(!action){ return; }
      if(action.kind==='set_parameters'){ applyParams(action.values||{}); sync(); render(); return; }
      if(action.kind==='invoke' &amp;&amp; action.action_id==='reset'){
        st.B=DEFAULTS.B; st.T=DEFAULTS.T; st.s=DEFAULTS.s; sync(); render(); commit(); return;
      }
    });
  }

  var initState=(window.presentation &amp;&amp; window.presentation.initialState)?window.presentation.initialState:null;
  if(initState){ applyParams({B:initState.B, T:initState.T, s:initState.s}); }
  sync();
  render();
})();
&lt;/script>

&lt;/div>&lt;/body>&lt;/html>"></iframe></body></html>
