&lt;h1>报警的零件，大多真的有缺陷吗？&lt;/h1>

&lt;p>先给结论。按你给的初始值——10000 件、缺陷率 p＝1%、检出率 d＝95%、误报率 f＝5%——期望有 590 件报警，其中只有 95 件真的存在缺陷。报警件中真有缺陷的比例约为 &lt;b>16.1%&lt;/b>：大约每 6 次报警里，有 1 次对应真缺陷。检出率 95% 说的是另一件事：100 件缺陷件里有 95 件会报警。&lt;/p>

&lt;h2>两句话，两个分母&lt;/h2>

&lt;p>两句容易混淆的话，差别只在分母换成了哪一群人。&lt;/p>

&lt;div class=&quot;scroll&quot;>
&lt;table>
  &lt;caption>初始值下的对照（件数都是期望值）&lt;/caption>
  &lt;thead>&lt;tr>&lt;th>说法&lt;/th>&lt;th>分子&lt;/th>&lt;th>分母&lt;/th>&lt;th>初始值&lt;/th>&lt;/tr>&lt;/thead>
  &lt;tbody>
    &lt;tr>&lt;th scope=&quot;row&quot;>检出率 d&lt;/th>&lt;td>缺陷且报警 95 件&lt;/td>&lt;td>有缺陷 100 件&lt;/td>&lt;td>95%&lt;/td>&lt;/tr>
    &lt;tr>&lt;th scope=&quot;row&quot;>误报率 f&lt;/th>&lt;td>无缺陷却报警 495 件&lt;/td>&lt;td>无缺陷 9900 件&lt;/td>&lt;td>5%&lt;/td>&lt;/tr>
    &lt;tr>&lt;th scope=&quot;row&quot;>报警件中真有缺陷的比例&lt;/th>&lt;td>缺陷且报警 95 件&lt;/td>&lt;td>报警 590 件&lt;/td>&lt;td>16.1%&lt;/td>&lt;/tr>
  &lt;/tbody>
&lt;/table>
&lt;/div>

&lt;p>前两行从真实状态出发，数到检测结果：在缺陷件里数，在无缺陷件里数。第三行反过来，站在结果这一侧，回看这批报警件的真实状态。&lt;/p>

&lt;p>三行的分子里都有同一批 95 件零件。分母一换，同一个 95 就从 95% 变成 16.1%。所以「检测器灵不灵」和「这次报警可不可信」是两把尺子，量的是两群不同的人。&lt;/p>

&lt;h2>从 10000 件出发，把四个格子数出来&lt;/h2>

&lt;p>每件零件只有两种真实状态，检测器只给两种结果，四个格子就把这批零件分完了。从 10000 件开始，只用乘法和减法：&lt;/p>

&lt;div class=&quot;eq&quot;>有缺陷           10000 × 1%          = 100 件
无缺陷           10000 − 100         = 9900 件
正确报警         100 × 95%           = 95 件     （有缺陷，且报警）
漏检             100 × 5%            = 5 件      （有缺陷，但没报警）
误报             9900 × 5%           = 495 件    （无缺陷，却报警）
正确放行         9900 × 95%          = 9405 件   （无缺陷，且没报警）

报警合计         95 + 495            = 590 件
报警中真有缺陷   95 ÷ 590            ≈ 16.1%
报警中其实无缺陷 495 ÷ 590           ≈ 83.9%&lt;/div>

&lt;p>四类相加正好 10000 件：95 + 5 + 495 + 9405 = 10000。这里的件数是长期平均的期望值，可以带小数，不会为了凑整数去调整。&lt;/p>

&lt;p>请注意两个 5% 落在哪里。漏检的 5 件，是 100 件缺陷件里的 5%；误报的 495 件，是 9900 件无缺陷件里的 5%。同样是 5%，一个是 5 件，一个是 495 件，因为两个人群的人数差了 99 倍。这一批零件的大部分麻烦，就出在这 495 件上。&lt;/p>

&lt;p>于是「一次报警有多大把握」有了具体答案：在你看到的这 590 件报警里，95 件是真缺陷，495 件是白跑一趟。可信度约 16.1%，而不是 95%。&lt;/p>

&lt;h2>自己动手核对&lt;/h2>

        &lt;tbody>
          &lt;tr>&lt;th scope=&quot;row&quot;>有缺陷&lt;/th>&lt;td>&lt;b>95&lt;/b>&lt;span class=&quot;mini&quot;>&lt;i class=&quot;dots&quot; style=&quot;background:#0f5c5c&quot;>&lt;/i>正确报警&lt;/span>&lt;/td>&lt;td>&lt;b>5&lt;/b>&lt;span class=&quot;mini&quot;>&lt;i class=&quot;dots&quot; style=&quot;background:#a33a3a&quot;>&lt;/i>漏检&lt;/span>&lt;/td>&lt;td>100&lt;/td>&lt;/tr>
          &lt;tr>&lt;th scope=&quot;row&quot;>无缺陷&lt;/th>&lt;td>&lt;b>495&lt;/b>&lt;span class=&quot;mini&quot;>&lt;i class=&quot;dots&quot; style=&quot;background:#e8b04b&quot;>&lt;/i>误报&lt;/span>&lt;/td>&lt;td>&lt;b>9,405&lt;/b>&lt;span class=&quot;mini&quot;>&lt;i class=&quot;dots&quot; style=&quot;background:#d7d2c4&quot;>&lt;/i>正确放行&lt;/span>&lt;/td>&lt;td>9,900&lt;/td>&lt;/tr>
          &lt;tr>&lt;th scope=&quot;row&quot;>合计&lt;/th>&lt;td>590&lt;/td>&lt;td>9,410&lt;/td>&lt;td>10,000&lt;/td>&lt;/tr>
        &lt;/tbody>
      &lt;/table>
    &lt;/div>
  &lt;/div>
&lt;/div>

&lt;h2>只换一批更干净的零件，为什么报警就更不可信&lt;/h2>

&lt;p>把 d 和 f 固定住，只改缺陷率 p。报警件中真有缺陷的比例可以写成一个只含三个参数的式子：&lt;/p>

&lt;div class=&quot;eq&quot;>报警件中真有缺陷的比例 = (p × d) / ( p × d + (1 − p) × f )&lt;/div>

&lt;p>分子 p×d 是「缺陷且报警」占全批的比例，它跟着 p 一起缩小。分母里另一块 (1 − p)×f 是误报占全批的比例；无缺陷件本来就占了绝大多数，1 − p 接近 1，所以这一块几乎不随 p 变化。&lt;/p>

&lt;p>p 从 1% 降到 0.2% 时，p×d 从 0.0095 掉到 0.0019（约 95 件变 19 件），而 (1 − p)×f 从 0.0495 挪到 0.0499（约 495 件变 499 件）。分子缩小到大约五分之一，分母基本没动，比例就跟着掉。报警总数几乎不变（590 件变 518 件），变的是这堆报警里真缺陷的份量。&lt;/p>

&lt;div class=&quot;scroll&quot;>
&lt;table>
  &lt;caption>同一台检测器（d＝95%、f＝5%），只换缺陷率 p&lt;/caption>
  &lt;thead>&lt;tr>&lt;th>缺陷率 p&lt;/th>&lt;th>有缺陷&lt;/th>&lt;th>正确报警&lt;/th>&lt;th>误报&lt;/th>&lt;th>报警合计&lt;/th>&lt;th>报警中真有缺陷&lt;/th>&lt;/tr>&lt;/thead>
  &lt;tbody>
    &lt;tr>&lt;td>2%&lt;/td>&lt;td>200&lt;/td>&lt;td>190&lt;/td>&lt;td>490&lt;/td>&lt;td>680&lt;/td>&lt;td>27.9%&lt;/td>&lt;/tr>
    &lt;tr>&lt;td>1%&lt;/td>&lt;td>100&lt;/td>&lt;td>95&lt;/td>&lt;td>495&lt;/td>&lt;td>590&lt;/td>&lt;td>16.1%&lt;/td>&lt;/tr>
    &lt;tr>&lt;td>0.5%&lt;/td>&lt;td>50&lt;/td>&lt;td>47.5&lt;/td>&lt;td>497.5&lt;/td>&lt;td>545&lt;/td>&lt;td>8.7%&lt;/td>&lt;/tr>
    &lt;tr>&lt;td>0.2%&lt;/td>&lt;td>20&lt;/td>&lt;td>19&lt;/td>&lt;td>499&lt;/td>&lt;td>518&lt;/td>&lt;td>3.7%&lt;/td>&lt;/tr>
    &lt;tr>&lt;td>0.1%&lt;/td>&lt;td>10&lt;/td>&lt;td>9.5&lt;/td>&lt;td>499.5&lt;/td>&lt;td>509&lt;/td>&lt;td>1.9%&lt;/td>&lt;/tr>
  &lt;/tbody>
&lt;/table>
&lt;/div>

&lt;p>检测器一次没变，缺陷件却越来越少，于是报警池被误报填满。这不是检测器退化了，而是它面对的这批零件里，真缺陷本来就少到撑不起报警池。&lt;/p>

&lt;h2>降低误报率、提高检出率，各自改的是哪一群&lt;/h2>

&lt;p>两个旋钮作用在不同人群上。提高 d，改的是那 100 件缺陷件：更多缺陷件被抓住，漏检变少。降低 f，改的是那 9900 件无缺陷件：更少健康零件被误判，误报变少。报警件中真有缺陷的比例的分子和分母，各被其中一个旋钮推动。&lt;/p>

&lt;div class=&quot;scroll&quot;>
&lt;table>
  &lt;caption>都从 p＝1%、d＝95%、f＝5% 出发，一次只改一个参数&lt;/caption>
  &lt;thead>&lt;tr>&lt;th>参数改动&lt;/th>&lt;th>正确报警&lt;/th>&lt;th>漏检&lt;/th>&lt;th>误报&lt;/th>&lt;th>报警合计&lt;/th>&lt;th>报警中真有缺陷&lt;/th>&lt;/tr>&lt;/thead>
  &lt;tbody>
    &lt;tr>&lt;td>不动（基准）&lt;/td>&lt;td>95&lt;/td>&lt;td>5&lt;/td>&lt;td>495&lt;/td>&lt;td>590&lt;/td>&lt;td>16.1%&lt;/td>&lt;/tr>
    &lt;tr>&lt;td>f 降到 1%&lt;/td>&lt;td>95&lt;/td>&lt;td>5&lt;/td>&lt;td>99&lt;/td>&lt;td>194&lt;/td>&lt;td>49.0%&lt;/td>&lt;/tr>
    &lt;tr>&lt;td>f 降到 0&lt;/td>&lt;td>95&lt;/td>&lt;td>5&lt;/td>&lt;td>0&lt;/td>&lt;td>95&lt;/td>&lt;td>100.0%&lt;/td>&lt;/tr>
    &lt;tr>&lt;td>d 提到 99%&lt;/td>&lt;td>99&lt;/td>&lt;td>1&lt;/td>&lt;td>495&lt;/td>&lt;td>594&lt;/td>&lt;td>16.7%&lt;/td>&lt;/tr>
    &lt;tr>&lt;td>d 提到 100%&lt;/td>&lt;td>100&lt;/td>&lt;td>0&lt;/td>&lt;td>495&lt;/td>&lt;td>595&lt;/td>&lt;td>16.8%&lt;/td>&lt;/tr>
  &lt;/tbody>
&lt;/table>
&lt;/div>

&lt;p>在 p＝1% 这一批里，d 每提高 1 个百分点，作用在 100 件缺陷件上，只多抓 1 件；f 每降低 1 个百分点，作用在 9900 件无缺陷件上，少制造 99 件误报。同样 1 个百分点，落在人数相差约 99 倍的两个人群上，对报警池的影响也就差出约 99 倍。&lt;/p>

&lt;p>这个倍数由两个人群的人数比决定，会随 p 变化。p＝10% 时是 9000 件无缺陷对 1000 件缺陷，约 9 倍。缺陷越常见，误报率与检出率的分量越接近。&lt;/p>

&lt;p>所以两个旋钮各有各的用处：提高 d 直接压的是漏检（5 件变 1 件），降低 f 直接压的是误报（495 件变 99 件）。在缺陷很少的批次里，报警可信度主要卡在误报这一头。&lt;/p>

&lt;h2>「误报率 5%」的分母是 9900，不是 590&lt;/h2>

&lt;p>按定义，5% 说的是 9900 件无缺陷件里有 495 件报警。若把它读成「报警件里 5% 是误报」，分母就换成了 590 件报警件；按 590 算，误报占 495 ÷ 590 ≈ 83.9%。&lt;/p>

&lt;p>两个数都出自同一批零件，只是回答的问题不同。5% 描述检测器对健康零件的敏感程度；83.9% 描述你走到报警队列前面时，看到的白跑一趟的比例。前者是检测器的性能，后者才是你每次收到报警时的处境。&lt;/p>

&lt;h2>一批里根本没有报警的时候&lt;/h2>

&lt;p>报警件为 0 时，「报警件中真有缺陷的比例」的分母是 0，这个比例没有可算的对象。页面在这种参数下显示「—」：它既不是 0%（0% 表示有报警，但一件都不对），也不是 100%。&lt;/p>

&lt;p>这时能说的话是：这批里一次报警都没有，报警的可信度无从谈起；漏检和正确放行的件数仍然有定义，照常可以算。按这里允许的参数范围，报警为 0 只会出现在 f＝0 且（p＝0 或 d＝0）的组合里。若 p＝0 而 f 大于 0，报警照旧出现，只是全部来自无缺陷件——这时比例是 0.0%，因为分母 500 件报警仍在。&lt;/p>

&lt;h2>回到初始值，以及一个可以自己验证的问题&lt;/h2>

&lt;p>初始值下：100 件有缺陷，95 件被抓住，5 件漏掉；9900 件无缺陷，495 件被误报，9405 件被正确放行。报警共 590 件，其中真有缺陷 95 件，约 16.1%，大约每 6 次报警 1 件真有缺陷。检测器对缺陷件很灵敏，但被它报警的零件里，大多数其实是好的。两个说法都对，因为它们的分母不同。&lt;/p>

&lt;p>一个可以现在就验证的问题：把这一批换成缺陷率 10% 的零件，d＝95%、f＝5% 都不动，报警件中真有缺陷的比例会是多少？页面上的对照表只列到 2%。先按上面的式子估一个数，再把 p 滑块拖到 10% 核对；如果估的和显示的不一样，回头检查是哪一步把无缺陷件的件数算错了。&lt;/p>

&lt;div class=&quot;card&quot;>
  &lt;p class=&quot;note&quot;>&lt;b>这批讲解的设定：&lt;/b>件数都是长期平均的期望值，允许出现小数，不模拟某一批的随机波动；检出率 d 和误报率 f 是检测器自身的性质，不随这批零件的缺陷率变化；只讨论一台检测器的一次判定，不涉及复检成本、多台检测器或设备选型。&lt;/p>
&lt;/div>

&lt;/main>
&lt;script>
(function(){
  var N = 10000;
  var COLORS = {tp:'#0f5c5c', fn:'#a33a3a', fp:'#e8b04b', tn:'#d7d2c4'};
  var NAMES  = {tp:'正确报警', fn:'漏检', fp:'误报', tn:'正确放行'};
  var state = {p:1, d:95, f:5};

  function byId(id){ return document.getElementById(id); }
  function setTxt(id, t){ var e = byId(id); if(e){ e.textContent = t; } }

  function th(v){
    var r = Math.round(v*10)/10;
    var s = (Math.abs(r - Math.round(r)) &lt; 1e-9) ? String(Math.round(r)) : r.toFixed(1);
    var k = s.split('.');
    k[0] = k[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return k.join('.');
  }
  function pct(x){ return (x*100).toFixed(1) + '%'; }

  function calc(s){
    var def = N*s.p/100, ok = N - def;
    var tp = def*s.d/100, fn = def - tp;
    var fp = ok*s.f/100,  tn = ok - fp;
    var al = tp + fp;
    return {def:def, ok:ok, tp:tp, fn:fn, fp:fp, tn:tn, al:al, ppv:(al > 1e-9 ? tp/al : null)};
  }

  function barHTML(items, total){
    var h = '&lt;div class=&quot;bar&quot; role=&quot;img&quot; aria-label=&quot;各类件数的占比条&quot;>';
    for(var i=0;i&lt;items.length;i++){
      var w = total > 0 ? items[i].v/total*100 : 0;
      if(total > 0 &amp;&amp; items[i].v > 0 &amp;&amp; w &lt; 0.15){ w = 0.15; }
      h += '&lt;span style=&quot;background:' + items[i].c + ';width:' + w.toFixed(3) + '%&quot;>&lt;/span>';
    }
    return h + '&lt;/div>';
  }

  function legendHTML(items, total){
    var h = '&lt;ul class=&quot;legend&quot;>';
    for(var i=0;i&lt;items.length;i++){
      var share = total > 0 ? (items[i].v/total*100).toFixed(1) + '%' : '—';
      h += '&lt;li>&lt;i style=&quot;background:' + items[i].c + '&quot;>&lt;/i>&lt;span>' + items[i].n + '&lt;/span>&lt;b>' + th(items[i].v) + ' 件 · ' + share + '&lt;/b>&lt;/li>';
    }
    return h + '&lt;/ul>';
  }

  function four(items){
    var out = [];
    for(var i=0;i&lt;items.length;i++){ out.push({n:NAMES[items[i]], c:COLORS[items[i]], v:0}); }
    return out;
  }

  function drawWaffle(r){
    var c = byId('waffle');
    if(!c){ return; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssw = Math.max(220, Math.round(c.clientWidth || 300));
    var size = Math.round(cssw * dpr);
    c.width = size; c.height = size; c.style.height = cssw + 'px';
    var g = c.getContext('2d');
    if(!g){ return; }
    var cell = size/100;
    g.fillStyle = COLORS.tn;
    g.fillRect(0, 0, size, size);
    var b1 = r.tp, b2 = r.tp + r.fn, b3 = r.tp + r.fn + r.fp;
    for(var i=0;i&lt;10000;i++){
      var x = i + 0.5, k = null;
      if(x &lt; b1){ k = 'tp'; } else if(x &lt; b2){ k = 'fn'; } else if(x &lt; b3){ k = 'fp'; }
      if(k){
        g.fillStyle = COLORS[k];
        g.fillRect((i%100)*cell, Math.floor(i/100)*cell, Math.ceil(cell), Math.ceil(cell));
      }
    }
  }

  function render(){
    var r = calc(state);
    setTxt('pOut', state.p.toFixed(1) + '%');
    setTxt('dOut', state.d.toFixed(0) + '%');
    setTxt('fOut', state.f.toFixed(1) + '%');

    var top = '&lt;div class=&quot;biglabel&quot;>报警件中真有缺陷的比例&lt;/div>';
    if(r.ppv === null){
      top += '&lt;div class=&quot;bigval&quot; aria-live=&quot;polite&quot;>—&lt;/div>';
      top += '&lt;p class=&quot;note&quot;>这批里报警件为 0 件：比例的分母是 0，无法计算。它既不是 0%，也不是 100%。&lt;/p>';
      top += '&lt;p class=&quot;note&quot;>这次没有报警，也就没有「报警件中真有缺陷的比例」可谈；漏检和正确放行仍然照常成立。&lt;/p>';
    } else {
      top += '&lt;div class=&quot;bigval&quot; aria-live=&quot;polite&quot;>' + pct(r.ppv) + '&lt;/div>';
      top += '&lt;p class=&quot;note&quot;>' + th(r.al) + ' 件报警中，' + th(r.tp) + ' 件真有缺陷，' + th(r.fp) + ' 件其实无缺陷（占报警的 ' + pct(1 - r.ppv) + '）。&lt;/p>';
      top += '&lt;p class=&quot;note&quot;>漏检 ' + th(r.fn) + ' 件，正确放行 ' + th(r.tn) + ' 件。&lt;/p>';
    }
    top += '&lt;p class=&quot;hint&quot;>深绿＝正确报警 ' + th(r.tp) + ' 件，深红＝漏检 ' + th(r.fn) + ' 件，琥珀＝误报 ' + th(r.fp) + ' 件，浅灰＝正确放行 ' + th(r.tn) + ' 件。每格 1 件，共 100 × 100 格。&lt;/p>';
    var t = byId('readoutTop'); if(t){ t.innerHTML = top; }

    drawWaffle(r);

    var all = [];
    for(var i=0;i&lt;4;i++){
      var k = ['tp','fn','fp','tn'][i];
      all.push({n:NAMES[k], c:COLORS[k], v:r[k]});
    }
    var ala = [{n:'真有缺陷', c:COLORS.tp, v:r.tp}, {n:'其实无缺陷', c:COLORS.fp, v:r.fp}];

    var bottom = '';
    bottom += '&lt;div class=&quot;barlabel&quot;>全批 10000 件里，四类各占多少&lt;/div>';
    bottom += barHTML(all, N) + legendHTML(all, N);
    bottom += '&lt;div class=&quot;barlabel&quot;>只看报警的这部分：分母换成报警件&lt;/div>';
    if(r.al > 0){
      bottom += barHTML(ala, r.al) + legendHTML(ala, r.al);
    } else {
      bottom += '&lt;p class=&quot;note&quot;>这一批没有报警件，报警条的宽度为 0，没有可以分配的部分。&lt;/p>';
    }
    bottom += '&lt;div class=&quot;barlabel&quot;>这一批的四个格子（件）&lt;/div>';
    bottom += '&lt;div class=&quot;scroll&quot;>&lt;table>&lt;thead>&lt;tr>&lt;th>真实状态 / 检测结果&lt;/th>&lt;th>报警&lt;/th>&lt;th>不报警&lt;/th>&lt;th>合计&lt;/th>&lt;/tr>&lt;/thead>&lt;tbody>';
    bottom += '&lt;tr>&lt;th scope=&quot;row&quot;>有缺陷&lt;/th>&lt;td>&lt;b>' + th(r.tp) + '&lt;/b>&lt;span class=&quot;mini&quot;>&lt;i class=&quot;dots&quot; style=&quot;background:' + COLORS.tp + '&quot;>&lt;/i>正确报警&lt;/span>&lt;/td>&lt;td>&lt;b>' + th(r.fn) + '&lt;/b>&lt;span class=&quot;mini&quot;>&lt;i class=&quot;dots&quot; style=&quot;background:' + COLORS.fn + '&quot;>&lt;/i>漏检&lt;/span>&lt;/td>&lt;td>' + th(r.def) + '&lt;/td>&lt;/tr>';
    bottom += '&lt;tr>&lt;th scope=&quot;row&quot;>无缺陷&lt;/th>&lt;td>&lt;b>' + th(r.fp) + '&lt;/b>&lt;span class=&quot;mini&quot;>&lt;i class=&quot;dots&quot; style=&quot;background:' + COLORS.fp + '&quot;>&lt;/i>误报&lt;/span>&lt;/td>&lt;td>&lt;b>' + th(r.tn) + '&lt;/b>&lt;span class=&quot;mini&quot;>&lt;i class=&quot;dots&quot; style=&quot;background:' + COLORS.tn + '&quot;>&lt;/i>正确放行&lt;/span>&lt;/td>&lt;td>' + th(r.ok) + '&lt;/td>&lt;/tr>';
    bottom += '&lt;tr>&lt;th scope=&quot;row&quot;>合计&lt;/th>&lt;td>' + th(r.al) + '&lt;/td>&lt;td>' + th(r.fn + r.tn) + '&lt;/td>&lt;td>10,000&lt;/td>&lt;/tr>';
    bottom += '&lt;/tbody>&lt;/table>&lt;/div>';
    var b = byId('readoutBottom'); if(b){ b.innerHTML = bottom; }
  }

  function clamp(v, lo, hi){
    if(!isFinite(v)){ return lo; }
    return Math.min(hi, Math.max(lo, v));
  }

  function setState(s){
    state.p = clamp(parseFloat(s.p), 0, 10);
    state.d = clamp(parseFloat(s.d), 0, 100);
    state.f = clamp(parseFloat(s.f), 0, 10);
    var pi = byId('p'), di = byId('d'), fi = byId('f');
    if(pi){ pi.value = state.p; }
    if(di){ di.value = state.d; }
    if(fi){ fi.value = state.f; }
    render();
  }

  var acts = {};
  var btns = document.querySelectorAll('button[data-presentation-action]');
  Array.prototype.forEach.call(btns, function(btn){
    var id = btn.getAttribute('data-presentation-action');
    var raw = btn.getAttribute('data-preset');
    var run = function(){
      if(!raw){ return; }
      try{ setState(JSON.parse(raw)); }catch(e){}
    };
    acts[id] = run;
    btn.addEventListener('click', run);
  });

  ['p','d','f'].forEach(function(k){
    var el = byId(k);
    if(!el){ return; }
    el.addEventListener('input', function(ev){
      var v = parseFloat(ev.target.value);
      state[k] = clamp(v, 0, (k === 'd' ? 100 : 10));
      render();
    });
  });

  var P = window.presentation || {};
  if(typeof P.registerStateReader === 'function'){
    P.registerStateReader(function(){
      var r = calc(state);
      return {
        values:{p:state.p, d:state.d, f:state.f},
        visible_step:null,
        observation:{
          summary:'缺陷率 ' + state.p.toFixed(1) + '%，检出率 ' + state.d.toFixed(0) + '%，误报率 ' + state.f.toFixed(1) + '%；报警件中真有缺陷的比例' + (r.ppv === null ? '无法计算（报警件为 0 件）' : '为 ' + pct(r.ppv)) + '。',
          state:{p:state.p, d:state.d, f:state.f, alarms:r.al, ppv:(r.ppv === null ? null : r.ppv)}
        }
      };
    });
  }
  if(typeof P.registerStateRestorer === 'function'){
    P.registerStateRestorer(function(saved){
      var v = (saved &amp;&amp; saved.values) ? (saved.values.page || saved.values) : null;
      if(!v){ return; }
      var next = {p:state.p, d:state.d, f:state.f};
      ['p','d','f'].forEach(function(k){
        if(typeof v[k] === 'number' &amp;&amp; isFinite(v[k])){ next[k] = v[k]; }
      });
      setState(next);
    });
  }
  if(typeof P.registerActionHandler === 'function'){
    P.registerActionHandler(function(action){
      if(!action){ return; }
      if(action.kind === 'set_parameters' &amp;&amp; action.values){
        var next = {p:state.p, d:state.d, f:state.f};
        ['p','d','f'].forEach(function(k){
          if(action.values[k] !== undefined &amp;&amp; action.values[k] !== null){
            next[k] = parseFloat(action.values[k]);
          }
        });
        setState(next);
        return;
      }
      if(action.kind === 'invoke' &amp;&amp; acts[action.action_id]){
        acts[action.action_id]();
      }
    });
  }

  var start = {p:1, d:95, f:5};
  if(window.presentation &amp;&amp; window.presentation.initialState){
    var init = window.presentation.initialState;
    ['p','d','f'].forEach(function(k){
      if(typeof init[k] === 'number' &amp;&amp; isFinite(init[k])){ start[k] = init[k]; }
    });
  }
  setState(start);

  window.addEventListener('resize', function(){ drawWaffle(calc(state)); });
})();
