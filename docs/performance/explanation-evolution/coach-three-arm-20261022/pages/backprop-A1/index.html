    &lt;span class=&quot;tag&quot; id=&quot;stepTag&quot;>梯度&lt;/span>
    &lt;h3 id=&quot;stepTitle&quot;>y 只有一条路&lt;/h3>
    &lt;p id=&quot;stepBody&quot;>y 只出现在 u = xy 里，所以只有一份贡献。&lt;/p>
    &lt;p class=&quot;formula mono&quot; id=&quot;stepFormula&quot;>∂L/∂y = 38&lt;/p>
  &lt;/div>

  &lt;div class=&quot;ledgers&quot;>
    &lt;div class=&quot;ledger&quot;>
      &lt;h4>u 的账本 · 两条路&lt;/h4>
      &lt;div id=&quot;ledgerU&quot;>&lt;/div>
      &lt;p class=&quot;lnote&quot;>往 x、y 传的是合计；两条单独的贡献不再分头传。&lt;/p>
    &lt;/div>
    &lt;div class=&quot;ledger&quot;>
      &lt;h4>x 的账本 · 两条路&lt;/h4>
      &lt;div id=&quot;ledgerX&quot;>&lt;/div>
      &lt;p class=&quot;lnote&quot;>x 是输入，合计就是 L 对它的最终梯度。&lt;/p>
    &lt;/div>
  &lt;/div>
&lt;/section>

&lt;div class=&quot;card&quot;>
  &lt;h3>独立核对：把 L 直接展开成 x、y 的式子&lt;/h3>
  &lt;p class=&quot;mono small&quot;>L = (xy + x)² + 3xy = x²y² + 2x²y + x² + 3xy&lt;/p>
  &lt;p class=&quot;mono small&quot;>∂L/∂x = 2xy² + 4xy + 2x + 3y&lt;/p>
  &lt;p class=&quot;mono small&quot; id=&quot;ckX&quot;>&lt;/p>
  &lt;p class=&quot;mono small&quot;>∂L/∂y = 2x²y + 2x² + 3x&lt;/p>
  &lt;p class=&quot;mono small&quot; id=&quot;ckY&quot;>&lt;/p>
  &lt;p class=&quot;verdict&quot; id=&quot;ckVerdict&quot;>&lt;/p>
&lt;/div>

&lt;div class=&quot;card&quot;>
  &lt;h3>漏掉一条会得到什么&lt;/h3>
  &lt;p class=&quot;omrow&quot;>正确：&lt;span class=&quot;mono&quot; id=&quot;omGood&quot;>&lt;/span>&lt;/p>
  &lt;p class=&quot;omrow&quot;>&lt;b>漏掉 u 的「3u 项」那份：&lt;/b>&lt;span class=&quot;mono&quot; id=&quot;omA&quot;>&lt;/span>&lt;/p>
  &lt;p class=&quot;omrow&quot;>&lt;b>漏掉 x「直接进 v」那份：&lt;/b>&lt;span class=&quot;mono&quot; id=&quot;omB&quot;>&lt;/span>&lt;/p>
  &lt;p class=&quot;note&quot; id=&quot;omNote&quot;>&lt;/p>
&lt;/div>

&lt;h2>这张图里，谁被用了两次&lt;/h2>
&lt;p>模型只有三个式子：u = x·y，v = u + x，L = v² + 3u。画成图以后，一条边表示&quot;谁用到谁&quot;。其中有两条边一步跨过中间量：右边那条弧线从 x 直接连到 v，左边那条弧线从 u 直接连到 L。&lt;/p>
&lt;p>数出边就能数出回传的份数：u 有两条出边（进 v、进 L 的 3u 项），所以 u 会收到两份贡献；x 有两条出边（进 u、直接进 v），同样两份；y 只有一条出边（进 u），只有一份。反向传播里&quot;被用两次就要相加&quot;的来源就在这里。&lt;/p>

&lt;h2>前向：三个数各算一次&lt;/h2>
&lt;p>默认 x = 2、y = 3：u = 2 × 3 = 6；v = 6 + 2 = 8；L = 8² + 3 × 6 = 64 + 18 = 82。每个节点只做一次算术，用的是上游已经算好的数值。图上灰色数字就是这三个值加上两个输入。&lt;/p>

&lt;h2>反向：每条边乘一个局部导数&lt;/h2>
&lt;p>反向要回答的是&quot;L 对某个量有多敏感&quot;。做法是从 L 往回走，每经过一条边就乘上这条边的局部导数，也就是这条边下游对上游的偏导。每个局部导数只看一条边：&lt;/p>
&lt;ul>
&lt;li>v→L：∂L/∂v = 2v；求它时把 3u 当作常数。&lt;/li>
&lt;li>u→L：3u 这一项给出常数 3；求它时把 v² 当作常数。&lt;/li>
&lt;li>u→v：∂v/∂u = 1。&lt;/li>
&lt;li>u→x：∂u/∂x = y；求它时把 y 当作常数。&lt;/li>
&lt;li>v→x：∂v/∂x = 1。&lt;/li>
&lt;li>u→y：∂u/∂y = x；求它时把 x 当作常数。&lt;/li>
&lt;/ul>
&lt;p>默认输入下依次得到：∂L/∂L = 1，∂L/∂v = 1 × 16 = 16，∂L/∂u = 16 + 3 = 19，∂L/∂x = 19 × 3 + 16 × 1 = 73，∂L/∂y = 19 × 2 = 38。&lt;/p>

&lt;h2>顺序：先算靠近 L 的，汇合点要等齐&lt;/h2>
&lt;p>反向的先后由依赖关系决定：先 v→L，再 u→v 与 u→L，然后才轮到 u→x、v→x、u→y。u 在中间，它必须先收齐所有出边回传的贡献，才能把总数往 x、y 送。至于相邻的两条边谁先谁后，比如 u→x 与 v→x，顺序可以互换，结果不变。&lt;/p>
&lt;p>如果把顺序弄反：u 一收到第一份 16 就往上游传，传出去的只是 2v；此时真正该传的是 2v + 3 = 19。漏账发生的具体位置就是这里——汇合点还没收齐就提前转发。&lt;/p>

&lt;h2>为什么两份要相加&lt;/h2>
&lt;p>把 u 当成可以单独变动的量，这正是偏导 ∂L/∂u 的含义。假设 u 增加一个很小的量 ε，由于 v = u + x，v 也跟着增加 ε：&lt;/p>
&lt;ul>
&lt;li>3u 这一项增加 3ε；&lt;/li>
&lt;li>v² 增加约 2v·ε，默认 v = 8 时是 16ε；&lt;/li>
&lt;li>L 一共增加约 19ε，除以 ε 得 19，也就是 2v + 3。&lt;/li>
&lt;/ul>
&lt;p>两处变化是同时发生的，所以 u 对 L 的灵敏度是两条路之和。取 ε = 0.01 试一遍：3u 从 18 变成 18.03，v 从 8 变成 8.01，v² 从 64 变成 64.1601，L 从 82 变成 82.1901，多了 0.1901，约等于 19 × 0.01。&lt;/p>

&lt;h2>漏掉一条，得到的是错的输入梯度&lt;/h2>
&lt;p>默认输入下正确的 ∂L/∂x 是 73。若 u 处只算了 2v = 16，∂L/∂x 就变成 16 × 3 + 16 = 64，少了 9；而 9 = 3 × y，正是被漏掉的那份 3 乘上 ∂u/∂x。若漏掉的是 x→v 这条直接边，∂L/∂x 就变成 19 × 3 = 57，少了 16，也就是 2v。&lt;/p>
&lt;p>两种情况都会让梯度与展开求导的结果对不上，所以漏账可以当场查出来。有一个特例要留意：y = 0 时 3·y = 0，第一种漏算在 ∂L/∂x 上恰好显示不出差别，但 ∂L/∂u 已经少了 3，∂L/∂y 也跟着错 3x。&lt;/p>

&lt;h2>零贡献、负贡献、互相抵消&lt;/h2>
&lt;ul>
&lt;li>某条贡献恰好为 0：取 x = −2、y = −1，得 u = 2、v = 0，于是 ∂L/∂v = 2v = 0。经 v 的那份贡献是 0，3u 那份仍是 3，所以 ∂L/∂u = 3，∂L/∂x = 3 × (−1) + 0 × 1 = −3。这份 0 照样写在账本里。&lt;/li>
&lt;li>两份互相抵消：取 x = 3、y = −1.5，得 u = −4.5、v = −1.5，∂L/∂v = −3，∂L/∂u = −3 + 3 = 0。u 的梯度是 0，但 ∂L/∂x = 0 × (−1.5) + (−3) × 1 = −3，不为 0。相加得 0 与&quot;这条路不存在&quot;是两件事。&lt;/li>
&lt;li>负数只表示方向：局部导数为负，说明这个量增大时 L 减小，乘法照做，符号照留。&lt;/li>
&lt;/ul>

&lt;h2>用展开求导再核对一次&lt;/h2>
&lt;p>把 L 写成 x、y 的式子，不经过图和局部导数：&lt;/p>
&lt;p class=&quot;mono&quot;>L = (xy + x)² + 3xy = x²y² + 2x²y + x² + 3xy&lt;/p>
&lt;p class=&quot;mono&quot;>∂L/∂x = 2xy² + 4xy + 2x + 3y&lt;/p>
&lt;p class=&quot;mono&quot;>∂L/∂y = 2x²y + 2x² + 3x&lt;/p>
&lt;p>默认 x = 2、y = 3 时，∂L/∂x = 36 + 24 + 4 + 9 = 73，∂L/∂y = 24 + 8 + 6 = 38，与图上一致。&lt;/p>
&lt;p>逐项还能和两条路对上：经由 u 的那份是 (2v + 3)·y = 2xy² + 2xy + 3y，直接进 v 的那份是 2v·1 = 2xy + 2x，两项相加得 2xy² + 4xy + 2x + 3y。展开式里的 4xy，正是两条路各出 2xy 合起来的。&lt;/p>

&lt;h2>一句话带走&lt;/h2>
&lt;p>一个量被 k 处使用，反向时就有 k 份贡献，收齐后相加，再把和往上游传；漏掉一份，输入梯度就正好少那一份乘上该边的局部导数。这份页面的规则只针对这一个小图和标量实数。&lt;/p>
&lt;p class=&quot;note&quot;>正文里的数字都是默认 x = 2、y = 3 算出来的；改滑块后，交互区与两张核对卡会同步重算。&lt;/p>

&lt;/main>

&lt;script>
(function(){
  'use strict';
  var MAXSTEP = 12;
  var state = { x: 2, y: 3, step: MAXSTEP };

  function stepClamp(v){
    if (typeof v !== 'number' || isNaN(v)) return MAXSTEP;
    return Math.max(0, Math.min(MAXSTEP, Math.round(v)));
  }
  function clamp(v){
    if (typeof v !== 'number' || isNaN(v)) return 0;
    v = Math.max(-3, Math.min(3, v));
    return Math.round(v * 2) / 2;
  }
  function f(n){
    if (typeof n !== 'number' || isNaN(n)) return '?';
    var r = Math.round(n * 10000) / 10000;
    if (r === 0) r = 0;
    return String(r).replace('-', '\u2212');
  }
  function par(n){ return n &lt; 0 ? '(' + f(n) + ')' : f(n); }
  function terms(a){
    var s = f(a[0]);
    for (var i = 1; i &lt; a.length; i++){
      s += (a[i] &lt; 0 ? ' \u2212 ' + f(-a[i]) : ' + ' + f(a[i]));
    }
    return s;
  }

  function calc(x, y){
    var u = x * y, v = u + x, L = v * v + 3 * u;
    var gv = 2 * v, gu = 2 * v + 3;
    var gxU = gu * y, gxD = gv;
    return {
      x: x, y: y, u: u, v: v, L: L,
      gv: gv, gu: gu, gxU: gxU, gxD: gxD, gx: gxU + gxD, gy: gu * x,
      dxE: 2 * x * y * y + 4 * x * y + 2 * x + 3 * y,
      dyE: 2 * x * x * y + 2 * x * x + 3 * x
    };
  }

  var STEPS = [
    { tag: '输入', cls: '', title: '读入 x 和 y',
      body: function(c){ return '这次用 x = ' + f(c.x) + '、y = ' + f(c.y) + '。图上后面每个数字都由这一对输入决定：拖动滑块换一组输入，全部重算。'; },
      formula: function(c){ return 'x = ' + f(c.x) + '　　y = ' + f(c.y); } },

    { tag: '前向值', cls: '', title: 'u = x · y',
      body: function(c){ return '把 x 和 y 相乘，得到中间量 u。这个 u 会被用两次：一次进入 v，一次直接进入 L 的 3u 项。'; },
      formula: function(c){ return 'u = ' + f(c.x) + ' × ' + f(c.y) + ' = ' + f(c.u); } },

    { tag: '前向值', cls: '', title: 'v = u + x',
      body: function(c){ return 'v 既用到 u，也直接用 x。x 因此有两条路通向 L：经过 u 再进 v，以及直接进 v。'; },
      formula: function(c){ return 'v = ' + f(c.u) + ' + ' + f(c.x) + ' = ' + f(c.v); } },

    { tag: '前向值', cls: '', title: 'L = v² + 3u',
      body: function(c){ return '输出 L 用了 v 的平方，也直接用了 u。到这里，u 的两条去向都出现在图上了。'; },
      formula: function(c){ return 'L = ' + f(c.v) + '² + 3 × ' + f(c.u) + ' = ' + f(c.v * c.v) + ' + ' + f(3 * c.u) + ' = ' + f(c.L); } },

    { tag: '梯度', cls: 'grad', title: '反向起点：∂L/∂L = 1',
      body: function(c){ return '反向传播从输出开始。L 对自身的变化率是 1，后面每一份贡献都从这 1 乘出来。'; },
      formula: function(c){ return '∂L/∂L = 1'; } },

    { tag: '局部导数 → 梯度', cls: 'loc', title: '边 v→L：局部导数 2v',
      body: function(c){ return 'v 在 L 里只出现在 v² 中，所以 v 单独变一点，这一项的变化率是 2v。用上游的 1 乘它，得到 v 的梯度。'; },
      formula: function(c){ return '∂L/∂v = 1 × 2v = 1 × ' + f(2 * c.v) + ' = ' + f(c.gv); } },

    { tag: '局部导数 → u 的账本', cls: 'loc', title: '边 u→L：3u 这一项的局部导数是 3',
      body: function(c){ return 'u 还直接出现在 3u 里。这条路不经过 v，单独给出常数 3。先把它记到 u 的账本上，暂时别汇总。'; },
      formula: function(c){ return '1 × 3 = 3　→　u 的第 1 条贡献'; } },

    { tag: '局部导数 → u 的账本', cls: 'loc', title: '边 u→v：局部导数 1',
      body: function(c){ return 'v = u + x 对 u 的偏导是 1。用 v 的梯度乘 1，这是绕经 v 回来的那一份。'; },
      formula: function(c){ return '∂L/∂v × ∂v/∂u = ' + f(c.gv) + ' × 1 = ' + f(c.gv) + '　→　u 的第 2 条贡献'; } },

    { tag: '梯度（汇合）', cls: 'join', title: 'u 处汇合：两份相加',
      body: function(c){ return 'u 的两条去向都回来了，这时才相加。理由是：u 动一点，L 会同时从 v² 和 3u 两处变化，两处变化都属于 ∂L/∂u。收齐之后，这个总数才能继续往 x、y 传。'; },
      formula: function(c){ return '∂L/∂u = ' + f(c.gv) + ' + 3 = ' + f(c.gu) + '　（也就是 2v + 3）'; } },

    { tag: '局部导数 → x 的账本', cls: 'loc', title: '边 u→x：局部导数 y',
      body: function(c){ return 'u = xy 对 x 的偏导是 y。用 u 的梯度乘它，得到 x 经由 u 的那一份。'; },
      formula: function(c){ return '∂L/∂u × ∂u/∂x = ' + f(c.gu) + ' × ' + f(c.y) + ' = ' + f(c.gxU) + '　→　x 的第 1 条贡献'; } },

    { tag: '局部导数 → x 的账本', cls: 'loc', title: '边 v→x：局部导数 1',
      body: function(c){ return 'x 还直接进了 v，v = u + x 对 x 的偏导是 1。这一份乘的是 v 的梯度，与 u 无关。'; },
      formula: function(c){ return '∂L/∂v × ∂v/∂x = ' + f(c.gv) + ' × 1 = ' + f(c.gxD) + '　→　x 的第 2 条贡献'; } },

    { tag: '梯度（汇合）', cls: 'join', title: 'x 处汇合：两份相加',
      body: function(c){ return 'x 的两条路都回来了。到这里反向传播结束，两个输入的梯度都齐了。'; },
      formula: function(c){ return '∂L/∂x = ' + f(c.gxU) + ' + ' + f(c.gxD) + ' = ' + f(c.gx); } },

    { tag: '梯度', cls: 'grad', title: 'y 只有一条路',
      body: function(c){ return 'y 只出现在 u = xy 里，所以只有一份贡献，不存在相加。如果 y 也被用在别处，这里就会成为第三次汇合。'; },
      formula: function(c){ return '∂L/∂y = ∂L/∂u × ∂u/∂y = ' + f(c.gu) + ' × ' + f(c.x) + ' = ' + f(c.gy); } }
  ];

  var ACTIVE = [
    ['x','y'], ['u'], ['v'], ['L'], ['L'], ['v'], ['u'], ['u'], ['u'], ['x'], ['x'], ['x'], ['y']
  ];
  var HILITE = {
    0: {}, 1: {'y-u':'fwd','x-u':'fwd'}, 2: {'u-v':'fwd','x-v':'fwd'}, 3: {'v-L':'fwd','u-L':'fwd'},
    4: {}, 5: {'v-L':'back'}, 6: {'u-L':'back'}, 7: {'u-v':'back'}, 8: {},
    9: {'x-u':'back'}, 10: {'x-v':'back'}, 11: {}, 12: {'y-u':'back'}
  };
  var EDGE_IDS = ['y-u','x-u','u-v','x-v','v-L','u-L'];

  function setNode(id, val, grad, fwdOn, gradOn, active){
    var g = document.getElementById('n-' + id);
    if (!g) return;
    g.setAttribute('class', 'node' + (fwdOn ? ' on' : '') + (active ? ' active' : ''));
    var v = g.querySelector('.nvalue');
    if (v) v.textContent = fwdOn ? val : '?';
    var gr = g.querySelector('.ngrad');
    if (gr){
      gr.textContent = grad;
      gr.setAttribute('class', 'ngrad' + (gradOn ? ' on' : ''));
    }
  }

  function ledgerHTML(rows, total){
    var h = '';
    for (var i = 0; i &lt; rows.length; i++){
      var r = rows[i];
      h += '&lt;div class=&quot;lrow' + (r.on ? ' on' : '') + '&quot;>'
        + '&lt;div>&lt;div class=&quot;lname&quot;>' + r.name + '&lt;/div>&lt;div class=&quot;lexp mono&quot;>' + r.exp + '&lt;/div>&lt;/div>'
        + '&lt;div class=&quot;lval mono&quot;>' + (r.on ? f(r.val) : '—') + '&lt;/div>'
        + '&lt;/div>';
    }
    h += '&lt;div class=&quot;ltotal' + (total.on ? ' on' : '') + '&quot;>&lt;span>' + total.label + '&lt;/span>&lt;strong class=&quot;mono&quot;>' + total.value + '&lt;/strong>&lt;/div>';
    return h;
  }

  function render(){
    var x = state.x, y = state.y, s = state.step, c = calc(x, y);
    var byId = function(id){ return document.getElementById(id); };

    var sx = byId('sx'), sy = byId('sy');
    if (sx) sx.value = String(x);
    if (sy) sy.value = String(y);
    if (byId('ox')) byId('ox').textContent = f(x);
    if (byId('oy')) byId('oy').textContent = f(y);
    if (byId('statusInputs')) byId('statusInputs').textContent = 'x = ' + f(x) + '　y = ' + f(y);
    var st = STEPS[s];
    if (byId('statusStep')) byId('statusStep').textContent = '第 ' + (s + 1) + ' / ' + (MAXSTEP + 1) + ' 步 · ' + st.title;

    var fw = { x: true, y: true, u: s >= 1, v: s >= 2, L: s >= 3 };
    var gd = { L: s >= 4, v: s >= 5, u: s >= 8, x: s >= 11, y: s >= 12 };
    var act = ACTIVE[s] || [];
    setNode('x', f(c.x), '∂L/∂x = ' + (gd.x ? f(c.gx) : '?'), true, gd.x, act.indexOf('x') >= 0);
    setNode('y', f(c.y), '∂L/∂y = ' + (gd.y ? f(c.gy) : '?'), true, gd.y, act.indexOf('y') >= 0);
    setNode('u', f(c.u), '∂L/∂u = ' + (gd.u ? f(c.gu) : '?'), fw.u, gd.u, act.indexOf('u') >= 0);
    setNode('v', f(c.v), '∂L/∂v = ' + (gd.v ? f(c.gv) : '?'), fw.v, gd.v, act.indexOf('v') >= 0);
    setNode('L', f(c.L), '∂L/∂L = ' + (gd.L ? '1' : '?'), fw.L, gd.L, act.indexOf('L') >= 0);

    var hi = HILITE[s] || {};
    var BADGE = {
      'y-u': { min: 12, val: c.x },
      'x-u': { min: 9, val: c.y },
      'u-v': { min: 7, val: 1 },
      'x-v': { min: 10, val: 1 },
      'v-L': { min: 5, val: 2 * c.v },
      'u-L': { min: 6, val: 3 }
    };
    for (var i = 0; i &lt; EDGE_IDS.length; i++){
      var id = EDGE_IDS[i];
      var path = byId('e-' + id), back = byId('eb-' + id), badge = byId('bd-' + id);
      var mode = hi[id];
      if (path) path.setAttribute('class', 'edge' + (mode === 'fwd' ? ' lit' : ''));
      if (back) back.setAttribute('class', 'eback' + (mode === 'back' ? ' on' : ''));
      if (badge){
        badge.textContent = '×' + f(BADGE[id].val);
        badge.setAttribute('class', 'ebadge' + (s >= BADGE[id].min ? ' on' : ''));
      }
    }

    if (byId('stepTag')){
      byId('stepTag').textContent = st.tag;
      byId('stepTag').setAttribute('class', 'tag ' + st.cls);
    }
    if (byId('stepTitle')) byId('stepTitle').textContent = st.title;
    if (byId('stepBody')) byId('stepBody').textContent = st.body(c);
    if (byId('stepFormula')) byId('stepFormula').textContent = st.formula(c);
    if (byId('prev')) byId('prev').disabled = (s === 0);
    if (byId('next')) byId('next').disabled = (s === MAXSTEP);

    var u1on = s >= 6, u2on = s >= 7, uMissing = (u1on ? 0 : 1) + (u2on ? 0 : 1);
    if (byId('ledgerU')){
      byId('ledgerU').innerHTML = ledgerHTML([
        { name: '① L 里的 3u 项', exp: '1 × ∂(3u)/∂u = 1 × 3', val: 3, on: u1on },
        { name: '② 经过 v', exp: '∂L/∂v × ∂v/∂u = ' + f(c.gv) + ' × 1', val: c.gv, on: u2on }
      ], {
        on: s >= 8,
        label: s >= 8 ? '合计' : '还差 ' + uMissing + ' 条回传，暂不汇总',
        value: s >= 8 ? '∂L/∂u = ' + f(c.gv) + ' + 3 = ' + f(c.gu) : '—'
      });
    }

    var x1on = s >= 9, x2on = s >= 10, xMissing = (x1on ? 0 : 1) + (x2on ? 0 : 1);
    if (byId('ledgerX')){
      byId('ledgerX').innerHTML = ledgerHTML([
        { name: '① 经由 u', exp: '∂L/∂u × ∂u/∂x = ' + f(c.gu) + ' × ' + f(c.y), val: c.gxU, on: x1on },
        { name: '② 直接进 v', exp: '∂L/∂v × ∂v/∂x = ' + f(c.gv) + ' × 1', val: c.gxD, on: x2on }
      ], {
        on: s >= 11,
        label: s >= 11 ? '合计' : '还差 ' + xMissing + ' 条回传，暂不汇总',
        value: s >= 11 ? '∂L/∂x = ' + f(c.gxU) + ' + ' + f(c.gxD) + ' = ' + f(c.gx) : '—'
      });
    }

    if (byId('ckX')){
      byId('ckX').textContent = '= 2·' + par(x) + '·' + par(y) + '² + 4·' + par(x) + '·' + par(y)
        + ' + 2·' + par(x) + ' + 3·' + par(y) + ' = '
        + terms([2 * x * y * y, 4 * x * y, 2 * x, 3 * y]) + ' = ' + f(c.dxE);
    }
    if (byId('ckY')){
      byId('ckY').textContent = '= 2·' + par(x) + '²·' + par(y) + ' + 2·' + par(x) + '² + 3·' + par(x) + ' = '
        + terms([2 * x * x * y, 2 * x * x, 3 * x]) + ' = ' + f(c.dyE);
    }
    if (byId('ckVerdict')){
      var ok = Math.abs(c.gx - c.dxE) &lt; 1e-9 &amp;&amp; Math.abs(c.gy - c.dyE) &lt; 1e-9;
      byId('ckVerdict').textContent = ok
        ? '图上 ∂L/∂x = ' + f(c.gx) + '，展开得 ' + f(c.dxE) + '；图上 ∂L/∂y = ' + f(c.gy) + '，展开得 ' + f(c.dyE) + '。两边一致。'
        : '两边不一致：图上 ' + f(c.gx) + ' / ' + f(c.gy) + '，展开 ' + f(c.dxE) + ' / ' + f(c.dyE) + '。';
    }

    var missU = 2 * c.v;
    var wrongA = missU * c.y + c.gv;
    var wrongB = c.gxU;
    if (byId('omGood')) byId('omGood').textContent = '∂L/∂x = ' + f(c.gu) + ' × ' + f(c.y) + ' + ' + f(c.gv) + ' × 1 = ' + f(c.gx);
    if (byId('omA')) byId('omA').textContent = '∂L/∂u 只剩 2v = ' + f(missU) + '，于是 ∂L/∂x = ' + f(missU) + ' × ' + f(c.y) + ' + ' + f(c.gv) + ' = ' + f(wrongA) + '，比正确值少 ' + f(c.gx - wrongA) + '（正好是 3·y = 3 × ' + f(c.y) + '）。';
    if (byId('omB')) byId('omB').textContent = '只用经由 u 的那份：∂L/∂x = ' + f(c.gu) + ' × ' + f(c.y) + ' = ' + f(wrongB) + '，比正确值少 ' + f(c.gx - wrongB) + '（正好是 2v = ' + f(c.gv) + '）。';
    if (byId('omNote')){
      byId('omNote').textContent = (c.y === 0)
        ? '现在 y = 0，∂u/∂x 也是 0，所以第一种漏算在 ∂L/∂x 上恰好差 0；但 ∂L/∂u 已经少了 3，∂L/∂y 也跟着错 3x。'
        : '展开核对给出的 ' + f(c.dxE) + ' 与这两个漏算值都不相等，所以漏账可以当场查出来。';
    }
  }

  function wire(){
    var byId = function(id){ return document.getElementById(id); };
    if (byId('sx')) byId('sx').addEventListener('input', function(){ state.x = clamp(parseFloat(this.value)); render(); });
    if (byId('sy')) byId('sy').addEventListener('input', function(){ state.y = clamp(parseFloat(this.value)); render(); });
    if (byId('prev')) byId('prev').addEventListener('click', function(){ state.step = Math.max(0, state.step - 1); render(); });
    if (byId('next')) byId('next').addEventListener('click', function(){ state.step = Math.min(MAXSTEP, state.step + 1); render(); });
    if (byId('replay')) byId('replay').addEventListener('click', function(){ state.step = 0; render(); });

    var presets = [['psDefault', 2, 3], ['psZero', -2, -1], ['psCancel', 3, -1.5]];
    for (var i = 0; i &lt; presets.length; i++){
      (function(p){
        var el = byId(p[0]);
        if (el) el.addEventListener('click', function(){
          state.x = clamp(p[1]);
          state.y = clamp(p[2]);
          render();
        });
      })(presets[i]);
    }
  }

  if (window.presentation){
    if (window.presentation.initialState){
      var ini = window.presentation.initialState;
      if (typeof ini.x === 'number') state.x = clamp(ini.x);
      if (typeof ini.y === 'number') state.y = clamp(ini.y);
      if (typeof ini.step === 'number') state.step = stepClamp(ini.step);
    }
    if (window.presentation.registerStateReader){
      window.presentation.registerStateReader(function(){
        var st = STEPS[state.step];
        var c = calc(state.x, state.y);
        return {
          values: { x: state.x, y: state.y, step: state.step },
          visible_step: '第 ' + (state.step + 1) + ' 步：' + st.title,
          observation: {
            summary: '输入 x = ' + f(state.x) + '、y = ' + f(state.y) + '，当前第 ' + (state.step + 1) + ' 步（' + st.title + '）；图中 ∂L/∂x = ' + f(c.gx) + '，∂L/∂y = ' + f(c.gy) + '，∂L/∂u = ' + f(c.gu) + '。',
            state: { x: state.x, y: state.y, step: state.step, gu: c.gu, gx: c.gx, gy: c.gy }
          }
        };
      });
    }
    if (window.presentation.registerStateRestorer){
      window.presentation.registerStateRestorer(function(saved){
        try {
          var vals = (saved &amp;&amp; saved.values) || {};
          var p = vals.page || vals;
          if (typeof p.x === 'number') state.x = clamp(p.x);
          if (typeof p.y === 'number') state.y = clamp(p.y);
          if (typeof p.step === 'number') state.step = stepClamp(p.step);
        } catch (e) {}
        render();
      });
    }
  }

  wire();
  render();
})();
&lt;/script>
