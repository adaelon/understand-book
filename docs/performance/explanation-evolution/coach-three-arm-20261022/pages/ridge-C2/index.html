&lt;main>

&lt;h1>带惩罚的直线拟合：从目标函数推到最优解&lt;/h1>
&lt;p class=&quot;lead&quot;>五组观测、一条直线、一个只罚斜率的二次项。下面把最优的 a 和 b 从头推出来，并说明它为什么是全局最小、什么时候不唯一。&lt;/p>

&lt;h2>0. 数据与目标：先把口径定死&lt;/h2>

&lt;p>固定示例 A 用五个观测点：x = (0, 1, 2, 3, 4)，y = (−1, 0, 2, 2, 5)，n = 5。拟合直线写作 ŷ = a·x + b，目标是&lt;/p>

&lt;div class=&quot;eq&quot;>J(a,b) = Σ&lt;sub>i=1..5&lt;/sub> [ y&lt;sub>i&lt;/sub> − (a·x&lt;sub>i&lt;/sub> + b) ]² + λa²，λ ≥ 0&lt;/div>

&lt;p>目标里的平方和是&lt;strong>总和&lt;/strong>，没有除以 n。惩罚项 λa² 只含斜率 a，与截距 b 无关。这两条约定决定了后面每一个数字，所以先说清它们各自的影响：&lt;/p>

&lt;ul>
&lt;li>&lt;strong>总和口径。&lt;/strong>把 J 整个除以 n 不会改变最优的 (a, b)，因为比例缩放不移动最小点；但同一句“λ = 2”在两种口径下的含义不同。若误差仍取平均而 λ 不跟着改，等于把惩罚的相对权重放大 n = 5 倍。本页所有数值、图形与交互读数都按总和口径计算。&lt;/li>
&lt;li>&lt;strong>只罚 a。&lt;/strong>b 只出现在残差项里，所以 b 的一阶条件完全由数据决定，λ 不进入。这一点在后面会直接给出“直线必过均值点”的结论。&lt;/li>
&lt;/ul>

&lt;h2>1. 第一步：用配方把 b 一次消掉&lt;/h2>

&lt;p>要同时处理两个未知量，先把 b 摘出来。下面这个恒等式对任意 a、b 都成立（这就是你说的配方，只是配在两个变量上）：&lt;/p>

&lt;div class=&quot;eq&quot;>Σ&lt;sub>i&lt;/sub> (y&lt;sub>i&lt;/sub> − a·x&lt;sub>i&lt;/sub> − b)² = Σ&lt;sub>i&lt;/sub> ( (y&lt;sub>i&lt;/sub> − ȳ) − a(x&lt;sub>i&lt;/sub> − x̄) )² + n( ȳ − a·x̄ − b )²&lt;/div>

&lt;p>它为什么成立，看两处：&lt;/p>

&lt;ol>
&lt;li>令 u&lt;sub>i&lt;/sub> = (y&lt;sub>i&lt;/sub> − ȳ) − a(x&lt;sub>i&lt;/sub> − x̄)，c = ȳ − a·x̄ − b。把 c 加回 u&lt;sub>i&lt;/sub> 时，−ȳ 与 +ȳ、−a·x̄ 与 +a·x̄ 逐项抵消，正好得到 y&lt;sub>i&lt;/sub> − a·x&lt;sub>i&lt;/sub> − b。所以每个残差都能拆成“中心化残差 + 同一个常数”。&lt;/li>
&lt;li>关键一步：&lt;b>Σ&lt;sub>i&lt;/sub> u&lt;sub>i&lt;/sub> = 0&lt;/b>。因为 Σ(y&lt;sub>i&lt;/sub> − ȳ) = 0，且 Σ(x&lt;sub>i&lt;/sub> − x̄) = Σx&lt;sub>i&lt;/sub> − n·x̄ = 0，两项分别归零，a 乘上去仍然是零。&lt;/li>
&lt;/ol>

&lt;p>于是 Σ(u&lt;sub>i&lt;/sub> + c)² = Σu&lt;sub>i&lt;/sub>² + 2c·Σu&lt;sub>i&lt;/sub> + n·c² = Σu&lt;sub>i&lt;/sub>² + n·c²。&lt;strong>交叉项 2c·Σu&lt;sub>i&lt;/sub> 消失的机制就在这里：&lt;/strong>一个对所有 i 都相同的常数 c，乘上“求和为零”的 u&lt;sub>i&lt;/sub> 再相加，结果必然是零。若把平方直接展开成 Σy² − 2aΣxy − 2bΣy + a²Σx² + 2abΣx + nb²，那个把 a 和 b 缠在一起的项是 2abΣx；中心化之后 Σ(x&lt;sub>i&lt;/sub> − x̄) = 0，这个缠绕项就没有了。两处说的是同一件事：均值让常数方向与中心化方向正交。&lt;/p>

&lt;p>恒等式把 b 隔离到了单独的 n(ȳ − a·x̄ − b)² 里，其余部分与 b 无关。对任意固定的 a，这一项非负，取零时最小，所以&lt;/p>

&lt;div class=&quot;eq&quot;>&lt;b>b(a) = ȳ − a·x̄&lt;/b>&lt;/div>

&lt;p>把 b 换成这个值，右边第二项消失，J 只剩中心化部分。同时顺带得到一个几何事实：ŷ(x̄) = a·x̄ + b(a) = ȳ，也就是&lt;strong>最优直线必过均值点 (x̄, ȳ)&lt;/strong>。这个结论只用到了“惩罚不含 b”，所以它对任意 λ ≥ 0 都成立，后面会反复用到。&lt;/p>

&lt;h2>2. 第二步：把统计量算成数&lt;/h2>

&lt;p>示例 A 的具体数值如下（可直接核对）：&lt;/p>

&lt;table>
&lt;caption>示例 A：x = (0,1,2,3,4)，y = (−1,0,2,2,5)，n = 5&lt;/caption>
&lt;thead>&lt;tr>&lt;th>量&lt;/th>&lt;th>值&lt;/th>&lt;th>来源&lt;/th>&lt;/tr>&lt;/thead>
&lt;tbody>
&lt;tr>&lt;td>x̄&lt;/td>&lt;td>2&lt;/td>&lt;td>Σx = 10，除以 5&lt;/td>&lt;/tr>
&lt;tr>&lt;td>ȳ&lt;/td>&lt;td>1.6&lt;/td>&lt;td>Σy = 8，除以 5&lt;/td>&lt;/tr>
&lt;tr>&lt;td>Σx²&lt;/td>&lt;td>30&lt;/td>&lt;td>0+1+4+9+16&lt;/td>&lt;/tr>
&lt;tr>&lt;td>Σx·y&lt;/td>&lt;td>30&lt;/td>&lt;td>0+0+4+6+20&lt;/td>&lt;/tr>
&lt;tr>&lt;td>S&lt;sub>xx&lt;/sub> = Σ(x&lt;sub>i&lt;/sub>−x̄)²&lt;/td>&lt;td>10&lt;/td>&lt;td>30 − 5·2²&lt;/td>&lt;/tr>
&lt;tr>&lt;td>S&lt;sub>xy&lt;/sub> = Σ(x&lt;sub>i&lt;/sub>−x̄)(y&lt;sub>i&lt;/sub>−ȳ)&lt;/td>&lt;td>14&lt;/td>&lt;td>30 − 5·2·1.6&lt;/td>&lt;/tr>
&lt;tr>&lt;td>S&lt;sub>yy&lt;/sub> = Σ(y&lt;sub>i&lt;/sub>−ȳ)²&lt;/td>&lt;td>21.2&lt;/td>&lt;td>6.76+2.56+0.16+0.16+11.56&lt;/td>&lt;/tr>
&lt;/tbody>
&lt;/table>

&lt;p>代入恒等式，示例 A 的目标变成&lt;/p>

&lt;div class=&quot;eq&quot;>J(a,b) = 5·(1.6 − 2a − b)² + 10a² − 28a + 21.2 + λa² = 5·(1.6 − 2a − b)² + (10+λ)a² − 28a + 21.2&lt;/div>

&lt;p>中间那一步值得停一下：10a² − 28a 来自 Σ(ỹ&lt;sub>i&lt;/sub> − a·x̃&lt;sub>i&lt;/sub>)² 的展开，其中 −2a·S&lt;sub>xy&lt;/sub> = −28a，a²·S&lt;sub>xx&lt;/sub> = 10a²，常数项是 S&lt;sub>yy&lt;/sub> = 21.2。&lt;/p>

&lt;h2>3. 第三步：只剩一个变量，求导&lt;/h2>

&lt;p>用 b(a) = 1.6 − 2a，前面那个括号也归零，得到只含 a 的剖面目标&lt;/p>

&lt;div class=&quot;eq&quot;>&lt;b>J(a) = (10+λ)a² − 28a + 21.2&lt;/b>&lt;/div>

&lt;p>这里的 J(a) 不是“随便固定了 b”，而是“对每个 a 都让 b 取它的最优值”之后的 J 值。换句话说，J(a) 画的是曲面 J(a,b) 沿曲线 b = 1.6 − 2a 的剖面。这个区别在讲唯一性时很要紧。&lt;/p>

&lt;p>对 a 求导：&lt;/p>

&lt;div class=&quot;eq&quot;>J′(a) = 2(10+λ)a − 28，&amp;nbsp; J″(a) = 2(10+λ)&lt;/div>

&lt;p>令 J′(a) = 0，只要 10 + λ ≠ 0 就得到唯一驻点&lt;/p>

&lt;div class=&quot;eq&quot;>&lt;b>a* = 14 / (10+λ)&lt;/b>，&amp;nbsp; &lt;b>b* = 1.6 − 2a*&lt;/b>&lt;/div>

&lt;h2>4. 第四步：三个 λ 的具体数值&lt;/h2>

&lt;table>
&lt;caption>示例 A：各 λ 下的最优系数与分解后的目标值（平方总和口径）&lt;/caption>
&lt;thead>&lt;tr>&lt;th>λ&lt;/th>&lt;th>a*&lt;/th>&lt;th>b*&lt;/th>&lt;th>未加惩罚 RSS&lt;/th>&lt;th>惩罚 λa²&lt;/th>&lt;th>目标 J&lt;/th>&lt;/tr>&lt;/thead>
&lt;tbody>
&lt;tr>&lt;td>0&lt;/td>&lt;td>1.4&lt;/td>&lt;td>−1.2&lt;/td>&lt;td>1.6&lt;/td>&lt;td>0&lt;/td>&lt;td>1.6&lt;/td>&lt;/tr>
&lt;tr>&lt;td>2&lt;/td>&lt;td>1.167&lt;/td>&lt;td>−0.733&lt;/td>&lt;td>2.144&lt;/td>&lt;td>2.722&lt;/td>&lt;td>4.867&lt;/td>&lt;/tr>
&lt;tr>&lt;td>10&lt;/td>&lt;td>0.7&lt;/td>&lt;td>0.2&lt;/td>&lt;td>6.5&lt;/td>&lt;td>4.9&lt;/td>&lt;td>11.4&lt;/td>&lt;/tr>
&lt;/tbody>
&lt;/table>

&lt;p>读这张表时注意两件事。第一，λ 从 0 增到 10，RSS 从 1.6 升到 6.5：惩罚把系数拉离了无惩罚的最优点，拟合确实变差了一点。第二，J 永远不小于 RSS，差额正是 λa²。三行都满足 b* = 1.6 − 2a*，也都能验证直线过 (2, 1.6)：例如 λ = 2 时 2·1.167 − 0.733 = 1.6。&lt;/p>

&lt;h2>5. 第五步：为什么是全局最小，什么时候唯一&lt;/h2>

&lt;p>令导数为零只说明“驻点”，还欠两件事：它是否为全局最小，以及它是否唯一。&lt;/p>

&lt;h3>用一元视角看&lt;/h3>
&lt;p>因为 J″(a) = 2(10+λ) &amp;gt; 0（λ ≥ 0），J(a) 是开口向上的抛物线。配方后&lt;/p>

&lt;div class=&quot;eq&quot;>J(a) = (10+λ)·( a − 14/(10+λ) )² + 21.2 − 196/(10+λ)&lt;/div>

&lt;p>平方项非负，取到零当且仅当 a = a*，所以 a* 是 J(a) 的全局最小点，最小值是 21.2 − 196/(10+λ)（λ = 0、2、10 时分别为 1.6、4.867、11.4，与上表一致）。再回到二维：J(a,b) 等于 J(a) 加上一个非负的 5(1.6 − 2a − b)²，那一项在 b = b(a) 时恰好为零，所以 (a*, b*) 也是 J(a,b) 的全局最小点，最小目标值相同。&lt;/p>

&lt;h3>用二维视角看（判据更直接）&lt;/h3>
&lt;p>在 (a, b) 坐标下，J 的二阶偏导是常数：∂²/∂a² = 2(Σx² + λ) = 2(30+λ)，∂²/∂a∂b = 2Σx = 20，∂²/∂b² = 2n = 10。所以&lt;/p>

&lt;div class=&quot;eq&quot;>H = 2 · [[30+λ, 10], [10, 5]]，&amp;nbsp; det H = 4n(S&lt;sub>xx&lt;/sub> + λ) = 20(10+λ) &amp;gt; 0（λ ≥ 0）&lt;/div>

&lt;p>左上元素 2(30+λ) &amp;gt; 0 且行列式为正，H 正定，J 严格凸，驻点就是唯一的全局最小点。一般地，b 那一块永远是 2n &amp;gt; 0，所以&lt;strong>唯一性只由 S&lt;sub>xx&lt;/sub> + λ &amp;gt; 0 决定&lt;/strong>。示例 A 的 S&lt;sub>xx&lt;/sub> = 10 &amp;gt; 0，因此即使 λ = 0，解也唯一——这一点在第 7 节会和退化数据形成对照。&lt;/p>

&lt;h2>6. 交互：让 λ 和数据集同时驱动公式与图形&lt;/h2>

&lt;div class=&quot;card&quot;>
&lt;div class=&quot;controls&quot;>
&lt;div class=&quot;ctl-row&quot;>
&lt;span class=&quot;ctl-label&quot;>数据集&lt;/span>
&lt;button id=&quot;ds-main&quot; aria-pressed=&quot;true&quot;>原始数据 x = 0…4&lt;/button>
&lt;button id=&quot;ds-deg&quot; aria-pressed=&quot;false&quot;>退化数据 x 全为 2&lt;/button>
&lt;/div>
&lt;div class=&quot;ctl-row&quot;>
&lt;label class=&quot;ctl-label&quot; for=&quot;lam&quot;>λ = &lt;output id=&quot;lamval&quot;>2.0&lt;/output>&lt;/label>
&lt;input id=&quot;lam&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;2&quot; aria-describedby=&quot;linecap&quot;>
&lt;/div>
&lt;/div>

&lt;div class=&quot;plots&quot;>
&lt;figure>
&lt;div id=&quot;plot1&quot;>&lt;/div>
&lt;figcaption>左图：观测点、拟合直线、竖向残差，以及面积与残差平方成正比的方块（同一视图内统一缩放）。空心圆是均值点 (2, 1.6)。&lt;/figcaption>
&lt;/figure>
&lt;figure>
&lt;div id=&quot;plot2&quot;>&lt;/div>
&lt;figcaption>右图：消去 b 之后的 J(a) = (S&lt;sub>xx&lt;/sub>+λ)a² − 2S&lt;sub>xy&lt;/sub>a + S&lt;sub>yy&lt;/sub>，a 取 −0.5 到 3。曲线最低点的横坐标就是当前的 a*；当 λ=0 且 x 全相同时，这条曲线退化成水平线，最低点不再唯一。&lt;/figcaption>
&lt;/figure>
&lt;/div>

&lt;div class=&quot;readouts&quot; aria-live=&quot;polite&quot;>

&lt;div class=&quot;ro&quot;>&lt;span>截距 b*&lt;/span>&lt;b id=&quot;ro-b&quot;>—&lt;/b>&lt;/div>
&lt;div class=&quot;ro&quot;>&lt;span>未加惩罚 RSS&lt;/span>&lt;b id=&quot;ro-rss&quot;>—&lt;/b>&lt;/div>
&lt;div class=&quot;ro&quot;>&lt;span>惩罚 λa²&lt;/span>&lt;b id=&quot;ro-pen&quot;>—&lt;/b>&lt;/div>
&lt;div class=&quot;ro&quot;>&lt;span>目标值 J&lt;/span>&lt;b id=&quot;ro-j&quot;>—&lt;/b>&lt;/div>

&lt;/div>

&lt;p>动手时按下面的顺序看，每一步都对应一个可以核对的量：&lt;/p>

&lt;ol>
&lt;li>先把 λ 从 2 拖到 0 再到 10。左图直线绕均值点 (2, 1.6) 转动，右图抛物线只是变陡，最低点向左挪。一次项 −28a 由数据决定，不随 λ 变。&lt;/li>
&lt;li>看读数里的三项如何分离：RSS 是未加惩罚的残差平方和，λa² 是惩罚，两者之和才是 J。λ 增大时 RSS 上升、J 也上升，惩罚买到的“斜率变小”是有代价的。&lt;/li>
&lt;li>把 λ 拖回 0，再点“退化数据”。此时 a 显示为“不唯一”，b 显示为 1.6 − 2a，左图出现一族都过 (2, 1.6) 的直线，右图整条曲线变成一条水平线。这就是 λ = 0 时的多解，页面不替你挑一个数。&lt;/li>
&lt;li>在退化数据下把 λ 抬到 0.5 以上，解立刻变唯一：a = 0、b = 1.6，J 仍是 21.2，与 λ = 0 时相同。变化的是系数能不能被确定，拟合并没有变好。&lt;/li>
&lt;/ol>

&lt;h2>7. 退化数据：五个 x 全部等于 2&lt;/h2>

&lt;p>现在换一组数据，y 与样本数都不变：x = (2, 2, 2, 2, 2)，y = (−1, 0, 2, 2, 5)。此时 x̄ = 2、ȳ = 1.6，而&lt;/p>

&lt;div class=&quot;eq&quot;>Σx² = 20，Σx = 10，Σx·y = 16 &amp;nbsp;⟹&amp;nbsp; S&lt;sub>xx&lt;/sub> = 20 − 5·2² = 0，S&lt;sub>xy&lt;/sub> = 16 − 5·2·1.6 = 0&lt;/div>

&lt;p>S&lt;sub>yy&lt;/sub> 仍是 21.2。同一个恒等式给出&lt;/p>

&lt;div class=&quot;eq&quot;>J(a,b) = 5·(1.6 − 2a − b)² + λa² + 21.2&lt;/div>

&lt;h3>λ = 0：一族同样好的直线&lt;/h3>

&lt;p>λ = 0 时 J = 21.2 + 5(1.6 − 2a − b)²。最小值 21.2，在所有满足 2a + b = 1.6 的 (a, b) 上取到，也就是整族 b = 1.6 − 2a。a 可以随便取，b 跟着它走。&lt;/p>

&lt;p>这一族里的每一条直线在观测点上给出同一个预测值：x = 2 时 ŷ = 2a + (1.6 − 2a) = 1.6，与 a 无关。所以五条残差都是 (−2.6, −1.6, 0.4, 0.4, 3.4)，RSS 都是 21.2。挑不出哪条“更好”，因为在这组数据上它们完全一样。用公式看，a* = S&lt;sub>xy&lt;/sub>/(S&lt;sub>xx&lt;/sub>+λ) 在这里是 0/0：分母的曲率没了，代数本身就在提示问题没有唯一答案。Hessian 的判据也一致：det H = 4n(S&lt;sub>xx&lt;/sub>+λ) = 20λ，λ = 0 时为零，二阶信息不足以定出方向。&lt;/p>

&lt;div class=&quot;warn&quot;>若在这组数据上给 a 报一个确定数字，就等于把“惩罚约定”说成了“数据结论”。数据里没有任何关于斜率的信息，因为 x 从未变化。&lt;/div>

&lt;h3>λ &amp;gt; 0：只有 a = 0 被选中&lt;/h3>

&lt;p>λ &amp;gt; 0 时 J = 21.2 + 5(1.6 − 2a − b)² + λa²。先让括号为零（任何 2a + b = 1.6 的直线都能做到），再最小化 λa²，只能取 a = 0，于是 b = 1.6。此时 det H = 20λ &amp;gt; 0，解唯一。公式同样给出 a* = 0/(0+λ) = 0、b* = ȳ − x̄·0 = 1.6。&lt;/p>

&lt;p>代价与收益要分开看：J 仍然是 21.2，残差、预测值、对观测点的拟合都没有任何变化。变的是系数从一参数族收缩到一个点，以及对 x = 2 之外的取值给出了确定的水平线 ŷ = 1.6。那条水平线的斜率 0 是“惩罚最小的那个表示”，并非从数据估出来的斜率。&lt;/p>

&lt;h2>8. 回到你列的四个问题&lt;/h2>

&lt;h3>增大 λ 为什么会改变斜率&lt;/h3>
&lt;p>看剖面目标 J(a) = (10+λ)a² − 28a + 21.2：λ 只加在二次项系数上，一次项 −28a 完全由数据决定。抛物线像一只碗，λ 增大只是把碗壁加陡，碗底的倾斜没变，所以最低点被推向 a 更小的一侧，a* = 14/(10+λ) 从 λ = 0 的 1.4 降到 λ = 10 的 0.7。用边际的眼光说：在 a 处，惩罚给出的边际阻力是 2λa，残差给出的边际拉力是 2(S&lt;sub>xy&lt;/sub> − a·S&lt;sub>xx&lt;/sub>) = 28 − 20a；最优点就在两者相等处，λ 越大，平衡点越靠左。&lt;/p>

&lt;h3>截距为什么也跟着变&lt;/h3>
&lt;p>因为 b* = ȳ − x̄·a*，而这里 x̄ = 2 ≠ 0。斜率每减少 1，截距必须增加 2，直线才能继续穿过 (2, 1.6)。λ 从 0 到 10 时 a 从 1.4 掉到 0.7，b 就从 −1.2 升到 0.2。这个联动依赖 x̄ 是否为 0：若先把 x 中心化使 x̄ = 0，则 b* = ȳ 保持不变，只有斜率收缩。&lt;/p>

&lt;h3>拟合直线为什么仍经过均值点&lt;/h3>
&lt;p>把 J 对 b 求导并令其为零，得到 Σ&lt;sub>i&lt;/sub>(y&lt;sub>i&lt;/sub> − a·x&lt;sub>i&lt;/sub> − b) = 0，即残差之和为零。对 ŷ = a·x + b 取平均得 mean(ŷ) = a·x̄ + b = ȳ，正是“过均值点”。这个方程里没有 λ，所以它对任意 λ ≥ 0 都成立；退化数据下 a = 0、b = 1.6 的直线也照样过 (2, 1.6)。&lt;/p>

&lt;h3>x 没有变化时，正则化究竟解决了什么&lt;/h3>
&lt;p>它解决的是&lt;strong>表示不唯一&lt;/strong>，而这里并不存在拟合不足的问题：λ = 0 时已经达到最小 RSS = 21.2，λ &amp;gt; 0 时 RSS 依旧是 21.2。惩罚的作用是在一整族“拟合同样好”的直线里按斜率大小排序，选出 a = 0 那一条。因此它买到两样东西：系数被唯一确定，以及对观测范围之外给出一个确定的（水平的）预测。它拿不到的是数据里本来就不存在的斜率信息——那需要 x 有变化才可能出现。&lt;/p>

&lt;h2>9. 复现清单&lt;/h2>
&lt;ol>
&lt;li>写出目标，确认口径：平方总和，惩罚只含 a。&lt;/li>
&lt;li>写出恒等式，用 Σu&lt;sub>i&lt;/sub> = 0 说明交叉项消失，得到 b = ȳ − a·x̄ 与“过均值点”。&lt;/li>
&lt;li>算出 S&lt;sub>xx&lt;/sub>、S&lt;sub>xy&lt;/sub>、S&lt;sub>yy&lt;/sub>，代回得 J(a) = (S&lt;sub>xx&lt;/sub>+λ)a² − 2S&lt;sub>xy&lt;/sub>a + S&lt;sub>yy&lt;/sub>。&lt;/li>
&lt;li>配方或求导得 a* = S&lt;sub>xy&lt;/sub>/(S&lt;sub>xx&lt;/sub>+λ)、b* = ȳ − x̄·a*，最小值 S&lt;sub>yy&lt;/sub> − S&lt;sub>xy&lt;/sub>²/(S&lt;sub>xx&lt;/sub>+λ)。&lt;/li>
&lt;li>用 J″ 与 det H = 4n(S&lt;sub>xx&lt;/sub>+λ) 说明全局最小，并把唯一性判据写成 S&lt;sub>xx&lt;/sub> + λ &amp;gt; 0。&lt;/li>
&lt;li>换 x ≡ 2 复算：S&lt;sub>xx&lt;/sub> = S&lt;sub>xy&lt;/sub> = 0，λ = 0 时给整族 b = 1.6 − 2a，λ &amp;gt; 0 时给 a = 0、b = 1.6，并说明拟合值未变。&lt;/li>
&lt;/ol>

&lt;p class=&quot;lead&quot; style=&quot;font-size:.88rem;color:#6b6459;margin-top:26px&quot;>全文只使用上面两组固定数据与“平方总和”口径；公式、图形与交互读数共用同一组统计量。页面中的 λ 与数据集选择可被保存，重开页面时会恢复到你上次看到的那个状态。&lt;/p>

&lt;/main>
&lt;script>
(function () {
  &quot;use strict&quot;;
  var DATA = {
    main: { x: [0, 1, 2, 3, 4], y: [-1, 0, 2, 2, 5] },
    degenerate: { x: [2, 2, 2, 2, 2], y: [-1, 0, 2, 2, 5] }
  };
  function stats(d) {
    var n = d.x.length, i, sx = 0, sy = 0, sq = 0, sxy = 0, syy = 0, mx, my, e;
    for (i = 0; i &lt; n; i++) { sx += d.x[i]; sy += d.y[i]; sq += d.x[i] * d.x[i]; sxy += d.x[i] * d.y[i]; }
    mx = sx / n; my = sy / n;
    for (i = 0; i &lt; n; i++) { e = d.y[i] - my; syy += e * e; }
    return { n: n, mx: mx, my: my, sumx: sx, sumx2: sq, Sxx: sq - n * mx * mx, Sxy: sxy - n * mx * my, Syy: syy };
  }
  var STAT = { main: stats(DATA.main), degenerate: stats(DATA.degenerate) };
  var state = { lambda: 2, dataset: &quot;main&quot; };
  var PRES = window.presentation;

  function el(id) { return document.getElementById(id); }

  function solve(st, lam) {
    var den = st.Sxx + lam;
    if (den > 1e-9) {
      var a = st.Sxy / den, b = st.my - a * st.mx;
      var rss = st.Syy - 2 * a * st.Sxy + a * a * st.Sxx;
      var pen = lam * a * a;
      return { unique: true, a: a, b: b, rss: rss, pen: pen, J: rss + pen, den: den };
    }
    return { unique: false, rss: st.Syy, pen: 0, J: st.Syy, den: den };
  }

  function num(x, d) {
    if (typeof x !== &quot;number&quot; || !isFinite(x)) { return &quot;—&quot;; }
    var v = Math.abs(x) &lt; 5e-4 ? 0 : x;
    return v.toFixed(d === undefined ? 3 : d);
  }
  function lamLabel(l) { return l.toFixed(1); }

  function plot1(st, res) {
    var W = 400, H = 330, L = 38, R = 12, T = 14, B = 30, PW = W - L - R, PH = H - T - B;
    var XMIN = -0.7, XMAX = 4.8, YMIN = -2.2, YMAX = 6.6;
    var px = function (x) { return L + (x - XMIN) / (XMAX - XMIN) * PW; };
    var py = function (y) { return (H - B) - (y - YMIN) / (YMAX - YMIN) * PH; };
    var sy = PH / (YMAX - YMIN);
    var o = [], i, xt, yt, d = DATA[state.dataset], yy, xi, yi, yh, r, s, top, lines, fam, ln;
    o.push('&lt;svg viewBox=&quot;0 0 ' + W + ' ' + H + '&quot; role=&quot;img&quot; aria-label=&quot;散点、拟合直线与残差平方&quot;>');
    o.push('&lt;defs>&lt;clipPath id=&quot;cp1&quot;>&lt;rect x=&quot;' + L + '&quot; y=&quot;' + T + '&quot; width=&quot;' + PW + '&quot; height=&quot;' + PH + '&quot;/>&lt;/clipPath>&lt;/defs>');
    o.push('&lt;rect x=&quot;' + L + '&quot; y=&quot;' + T + '&quot; width=&quot;' + PW + '&quot; height=&quot;' + PH + '&quot; fill=&quot;#ffffff&quot; stroke=&quot;#d9d2c6&quot;/>');
    for (xt = 0; xt &lt;= 4; xt++) {
      o.push('&lt;line x1=&quot;' + px(xt).toFixed(1) + '&quot; y1=&quot;' + T + '&quot; x2=&quot;' + px(xt).toFixed(1) + '&quot; y2=&quot;' + (H - B) + '&quot; stroke=&quot;#efe8dc&quot;/>');
      o.push('&lt;text x=&quot;' + px(xt).toFixed(1) + '&quot; y=&quot;' + (H - B + 15) + '&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;#6b6459&quot;>' + xt + '&lt;/text>');
    }
    for (yt = -2; yt &lt;= 6; yt++) {
      yy = py(yt);
      o.push('&lt;line x1=&quot;' + L + '&quot; y1=&quot;' + yy.toFixed(1) + '&quot; x2=&quot;' + (W - R) + '&quot; y2=&quot;' + yy.toFixed(1) + '&quot; stroke=&quot;#efe8dc&quot;/>');
      if (yt % 2 === 0) { o.push('&lt;text x=&quot;' + (L - 6) + '&quot; y=&quot;' + (yy + 4).toFixed(1) + '&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;#6b6459&quot;>' + yt + '&lt;/text>'); }
    }
    o.push('&lt;g clip-path=&quot;url(#cp1)&quot;>');
    lines = [];
    if (res.unique) {
      lines.push({ a: res.a, b: res.b, main: true });
    } else {
      fam = [-1, 0, 1];
      for (i = 0; i &lt; fam.length; i++) { lines.push({ a: fam[i], b: st.my - fam[i] * st.mx, main: false }); }
    }
    for (i = 0; i &lt; lines.length; i++) {
      ln = lines[i];
      o.push('&lt;line x1=&quot;' + px(XMIN).toFixed(1) + '&quot; y1=&quot;' + py(ln.a * XMIN + ln.b).toFixed(1) + '&quot; x2=&quot;' + px(XMAX).toFixed(1) + '&quot; y2=&quot;' + py(ln.a * XMAX + ln.b).toFixed(1) + '&quot; stroke=&quot;#1f5f8b&quot; stroke-width=&quot;' + (ln.main ? 2.6 : 1.4) + '&quot;' + (ln.main ? '' : ' stroke-dasharray=&quot;6 5&quot; opacity=&quot;0.8&quot;') + '/>');
    }
    var da = res.unique ? res.a : 0, db = res.unique ? res.b : st.my;
    for (i = 0; i &lt; st.n; i++) {
      xi = d.x[i]; yi = d.y[i]; yh = da * xi + db; r = yi - yh; s = Math.abs(r) * sy * 0.6;
      if (s > 0.8) {
        top = py(Math.max(yi, yh));
        o.push('&lt;rect x=&quot;' + (px(xi) - s / 2).toFixed(1) + '&quot; y=&quot;' + top.toFixed(1) + '&quot; width=&quot;' + s.toFixed(1) + '&quot; height=&quot;' + s.toFixed(1) + '&quot; fill=&quot;#8a4b12&quot; fill-opacity=&quot;0.13&quot; stroke=&quot;#8a4b12&quot; stroke-opacity=&quot;0.4&quot;/>');
      }
      o.push('&lt;line x1=&quot;' + px(xi).toFixed(1) + '&quot; y1=&quot;' + py(yi).toFixed(1) + '&quot; x2=&quot;' + px(xi).toFixed(1) + '&quot; y2=&quot;' + py(yh).toFixed(1) + '&quot; stroke=&quot;#8a4b12&quot; stroke-width=&quot;1.5&quot;/>');
    }
    o.push('&lt;/g>');
    o.push('&lt;circle cx=&quot;' + px(st.mx).toFixed(1) + '&quot; cy=&quot;' + py(st.my).toFixed(1) + '&quot; r=&quot;6&quot; fill=&quot;none&quot; stroke=&quot;#1f5f8b&quot; stroke-width=&quot;2&quot;/>');
    o.push('&lt;text x=&quot;' + (px(st.mx) - 10).toFixed(1) + '&quot; y=&quot;' + (py(st.my) + 17).toFixed(1) + '&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;#1f5f8b&quot;>均值点&lt;/text>');
    for (i = 0; i &lt; st.n; i++) {
      o.push('&lt;circle cx=&quot;' + px(d.x[i]).toFixed(1) + '&quot; cy=&quot;' + py(d.y[i]).toFixed(1) + '&quot; r=&quot;4.5&quot; fill=&quot;#1e1c19&quot;/>');
    }
    o.push('&lt;text x=&quot;' + (L + 6) + '&quot; y=&quot;' + (T + 16) + '&quot; font-size=&quot;12&quot; fill=&quot;#6b6459&quot;>y&lt;/text>');
    o.push('&lt;/svg>');
    return o.join('');
  }

  function plot2(st, res) {
    var W = 400, H = 286, L = 40, R = 12, T = 16, B = 32, PW = W - L - R, PH = H - T - B;
    var AMIN = -0.5, AMAX = 3.0, JMIN = 0, JMAX = 40;
    var px = function (a) { return L + (a - AMIN) / (AMAX - AMIN) * PW; };
    var py = function (j) { return (H - B) - (j - JMIN) / (JMAX - JMIN) * PH; };
    var o = [], k, at, jt, a, j, pts = [], vx, vy;
    o.push('&lt;svg viewBox=&quot;0 0 ' + W + ' ' + H + '&quot; role=&quot;img&quot; aria-label=&quot;消去 b 之后目标函数随斜率 a 的变化&quot;>');
    o.push('&lt;defs>&lt;clipPath id=&quot;cp2&quot;>&lt;rect x=&quot;' + L + '&quot; y=&quot;' + T + '&quot; width=&quot;' + PW + '&quot; height=&quot;' + PH + '&quot;/>&lt;/clipPath>&lt;/defs>');
    o.push('&lt;rect x=&quot;' + L + '&quot; y=&quot;' + T + '&quot; width=&quot;' + PW + '&quot; height=&quot;' + PH + '&quot; fill=&quot;#ffffff&quot; stroke=&quot;#d9d2c6&quot;/>');
    for (at = 0; at &lt;= 3; at++) {
      o.push('&lt;line x1=&quot;' + px(at).toFixed(1) + '&quot; y1=&quot;' + T + '&quot; x2=&quot;' + px(at).toFixed(1) + '&quot; y2=&quot;' + (H - B) + '&quot; stroke=&quot;#efe8dc&quot;/>');
      o.push('&lt;text x=&quot;' + px(at).toFixed(1) + '&quot; y=&quot;' + (H - B + 15) + '&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;#6b6459&quot;>' + at + '&lt;/text>');
    }
    for (jt = 0; jt &lt;= 40; jt += 10) {
      o.push('&lt;line x1=&quot;' + L + '&quot; y1=&quot;' + py(jt).toFixed(1) + '&quot; x2=&quot;' + (W - R) + '&quot; y2=&quot;' + py(jt).toFixed(1) + '&quot; stroke=&quot;#efe8dc&quot;/>');
      o.push('&lt;text x=&quot;' + (L - 6) + '&quot; y=&quot;' + (py(jt) + 4).toFixed(1) + '&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;#6b6459&quot;>' + jt + '&lt;/text>');
    }
    for (k = 0; k &lt;= 180; k++) {
      a = AMIN + (AMAX - AMIN) * k / 180;
      j = (st.Sxx + state.lambda) * a * a - 2 * st.Sxy * a + st.Syy;
      pts.push(px(a).toFixed(1) + ',' + py(j).toFixed(1));
    }
    o.push('&lt;polyline clip-path=&quot;url(#cp2)&quot; points=&quot;' + pts.join(' ') + '&quot; fill=&quot;none&quot; stroke=&quot;#1f5f8b&quot; stroke-width=&quot;2.4&quot;/>');
    if (res.unique) {
      vx = px(res.a); vy = py(res.J);
      o.push('&lt;line x1=&quot;' + vx.toFixed(1) + '&quot; y1=&quot;' + vy.toFixed(1) + '&quot; x2=&quot;' + vx.toFixed(1) + '&quot; y2=&quot;' + py(JMIN).toFixed(1) + '&quot; stroke=&quot;#a8621c&quot; stroke-dasharray=&quot;4 4&quot;/>');
      o.push('&lt;circle cx=&quot;' + vx.toFixed(1) + '&quot; cy=&quot;' + vy.toFixed(1) + '&quot; r=&quot;5&quot; fill=&quot;#a8621c&quot;/>');
      o.push('&lt;text x=&quot;' + Math.min(W - 6, vx + 8).toFixed(1) + '&quot; y=&quot;' + (vy - 9).toFixed(1) + '&quot; font-size=&quot;12&quot; fill=&quot;#a8621c&quot; text-anchor=&quot;' + (res.a > 2.1 ? 'end' : 'start') + '&quot;>最低点 a* = ' + num(res.a, 2) + '&lt;/text>');
    } else {
      o.push('&lt;text x=&quot;' + (L + 8) + '&quot; y=&quot;' + (T + 18) + '&quot; font-size=&quot;12&quot; fill=&quot;#a8621c&quot;>整条水平线都是最低值：每个 a 都同样好&lt;/text>');
    }
    o.push('&lt;text x=&quot;' + (W / 2) + '&quot; y=&quot;' + (H - 4) + '&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;#6b6459&quot;>a（斜率）&lt;/text>');
    o.push('&lt;text x=&quot;' + (L + 6) + '&quot; y=&quot;' + (T + 14) + '&quot; font-size=&quot;12&quot; fill=&quot;#6b6459&quot;>J(a)&lt;/text>');
    o.push('&lt;/svg>');
    return o.join('');
  }

  function statusText(st, res) {
    var base = &quot;S_xx + λ = &quot; + num(st.Sxx, 1) + &quot; + &quot; + lamLabel(state.lambda) + &quot; = &quot; + num(st.Sxx + state.lambda, 1);
    if (res.unique) {
      return base + &quot; > 0，Hessian 行列式 4n(S_xx+λ) = &quot; + num(4 * st.n * (st.Sxx + state.lambda), 1) + &quot; > 0：最优解唯一，a* = &quot; + num(res.a) + &quot;，b* = &quot; + num(res.b) + &quot;。&quot;;
    }
    return base + &quot; = 0：Hessian 退化，a 无法确定。整族 b = &quot; + num(st.my, 1) + &quot; − &quot; + num(st.mx, 1) + &quot;a 上每个 (a, b) 都达到最小目标值 &quot; + num(res.J, 1) + &quot;。&quot;;
  }

  function capText(st, res) {
    var name = state.dataset === &quot;main&quot; ? &quot;原始数据（x = 0…4）&quot; : &quot;退化数据（x 全为 2）&quot;;
    if (res.unique) {
      var bstr = res.b &lt; 0 ? &quot;− &quot; + num(-res.b) : &quot;+ &quot; + num(res.b);
      return &quot;当前：λ = &quot; + lamLabel(state.lambda) + &quot;，&quot; + name + &quot;，ŷ = &quot; + num(res.a) + &quot;·x &quot; + bstr + &quot;。&quot;;
    }
    return &quot;当前：λ = 0，&quot; + name + &quot;，整族 ŷ = a·x + (1.6 − 2a)；例如 a = 0 给 ŷ = 1.600，a = 1 给 ŷ = x − 0.400。&quot;;
  }

  function render() {
    var st = STAT[state.dataset], res = solve(st, state.lambda);
    el(&quot;lamval&quot;).textContent = lamLabel(state.lambda);
    el(&quot;ds-main&quot;).setAttribute(&quot;aria-pressed&quot;, state.dataset === &quot;main&quot; ? &quot;true&quot; : &quot;false&quot;);
    el(&quot;ds-deg&quot;).setAttribute(&quot;aria-pressed&quot;, state.dataset === &quot;degenerate&quot; ? &quot;true&quot; : &quot;false&quot;);
    el(&quot;plot1&quot;).innerHTML = plot1(st, res);
    el(&quot;plot2&quot;).innerHTML = plot2(st, res);
    el(&quot;ro-a&quot;).textContent = res.unique ? num(res.a) : &quot;不唯一&quot;;
    el(&quot;ro-b&quot;).textContent = res.unique ? num(res.b) : num(st.my, 1) + &quot; − 2a&quot;;
    el(&quot;ro-rss&quot;).textContent = num(res.rss);
    el(&quot;ro-pen&quot;).textContent = num(res.pen);
    el(&quot;ro-j&quot;).textContent = num(res.J);
    el(&quot;status&quot;).textContent = statusText(st, res);
    el(&quot;linecap&quot;).textContent = capText(st, res);
  }

  el(&quot;lam&quot;).addEventListener(&quot;input&quot;, function () {
    var v = Number(this.value);
    state.lambda = isFinite(v) ? Math.min(10, Math.max(0, v)) : 2;
    render();
  });
  el(&quot;lam&quot;).addEventListener(&quot;change&quot;, function () {
    if (PRES &amp;&amp; PRES.commitState) { try { PRES.commitState(); } catch (err) {} }
  });
  el(&quot;ds-main&quot;).addEventListener(&quot;click&quot;, function () {
    state.dataset = &quot;main&quot;;
    render();
    if (PRES &amp;&amp; PRES.commitState) { try { PRES.commitState(); } catch (err) {} }
  });
  el(&quot;ds-deg&quot;).addEventListener(&quot;click&quot;, function () {
    state.dataset = &quot;degenerate&quot;;
    render();
    if (PRES &amp;&amp; PRES.commitState) { try { PRES.commitState(); } catch (err) {} }
  });

  if (PRES &amp;&amp; PRES.registerStateReader) {
    PRES.registerStateReader(function () {
      var st = STAT[state.dataset], res = solve(st, state.lambda);
      return {
        values: { lambda: state.lambda, dataset: state.dataset },
        visible_step: res.unique ? &quot;unique&quot; : &quot;family&quot;,
        observation: {
          summary: el(&quot;status&quot;).textContent,
          state: { dataset: state.dataset, lambda: state.lambda, unique: res.unique }
        }
      };
    });
  }
  if (PRES &amp;&amp; PRES.registerStateRestorer) {
    PRES.registerStateRestorer(function (saved) {
      var v = (saved &amp;&amp; saved.values) || {};
      var lam = (v.lambda !== undefined) ? v.lambda : (v.page &amp;&amp; v.page.lambda);
      var dsv = (v.dataset !== undefined) ? v.dataset : (v.page &amp;&amp; v.page.dataset);
      var n = Number(lam);
      if (isFinite(n)) { state.lambda = Math.min(10, Math.max(0, Math.round(n * 2) / 2)); }
      if (dsv === &quot;main&quot; || dsv === &quot;degenerate&quot;) { state.dataset = dsv; }
      el(&quot;lam&quot;).value = String(state.lambda);
      render();
    });
  }

  el(&quot;lam&quot;).value = String(state.lambda);
  render();
})();
&lt;/script>
