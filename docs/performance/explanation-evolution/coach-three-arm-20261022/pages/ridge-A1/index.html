&lt;/head>&lt;body>&lt;div class=&quot;wrap&quot;>
&lt;h1>带惩罚的直线拟合：把最优解从头推出来&lt;/h1>
&lt;p>这是一页可以连续往下读的推导。目标函数固定为误差平方的&lt;strong>总和&lt;/strong>再加 λa²，惩罚只落在斜率 a 上。读完后你应该能自己重写整条链子：目标函数 → 消掉 b → 中心化 → 联立偏导 → 闭式解 → 全局最小的理由 → 唯一性判据 → 退化数据里哪些系数根本定不下来。&lt;/p>
&lt;p class=&quot;small&quot;>页内数字全部由同一组公式算出：正文、表格、图形和交互读数共用同一套 Sxx、Sxy、λ。第 1–4、6 节是固定示例（数据 A）；第 5 节切换两组数据并拖动 λ；第 7 节专门讨论 x 全为 2 的退化组；第 8 节回到一般结论。&lt;/p>

&lt;section>
&lt;h2>1 目标函数与口径&lt;/h2>
&lt;span class=&quot;badge&quot;>固定示例：数据 A&lt;/span>
&lt;p>五个观测点，n=5：&lt;/p>
&lt;table>
&lt;tbody>&lt;tr>&lt;th>下标 i&lt;/th>&lt;th>1&lt;/th>&lt;th>2&lt;/th>&lt;th>3&lt;/th>&lt;th>4&lt;/th>&lt;th>5&lt;/th>&lt;/tr>
&lt;tr>&lt;td>x&lt;sub>i&lt;/sub>&lt;/td>&lt;td>0&lt;/td>&lt;td>1&lt;/td>&lt;td>2&lt;/td>&lt;td>3&lt;/td>&lt;td>4&lt;/td>&lt;/tr>
&lt;tr>&lt;td>y&lt;sub>i&lt;/sub>&lt;/td>&lt;td>−1&lt;/td>&lt;td>0&lt;/td>&lt;td>2&lt;/td>&lt;td>2&lt;/td>&lt;td>5&lt;/td>&lt;/tr>
&lt;/tbody>&lt;/table>
&lt;p>两个均值：x̄=(0+1+2+3+4)/5=2，ȳ=(−1+0+2+2+5)/5=8/5=1.6。拟合直线 ŷ=a·x+b，要最小化的是&lt;/p>
&lt;div class=&quot;formula&quot;>J(a,b) = Σ&lt;sub>i=1&lt;/sub>&lt;sup>5&lt;/sup> [y&lt;sub>i&lt;/sub> − (a·x&lt;sub>i&lt;/sub> + b)]² + λa²，λ ≥ 0&lt;/div>
&lt;p>先定口径。累加号把五个平方加起来，量纲是 y²。如果把目标换成平均误差平方 J/5，同一个 (a,b) 的优劣次序和极小点都不变，但同一个 λ 的惩罚相对强度变了（等价于把 λ 换成 λ/5），因此给定 λ 算出的 a、b 会不同。本页从头到尾用总和：正文里的 10、14、21.2 以及交互读数都是总和口径。&lt;/p>
&lt;p>还有一个后面要用到的结构事实：J 是 (a,b) 的二次函数——平方和提供二次部分，λa² 也落在二次部分，剩下是一次项和常数。二次函数的下界、驻点和唯一性可以一次说清，不必逐点比较。&lt;/p>
&lt;/section>

&lt;section>
&lt;h2>2 先消掉 b：最优直线必过均值点&lt;/h2>
&lt;span class=&quot;badge&quot;>固定示例：数据 A&lt;/span>
&lt;p>记第 i 个残差 r&lt;sub>i&lt;/sub>=y&lt;sub>i&lt;/sub>−a·x&lt;sub>i&lt;/sub>−b。它对 b 的导数是 −1，而 λa² 里没有 b，所以&lt;/p>
&lt;div class=&quot;formula&quot;>∂J/∂b = −2·Σ&lt;sub>i&lt;/sub>(y&lt;sub>i&lt;/sub> − a·x&lt;sub>i&lt;/sub> − b)&lt;/div>
&lt;p>令它为零，得到 Σ(y&lt;sub>i&lt;/sub>−a·x&lt;sub>i&lt;/sub>−b)=0，即五个残差之和为零。把求和拆开：Σy&lt;sub>i&lt;/sub> − a·Σx&lt;sub>i&lt;/sub> − 5b = 0，两边同除 5：&lt;/p>
&lt;div class=&quot;formula&quot;>b = ȳ − a·x̄ = 1.6 − 2a&lt;/div>
&lt;p>这一步里 λ 一次都没出现，因为惩罚项不含 b。所以无论 λ 取 0 还是 10，最优截距都满足 b=1.6−2a。把它读成几何事实：a·x̄+b=ȳ，直线在 x=x̄ 处的取值正好是 ȳ，因此最优直线必过 (2, 1.6)。这个结论在第 5 节的图里始终成立，第 7 节数据 B 也成立。&lt;/p>
&lt;p>作为对照，如果目标写成 Σr&lt;sub>i&lt;/sub>²+λ(a²+b²)，b 的方程会多出一项，变成 5(ȳ−a·x̄−b)=λb；残差之和一般不再为零，&quot;必过均值点&quot;这条性质随之消失。本页的目标只惩罚 a，所以这条性质在整页都有效。&lt;/p>
&lt;/section>

&lt;section>
&lt;h2>3 中心化：交叉项为什么消失&lt;/h2>
&lt;span class=&quot;badge&quot;>固定示例：数据 A&lt;/span>
&lt;p>记离差 x̃&lt;sub>i&lt;/sub>=x&lt;sub>i&lt;/sub>−2、ỹ&lt;sub>i&lt;/sub>=y&lt;sub>i&lt;/sub>−1.6，再记 r=1.6−2a−b。r 就是每个残差里&quot;与下标 i 无关&quot;的那一块。把单个残差拆成两块：&lt;/p>
&lt;div class=&quot;formula&quot;>y&lt;sub>i&lt;/sub> − a·x&lt;sub>i&lt;/sub> − b = (ȳ + ỹ&lt;sub>i&lt;/sub>) − a(x̄ + x̃&lt;sub>i&lt;/sub>) − b = r + (ỹ&lt;sub>i&lt;/sub> − a·x̃&lt;sub>i&lt;/sub>)&lt;/div>
&lt;p>平方后对 i 求和，展开成三项：&lt;/p>
&lt;div class=&quot;formula&quot;>Σ[r + (ỹ&lt;sub>i&lt;/sub>−a·x̃&lt;sub>i&lt;/sub>)]² = 5r² + 2r·Σ(ỹ&lt;sub>i&lt;/sub>−a·x̃&lt;sub>i&lt;/sub>) + Σ(ỹ&lt;sub>i&lt;/sub>−a·x̃&lt;sub>i&lt;/sub>)²&lt;/div>
&lt;p>看交叉项：Σỹ&lt;sub>i&lt;/sub>=Σy&lt;sub>i&lt;/sub>−5·ȳ=8−8=0，Σx̃&lt;sub>i&lt;/sub>=Σx&lt;sub>i&lt;/sub>−5·x̄=10−10=0。两个和各自为零，于是 2r(0−a·0)=0，交叉项整项消失。同一个事实用了两次：离差之和为零，因为中心化时正好减掉了均值。&lt;/p>
&lt;p>改写后的目标是三块，每块只含一个&quot;变量&quot;：&lt;/p>
&lt;div class=&quot;formula&quot;>J = 5r² + Σ(ỹ&lt;sub>i&lt;/sub>−a·x̃&lt;sub>i&lt;/sub>)² + λa²，r = 1.6−2a−b&lt;/div>
&lt;p>第一块只随 b 变（固定 a 时），第二、三块只随 a 变。中心化能把两个系数分开，靠的就是这一点。&lt;/p>
&lt;p>三个和的数值（离差列表 x̃=(−2,−1,0,1,2)，ỹ=(−2.6,−1.6,0.4,0.4,3.4)）：&lt;/p>
&lt;ul>
&lt;li>Sxx=Σx̃²=4+1+0+1+4=&lt;strong>10&lt;/strong>&lt;/li>
&lt;li>Sxy=Σx̃·ỹ=5.2+1.6+0+0.4+6.8=&lt;strong>14&lt;/strong>（逐项：(−2)(−2.6)=5.2，(−1)(−1.6)=1.6，0·0.4=0，1·0.4=0.4，2·3.4=6.8）&lt;/li>
&lt;li>Syy=Σỹ²=6.76+2.56+0.16+0.16+11.56=&lt;strong>21.2&lt;/strong>&lt;/li>
&lt;/ul>
&lt;div class=&quot;formula&quot;>Σ(ỹ&lt;sub>i&lt;/sub>−a·x̃&lt;sub>i&lt;/sub>)² = Syy − 2a·Sxy + a²·Sxx = 21.2 − 28a + 10a²&lt;/div>
&lt;/section>

&lt;section>
&lt;h2>4 联立两个偏导，得到 a 和 b 的闭式解&lt;/h2>
&lt;span class=&quot;badge&quot;>固定示例：数据 A&lt;/span>
&lt;p>把上面两块合起来，只保留 λ 的符号：&lt;/p>
&lt;div class=&quot;formula&quot;>J = 5r² + (10+λ)a² − 28a + 21.2，r = 1.6 − 2a − b&lt;/div>
&lt;p>对 a 求偏导时要注意 r 里也含 a（∂r/∂a=−2），所以 5r² 会贡献一项 −20r：&lt;/p>
&lt;div class=&quot;formula&quot;>∂J/∂a = −20r + 2(10+λ)a − 28，∂J/∂b = −10r&lt;/div>
&lt;p>两个偏导同时为零：第二式给出 r=0；把它代进第一式，−20·0 消失，剩 2(10+λ)a=28，即&lt;/p>
&lt;div class=&quot;formula&quot;>a* = 14/(10+λ)，b* = 1.6 − 2a* = 1.6 − 28/(10+λ)&lt;/div>
&lt;p>一般形式（任意数据，仍然只惩罚 a）：a*=Sxy/(Sxx+λ)，b*=ȳ−x̄·a*。本页的 10 和 14 就是这组数据的 Sxx 和 Sxy。代入几个 λ：&lt;/p>
&lt;table>
&lt;tbody>&lt;tr>&lt;th>λ&lt;/th>&lt;th>a*=14/(10+λ)&lt;/th>&lt;th>b*=1.6−2a*&lt;/th>&lt;th>SSE=Σ残差²&lt;/th>&lt;th>λa*²&lt;/th>&lt;th>J=SSE+λa*²&lt;/th>&lt;/tr>
&lt;tr>&lt;td>0&lt;/td>&lt;td>1.4&lt;/td>&lt;td>−1.2&lt;/td>&lt;td>1.6&lt;/td>&lt;td>0&lt;/td>&lt;td>1.6&lt;/td>&lt;/tr>
&lt;tr>&lt;td>2&lt;/td>&lt;td>1.1667&lt;/td>&lt;td>−0.7333&lt;/td>&lt;td>2.1444&lt;/td>&lt;td>2.7222&lt;/td>&lt;td>4.8667&lt;/td>&lt;/tr>
&lt;tr>&lt;td>5&lt;/td>&lt;td>0.9333&lt;/td>&lt;td>−0.2667&lt;/td>&lt;td>3.7778&lt;/td>&lt;td>4.3556&lt;/td>&lt;td>8.1333&lt;/td>&lt;/tr>
&lt;tr>&lt;td>7.5&lt;/td>&lt;td>0.8&lt;/td>&lt;td>0&lt;/td>&lt;td>5.2&lt;/td>&lt;td>4.8&lt;/td>&lt;td>10&lt;/td>&lt;/tr>
&lt;tr>&lt;td>10&lt;/td>&lt;td>0.7&lt;/td>&lt;td>0.2&lt;/td>&lt;td>6.5&lt;/td>&lt;td>4.9&lt;/td>&lt;td>11.4&lt;/td>&lt;/tr>
&lt;/tbody>&lt;/table>
&lt;p class=&quot;small&quot;>几个可以记的位置：λ=0 回到普通最小二乘 (a,b)=(1.4,−1.2)；λ=7.5 时 b*=0，直线变成过原点的 ŷ=0.8x；λ 继续增大，a* 向 0 靠近、b* 向 1.6 靠近。最后一列也可以用 J&lt;sub>min&lt;/sub>=Syy−Sxy²/(Sxx+λ)=21.2−196/(10+λ) 算，两种算法给出同一个数（例如 λ=2：21.2−16.3333=4.8667）。&lt;/p>
&lt;/section>

&lt;section>
&lt;h2>5 交互检验：λ 与两组数据&lt;/h2>
&lt;p>面板用同一组公式 a*=Sxy/(Sxx+λ)、b*=ȳ−x̄·a* 计算，所以读数和上面的推导出自同一套数。拖动 λ 时看三件事：直线绕均值点 (2,1.6) 转动；a* 变小、b* 变大；未加惩罚的误差平方和 SSE 与惩罚项 λa*² 分开显示，两者之和是目标值 J。λ 在 0 到 10 之间增大时，SSE 从 1.6 升到 6.5，惩罚项从 0 升到 4.9，J 从 1.6 升到 11.4——约束越紧，能达到的最小目标值越高。&lt;/p>
&lt;p>切到数据 B 并把 λ 拖到 0，面板不会给出单一斜率：它会把多条过 (2,1.6) 的直线一起画出来，并且读数显示&quot;未定&quot;。这个情形留到第 7 节完整解释。&lt;/p>
&lt;div class=&quot;panel&quot;>
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;选择数据组&quot;>
&lt;button type=&quot;button&quot; id=&quot;dsA&quot; aria-pressed=&quot;true&quot;>数据 A：x=(0,1,2,3,4)&lt;/button>
&lt;button type=&quot;button&quot; id=&quot;dsB&quot; aria-pressed=&quot;false&quot;>数据 B：x 全为 2&lt;/button>
&lt;/div>
&lt;div class=&quot;ctl&quot;>
&lt;label for=&quot;lam&quot;>惩罚强度 λ：&lt;output id=&quot;lamval&quot;>2&lt;/output>（范围 0–10，步长 0.5）&lt;/label>
&lt;input type=&quot;range&quot; id=&quot;lam&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;2&quot; aria-label=&quot;惩罚强度 λ，0 到 10，步长 0.5&quot;>
&lt;div class=&quot;presets&quot;>
&lt;button type=&quot;button&quot; id=&quot;lam0&quot;>跳到 λ=0&lt;/button>
&lt;button type=&quot;button&quot; id=&quot;lam10&quot;>跳到 λ=10&lt;/button>
&lt;/div>
&lt;/div>
&lt;p class=&quot;small&quot; id=&quot;ro-stats&quot;>—&lt;/p>
&lt;div class=&quot;grid&quot; id=&quot;readout&quot;>
&lt;div class=&quot;readout&quot;>&lt;span class=&quot;k&quot;>惩罚强度 λ&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-lam&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;readout&quot;>&lt;span class=&quot;k&quot;>斜率 a*&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-a&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;readout&quot;>&lt;span class=&quot;k&quot;>截距 b*&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-b&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;readout&quot;>&lt;span class=&quot;k&quot;>均值点处拟合值 a·2+b&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-c&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;readout&quot;>&lt;span class=&quot;k&quot;>未加惩罚的误差平方和 SSE&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-sse&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;readout&quot;>&lt;span class=&quot;k&quot;>惩罚项 λa*²&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-pen&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;readout&quot;>&lt;span class=&quot;k&quot;>目标值 J=SSE+λa*²&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-J&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;readout&quot;>&lt;span class=&quot;k&quot;>最小值 J&lt;sub>min&lt;/sub>&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-jmin&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;readout wide&quot;>&lt;span class=&quot;k&quot;>解的情况&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ro-case&quot;>—&lt;/span>&lt;/div>
&lt;/div>
&lt;svg id=&quot;plot&quot; class=&quot;plot&quot; viewBox=&quot;0 0 440 320&quot; preserveAspectRatio=&quot;xMidYMid meet&quot; role=&quot;img&quot; aria-label=&quot;五个观测点、拟合直线、残差与均值点&quot;>&lt;/svg>
&lt;p class=&quot;small&quot; id=&quot;plotnote&quot;>—&lt;/p>
&lt;svg id=&quot;curve&quot; class=&quot;plot&quot; viewBox=&quot;0 0 440 170&quot; preserveAspectRatio=&quot;xMidYMid meet&quot; role=&quot;img&quot; aria-label=&quot;最优斜率随 λ 变化的曲线&quot;>&lt;/svg>
&lt;p class=&quot;small&quot; id=&quot;curvenote&quot;>上面这张小图横轴是 λ（0–10），纵轴是最优斜率 a*，橙点是当前 λ 的位置。&lt;/p>
&lt;/div>
&lt;/section>

&lt;section>
&lt;h2>6 为什么这是全局最小，什么时候唯一&lt;/h2>
&lt;span class=&quot;badge&quot;>固定示例：数据 A&lt;/span>
&lt;p>&quot;令偏导为零&quot;只交出了候选点。要说明它是全局最小并且唯一，把目标配方成平方和。把二次式 (10+λ)a²−28a 配成平方（28=2·14）：&lt;/p>
&lt;div class=&quot;formula&quot;>J(a,b) = 5·(1.6 − 2a − b)² + (10+λ)·(a − 14/(10+λ))² + [21.2 − 196/(10+λ)]&lt;/div>
&lt;p>先核对这确实是同一个函数。右边展开：a² 的系数是 5·4+(10+λ)=30+λ，ab 的系数是 5·2·2=20，b² 的系数是 5；常数是 5·1.6²+196/(10+λ)+21.2−196/(10+λ)=12.8+21.2=34。左边 J 展开也是 34−60a−16b+(30+λ)a²+20ab+5b²，两者逐项相同。&lt;/p>
&lt;p>三项各有角色：第一项衡量&quot;a·x̄+b 有没有对上 ȳ&quot;，只在直线在均值点处偏离时为正；第二项衡量&quot;斜率偏离 a*&quot;；第三项只含数据和 λ，与 (a,b) 无关。因为 λ≥0 使 10+λ&amp;gt;0，三项都非负，于是&lt;/p>
&lt;div class=&quot;formula&quot;>J(a,b) ≥ 21.2 − 196/(10+λ)，等号当且仅当 a=14/(10+λ) 且 b=1.6−2a&lt;/div>
&lt;p>下界由常数项给出，而且能被取到：只要 a=a*、b=b*，两个平方同时为零，J 正好等于这个下界。所以 (a*, b*) 是全局最小点，并且是唯一的——任意别的 (a,b) 至少让一个平方项严格大于零。这条论证在 λ=0 时同样成立，因为 Sxx=10&amp;gt;0，第二项的系数仍为正。&lt;/p>
&lt;p>用二阶条件说同一件事：J 的二次部分为 (30+λ)a²+20ab+5b²，Hessian 是&lt;/p>
&lt;div class=&quot;formula&quot;>H = [[2(30+λ), 20], [20, 10]]，det H = 20(30+λ) − 400 = 20(10+λ)&lt;/div>
&lt;p>det H&amp;gt;0 且对角元为正，H 正定，J 严格凸，驻点即唯一全局最小。一般数据的判据是 det=4n(Sxx+λ)，所以&quot;严格凸&quot;这件事取决于两个量：样本量 n&amp;gt;0 与 Sxx+λ&amp;gt;0。λ≥0 时，只要 x 有变化（Sxx&amp;gt;0），任何 λ 都给唯一解；x 没有变化（Sxx=0）时，唯一性就全靠 λ&amp;gt;0 撑着——这正是第 7 节要说的事。&lt;/p>
&lt;/section>

&lt;section>
&lt;h2>7 退化数据：五个 x 全是 2&lt;/h2>
&lt;span class=&quot;badge&quot;>数据 B：x=(2,2,2,2,2)，y=(−1,0,2,2,5)&lt;/span>
&lt;p>把 x 换成常数 2，y 不变。此时 x̄=2、ȳ=1.6 不变，但两个和变了：x̃ 全为 0，所以 Sxx=0、Sxy=0；Syy 仍是 21.2。第 2 节的截距方程完全不变，所以 b=1.6−2a 仍然成立。&lt;/p>
&lt;p>关键在于：所有残差只通过 c=2a+b 这个组合依赖 (a,b)。写出来更清楚，令 c=2a+b：&lt;/p>
&lt;div class=&quot;formula&quot;>y&lt;sub>i&lt;/sub> − c = (1.6 − c) + ỹ&lt;sub>i&lt;/sub> ⟹ Σ(y&lt;sub>i&lt;/sub>−c)² = 5(1.6−c)² + 21.2&lt;/div>
&lt;div class=&quot;formula&quot;>J(a,b) = 5(1.6 − c)² + 21.2 + λa²，c = 2a + b&lt;/div>
&lt;p>交叉项又消失了，理由和第三节一样：Σỹ&lt;sub>i&lt;/sub>=0。这个式子把两种情形一次说清。&lt;/p>
&lt;h3>λ=0：无穷多最优解&lt;/h3>
&lt;p>此时 J=5(1.6−c)²+21.2，只依赖 c。任何让 c=1.6 的 (a,b) 都取到最小值 21.2，也就是整条直线族&lt;/p>
&lt;div class=&quot;formula&quot;>b = 1.6 − 2a，a 任意 ⟹ J = 21.2（每一条都同样好）&lt;/div>
&lt;p>可确定的量只有 c=2a+b=1.6，它等价于&quot;直线在 x=2 处的预测值&quot;。斜率 a 与截距 b 各自定不下来：取 a=1 要配 b=−0.4，取 a=−0.5 要配 b=2.6，五条残差一模一样。二阶判据在这里正好失效：det=4n(Sxx+λ)=20·0=0，H 半正定，最优点构成一条直线而不是一个点。任何把这件事说成&quot;最优斜率是某个数&quot;的讲法都会丢掉全部信息。&lt;/p>
&lt;h3>λ&amp;gt;0：唯一解，而且是 a=0&lt;/h3>
&lt;p>λ&amp;gt;0 时 det=20λ&amp;gt;0，H 正定，解唯一。从公式看：a*=Sxy/(Sxx+λ)=0/λ=0，b*=ȳ−x̄·a*=1.6，J=21.2+λ·0=21.2。也就是说惩罚项把等优族里&quot;斜率绝对值最小&quot;的那一条挑了出来，拟合结果是水平线 ŷ=1.6，而且这个结果与 λ 的具体数值无关。&lt;/p>
&lt;div class=&quot;note&quot;>&lt;p class=&quot;small&quot;>&lt;strong>这里要说清边界。&lt;/strong>λ&amp;gt;0 让答案变唯一，靠的是惩罚项对 a 的偏好（同样好的解里挑 a² 最小的），数据本身对斜率没有提供任何信息：所有等优直线在 x=2 处都给 1.6。正则化在这里解决的是&quot;解不唯一、无法报出一个系数&quot;的问题，没有解决&quot;x 没有变化，所以学不到斜率&quot;的问题。把 a=0 当成数据得出的结论会误导读者的判断。&lt;/p>&lt;/div>
&lt;p>对比第 4 节的数据 A：那里 a* 随 λ 连续变化（1.4→0.7），因为 Sxx=10&amp;gt;0 记录了 x 的变化。数据 B 的 a* 在 λ&amp;gt;0 时恒为 0，与 λ 无关。两组数据的差别不在 λ，而在 Sxx。&lt;/p>
&lt;/section>

&lt;section>
&lt;h2>8 四个收束问题&lt;/h2>
&lt;h3>增大 λ 为什么改变斜率&lt;/h3>
&lt;p>公式给出 a*=Sxy/(Sxx+λ)=14/(10+λ)，对 λ 求导：da*/dλ = −Sxy/(Sxx+λ)² = −14/(10+λ)²&amp;lt;0。分母随 λ 变大，|a*| 单调变小，斜率的符号由 Sxy 决定（这里 Sxy=14&amp;gt;0，所以 a* 从 1.4 一路降到 0.7）。机制上是两种边际量的平衡：拟合项希望 a 停在对数据最贴的地方，惩罚项对 a 的边际成本是 2λa，λ 越大，同一个 a 位置上的边际成本越高，最优点就向 a=0 移动。代价也看得见：SSE 从 1.6 升到 6.5，拟合变差是被主动买下来的。&lt;/p>
&lt;h3>截距为什么会跟着变&lt;/h3>
&lt;p>因为 b*=ȳ−x̄·a*=1.6−2a*：截距被钉在&quot;直线过均值点&quot;这个条件上，没有独立自由度。a 每减少 1，b 就增加 2，保证直线仍通过 (2,1.6)。λ 从 0 到 10，a 从 1.4 降到 0.7（减少 0.7），b 从 −1.2 升到 0.2（增加 1.4），正好是 2 倍关系。第 5 节拖动 λ 时看到的&quot;绕点转动&quot;就是这个约束的几何形态。&lt;/p>
&lt;h3>为什么仍经过均值点&lt;/h3>
&lt;p>因为 ∂J/∂b=0 等价于残差之和为零，而残差之和 = n(ȳ−a·x̄−b)，于是 b=ȳ−a·x̄。这一步里 λa² 完全不参与，所以对任何 λ 都成立；它成立的根据是惩罚项不含 b，而不是 λ 恰好取某个值。反例见第 2 节末尾：一旦惩罚也含 b，方程多出 λb，残差和不再为零，直线就不必过均值点了。&lt;/p>
&lt;h3>正则化在 x 没有变化时解决了什么&lt;/h3>
&lt;p>它把&quot;无穷多个同样好的解&quot;变成&quot;一个可报出的解&quot;，挑选规则是让 a² 最小，于是 a=0、b=1.6、直线水平。它没有、也不可能提供斜率的信息：能由数据确定的组合只有 c=2a+b=1.6，所有等优解在 x=2 处预测同一个值。所以&quot;λ&amp;gt;0 时斜率唯一且为 0&quot;是惩罚项的选择结果，说成&quot;数据支持斜率 0&quot;就错了。若要研究斜率，前提是 x 有变化（Sxx&amp;gt;0），这一点正则化替代不了。&lt;/p>
&lt;h3>复现清单&lt;/h3>
&lt;ol>
&lt;li>写出 ∂J/∂b，解出 b=ȳ−a·x̄，并说明 λ 为什么不出现在这一步。&lt;/li>
&lt;li>把残差拆成 r+(ỹ−a·x̃)，指出交叉项为零用的是哪两个&quot;和为零&quot;。&lt;/li>
&lt;li>算出 Sxx=10、Sxy=14、Syy=21.2，写出 a*=14/(10+λ)，并检查 λ=0 时回到 1.4。&lt;/li>
&lt;li>配方成三项，写出下界 21.2−196/(10+λ) 与取等条件；再写出 det H=20(10+λ)，说明它为什么等价于&quot;严格凸&quot;。&lt;/li>
&lt;li>对 x 全为 2 的数据，先写 c=2a+b，再分别说明 λ=0（c 可定、a 与 b 不可定）和 λ&amp;gt;0（a=0、b=1.6，且与 λ 数值无关）各能定下什么。&lt;/li>
&lt;/ol>
&lt;/section>
&lt;/div>
&lt;script>
(function(){
  'use strict';
  var YS=[-1,0,2,2,5];
  var XS={A:[0,1,2,3,4],B:[2,2,2,2,2]};
  var NAMES={A:'数据 A：x=(0,1,2,3,4)',B:'数据 B：x 全为 2'};
  var state={lambda:2,dataset:'A'};

  function statsOf(key){
    var xs=XS[key],n=xs.length,i,xbar=0,ybar=0;
    for(i=0;i&lt;n;i++){xbar+=xs[i];ybar+=YS[i];}
    xbar=xbar/n;ybar=ybar/n;
    var Sxx=0,Sxy=0,Syy=0,dx,dy;
    for(i=0;i&lt;n;i++){dx=xs[i]-xbar;dy=YS[i]-ybar;Sxx+=dx*dx;Sxy+=dx*dy;Syy+=dy*dy;}
    return {xs:xs,n:n,xbar:xbar,ybar:ybar,Sxx:Sxx,Sxy:Sxy,Syy:Syy};
  }
  function fmt(v,d){
    if(v===null||v===undefined||!isFinite(v)){return '—';}
    var p=(d===undefined)?4:d;
    var s=v.toFixed(p);
    if(s.indexOf('.')>=0){
      s=s.replace(/0+$/,'');
      if(s.charAt(s.length-1)==='.'){s=s.slice(0,-1);}
    }
    if(s==='-0'){s='0';}
    return s;
  }
  function solve(st,lam){
    var den=st.Sxx+lam;
    if(!(den>1e-9)){return null;}
    var a=st.Sxy/den;
    return {a:a,b:st.ybar-st.xbar*a};
  }
  function sseOf(st,line){
    var s=0,i,r;
    for(i=0;i&lt;st.n;i++){r=YS[i]-(line.a*st.xs[i]+line.b);s+=r*r;}
    return s;
  }

  function plotSvg(st,sol){
    var W=440,H=320,m={l:40,r:14,t:18,b:30};
    var X0=-0.8,X1=4.8,Y0=-2.8,Y1=7.0;
    function mx(x){return m.l+(x-X0)/(X1-X0)*(W-m.l-m.r);}
    function my(y){return H-m.b-(y-Y0)/(Y1-Y0)*(H-m.t-m.b);}
    var o=[];
    o.push('&lt;defs>&lt;clipPath id=&quot;clipPlot&quot;>&lt;rect x=&quot;'+m.l+'&quot; y=&quot;'+m.t+'&quot; width=&quot;'+(W-m.l-m.r)+'&quot; height=&quot;'+(H-m.t-m.b)+'&quot;/>&lt;/clipPath>&lt;/defs>');
    o.push('&lt;rect x=&quot;'+m.l+'&quot; y=&quot;'+m.t+'&quot; width=&quot;'+(W-m.l-m.r)+'&quot; height=&quot;'+(H-m.t-m.b)+'&quot; fill=&quot;#ffffff&quot; stroke=&quot;#d9d4ca&quot;/>');
    var gx,gy;
    for(gx=0;gx&lt;=4;gx++){
      o.push('&lt;line x1=&quot;'+mx(gx)+'&quot; y1=&quot;'+m.t+'&quot; x2=&quot;'+mx(gx)+'&quot; y2=&quot;'+(H-m.b)+'&quot; stroke=&quot;#efeade&quot;/>');
      o.push('&lt;text x=&quot;'+mx(gx)+'&quot; y=&quot;'+(H-m.b+18)+'&quot; font-size=&quot;12&quot; fill=&quot;#5b6068&quot; text-anchor=&quot;middle&quot;>'+gx+'&lt;/text>');
    }
    for(gy=-2;gy&lt;=6;gy+=2){
      o.push('&lt;line x1=&quot;'+m.l+'&quot; y1=&quot;'+my(gy)+'&quot; x2=&quot;'+(W-m.r)+'&quot; y2=&quot;'+my(gy)+'&quot; stroke=&quot;#efeade&quot;/>');
      o.push('&lt;text x=&quot;'+(m.l-8)+'&quot; y=&quot;'+(my(gy)+4)+'&quot; font-size=&quot;12&quot; fill=&quot;#5b6068&quot; text-anchor=&quot;end&quot;>'+gy+'&lt;/text>');
    }
    o.push('&lt;text x=&quot;'+(W-m.r)+'&quot; y=&quot;'+(H-6)+'&quot; font-size=&quot;12&quot; fill=&quot;#5b6068&quot; text-anchor=&quot;end&quot;>x&lt;/text>');
    o.push('&lt;text x=&quot;'+(m.l-8)+'&quot; y=&quot;'+(m.t-6)+'&quot; font-size=&quot;12&quot; fill=&quot;#5b6068&quot; text-anchor=&quot;end&quot;>ŷ&lt;/text>');
    o.push('&lt;g clip-path=&quot;url(#clipPlot)&quot;>');
    var rep=sol||{a:0,b:st.ybar};
    var i,xv,yv,yh;
    for(i=0;i&lt;st.n;i++){
      xv=st.xs[i];yv=YS[i];yh=rep.a*xv+rep.b;
      o.push('&lt;line x1=&quot;'+mx(xv)+'&quot; y1=&quot;'+my(yv)+'&quot; x2=&quot;'+mx(xv)+'&quot; y2=&quot;'+my(yh)+'&quot; stroke=&quot;#b4530a&quot; stroke-width=&quot;1.6&quot; stroke-dasharray=&quot;4 3&quot; opacity=&quot;0.85&quot;/>');
    }
    if(sol){
      o.push('&lt;line x1=&quot;'+mx(X0)+'&quot; y1=&quot;'+my(sol.a*X0+sol.b)+'&quot; x2=&quot;'+mx(X1)+'&quot; y2=&quot;'+my(sol.a*X1+sol.b)+'&quot; stroke=&quot;#1d4e89&quot; stroke-width=&quot;2.6&quot;/>');
    }else{
      var slopes=[-2,-1.2,-0.6,0,0.6,1.2,2];
      for(i=0;i&lt;slopes.length;i++){
        var aa=slopes[i],bb=st.ybar-st.xbar*aa;
        o.push('&lt;line x1=&quot;'+mx(X0)+'&quot; y1=&quot;'+my(aa*X0+bb)+'&quot; x2=&quot;'+mx(X1)+'&quot; y2=&quot;'+my(aa*X1+bb)+'&quot; stroke=&quot;'+(aa===0?'#1d4e89':'#8ab2dc')+'&quot; stroke-width=&quot;'+(aa===0?2.6:1.5)+'&quot;'+(aa===0?'':' stroke-dasharray=&quot;6 4&quot;')+'/>');
      }
    }
    o.push('&lt;rect x=&quot;'+(mx(st.xbar)-7)+'&quot; y=&quot;'+(my(st.ybar)-7)+'&quot; width=&quot;14&quot; height=&quot;14&quot; fill=&quot;#fbfaf7&quot; stroke=&quot;#1d4e89&quot; stroke-width=&quot;2&quot;/>');
    for(i=0;i&lt;st.n;i++){
      o.push('&lt;circle cx=&quot;'+mx(st.xs[i])+'&quot; cy=&quot;'+my(YS[i])+'&quot; r=&quot;5.5&quot; fill=&quot;#1d1f24&quot;/>');
    }
    o.push('&lt;/g>');
    o.push('&lt;text x=&quot;'+(mx(st.xbar)+11)+'&quot; y=&quot;'+(my(st.ybar)-11)+'&quot; fill=&quot;#1d4e89&quot;>均值点&lt;/text>');
    if(!sol){
      o.push('&lt;text x=&quot;'+(m.l+8)+'&quot; y=&quot;'+(m.t+16)+'&quot; fill=&quot;#b4530a&quot;>虚线都过均值点，J 都是 21.2&lt;/text>');
    }
    return o.join('');
  }

  function curveSvg(st,sol,lam){
    var W=440,H=170,m={l:52,r:14,t:18,b:28};
    var A0=-0.4,A1=1.6;
    function cx(l){return m.l+(l/10)*(W-m.l-m.r);}
    function cy(v){return H-m.b-(v-A0)/(A1-A0)*(H-m.t-m.b);}
    var o=[];
    o.push('&lt;rect x=&quot;'+m.l+'&quot; y=&quot;'+m.t+'&quot; width=&quot;'+(W-m.l-m.r)+'&quot; height=&quot;'+(H-m.t-m.b)+'&quot; fill=&quot;#ffffff&quot; stroke=&quot;#d9d4ca&quot;/>');
    var ls=[0,2,4,6,8,10],i,v;
    for(i=0;i&lt;ls.length;i++){
      o.push('&lt;line x1=&quot;'+cx(ls[i])+'&quot; y1=&quot;'+m.t+'&quot; x2=&quot;'+cx(ls[i])+'&quot; y2=&quot;'+(H-m.b)+'&quot; stroke=&quot;#efeade&quot;/>');
      o.push('&lt;text x=&quot;'+cx(ls[i])+'&quot; y=&quot;'+(H-m.b+18)+'&quot; font-size=&quot;12&quot; fill=&quot;#5b6068&quot; text-anchor=&quot;middle&quot;>'+ls[i]+'&lt;/text>');
    }
    var vs=[0,0.5,1,1.5];
    for(i=0;i&lt;vs.length;i++){
      o.push('&lt;line x1=&quot;'+m.l+'&quot; y1=&quot;'+cy(vs[i])+'&quot; x2=&quot;'+(W-m.r)+'&quot; y2=&quot;'+cy(vs[i])+'&quot; stroke=&quot;#efeade&quot;/>');
      o.push('&lt;text x=&quot;'+(m.l-8)+'&quot; y=&quot;'+(cy(vs[i])+4)+'&quot; font-size=&quot;12&quot; fill=&quot;#5b6068&quot; text-anchor=&quot;end&quot;>'+vs[i]+'&lt;/text>');
    }
    var pts=[],l,den;
    for(l=0;l&lt;=10.001;l+=0.5){
      den=st.Sxx+l;
      if(den>1e-9){pts.push([cx(l),cy(st.Sxy/den)]);}
    }
    if(pts.length>1){
      var s=[];
      for(i=0;i&lt;pts.length;i++){s.push(pts[i][0].toFixed(1)+','+pts[i][1].toFixed(1));}
      o.push('&lt;polyline points=&quot;'+s.join(' ')+'&quot; fill=&quot;none&quot; stroke=&quot;#1d4e89&quot; stroke-width=&quot;2&quot;/>');
    }
    if(sol){
      o.push('&lt;circle cx=&quot;'+cx(lam)+'&quot; cy=&quot;'+cy(sol.a)+'&quot; r=&quot;5.5&quot; fill=&quot;#b4530a&quot;/>');
    }else{
      o.push('&lt;line x1=&quot;'+cx(0)+'&quot; y1=&quot;'+m.t+'&quot; x2=&quot;'+cx(0)+'&quot; y2=&quot;'+(H-m.b)+'&quot; stroke=&quot;#b4530a&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/>');
      o.push('&lt;text x=&quot;'+(cx(0)+8)+'&quot; y=&quot;'+(m.t+16)+'&quot; font-size=&quot;12&quot; fill=&quot;#b4530a&quot;>λ=0：a 未定&lt;/text>');
    }
    o.push('&lt;text x=&quot;'+(W-m.r)+'&quot; y=&quot;'+(H-6)+'&quot; font-size=&quot;12&quot; fill=&quot;#5b6068&quot; text-anchor=&quot;end&quot;>λ&lt;/text>');
    o.push('&lt;text x=&quot;'+(m.l-8)+'&quot; y=&quot;'+(m.t-6)+'&quot; font-size=&quot;12&quot; fill=&quot;#5b6068&quot; text-anchor=&quot;end&quot;>a*&lt;/text>');
    return o.join('');
  }

  function render(){
    var st=statsOf(state.dataset);
    var lam=state.lambda;
    var sol=solve(st,lam);
    document.getElementById('lam').value=String(lam);
    document.getElementById('lamval').textContent=fmt(lam,1);
    document.getElementById('dsA').setAttribute('aria-pressed',state.dataset==='A'?'true':'false');
    document.getElementById('dsB').setAttribute('aria-pressed',state.dataset==='B'?'true':'false');
    document.getElementById('ro-stats').textContent='当前数据组：'+NAMES[state.dataset]+'；n=5，x̄='+fmt(st.xbar)+'，ȳ='+fmt(st.ybar)+'，Sxx='+fmt(st.Sxx)+'，Sxy='+fmt(st.Sxy)+'，Syy='+fmt(st.Syy)+'。';
    var rep=sol||{a:0,b:st.ybar};
    var sse=sseOf(st,rep);
    var pen=sol?lam*sol.a*sol.a:0;
    document.getElementById('ro-lam').textContent=fmt(lam,1);
    document.getElementById('ro-a').textContent=sol?fmt(sol.a):'未定（任意 a 都同样好）';
    document.getElementById('ro-b').textContent=sol?fmt(sol.b):'1.6 − 2a（随 a 变）';
    document.getElementById('ro-c').textContent=fmt(sol?(sol.a*st.xbar+sol.b):st.ybar);
    document.getElementById('ro-sse').textContent=fmt(sse);
    document.getElementById('ro-pen').textContent=sol?fmt(pen):'0（λ=0）';
    document.getElementById('ro-J').textContent=fmt(sse+pen);
    document.getElementById('ro-jmin').textContent=sol?fmt(st.Syy-st.Sxy*st.Sxy/(st.Sxx+lam)):'不适用（Sxx+λ=0）';
    document.getElementById('ro-case').textContent=sol
      ? '唯一最优解：a*='+fmt(sol.a)+'，b*='+fmt(sol.b)+'；依据 Sxx+λ='+fmt(st.Sxx+lam)+'>0，J 严格凸。'
      : '无穷多最优解：所有满足 2a+b=1.6 的 (a,b) 都使 J=21.2；斜率 a 与截距 b 不能分别确定，只有 2a+b 确定。';
    document.getElementById('plot').innerHTML=plotSvg(st,sol);
    document.getElementById('plotnote').textContent=sol
      ? '蓝线是当前 λ 的最优直线，它穿过方块标记的均值点 (2,1.6)；橙色虚线是五个点到直线的残差，黑点是观测点。'
      : '数据 B 且 λ=0：蓝线只是其中一条最优直线，浅蓝虚线是另外几条同样最优的直线。它们都过 (2,1.6)，五条残差完全相同，目标值都是 21.2。';
    document.getElementById('curve').innerHTML=curveSvg(st,sol,lam);
    document.getElementById('curvenote').textContent=sol
      ? '小图横轴 λ（0–10），纵轴最优斜率 a*，橙点是当前 λ='+fmt(lam,1)+' 的位置：a*='+fmt(sol.a)+'。数据 A 的曲线从 1.4 单调降到 0.7。'
      : '小图横轴 λ（0–10），纵轴最优斜率 a*。数据 B 在 λ>0 时整条曲线压在 a*=0 上；λ=0 处 a 未定，用橙色竖虚线标出，不画点。';
  }

  document.getElementById('lam').addEventListener('input',function(e){
    state.lambda=Number(e.target.value);
    render();
  });
  document.getElementById('dsA').addEventListener('click',function(){state.dataset='A';render();});
  document.getElementById('dsB').addEventListener('click',function(){state.dataset='B';render();});
  document.getElementById('lam0').addEventListener('click',function(){state.lambda=0;render();});
  document.getElementById('lam10').addEventListener('click',function(){state.lambda=10;render();});

  if(window.presentation&amp;&amp;window.presentation.registerStateReader){
    window.presentation.registerStateReader(function(){
      var st=statsOf(state.dataset);
      var sol=solve(st,state.lambda);
      return {
        values:{lambda:state.lambda,dataset:state.dataset},
        visible_step:null,
        observation:{
          summary:'λ='+fmt(state.lambda,1)+'，数据组 '+state.dataset+'，斜率 '+(sol?fmt(sol.a):'未定')+'，目标值 J 见读数。',
          state:{lambda:state.lambda,dataset:state.dataset,solvable:!!sol}
        }
      };
    });
  }
  if(window.presentation&amp;&amp;window.presentation.registerStateRestorer){
    window.presentation.registerStateRestorer(function(saved){
      var v=(saved&amp;&amp;saved.values)?saved.values:{};
      if(v.page&amp;&amp;typeof v.page==='object'){v=v.page;}
      if(typeof v.lambda==='number'&amp;&amp;isFinite(v.lambda)){state.lambda=Math.min(10,Math.max(0,v.lambda));}
      if(v.dataset==='A'||v.dataset==='B'){state.dataset=v.dataset;}
      render();
    });
  }

  render();
})();
&lt;/script>&lt;/body>&lt;/html>"></iframe></body></html>
