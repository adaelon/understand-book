  &lt;h1>u 被用了两次，反向传播怎么不漏算&lt;/h1>
  &lt;p class=&quot;lede&quot;>这里只有一个模型，全部是实数：u = x·y，v = u + x，L = v² + 3u。u 只算一次，却有两处用它；x 也有两条路进入 L。下面先分清图上同时出现的三种数，再按依赖顺序算前向，然后从 L 往回走，看两份信息在哪里汇合、汇合之后才继续传回输入。&lt;/p>
&lt;/header>

&lt;section>
  &lt;h2>1 先分清图上的三种数字&lt;/h2>
  &lt;p>节点代表一个量，箭头代表&quot;这个量由那个量算出来&quot;。同一张图上写着三种数，它们的作用完全不同：&lt;/p>
  &lt;ul>
    &lt;li>&lt;b>节点的前向数值&lt;/b>：这个量当前等于多少，例如 u = 6。&lt;/li>
    &lt;li>&lt;b>边上的局部导数&lt;/b>：只对这一条边求导，把其他量都当作不变。例如边 x→u 上，u = x·y 对 x 的局部导数是 y；边 u→v 上，v = u + x 对 u 的局部导数是 1。&lt;/li>
    &lt;li>&lt;b>节点的整体导数&lt;/b>（图上写 dL/d·）：从 L 出发、沿所有路径回到这个量得到的总效果，例如 dL/du = 19。&lt;/li>
  &lt;/ul>
  &lt;p>最容易混的一对数字都落在 u 上。边 u→L 的局部导数是 3，来自 L 里的 3u 这一项；节点 u 的整体导数是 19，是两条来路合起来的结果。图上把局部导数写成 &lt;span class=&quot;mono&quot;>×3&lt;/span>、&lt;span class=&quot;mono&quot;>×1&lt;/span> 这样的乘数，表示&quot;把收到的梯度乘上它，再往下交&quot;。&lt;/p>
&lt;/section>

    &lt;/figure>

    &lt;p class=&quot;small muted&quot;>实线是前向的依赖箭头；accent 颜色的粗线是这一步正在算的边，虚线是回传的边。节点第一行是前向数值，第二行是整体导数 dL/d·，还没算到时显示 —。边上的 × 是这条边的局部导数。&lt;/p>

    &lt;div class=&quot;tables&quot;>
      &lt;div class=&quot;tbl&quot;>
        &lt;h4>前向数值（节点）&lt;/h4>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>u = x·y&lt;/span>&lt;span class=&quot;v&quot; id=&quot;fwdu&quot;>&lt;/span>&lt;/div>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>v = u + x&lt;/span>&lt;span class=&quot;v&quot; id=&quot;fwdv&quot;>&lt;/span>&lt;/div>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>L = v² + 3u&lt;/span>&lt;span class=&quot;v&quot; id=&quot;fwdL&quot;>&lt;/span>&lt;/div>
      &lt;/div>
      &lt;div class=&quot;tbl&quot;>
        &lt;h4>边上的局部导数&lt;/h4>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>x → u&lt;/span>&lt;span class=&quot;v&quot; id=&quot;evxu&quot;>&lt;/span>&lt;/div>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>y → u&lt;/span>&lt;span class=&quot;v&quot; id=&quot;evyu&quot;>&lt;/span>&lt;/div>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>u → v&lt;/span>&lt;span class=&quot;v&quot;>∂v/∂u = 1&lt;/span>&lt;/div>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>x → v&lt;/span>&lt;span class=&quot;v&quot;>∂v/∂x = 1&lt;/span>&lt;/div>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>u → L&lt;/span>&lt;span class=&quot;v&quot;>∂L/∂u = 3&lt;/span>&lt;/div>
        &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>v → L&lt;/span>&lt;span class=&quot;v&quot; id=&quot;evvL&quot;>&lt;/span>&lt;/div>
      &lt;/div>
    &lt;/div>

    &lt;div class=&quot;tbl full&quot;>
      &lt;h4>反向累积（按步出现）&lt;/h4>
      &lt;div class=&quot;row wide off&quot; id=&quot;guL&quot;>&lt;span class=&quot;calc&quot;>&lt;/span>&lt;span class=&quot;wait&quot;>还没算到这一步&lt;/span>&lt;/div>
      &lt;div class=&quot;row wide off&quot; id=&quot;guv&quot;>&lt;span class=&quot;calc&quot;>&lt;/span>&lt;span class=&quot;wait&quot;>还没算到这一步&lt;/span>&lt;/div>
      &lt;div class=&quot;row wide off&quot; id=&quot;guu&quot;>&lt;span class=&quot;calc&quot;>&lt;/span>&lt;span class=&quot;wait&quot;>还没算到这一步&lt;/span>&lt;/div>
      &lt;div class=&quot;row wide off&quot; id=&quot;gux&quot;>&lt;span class=&quot;calc&quot;>&lt;/span>&lt;span class=&quot;wait&quot;>还没算到这一步&lt;/span>&lt;/div>
      &lt;div class=&quot;row wide off&quot; id=&quot;guy&quot;>&lt;span class=&quot;calc&quot;>&lt;/span>&lt;span class=&quot;wait&quot;>还没算到这一步&lt;/span>&lt;/div>
    &lt;/div>
  &lt;/div>
&lt;/section>

&lt;section>
  &lt;h2>3 前向：三个数怎么算出来&lt;/h2>
  &lt;p>前向只有一个方向，每一步只用手上已经有的数。&lt;/p>
  &lt;p>第一步，u = x·y = 2 × 3 = 6。这个 6 就是后面两处用到的同一个数。&lt;/p>
  &lt;p>第二步，v = u + x = 6 + 2 = 8。这里出现两个来源：u 用的是刚算出的 6；x 用的是输入本身 2，没有经过 u。&lt;/p>
  &lt;p>第三步，L = v² + 3u = 8² + 3 × 6 = 64 + 18 = 82。u 在这里第二次被使用，代入的还是 6。3u 里的系数 3 就是 L 对 u 在这一条边上的局部导数。&lt;/p>
  &lt;p>前向走完，每个节点有了一个数，每条边也有了一个数。边上的数这样来：只对这一条边求导，其余量当作不变。u = x·y 对 x 求导得 y，所以边 x→u 上是 3；u 对 y 求导得 x，所以边 y→u 上是 2；v = u + x 里 u 与 x 的系数都是 1；L = v² + 3u 对 v 求导得 2v = 16，对 u 求导得 3。&lt;/p>
&lt;/section>

&lt;section>
  &lt;h2>4 反向：三条规则和一个顺序&lt;/h2>
  &lt;p>反向只重复三件事，一直做到输入为止。&lt;/p>
  &lt;ol>
    &lt;li>&lt;b>在 L 上放种子。&lt;/b>L 对 L 的导数是 1，这是唯一的起点。&lt;/li>
    &lt;li>&lt;b>一条边做一次乘法。&lt;/b>把上游那个量的整体导数，乘以这条边的局部导数，交给下游的量。&lt;/li>
    &lt;li>&lt;b>一个量收齐所有来路再相加。&lt;/b>它在图上有几条出边，就会收到几份；相加得到它的整体导数，这个整体导数才有资格继续往回传。&lt;/li>
  &lt;/ol>
  &lt;p>顺序由依赖关系定。u 的值喂给 v，所以 v 的整体导数要先算出来，u 才可能收齐。反向的顺序就是前向的倒序：L → v → u → x、y。&lt;/p>
  &lt;p>反过来做会缺数：先算 u 的时候，dL/dv 还不存在，边 u→v 就没有东西可乘，u 只能拿到直接边上的 3。&lt;/p>
&lt;/section>

&lt;section>
  &lt;h2>5 在 u 汇合：3 加 16 等于 19&lt;/h2>
  &lt;p>从 L 往下走一步到 v。边 v→L 的局部导数是 2v = 16，上游的种子是 1，所以 dL/dv = 16 × 1 = 16。&lt;/p>
  &lt;p>再往下到 u。u 有两条出边，因此收到两份：&lt;/p>
  &lt;ul>
    &lt;li>边 u→L（来自 3u）：局部导数 3，乘上游的 1，得 3。&lt;/li>
    &lt;li>边 u→v（来自 v = u + x）：局部导数 1，乘上游的 16，得 16。&lt;/li>
  &lt;/ul>
  &lt;p>两份相加：dL/du = 3 + 16 = 19。这两份记的是同一个 u 的两次使用，所以都进账。&lt;/p>
  &lt;p>为什么相加，用具体运算看：把 u 单独放大一点点 ε，其余都不动。3u 这一项让 L 增加约 3ε；v 跟着增加 ε，L 里 v² 这一项让 L 增加约 2v·ε = 16ε。两件事同时发生，L 总共增加约 19ε。少记任意一项，估出的变化量都会偏小。&lt;/p>
  &lt;p>这里&quot;把 u 单独放大&quot;是记账用的说法。实际上 u = x·y 跟着 x、y 走，而 dL/du 记的正是&quot;u 变化时 L 跟着变多快&quot;，u 有两处使用，两处都要记进来。19 收齐之后，才轮到 u 把梯度交回去——这一点决定了顺序：u 必须先等 v。&lt;/p>
  &lt;p>回到 x。x 也有两条出边：&lt;/p>
  &lt;ul>
    &lt;li>边 x→u：局部导数 ∂u/∂x = y = 3，乘 u 的整体导数 19，得 57。&lt;/li>
    &lt;li>边 x→v：局部导数 ∂v/∂x = 1，乘 v 的整体导数 16（这条边从 v 出发，用的是 16，不是 19），得 16。&lt;/li>
  &lt;/ul>
  &lt;p>dL/dx = 57 + 16 = 73。&lt;/p>
  &lt;p>回到 y。y 只有一条出边 y→u，局部导数 ∂u/∂y = x = 2，所以 dL/dy = 19 × 2 = 38。&lt;/p>
&lt;/section>

&lt;section>
  &lt;h2>6 漏掉一份会怎样&lt;/h2>
  &lt;p>假设只保留经 v 的那一份，忘了边 u→L 上的 3。这时 dL/du 被算成 16，缺口继续往回传：dL/dx 变成 16×3 + 16×1 = 64（正确值 73），dL/dy 变成 16×2 = 32（正确值 38）。&lt;/p>
  &lt;p>少掉的 9 和 6 有明确来路：漏掉的 3 在 u 处亏空，传到 x 要乘 ∂u/∂x = y = 3，于是差 9；传到 y 要乘 ∂u/∂y = x = 2，于是差 6。一个漏项会在每个下游输入上留下按局部导数缩放的误差。&lt;/p>
  &lt;p>这种错误在图上不容易看出来，因为所有数字都像正常算出来的。它会在核对时暴露：展开式求导给出 73 和 38，与漏算的 64、32 对不上。&lt;/p>

  &lt;div class=&quot;card&quot;>
    &lt;h3>选择漏掉哪一份&lt;/h3>
    &lt;div class=&quot;opts&quot; role=&quot;group&quot; aria-label=&quot;选择漏掉哪一份贡献&quot;>
      &lt;button type=&quot;button&quot; class=&quot;seg&quot; data-omit=&quot;none&quot; aria-pressed=&quot;true&quot;>两份都算（正确）&lt;/button>
      &lt;button type=&quot;button&quot; class=&quot;seg&quot; data-omit=&quot;direct&quot;>漏掉 u→L 上的 3（只留经 v 的路）&lt;/button>
      &lt;button type=&quot;button&quot; class=&quot;seg&quot; data-omit=&quot;viaV&quot;>漏掉经 v 的那一份（只留 u→L）&lt;/button>
    &lt;/div>
    &lt;div class=&quot;omit-out&quot;>
      &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>dL/du&lt;/span>&lt;span class=&quot;v&quot; id=&quot;o-du&quot;>&lt;/span>&lt;/div>
      &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>dL/dx&lt;/span>&lt;span class=&quot;v&quot;>&lt;span id=&quot;o-dx&quot;>&lt;/span> &lt;span class=&quot;muted&quot; id=&quot;o-dx-note&quot;>&lt;/span>&lt;/span>&lt;/div>
      &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>dL/dy&lt;/span>&lt;span class=&quot;v&quot;>&lt;span id=&quot;o-dy&quot;>&lt;/span> &lt;span class=&quot;muted&quot; id=&quot;o-dy-note&quot;>&lt;/span>&lt;/span>&lt;/div>
    &lt;/div>
    &lt;p class=&quot;small&quot; id=&quot;o-msg&quot;>&lt;/p>
  &lt;/div>
&lt;/section>

&lt;section>
  &lt;h2>7 独立核对：把 L 展开再求导&lt;/h2>
  &lt;p>把 u、v 代回去，L 只含 x、y：&lt;/p>
  &lt;div class=&quot;eq&quot;>L = (xy + x)² + 3xy = x²y² + 2x²y + x² + 3xy&lt;/div>
  &lt;p class=&quot;small muted&quot;>中间用了一次 (xy + x)² = x²(y + 1)² = x²y² + 2x²y + x²。&lt;/p>

  &lt;div class=&quot;card&quot;>
    &lt;h3>两种写法给出同一个 L&lt;/h3>
    &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>L = (xy + x)² + 3xy&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ex-L1&quot;>&lt;/span>&lt;/div>
    &lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>L = x²y² + 2x²y + x² + 3xy&lt;/span>&lt;span class=&quot;v&quot; id=&quot;ex-L2&quot;>&lt;/span>&lt;/div>

    &lt;h3>对 x 求导（把 y 当常数）&lt;/h3>
    &lt;div class=&quot;eq&quot;>∂L/∂x = 2xy² + 4xy + 2x + 3y&lt;/div>
    &lt;div class=&quot;tbl&quot; id=&quot;ex-dx-terms&quot;>&lt;/div>
    &lt;p class=&quot;small&quot; id=&quot;ex-dx-sum&quot;>&lt;/p>

    &lt;h3>对 y 求导（把 x 当常数）&lt;/h3>
    &lt;div class=&quot;eq&quot;>∂L/∂y = 2x²y + 2x² + 3x&lt;/div>
    &lt;div class=&quot;tbl&quot; id=&quot;ex-dy-terms&quot;>&lt;/div>
    &lt;p class=&quot;small&quot; id=&quot;ex-dy-sum&quot;>&lt;/p>

    &lt;p class=&quot;small&quot; id=&quot;ex-check&quot;>&lt;/p>
  &lt;/div>
&lt;/section>

&lt;section>
  &lt;h2>8 负数与零怎么读&lt;/h2>
  &lt;p>输入可以取负，局部导数也可以取负，整体导数随之变号。导数为负的意思是：在这一点附近把该输入增大一点，L 会变小，那个负数是变化率。把 x 拖到 -3、y 保持 3，图上仍有同样的六条边和同样的加法，只是每份贡献带上了符号：dL/dv = -24，dL/du = 3 - 24 = -21，dL/dx = -21×3 - 24 = -87，dL/dy = -21×(-3) = 63。&lt;/p>
  &lt;p>某一份恰好是 0 也有确定含义：那一条边的局部导数是 0，这条路径在这一瞬间不贡献，路径本身仍然在，别的路径照常贡献、照常相加。&lt;/p>
  &lt;p>点预设“x=0：∂u/∂y 变 0”可以看到：u = 0，∂u/∂y = x = 0，于是 dL/dy = dL/du × 0 = 0。y 变化一点，L 的一阶变化为零。同时 v = u + x = 0，∂L/∂v = 2v = 0，经 v 的那一份对 u 的贡献也归零，dL/du 剩下直接边上的 3；x 的梯度是 3 × 3 = 9，全部来自 x→u 这一条路。&lt;/p>
  &lt;p>点预设“y=-1：v 变 0”可以看到：v = u + x = x(y + 1) = 0，于是 ∂L/∂v = 2v = 0，经 v 的那一份对 u 的贡献是 0，dL/du = 3。这时如果把直接边上的 3 也漏掉，dL/du 会变成 0，两个输入梯度跟着全部变成 0——这正是&quot;漏算&quot;最安静的失败方式。&lt;/p>
  &lt;div class=&quot;card&quot;>
    &lt;h4>当前输入下的提示&lt;/h4>
    &lt;div id=&quot;notes&quot;>&lt;/div>
  &lt;/div>
&lt;/section>

&lt;section>
  &lt;h2>9 自检&lt;/h2>
  &lt;p>先自己想，再展开对答案。&lt;/p>

  &lt;details>
    &lt;summary>漏掉 u→L 上的 3，为什么 dL/dy 会错成 16 × 2 = 32？&lt;/summary>
    &lt;p>y 只通过 u 影响 L，所以 dL/dy = dL/du × ∂u/∂y = dL/du × x。漏掉 3 之后 dL/du 少 3，传到 y 时又乘上 ∂u/∂y = x = 2，于是 dL/dy 少 3 × 2 = 6，从 38 掉到 32。缺口大小取决于漏掉的那一份在 u 处是多少、以及 u 到 y 的局部导数是多少。&lt;/p>
  &lt;/details>

  &lt;details>
    &lt;summary>为什么一定要先算 v 再算 u，不能反过来？&lt;/summary>
    &lt;p>u 的一份贡献来自边 u→v，它要乘的是 dL/dv。dL/dv 还没算出来时，这一份没有数可乘，u 只能拿到直接边上的 3，dL/du 会是 3 而不是 19。反序并不违反哪条公式，它只是让 u 在收齐之前就被定了值。&lt;/p>
  &lt;/details>

  &lt;details>
    &lt;summary>两份贡献一正一负（或都为负）时还相加吗？&lt;/summary>
    &lt;p>照样相加。每一份的符号由那条边的局部导数决定，和就是这些一阶效果的总和；和可能落在两份之间，也可能比两份都更负。相加这一步记的是&quot;同一个量有几处使用&quot;，与每份的正负无关。&lt;/p>
  &lt;/details>
&lt;/section>

&lt;/main>

&lt;script>
(function(){
  &quot;use strict&quot;;
  var P = window.presentation || null;
  var ORDER = 8;

  function $(id){ return document.getElementById(id); }
  function fmt(n){
    if(typeof n !== &quot;number&quot; || !isFinite(n)) return &quot;—&quot;;
    var r = Math.round(n * 10000) / 10000;
    if(Object.is(r, -0)) r = 0;
    return String(r);
  }
  function tx(n){ return n &lt; 0 ? &quot;(&quot; + fmt(n) + &quot;)&quot; : fmt(n); }
  function join2(vals){
    var out = [];
    for(var i = 0; i &lt; vals.length; i++){
      var v = vals[i];
      if(i === 0) out.push(fmt(v));
      else out.push(v &lt; 0 ? &quot;− &quot; + fmt(-v) : &quot;+ &quot; + fmt(v));
    }
    return out.join(&quot; &quot;);
  }
  function snap(v){
    var c = Math.max(-3, Math.min(3, v));
    return Math.round(c * 2) / 2;
  }

  var S = {x: 2, y: 3, step: ORDER, omit: &quot;none&quot;};
  (function(){
    var init = (P &amp;&amp; P.initialState) ? P.initialState : {};
    if(typeof init.x === &quot;number&quot;) S.x = snap(init.x);
    if(typeof init.y === &quot;number&quot;) S.y = snap(init.y);
    if(typeof init.step === &quot;number&quot;) S.step = Math.max(1, Math.min(ORDER, Math.round(init.step)));
    if(init.omit === &quot;none&quot; || init.omit === &quot;direct&quot; || init.omit === &quot;viaV&quot;) S.omit = init.omit;
  })();

  function model(){
    var x = S.x, y = S.y;
    var u = x * y, v = u + x, L = v * v + 3 * u;
    var dLdv = 2 * v;
    var duDirect = 3, duViaV = dLdv;
    var dLdu = duDirect + duViaV;
    var dxU = dLdu * y, dxV = dLdv;
    var dLdx = dxU + dxV;
    var dLdy = dLdu * x;
    var usedDu = S.omit === &quot;direct&quot; ? duViaV : (S.omit === &quot;viaV&quot; ? duDirect : dLdu);
    var oDx = usedDu * y + dLdv;
    var oDy = usedDu * x;
    return {
      x: x, y: y, u: u, v: v, L: L,
      dLdv: dLdv, duDirect: duDirect, duViaV: duViaV, dLdu: dLdu,
      dxU: dxU, dxV: dxV, dLdx: dLdx, dLdy: dLdy,
      usedDu: usedDu, oDx: oDx, oDy: oDy,
      missDu: dLdu - usedDu, missDx: dLdx - oDx, missDy: dLdy - oDy
    };
  }

  function stepText(m){
    switch(S.step){
      case 1: return &quot;算 u：&quot; + fmt(m.x) + &quot; × &quot; + fmt(m.y) + &quot; = &quot; + fmt(m.u);
      case 2: return &quot;算 v：&quot; + fmt(m.u) + &quot; + &quot; + fmt(m.x) + &quot; = &quot; + fmt(m.v);
      case 3: return &quot;算 L：&quot; + tx(m.v) + &quot;² + 3×&quot; + tx(m.u) + &quot; = &quot; + fmt(m.L);
      case 4: return &quot;在 L 放种子：dL/dL = 1&quot;;
      case 5: return &quot;算 v 的整体导数：2v × 1 = &quot; + fmt(m.dLdv);
      case 6: return &quot;u 收到两份：&quot; + fmt(m.duDirect) + &quot; 与 &quot; + fmt(m.duViaV) + &quot;，相加得 &quot; + fmt(m.dLdu);
      case 7: return &quot;回到 x：两路 &quot; + fmt(m.dxU) + &quot; 与 &quot; + fmt(m.dxV) + &quot;，相加得 &quot; + fmt(m.dLdx);
      default: return &quot;回到 y：一路 &quot; + fmt(m.dLdu) + &quot; × &quot; + tx(m.x) + &quot; = &quot; + fmt(m.dLdy);
    }
  }

  function setNode(id, val, grad, gradOn, active){
    var g = $(id);
    g.classList.toggle(&quot;on&quot;, !!active);
    g.classList.toggle(&quot;gradon&quot;, !!gradOn);
    g.querySelector(&quot;.nval&quot;).textContent = val;
    g.querySelector(&quot;.ngrad&quot;).textContent = gradOn ? grad : &quot;—&quot;;
  }

  function grow(id, on, html){
    var r = $(id);
    r.classList.toggle(&quot;off&quot;, !on);
    r.querySelector(&quot;.calc&quot;).innerHTML = html;
  }

  function termRows(target, rows){
    target.innerHTML = rows.map(function(r){
      return '&lt;div class=&quot;row&quot;>&lt;span class=&quot;k&quot;>' + r[0] + '&lt;/span>&lt;span class=&quot;v&quot;>' + r[1] + ' = ' + fmt(r[2]) + '&lt;/span>&lt;/div>';
    }).join(&quot;&quot;);
  }

  var EDGE_ON = {
    1: [&quot;e-yu&quot;, &quot;e-xu&quot;],
    2: [&quot;e-uv&quot;, &quot;e-xv&quot;],
    3: [&quot;e-uL&quot;, &quot;e-vL&quot;],
    4: [],
    5: [&quot;e-vL&quot;],
    6: [&quot;e-uL&quot;, &quot;e-uv&quot;],
    7: [&quot;e-xu&quot;, &quot;e-xv&quot;],
    8: [&quot;e-yu&quot;]
  };
  var ALL_EDGES = [&quot;e-yu&quot;, &quot;e-uv&quot;, &quot;e-xu&quot;, &quot;e-xv&quot;, &quot;e-uL&quot;, &quot;e-vL&quot;];

  function render(){
    var m = model();

    $(&quot;in-x&quot;).value = String(S.x);
    $(&quot;in-y&quot;).value = String(S.y);
    $(&quot;val-x&quot;).textContent = fmt(S.x);
    $(&quot;val-y&quot;).textContent = fmt(S.y);

    $(&quot;status&quot;).innerHTML =
      '&lt;span>当前输入 &lt;b>x = ' + fmt(S.x) + '&lt;/b>，&lt;b>y = ' + fmt(S.y) + '&lt;/b>&lt;/span>' +
      '&lt;span class=&quot;stepchip&quot;>第 ' + S.step + ' / ' + ORDER + ' 步&lt;/span>' +
      '&lt;span class=&quot;steptext&quot;>' + stepText(m) + '&lt;/span>';

    $(&quot;step-count&quot;).textContent = &quot;第 &quot; + S.step + &quot; / &quot; + ORDER + &quot; 步&quot;;
    $(&quot;btn-prev&quot;).disabled = S.step &lt;= 1;
    $(&quot;btn-next&quot;).disabled = S.step >= ORDER;
    $(&quot;btn-first&quot;).disabled = S.step &lt;= 1;
    $(&quot;btn-last&quot;).disabled = S.step >= ORDER;

    $(&quot;figcap&quot;).textContent = &quot;图上的数对应当前输入 x = &quot; + fmt(S.x) + &quot;、y = &quot; + fmt(S.y) + &quot;，显示到第 &quot; + S.step + &quot; 步。&quot;;

    setNode(&quot;n-x&quot;, &quot;x = &quot; + fmt(m.x), &quot;dL/dx = &quot; + fmt(m.dLdx), S.step >= 7, S.step === 7);
    setNode(&quot;n-y&quot;, &quot;y = &quot; + fmt(m.y), &quot;dL/dy = &quot; + fmt(m.dLdy), S.step >= 8, S.step === 8);
    setNode(&quot;n-u&quot;, &quot;u = &quot; + fmt(m.u), &quot;dL/du = &quot; + fmt(m.dLdu), S.step >= 6, S.step === 6);
    setNode(&quot;n-v&quot;, &quot;v = &quot; + fmt(m.v), &quot;dL/dv = &quot; + fmt(m.dLdv), S.step >= 5, S.step === 5);
    setNode(&quot;n-L&quot;, &quot;L = &quot; + fmt(m.L), &quot;dL/dL = 1&quot;, S.step >= 4, S.step === 4);

    $(&quot;e-yu-l&quot;).textContent = &quot;×&quot; + tx(m.x);
    $(&quot;e-xu-l&quot;).textContent = &quot;×&quot; + tx(m.y);
    $(&quot;e-uv-l&quot;).textContent = &quot;×1&quot;;
    $(&quot;e-xv-l&quot;).textContent = &quot;×1&quot;;
    $(&quot;e-uL-l&quot;).textContent = &quot;×3&quot;;
    $(&quot;e-vL-l&quot;).textContent = &quot;×&quot; + tx(2 * m.v);

    for(var i = 0; i &lt; ALL_EDGES.length; i++){
      var id = ALL_EDGES[i];
      var el = $(id);
      var on = EDGE_ON[S.step].indexOf(id) >= 0;
      el.classList.remove(&quot;fwd&quot;, &quot;back&quot;);
      if(on) el.classList.add(S.step >= 5 ? &quot;back&quot; : &quot;fwd&quot;);
      el.setAttribute(&quot;marker-end&quot;, on ? &quot;url(#arA)&quot; : &quot;url(#ar)&quot;);
    }

    $(&quot;fwdu&quot;).textContent = fmt(m.x) + &quot; × &quot; + fmt(m.y) + &quot; = &quot; + fmt(m.u);
    $(&quot;fwdv&quot;).textContent = fmt(m.u) + &quot; + &quot; + fmt(m.x) + &quot; = &quot; + fmt(m.v);
    $(&quot;fwdL&quot;).textContent = tx(m.v) + &quot;² + 3×&quot; + tx(m.u) + &quot; = &quot; + join2([m.v * m.v, 3 * m.u]) + &quot; = &quot; + fmt(m.L);

    $(&quot;evxu&quot;).textContent = &quot;∂u/∂x = y = &quot; + fmt(m.y);
    $(&quot;evyu&quot;).textContent = &quot;∂u/∂y = x = &quot; + fmt(m.x);
    $(&quot;evvL&quot;).textContent = &quot;∂L/∂v = 2v = &quot; + fmt(2 * m.v);

    grow(&quot;guL&quot;, S.step >= 4, &quot;dL/dL = 1　（反向的种子，唯一从外面给进来的数）&quot;);
    grow(&quot;guv&quot;, S.step >= 5, &quot;dL/dv = 2v × 1 = &quot; + fmt(2 * m.v) + &quot; × 1 = &quot; + fmt(m.dLdv) + &quot;　（边 v→L 的局部导数乘上游的 1）&quot;);
    grow(&quot;guu&quot;, S.step >= 6, &quot;dL/du = 3 + dL/dv × 1 = 3 + &quot; + fmt(m.dLdv) + &quot; = &quot; + fmt(m.dLdu) + &quot;　（3 来自 u→L， &quot; + fmt(m.duViaV) + &quot; 来自经 v）&quot;);
    grow(&quot;gux&quot;, S.step >= 7, &quot;dL/dx = dL/du × y + dL/dv × 1 = &quot; + fmt(m.dLdu) + &quot; × &quot; + tx(m.y) + &quot; + &quot; + fmt(m.dLdv) + &quot; × 1 = &quot; + join2([m.dxU, m.dxV]) + &quot; = &quot; + fmt(m.dLdx));
    grow(&quot;guy&quot;, S.step >= 8, &quot;dL/dy = dL/du × x = &quot; + fmt(m.dLdu) + &quot; × &quot; + tx(m.x) + &quot; = &quot; + fmt(m.dLdy));

    var omitBtns = document.querySelectorAll(&quot;[data-omit]&quot;);
    for(var j = 0; j &lt; omitBtns.length; j++){
      omitBtns[j].setAttribute(&quot;aria-pressed&quot;, omitBtns[j].getAttribute(&quot;data-omit&quot;) === S.omit ? &quot;true&quot; : &quot;false&quot;);
    }

    $(&quot;o-du&quot;).textContent = fmt(m.usedDu);
    $(&quot;o-dx&quot;).textContent = fmt(m.oDx);
    $(&quot;o-dy&quot;).textContent = fmt(m.oDy);
    $(&quot;o-dx-note&quot;).textContent = S.omit === &quot;none&quot; ? &quot;&quot; : &quot;（应为 &quot; + fmt(m.dLdx) + &quot;）&quot;;
    $(&quot;o-dy-note&quot;).textContent = S.omit === &quot;none&quot; ? &quot;&quot; : &quot;（应为 &quot; + fmt(m.dLdy) + &quot;）&quot;;
    if(S.omit === &quot;none&quot;){
      $(&quot;o-msg&quot;).textContent = &quot;两条来路都入账：&quot; + fmt(m.duDirect) + &quot; + &quot; + fmt(m.duViaV) + &quot; = &quot; + fmt(m.dLdu) + &quot;；这个总数再分别乘 x→u、x→v、y→u 的局部导数传回输入。&quot;;
    } else {
      var which = S.omit === &quot;direct&quot; ? &quot;u→L 上的 3&quot; : &quot;经 v 的那一份（&quot; + fmt(m.duViaV) + &quot;）&quot;;
      $(&quot;o-msg&quot;).textContent = &quot;漏掉 &quot; + which + &quot; 后，dL/du 少了 &quot; + fmt(m.missDu) + &quot;。误差传到 x 要乘 ∂u/∂x = y = &quot; + fmt(m.y) + &quot;，所以 dL/dx 的误差是 &quot; + fmt(m.missDx) + &quot;；传到 y 要乘 ∂u/∂y = x = &quot; + fmt(m.x) + &quot;，所以 dL/dy 的误差是 &quot; + fmt(m.missDy) + &quot;。&quot;;
    }

    $(&quot;ex-L1&quot;).textContent = &quot;(&quot; + tx(m.x) + &quot;·&quot; + tx(m.y) + &quot; + &quot; + tx(m.x) + &quot;)² + 3·&quot; + tx(m.x) + &quot;·&quot; + tx(m.y) + &quot; = &quot; + join2([m.v * m.v, 3 * m.u]) + &quot; = &quot; + fmt(m.L);
    var Lsym = [tx(m.x) + &quot;²·&quot; + tx(m.y) + &quot;²&quot;, &quot;2·&quot; + tx(m.x) + &quot;²·&quot; + tx(m.y), tx(m.x) + &quot;²&quot;, &quot;3·&quot; + tx(m.x) + &quot;·&quot; + tx(m.y)];
    var Lval = [m.x * m.x * m.y * m.y, 2 * m.x * m.x * m.y, m.x * m.x, 3 * m.x * m.y];
    $(&quot;ex-L2&quot;).textContent = Lsym.join(&quot; + &quot;) + &quot; = &quot; + join2(Lval) + &quot; = &quot; + fmt(m.L);

    var dxTerms = [
      [&quot;2·x·y²&quot;, &quot;2·&quot; + tx(m.x) + &quot;·&quot; + fmt(m.y * m.y), 2 * m.x * m.y * m.y],
      [&quot;4·x·y&quot;, &quot;4·&quot; + tx(m.x) + &quot;·&quot; + tx(m.y), 4 * m.x * m.y],
      [&quot;2·x&quot;, &quot;2·&quot; + tx(m.x), 2 * m.x],
      [&quot;3·y&quot;, &quot;3·&quot; + tx(m.y), 3 * m.y]
    ];
    var dyTerms = [
      [&quot;2·x²·y&quot;, &quot;2·&quot; + fmt(m.x * m.x) + &quot;·&quot; + tx(m.y), 2 * m.x * m.x * m.y],
      [&quot;2·x²&quot;, &quot;2·&quot; + fmt(m.x * m.x), 2 * m.x * m.x],
      [&quot;3·x&quot;, &quot;3·&quot; + tx(m.x), 3 * m.x]
    ];
    termRows($(&quot;ex-dx-terms&quot;), dxTerms);
    termRows($(&quot;ex-dy-terms&quot;), dyTerms);

    var sumDx = 2 * m.x * m.y * m.y + 4 * m.x * m.y + 2 * m.x + 3 * m.y;
    var sumDy = 2 * m.x * m.x * m.y + 2 * m.x * m.x + 3 * m.x;
    $(&quot;ex-dx-sum&quot;).innerHTML = &quot;∂L/∂x = &quot; + join2([dxTerms[0][2], dxTerms[1][2], dxTerms[2][2], dxTerms[3][2]]) + &quot; = &lt;b>&quot; + fmt(sumDx) + &quot;&lt;/b>&quot;;
    $(&quot;ex-dy-sum&quot;).innerHTML = &quot;∂L/∂y = &quot; + join2([dyTerms[0][2], dyTerms[1][2], dyTerms[2][2]]) + &quot; = &lt;b>&quot; + fmt(sumDy) + &quot;&lt;/b>&quot;;
    var agree = Math.abs(sumDx - m.dLdx) &lt; 1e-9 &amp;&amp; Math.abs(sumDy - m.dLdy) &lt; 1e-9;
    $(&quot;ex-check&quot;).textContent = agree
      ? &quot;图上反向算出 dL/dx = &quot; + fmt(m.dLdx) + &quot;、dL/dy = &quot; + fmt(m.dLdy) + &quot;；展开式直接求导给出 &quot; + fmt(sumDx) + &quot; 和 &quot; + fmt(sumDy) + &quot;。两条路算出的数相同。&quot;
      : &quot;图上得到 &quot; + fmt(m.dLdx) + &quot; 和 &quot; + fmt(m.dLdy) + &quot;，展开式得到 &quot; + fmt(sumDx) + &quot; 和 &quot; + fmt(sumDy) + &quot;，两处不一致。&quot;;

    var notes = [];
    if(m.duViaV === 0) notes.push(&quot;v = 0，所以 ∂L/∂v = 2v = 0：经 v 的那一份对 u 的贡献是 0，u→L 上的 3 还在，dL/du = &quot; + fmt(m.dLdu) + &quot;。&quot;);
    if(m.y === 0) notes.push(&quot;∂u/∂x = y = 0：x 经 u 的那条路此刻不贡献，dL/dx 全部来自 x→v，等于 &quot; + fmt(m.dLdx) + &quot;。&quot;);
    if(m.x === 0) notes.push(&quot;∂u/∂y = x = 0：y 只有这一条出边，所以 dL/dy = 0；y 变化一点，L 的一阶变化为零。&quot;);
    if(m.dLdu &lt; 0 || m.dLdx &lt; 0 || m.dLdy &lt; 0) notes.push(&quot;至少一个导数为负：在这一点附近把对应输入增大，L 会变小，变化率就是那个负数的绝对值。&quot;);
    if(notes.length === 0) notes.push(&quot;这组输入下没有贡献为零的通道，也没有负号，四份贡献都是正数。&quot;);
    $(&quot;notes&quot;).innerHTML = notes.map(function(t){ return '&lt;p class=&quot;note&quot;>' + t + '&lt;/p>'; }).join(&quot;&quot;);
  }

  function setXY(x, y){
    S.x = snap(x);
    S.y = snap(y);
    render();
  }

  $(&quot;in-x&quot;).addEventListener(&quot;input&quot;, function(e){ S.x = snap(Number(e.target.value)); render(); });
  $(&quot;in-y&quot;).addEventListener(&quot;input&quot;, function(e){ S.y = snap(Number(e.target.value)); render(); });

  $(&quot;btn-prev&quot;).addEventListener(&quot;click&quot;, function(){ S.step = Math.max(1, S.step - 1); render(); });
  $(&quot;btn-next&quot;).addEventListener(&quot;click&quot;, function(){ S.step = Math.min(ORDER, S.step + 1); render(); });
  $(&quot;btn-first&quot;).addEventListener(&quot;click&quot;, function(){ S.step = 1; render(); });
  $(&quot;btn-last&quot;).addEventListener(&quot;click&quot;, function(){ S.step = ORDER; render(); });

  var presets = {
    &quot;default&quot;: [2, 3],
    &quot;xzero&quot;: [0, 3],
    &quot;vm1&quot;: [2, -1],
    &quot;neg&quot;: [-3, 3]
  };
  var pbtns = document.querySelectorAll(&quot;[data-preset]&quot;);
  for(var p = 0; p &lt; pbtns.length; p++){
    pbtns[p].addEventListener(&quot;click&quot;, function(){
      var conf = presets[this.getAttribute(&quot;data-preset&quot;)];
      if(conf){ setXY(conf[0], conf[1]); S.step = ORDER; render(); }
    });
  }

  var omitButtons = document.querySelectorAll(&quot;[data-omit]&quot;);
  for(var k = 0; k &lt; omitButtons.length; k++){
    omitButtons[k].addEventListener(&quot;click&quot;, function(){
      S.omit = this.getAttribute(&quot;data-omit&quot;);
      render();
      if(P &amp;&amp; typeof P.commitState === &quot;function&quot;) P.commitState();
    });
  }

  if(P &amp;&amp; typeof P.registerStateReader === &quot;function&quot;){
    P.registerStateReader(function(){
      var m = model();
      return {
        values: {x: S.x, y: S.y, step: S.step, omit: S.omit},
        visible_step: &quot;第 &quot; + S.step + &quot; / &quot; + ORDER + &quot; 步&quot;,
        observation: {
          summary: &quot;输入 x = &quot; + fmt(S.x) + &quot;、y = &quot; + fmt(S.y) + &quot;，第 &quot; + S.step + &quot; 步：&quot; + stepText(m) + &quot;。&quot;,
          state: {
            x: S.x, y: S.y, step: S.step, omit: S.omit,
            u: m.u, v: m.v, L: m.L,
            dLdu: S.step >= 6 ? m.dLdu : null,
            dLdx: S.step >= 7 ? m.dLdx : null,
            dLdy: S.step >= 8 ? m.dLdy : null
          }
        }
      };
    });
  }

  if(P &amp;&amp; typeof P.registerStateRestorer === &quot;function&quot;){
    P.registerStateRestorer(function(saved){
      var vals = (saved &amp;&amp; saved.values) ? saved.values : {};
      var s = (vals.page &amp;&amp; typeof vals.page === &quot;object&quot;) ? vals.page : vals;
      if(typeof s.x === &quot;number&quot;) S.x = snap(s.x);
      if(typeof s.y === &quot;number&quot;) S.y = snap(s.y);
      if(typeof s.step === &quot;number&quot;) S.step = Math.max(1, Math.min(ORDER, Math.round(s.step)));
      if(s.omit === &quot;none&quot; || s.omit === &quot;direct&quot; || s.omit === &quot;viaV&quot;) S.omit = s.omit;
      render();
    });
  }

  render();
})();
&lt;/script>

&lt;/body>&lt;/html>"></iframe></body></html>
