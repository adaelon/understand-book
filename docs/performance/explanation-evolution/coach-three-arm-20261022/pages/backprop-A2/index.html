&lt;h1>u 被用两次，反向传播为什么要把两份贡献相加&lt;/h1>
&lt;p class=&quot;lede&quot;>u = x·y 算出来以后被用了两次，x 也同时进入两处。这份页面就沿着这张小图的真实依赖走：先算值，再从 L 逆着箭头回来，看着两份贡献在哪里汇合、为什么必须等到齐了才能继续往回传。&lt;/p>
&lt;/header>

&lt;section id=&quot;model&quot;>
&lt;h2>1. 只看这三个公式&lt;/h2>
&lt;div class=&quot;eq&quot;>
&lt;div>u = x · y&lt;/div>
&lt;div>v = u + x&lt;/div>
&lt;div>L = v² + 3u&lt;/div>
&lt;/div>
&lt;p>x、y 是输入，可以自由选；u、v、L 都是算出来的。有两处&quot;共用&quot;值得先盯住：&lt;/p>
&lt;ul>
&lt;li>&lt;b>u 被用两次&lt;/b>：一次进 v（v = u + x），一次直接进 L（3u 那一项）。同一个计算结果，两条出路。&lt;/li>
&lt;li>&lt;b>x 进入两处&lt;/b>：一次进 u（u = x·y），一次直接进 v（v = u + x）。&lt;/li>
&lt;/ul>
&lt;p>反向传播要处理的就是这两处共用：从 L 出发，回到 u 有两条路，回到 x 也有两条路。&lt;/p>
&lt;/section>

&lt;div class=&quot;ctl&quot;>
&lt;div class=&quot;lab&quot;>&lt;label for=&quot;sstep&quot;>看到第几步&lt;/label>&lt;output id=&quot;out-k&quot; for=&quot;sstep&quot;>13 / 13&lt;/output>&lt;/div>
&lt;input id=&quot;sstep&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;12&quot; step=&quot;1&quot; value=&quot;12&quot; aria-label=&quot;步骤，从第一步到第十三步&quot;>
&lt;/div>
&lt;div class=&quot;btnrow&quot;>
&lt;button type=&quot;button&quot; id=&quot;first&quot;>回到第 1 步&lt;/button>
&lt;button type=&quot;button&quot; id=&quot;prev&quot;>上一步&lt;/button>
&lt;button type=&quot;button&quot; id=&quot;next&quot;>下一步&lt;/button>
&lt;button type=&quot;button&quot; id=&quot;last&quot; class=&quot;primary&quot;>全部展开&lt;/button>
&lt;/div>
&lt;div class=&quot;btnrow&quot;>
&lt;button type=&quot;button&quot; data-preset=&quot;2,3&quot;>默认 x=2, y=3&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;0,3&quot;>让 x=0&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;2,-1&quot;>让 v=0&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;-2,3&quot;>负数 x=−2&lt;/button>
&lt;/div>
&lt;p class=&quot;status&quot; id=&quot;status&quot;>&lt;/p>
&lt;/section>

&lt;section id=&quot;player&quot;>
&lt;h2>3. 一步一步走：先前向，再反向&lt;/h2>
&lt;p>整个回放一共 13 步：前 4 步前向，后 9 步反向。拖动上面的步骤滑杆或点按钮，下面的列表会跟着亮到当前这一步；图上的节点和边也会同时高亮当前在处理的对象。&lt;/p>
&lt;p>反向有两条规则，整套账都靠它们：&lt;/p>
&lt;ol>
&lt;li>&lt;b>从 L 出发，逆着箭头走。&lt;/b>先离开 L 最近的 v 和 u，最后才到输入 x、y。&lt;/li>
&lt;li>&lt;b>到一个节点，要等它的所有出边都把贡献送回来，才能把合计继续往回传。&lt;/b>一个节点正向流出几条边，就要收回几笔。&lt;/li>
&lt;/ol>
&lt;p>先算哪一条出边无所谓，加法可以交换；必须遵守的是&quot;到齐&quot;。下面每一步都只用当前这组输入算出的数字。&lt;/p>
&lt;ol class=&quot;steps&quot; id=&quot;steps&quot;>&lt;/ol>
&lt;/section>

&lt;section id=&quot;ledger&quot;>
&lt;h2>4. 每个节点的账本&lt;/h2>
&lt;p>反向时每个节点都在等自己的几笔贡献。下面这张账本显示：正向流出几条边、已经收回几笔、合计是多少、有没有到齐。没到齐的节点会写明&quot;先不往回传&quot;。&lt;/p>
&lt;div class=&quot;ncards&quot; id=&quot;ledger-cards&quot;>&lt;/div>
&lt;/section>

&lt;section id=&quot;why&quot;>
&lt;h2>5. 为什么要相加，而不是二选一&lt;/h2>
&lt;p>沿一条边反向走时，你乘的是这条边的局部导数：上游动一点，这个节点跟着动多少。从 L 到某个量如果只有一条路，把沿路的局部导数乘起来就够了，这就是你熟悉的链式法则。&lt;/p>
&lt;p>麻烦在于 u 和 x 都有两条路。以 u 为例：把 u 挪动一个很小的量 h。经过 3u 这一项，L 变化约 3h；同时 v 变化约 1·h，而 v 的变化又让 v² 变化约 2v·(1·h)。这两件事同时发生，所以 L 的总变化约 (3 + 2v)·h。除以 h，就得到 dL/du = 3 + 2v。&lt;/p>
&lt;p>相加的来源就在这句话里：同一份 h 被两条路同时送出去，两条路的效果叠在一起。两条路的终点都是 L，所以它们共用同一个上游数（这里是 1），不同的只是沿途乘了哪些局部导数。每一笔对应一条不同的路径，路径不同，乘的局部导数就不同，所以和里没有重复计算。&lt;/p>
&lt;h3>把五条路径摊开&lt;/h3>
&lt;div id=&quot;paths-x&quot;>&lt;/div>
&lt;div id=&quot;paths-y&quot;>&lt;/div>
&lt;p>把 x 的路径重新分组，正好就是账本里的两笔：经 u 的两条（x→u→L 和 x→u→v→L）加起来是 &lt;span class=&quot;v&quot; id=&quot;why-via-u&quot;>&lt;/span>，直达 v 的那条是 &lt;span class=&quot;v&quot; id=&quot;why-xv&quot;>&lt;/span>。所以&quot;u 收到 3 和 16、合计 19&quot;与&quot;x 收到 57 和 16、合计 73&quot;说的是同一件事的两个层次：先在 u 处汇总，再把汇总后的数继续往回乘。&lt;/p>
&lt;p class=&quot;note&quot;>顺序本身不重要：先算哪条出边，和都不变。真正卡住的是&quot;完整&quot;——一个节点少收一笔就往下传，缺的那块会跟着再乘一次局部导数，被放大到所有更上游的节点。&lt;/p>
&lt;/section>

&lt;section id=&quot;omit&quot;>
&lt;h2>6. 漏掉一笔会得到什么&lt;/h2>
&lt;p>把账本故意弄错一次，看数字怎么变。下面全部用当前这组输入算。&lt;/p>
&lt;ul class=&quot;reslist&quot; id=&quot;omit&quot;>&lt;/ul>
&lt;p>两种错法的共同点：得到的数看上去都像一个正常的导数，光看图看不出问题。第 7 节的差分和展开核对就是为了抓这种错。&lt;/p>
&lt;p>为什么漏掉会错：dL/dx 描述&quot;x 动一点，L 总共动多少&quot;。x 通过两条通道影响 L，漏掉一条就只算了一部分变化。所以梯度不是挑一条最&quot;主要&quot;的路，而是把所有路径的效应加起来。&lt;/p>
&lt;/section>

&lt;section id=&quot;zero&quot;>
&lt;h2>7. 贡献是 0 或负数时&lt;/h2>
&lt;p>每一笔贡献 = 上游的数 × 这条边的局部导数。乘积为 0 只有两种可能：上游是 0，或者这条边的局部导数是 0。它的含义是&quot;沿这条路，此刻 L 不随这个量变化&quot;，而不是&quot;这条路不存在&quot;：换一个输入，同一条边立刻又会有贡献。&lt;/p>
&lt;p>负号表示方向相反：沿这条路，这个量增加会让 L 下降。相加时直接按带符号的数相加，不要取绝对值。&lt;/p>
&lt;div id=&quot;zero-notes&quot;>&lt;/div>
&lt;h3>当前六笔贡献&lt;/h3>
&lt;ul class=&quot;chips&quot; id=&quot;chips&quot;>&lt;/ul>
&lt;div class=&quot;btnrow&quot;>
&lt;button type=&quot;button&quot; data-preset=&quot;0,3&quot;>试 x = 0&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;2,0&quot;>试 y = 0&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;2,-1&quot;>试 v = 0&lt;/button>
&lt;button type=&quot;button&quot; data-preset=&quot;2,3&quot;>回到默认&lt;/button>
&lt;/div>
&lt;p class=&quot;tnote&quot;>每换一组输入，上面的说明和下面的六笔贡献都会重算，控制台里的输入与状态行也会同步；步数会跳到反向结束那一步。&lt;/p>
&lt;/section>

&lt;section id=&quot;check&quot;>
&lt;h2>8. 独立核对：把 L 直接展开求导&lt;/h2>
&lt;p>前面的 73 和 38 是沿图算出来的。现在换一条完全不同的路：把 u、v 代进去，让 L 变成只含 x、y 的一个多项式，再直接用多项式求导。&lt;/p>
&lt;div class=&quot;eq&quot;>
&lt;div>u = x·y，　v = u + x = x(y + 1)&lt;/div>
&lt;div>L = v² + 3u = x²(y + 1)² + 3xy&lt;/div>
&lt;div>∂L/∂x = 2x(y + 1)² + 3y&lt;/div>
&lt;div>∂L/∂y = 2x²(y + 1) + 3x&lt;/div>
&lt;/div>
&lt;p>再把平方项整个拆开，得到最朴素的多项式形式：&lt;/p>
&lt;div class=&quot;eq&quot;>
&lt;div>L = x²y² + 2x²y + x² + 3xy&lt;/div>
&lt;div>∂L/∂x = 2xy² + 4xy + 2x + 3y&lt;/div>
&lt;div>∂L/∂y = 2x²y + 2x² + 3x&lt;/div>
&lt;/div>
&lt;div id=&quot;checkbody&quot;>&lt;/div>
&lt;p>展开式和图算的是同一个东西，但展开式把经过 v 的两条路合并进了 2x(y + 1)² 这一项里：2x(y + 1)² = 2v·(y + 1)，正是&quot;直达 v 的 2v&quot;加上&quot;经 u→v 的 2v·y&quot;。所以展开式能核对总数，却看不出每条路径各乘了什么——这正是需要计算图的地方。&lt;/p>
&lt;/section>

&lt;section id=&quot;wrap&quot;>
&lt;h2>9. 把这件事压成四句&lt;/h2>
&lt;ul>
&lt;li>前向按箭头算值：u 只算一次，被读两次（进 v、进 L）。&lt;/li>
&lt;li>反向从 dL/dL = 1 出发逆着箭头走；每到一个节点，等它的所有出边都到齐，再把合计乘上局部导数往回传。&lt;/li>
&lt;li>两份贡献相加，是因为同一份变化被多条通道同时送出，一阶效应叠加；每笔各对应一条路径。&lt;/li>
&lt;li>漏一笔，或没到齐就下传，都会得到一个&quot;看起来像导数&quot;的错数；展开求导和差分能把它抓出来。&lt;/li>
&lt;/ul>
&lt;/section>

&lt;/main>

&lt;script>
(function(){
&quot;use strict&quot;;
var $=function(id){return document.getElementById(id);};
var state={x:2,y:3,step:12};
var LAST=12;
var STEPS=[];

function round2(n){var r=Math.round(n*100)/100;return Object.is(r,-0)?0:r;}
function fmt(n){var r=round2(n);if(!isFinite(r))return &quot;—&quot;;return String(r).replace(&quot;-&quot;,&quot;\u2212&quot;);}
function par(n){var r=round2(n);return r&lt;0?(&quot;(&quot;+fmt(r)+&quot;)&quot;):fmt(r);}

function calc(){
  var x=state.x,y=state.y;
  var u=x*y, v=u+x, L=v*v+3*u;
  var dLdv=2*v, dLdu=3+dLdv;
  return {x:x,y:y,u:u,v:v,L:L,dLdv:dLdv,dLdu:dLdu,dLdx:dLdu*y+dLdv,dLdy:dLdu*x};
}
function Lof(x,y){var u=x*y,v=u+x;return v*v+3*u;}

function buildSteps(m){
  var f=fmt,p=par;
  return [
  {ph:&quot;前向&quot;,t:&quot;确定输入&quot;,nodes:[&quot;x&quot;,&quot;y&quot;],edges:[],lines:[
    &quot;x = &quot;+f(m.x)+&quot;，y = &quot;+f(m.y)+&quot;。这是全图唯一可以自由选的两个数。&quot;,
    &quot;u、v、L 都由它们算出来，没有别的输入。&quot;]},
  {ph:&quot;前向&quot;,t:&quot;u = x·y&quot;,nodes:[&quot;u&quot;],edges:[&quot;xu&quot;,&quot;yu&quot;],lines:[
    &quot;u = x × y = &quot;+p(m.x)+&quot; × &quot;+p(m.y)+&quot; = &quot;+f(m.u)+&quot;。&quot;,
    &quot;u 算一次就够；后面它被读两次：一次进 v，一次直接进 L。&quot;]},
  {ph:&quot;前向&quot;,t:&quot;v = u + x&quot;,nodes:[&quot;v&quot;],edges:[&quot;uv&quot;,&quot;xv&quot;],lines:[
    &quot;v = u + x = &quot;+f(m.u)+&quot; + &quot;+p(m.x)+&quot; = &quot;+f(m.v)+&quot;。&quot;,
    &quot;这一步读了两个不同的量：中间结果 u，和输入 x。&quot;]},
  {ph:&quot;前向&quot;,t:&quot;L = v² + 3u&quot;,nodes:[&quot;L&quot;],edges:[&quot;vL&quot;,&quot;uL&quot;],lines:[
    &quot;L = v² + 3u = &quot;+p(m.v)+&quot;² + 3 × &quot;+p(m.u)+&quot; = &quot;+f(m.v*m.v)+&quot; + &quot;+f(3*m.u)+&quot; = &quot;+f(m.L)+&quot;。&quot;,
    &quot;前向结束。通向 L 的边有两条：来自 v 的 v² 项，来自 u 的 3u 项。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;起点 dL/dL = 1&quot;,nodes:[&quot;L&quot;],edges:[],lines:[
    &quot;反向要回答的是：每个量动一点，L 动多少。从 L 自己出发，dL/dL = 1。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;边 v→L，逆行走到 v&quot;,nodes:[&quot;v&quot;],edges:[&quot;vL&quot;],lines:[
    &quot;v 在 L 里只出现在 v² 这一项，这一项的导数是 2v = 2 × &quot;+p(m.v)+&quot; = &quot;+f(m.dLdv)+&quot;。&quot;,
    &quot;贡献 = 上游 1 × 局部导数 &quot;+f(m.dLdv)+&quot; = &quot;+f(m.dLdv)+&quot;，记到 v 的账上。&quot;,
    &quot;v 正向只流出一条边，所以这一笔就是 dL/dv = &quot;+f(m.dLdv)+&quot;：到齐。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;边 u→L，逆行走到 u&quot;,nodes:[&quot;u&quot;],edges:[&quot;uL&quot;],lines:[
    &quot;u 除了藏在 v 里，还直接出现在 3u 这一项，这一项的导数是 3。&quot;,
    &quot;贡献 = 1 × 3 = 3，记到 u 的账上。&quot;,
    &quot;u 正向流出两条边（u→v 和 u→L），现在只到 1 笔：先记着，不能往回传。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;边 u→v，逆行走到 u&quot;,nodes:[&quot;u&quot;],edges:[&quot;uv&quot;],lines:[
    &quot;v 已经到齐，可以往回走一步。v = u + x 对 u 的导数是 1。&quot;,
    &quot;贡献 = dL/dv &quot;+f(m.dLdv)+&quot; × 1 = &quot;+f(m.dLdv)+&quot;，记到 u 的账上。&quot;,
    &quot;到这里 u 的两笔都到了。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;u 汇合：两份相加&quot;,nodes:[&quot;u&quot;],edges:[],lines:[
    &quot;dL/du = 3（L 里的 3u）+ &quot;+f(m.dLdv)+&quot;（经 v 回来）= &quot;+f(m.dLdu)+&quot;。&quot;,
    &quot;到齐之后 u 才继续往回传。早一步传，传下去的就是不完整的数。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;边 y→u，逆行走到 y&quot;,nodes:[&quot;y&quot;],edges:[&quot;yu&quot;],lines:[
    &quot;u = x·y 对 y 的导数是 x = &quot;+f(m.x)+&quot;。&quot;,
    &quot;贡献 = dL/du &quot;+f(m.dLdu)+&quot; × &quot;+p(m.x)+&quot; = &quot;+f(m.dLdy)+&quot;。&quot;,
    &quot;y 只流出一条边，dL/dy = &quot;+f(m.dLdy)+&quot;：到齐。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;边 x→u，逆行走到 x&quot;,nodes:[&quot;x&quot;],edges:[&quot;xu&quot;],lines:[
    &quot;u = x·y 对 x 的导数是 y = &quot;+f(m.y)+&quot;。&quot;,
    &quot;贡献 = &quot;+f(m.dLdu)+&quot; × &quot;+p(m.y)+&quot; = &quot;+f(m.dLdu*m.y)+&quot;，记到 x 的账上。&quot;,
    &quot;x 还有一条直达 v 的路没到，先别下结论。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;边 x→v，逆行走到 x&quot;,nodes:[&quot;x&quot;],edges:[&quot;xv&quot;],lines:[
    &quot;这条路不经过 u：v = u + x 里 x 直接出现，导数是 1。&quot;,
    &quot;贡献 = dL/dv &quot;+f(m.dLdv)+&quot; × 1 = &quot;+f(m.dLdv)+&quot;，记到 x 的账上。&quot;]},
  {ph:&quot;反向&quot;,t:&quot;x 汇合，反向结束&quot;,nodes:[&quot;x&quot;],edges:[],lines:[
    &quot;dL/dx = &quot;+f(m.dLdu*m.y)+&quot;（经 u）+ &quot;+f(m.dLdv)+&quot;（直达 v）= &quot;+f(m.dLdx)+&quot;。&quot;,
    &quot;dL/dy = &quot;+f(m.dLdy)+&quot;。这两个数就是 x、y 各自动一点时 L 的变化率。&quot;]}
  ];
}

function drawGraph(m){
  var s=state.step;
  var nowN={},nowE={},doneE={};
  STEPS[s].nodes.forEach(function(n){nowN[n]=1;});
  STEPS[s].edges.forEach(function(e){nowE[e]=1;});
  for(var i=0;i&lt;=s;i++){STEPS[i].edges.forEach(function(e){doneE[e]=1;});}

  var vals={x:fmt(m.x),y:fmt(m.y),u:(s>=1?fmt(m.u):&quot;?&quot;),v:(s>=2?fmt(m.v):&quot;?&quot;),L:(s>=3?fmt(m.L):&quot;?&quot;)};
  [&quot;x&quot;,&quot;y&quot;,&quot;u&quot;,&quot;v&quot;,&quot;L&quot;].forEach(function(n){$(&quot;val-&quot;+n).textContent=vals[n];});

  var cnt={v:(s>=5?1:0),u:(s>=6?1:0)+(s>=7?1:0),x:(s>=10?1:0)+(s>=11?1:0),y:(s>=9?1:0)};
  var need={v:1,u:2,x:2,y:1};
  [&quot;x&quot;,&quot;y&quot;,&quot;u&quot;,&quot;v&quot;,&quot;L&quot;].forEach(function(n){
    var el=$(&quot;node-&quot;+n);
    var k=need[n];
    el.classList.toggle(&quot;now&quot;,!!nowN[n]);
    if(k){
      el.classList.toggle(&quot;full&quot;,cnt[n]>=k);
      el.classList.toggle(&quot;half&quot;,cnt[n]>0&amp;&amp;cnt[n]&lt;k);
    }else{
      el.classList.toggle(&quot;full&quot;,s>=4);
      el.classList.remove(&quot;half&quot;);
    }
  });

  [&quot;xu&quot;,&quot;yu&quot;,&quot;uv&quot;,&quot;xv&quot;,&quot;vL&quot;,&quot;uL&quot;].forEach(function(e){
    var el=$(&quot;e-&quot;+e);
    el.classList.toggle(&quot;now&quot;,!!nowE[e]);
    el.classList.toggle(&quot;done&quot;,!!doneE[e]&amp;&amp;!nowE[e]);
  });

  $(&quot;l-xu&quot;).classList.toggle(&quot;show&quot;,s>=1);
  $(&quot;l-yu&quot;).classList.toggle(&quot;show&quot;,s>=1);
  $(&quot;l-uv&quot;).classList.toggle(&quot;show&quot;,s>=2);
  $(&quot;l-xv&quot;).classList.toggle(&quot;show&quot;,s>=2);
  $(&quot;l-vL&quot;).classList.toggle(&quot;show&quot;,s>=3);
  $(&quot;l-uL&quot;).classList.toggle(&quot;show&quot;,s>=3);

  $(&quot;cap-xu&quot;).textContent=fmt(m.y);
  $(&quot;cap-vL&quot;).textContent=fmt(m.dLdv);
}

function drawStatus(m){
  var st=STEPS[state.step];
  var html=&quot;&lt;span>输入 x = &lt;b>&quot;+fmt(m.x)+&quot;&lt;/b>，y = &lt;b>&quot;+fmt(m.y)+&quot;&lt;/b>&lt;/span>&quot;+
           &quot;&lt;span>第 &lt;b>&quot;+(state.step+1)+&quot;&lt;/b> / 13 步 · &quot;+st.ph+&quot;：&quot;+st.t+&quot;&lt;/span>&quot;;
  if(state.step>=3){html+=&quot;&lt;span>此刻 L = &lt;b>&quot;+fmt(m.L)+&quot;&lt;/b>&lt;/span>&quot;;}
  if(state.step>=12){html+=&quot;&lt;span>dL/dx = &lt;b>&quot;+fmt(m.dLdx)+&quot;&lt;/b>，dL/dy = &lt;b>&quot;+fmt(m.dLdy)+&quot;&lt;/b>&lt;/span>&quot;;}
  $(&quot;status&quot;).innerHTML=html;
}

function drawSteps(){
  var out=[];
  for(var i=0;i&lt;STEPS.length;i++){
    var st=STEPS[i];
    var cls=(i&lt;state.step)?&quot;past&quot;:(i===state.step?&quot;cur&quot;:&quot;future&quot;);
    var body=st.lines.map(function(l){return &quot;&lt;li>&quot;+l+&quot;&lt;/li>&quot;;}).join(&quot;&quot;);
    out.push(&quot;&lt;li class=\&quot;step &quot;+cls+&quot;\&quot;>&lt;div class=\&quot;shead\&quot;>&lt;span class=\&quot;badge\&quot;>&quot;+st.ph+&quot; &quot;+(i+1)+&quot;&lt;/span>&quot;+
             &quot;&lt;span class=\&quot;stitle\&quot;>&quot;+st.t+&quot;&lt;/span>&lt;/div>&lt;ul class=\&quot;lines\&quot;>&quot;+body+&quot;&lt;/ul>&lt;/li>&quot;);
  }
  $(&quot;steps&quot;).innerHTML=out.join(&quot;&quot;);
}

function nodeCard(o){
  var s=state.step;
  var got=o.items.filter(function(it){return s>=it.at;});
  var full=(o.items.length>0&amp;&amp;got.length===o.items.length);
  var list=got.length?got.map(function(it){return &quot;&lt;li>&quot;+it.txt+&quot;&lt;/li>&quot;;}).join(&quot;&quot;):
           &quot;&lt;li class=\&quot;muted\&quot;>还没有贡献到达&lt;/li>&quot;;
  var tot;
  if(full){
    tot=&quot;&lt;p class=\&quot;ntot\&quot;>dL/d&quot;+o.name+&quot; = &quot;+fmt(o.sum)+&quot; · 到齐（&quot;+o.items.length+&quot; 笔）&lt;/p>&quot;;
  }else if(got.length){
    tot=&quot;&lt;p class=\&quot;ntot pend\&quot;>暂记 &quot;+fmt(got.reduce(function(a,b){return a+b.v;},0))+&quot;，还差 &quot;+
        (o.items.length-got.length)+&quot; 笔，先不往回传&lt;/p>&quot;;
  }else{
    tot=&quot;&lt;p class=\&quot;ntot pend\&quot;>等 &quot;+o.items.length+&quot; 笔贡献&lt;/p>&quot;;
  }
  return &quot;&lt;article class=\&quot;ncard&quot;+(full?&quot; full&quot;:&quot;&quot;)+&quot;\&quot;>&lt;h3>&lt;span>&quot;+o.name+&quot;&lt;/span>&quot;+
         &quot;&lt;span class=\&quot;nmeta\&quot;>前向值 &quot;+fmt(o.val)+&quot; · 正向流出 &quot;+o.out+&quot; 条边&lt;/span>&lt;/h3>&quot;+
         &quot;&lt;ul class=\&quot;nlist\&quot;>&quot;+list+&quot;&lt;/ul>&quot;+tot+&quot;&lt;/article>&quot;;
}

function drawLedger(m){
  var s=state.step;
  var cards=[];
  cards.push(&quot;&lt;article class=\&quot;ncard&quot;+(s>=4?&quot; full&quot;:&quot;&quot;)+&quot;\&quot;>&lt;h3>&lt;span>L&lt;/span>&quot;+
    &quot;&lt;span class=\&quot;nmeta\&quot;>前向值 &quot;+fmt(m.L)+&quot; · 没有出边&lt;/span>&lt;/h3>&quot;+
    &quot;&lt;ul class=\&quot;nlist\&quot;>&lt;li>&quot;+(s>=4?&quot;反向起点 dL/dL = 1&quot;:&quot;反向还没开始&quot;)+&quot;&lt;/li>&lt;/ul>&quot;+
    &quot;&lt;p class=\&quot;ntot\&quot;>这个 1 是所有贡献的乘数起点&lt;/p>&lt;/article>&quot;);

  cards.push(nodeCard({name:&quot;v&quot;,val:m.v,out:1,sum:m.dLdv,items:[
    {at:5,v:m.dLdv,txt:fmt(m.dLdv)+&quot; ← 边 v→L：局部导数 2v = &quot;+fmt(m.dLdv)+&quot;，乘上游 1&quot;}]}));

  cards.push(nodeCard({name:&quot;u&quot;,val:m.u,out:2,sum:m.dLdu,items:[
    {at:6,v:3,txt:&quot;3 ← 边 u→L：局部导数 3，乘上游 1&quot;},
    {at:7,v:m.dLdv,txt:fmt(m.dLdv)+&quot; ← 边 u→v：局部导数 1，乘上游 &quot;+fmt(m.dLdv)}]}));

  cards.push(nodeCard({name:&quot;x&quot;,val:m.x,out:2,sum:m.dLdx,items:[
    {at:10,v:m.dLdu*m.y,txt:fmt(m.dLdu*m.y)+&quot; ← 边 x→u：局部导数 y = &quot;+fmt(m.y)+&quot;，乘上游 &quot;+fmt(m.dLdu)},
    {at:11,v:m.dLdv,txt:fmt(m.dLdv)+&quot; ← 边 x→v：局部导数 1，乘上游 &quot;+fmt(m.dLdv)}]}));

  cards.push(nodeCard({name:&quot;y&quot;,val:m.y,out:1,sum:m.dLdy,items:[
    {at:9,v:m.dLdy,txt:fmt(m.dLdy)+&quot; ← 边 y→u：局部导数 x = &quot;+fmt(m.x)+&quot;，乘上游 &quot;+fmt(m.dLdu)}]}));

  $(&quot;ledger-cards&quot;).innerHTML=cards.join(&quot;&quot;);
}

function pathList(title,rows,sumTxt){
  var items=rows.map(function(r){
    return &quot;&lt;li>&lt;span class=\&quot;pr\&quot;>&quot;+r[0]+&quot;&lt;/span>&lt;span class=\&quot;pc\&quot;>&quot;+r[1]+&quot;&lt;/span>&lt;/li>&quot;;
  }).join(&quot;&quot;);
  return &quot;&lt;h3>&quot;+title+&quot;&lt;/h3>&lt;ul class=\&quot;plist\&quot;>&quot;+items+&quot;&lt;/ul>&lt;p class=\&quot;sumrow\&quot;>&quot;+sumTxt+&quot;&lt;/p>&quot;;
}

function drawPaths(m){
  var xRows=[
    [&quot;x → v → L&quot;,&quot;1 × 2v = &quot;+fmt(m.dLdv)],
    [&quot;x → u → L&quot;,&quot;y × 3 = &quot;+fmt(3*m.y)],
    [&quot;x → u → v → L&quot;,&quot;y × 1 × 2v = &quot;+fmt(m.y*m.dLdv)]
  ];
  var yRows=[
    [&quot;y → u → L&quot;,&quot;x × 3 = &quot;+fmt(3*m.x)],
    [&quot;y → u → v → L&quot;,&quot;x × 1 × 2v = &quot;+fmt(m.x*m.dLdv)]
  ];
  $(&quot;paths-x&quot;).innerHTML=pathList(&quot;x 的三条路&quot;,xRows,
    &quot;三条合计 &quot;+fmt(3*m.y+m.dLdv+m.y*m.dLdv)+&quot; = dL/dx，与账本一致。&quot;);
  $(&quot;paths-y&quot;).innerHTML=pathList(&quot;y 的两条路&quot;,yRows,
    &quot;两条合计 &quot;+fmt(3*m.x+m.x*m.dLdv)+&quot; = dL/dy，与账本一致。&quot;);
  $(&quot;why-via-u&quot;).textContent=fmt(m.dLdu*m.y);
  $(&quot;why-xv&quot;).textContent=fmt(m.dLdv);
}

function drawOmit(m){
  var viaU=round2(m.dLdu*m.y);
  var leak=round2(m.dLdx-viaU);
  var earlyX=round2(3*m.y+m.dLdv);
  var earlyY=round2(3*m.x);
  var num=round2((Lof(m.x+0.01,m.y)-m.L)/0.01);
  var rows=[[&quot;正确&quot;,&quot;dL/dx = &quot;+fmt(m.dLdx)+&quot;，dL/dy = &quot;+fmt(m.dLdy)]];
  if(round2(m.dLdv)!==0){
    rows.push([&quot;漏掉边 x→v 这一笔&quot;,&quot;只能得到 &quot;+fmt(viaU)+&quot;（应该是 &quot;+fmt(m.dLdx)+&quot;）；少掉的 &quot;+fmt(leak)+&quot; 正好是 dL/dv × 1&quot;]);
  }else{
    rows.push([&quot;漏掉边 x→v 这一笔&quot;,&quot;此刻 2v = 0，x→v 的贡献本来就是 0，漏掉它数字不变；边仍然在，换一组输入立刻出现差额&quot;]);
  }
  if(round2(earlyX)!==round2(m.dLdx)||round2(earlyY)!==round2(m.dLdy)){
    var tail=&quot;&quot;;
    if(round2(earlyX)===round2(m.dLdx)){
      tail=&quot;（这组输入下 dL/dx 恰好没差：dL/dv × y = &quot;+fmt(m.dLdv)+&quot; × &quot;+par(m.y)+&quot; = 0，提前下传少乘的那部分正好是 0；dL/dy 才把错露出来）&quot;;
    }
    rows.push([&quot;在 u 处只收到 3 就往下传&quot;,&quot;经 u 的两笔变成 3×y = &quot;+fmt(3*m.y)+&quot; 和 3×x = &quot;+fmt(3*m.x)+&quot;，于是 dL/dx 会算成 &quot;+fmt(earlyX)+&quot;，dL/dy 会算成 &quot;+fmt(earlyY)+tail]);
  }else{
    rows.push([&quot;在 u 处只收到 3 就往下传&quot;,&quot;这组输入下两种算法同值：dL/dv = &quot;+fmt(m.dLdv)+&quot; 与 y = &quot;+fmt(m.y)+&quot; 里有 0，提前下传少乘的那部分正好是 0；换一组输入就分开了&quot;]);
  }
  var wrongs=[];
  if(round2(viaU)!==round2(m.dLdx)){wrongs.push(fmt(viaU));}
  if(round2(earlyX)!==round2(m.dLdx)){wrongs.push(fmt(earlyX));}
  var cmpTxt=wrongs.length?(&quot;，与 &quot;+wrongs.join(&quot;、&quot;)+&quot; 都对不上&quot;):&quot;；这组输入里两种错法恰好落在同一个数上，换一组输入才看得出区别&quot;;
  rows.push([&quot;差分检验：x 增加 0.01&quot;,&quot;L 的变化 ÷ 0.01 = &quot;+fmt(num)+&quot;，接近 &quot;+fmt(m.dLdx)+cmpTxt]);
  var html=rows.map(function(r,i){
    return &quot;&lt;li&quot;+(i===0?&quot;&quot;:&quot; class=\&quot;bad\&quot;&quot;)+&quot;>&lt;span class=\&quot;k\&quot;>&quot;+r[0]+&quot;&lt;/span>&lt;span class=\&quot;val\&quot;>&quot;+r[1]+&quot;&lt;/span>&lt;/li>&quot;;
  }).join(&quot;&quot;);
  $(&quot;omit&quot;).innerHTML=html;
}

function drawZero(m){
  var notes=[];
  if(round2(m.v)===0){
    notes.push(&quot;当前 v = 0：v² 在这一点是平的，局部导数 2v = 0，所以 v→L 和 x→v 这两笔都是 0。u→L 的 3 不受影响，dL/du 仍然等于 &quot;+fmt(m.dLdu)+&quot;。&quot;);
  }
  if(round2(m.x)===0){
    notes.push(&quot;当前 x = 0：∂u/∂y = x = 0，所以 y 只收到 0，dL/dy = 0。y 挪一点，u 不动，L 也不动。&quot;);
  }
  if(round2(m.y)===0){
    notes.push(&quot;当前 y = 0：∂u/∂x = y = 0，u→x 这一笔是 0；但 x 还能经由 v 影响 L，dL/dx = &quot;+fmt(m.dLdx)+&quot;。&quot;);
  }
  if(round2(m.dLdu)===0){
    notes.push(&quot;当前 dL/du = 3 + 2v = 0：u 的两条出边贡献正好抵消，所以经 u 的两笔（x→u、y→u）都是 0，尽管 ∂u/∂x = y 并不为 0。L 在这一点对 u 一阶不敏感。&quot;);
  }
  if(!notes.length){
    notes.push(&quot;当前输入下六条边的局部导数都不是 0，六笔贡献也都不是 0。用下面的按钮换一组输入，就能看到某些笔变成 0。&quot;);
  }
  var negs=[];
  [[&quot;x→u&quot;,m.dLdu*m.y],[&quot;x→v&quot;,m.dLdv],[&quot;y→u&quot;,m.dLdy],[&quot;u→L&quot;,3],[&quot;u→v&quot;,m.dLdv],[&quot;v→L&quot;,m.dLdv]].forEach(function(p){
    if(round2(p[1])&lt;0){negs.push(p[0]);}
  });
  if(negs.length){
    notes.push(&quot;当前有负的贡献（&quot;+negs.join(&quot;、&quot;)+&quot;）：负号说明沿这条路，该项增加会让 L 下降。相加时按带符号的数加，不取绝对值。&quot;);
  }
  $(&quot;zero-notes&quot;).innerHTML=notes.map(function(t){return &quot;&lt;p>&quot;+t+&quot;&lt;/p>&quot;;}).join(&quot;&quot;);

  var chips=[[&quot;边 x→u&quot;,m.dLdu*m.y],[&quot;边 x→v&quot;,m.dLdv],[&quot;边 y→u&quot;,m.dLdy],[&quot;边 u→L&quot;,3],[&quot;边 u→v&quot;,m.dLdv],[&quot;边 v→L&quot;,m.dLdv]];
  $(&quot;chips&quot;).innerHTML=chips.map(function(c){
    var cls=round2(c[1])&lt;0?&quot; class=\&quot;neg\&quot;&quot;:&quot;&quot;;
    return &quot;&lt;li&quot;+cls+&quot;>&quot;+c[0]+&quot;：&quot;+fmt(c[1])+&quot;&lt;/li>&quot;;
  }).join(&quot;&quot;);
}

function drawCheck(m){
  var cfx=round2(2*m.x*(m.y+1)*(m.y+1)+3*m.y);
  var cfy=round2(2*m.x*m.x*(m.y+1)+3*m.x);
  var ex=round2(2*m.x*m.y*m.y+4*m.x*m.y+2*m.x+3*m.y);
  var ey=round2(2*m.x*m.x*m.y+2*m.x*m.x+3*m.x);
  var nx=round2((Lof(m.x+0.01,m.y)-m.L)/0.01);
  var ny=round2((Lof(m.x,m.y+0.01)-m.L)/0.01);

  var html=&quot;&quot;;
  html+=&quot;&lt;div class=\&quot;eq\&quot;>&quot;;
  html+=&quot;&lt;div>2x(y + 1)² + 3y = 2·&quot;+par(m.x)+&quot;·(&quot;+fmt(m.y+1)+&quot;)² + 3·&quot;+par(m.y)+&quot; = &quot;+fmt(cfx)+&quot;&lt;/div>&quot;;
  html+=&quot;&lt;div>2x²(y + 1) + 3x = 2·&quot;+par(m.x)+&quot;²·(&quot;+fmt(m.y+1)+&quot;) + 3·&quot;+par(m.x)+&quot; = &quot;+fmt(cfy)+&quot;&lt;/div>&quot;;
  html+=&quot;&lt;div>2xy² + 4xy + 2x + 3y = &quot;+fmt(ex)+&quot;&lt;/div>&quot;;
  html+=&quot;&lt;div>2x²y + 2x² + 3x = &quot;+fmt(ey)+&quot;&lt;/div>&quot;;
  html+=&quot;&lt;/div>&quot;;

  html+=&quot;&lt;table>&lt;thead>&lt;tr>&lt;th>来源&lt;/th>&lt;th>dL/dx&lt;/th>&lt;th>dL/dy&lt;/th>&lt;/tr>&lt;/thead>&lt;tbody>&quot;;
  html+=&quot;&lt;tr>&lt;td>计算图：两笔相加&lt;/td>&lt;td class=\&quot;num\&quot;>&quot;+fmt(m.dLdx)+&quot;&lt;/td>&lt;td class=\&quot;num\&quot;>&quot;+fmt(m.dLdy)+&quot;&lt;/td>&lt;/tr>&quot;;
  html+=&quot;&lt;tr>&lt;td>展开式求导&lt;/td>&lt;td class=\&quot;num\&quot;>&quot;+fmt(ex)+&quot;&lt;/td>&lt;td class=\&quot;num\&quot;>&quot;+fmt(ey)+&quot;&lt;/td>&lt;/tr>&quot;;
  html+=&quot;&lt;tr>&lt;td>差分（Δ = 0.01）&lt;/td>&lt;td class=\&quot;num\&quot;>&quot;+fmt(nx)+&quot;&lt;/td>&lt;td class=\&quot;num\&quot;>&quot;+fmt(ny)+&quot;&lt;/td>&lt;/tr>&quot;;
  html+=&quot;&lt;/tbody>&lt;/table>&quot;;
  html+=&quot;&lt;p class=\&quot;tnote\&quot;>前两行来自完全不同的计算，必须相等；第三行是把 &quot;+fmt(0.01)+&quot; 这样的有限步长直接除出来的结果，步长越小越贴近导数，所以它只用来做趋势对照。&lt;/p>&quot;;
  $(&quot;checkbody&quot;).innerHTML=html;
}

function renderAll(){
  var m=calc();
  STEPS=buildSteps(m);
  drawGraph(m);
  drawStatus(m);
  drawSteps();
  drawLedger(m);
  drawPaths(m);
  drawOmit(m);
  drawZero(m);
  drawCheck(m);
  $(&quot;sx&quot;).value=String(state.x);
  $(&quot;sy&quot;).value=String(state.y);
  $(&quot;sstep&quot;).value=String(state.step);
  $(&quot;out-x&quot;).textContent=fmt(state.x);
  $(&quot;out-y&quot;).textContent=fmt(state.y);
  $(&quot;out-k&quot;).textContent=(state.step+1)+&quot; / 13&quot;;
}

function snap(v){
  var n=Math.round((v||0)*2)/2;
  if(n&lt;-3)n=-3; if(n>3)n=3;
  return n;
}
function setStep(k){
  state.step=Math.max(0,Math.min(LAST,Math.round(k)));
  renderAll();
}

document.addEventListener(&quot;input&quot;,function(ev){
  var t=ev.target;
  if(!t||!t.id)return;
  if(t.id===&quot;sx&quot;){state.x=snap(parseFloat(t.value));renderAll();}
  else if(t.id===&quot;sy&quot;){state.y=snap(parseFloat(t.value));renderAll();}
  else if(t.id===&quot;sstep&quot;){setStep(parseInt(t.value,10));}
});

document.addEventListener(&quot;click&quot;,function(ev){
  var b=ev.target&amp;&amp;ev.target.closest?ev.target.closest(&quot;button&quot;):null;
  if(!b)return;
  if(b.dataset&amp;&amp;b.dataset.preset){
    var parts=b.dataset.preset.split(&quot;,&quot;);
    state.x=snap(parseFloat(parts[0]));
    state.y=snap(parseFloat(parts[1]));
    state.step=LAST;
    renderAll();
    return;
  }
  if(b.id===&quot;first&quot;){state.x=state.x;setStep(0);}
  else if(b.id===&quot;prev&quot;){setStep(state.step-1);}
  else if(b.id===&quot;next&quot;){setStep(state.step+1);}
  else if(b.id===&quot;last&quot;){setStep(LAST);}
});

if(window.presentation&amp;&amp;typeof window.presentation.registerStateReader===&quot;function&quot;){
  window.presentation.registerStateReader(function(){
    var st=STEPS[state.step]||{ph:&quot;&quot;,t:&quot;&quot;};
    return {values:{x:state.x,y:state.y,step:state.step},
      visible_step:String(state.step+1)+&quot; / 13&quot;,
      observation:{summary:&quot;输入 x = &quot;+fmt(state.x)+&quot;，y = &quot;+fmt(state.y)+&quot;，显示到第 &quot;+(state.step+1)+&quot; 步（&quot;+st.ph+&quot;：&quot;+st.t+&quot;）。&quot;,
        state:{x:state.x,y:state.y,step:state.step,phase:st.ph,title:st.t}}};
  });
}
if(window.presentation&amp;&amp;typeof window.presentation.registerStateRestorer===&quot;function&quot;){
  window.presentation.registerStateRestorer(function(saved){
    var v=(saved&amp;&amp;saved.values)?saved.values:(saved||{});
    if(typeof v.x===&quot;number&quot;)state.x=snap(v.x);
    if(typeof v.y===&quot;number&quot;)state.y=snap(v.y);
    if(typeof v.step===&quot;number&quot;)state.step=Math.max(0,Math.min(LAST,Math.round(v.step)));
    renderAll();
  });
}

renderAll();
})();
&lt;/script>

&lt;/body>&lt;/html>"></iframe></body></html>
