&lt;body>
&lt;main>
&lt;header class=&quot;hero&quot;>
&lt;p class=&quot;kicker&quot;>正则化回归 · 完整推导&lt;/p>
&lt;h1>带惩罚的直线拟合：从目标函数推出最优解&lt;/h1>
&lt;p class=&quot;lede&quot;>固定五个观测点，从 J(a,b) = Σ[y&lt;sub>i&lt;/sub> − (a·x&lt;sub>i&lt;/sub> + b)]&lt;sup>2&lt;/sup> + λa&lt;sup>2&lt;/sup> 开始，逐步推出 a*(λ)、b*(λ) 与 J&lt;sub>min&lt;/sub>，说明为什么得到的是全局最小值、什么时候唯一，再用 x 全等于 2 的退化数据检验这套推理。&lt;/p>
&lt;/header>

&lt;section id=&quot;s1&quot;>
&lt;h2>1 先读目标函数：三条约定各自带来什么&lt;/h2>
&lt;p>本页只用这一组数据：x = (0, 1, 2, 3, 4)，y = (−1, 0, 2, 2, 5)，拟合直线 ŷ = a·x + b，最小化&lt;/p>
&lt;div class=&quot;eq&quot;>J(a, b) = Σ&lt;sub>i=1&lt;/sub>&lt;sup>5&lt;/sup> [ y&lt;sub>i&lt;/sub> − (a·x&lt;sub>i&lt;/sub> + b) ]&lt;sup>2&lt;/sup> + λa&lt;sup>2&lt;/sup>，　λ ≥ 0&lt;/div>
&lt;p>三条约定决定了后面每一步的形态，先把它们的后果说清：&lt;/p>
&lt;ul>
&lt;li>&lt;b>用总和，不用平均。&lt;/b>把 J 整体乘上 1/5 会得到一个&quot;平均&quot;目标。正的常数不改变谁的 J 更小，最小点 (a, b) 完全一样，只有最小值的数值按同一比例缩小。本页所有数字都是总和口径。&lt;/li>
&lt;li>&lt;b>罚项只含 a。&lt;/b>这会带来一个具体结果：b 出现在每个残差里又不受罚，于是最优时残差之和为零（第 4 节），直线因此始终穿过样本均值点。&lt;/li>
&lt;li>&lt;b>λ ≥ 0，范围取 0 到 10。&lt;/b>λ = 0 时 J 退化成纯误差平方和；λ 越大，斜率被压得越厉害。交互面板的滑块步长是 0.5。&lt;/li>
&lt;/ul>
&lt;/section>

&lt;section id=&quot;s2&quot;>
&lt;h2>2 展开成二次式，并算三个中心化量&lt;/h2>
&lt;p>把每个残差平方展开再求和：&lt;/p>
&lt;div class=&quot;eq&quot;>Σ[y&lt;sub>i&lt;/sub> − (a x&lt;sub>i&lt;/sub> + b)]&lt;sup>2&lt;/sup> = Σy&lt;sup>2&lt;/sup> − 2aΣxy − 2bΣy + a&lt;sup>2&lt;/sup>Σx&lt;sup>2&lt;/sup> + 2abΣx + nb&lt;sup>2&lt;/sup>&lt;/div>
&lt;p>本组数据的汇总量：n = 5，Σx = 10，Σy = 8，Σx&lt;sup>2&lt;/sup> = 30，Σxy = 30，Σy&lt;sup>2&lt;/sup> = 34。代入：&lt;/p>
&lt;div class=&quot;eq&quot;>J(a, b) = 30a&lt;sup>2&lt;/sup> + 20ab + 5b&lt;sup>2&lt;/sup> − 60a − 16b + 34 + λa&lt;sup>2&lt;/sup>&lt;/div>
&lt;p>接着算后面一直要用的三个中心化量：&lt;/p>
&lt;div class=&quot;eq small&quot;>x̄ = 10/5 = 2，　ȳ = 8/5 = 1.6&lt;br>
S&lt;sub>xx&lt;/sub> = Σ(x&lt;sub>i&lt;/sub> − x̄)&lt;sup>2&lt;/sup> = 30 − 10&lt;sup>2&lt;/sup>/5 = 10&lt;br>
S&lt;sub>xy&lt;/sub> = Σ(x&lt;sub>i&lt;/sub> − x̄)(y&lt;sub>i&lt;/sub> − ȳ) = 30 − 5·2·1.6 = 14&lt;br>
S&lt;sub>yy&lt;/sub> = Σ(y&lt;sub>i&lt;/sub> − ȳ)&lt;sup>2&lt;/sup> = 34 − 8&lt;sup>2&lt;/sup>/5 = 21.2 = 106/5&lt;/div>
&lt;p class=&quot;fine&quot;>S&lt;sub>xy&lt;/sub> 用了恒等式 Σ(x&lt;sub>i&lt;/sub>−x̄)(y&lt;sub>i&lt;/sub>−ȳ) = Σxy − n·x̄·ȳ：把括号乘开后，含 x̄ 与 ȳ 的一次项分别合成为 −2ȳΣx 与 −2x̄Σy，再加上 n x̄ ȳ 的修正，恰好等于 Σxy − n x̄ ȳ。&lt;/p>
&lt;/section>

&lt;section id=&quot;s3&quot;>
&lt;h2>3 中心化改写：交叉项为什么消失&lt;/h2>
&lt;p>记残差 r&lt;sub>i&lt;/sub> = y&lt;sub>i&lt;/sub> − a x&lt;sub>i&lt;/sub> − b，再记 c = ȳ − a x̄ − b。c 的含义是：把 x̄ 代进直线后，预测值与 ȳ 的差。把 r&lt;sub>i&lt;/sub> 按 ȳ、x̄ 重排：&lt;/p>
&lt;div class=&quot;eq&quot;>r&lt;sub>i&lt;/sub> = (y&lt;sub>i&lt;/sub> − ȳ) − a(x&lt;sub>i&lt;/sub> − x̄) + c&lt;/div>
&lt;p>平方后求和，得到四类项：&lt;/p>
&lt;div class=&quot;eq small&quot;>Σr&lt;sub>i&lt;/sub>&lt;sup>2&lt;/sup> = Σ(y&lt;sub>i&lt;/sub>−ȳ)&lt;sup>2&lt;/sup> − 2aΣ(x&lt;sub>i&lt;/sub>−x̄)(y&lt;sub>i&lt;/sub>−ȳ) + a&lt;sup>2&lt;/sup>Σ(x&lt;sub>i&lt;/sub>−x̄)&lt;sup>2&lt;/sup> + 2c·[ Σ(y&lt;sub>i&lt;/sub>−ȳ) − aΣ(x&lt;sub>i&lt;/sub>−x̄) ] + n c&lt;sup>2&lt;/sup>&lt;/div>
&lt;p>方括号里的两个求和都是零：Σ(y&lt;sub>i&lt;/sub> − ȳ) = Σy − nȳ = 0，Σ(x&lt;sub>i&lt;/sub> − x̄) = Σx − nx̄ = 0。所以含 c 的交叉项整体为零，剩下&lt;/p>
&lt;div class=&quot;eq&quot;>Σr&lt;sub>i&lt;/sub>&lt;sup>2&lt;/sup> = S&lt;sub>yy&lt;/sub> − 2aS&lt;sub>xy&lt;/sub> + a&lt;sup>2&lt;/sup>S&lt;sub>xx&lt;/sub> + 5c&lt;sup>2&lt;/sup>&lt;/div>
&lt;p>这就是&quot;可以换成中心化写法&quot;的理由：它把同一个平方和按 (y−ȳ) 与 (x−x̄) 重新分组，没有做任何近似。交叉项消失不依赖 a 取什么值，也不依赖 λ，只依赖两个中心化量各自求和为零。加上罚项：&lt;/p>
&lt;div class=&quot;eq&quot;>J(a, b) = S&lt;sub>yy&lt;/sub> − 2aS&lt;sub>xy&lt;/sub> + a&lt;sup>2&lt;/sup>(S&lt;sub>xx&lt;/sub> + λ) + 5c&lt;sup>2&lt;/sup>&lt;/div>
&lt;/section>

&lt;section id=&quot;s4&quot;>
&lt;h2>4 先定 b：b 只出现在一个非负项里&lt;/h2>
&lt;p>在上一节最后这个式子里，b 只通过 c = ȳ − a x̄ − b 出现，并且以 5c&lt;sup>2&lt;/sup> 的形式出现。给定 a，5c&lt;sup>2&lt;/sup> 的最小值就是 0，取到它的唯一方式是 c = 0：&lt;/p>
&lt;div class=&quot;eq&quot;>b = ȳ − a x̄ = 1.6 − 2a　（对每个 λ ≥ 0 都成立）&lt;/div>
&lt;p>三条推论：&lt;/p>
&lt;ul>
&lt;li>最优直线在 x = x̄ 处的预测值等于 ȳ：把 x = 2 代入得 a·2 + b = 1.6，直线穿过点 (2, 1.6)。&lt;/li>
&lt;li>b 跟着 a 移动。x̄ = 2 为正，所以 a 减小时 b 增大，两者由 b = 1.6 − 2a 绑定。&lt;/li>
&lt;li>这个关系与 λ 无关，因为罚项里没有 b。&lt;/li>
&lt;/ul>
&lt;p>导数版本是同一件事：∂J/∂b = −2Σr&lt;sub>i&lt;/sub>，令其为零得 Σr&lt;sub>i&lt;/sub> = 0，即 y 的平均值等于 ŷ 的平均值。&lt;/p>
&lt;p class=&quot;fine&quot;>对照（本页不计算这种情况）：若罚项写成 λa&lt;sup>2&lt;/sup> + μb&lt;sup>2&lt;/sup>，则 ∂J/∂b = −2Σr&lt;sub>i&lt;/sub> + 2μb = 0 给出 Σr&lt;sub>i&lt;/sub> = μb，一般不为零，直线就不再保证穿过均值点。&lt;/p>
&lt;/section>

&lt;section id=&quot;s5&quot;>
&lt;h2>5 只剩 a：配方给出全局最小与唯一性&lt;/h2>
&lt;p>把 b = ȳ − a x̄ 代回，c 归零，J 变成 a 的一元二次式：&lt;/p>
&lt;div class=&quot;eq&quot;>f(a) = (S&lt;sub>xx&lt;/sub> + λ)a&lt;sup>2&lt;/sup> − 2S&lt;sub>xy&lt;/sub>a + S&lt;sub>yy&lt;/sub> = (10 + λ)a&lt;sup>2&lt;/sup> − 28a + 21.2&lt;/div>
&lt;p>配方时令 a* = S&lt;sub>xy&lt;/sub>/(S&lt;sub>xx&lt;/sub>+λ)，把一次项 −2S&lt;sub>xy&lt;/sub>a 写成 −2(S&lt;sub>xx&lt;/sub>+λ)a·a*：&lt;/p>
&lt;div class=&quot;eq&quot;>f(a) = (S&lt;sub>xx&lt;/sub> + λ)(a − a*)&lt;sup>2&lt;/sup> + S&lt;sub>yy&lt;/sub> − S&lt;sub>xy&lt;/sub>&lt;sup>2&lt;/sup>/(S&lt;sub>xx&lt;/sub> + λ)&lt;/div>
&lt;p>代入数值，得到本页后面反复使用的三个式子：&lt;/p>
&lt;div class=&quot;eq&quot;>a*(λ) = 14/(10 + λ)，　b*(λ) = 1.6 − 2a*(λ)，　J&lt;sub>min&lt;/sub>(λ) = 21.2 − 196/(10 + λ)&lt;/div>
&lt;p>把 b 也留在式子里，配方后的完整形式是&lt;/p>
&lt;div class=&quot;eq&quot;>J(a, b) = (S&lt;sub>xx&lt;/sub> + λ)(a − a*)&lt;sup>2&lt;/sup> + 5[ b − (ȳ − a x̄) ]&lt;sup>2&lt;/sup> + J&lt;sub>min&lt;/sub>　(*)&lt;/div>

&lt;h3>为什么这是全局最小，而不只是一个驻点&lt;/h3>
&lt;p>(*) 右边两项都是&quot;正系数 × 平方&quot;。对任意 (a, b)，两项都 ≥ 0，所以 J ≥ J&lt;sub>min&lt;/sub> 恒成立。取 a = a* 并让方括号为零（即 b = ȳ − a* x̄），两项同时为 0，J 恰好等于 J&lt;sub>min&lt;/sub>。下界被取到，所以 J&lt;sub>min&lt;/sub> 是全局最小值，不存在更低的点。&lt;/p>
&lt;p>求导只提供必要条件：∂J/∂a = 2(S&lt;sub>xx&lt;/sub>+λ)a − 2S&lt;sub>xy&lt;/sub> 在 a* 处为零，∂J/∂b = −10c 在 b = ȳ − a* x̄ 处为零。把&quot;驻点&quot;升级为&quot;最小值&quot;的，是上面那个下界论证。&lt;/p>

&lt;h3>什么时候唯一&lt;/h3>
&lt;ul>
&lt;li>a 那一项的系数 S&lt;sub>xx&lt;/sub> + λ = 10 + λ ≥ 10 &amp;gt; 0，严格为正；a ≠ a* 时这一项就 &amp;gt; 0，所以 a* 唯一。&lt;/li>
&lt;li>b 那一项的系数 5 &amp;gt; 0，且它要求 b 恰好等于 ȳ − a x̄；a 唯一，b 也随之唯一。&lt;/li>
&lt;li>二阶检查：(a, b) 的二阶偏导矩阵是 [[2(30+λ), 20], [20, 10]]，行列式 = 20(10+λ) &amp;gt; 0，矩阵正定，与上述结论一致。&lt;/li>
&lt;/ul>
&lt;p>唯一性依赖 S&lt;sub>xx&lt;/sub> + λ &amp;gt; 0。本组数据 S&lt;sub>xx&lt;/sub> = 10，所以 λ = 0 时也唯一——&quot;有惩罚才唯一&quot;在这里不成立。要让唯一性失效，必须 S&lt;sub>xx&lt;/sub> = 0 且 λ = 0，第 9 节正是这种情况。&lt;/p>
&lt;/section>

&lt;section id=&quot;s6&quot;>
&lt;h2>6 λ = 2 的数值，以及 λ 走一遍的数值表&lt;/h2>
&lt;p>取页面初始值 λ = 2：&lt;/p>
&lt;div class=&quot;eq small&quot;>a* = 14/12 = 7/6 ≈ 1.1667&lt;br>
b* = 1.6 − 2·(7/6) = −11/15 ≈ −0.7333&lt;br>
RSS = S&lt;sub>yy&lt;/sub> − 2a*S&lt;sub>xy&lt;/sub> + a*&lt;sup>2&lt;/sup>S&lt;sub>xx&lt;/sub> = 21.2 − 32.6667 + 13.6111 = 193/90 ≈ 2.144&lt;br>
罚项 λa*&lt;sup>2&lt;/sup> = 2·49/36 = 49/18 ≈ 2.722&lt;br>
J&lt;sub>min&lt;/sub> = 106/5 − 196/12 = 73/15 ≈ 4.867&lt;/div>
&lt;p>一致性检查：RSS + 罚项 = 193/90 + 245/90 = 438/90 = 73/15，与 J&lt;sub>min&lt;/sub> 相同。&lt;/p>

&lt;tr>&lt;td>0.5&lt;/td>&lt;td>1.333&lt;/td>&lt;td>−1.067&lt;/td>&lt;td>1.644&lt;/td>&lt;td>0.889&lt;/td>&lt;td>2.533&lt;/td>&lt;/tr>
&lt;tr>&lt;td>1&lt;/td>&lt;td>1.273&lt;/td>&lt;td>−0.945&lt;/td>&lt;td>1.762&lt;/td>&lt;td>1.620&lt;/td>&lt;td>3.382&lt;/td>&lt;/tr>
&lt;tr class=&quot;hl&quot;>&lt;td>2&lt;/td>&lt;td>1.167&lt;/td>&lt;td>−0.733&lt;/td>&lt;td>2.144&lt;/td>&lt;td>2.722&lt;/td>&lt;td>4.867&lt;/td>&lt;/tr>
&lt;tr>&lt;td>4&lt;/td>&lt;td>1.000&lt;/td>&lt;td>−0.400&lt;/td>&lt;td>3.200&lt;/td>&lt;td>4.000&lt;/td>&lt;td>7.200&lt;/td>&lt;/tr>
&lt;tr>&lt;td>6&lt;/td>&lt;td>0.875&lt;/td>&lt;td>−0.150&lt;/td>&lt;td>4.356&lt;/td>&lt;td>4.594&lt;/td>&lt;td>8.950&lt;/td>&lt;/tr>
&lt;tr>&lt;td>8&lt;/td>&lt;td>0.778&lt;/td>&lt;td>0.044&lt;/td>&lt;td>5.472&lt;/td>&lt;td>4.840&lt;/td>&lt;td>10.311&lt;/td>&lt;/tr>
&lt;tr>&lt;td>10&lt;/td>&lt;td>0.700&lt;/td>&lt;td>0.200&lt;/td>&lt;td>6.500&lt;/td>&lt;td>4.900&lt;/td>&lt;td>11.400&lt;/td>&lt;/tr>

&lt;p class=&quot;fine&quot;>每行都由 a* = 14/(10+λ)、b* = 1.6 − 2a*、RSS = 21.2 − 28a* + 10a*&lt;sup>2&lt;/sup>、罚项 = λa*&lt;sup>2&lt;/sup>、J = RSS + 罚项 算出，与交互面板和图形用的是同一组式子。λ = 2 那一行是页面初始值。&lt;/p>
&lt;/section>

&lt;section id=&quot;s7&quot;>
&lt;h2>7 实验台：同一组数据，只动 λ&lt;/h2>
&lt;p>滑块改变 λ（0 到 10，步长 0.5，初始 2）。数据集按钮会换掉整组观测值，请把它当成另一次实验：两个量不要同时变，否则读数差异说不清是谁造成的。&lt;/p>

&lt;/section>

&lt;section id=&quot;s8&quot;>
&lt;h2>8 四条应该能讲清的事&lt;/h2>
&lt;h3>(a) 增大 λ 为什么改变斜率&lt;/h3>
&lt;p>a*(λ) = 14/(10+λ)。分子 S&lt;sub>xy&lt;/sub> = 14 &amp;gt; 0 与 λ 无关，分母随 λ 增大，所以 a* 随 λ 增大而减小。只要 λ 有限，a* 仍是正数；λ → ∞ 时才趋于 0（本页 λ 最大到 10，a* 最小到 0.7）。&lt;/p>
&lt;p>机制是两笔代价的交换：把 a 从 λ = 0 的 1.4 往下拉，RSS 变大（拟合变差），但 λa&lt;sup>2&lt;/sup> 变小，而且 λ 越大，同样减小 a 能省下的罚项越多。平衡条件是 (S&lt;sub>xx&lt;/sub> + λ)a = S&lt;sub>xy&lt;/sub>，解出 a* = 14/(10+λ)。&lt;/p>
&lt;h3>(b) 截距为什么也跟着变&lt;/h3>
&lt;p>因为 b* = 1.6 − 2a*。x̄ = 2 为正，a* 每减少 0.1，b* 就增加 0.2。λ 从 0 走到 10 时，a* 从 1.4 降到 0.7，b* 从 −1.2 升到 0.2。几何上直线绕 (2, 1.6) 旋转：斜率变小，与 y 轴的交点上移。&lt;/p>
&lt;p>方向来自两件事相加：a* 在下降，x̄ 为正。若这组数据的 x̄ 是负数，同样的 a* 下降会把 b* 推向相反方向。罚项直接惩罚的始终只有 a。&lt;/p>
&lt;h3>(c) 拟合直线为什么仍经过均值点&lt;/h3>
&lt;p>最优时 ∂J/∂b = −2Σr&lt;sub>i&lt;/sub> = 0，残差之和为零。两边除以 n：ŷ 的平均值等于 ȳ，即 a x̄ + b = ȳ。这条性质与 λ 无关，启用它的条件是 b 在每个残差里出现、并且不被惩罚。页面上把 λ 从 0 拖到 10，绿色空心圈 (2, 1.6) 始终落在直线上。&lt;/p>
&lt;h3>(d) 正则化在 x 没有变化时解决了什么&lt;/h3>
&lt;p>第 9 节用同一套推导回答。简短版：那里 S&lt;sub>xx&lt;/sub> = S&lt;sub>xy&lt;/sub> = 0，λ = 0 时有一整族同样好的直线；λ &amp;gt; 0 时答案唯一，但唯一的那个 a = 0 是罚项选出来的，数据并没有提供斜率信息。&lt;/p>
&lt;/section>

&lt;section id=&quot;s9&quot;>
&lt;h2>9 退化数据：五个 x 全等于 2&lt;/h2>
&lt;div class=&quot;note warn&quot;>&lt;b>这里是另一组数据。&lt;/b>观测点换成 x = (2, 2, 2, 2, 2)，y 仍是 (−1, 0, 2, 2, 5)。第 1–8 节的数字都属于数据集 A，不与本节混用。&lt;/div>
&lt;p>新数据的汇总量：x̄ = 2，ȳ = 1.6（没变），S&lt;sub>xx&lt;/sub> = 0，S&lt;sub>xy&lt;/sub> = 0，S&lt;sub>yy&lt;/sub> = 21.2（只由 y 决定）。残差平方和可以先按 u = 2a + b 重写，u 是五个点共同的拟合值：&lt;/p>
&lt;div class=&quot;eq small&quot;>J(a, b) = Σ(y&lt;sub>i&lt;/sub> − (2a + b))&lt;sup>2&lt;/sup> + λa&lt;sup>2&lt;/sup> = 21.2 + 5(2a + b − 1.6)&lt;sup>2&lt;/sup> + λa&lt;sup>2&lt;/sup>&lt;/div>
&lt;p>中间那一步用的是第 3 节的同一个改写 Σ(y&lt;sub>i&lt;/sub> − u)&lt;sup>2&lt;/sup> = S&lt;sub>yy&lt;/sub> + 5(u − ȳ)&lt;sup>2&lt;/sup>；这里 x&lt;sub>i&lt;/sub> − x̄ 全为零，所以 a 不再直接出现在残差里，只能通过 u 出现。&lt;/p>
&lt;h3>λ = 0：一整族最优解&lt;/h3>
&lt;div class=&quot;eq&quot;>J = 21.2 + 5(u − 1.6)&lt;sup>2&lt;/sup>&lt;/div>
&lt;p>最小值 21.2，条件 u = 1.6，也就是 2a + b = 1.6。&lt;/p>
&lt;ul>
&lt;li>a 可以是任何实数，b = 1.6 − 2a，两者一一对应。&lt;/li>
&lt;li>每个候选 (a, b) 都让五个点的拟合值等于 1.6，残差完全相同，所以 RSS 与 J 都等于 21.2。没有一条直线比另一条更好。&lt;/li>
&lt;li>数据只确定了组合 2a + b，即 x = 2 处的拟合值；a 与 b 各自的取值没有被确定。这一族直线都经过 (2, 1.6)，可见&quot;过均值点&quot;与唯一性无关。&lt;/li>
&lt;/ul>
&lt;h3>λ &amp;gt; 0：唯一，但唯一的来源是罚项&lt;/h3>
&lt;div class=&quot;eq&quot;>J = 21.2 + λa&lt;sup>2&lt;/sup> + 5(u − 1.6)&lt;sup>2&lt;/sup>&lt;/div>
&lt;p>两项分别是 a 与 u 的严格正系数平方，最小值在 u = 1.6 且 a = 0，于是 b = 1.6 − 0 = 1.6，最小解唯一：(a, b) = (0, 1.6)。二阶检查：(a, b) 的二阶偏导矩阵是 [[2(20+λ), 20], [20, 10]]，行列式 20λ，λ &amp;gt; 0 时正定；λ = 0 时行列式为 0、矩阵秩为 1，最小解集退化成一条直线。&lt;/p>
&lt;p>把 λ 从 0.5 拖到 10，这组数据的读数一动不动：a = 0，b = 1.6，RSS = 21.2，罚项 = 0，J = 21.2。这正是&quot;数据没有提供斜率信息&quot;的直接表现——每个 λ &amp;gt; 0 都给出同一个答案。&lt;/p>
&lt;div class=&quot;note warn&quot;>&lt;b>要区分的两件事。&lt;/b>&quot;唯一&quot;说的是 J 只有一个最小点；&quot;可辨识&quot;说的是数据能否区分不同斜率。这组数据不能，所以 a = 0 是罚项在众多同样好的直线里挑出的一个约定，把 a = 0 读成&quot;斜率就是 0&quot;超出了这组数据能支持的范围。另外 J 的最小值 21.2 始终大于 0：这五个 y 的波动无法由 x 解释，正则化也不能把它消掉。&lt;/div>
&lt;/section>

&lt;section id=&quot;s10&quot;>
&lt;h2>10 复现清单&lt;/h2>
&lt;ol>
&lt;li>写出 J，把平方展开，代入 n、Σx、Σy、Σx&lt;sup>2&lt;/sup>、Σxy、Σy&lt;sup>2&lt;/sup> 六个汇总量。&lt;/li>
&lt;li>换成 S&lt;sub>xx&lt;/sub>、S&lt;sub>xy&lt;/sub>、S&lt;sub>yy&lt;/sub>，并说明交叉项为零用的是 Σ(x&lt;sub>i&lt;/sub>−x̄) = Σ(y&lt;sub>i&lt;/sub>−ȳ) = 0。&lt;/li>
&lt;li>固定 a 处理 b：对 b 取条件，或直接看 5c&lt;sup>2&lt;/sup> ≥ 0，得 b = ȳ − a x̄。&lt;/li>
&lt;li>代回得 (S&lt;sub>xx&lt;/sub>+λ)a&lt;sup>2&lt;/sup> − 2S&lt;sub>xy&lt;/sub>a + S&lt;sub>yy&lt;/sub>，配方读出 a*、b*、J&lt;sub>min&lt;/sub>。&lt;/li>
&lt;li>用&quot;两项非负、系数为正&quot;说明全局最小，用 S&lt;sub>xx&lt;/sub>+λ &amp;gt; 0 说明唯一，并指出 λ = 0 时本组数据仍唯一。&lt;/li>
&lt;li>对退化数据重做第 3–5 步，写清 λ = 0 时最小解集是一条直线而不是一个点。&lt;/li>
&lt;li>用 λ = 2 对一遍数：a* = 7/6，b* = −11/15，RSS = 193/90，罚项 = 49/18，J = 73/15。&lt;/li>
&lt;/ol>
&lt;/section>
&lt;/main>

&lt;script>
(function(){
  'use strict';
  var DATA = {
    A: {x:[0,1,2,3,4], y:[-1,0,2,2,5]},
    D: {x:[2,2,2,2,2], y:[-1,0,2,2,5]}
  };
  var st = {lambda:2, dataset:'A'};
  var SCALE = 22;

  function stats(k){
    var d = DATA[k], n = d.x.length, i, sx = 0, sy = 0;
    for(i=0;i&lt;n;i++){ sx += d.x[i]; sy += d.y[i]; }
    var mx = sx/n, my = sy/n, sxx = 0, sxy = 0, syy = 0;
    for(i=0;i&lt;n;i++){
      sxx += (d.x[i]-mx)*(d.x[i]-mx);
      sxy += (d.x[i]-mx)*(d.y[i]-my);
      syy += (d.y[i]-my)*(d.y[i]-my);
    }
    return {n:n, mx:mx, my:my, sxx:sxx, sxy:sxy, syy:syy};
  }

  function solve(k, lam){
    var s = stats(k), den = s.sxx + lam;
    if(den &lt;= 1e-9){
      return {unique:false, s:s, a:null, b:null, rss:s.syy, pen:0, j:s.syy};
    }
    var a = s.sxy/den;
    var b = s.my - a*s.mx;
    var rss = s.syy - 2*a*s.sxy + a*a*s.sxx;
    var pen = lam*a*a;
    return {unique:true, s:s, a:a, b:b, rss:rss, pen:pen, j:rss+pen};
  }

  function fmt(v){
    if(v === null || typeof v === 'undefined' || !isFinite(v)) return '—';
    if(Math.abs(v) &lt; 5e-4) return '0';
    var s = v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
    if(s === '-0') s = '0';
    return s;
  }

  var PL = {l:46, r:504, t:18, b:292}, XL = [-0.5,4.5], YL = [-3,6];
  function px(x){ return PL.l + (x-XL[0])/(XL[1]-XL[0])*(PL.r-PL.l); }
  function py(y){ return PL.b - (y-YL[0])/(YL[1]-YL[0])*(PL.b-PL.t); }
  var P2 = {l:34, r:284, t:16, b:132};
  function px2(l){ return P2.l + l/10*(P2.r-P2.l); }
  function py2(a){ return P2.b - a/1.6*(P2.b-P2.t); }

  function drawMain(sol){
    var s = sol.s, d = DATA[st.dataset], i, g = '';
    g += '&lt;defs>&lt;clipPath id=&quot;clipA&quot;>&lt;rect x=&quot;'+PL.l+'&quot; y=&quot;'+PL.t+'&quot; width=&quot;'+(PL.r-PL.l)+'&quot; height=&quot;'+(PL.b-PL.t)+'&quot;/>&lt;/clipPath>&lt;/defs>';
    for(i=0;i&lt;=4;i++){ g += '&lt;line x1=&quot;'+px(i)+'&quot; y1=&quot;'+PL.t+'&quot; x2=&quot;'+px(i)+'&quot; y2=&quot;'+PL.b+'&quot; stroke=&quot;#e9e5db&quot; stroke-width=&quot;1&quot;/>'; }
    for(i=-2;i&lt;=5;i++){ g += '&lt;line x1=&quot;'+PL.l+'&quot; y1=&quot;'+py(i)+'&quot; x2=&quot;'+PL.r+'&quot; y2=&quot;'+py(i)+'&quot; stroke=&quot;#e9e5db&quot; stroke-width=&quot;1&quot;/>'; }
    g += '&lt;line x1=&quot;'+PL.l+'&quot; y1=&quot;'+py(0)+'&quot; x2=&quot;'+PL.r+'&quot; y2=&quot;'+py(0)+'&quot; stroke=&quot;#b3ada0&quot; stroke-width=&quot;1.2&quot;/>';
    g += '&lt;line x1=&quot;'+px(0)+'&quot; y1=&quot;'+PL.b+'&quot; x2=&quot;'+px(0)+'&quot; y2=&quot;'+PL.t+'&quot; stroke=&quot;#b3ada0&quot; stroke-width=&quot;1.2&quot;/>';
    for(i=0;i&lt;=4;i++){ g += '&lt;text x=&quot;'+px(i)+'&quot; y=&quot;'+(PL.b+16)+'&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#6b665c&quot;>'+i+'&lt;/text>'; }
    for(i=-2;i&lt;=4;i+=2){ g += '&lt;text x=&quot;'+(PL.l-7)+'&quot; y=&quot;'+(py(i)+4)+'&quot; text-anchor=&quot;end&quot; font-size=&quot;11.5&quot; fill=&quot;#6b665c&quot;>'+i+'&lt;/text>'; }
    g += '&lt;text x=&quot;'+PL.r+'&quot; y=&quot;'+(PL.b+30)+'&quot; text-anchor=&quot;end&quot; font-size=&quot;12&quot; fill=&quot;#6b665c&quot;>x&lt;/text>';
    g += '&lt;text x=&quot;'+(PL.l+3)+'&quot; y=&quot;'+(PL.t+2)+'&quot; font-size=&quot;12&quot; fill=&quot;#6b665c&quot;>ŷ&lt;/text>';

    var reps = sol.unique ? [sol.a] : [-1.6,-0.8,0,0.8,1.6];
    var lines = '';
    for(i=0;i&lt;reps.length;i++){
      var a0 = reps[i], b0 = s.my - a0*s.mx;
      var y1 = a0*XL[0] + b0, y2 = a0*XL[1] + b0;
      if(sol.unique){
        lines += '&lt;line x1=&quot;'+px(XL[0])+'&quot; y1=&quot;'+py(y1)+'&quot; x2=&quot;'+px(XL[1])+'&quot; y2=&quot;'+py(y2)+'&quot; stroke=&quot;#2f6f5e&quot; stroke-width=&quot;2.6&quot;/>';
      } else {
        lines += '&lt;line x1=&quot;'+px(XL[0])+'&quot; y1=&quot;'+py(y1)+'&quot; x2=&quot;'+px(XL[1])+'&quot; y2=&quot;'+py(y2)+'&quot; stroke=&quot;#8fa9a1&quot; stroke-width=&quot;1.7&quot; stroke-dasharray=&quot;7 5&quot;/>';
      }
    }
    g += '&lt;g clip-path=&quot;url(#clipA)&quot;>'+lines+'&lt;/g>';

    var res = '';
    for(i=0;i&lt;d.x.length;i++){
      var fit = sol.unique ? (sol.a*d.x[i] + sol.b) : s.my;
      res += '&lt;line x1=&quot;'+px(d.x[i])+'&quot; y1=&quot;'+py(d.y[i])+'&quot; x2=&quot;'+px(d.x[i])+'&quot; y2=&quot;'+py(fit)+'&quot; stroke=&quot;#a8642a&quot; stroke-width=&quot;1.6&quot; stroke-dasharray=&quot;4 3&quot;/>';
    }
    g += res;
    for(i=0;i&lt;d.x.length;i++){
      g += '&lt;circle cx=&quot;'+px(d.x[i])+'&quot; cy=&quot;'+py(d.y[i])+'&quot; r=&quot;5&quot; fill=&quot;#1e2328&quot;/>';
    }
    g += '&lt;circle cx=&quot;'+px(s.mx)+'&quot; cy=&quot;'+py(s.my)+'&quot; r=&quot;7.5&quot; fill=&quot;none&quot; stroke=&quot;#2f6f5e&quot; stroke-width=&quot;2&quot;/>';
    g += '&lt;text class=&quot;ml&quot; x=&quot;'+(px(s.mx)-12)+'&quot; y=&quot;'+(py(s.my)-12)+'&quot; text-anchor=&quot;end&quot; font-size=&quot;11.5&quot; fill=&quot;#2f6f5e&quot; stroke=&quot;#ffffff&quot; stroke-width=&quot;3&quot; paint-order=&quot;stroke&quot;>均值点 ('+fmt(s.mx)+', '+fmt(s.my)+')&lt;/text>';
    if(!sol.unique){
      g += '&lt;text x=&quot;'+(PL.l+6)+'&quot; y=&quot;'+(PL.t+40)+'&quot; font-size=&quot;12&quot; fill=&quot;#a8642a&quot; stroke=&quot;#ffffff&quot; stroke-width=&quot;3&quot; paint-order=&quot;stroke&quot;>λ=0：一族直线&lt;/text>';
    }
    document.getElementById('plot').innerHTML = g;
  }

  function drawSlope(sol){
    var g = '', l, pts = [];
    g += '&lt;line x1=&quot;'+P2.l+'&quot; y1=&quot;'+P2.b+'&quot; x2=&quot;'+P2.r+'&quot; y2=&quot;'+P2.b+'&quot; stroke=&quot;#b3ada0&quot;/>';
    g += '&lt;line x1=&quot;'+P2.l+'&quot; y1=&quot;'+(P2.t+2)+'&quot; x2=&quot;'+P2.l+'&quot; y2=&quot;'+P2.b+'&quot; stroke=&quot;#b3ada0&quot;/>';
    [0,5,10].forEach(function(t){ g += '&lt;text x=&quot;'+px2(t)+'&quot; y=&quot;'+(P2.b+15)+'&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#6b665c&quot;>'+t+'&lt;/text>'; });
    [0,0.7,1.4].forEach(function(t){ g += '&lt;text x=&quot;'+(P2.l-5)+'&quot; y=&quot;'+(py2(t)+4)+'&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; fill=&quot;#6b665c&quot;>'+t+'&lt;/text>'; });
    g += '&lt;text x=&quot;'+P2.r+'&quot; y=&quot;'+(P2.b+27)+'&quot; text-anchor=&quot;end&quot; font-size=&quot;11.5&quot; fill=&quot;#6b665c&quot;>λ&lt;/text>';
    g += '&lt;text x=&quot;'+(P2.l-1)+'&quot; y=&quot;'+(P2.t-2)+'&quot; font-size=&quot;11.5&quot; fill=&quot;#6b665c&quot;>a*&lt;/text>';
    for(l=0.5;l&lt;=10.001;l+=0.5){
      var r = solve(st.dataset, l);
      if(!r.unique) continue;
      pts.push(px2(l).toFixed(2)+','+py2(r.a).toFixed(2));
    }
    if(pts.length > 1){
      g += '&lt;polyline points=&quot;'+pts.join(' ')+'&quot; fill=&quot;none&quot; stroke=&quot;#2f6f5e&quot; stroke-width=&quot;2&quot;/>';
    }
    if(sol.unique){
      g += '&lt;line x1=&quot;'+px2(st.lambda)+'&quot; y1=&quot;'+P2.b+'&quot; x2=&quot;'+px2(st.lambda)+'&quot; y2=&quot;'+py2(sol.a)+'&quot; stroke=&quot;#a8642a&quot; stroke-dasharray=&quot;3 3&quot;/>';
      g += '&lt;circle cx=&quot;'+px2(st.lambda)+'&quot; cy=&quot;'+py2(sol.a)+'&quot; r=&quot;4.5&quot; fill=&quot;#a8642a&quot;/>';
    } else {
      g += '&lt;line x1=&quot;'+px2(0)+'&quot; y1=&quot;'+(P2.t+10)+'&quot; x2=&quot;'+px2(0)+'&quot; y2=&quot;'+P2.b+'&quot; stroke=&quot;#a8642a&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/>';
      g += '&lt;text x=&quot;'+(px2(0)+6)+'&quot; y=&quot;'+(P2.t+6)+'&quot; font-size=&quot;10.5&quot; fill=&quot;#a8642a&quot;>λ=0 处是一族解&lt;/text>';
    }
    document.getElementById('slopep').innerHTML = g;
  }

  function render(){
    var sol = solve(st.dataset, st.lambda), s = sol.s;
    document.getElementById('lamv').textContent = st.lambda.toFixed(1);

    var ra = document.getElementById('ra'), rb = document.getElementById('rb');
    ra.textContent = sol.unique ? fmt(sol.a) : '不唯一';
    rb.textContent = sol.unique ? fmt(sol.b) : (fmt(s.my) + ' − ' + fmt(s.mx) + 'a');
    ra.className = sol.unique ? '' : 'dim';
    rb.className = sol.unique ? '' : 'dim';

    document.getElementById('rrss').textContent = fmt(sol.rss);
    document.getElementById('rpen').textContent = fmt(sol.pen);
    document.getElementById('rj').textContent = fmt(sol.j);

    var stt = document.getElementById('status');
    stt.textContent = sol.unique ? '唯一最小解' : '不唯一：一族直线';
    stt.className = sol.unique ? '' : 'dim';

    document.getElementById('segRss').style.width = (sol.rss/SCALE*100).toFixed(2)+'%';
    document.getElementById('segPen').style.width = (sol.pen/SCALE*100).toFixed(2)+'%';
    document.getElementById('legRss').textContent = fmt(sol.rss);
    document.getElementById('legPen').textContent = fmt(sol.pen);
    document.getElementById('legJ').textContent = fmt(sol.j);

    var cap = '数据集 ' + st.dataset + '，λ = ' + st.lambda.toFixed(1) + '：';
    if(sol.unique){
      cap += 'a* = ' + fmt(sol.a) + '，b* = ' + fmt(sol.b) + '，直线 ŷ = ' + fmt(sol.a) + 'x + (' + fmt(sol.b) + ')';
    } else {
      cap += 'a* 不唯一（任意实数），b* = ' + fmt(s.my) + ' − ' + fmt(s.mx) + 'a*';
    }
    if(st.dataset === 'D') cap += '；五个观测点都落在 x = 2';
    document.getElementById('cap').textContent = cap;

    var note = document.getElementById('note');
    if(st.dataset === 'D' &amp;&amp; !sol.unique){
      note.className = 'note warn';
      note.innerHTML = '&lt;b>λ = 0 且 x 没有变化：&lt;/b>五个点的拟合值都是同一个数 u = 2a + b，所以数据只确定了 2a + b = 1.6。a 可以是任何实数，b = 1.6 − 2a；图上几条虚线全都取到 J = 21.2，没有哪一条更好。';
    } else if(st.dataset === 'D'){
      note.className = 'note warn';
      note.innerHTML = '&lt;b>x 没有变化、λ &amp;gt; 0：&lt;/b>最小解唯一，但它等于 (a, b) = (0, 1.6)。a = 0 由罚项选出：数据对斜率没有给出信息，把 λ 从 0.5 拖到 10，读数完全不变。';
    } else {
      note.className = 'note';
      note.innerHTML = '&lt;b>数据集 A：&lt;/b>a* = 14/(10+λ)，b* = 1.6 − 2a*。直线始终经过 (2, 1.6)，增大 λ 让直线绕这一点转动，RSS 上升、罚项先上升后放慢，J 单调上升。';
    }
    drawMain(sol);
    drawSlope(sol);
  }

  function syncButtons(){
    var a = document.getElementById('dsA'), d = document.getElementById('dsD');
    a.className = (st.dataset === 'A') ? 'on' : '';
    d.className = (st.dataset === 'D') ? 'on' : '';
    a.setAttribute('aria-pressed', st.dataset === 'A' ? 'true' : 'false');
    d.setAttribute('aria-pressed', st.dataset === 'D' ? 'true' : 'false');
    document.getElementById('lam').value = String(st.lambda);
  }

  function commit(){
    if(window.presentation &amp;&amp; typeof window.presentation.commitState === 'function'){
      try { window.presentation.commitState(); } catch(e){}
    }
  }

  var range = document.getElementById('lam');
  range.addEventListener('input', function(){
    st.lambda = parseFloat(range.value);
    render();
    commit();
  });

  var presets = document.querySelectorAll('[data-lam]');
  for(var i=0;i&lt;presets.length;i++){
    (function(btn){
      btn.addEventListener('click', function(){
        st.lambda = parseFloat(btn.getAttribute('data-lam'));
        syncButtons();
        render();
        commit();
      });
    })(presets[i]);
  }

  ['A','D'].forEach(function(k){
    document.getElementById('ds'+k).addEventListener('click', function(){
      st.dataset = k;
      syncButtons();
      render();
      commit();
    });
  });

  if(window.presentation &amp;&amp; typeof window.presentation.registerStateReader === 'function'){
    window.presentation.registerStateReader(function(){
      return {
        values: {lambda: st.lambda, dataset: st.dataset},
        visible_step: null,
        observation: {
          summary: '数据集 ' + st.dataset + ' 在 λ = ' + st.lambda.toFixed(1) + ' 时的最优直线与 J 的分解。',
          state: {dataset: st.dataset, lambda: st.lambda}
        }
      };
    });
  }

  if(window.presentation &amp;&amp; typeof window.presentation.registerStateRestorer === 'function'){
    window.presentation.registerStateRestorer(function(saved){
      var v = (saved &amp;&amp; saved.values) ? (saved.values.page || saved.values) : null;
      if(!v) return;
      if(typeof v.lambda === 'number' &amp;&amp; isFinite(v.lambda)){
        st.lambda = Math.min(10, Math.max(0, v.lambda));
      }
      if(v.dataset === 'A' || v.dataset === 'D'){ st.dataset = v.dataset; }
      syncButtons();
      render();
    });
  }

  syncButtons();
  render();
})();
&lt;/script>
