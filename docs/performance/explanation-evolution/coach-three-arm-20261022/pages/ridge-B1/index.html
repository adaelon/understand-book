&lt;h1>带惩罚的直线拟合：把最优解从头推出来&lt;/h1>
&lt;p class=&quot;small&quot;>五个观测点、一个惩罚项。下面从目标函数一路走到唯一性条件，再用一个可拖 λ 的面板核对同一组公式，最后讨论五个 x 都等于 2 的退化情形。文中的数值都来自这组固定数据；交互区切换数据组后，读数按新数据重算。&lt;/p>

&lt;h2>1. 目标函数：五个残差被压成两个数&lt;/h2>
&lt;div class=&quot;tw&quot;>&lt;table>
&lt;caption>固定示例：x=(0,1,2,3,4)，y=(-1,0,2,2,5)；uᵢ=xᵢ−2，ȳ=1.6，n=5。&lt;/caption>
&lt;thead>&lt;tr>&lt;th>i&lt;/th>&lt;th>xᵢ&lt;/th>&lt;th>yᵢ&lt;/th>&lt;th>uᵢ=xᵢ−2&lt;/th>&lt;th>yᵢ−ȳ&lt;/th>&lt;th>uᵢ(yᵢ−ȳ)&lt;/th>&lt;th>uᵢ²&lt;/th>&lt;/tr>&lt;/thead>
&lt;tbody>
&lt;tr>&lt;td>1&lt;/td>&lt;td>0&lt;/td>&lt;td>−1&lt;/td>&lt;td>−2&lt;/td>&lt;td>−2.6&lt;/td>&lt;td>5.2&lt;/td>&lt;td>4&lt;/td>&lt;/tr>
&lt;tr>&lt;td>2&lt;/td>&lt;td>1&lt;/td>&lt;td>0&lt;/td>&lt;td>−1&lt;/td>&lt;td>−1.6&lt;/td>&lt;td>1.6&lt;/td>&lt;td>1&lt;/td>&lt;/tr>
&lt;tr>&lt;td>3&lt;/td>&lt;td>2&lt;/td>&lt;td>2&lt;/td>&lt;td>0&lt;/td>&lt;td>0.4&lt;/td>&lt;td>0&lt;/td>&lt;td>0&lt;/td>&lt;/tr>
&lt;tr>&lt;td>4&lt;/td>&lt;td>3&lt;/td>&lt;td>2&lt;/td>&lt;td>1&lt;/td>&lt;td>0.4&lt;/td>&lt;td>0.4&lt;/td>&lt;td>1&lt;/td>&lt;/tr>
&lt;tr>&lt;td>5&lt;/td>&lt;td>4&lt;/td>&lt;td>5&lt;/td>&lt;td>2&lt;/td>&lt;td>3.4&lt;/td>&lt;td>6.8&lt;/td>&lt;td>4&lt;/td>&lt;/tr>
&lt;tr>&lt;td>合计&lt;/td>&lt;td>10&lt;/td>&lt;td>8&lt;/td>&lt;td>0&lt;/td>&lt;td>0&lt;/td>&lt;td>14&lt;/td>&lt;td>10&lt;/td>&lt;/tr>
&lt;/tbody>&lt;/table>&lt;/div>
&lt;p>要最小化的量是&lt;/p>
&lt;div class=&quot;eq&quot;>J(a,b) = Σᵢ₌₁⁵ [yᵢ − (a·xᵢ + b)]² + λ·a²，  λ ≥ 0&lt;/div>
&lt;p>三个说明，后面每一步都会用到：&lt;/p>
&lt;ul>
&lt;li>&lt;b>第一项是总和。&lt;/b>把五个残差 rᵢ = yᵢ − (a·xᵢ + b) 各自平方再相加，单位是 y 的平方。如果换成平均值口径 (1/5)Σrᵢ²，整条目标差一个常数因子：平均值 + λa² = (1/5)[Σrᵢ² + 5λa²]，等于把惩罚系数放大成 5λ。本页的 λ 一律按总和口径读，这也是这里不除以 n 的原因。&lt;/li>
&lt;li>&lt;b>第二项只含 a。&lt;/b>截距 b 不进入惩罚，这一条会在第 4 节决定&quot;直线为什么始终经过均值点&quot;。&lt;/li>
&lt;li>&lt;b>λ 是给定常数，不是被优化的量。&lt;/b>J 的自变量只有 (a, b) 两个数。&lt;/li>
&lt;/ul>

&lt;h2>2. 换坐标：把直线写成&quot;均值点处的取值 + 斜率 × 横坐标偏差&quot;&lt;/h2>
&lt;p>先算两个均值：x̄ = 10/5 = 2，ȳ = 8/5 = 1.6。再定义偏差 uᵢ = xᵢ − x̄（表第 4 列，合计为 0），以及一个新量 c = a·x̄ + b。&lt;/p>
&lt;div class=&quot;eq&quot;>a·xᵢ + b = a·(x̄ + uᵢ) + b = (a·x̄ + b) + a·uᵢ = c + a·uᵢ&lt;/div>
&lt;p>c 就是直线在 x = x̄ 处的取值。反过来 b = c − a·x̄。所以 (a,b) 与 (a,c) 是一一对应的换元：给定 (a,c) 唯一决定 (a,b)，反之也唯一。既然只是换写法，&quot;在 (a,b) 上最小化 J&quot;和&quot;在 (a,c) 上最小化 J&quot;有同一批最优点。这就是这次改写可以用的理由。&lt;/p>
&lt;h3>2.1 逐项展开残差&lt;/h3>
&lt;div class=&quot;eq&quot;>rᵢ = yᵢ − c − a·uᵢ = (yᵢ − ȳ) − (c − ȳ) − a·uᵢ

Σ rᵢ² = Σ(yᵢ−ȳ)² + n·(c−ȳ)² + a²·Σuᵢ²
        − 2(c−ȳ)·Σ(yᵢ−ȳ) − 2a·Σuᵢ(yᵢ−ȳ) + 2(c−ȳ)·a·Σuᵢ&lt;/div>
&lt;h3>2.2 交叉项消失的地方，以及留下的那一项&lt;/h3>
&lt;ul>
&lt;li>含 (c−ȳ) 的项 −2(c−ȳ)Σ(yᵢ−ȳ)：因为 ȳ 是均值，Σ(yᵢ−ȳ) = 0（表第 5 列合计为 0），这一项整体消失。&lt;/li>
&lt;li>含 (c−ȳ)·a 的项 +2(c−ȳ)aΣuᵢ：因为 uᵢ 是相对均值的偏差，Σuᵢ = 0（表第 4 列合计为 0），这一项也消失。&lt;/li>
&lt;li>留下的交叉项 −2a·Σuᵢ(yᵢ−ȳ) = −2a·Sxy。它一般不为零：uᵢ 与 (yᵢ−ȳ) 可以同号，本组数据 Sxy = 14 &amp;gt; 0，横坐标偏大的点纵坐标也偏大。&lt;/li>
&lt;/ul>
&lt;p>机制一句话：中心化让两组偏差各自求和为零，于是&quot;整体抬高/压低的那个位移 c−ȳ&quot;与&quot;斜率 a&quot;之间没有可搭的乘积项；a 的一次项只剩下来自数据同向程度的那一份，权重正是 x 的偏差与 y 的偏差的同向程度。&lt;/p>
&lt;h3>2.3 加上惩罚并代入这组数&lt;/h3>
&lt;div class=&quot;eq&quot;>Sxx = Σuᵢ² = 4+1+0+1+4 = 10
Sxy = Σuᵢ(yᵢ−ȳ) = 5.2+1.6+0+0.4+6.8 = 14
Syy = Σ(yᵢ−ȳ)² = 6.76+2.56+0.16+0.16+11.56 = 21.2

J = Syy + n(c−ȳ)² + (Sxx+λ)a² − 2·Sxy·a
  = 21.2 + 5(c−1.6)² + (10+λ)a² − 28a&lt;/div>
&lt;p>每一项的角色：21.2 是&quot;只用 ȳ 预测全部点&quot;时的误差平方总和；5(c−1.6)² 是把整条线搬离均值高度的代价；最后两项决定斜率。注意 −28a 与 λ 无关，它来自数据本身的倾斜。&lt;/p>

&lt;h2>3. 配方：下界、取到点、唯一性&lt;/h2>
&lt;p>把只含 a 的两块合并成一个平方。λ ≥ 0 时 10+λ ≥ 10 &amp;gt; 0，除以它是安全的：&lt;/p>
&lt;div class=&quot;eq&quot;>(10+λ)a² − 28a = (10+λ)·(a − 14/(10+λ))² − 196/(10+λ)&lt;/div>
&lt;p>核对：右边展开得 (10+λ)a² − 28a + 196/(10+λ)，再减去 196/(10+λ) 就回到左边。代回 J：&lt;/p>
&lt;div class=&quot;eq&quot;>J = [21.2 − 196/(10+λ)] + 5·(c−1.6)² + (10+λ)·(a − 14/(10+λ))²&lt;/div>
&lt;h3>3.1 全局最小值&lt;/h3>
&lt;ul>
&lt;li>两个平方项的系数 5 &amp;gt; 0 与 10+λ &amp;gt; 0 都是正的，平方本身非负，因此对任意 (a, c) 都有 J ≥ 21.2 − 196/(10+λ)。&lt;/li>
&lt;li>等号当且仅当 c = 1.6 且 a = 14/(10+λ)。这两个条件互不牵制，可以同时满足。&lt;/li>
&lt;li>下界被真正取到，所以这个点就是全局最小点。这一步直接给出&quot;最小值&quot;，而不只是&quot;某个点导数为零&quot;。&lt;/li>
&lt;/ul>
&lt;h3>3.2 什么时候唯一&lt;/h3>
&lt;p>正系数乘非负平方，只有平方等于零才取到下界。当 Sxx+λ = 10+λ &amp;gt; 0 时，a 只有唯一取值能取到下界；同时 n = 5 &amp;gt; 0 使 c 也只有唯一取值。于是 (a,c) 唯一，换回 (a,b) 也唯一。对本组数据，λ = 0 时 10+0 = 10 &amp;gt; 0，所以 λ ≥ 0 的每一档都有唯一最小解。要让唯一性失效，需要 Sxx+λ = 0，也就是 Sxx = 0 且 λ = 0——第 6 节的数据正是这种情形。&lt;/p>
&lt;h3>3.3 与求导对照&lt;/h3>
&lt;div class=&quot;eq&quot;>∂J/∂a = 2(10+λ)a − 28，∂J/∂c = 10(c−1.6)

令两式为零：a = 14/(10+λ)，c = 1.6&lt;/div>
&lt;p>结果与配方一致，两种看法分工不同：求导只给出候选点，配方给出&quot;这是最小值、并且唯一点&quot;的理由。J 关于 (a,c) 是二次函数且二次项系数全正，所以候选点就是全局最小点。&lt;/p>
&lt;p>λ = 2 的具体数值：a = 14/12 = 7/6 ≈ 1.167，c = 1.6，J 的最小值 = 21.2 − 196/12 = 21.2 − 16.333 = 4.867。&lt;/p>

&lt;h2>4. 回代 b：截距为什么跟着变&lt;/h2>
&lt;div class=&quot;eq&quot;>b = c − a·x̄ = 1.6 − 2a

λ = 0：a = 1.4，   b = −1.2，  J = 1.6
λ = 2：a ≈ 1.167， b ≈ −0.733，J ≈ 4.867
λ = 10：a = 0.7，  b = 0.2，   J = 11.4&lt;/div>
&lt;p>变化率（对 λ 求导）：da/dλ = −14/(10+λ)² &amp;lt; 0，db/dλ = 28/(10+λ)² &amp;gt; 0。在 λ = 2 处，λ 每增加 1，斜率约减少 0.097、截距约增加 0.194。这是该点的局部速率，整段并不匀速。&lt;/p>
&lt;p>截距为什么会动，来自 b 的最优条件：∂J/∂b = −2Σ(yᵢ − a·xᵢ − b) = 0 给出 Σrᵢ = 0，即平均残差为零，等价于&lt;/p>
&lt;div class=&quot;eq&quot;>a·x̄ + b = ȳ，本组数据即 2a + b = 1.6&lt;/div>
&lt;p>这条条件里没有 λ，因为惩罚项不含 b。所以每一档 λ 的最优点都必须落在这条约束上：a 被 λ 压低，b 只能在约束上反向补偿。几何上就是直线绕着 (2, 1.6) 转动。λ = 0 时这条同样成立，普通最小二乘的残差和也是零。&lt;/p>

&lt;h2>5. 交互：在同一个 J 上改 λ&lt;/h2>
&lt;div class=&quot;panel&quot;>
&lt;div class=&quot;ctrl&quot;>&lt;div class=&quot;ctrl-head&quot;>&lt;label for=&quot;lambda&quot;>λ（惩罚强度）&lt;/label>&lt;output id=&quot;lambdaOut&quot; for=&quot;lambda&quot;>2&lt;/output>&lt;/div>
&lt;input id=&quot;lambda&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;2&quot; data-presentation-parameter=&quot;lambda&quot;>
&lt;div class=&quot;hint&quot;>范围 0–10，步长 0.5。拖动后直线、读数与下面的 J(a) 曲线同时更新。&lt;/div>&lt;/div>
&lt;div class=&quot;ctrl&quot;>&lt;label for=&quot;dataset&quot;>数据组&lt;/label>
&lt;select id=&quot;dataset&quot; data-presentation-parameter=&quot;dataset&quot;>
&lt;option value=&quot;original&quot;>原始数据：x = 0, 1, 2, 3, 4&lt;/option>
&lt;option value=&quot;degenerate&quot;>退化数据：五个 x 都等于 2&lt;/option>
&lt;/select>&lt;/div>
&lt;div class=&quot;ctrl&quot; id=&quot;demoWrap&quot;>&lt;div class=&quot;ctrl-head&quot;>&lt;label for=&quot;demoA&quot;>对比直线：斜率 a₀&lt;/label>&lt;output id=&quot;demoAOut&quot; for=&quot;demoA&quot;>0&lt;/output>&lt;/div>
&lt;input id=&quot;demoA&quot; type=&quot;range&quot; min=&quot;-2&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;0&quot; data-presentation-parameter=&quot;demo_a&quot;>
&lt;div class=&quot;hint&quot;>另画一条过均值点的灰虚线 ŷ = a₀·(x − 2) + 1.6，并给出它的 SSE 与 J。原始数据时它在 J(a) 曲线上比最优点高，差额写在下方说明里；退化数据且 λ = 0 时，它就是并列解族里被画出的那一条，J 与最优点相同。&lt;/div>&lt;/div>
&lt;svg id=&quot;chart1&quot; viewBox=&quot;0 0 400 300&quot; role=&quot;img&quot; aria-label=&quot;散点与当前 λ 的拟合直线&quot;>&lt;g id=&quot;g1&quot;>&lt;/g>&lt;/svg>
&lt;p class=&quot;small&quot; id=&quot;chartNote&quot;>散点固定；红线是当前 λ 的最小解直线。&lt;/p>
&lt;div class=&quot;readouts&quot; id=&quot;readout-region&quot;>
&lt;div class=&quot;ro&quot;>&lt;span class=&quot;k&quot;>斜率 a&lt;/span>&lt;span class=&quot;v&quot; id=&quot;roA&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;ro&quot;>&lt;span class=&quot;k&quot;>截距 b&lt;/span>&lt;span class=&quot;v&quot; id=&quot;roB&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;ro&quot;>&lt;span class=&quot;k&quot;>未加惩罚的误差平方和 SSE = Σrᵢ²&lt;/span>&lt;span class=&quot;v&quot; id=&quot;roSSE&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;ro&quot;>&lt;span class=&quot;k&quot;>惩罚项 λa²&lt;/span>&lt;span class=&quot;v&quot; id=&quot;roPen&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;ro&quot;>&lt;span class=&quot;k&quot;>目标值 J = SSE + λa²&lt;/span>&lt;span class=&quot;v&quot; id=&quot;roJ&quot;>—&lt;/span>&lt;/div>
&lt;div class=&quot;ro&quot;>&lt;span class=&quot;k&quot;>直线在 x̄ = 2 处的值 c&lt;/span>&lt;span class=&quot;v&quot; id=&quot;roC&quot;>—&lt;/span>&lt;/div>
&lt;/div>
&lt;div class=&quot;eq&quot; id=&quot;formulaLine&quot;>—&lt;/div>
&lt;div class=&quot;note&quot; id=&quot;statusNote&quot;>—&lt;/div>
&lt;svg id=&quot;chart2&quot; viewBox=&quot;0 0 400 170&quot; role=&quot;img&quot; aria-label=&quot;J 随 a 变化的曲线与最小点&quot;>&lt;g id=&quot;g2&quot;>&lt;/g>&lt;/svg>
&lt;p class=&quot;small&quot;>上图把 c 固定在其最优值后，画出 J 随 a 变化的整条曲线。曲线的最低点应当与上面算出的 a 一致——这是核对，不是证明；理由在第 3 节。&lt;/p>
&lt;/div>
&lt;p>面板里的读数按当前 λ 与当前数据组重算。SSE 与 J 分开显示：前者只看残差，后者再加上 λa²。拖 λ 时可以用眼睛确认两件事：直线始终穿过绿圈标出的 (2, 1.6)，以及斜率下降时截距同步上升。&lt;/p>

&lt;h2>6. 退化数据：五个 x 都等于 2&lt;/h2>
&lt;p>把数据换成 x = (2,2,2,2,2)、y 不变，仍用第 2 节的分解式。此时 x̄ = 2、ȳ = 1.6 不变，偏差 uᵢ 全部为零：&lt;/p>
&lt;div class=&quot;eq&quot;>Sxx = 0，Sxy = 0，Syy = 21.2
J = 21.2 + 5(c−1.6)² + λa²，其中 c = 2a + b&lt;/div>
&lt;h3>6.1 λ = 0：一整族并列最优&lt;/h3>
&lt;div class=&quot;eq&quot;>J = 21.2 + 5(2a+b−1.6)²

最小值 21.2，条件只有 2a + b = 1.6&lt;/div>
&lt;p>对任意 a 取 b = 1.6 − 2a，J 都等于 21.2：a = 0 → b = 1.6；a = 1 → b = −0.4；a = −1 → b = 3.6。三条直线的 J 完全相同，无穷多条直线并列最优。数据能确定的只有 c = 2a + b（也就是 x = 2 这一处的预测值 1.6），a 与 b 单独都不被确定。此时给出一个&quot;唯一 a&quot;的读数，等于隐瞒了一个自由度；面板因此显示&quot;不确定&quot;，并只把示例线当作族中的一条画出来。&lt;/p>
&lt;h3>6.2 λ &amp;gt; 0：唯一&lt;/h3>
&lt;div class=&quot;eq&quot;>J = 21.2 + 5(c−1.6)² + λ·a²，λ &amp;gt; 0&lt;/div>
&lt;p>λa² 除 a = 0 外严格为正，所以最小化必须先取 a = 0，再由 c = 1.6 定出 b = 1.6。解唯一，J 的最小值仍是 21.2（惩罚项在最优点上为 0）。公式 a = Sxy/(Sxx+λ) = 0/(0+λ) = 0 在 λ &amp;gt; 0 时照样成立；λ = 0 时它变成 0/0，公式失效的位置与唯一性失效的位置是同一处。&lt;/p>
&lt;h3>6.3 正则化在这里做了什么&lt;/h3>
&lt;p>x 没有变化时，数据只能定位&quot;在 x = 2 处的预测值&quot;。任何通过 (2,1.6) 的直线，配合相应的截距，都给出同样的残差：把 a 改大造成的整体倾斜，可以在这一列上完全用 b 抵消。也就是说数据无法区分斜率与截距。&lt;/p>
&lt;p>λa² 给斜率的绝对值附加代价（因为平方，a &amp;gt; 0 与 a &amp;lt; 0 都要付费），于是在同样好的族里按&quot;a 离 0 最近&quot;挑出一条，选出 a = 0、b = 1.6。它做的是一件事：把并列解变成一条按规则选出的解。关于 y 随 x 怎样变化，它没有增加任何信息，J 的最小值也一点没降。&lt;/p>
&lt;p>这个挑法依赖&quot;惩罚只落在 a 上&quot;这一设定。假设同一道题把惩罚换成 λb²（λ &amp;gt; 0），退化数据的解就变成 b = 0、a = 0.8（因为 2a + b = 1.6 且 b² 最小），最小值仍是 21.2。两者都能选出唯一解，选中的点不同；本页的 J 只惩罚 a，所以上面被选出的是 a = 0、b = 1.6。&lt;/p>

&lt;h2>7. 回到你列出的四个问题&lt;/h2>
&lt;ol>
&lt;li>&lt;b>增大 λ 为什么改变斜率。&lt;/b>a 方向上的二次系数从 Sxx = 10 涨到 10+λ，同样大的 a 要付 2(10+λ)a 的边际代价，平衡点 a = 14/(10+λ) 因此向 0 移动；Sxy = 14 &amp;gt; 0 时单调下降，局部速率 −14/(10+λ)²。&lt;/li>
&lt;li>&lt;b>截距为什么跟着变。&lt;/b>b 的最优条件恒为 2a + b = 1.6，与 λ 无关。a 下降 0.1，b 必须上升 0.2 才留在这条约束上，直线绕 (2,1.6) 转。&lt;/li>
&lt;li>&lt;b>为什么仍经过均值点。&lt;/b>惩罚不含 b，所以 Σrᵢ = 0 在每一档 λ 都成立，等价于 a·x̄ + b = ȳ，即直线在 x̄ = 2 处的取值永远等于 1.6。&lt;/li>
&lt;li>&lt;b>x 没有变化时正则化解决什么。&lt;/b>解决&quot;并列最优里取哪一条&quot;，也就是解的选取（可识别性与唯一性）。代价是把斜率压向 0；它不改善拟合，也不提供 x 与 y 之间关系的信息。&lt;/li>
&lt;/ol>
&lt;p class=&quot;small&quot;>要自己复现这条推导，顺序是：换坐标 (a,b)→(a,c) → 展开并消掉两个交叉项 → 对 a 配方读出下界与取到点 → 换回 b = c − a·x̄ → 检查 Sxx+λ &amp;gt; 0 判断唯一性。第 3 节与第 6 节用的是同一个分解式，差别只在 Sxx 与 Sxy 是否为零。&lt;/p>
&lt;/main>&lt;script>(function(){var DATA={original:{x:[0,1,2,3,4],y:[-1,0,2,2,5]},degenerate:{x:[2,2,2,2,2],y:[-1,0,2,2,5]}};var state={lambda:2,dataset:'original',demoA:0};
function stats(key){var d=DATA[key],x=d.x,y=d.y,n=x.length,i,sx=0,sy=0;for(i=0;i&lt;n;i++){sx+=x[i];sy+=y[i];}var xb=sx/n,yb=sy/n,sxx=0,sxy=0,syy=0,u,v;for(i=0;i&lt;n;i++){u=x[i]-xb;v=y[i]-yb;sxx+=u*u;sxy+=u*v;syy+=v*v;}return{x:x,y:y,n:n,xb:xb,yb:yb,sxx:sxx,sxy:sxy,syy:syy};}
function solve(){var s=stats(state.dataset),lam=state.lambda,den=s.sxx+lam,uniq=den>1e-9,a=null,b,aUsed;if(uniq){a=s.sxy/den;b=s.yb-a*s.xb;aUsed=a;}else{aUsed=state.demoA;b=s.yb-aUsed*s.xb;}var c=aUsed*s.xb+b,sse=0,i,r;for(i=0;i&lt;s.n;i++){r=s.y[i]-(aUsed*s.x[i]+b);sse+=r*r;}var pen=lam*aUsed*aUsed;return{s:s,lam:lam,uniq:uniq,a:a,b:b,aUsed:aUsed,c:c,sse:sse,pen:pen,J:sse+pen};}

var C1={W:400,H:300,L:40,R:12,T:12,B:30,xmin:-0.7,xmax:4.7,ymin:-3.2,ymax:6.4};

for(i=0;i&lt;s.n;i++){dxs.push(jitter?(i-2)*0.06:0);}
o+='&lt;defs>&lt;clipPath id=&quot;clip1&quot;>&lt;rect x=&quot;'+C1.L+'&quot; y=&quot;'+C1.T+'&quot; width=&quot;'+(C1.W-C1.L-C1.R)+'&quot; height=&quot;'+(C1.H-C1.T-C1.B)+'&quot;/>&lt;/clipPath>&lt;/defs>';
o+='&lt;rect x=&quot;'+C1.L+'&quot; y=&quot;'+C1.T+'&quot; width=&quot;'+(C1.W-C1.L-C1.R)+'&quot; height=&quot;'+(C1.H-C1.T-C1.B)+'&quot; fill=&quot;#fffdf8&quot; stroke=&quot;#e6e2d9&quot;/>';
for(gx=0;gx&lt;=4;gx++){o+='&lt;line x1=&quot;'+px1(gx).toFixed(1)+'&quot; y1=&quot;'+C1.T+'&quot; x2=&quot;'+px1(gx).toFixed(1)+'&quot; y2=&quot;'+py1(C1.ymin).toFixed(1)+'&quot; stroke=&quot;#f1ede4&quot;/>';o+='&lt;text x=&quot;'+px1(gx).toFixed(1)+'&quot; y=&quot;'+(py1(C1.ymin)+14)+'&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;#5a5a52&quot;>'+gx+'&lt;/text>';}
for(gy=-3;gy&lt;=6;gy++){o+='&lt;line x1=&quot;'+C1.L+'&quot; y1=&quot;'+py1(gy).toFixed(1)+'&quot; x2=&quot;'+px1(C1.xmax).toFixed(1)+'&quot; y2=&quot;'+py1(gy).toFixed(1)+'&quot; stroke=&quot;#f1ede4&quot;/>';o+='&lt;text x=&quot;'+(C1.L-4)+'&quot; y=&quot;'+(py1(gy)+4).toFixed(1)+'&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;#5a5a52&quot;>'+gy+'&lt;/text>';}
o+='&lt;text x=&quot;'+(C1.W-6)+'&quot; y=&quot;'+(py1(C1.ymin)+14)+'&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot; fill=&quot;#5a5a52&quot;>x&lt;/text>';
if(!r.uniq){var d;for(d=-1;d&lt;=1;d+=2){var ag=r.aUsed+d*1.5;if(Math.abs(ag)>6){continue;}o+=seg(ag,r.b,'stroke=&quot;#b7b1a3&quot; stroke-width=&quot;1.6&quot; stroke-dasharray=&quot;7 5&quot;');}}
if(r.uniq&amp;&amp;Math.abs(state.demoA-r.aUsed)>0.01){o+=seg(state.demoA,s.yb-state.demoA*s.xb,'stroke=&quot;#7a746a&quot; stroke-width=&quot;1.7&quot; stroke-dasharray=&quot;6 4&quot;');}
o+=seg(r.aUsed,r.b,'stroke=&quot;#b4451f&quot; stroke-width=&quot;2.6&quot;');
for(i=0;i&lt;s.n;i++){var xv=s.x[i]+dxs[i],yh=r.aUsed*s.x[i]+r.b;o+='&lt;line x1=&quot;'+px1(xv).toFixed(1)+'&quot; y1=&quot;'+py1(s.y[i]).toFixed(1)+'&quot; x2=&quot;'+px1(xv).toFixed(1)+'&quot; y2=&quot;'+py1(yh).toFixed(1)+'&quot; stroke=&quot;#b4451f&quot; stroke-width=&quot;1.3&quot; stroke-dasharray=&quot;3 3&quot; opacity=&quot;0.8&quot;/>';}
for(i=0;i&lt;s.n;i++){o+='&lt;circle cx=&quot;'+px1(s.x[i]+dxs[i]).toFixed(1)+'&quot; cy=&quot;'+py1(s.y[i]).toFixed(1)+'&quot; r=&quot;4.4&quot; fill=&quot;#1d1d1b&quot; stroke=&quot;#fffdf8&quot; stroke-width=&quot;1.4&quot;/>';}
o+='&lt;circle cx=&quot;'+px1(s.xb).toFixed(1)+'&quot; cy=&quot;'+py1(s.yb).toFixed(1)+'&quot; r=&quot;7&quot; fill=&quot;none&quot; stroke=&quot;#2f6b4f&quot; stroke-width=&quot;2&quot;/>';
var mlx=px1(s.xb)+11,manch='start';if(state.dataset==='degenerate'){mlx=px1(s.xb)-11;manch='end';}
o+='&lt;text x=&quot;'+mlx.toFixed(1)+'&quot; y=&quot;'+(py1(s.yb)-11).toFixed(1)+'&quot; font-size=&quot;12&quot; text-anchor=&quot;'+manch+'&quot; fill=&quot;#2f6b4f&quot;>均值点 ('+n1(s.xb)+', '+n1(s.yb)+')&lt;/text>';

function chart2(r){var s=r.s,lam=r.lam,i,a,v,maxJ=-1e9,pts=[],o='',f=function(t){return s.syy+(s.sxx+lam)*t*t-2*s.sxy*t;};
for(i=0;i&lt;=160;i++){a=C2.amin+(C2.amax-C2.amin)*i/160;v=f(a);pts.push([a,v]);if(v>maxJ){maxJ=v;}}

o+='&lt;rect x=&quot;'+C2.L+'&quot; y=&quot;'+C2.T+'&quot; width=&quot;'+(C2.W-C2.L-C2.R)+'&quot; height=&quot;'+(C2.H-C2.T-C2.B)+'&quot; fill=&quot;#fffdf8&quot; stroke=&quot;#e6e2d9&quot;/>';
[0,ymax/2,ymax].forEach(function(t){o+='&lt;line x1=&quot;'+C2.L+'&quot; y1=&quot;'+my(t).toFixed(1)+'&quot; x2=&quot;'+(C2.W-C2.R)+'&quot; y2=&quot;'+my(t).toFixed(1)+'&quot; stroke=&quot;#f1ede4&quot;/>';o+='&lt;text x=&quot;'+(C2.L-4)+'&quot; y=&quot;'+(my(t)+4).toFixed(1)+'&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot; fill=&quot;#5a5a52&quot;>'+t.toFixed(0)+'&lt;/text>';});

els.roA.textContent=r.uniq?n3(r.a):'不确定';

var s=r.s,fl='';
if(r.uniq){fl='a = S_xy / (S_xx + λ) = '+n1(s.sxy)+' / ('+n1(s.sxx)+' + '+n1(r.lam)+') = '+n3(r.a)+'\nb = ȳ − a·x̄ = '+n1(s.yb)+' − '+n1(s.xb)+'×'+n3(r.a)+' = '+n3(r.b)+'\nJ = SSE + λa² = '+n3(r.sse)+' + '+n3(r.pen)+' = '+n3(r.J);}
else{fl='S_xx = 0，S_xy = 0，λ = 0：a = S_xy/(S_xx+λ) = 0/0，公式在这里失效，a 不被数据确定。\n能确定的只有 c = 2a + b = '+n3(r.c)+'；给定任一个 a，b = '+n1(s.yb)+' − '+n1(s.xb)+'·a 就给出同样好的直线。\n画面上这条是示例线：a = '+n1(state.demoA)+'，b = '+n3(r.b)+'，SSE = '+n3(r.sse)+'，λa² = 0，J = '+n3(r.J)+'。';}
els.formulaLine.textContent=fl;
var note;
if(!r.uniq){note='当前：退化数据，λ = 0。所有满足 2a + b = 1.6 的直线 J 都等于 '+n3(r.J)+'，并列最优；a 与 b 单独都不被确定，读数里的 b 属于画出的那条示例线。';}
else if(state.dataset==='degenerate'){note='当前：退化数据，λ = '+n1(r.lam)+' > 0。惩罚项把 a 压到 0，再由 2a + b = 1.6 定出 b = 1.6，解唯一；J 的最小值仍是 '+n3(r.J)+'，其中惩罚项为 0。';}
else{note='当前：原始数据，λ = '+n1(r.lam)+'。唯一最小解 a = '+n3(r.a)+'、b = '+n3(r.b)+'。SSE 只算残差平方和，J 是在它之上再加 '+n3(r.pen)+' 的惩罚。';}
var a0=state.demoA,b0=r.s.yb-a0*r.s.xb,sse0=0,ii0,rr0;
