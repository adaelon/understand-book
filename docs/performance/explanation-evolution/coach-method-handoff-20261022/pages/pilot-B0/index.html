&lt;body>
&lt;main>
&lt;h1>从两个盒子理解转移和总量&lt;/h1>
&lt;p class=&quot;lead&quot;>左盒一开始有 8 枚棋子，右盒有 2 枚。每次把左盒的一枚棋子搬到右盒：两盒里各有多少枚会变，两盒加起来始终是 10 枚。&lt;/p>

&lt;section class=&quot;rule&quot; aria-labelledby=&quot;ruleTitle&quot;>
  &lt;h2 id=&quot;ruleTitle&quot;>看懂规则（不点按钮也能读）&lt;/h2>
  &lt;ul>
    &lt;li>棋子编了 1 到 10 号，只是为了让你盯住&lt;b>同一枚&lt;/b>棋子；棋子本身完全一样。&lt;/li>
    &lt;li>左盒放 1–8 号，共 &lt;b>8 枚&lt;/b>；右盒放 9、10 号，共 &lt;b>2 枚&lt;/b>。合起来：&lt;b>8 + 2 = 10&lt;/b>。&lt;/li>
    &lt;li>搬动 k 次后：左盒 &lt;b>8 − k&lt;/b> 枚，右盒 &lt;b>2 + k&lt;/b> 枚，总数仍是 &lt;b>10&lt;/b> 枚。k 只统计已经落进右盒的棋子。&lt;/li>
    &lt;li>按一次按钮只搬一枚。它离开左盒后先到中间的「途中」，落进右盒才算进右盒的枚数。&lt;/li>
  &lt;/ul>
&lt;/section>

&lt;section class=&quot;stage&quot; id=&quot;stage&quot; aria-label=&quot;两个盒子的互动演示&quot;>
  &lt;div id=&quot;sceneWrap&quot;>&lt;/div>
&lt;/section>

&lt;section class=&quot;readout&quot; id=&quot;readout&quot; aria-label=&quot;当前读数&quot;>
  &lt;p class=&quot;status&quot; id=&quot;status&quot; role=&quot;status&quot;>还没有搬动。按「前进一枚」开始搬第一枚。&lt;/p>
  &lt;div class=&quot;metrics&quot;>
    &lt;div class=&quot;metric&quot;>&lt;span class=&quot;mlabel&quot;>已转移 k&lt;/span>&lt;span class=&quot;val&quot; id=&quot;mK&quot;>0&lt;/span>&lt;span class=&quot;unit&quot;>次&lt;/span>&lt;/div>
    &lt;div class=&quot;metric&quot;>&lt;span class=&quot;mlabel&quot;>左盒&lt;/span>&lt;span class=&quot;val&quot; id=&quot;mLeft&quot;>8&lt;/span>&lt;span class=&quot;unit&quot;>枚&lt;/span>&lt;/div>

  &lt;/div>

&lt;h2>跟着看一次搬动&lt;/h2>
&lt;p>在初始状态按一下「前进一枚」。被搬的那枚棋子会高亮，从左边移到中间：这段时间它不在任何一个盒子里，只出现在「途中」一栏。等它落进右盒，k 才从 0 变成 1，读数同时变成左盒 7、右盒 3、合计 10。&lt;/p>
&lt;p>按「后退一枚」，同一枚棋子从右盒原路回到左盒；按「重置」回到一开始的 8 加 2。想在途中停下来看，就按「暂停」。&lt;/p>

&lt;h2>为什么总数不会增加&lt;/h2>
&lt;p>任何时刻，每一枚棋子恰好待在一个地方：左盒、途中、右盒。搬动只改变它在哪个地方，不会凭空多出棋子，也不会让棋子消失，所以这三个数相加总是 10。&lt;/p>
&lt;p>k 记录的是已经完成多少次搬动，它给这些变化编号，不参与计算总量。搬动一次，左盒少一枚、右盒多一枚；棋子落进右盒的那一刻，k 才加一。&lt;/p>
&lt;p>静止时用公式写：左盒 8 − k 枚，右盒 2 + k 枚。两式相加 (8 − k) + (2 + k) = 10，k 正好抵消，所以无论 k 是 0 还是 8，合计都是 10 枚。取 k = 3 核对：左盒 5 枚、右盒 5 枚、合计 10 枚。&lt;/p>

&lt;h2>容易看错的地方&lt;/h2>
&lt;p>棋子离开左盒、还没落进右盒的那一小段时间，左盒少了一枚，右盒还没多出来。这时只盯着两个盒子，会以为总数变成了 9。其实少掉的那一枚正在途中，把它加回来正好是 10。页面把这一枚单独放在「途中」一栏，就是为了让它任何时刻都只被数一次。&lt;/p>

&lt;h2>核对表与边界&lt;/h2>
&lt;div class=&quot;tablewrap&quot;>
&lt;table id=&quot;table&quot;>

&lt;/table>

    svg.push('&lt;/svg>');
    byId(&quot;sceneWrap&quot;).innerHTML = svg.join(&quot;&quot;);

    byId(&quot;mK&quot;).textContent = String(state.k);
    byId(&quot;mLeft&quot;).textContent = String(c.left);
    byId(&quot;mTransit&quot;).textContent = String(c.transit);
    byId(&quot;mRight&quot;).textContent = String(c.right);
    byId(&quot;mTotal&quot;).textContent = String(c.total);
    byId(&quot;mTransitBox&quot;).classList.toggle(&quot;hot&quot;, c.flying);

    var bal;
    if (c.flying) {
      bal = &quot;左盒 &quot; + c.left + &quot; 枚 ＋ 途中 &quot; + c.transit + &quot; 枚 ＋ 右盒 &quot; + c.right + &quot; 枚 ＝ &quot; + c.total + &quot; 枚&quot;;
      bal += c.dir === &quot;forward&quot;
        ? &quot;（k 仍是 &quot; + state.k + &quot;：第 &quot; + c.moving + &quot; 号棋子还没落进右盒）&quot;
        : &quot;（k 仍是 &quot; + state.k + &quot;：第 &quot; + c.moving + &quot; 号棋子还没落回左盒）&quot;;
    } else {
      bal = &quot;左盒 &quot; + c.left + &quot; 枚 ＋ 右盒 &quot; + c.right + &quot; 枚 ＝ &quot; + c.total + &quot; 枚&quot;;
      if (state.k > 0) { bal += &quot;（左盒 8 − &quot; + state.k + &quot; = &quot; + c.left + &quot;，右盒 2 + &quot; + state.k + &quot; = &quot; + c.right + &quot;）&quot;; }
    }
    var balanceEl = byId(&quot;balance&quot;);
    balanceEl.textContent = bal;
    balanceEl.classList.toggle(&quot;hot&quot;, c.flying);

    var statusEl = byId(&quot;status&quot;);
    if (c.flying) {
      statusEl.textContent = c.dir === &quot;forward&quot;
        ? &quot;第 &quot; + c.moving + &quot; 号棋子正在从左边搬到右边：它在途中，暂时不算进左盒，也不算进右盒。&quot;
        : &quot;第 &quot; + c.moving + &quot; 号棋子正在从右边搬回左边：它在途中，同样只算一次。&quot;;
    } else if (state.k === 0) {
      statusEl.textContent = &quot;还没有搬动。按「前进一枚」开始搬第一枚。&quot;;
    } else if (state.k === MAX_K) {
      statusEl.textContent = &quot;左盒已经空了，没有可以再搬的棋子。&quot;;
    } else {
      statusEl.textContent = &quot;已经完成 &quot; + state.k + &quot; 次搬动：棋子只是换了位置，总数没有变。&quot;;
    }

    byId(&quot;kRange&quot;).value = String(state.k);
    byId(&quot;kRangeOut&quot;).textContent = String(state.k);
    byId(&quot;advance&quot;).disabled = c.flying || state.k >= MAX_K;
    byId(&quot;back&quot;).disabled = c.flying || state.k &lt;= 0;
    byId(&quot;reset&quot;).disabled = state.k === 0 &amp;&amp; !c.flying;
    byId(&quot;pause&quot;).disabled = !(c.flying || playing);
    byId(&quot;pause&quot;).textContent = (!playing &amp;&amp; c.flying) ? &quot;继续&quot; : &quot;暂停&quot;;

    var rows = byId(&quot;table&quot;).tBodies[0].rows;
    for (var r = 0; r &lt; rows.length; r++) {
      rows[r].classList.toggle(&quot;now&quot;, Number(rows[r].getAttribute(&quot;data-k&quot;)) === state.k);
    }
  }

  function commit() {
    try {
      if (window.presentation &amp;&amp; typeof window.presentation.commitState === &quot;function&quot;) { window.presentation.commitState(); }
    } catch (e) {}
  }

  function finish() {
    if (resolver) { var r = resolver; resolver = null; r(); }
  }

  function land() {
    playing = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (state.dir === &quot;forward&quot;) { state.k = Math.min(MAX_K, state.k + 1); }
    else { state.k = Math.max(0, state.k - 1); }
    state.p = 0;
    render();
    commit();
    finish();
  }

  function tick() {
    if (!playing) { finish(); return; }
    var u = (now() - rafStart) / DURATION;
    if (u >= 1) { land(); return; }
    state.p = clamp(u, 0.0001, 0.999);
    render();
    rafId = requestAnimationFrame(tick);
  }

  function animateTo(dir) {
    if (playing || state.p > 0) { return Promise.resolve(); }
    if (dir === &quot;forward&quot; &amp;&amp; state.k >= MAX_K) { return Promise.resolve(); }
    if (dir === &quot;backward&quot; &amp;&amp; state.k &lt;= 0) { return Promise.resolve(); }
    state.dir = dir === &quot;backward&quot; ? &quot;backward&quot; : &quot;forward&quot;;
    state.p = 0.0001;
    playing = true;
    rafStart = now();
    render();
    return new Promise(function (resolve) {
      resolver = resolve;
      rafId = requestAnimationFrame(tick);
    });
  }

  function togglePause() {
    if (playing) {
      playing = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      render();
      commit();
      finish();
    } else if (state.p > 0) {
      playing = true;
      rafStart = now() - state.p * DURATION;
      render();
      rafId = requestAnimationFrame(tick);
    }
  }

  function resetAll() {
    playing = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    state.k = 0; state.p = 0; state.dir = &quot;forward&quot;;
    render();
    commit();
    finish();
  }

  function applyK(value) {
    var k = Number(value);
    if (!isFinite(k)) { return; }
    playing = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    state.k = clamp(Math.round(k), 0, MAX_K);
    state.p = 0;
    state.dir = &quot;forward&quot;;
    render();
    commit();
    finish();
  }

  function buildTable() {
    var body = byId(&quot;table&quot;).tBodies[0];
    var html = [];
    for (var k = 0; k &lt;= MAX_K; k++) {
      var now = k === state.k ? ' class=&quot;now&quot;' : '';
      html.push('&lt;tr data-k=&quot;' + k + '&quot;' + now + '>&lt;td>' + k + '&lt;/td>&lt;td>' + (8 - k) + '&lt;/td>&lt;td>' + (2 + k) + '&lt;/td>&lt;td>10&lt;/td>&lt;/tr>');
    }
    body.innerHTML = html.join(&quot;&quot;);
  }

  function boot() {
    var initial = {};
    try { initial = (window.presentation &amp;&amp; window.presentation.initialState) || {}; } catch (e) { initial = {}; }
    buildTable();
    byId(&quot;advance&quot;).addEventListener(&quot;click&quot;, function () { animateTo(&quot;forward&quot;); });
    byId(&quot;back&quot;).addEventListener(&quot;click&quot;, function () { animateTo(&quot;backward&quot;); });
    byId(&quot;reset&quot;).addEventListener(&quot;click&quot;, resetAll);
    byId(&quot;pause&quot;).addEventListener(&quot;click&quot;, togglePause);
    byId(&quot;kRange&quot;).addEventListener(&quot;input&quot;, function (ev) { applyK(ev.target.value); });

    document.addEventListener(&quot;keydown&quot;, function (ev) {
      if (ev.key === &quot;ArrowRight&quot;) { animateTo(&quot;forward&quot;); }
      else if (ev.key === &quot;ArrowLeft&quot;) { animateTo(&quot;backward&quot;); }
    });

    window.presentationScene = {
      seek: function (target) {
        var t = target || {};
        playing = false;
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
        var k = Number(t.semantic_state);
        if (isFinite(k)) { state.k = clamp(Math.round(k), 0, MAX_K); }
        var p = Number(t.transition_progress);
        state.p = isFinite(p) ? clamp(p, 0, 0.999) : 0;
        if (state.p > 0 &amp;&amp; state.dir === &quot;forward&quot; &amp;&amp; state.k >= MAX_K) { state.p = 0; }
        if (state.p > 0 &amp;&amp; state.dir === &quot;backward&quot; &amp;&amp; state.k &lt;= 0) { state.p = 0; }
        render();
        return Promise.resolve({ semantic_state: state.k, transition_progress: state.p, playing: false });
      },
      snapshot: function () {
        return { semantic_state: state.k, transition_progress: state.p, playing: playing };
      }
    };

    if (window.presentation &amp;&amp; typeof window.presentation.registerStateReader === &quot;function&quot;) {
      window.presentation.registerStateReader(function () {
        var c = compute();
        var name = c.flying ? c.moving : null;
        var summary = c.flying
          ? &quot;第 &quot; + name + &quot; 号棋子在途中：左盒 &quot; + c.left + &quot; 枚，途中 1 枚，右盒 &quot; + c.right + &quot; 枚，合计 &quot; + c.total + &quot; 枚&quot;
          : &quot;k = &quot; + state.k + &quot;：左盒 &quot; + c.left + &quot; 枚，右盒 &quot; + c.right + &quot; 枚，合计 &quot; + c.total + &quot; 枚&quot;;
        return {
          values: {
            transfer_count: state.k,
            transition_progress: state.p,
            pending_direction: state.dir
          },
          visible_step: c.flying ? (&quot;k=&quot; + state.k + &quot;，第 &quot; + name + &quot; 号棋子在途中&quot;) : (&quot;k=&quot; + state.k + &quot;，静止&quot;),
          observation: {
            summary: summary,
            state: {
              transfer_count: state.k,
              left_box: c.left,
              in_transit: c.transit,
              right_box: c.right,
              total: c.total,
              phase: c.flying ? &quot;in_transit&quot; : &quot;settled&quot;
            }
          }
        };
      });
    }

    if (window.presentation &amp;&amp; typeof window.presentation.registerStateRestorer === &quot;function&quot;) {
      window.presentation.registerStateRestorer(function (saved) {
        try {
          var v = (saved &amp;&amp; saved.values &amp;&amp; saved.values.page) || (saved &amp;&amp; saved.values) || {};
          playing = false;
          if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
          var k = Number(v.transfer_count);
          if (isFinite(k)) { state.k = clamp(Math.round(k), 0, MAX_K); }
          state.dir = v.pending_direction === &quot;backward&quot; ? &quot;backward&quot; : &quot;forward&quot;;
          var p = Number(v.transition_progress);
          state.p = isFinite(p) ? clamp(p, 0, 0.999) : 0;
          if (state.p > 0 &amp;&amp; state.dir === &quot;forward&quot; &amp;&amp; state.k >= MAX_K) { state.p = 0; }
          if (state.p > 0 &amp;&amp; state.dir === &quot;backward&quot; &amp;&amp; state.k &lt;= 0) { state.p = 0; }
          render();
        } catch (e) {}
      });
    }

    if (window.presentation &amp;&amp; typeof window.presentation.registerActionHandler === &quot;function&quot;) {
      window.presentation.registerActionHandler(function (action) {
        if (!action) { return; }
        if (action.kind === &quot;invoke&quot;) {
          if (action.action_id === &quot;advance&quot;) { return animateTo(&quot;forward&quot;); }
          if (action.action_id === &quot;backward&quot;) { return animateTo(&quot;backward&quot;); }
          if (action.action_id === &quot;reset&quot;) { resetAll(); return; }
          return;
        }
        if (action.kind === &quot;set_parameters&quot;) {
          var vals = action.values || {};
          if (Object.prototype.hasOwnProperty.call(vals, &quot;transfer_count&quot;)) { applyK(vals.transfer_count); }
        }
      });
    }

    if (initial &amp;&amp; isFinite(Number(initial.transfer_count))) {
      state.k = clamp(Math.round(Number(initial.transfer_count)), 0, MAX_K);
    }
    if (initial &amp;&amp; isFinite(Number(initial.transition_progress))) {
      state.p = clamp(Number(initial.transition_progress), 0, 1);
    }
    if (state.p >= 1) { state.p = 0; }
    render();
  }

  if (document.readyState === &quot;loading&quot;) {
    document.addEventListener(&quot;DOMContentLoaded&quot;, boot);
  } else {
    boot();
  }
})();
&lt;/script>
&lt;/body>&lt;/html>"></iframe></body></html>
