&lt;main>

&lt;header>
  &lt;p class=&quot;eyebrow&quot;>计算图 · 反向传播&lt;/p>
  &lt;h1>同一个 u 被用两次，两份回传贡献在哪里相加&lt;/h1>
  &lt;p class=&quot;lead&quot;>模型只有四条式子：u = x·y，v = u + x，L = v² + 3u。u 供两处使用（v 和 L 的 3u 项），x 也供两处使用（u 和 v），y 只供一处。下面用同一组节点，先把前向值算出来，再沿边回传：节点数值、边上的局部导数、累计到节点的 dL/d 分开放，最后看漏掉一份会错成什么样，并用展开求导核对。&lt;/p>
&lt;/header>

&lt;section aria-labelledby=&quot;model-h&quot;>
  &lt;h2 id=&quot;model-h&quot;>模型和它的依赖&lt;/h2>
  &lt;div class=&quot;eqs&quot;>
    &lt;p>&lt;b>u = x·y&lt;/b>&lt;span>u 用了 x 和 y&lt;/span>&lt;/p>
    &lt;p>&lt;b>v = u + x&lt;/b>&lt;span>v 用了 u 和 x&lt;/span>&lt;/p>
    &lt;p>&lt;b>L = v² + 3u&lt;/b>&lt;span>L 用了 v 和 u&lt;/span>&lt;/p>
  &lt;/div>
  &lt;p>数一下每个量被用了几次：u 出现在 v 里，也出现在 3u 里，所以 u 有 2 个下游；x 出现在 u 里，也出现在 v 里，所以 x 有 2 个下游；y 只出现在 u 里，所以 y 有 1 个下游。这三个数字决定了反向时每个量会收到几份贡献，后面每一步都会回到它们。&lt;/p>
&lt;/section>

&lt;section class=&quot;card&quot; aria-labelledby=&quot;fig-h&quot;>
  &lt;div class=&quot;card-head&quot;>
    &lt;span id=&quot;fig-h&quot;>同一张图：前向值、局部导数、累计导数&lt;/span>
    &lt;span class=&quot;state-line&quot; id=&quot;state-line&quot;>&lt;/span>
  &lt;/div>
  &lt;svg id=&quot;scene&quot; viewBox=&quot;0 0 760 440&quot; role=&quot;img&quot; aria-label=&quot;计算依赖图&quot;>&lt;/svg>
  &lt;p class=&quot;legend&quot;>图上三件事分开写：节点框里是&lt;b>前向数值&lt;/b>和&lt;b>累计到该节点的 dL/d&lt;/b>；边旁边是这条边的&lt;b>局部导数&lt;/b>；带 + 的数字表示一份回传贡献到达了该节点。&lt;span id=&quot;dir-note&quot;>&lt;/span>&lt;/p>
  &lt;div class=&quot;readout&quot;>
    &lt;div class=&quot;panel&quot;>&lt;h3>① 节点前向值&lt;/h3>&lt;div id=&quot;pA&quot;>&lt;/div>&lt;/div>
    &lt;div class=&quot;panel&quot;>&lt;h3>② 边上的局部导数与沿边回传的贡献&lt;/h3>&lt;div id=&quot;pB&quot;>&lt;/div>&lt;/div>
    &lt;div class=&quot;panel&quot;>&lt;h3>③ 累计到各节点的 dL/d&lt;/h3>&lt;div id=&quot;pC&quot;>&lt;/div>&lt;/div>
  &lt;/div>
  &lt;p class=&quot;stepwhy&quot; id=&quot;stepwhy&quot;>&lt;/p>
&lt;/section>

&lt;section class=&quot;controls&quot; aria-labelledby=&quot;ctl-h&quot;>
  &lt;h2 id=&quot;ctl-h&quot; class=&quot;sr-only&quot;>步骤与输入&lt;/h2>
  &lt;div class=&quot;stepbar&quot;>
    &lt;button type=&quot;button&quot; id=&quot;prev&quot;>← 上一步&lt;/button>
    &lt;input type=&quot;range&quot; id=&quot;step&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;1&quot; value=&quot;3&quot; aria-label=&quot;解释步骤，0 到 8&quot;>
    &lt;button type=&quot;button&quot; id=&quot;next&quot;>下一步 →&lt;/button>
    &lt;button type=&quot;button&quot; id=&quot;reset&quot;>重置&lt;/button>
  &lt;/div>
  &lt;p class=&quot;stepline&quot; id=&quot;stepline&quot;>&lt;/p>
  &lt;div class=&quot;params&quot;>
    &lt;div class=&quot;param&quot;>
      &lt;label for=&quot;px&quot;>输入 x&lt;/label>&lt;output id=&quot;pxval&quot; for=&quot;px&quot;>2&lt;/output>
      &lt;input type=&quot;range&quot; id=&quot;px&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;2&quot; aria-label=&quot;输入 x，-3 到 3，步长 0.5&quot;>
    &lt;/div>
    &lt;div class=&quot;param&quot;>
      &lt;label for=&quot;py&quot;>输入 y&lt;/label>&lt;output id=&quot;pyval&quot; for=&quot;py&quot;>3&lt;/output>
      &lt;input type=&quot;range&quot; id=&quot;py&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;3&quot; aria-label=&quot;输入 y，-3 到 3，步长 0.5&quot;>

  &lt;/div>
  &lt;div class=&quot;presets&quot;>
    &lt;button type=&quot;button&quot; data-preset=&quot;default&quot;>默认：x = 2，y = 3&lt;/button>
    &lt;button type=&quot;button&quot; data-preset=&quot;zero&quot;>v = 0：经 v 的贡献为 0（x = 2，y = −1）&lt;/button>
    &lt;button type=&quot;button&quot; data-preset=&quot;zerolocal&quot;>x = 0：u 对 y 的局部导数为 0&lt;/button>
    &lt;button type=&quot;button&quot; data-preset=&quot;neg&quot;>负数输入：x = −2，y = 3&lt;/button>
  &lt;/div>
&lt;/section>

&lt;section class=&quot;prose&quot; aria-labelledby=&quot;fwd-h&quot;>
  &lt;h2 id=&quot;fwd-h&quot;>&lt;span class=&quot;num&quot;>3&lt;/span>前向：三个数按依赖顺序算出来&lt;/h2>
  &lt;p>用默认输入 x = 2、y = 3 走一遍。&lt;/p>
  &lt;div class=&quot;formula&quot;>
u = x·y = 2 × 3 = 6　（x 和 y 都进了这个乘法）&lt;br>
v = u + x = 6 + 2 = 8　（这里用的 u 就是上一步的 6，同一个数）&lt;br>
L = v² + 3u = 8² + 3 × 6 = 64 + 18 = 82　（3u 又取了同一个 u = 6）
  &lt;/div>
  &lt;p>顺序由依赖关系决定：一个节点要等它用到的量都算好才能算，所以先 u、再 v、最后 L。反向传播沿这个顺序倒着走。&lt;/p>
&lt;/section>

&lt;section class=&quot;prose&quot; aria-labelledby=&quot;bwd-h&quot;>
  &lt;h2 id=&quot;bwd-h&quot;>&lt;span class=&quot;num&quot;>4&lt;/span>反向：先算谁由下游决定&lt;/h2>
  &lt;p>下面把靠近输入的一端叫上游，靠近输出的一端叫下游。L 在最下游，x、y 在最上游。反向传播分三步做。&lt;/p>
  &lt;p>第一，从 L 出发，取 dL/dL = 1 作为种子：L 对自身的变化率是 1。&lt;/p>
  &lt;p>第二，沿一条边从下游往上游回传时，用下游已有的 dL/d(下游) 乘上这条边的局部导数 ∂(下游)/∂(上游)，得到送给上游节点的贡献。&lt;/p>
  &lt;p>第三，上游节点把它每条下游边送来的贡献相加，得到自己的 dL/d(上游)。&lt;/p>
  &lt;p>顺序也由依赖关系决定：v 唯一的消费者是 L，所以 dL/dv 必须先算出来，u 才能凑齐经 v 回来的那一份。于是顺序是 L → v → u → x、y。把 u 提到 v 前面，u 就只收到 3u 项那一份。&lt;/p>

  &lt;h3>v：只收到一份&lt;/h3>
  &lt;p>边 v→L 的局部导数是 ∂L/∂v = 2v = 2 × 8 = 16。v 只有一条下游边，所以 dL/dv = 1 × 16 = 16，v 到此完成。&lt;/p>

  &lt;h3>u：两份贡献，在这里相加&lt;/h3>
  &lt;p>u 有两条下游边：u→v（局部导数 ∂v/∂u = 1）和 u→L（局部导数 ∂L/∂u = 3，来自 3u 这一项）。&lt;/p>
  &lt;div class=&quot;formula&quot;>
经 v 回来：dL/dv × ∂v/∂u = 16 × 1 = 16&lt;br>
3u 项直接给：dL/dL × ∂L/∂u = 1 × 3 = 3&lt;br>
dL/du = 16 + 3 = 19
  &lt;/div>
  &lt;p>两份都要算，因为 u 是一个数：它在 v 里和在 3u 里取的是同一个 6。让 x 变动一点，u 就动一点，v 和 3u 会同时跟着动，L 的总变化是这两处变化之和。只算一处，等于假设 L 只有一种方式受 u 影响。&lt;/p>

  &lt;h3>x：两份贡献，也在这里相加&lt;/h3>
  &lt;p>x 有两条下游边：x→u（局部导数 ∂u/∂x = y = 3）和 x→v（局部导数 ∂v/∂x = 1）。&lt;/p>
  &lt;div class=&quot;formula&quot;>
经 u 回来：dL/du × ∂u/∂x = 19 × 3 = 57&lt;br>
经 v 直接回来：dL/dv × ∂v/∂x = 16 × 1 = 16&lt;br>
dL/dx = 57 + 16 = 73
  &lt;/div>
  &lt;p>57 这一份里其实合进了两条更长的路径：x 经 u 到 v 再到 L，以及 x 经 u 直接到 3u 项。两条都在 u 那里加过了，所以在 x 这里只以 57 这个数出现。&lt;/p>

  &lt;h3>y：只收到一份&lt;/h3>
  &lt;p>y 只有一条下游边 y→u（局部导数 ∂u/∂y = x = 2），于是 dL/dy = dL/du × 2 = 19 × 2 = 38。y 到 L 其实有两条路径（经 v、经 3u 项），但它们都在 u 合过并了，到 y 这里只剩一个数。&lt;/p>
&lt;/section>

&lt;section class=&quot;prose&quot; aria-labelledby=&quot;rule-h&quot;>
  &lt;h2 id=&quot;rule-h&quot;>&lt;span class=&quot;num&quot;>5&lt;/span>相加的理由，和一个可数的检查&lt;/h2>
  &lt;p>把上面的做法写成一个式子：对任意一个量 n，&lt;/p>
  &lt;div class=&quot;formula&quot;>dL/dn = Σ（n 的每条下游边）［ dL/d(该边的终点) × ∂(终点)/∂n ］&lt;/div>
  &lt;p>求和号覆盖 n 的所有下游边，一条不漏。每一项对应一种「改变 n 就能改变 L」的方式：n 动一点点，每一处用到 n 的地方都会跟着动，L 的变化是这些地方的变化之和，所以对 n 求导要把每一项都算进来。&lt;/p>
  &lt;p>这个式子还给了一个可数的检查办法：一个节点收到几份贡献，等于它有几条下游边。u 有 2 条，x 有 2 条，y 有 1 条，L 有 0 条（它是起点，只有种子 1）。数一遍边，就知道那个位置该不该出现第二个加号。&lt;/p>
&lt;/section>

&lt;section class=&quot;prose&quot; aria-labelledby=&quot;leak-h&quot;>
  &lt;h2 id=&quot;leak-h&quot;>&lt;span class=&quot;num&quot;>6&lt;/span>漏掉一份会怎样&lt;/h2>
  &lt;p class=&quot;sub&quot; id=&quot;leak-intro&quot;>&lt;/p>
  &lt;div class=&quot;livebox&quot;>
    &lt;div class=&quot;mini&quot;>&lt;h4>正确：两份都算&lt;/h4>&lt;div id=&quot;leakOk&quot;>&lt;/div>&lt;/div>
    &lt;div class=&quot;mini warn&quot;>&lt;h4 id=&quot;leakAh&quot;>漏掉 L→u 的 3&lt;/h4>&lt;div id=&quot;leakA&quot;>&lt;/div>&lt;/div>
    &lt;div class=&quot;mini warn&quot;>&lt;h4 id=&quot;leakBh&quot;>漏掉 v→u 的 16&lt;/h4>&lt;div id=&quot;leakB&quot;>&lt;/div>&lt;/div>
  &lt;/div>
  &lt;p>两张漏算卡片的差值有统一规律：漏掉的那一份会乘上从 u 到该输入的局部导数，再传到这个输入。所以误差的大小随 x、y 变化，不是一个固定偏差。&lt;/p>
  &lt;p>反向传播每一步只沿边把信息送一次。u 收齐之后才继续往 x、y 传；漏掉的那一份不会在后面被自动补回来，也没有第二次机会。&lt;/p>
  &lt;p>某一份贡献恰好为 0 时，路径仍然存在：它在当前输入下被局部导数乘成了 0。这时漏掉它和保留它数值相同，但那是因为它本来就等于 0。点上面「v = 0」那个预设就能看到这种情形。&lt;/p>
&lt;/section>

&lt;section class=&quot;prose&quot; aria-labelledby=&quot;check-h&quot;>
  &lt;h2 id=&quot;check-h&quot;>&lt;span class=&quot;num&quot;>7&lt;/span>用展开求导做一次独立核对&lt;/h2>
  &lt;p>把 u 和 v 代进 L，只留 x 和 y：&lt;/p>
  &lt;div class=&quot;formula&quot;>
L = (x·y + x)² + 3xy = x²y² + 2x²y + x² + 3xy&lt;br>
对 x 求偏导时把 y 当常数：∂L/∂x = 2xy² + 4xy + 2x + 3y&lt;br>
对 y 求偏导时把 x 当常数：∂L/∂y = 2x²y + 2x² + 3x
  &lt;/div>
  &lt;p class=&quot;sub&quot; id=&quot;check-intro&quot;>&lt;/p>
  &lt;div class=&quot;livebox&quot;>
    &lt;div class=&quot;mini&quot;>&lt;h4>图中累计的结果&lt;/h4>&lt;div id=&quot;chkGraph&quot;>&lt;/div>&lt;/div>
    &lt;div class=&quot;mini&quot;>&lt;h4>展开式求导的结果&lt;/h4>&lt;div id=&quot;chkExpand&quot;>&lt;/div>&lt;/div>
    &lt;div class=&quot;mini&quot;>&lt;h4>两者之差&lt;/h4>&lt;div id=&quot;chkDiff&quot;>&lt;/div>&lt;/div>
  &lt;/div>
  &lt;p>每项都能追到一条路径：从 x 到 L 有三条，x→u→v→L 给出 2xy² 与 2xy，x→v→L 给出 2xy 与 2x，x→u→L（3u 项）给出 3y；三项相加正是 2xy² + 4xy + 2x + 3y。展开式一次算完整个和，计算图只是把同一个和按边组织起来，两边必须相等。&lt;/p>
&lt;/section>

&lt;footer>
  &lt;p>这个页面只用四项运算和两个实数输入，不涉及矩阵、网络层或实现细节。步骤数 9 表示讲解展开到第几段，不表示计算耗时；滑块的步长是 0.5，因此输入值都落在 0.5 的格点上。&lt;/p>
  &lt;details>
    &lt;summary>适用范围与约定&lt;/summary>
    &lt;p>模型固定为 u = x·y、v = u + x、L = v² + 3u，没有其它分支或循环。颜色含义固定：青绿表示经 v 回来的贡献，蓝色表示经 u 回来的贡献，金色表示 3u 项直接给的贡献。箭头在第 1 至 3 步顺着依赖方向，从第 4 步起翻转，表示信息回传的方向。负的贡献按普通加减处理，符号会保留在读数里。&lt;/p>
  &lt;/details>
&lt;/footer>

&lt;/main>
&lt;script>
(function(){
  &quot;use strict&quot;;
  var P = {
    ink:&quot;#1f3438&quot;, muted:&quot;#6b7f7a&quot;, line:&quot;#cfd9d2&quot;, dim:&quot;#a9b7b0&quot;,
    surface:&quot;#ffffff&quot;, accent:&quot;#17756f&quot;, gold:&quot;#a9741f&quot;, blue:&quot;#3f6a9e&quot;, soft:&quot;#f0f7f3&quot;
  };
  function $(id){ return document.getElementById(id); }
  function fmt(v){
    var r = Math.round(v * 10000) / 10000;
    if(Object.is(r, -0)) r = 0;
    return String(r);
  }
  function w(v){ return v &lt; 0 ? &quot;(&quot; + fmt(v) + &quot;)&quot; : fmt(v); }
  function clampNum(v, lo, hi){
    var n = Number(v);
    if(!isFinite(n)) return 0;
    return Math.max(lo, Math.min(hi, Math.round(n * 2) / 2));
  }

  var state = { x: 2, y: 3, step: 3 };
  var init = (window.presentation &amp;&amp; window.presentation.initialState) || {};
  state.x = clampNum(init.x, -3, 3);
  state.y = clampNum(init.y, -3, 3);
  state.step = Math.max(0, Math.min(8, Math.round(Number(init.step)) || 3));

  var STEPS = [&quot;起点&quot;,&quot;前向①：u&quot;,&quot;前向②：v&quot;,&quot;前向③：L&quot;,&quot;反向起点&quot;,&quot;回传 L→v&quot;,&quot;u 汇合&quot;,&quot;x 汇合&quot;,&quot;y 收到一份&quot;];

  function model(s){
    var x = s.x, y = s.y;
    var u = x * y, v = u + x, L = v * v + 3 * u;
    var du_dx = y, du_dy = x, dv_du = 1, dv_dx = 1, dL_dv = 2 * v, dL_du = 3;
    var gL = 1, gv = gL * dL_dv;
    var cu_v = gv * dv_du, cu_L = gL * dL_du, gu = cu_v + cu_L;
    var cx_u = gu * du_dx, cx_v = gv * dv_dx, gx = cx_u + cx_v;
    var cy_u = gu * du_dy, gy = cy_u;
    return {x:x,y:y,u:u,v:v,L:L,du_dx:du_dx,du_dy:du_dy,dv_du:dv_du,dv_dx:dv_dx,
            dL_dv:dL_dv,dL_du:dL_du,gL:gL,gv:gv,cu_v:cu_v,cu_L:cu_L,gu:gu,
            cx_u:cx_u,cx_v:cx_v,gx:gx,cy_u:cy_u,gy:gy};
  }

  var NODE = {
    x:{cx:86, cy:148, name:&quot;x&quot;, def:&quot;输入&quot;},
    y:{cx:86, cy:356, name:&quot;y&quot;, def:&quot;输入&quot;},
    u:{cx:330,cy:252, name:&quot;u&quot;, def:&quot;u = x·y&quot;},
    v:{cx:330,cy:84,  name:&quot;v&quot;, def:&quot;v = u + x&quot;},
    L:{cx:628,cy:168, name:&quot;L&quot;, def:&quot;L = v² + 3u&quot;}
  };
  var HW = 136, HH = 84;

  var EDGE = [
    {id:&quot;e1&quot;, a:[154,166], b:[258,240], lx:196, ly:214, anch:&quot;middle&quot;, color:P.blue,   fwd:1, bwd:7, f:function(m){return &quot;∂u/∂x = y = &quot; + fmt(m.du_dx);}},
    {id:&quot;e2&quot;, a:[154,338], b:[258,264], lx:196, ly:296, anch:&quot;middle&quot;, color:P.blue,   fwd:1, bwd:8, f:function(m){return &quot;∂u/∂y = x = &quot; + fmt(m.du_dy);}},
    {id:&quot;e3&quot;, a:[330,210], b:[330,130], lx:342, ly:176, anch:&quot;start&quot;,  color:P.accent, fwd:2, bwd:6, f:function(){return &quot;∂v/∂u = 1&quot;;}},
    {id:&quot;e4&quot;, a:[154,130], b:[258,96],  lx:200, ly:100, anch:&quot;middle&quot;, color:P.accent, fwd:2, bwd:7, f:function(){return &quot;∂v/∂x = 1&quot;;}},
    {id:&quot;e5&quot;, a:[398,84],  b:[556,150], lx:462, ly:96,  anch:&quot;middle&quot;, color:P.accent, fwd:3, bwd:5, f:function(m){return &quot;∂L/∂v = 2v = &quot; + fmt(m.dL_dv);}},
    {id:&quot;e6&quot;, a:[398,252], b:[556,190], lx:486, ly:232, anch:&quot;middle&quot;, color:P.gold,   fwd:3, bwd:6, f:function(){return &quot;∂L/∂u = 3&quot;;}}
  ];

  var ARR = [
    {step:5, x:406, y:76,  color:P.accent, f:function(m){return fmt(m.gv);}},
    {step:6, x:344, y:202, color:P.accent, f:function(m){return &quot;+&quot; + fmt(m.cu_v);}},
    {step:6, x:404, y:266, color:P.gold,   f:function(m){return &quot;+&quot; + fmt(m.cu_L);}},
    {step:7, x:164, y:158, color:P.blue,   f:function(m){return &quot;+&quot; + fmt(m.cx_u);}},
    {step:7, x:164, y:122, color:P.accent, f:function(m){return &quot;+&quot; + fmt(m.cx_v);}},
    {step:8, x:164, y:330, color:P.blue,   f:function(m){return &quot;+&quot; + fmt(m.cy_u);}}
  ];

  var BACK_ACTIVE = {5:[&quot;e5&quot;], 6:[&quot;e3&quot;,&quot;e6&quot;], 7:[&quot;e1&quot;,&quot;e4&quot;], 8:[&quot;e2&quot;]};
  var FWD_ACTIVE  = {1:[&quot;e1&quot;,&quot;e2&quot;], 2:[&quot;e3&quot;,&quot;e4&quot;], 3:[&quot;e5&quot;,&quot;e6&quot;]};
  var NODE_ACTIVE = {1:&quot;u&quot;, 2:&quot;v&quot;, 3:&quot;L&quot;, 4:&quot;L&quot;, 5:&quot;v&quot;, 6:&quot;u&quot;, 7:&quot;x&quot;, 8:&quot;y&quot;};

  function nodeVal(id, m, k){
    if(id === &quot;x&quot;) return fmt(m.x);
    if(id === &quot;y&quot;) return fmt(m.y);
    if(id === &quot;u&quot;) return k >= 1 ? fmt(m.u) : null;
    if(id === &quot;v&quot;) return k >= 2 ? fmt(m.v) : null;
    return k >= 3 ? fmt(m.L) : null;
  }
  function nodeGrad(id, m, k){
    if(id === &quot;L&quot;) return k >= 4 ? {t:&quot;dL/dL = 1&quot;, on:true} : {t:&quot;dL/dL 待求&quot;, on:false};
    if(id === &quot;v&quot;) return k >= 5 ? {t:&quot;dL/dv = &quot; + fmt(m.gv), on:true} : {t:&quot;dL/dv 待求&quot;, on:false};
    if(id === &quot;u&quot;) return k >= 6 ? {t:&quot;dL/du = &quot; + fmt(m.gu), on:true} : {t:&quot;dL/du 待求&quot;, on:false};
    if(id === &quot;x&quot;) return k >= 7 ? {t:&quot;dL/dx = &quot; + fmt(m.gx), on:true} : {t:&quot;dL/dx 待求&quot;, on:false};
    return k >= 8 ? {t:&quot;dL/dy = &quot; + fmt(m.gy), on:true} : {t:&quot;dL/dy 待求&quot;, on:false};
  }

  function drawGraph(m, k){
    var backward = k >= 4;
    var s = &quot;&quot;;
    var i, e, arr, act, done, color, width, from, to, ang, bx, by, nx, ny, lo;
    for(i = 0; i &lt; EDGE.length; i++){
      e = EDGE[i];
      done = backward ? (k >= e.bwd) : (k >= e.fwd);
      act = (BACK_ACTIVE[k] || []).indexOf(e.id) >= 0 || (FWD_ACTIVE[k] || []).indexOf(e.id) >= 0;
      color = done ? e.color : P.line;
      width = done ? 2.4 : 1.6;
      if(act) width = 3.6;
      from = backward ? e.b : e.a;
      to = backward ? e.a : e.b;
      ang = Math.atan2(to[1] - from[1], to[0] - from[0]);
      bx = to[0] - 11 * Math.cos(ang);
      by = to[1] - 11 * Math.sin(ang);
      nx = -Math.sin(ang);
      ny = Math.cos(ang);
      s += '&lt;line x1=&quot;' + from[0] + '&quot; y1=&quot;' + from[1] + '&quot; x2=&quot;' + bx.toFixed(2) + '&quot; y2=&quot;' + by.toFixed(2) + '&quot; stroke=&quot;' + color + '&quot; stroke-width=&quot;' + width + '&quot; stroke-linecap=&quot;round&quot;/>';
      s += '&lt;polygon points=&quot;' + to[0] + ',' + to[1] + ' ' + (bx + 5.5 * nx).toFixed(2) + ',' + (by + 5.5 * ny).toFixed(2) + ' ' + (bx - 5.5 * nx).toFixed(2) + ',' + (by - 5.5 * ny).toFixed(2) + '&quot; fill=&quot;' + color + '&quot;/>';
      lo = done ? 1 : (backward ? 0.45 : 0.3);
      s += '&lt;text x=&quot;' + e.lx + '&quot; y=&quot;' + e.ly + '&quot; text-anchor=&quot;' + e.anch + '&quot; font-size=&quot;10.5&quot; fill=&quot;' + (done ? e.color : P.muted) + '&quot; opacity=&quot;' + lo + '&quot; paint-order=&quot;stroke&quot; stroke=&quot;#f7f6ef&quot; stroke-width=&quot;3.5&quot; stroke-linejoin=&quot;round&quot;>' + e.f(m) + &quot;&lt;/text>&quot;;
    }
    for(i = 0; i &lt; ARR.length; i++){
      arr = ARR[i];
      if(k &lt; arr.step) continue;
      act = (k === arr.step);
      s += '&lt;text x=&quot;' + arr.x + '&quot; y=&quot;' + arr.y + '&quot; font-size=&quot;' + (act ? 13.5 : 12) + '&quot; font-weight=&quot;' + (act ? 700 : 600) + '&quot; fill=&quot;' + arr.color + '&quot; paint-order=&quot;stroke&quot; stroke=&quot;#f7f6ef&quot; stroke-width=&quot;3.5&quot; stroke-linejoin=&quot;round&quot;>' + arr.f(m) + &quot;&lt;/text>&quot;;
    }
    var ids = [&quot;x&quot;,&quot;y&quot;,&quot;u&quot;,&quot;v&quot;,&quot;L&quot;], n, val, grad;
    for(i = 0; i &lt; ids.length; i++){
      n = NODE[ids[i]];
      val = nodeVal(ids[i], m, k);
      grad = nodeGrad(ids[i], m, k);
      var on = (NODE_ACTIVE[k] === ids[i]);
      var bx0 = n.cx - HW / 2, by0 = n.cy - HH / 2;
      s += '&lt;rect x=&quot;' + bx0 + '&quot; y=&quot;' + by0 + '&quot; width=&quot;' + HW + '&quot; height=&quot;' + HH + '&quot; rx=&quot;13&quot; fill=&quot;' + (on ? P.soft : P.surface) + '&quot; stroke=&quot;' + (on ? P.accent : P.line) + '&quot; stroke-width=&quot;' + (on ? 2.6 : 1.4) + '&quot;/>';
      s += '&lt;text x=&quot;' + n.cx + '&quot; y=&quot;' + (n.cy - 26) + '&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;700&quot; fill=&quot;' + P.ink + '&quot;>' + n.name + &quot;&lt;/text>&quot;;
      s += '&lt;text x=&quot;' + n.cx + '&quot; y=&quot;' + (n.cy - 8) + '&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;' + P.muted + '&quot;>' + n.def + &quot;&lt;/text>&quot;;
      s += '&lt;text x=&quot;' + n.cx + '&quot; y=&quot;' + (n.cy + 16) + '&quot; text-anchor=&quot;middle&quot; font-size=&quot;19&quot; font-weight=&quot;700&quot; fill=&quot;' + (val === null ? P.dim : P.ink) + '&quot;>' + (val === null ? &quot;—&quot; : val) + &quot;&lt;/text>&quot;;
      s += '&lt;text x=&quot;' + n.cx + '&quot; y=&quot;' + (n.cy + 35) + '&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;' + (grad.on ? P.accent : P.dim) + '&quot;>' + grad.t + &quot;&lt;/text>&quot;;
    }
    return s;
  }

  function panelA(m, k){
    var rows = [
      [0, &quot;&lt;b>x = &quot; + fmt(m.x) + &quot;&lt;/b>&quot;, &quot;输入&quot;],
      [0, &quot;&lt;b>y = &quot; + fmt(m.y) + &quot;&lt;/b>&quot;, &quot;输入&quot;],
      [1, &quot;u = x·y = &quot; + w(m.x) + &quot; × &quot; + w(m.y) + &quot; = &lt;b>&quot; + fmt(m.u) + &quot;&lt;/b>&quot;, &quot;u 用了 x 和 y&quot;],
      [2, &quot;v = u + x = &quot; + w(m.u) + &quot; + &quot; + w(m.x) + &quot; = &lt;b>&quot; + fmt(m.v) + &quot;&lt;/b>&quot;, &quot;v 用了 u 和 x&quot;],
      [3, &quot;L = v² + 3u = &quot; + w(m.v) + &quot;² + 3×&quot; + w(m.u) + &quot; = &quot; + fmt(m.v * m.v) + &quot; + &quot; + w(3 * m.u) + &quot; = &lt;b>&quot; + fmt(m.L) + &quot;&lt;/b>&quot;, &quot;L 用了 v 和 u&quot;]
    ];
    var out = &quot;&quot;, i, r, cls;
    for(i = 0; i &lt; rows.length; i++){
      r = rows[i];
      cls = (k &lt; r[0]) ? &quot; row off&quot; : (k === r[0] &amp;&amp; r[0] > 0 ? &quot; row now&quot; : &quot; row&quot;);
      if(i === 0) cls += &quot; first&quot;;
      out += '&lt;div class=&quot;' + cls + '&quot;>&lt;span class=&quot;k&quot;>' + r[1] + '&lt;/span>&lt;span class=&quot;v&quot;>' + r[2] + &quot;&lt;/span>&lt;/div>&quot;;
    }
    return out;
  }

  var FB = [
    {need:5, edge:&quot;v → L&quot;, c:&quot;c-teal&quot;, dot:P.accent,
     local:function(m){return &quot;∂L/∂v = 2v = 2×&quot; + w(m.v) + &quot; = &quot; + fmt(m.dL_dv);},
     contrib:function(m){return &quot;dL/dL × &quot; + fmt(m.dL_dv) + &quot; = 1 × &quot; + fmt(m.dL_dv) + &quot; = &quot; + fmt(m.gv);},
     target:&quot;dL/dv&quot;},
    {need:6, edge:&quot;u → v&quot;, c:&quot;c-teal&quot;, dot:P.accent,
     local:function(){return &quot;∂v/∂u = 1&quot;;},
     contrib:function(m){return &quot;dL/dv × 1 = &quot; + fmt(m.gv) + &quot; × 1 = &quot; + fmt(m.cu_v);},
     target:&quot;dL/du&quot;},
    {need:6, edge:&quot;u → L&quot;, c:&quot;c-gold&quot;, dot:P.gold,
     local:function(){return &quot;∂L/∂u = 3&quot;;},
     contrib:function(m){return &quot;dL/dL × 3 = 1 × 3 = &quot; + fmt(m.cu_L);},
     target:&quot;dL/du&quot;},
    {need:7, edge:&quot;x → u&quot;, c:&quot;c-blue&quot;, dot:P.blue,
     local:function(m){return &quot;∂u/∂x = y = &quot; + fmt(m.du_dx);},
     contrib:function(m){return &quot;dL/du × &quot; + w(m.du_dx) + &quot; = &quot; + fmt(m.gu) + &quot; × &quot; + w(m.du_dx) + &quot; = &quot; + fmt(m.cx_u);},
     target:&quot;dL/dx&quot;},
    {need:7, edge:&quot;x → v&quot;, c:&quot;c-teal&quot;, dot:P.accent,
     local:function(){return &quot;∂v/∂x = 1&quot;;},
     contrib:function(m){return &quot;dL/dv × 1 = &quot; + fmt(m.gv) + &quot; × 1 = &quot; + fmt(m.cx_v);},
     target:&quot;dL/dx&quot;},
    {need:8, edge:&quot;y → u&quot;, c:&quot;c-blue&quot;, dot:P.blue,
     local:function(m){return &quot;∂u/∂y = x = &quot; + fmt(m.du_dy);},
     contrib:function(m){return &quot;dL/du × &quot; + w(m.du_dy) + &quot; = &quot; + fmt(m.gu) + &quot; × &quot; + w(m.du_dy) + &quot; = &quot; + fmt(m.cy_u);},
     target:&quot;dL/dy&quot;}
  ];

  function panelB(m, k){
    var out = &quot;&quot;, i, r, cls;
    for(i = 0; i &lt; FB.length; i++){
      r = FB[i];
      cls = (k &lt; r.need) ? &quot; row off&quot; : (k === r.need ? &quot; row now&quot; : &quot; row&quot;);
      if(i === 0) cls += &quot; first&quot;;
      out += '&lt;div class=&quot;' + cls + '&quot;>&lt;span class=&quot;k&quot;>&lt;span class=&quot;dot&quot; style=&quot;background:' + r.dot + '&quot;>&lt;/span>' + r.edge + '　' + r.local(m) + '&lt;/span>&lt;span class=&quot;v&quot;>回传 &lt;span class=&quot;' + r.c + '&quot;>' + r.contrib(m) + &quot;&lt;/span> → 记入 &quot; + r.target + &quot;&lt;/span>&lt;/div>&quot;;
    }
    return out;
  }

  function panelC(m, k){
    var rows = [
      {need:4, key:&quot;dL/dL&quot;, val:&quot;1&quot;, note:&quot;种子：L 对自身&quot;},
      {need:5, key:&quot;dL/dv&quot;, val:&quot;1 × &quot; + fmt(m.dL_dv) + &quot; = &lt;b>&quot; + fmt(m.gv) + &quot;&lt;/b>&quot;, note:&quot;v 只有 1 条下游边（v→L）&quot;},
      {need:6, key:&quot;dL/du&quot;, val:'&lt;span class=&quot;c-teal&quot;>' + fmt(m.cu_v) + '&lt;/span> + &lt;span class=&quot;c-gold&quot;>' + fmt(m.cu_L) + &quot;&lt;/span> = &lt;b>&quot; + fmt(m.gu) + &quot;&lt;/b>&quot;, note:&quot;u 有 2 条下游边（u→v、u→L）&quot;},
      {need:7, key:&quot;dL/dx&quot;, val:'&lt;span class=&quot;c-blue&quot;>' + fmt(m.cx_u) + '&lt;/span> + &lt;span class=&quot;c-teal&quot;>' + fmt(m.cx_v) + &quot;&lt;/span> = &lt;b>&quot; + fmt(m.gx) + &quot;&lt;/b>&quot;, note:&quot;x 有 2 条下游边（x→u、x→v）&quot;},
      {need:8, key:&quot;dL/dy&quot;, val:fmt(m.gu) + &quot; × &quot; + w(m.du_dy) + &quot; = &lt;b>&quot; + fmt(m.gy) + &quot;&lt;/b>&quot;, note:&quot;y 只有 1 条下游边（y→u）&quot;}
    ];
    var out = &quot;&quot;, i, r, cls;
    for(i = 0; i &lt; rows.length; i++){
      r = rows[i];
      cls = (k &lt; r.need) ? &quot; row off&quot; : (k === r.need ? &quot; row now&quot; : &quot; row&quot;);
      if(i === 0) cls += &quot; first&quot;;
      out += '&lt;div class=&quot;' + cls + '&quot;>&lt;span class=&quot;k&quot;>' + r.key + &quot; = &quot; + r.val + '&lt;/span>&lt;span class=&quot;v&quot;>' + r.note + &quot;&lt;/span>&lt;/div>&quot;;
    }
    return out;
  }

  function stepText(m, k){
    var t;
    if(k === 0){
      t = &quot;只有输入：x = &quot; + fmt(m.x) + &quot;，y = &quot; + fmt(m.y) + &quot;。u、v、L 还没有算出来，dL/d 也一个都没求。&quot;;
    } else if(k === 1){
      t = &quot;前向第 1 步：u = x·y = &quot; + w(m.x) + &quot; × &quot; + w(m.y) + &quot; = &quot; + fmt(m.u) + &quot;。x 和 y 都进了这个乘法，所以 u 会有两个上游。&quot;;
    } else if(k === 2){
      t = &quot;前向第 2 步：v = u + x = &quot; + w(m.u) + &quot; + &quot; + w(m.x) + &quot; = &quot; + fmt(m.v) + &quot;。这里用的 u 就是上一步那个数。&quot;;
    } else if(k === 3){
      t = &quot;前向第 3 步：L = v² + 3u = &quot; + w(m.v) + &quot;² + 3×&quot; + w(m.u) + &quot; = &quot; + fmt(m.L) + &quot;。3u 这一项又取了同一个 u = &quot; + fmt(m.u) + &quot;，所以 u 有两个下游。&quot;;
    } else if(k === 4){
      t = &quot;反向起点：dL/dL = 1。回传从这里出发，先看 L 的两条下游边。&quot;;
    } else if(k === 5){
      t = &quot;回传 L→v：局部导数 ∂L/∂v = 2v = &quot; + fmt(m.dL_dv) + &quot;。v 只有一条下游边，所以 dL/dv = 1 × &quot; + fmt(m.dL_dv) + &quot; = &quot; + fmt(m.gv) + &quot;，v 到此完成。&quot;;
    } else if(k === 6){
      t = &quot;u 汇合：经 v 回来 &quot; + fmt(m.gv) + &quot; × 1 = &quot; + fmt(m.cu_v) + &quot;；3u 项直接给 1 × 3 = &quot; + fmt(m.cu_L) + &quot;。两份相加，dL/du = &quot; + fmt(m.gu) + &quot;。&quot;;
      if(m.cu_v === 0) t += &quot; 经 v 的那一份现在是 0，因为 ∂L/∂v = 2v = 0；这条边还在，只是当前输入下它不贡献。&quot;;
    } else if(k === 7){
      t = &quot;x 汇合：经 u 回来 &quot; + fmt(m.gu) + &quot; × &quot; + w(m.du_dx) + &quot; = &quot; + fmt(m.cx_u) + &quot;；经 v 直接回来 &quot; + fmt(m.gv) + &quot; × 1 = &quot; + fmt(m.cx_v) + &quot;。两份相加，dL/dx = &quot; + fmt(m.gx) + &quot;。&quot;;
      if(m.cx_v === 0) t += &quot; 经 v 的那一份现在是 0，因为 dL/dv = &quot; + fmt(m.gv) + &quot;。&quot;;
      if(m.du_dx === 0) t += &quot; 经 u 的那一份也是 0，因为 ∂u/∂x = y = 0。&quot;;
    } else {
      t = &quot;y 收到一份：dL/du × ∂u/∂y = &quot; + fmt(m.gu) + &quot; × &quot; + w(m.du_dy) + &quot; = &quot; + fmt(m.gy) + &quot;，即 dL/dy = &quot; + fmt(m.gy) + &quot;。y 只有一条下游边，所以只有这一份。&quot;;
      if(m.du_dy === 0) t += &quot; 这一份等于 0，因为 ∂u/∂y = x = 0。&quot;;
    }
    return t;
  }

  function renderLeak(m){
    var t1 = m.cu_L, t2 = m.cu_v;
    var dx1 = t1 * m.du_dx + m.cx_v, dy1 = t1 * m.du_dy;
    var dx2 = t2 * m.du_dx + m.cx_v, dy2 = t2 * m.du_dy;
    $(&quot;leakOk&quot;).innerHTML =
      '&lt;p>dL/du = &lt;b>' + fmt(m.gu) + '&lt;/b>　&lt;span class=&quot;sub&quot;>两份相加&lt;/span>&lt;/p>' +
      '&lt;p>dL/dx = &lt;b>' + fmt(m.gx) + '&lt;/b>&lt;/p>' +
      '&lt;p>dL/dy = &lt;b>' + fmt(m.gy) + '&lt;/b>&lt;/p>';
    $(&quot;leakA&quot;).innerHTML =
      '&lt;p>dL/du：' + fmt(m.gu) + ' → &lt;b>' + fmt(t2) + '&lt;/b>　&lt;span class=&quot;sub&quot;>只剩经 v 的一份&lt;/span>&lt;/p>' +
      '&lt;p>dL/dx：' + fmt(m.gx) + ' → &lt;b>' + fmt(dx2) + '&lt;/b>　&lt;span class=&quot;sub&quot;>差 ' + fmt(t1 * m.du_dx) + ' = 3 × y&lt;/span>&lt;/p>' +
      '&lt;p>dL/dy：' + fmt(m.gy) + ' → &lt;b>' + fmt(dy2) + '&lt;/b>　&lt;span class=&quot;sub&quot;>差 ' + fmt(t1 * m.du_dy) + ' = 3 × x&lt;/span>&lt;/p>';
    $(&quot;leakB&quot;).innerHTML =
      '&lt;p>dL/du：' + fmt(m.gu) + ' → &lt;b>' + fmt(t1) + '&lt;/b>　&lt;span class=&quot;sub&quot;>只剩 3u 项的一份&lt;/span>&lt;/p>' +
      '&lt;p>dL/dx：' + fmt(m.gx) + ' → &lt;b>' + fmt(dx1) + '&lt;/b>　&lt;span class=&quot;sub&quot;>差 ' + fmt(t2 * m.du_dx) + ' = ' + fmt(t2) + ' × y&lt;/span>&lt;/p>' +
      '&lt;p>dL/dy：' + fmt(m.gy) + ' → &lt;b>' + fmt(dy1) + '&lt;/b>　&lt;span class=&quot;sub&quot;>差 ' + fmt(t2 * m.du_dy) + ' = ' + fmt(t2) + ' × x&lt;/span>&lt;/p>';
    $(&quot;leakAh&quot;).textContent = &quot;漏掉 L→u 的 &quot; + fmt(m.cu_L);
    $(&quot;leakBh&quot;).textContent = &quot;漏掉 v→u 的 &quot; + fmt(m.cu_v);
    $(&quot;leak-intro&quot;).textContent = &quot;下面用当前显示的 x = &quot; + fmt(m.x) + &quot;、y = &quot; + fmt(m.y) + &quot; 计算。把 u 的两份贡献故意少算一份，看错误怎样传到输入。&quot;;
  }

  function renderCheck(m){
    var x = m.x, y = m.y;
    var ax = 2 * x * y * y, bx = 4 * x * y, cx = 2 * x, dx = 3 * y;
    var sx = ax + bx + cx + dx;
    var ay = 2 * x * x * y, by = 2 * x * x, cy = 3 * x;
    var sy = ay + by + cy;
    var zero = function(v){ return Math.abs(v) &lt; 1e-9 ? 0 : v; };
    var e1 = zero(sx - m.gx), e2 = zero(sy - m.gy);
    $(&quot;chkGraph&quot;).innerHTML =
      '&lt;p>dL/dx = &lt;b>' + fmt(m.gx) + '&lt;/b>&lt;/p>' +
      '&lt;p>dL/dy = &lt;b>' + fmt(m.gy) + '&lt;/b>&lt;/p>' +
      '&lt;p class=&quot;sub&quot;>由 19×3 与 16×1 等贡献相加得到&lt;/p>';
    $(&quot;chkExpand&quot;).innerHTML =
      '&lt;p>∂L/∂x = 2xy² + 4xy + 2x + 3y&lt;br>= ' + w(ax) + &quot; + &quot; + w(bx) + &quot; + &quot; + w(cx) + &quot; + &quot; + w(dx) + ' = &lt;b>' + fmt(sx) + '&lt;/b>&lt;/p>' +
      '&lt;p>∂L/∂y = 2x²y + 2x² + 3x&lt;br>= ' + w(ay) + &quot; + &quot; + w(by) + &quot; + &quot; + w(cy) + ' = &lt;b>' + fmt(sy) + '&lt;/b>&lt;/p>';
    $(&quot;chkDiff&quot;).innerHTML =
      '&lt;p>dL/dx：' + fmt(m.gx) + ' − ' + fmt(sx) + ' = &lt;b>' + fmt(e1) + '&lt;/b>&lt;/p>' +
      '&lt;p>dL/dy：' + fmt(m.gy) + ' − ' + fmt(sy) + ' = &lt;b>' + fmt(e2) + '&lt;/b>&lt;/p>' +
      '&lt;p class=&quot;sub&quot;>' + (e1 === 0 &amp;&amp; e2 === 0 ? &quot;两边一致。&quot; : &quot;两边不一致，请检查输入。&quot;) + '&lt;/p>';
    $(&quot;check-intro&quot;).textContent = &quot;代入当前显示的 x = &quot; + fmt(m.x) + &quot;、y = &quot; + fmt(m.y) + &quot;，先算展开式，再和图中的累计结果对照。&quot;;
  }

  function sceneLabel(m, k){
    return &quot;计算依赖图。x 与 y 生成 u，u 与 x 生成 v，v 与 u 生成 L。当前 x 等于 &quot; + fmt(m.x) +
      &quot;，y 等于 &quot; + fmt(m.y) + &quot;，第 &quot; + (k + 1) + &quot; 步：&quot; + STEPS[k] +
      &quot;。前向值 u 等于 &quot; + fmt(m.u) + &quot;，v 等于 &quot; + fmt(m.v) + &quot;，L 等于 &quot; + fmt(m.L) + &quot;。&quot;;
  }

  function render(){
    var m = model(state), k = state.step;
    $(&quot;scene&quot;).innerHTML = drawGraph(m, k);
    $(&quot;scene&quot;).setAttribute(&quot;aria-label&quot;, sceneLabel(m, k));
    $(&quot;pA&quot;).innerHTML = panelA(m, k);
    $(&quot;pB&quot;).innerHTML = panelB(m, k);
    $(&quot;pC&quot;).innerHTML = panelC(m, k);
    $(&quot;state-line&quot;).innerHTML = &quot;当前 x = &lt;b>&quot; + fmt(m.x) + &quot;&lt;/b>　y = &lt;b>&quot; + fmt(m.y) + &quot;&lt;/b>　第 &lt;b>&quot; + (k + 1) + &quot;/9&lt;/b> 步：&quot; + STEPS[k];
    $(&quot;stepline&quot;).textContent = &quot;第 &quot; + (k + 1) + &quot; 步（共 9 步）：&quot; + STEPS[k];
    $(&quot;stepwhy&quot;).textContent = stepText(m, k);
    $(&quot;dir-note&quot;).textContent = k >= 4 ? &quot;当前在反向阶段，箭头翻转指向回传方向。&quot; : &quot;当前在前向阶段，箭头顺着依赖方向。&quot;;
    $(&quot;step&quot;).value = String(k);
    $(&quot;px&quot;).value = String(m.x);
    $(&quot;py&quot;).value = String(m.y);
    $(&quot;pxval&quot;).textContent = fmt(m.x);
    $(&quot;pyval&quot;).textContent = fmt(m.y);
    $(&quot;prev&quot;).disabled = (k === 0);
    $(&quot;next&quot;).disabled = (k === 8);
    renderLeak(m);
    renderCheck(m);
  }

  function commit(){ if(window.presentation &amp;&amp; window.presentation.commitState) window.presentation.commitState(); }

  function setStep(v){
    state.step = Math.max(0, Math.min(8, Math.round(v)));
    render();
  }

  var PRESETS = {
    &quot;default&quot;: {x:2, y:3, step:3},
    &quot;zero&quot;: {x:2, y:-1, step:6},
    &quot;zerolocal&quot;: {x:0, y:3, step:8},
    &quot;neg&quot;: {x:-2, y:3, step:8}
  };

  $(&quot;prev&quot;).onclick = function(){ setStep(state.step - 1); };
  $(&quot;next&quot;).onclick = function(){ setStep(state.step + 1); };
  $(&quot;reset&quot;).onclick = function(){ state.x = 2; state.y = 3; setStep(3); commit(); };
  $(&quot;step&quot;).oninput = function(e){ setStep(Number(e.target.value)); };
  $(&quot;step&quot;).onchange = function(){ commit(); };
  $(&quot;px&quot;).oninput = function(e){
    state.x = clampNum(e.target.value, -3, 3);
    render();
  };
  $(&quot;px&quot;).onchange = function(){ commit(); };
  $(&quot;py&quot;).oninput = function(e){
    state.y = clampNum(e.target.value, -3, 3);
    render();
  };
  $(&quot;py&quot;).onchange = function(){ commit(); };

  var presets = document.querySelectorAll(&quot;[data-preset]&quot;);
  for(var i = 0; i &lt; presets.length; i++){
    presets[i].onclick = function(ev){
      var key = ev.currentTarget.getAttribute(&quot;data-preset&quot;);
      var p = PRESETS[key];
      if(!p) return;
      state.x = p.x;
      state.y = p.y;
      state.step = p.step;
      render();
      commit();
    };
  }

  if(window.presentation &amp;&amp; window.presentation.registerStateReader){
    window.presentation.registerStateReader(function(){
      var m = model(state);
      return {
        values: {x: state.x, y: state.y, step: state.step},
        visible_step: &quot;第 &quot; + (state.step + 1) + &quot;/9 步：&quot; + STEPS[state.step],
        observation: {
          summary: &quot;x = &quot; + fmt(m.x) + &quot;，y = &quot; + fmt(m.y) + &quot;；第 &quot; + (state.step + 1) + &quot; 步（&quot; + STEPS[state.step] +
                   &quot;）；u = &quot; + fmt(m.u) + &quot;，v = &quot; + fmt(m.v) + &quot;，L = &quot; + fmt(m.L) +
                   &quot;；dL/du = &quot; + fmt(m.gu) + &quot;，dL/dx = &quot; + fmt(m.gx) + &quot;，dL/dy = &quot; + fmt(m.gy) + &quot;。&quot;,
          state: {
            inputs: {x: m.x, y: m.y},
            step_index: state.step,
            step_name: STEPS[state.step],
            forward: {u: m.u, v: m.v, L: m.L},
            local_derivatives: {du_dx: m.du_dx, du_dy: m.du_dy, dv_du: m.dv_du, dv_dx: m.dv_dx, dL_dv: m.dL_dv, dL_du: m.dL_du},
            accumulated: {dL_dL: 1, dL_dv: m.gv, dL_du: m.gu, dL_dx: m.gx, dL_dy: m.gy},
            phase: state.step >= 4 ? &quot;backward&quot; : &quot;forward&quot;
          }
        }
      };
    });
  }

  if(window.presentation &amp;&amp; window.presentation.registerStateRestorer){
    window.presentation.registerStateRestorer(function(saved){
      var p = (saved &amp;&amp; saved.values &amp;&amp; (saved.values.page || saved.values)) || null;
      if(p){
        if(p.x !== undefined) state.x = clampNum(p.x, -3, 3);
        if(p.y !== undefined) state.y = clampNum(p.y, -3, 3);
        if(p.step !== undefined) state.step = Math.max(0, Math.min(8, Math.round(Number(p.step)) || 0));
      }
      render();
    });
  }

  render();
})();
&lt;/script>

&lt;/body>&lt;/html>"></iframe></body></html>
