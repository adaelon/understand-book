&lt;body>
&lt;main>
&lt;header>
  &lt;p class=&quot;eyebrow&quot;>带惩罚的最小二乘 · 完整推导&lt;/p>
  &lt;h1>带惩罚的直线拟合：把最优解从头推出来&lt;/h1>
  &lt;p class=&quot;lead&quot;>这一页只做一件事：把 &lt;span style=&quot;white-space:nowrap&quot;>J(a,b)=Σ(yᵢ−a·xᵢ−b)²+λa²&lt;/span> 的最优 a、b 从头推出来，并说明它为什么是全局最小、什么时候根本不唯一。全程只用你学过的配方与逐参数求导。&lt;/p>
  &lt;p class=&quot;tag&quot;>本页所有数字都来自同一组五个点；第 5 节的交互只改 λ 与数据集，从不改 y。&lt;/p>
&lt;/header>

&lt;section>
  &lt;p class=&quot;step&quot;>第 0 步&lt;/p>
  &lt;h2>先把要算的东西钉住&lt;/h2>
  &lt;p>固定的五个观测点（后面每一步、每张图、每个读数都用它）：&lt;/p>
  &lt;p class=&quot;fx&quot;>x = (0, 1, 2, 3, 4)，y = (−1, 0, 2, 2, 5)，n = 5&lt;br>模型：ŷ = a·x + b&lt;br>目标：J(a,b) = Σ&lt;sub>i=1&lt;/sub>&lt;sup>5&lt;/sup> ( y&lt;sub>i&lt;/sub> − a·x&lt;sub>i&lt;/sub> − b )&lt;sup>2&lt;/sup> + λa&lt;sup>2&lt;/sup>，λ ≥ 0&lt;/p>
  &lt;p>先把三个记号分开，后面会一直用到：&lt;/p>
  &lt;ul>
    &lt;li>&lt;b>SSE&lt;/b> = Σ(y&lt;sub>i&lt;/sub> − ŷ&lt;sub>i&lt;/sub>)²：未加惩罚的误差平方&lt;b>总和&lt;/b>。它没有除以 n，所以不是平均平方误差；它的单位是 y 的单位平方。&lt;/li>
    &lt;li>&lt;b>P&lt;/b> = λa²：惩罚项。它只含&lt;b>斜率&lt;/b>，完全不含 b。&lt;/li>
    &lt;li>&lt;b>J&lt;/b> = SSE + P：真正被最小化的那个数。&lt;/li>
  &lt;/ul>
  &lt;p>读完这一页，你应该能自己回答四个问题：&lt;/p>
  &lt;ol>
    &lt;li>λ 增大，为什么最优斜率会变小？&lt;/li>
    &lt;li>惩罚只打在 a 上，为什么截距 b 也跟着变？&lt;/li>
    &lt;li>为什么不管 λ 取多少，拟合直线都穿过 (x̄, ȳ) = (2, 1.6)？&lt;/li>
    &lt;li>当五个 x 全等于 2（x 完全没有变化）时，正则化到底解决了什么，又没解决什么？&lt;/li>
  &lt;/ol>
&lt;/section>

&lt;section>
  &lt;p class=&quot;step&quot;>第 1 步&lt;/p>
  &lt;h2>把五个残差平方拆成两股&lt;/h2>
  &lt;p>要最小化的是 5 个残差 r&lt;sub>i&lt;/sub> = y&lt;sub>i&lt;/sub> − a·x&lt;sub>i&lt;/sub> − b 的平方和。关键一步是把每个残差改写成“围绕均值”的样子：&lt;/p>
  &lt;p class=&quot;fx&quot;>r&lt;sub>i&lt;/sub> = ( y&lt;sub>i&lt;/sub> − ȳ ) − a( x&lt;sub>i&lt;/sub> − x̄ ) + ( ȳ − a·x̄ − b )&lt;/p>
  &lt;p>这是恒等式，不是新假设：把括号展开，−ȳ + a·x̄ + ȳ − a·x̄ = 0，剩下的正好是 y&lt;sub>i&lt;/sub> − a·x&lt;sub>i&lt;/sub> − b。记 d = ȳ − a·x̄ − b（这个量对五个点都相同），平方后求和：&lt;/p>
  &lt;p class=&quot;fx&quot;>Σ r&lt;sub>i&lt;/sub>&lt;sup>2&lt;/sup> = Σ[ (y&lt;sub>i&lt;/sub>−ȳ) − a(x&lt;sub>i&lt;/sub>−x̄) ]&lt;sup>2&lt;/sup> + 2d·Σ[ (y&lt;sub>i&lt;/sub>−ȳ) − a(x&lt;sub>i&lt;/sub>−x̄) ] + 5d&lt;sup>2&lt;/sup>&lt;/p>
  &lt;h3>交叉项为什么消失&lt;/h3>
  &lt;p>中间那一项里的求和是&lt;/p>
  &lt;p class=&quot;fx&quot;>Σ[ (y&lt;sub>i&lt;/sub>−ȳ) − a(x&lt;sub>i&lt;/sub>−x̄) ] = Σ(y&lt;sub>i&lt;/sub>−ȳ) − a·Σ(x&lt;sub>i&lt;/sub>−x̄) = (Σy&lt;sub>i&lt;/sub> − nȳ) − a(Σx&lt;sub>i&lt;/sub> − n x̄) = 0 − a·0 = 0&lt;/p>
  &lt;p>原因就是&lt;b>中心化之后各自的求和为零&lt;/b>。它和“残差与谁正交”无关：如果换一个不是均值的参照点，这两个求和就不为零，交叉项会留下来，后面“先定 b”这一步也就不成立了。&lt;/p>
  &lt;p>剩下的第一块再展开，用三个中心化平方和来记：&lt;/p>
  &lt;p class=&quot;fx&quot;>Sxx = Σ(x&lt;sub>i&lt;/sub>−x̄)&lt;sup>2&lt;/sup>，Sxy = Σ(x&lt;sub>i&lt;/sub>−x̄)(y&lt;sub>i&lt;/sub>−ȳ)，Syy = Σ(y&lt;sub>i&lt;/sub>−ȳ)&lt;sup>2&lt;/sup>&lt;br>Σ r&lt;sub>i&lt;/sub>&lt;sup>2&lt;/sup> = &lt;b>5(ȳ − a·x̄ − b)&lt;sup>2&lt;/sup>&lt;/b> + &lt;b>( Syy − 2a·Sxy + a&lt;sup>2&lt;/sup>·Sxx )&lt;/b>&lt;/p>
  &lt;p>第一块只数“整条直线相对均值点的整体偏移”，第二块只数“斜率 a 造成的倾斜代价”，两块之间没有交叉。&lt;/p>

  &lt;h3>这组数据的具体数字&lt;/h3>
  &lt;p>x̄ = (0+1+2+3+4)/5 = 2，ȳ = (−1+0+2+2+5)/5 = 8/5 = 1.6。&lt;/p>
  &lt;table>
    &lt;thead>&lt;tr>&lt;th>i&lt;/th>&lt;th>x&lt;sub>i&lt;/sub>&lt;/th>&lt;th>y&lt;sub>i&lt;/sub>&lt;/th>&lt;th>x&lt;sub>i&lt;/sub>−x̄&lt;/th>&lt;th>y&lt;sub>i&lt;/sub>−ȳ&lt;/th>&lt;th>(x&lt;sub>i&lt;/sub>−x̄)²&lt;/th>&lt;th>(x&lt;sub>i&lt;/sub>−x̄)(y&lt;sub>i&lt;/sub>−ȳ)&lt;/th>&lt;th>(y&lt;sub>i&lt;/sub>−ȳ)²&lt;/th>&lt;/tr>&lt;/thead>
    &lt;tbody>
      &lt;tr>&lt;td>1&lt;/td>&lt;td>0&lt;/td>&lt;td>−1&lt;/td>&lt;td>−2&lt;/td>&lt;td>−2.6&lt;/td>&lt;td>4&lt;/td>&lt;td>5.2&lt;/td>&lt;td>6.76&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>2&lt;/td>&lt;td>1&lt;/td>&lt;td>0&lt;/td>&lt;td>−1&lt;/td>&lt;td>−1.6&lt;/td>&lt;td>1&lt;/td>&lt;td>1.6&lt;/td>&lt;td>2.56&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>3&lt;/td>&lt;td>2&lt;/td>&lt;td>2&lt;/td>&lt;td>0&lt;/td>&lt;td>0.4&lt;/td>&lt;td>0&lt;/td>&lt;td>0&lt;/td>&lt;td>0.16&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>4&lt;/td>&lt;td>3&lt;/td>&lt;td>2&lt;/td>&lt;td>1&lt;/td>&lt;td>0.4&lt;/td>&lt;td>1&lt;/td>&lt;td>0.4&lt;/td>&lt;td>0.16&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>5&lt;/td>&lt;td>4&lt;/td>&lt;td>5&lt;/td>&lt;td>2&lt;/td>&lt;td>3.4&lt;/td>&lt;td>4&lt;/td>&lt;td>6.8&lt;/td>&lt;td>11.56&lt;/td>&lt;/tr>
      &lt;tr class=&quot;sum&quot;>&lt;td>和&lt;/td>&lt;td>10&lt;/td>&lt;td>8&lt;/td>&lt;td>0&lt;/td>&lt;td>0&lt;/td>&lt;td>10&lt;/td>&lt;td>14&lt;/td>&lt;td>21.2&lt;/td>&lt;/tr>
    &lt;/tbody>
  &lt;/table>
  &lt;p class=&quot;fx key&quot;>x̄ = 2，ȳ = 1.6，Sxx = 10，Sxy = 14，Syy = 21.2&lt;/p>
  &lt;p>两条交叉核对的捷径，方便你自己复现而不必逐点加：&lt;/p>
  &lt;ul>
    &lt;li>Σx&lt;sub>i&lt;/sub>&lt;sup>2&lt;/sup> = 0+1+4+9+16 = 30，Sxx = 30 − 5·2² = &lt;b>10&lt;/b>&lt;/li>
    &lt;li>Σx&lt;sub>i&lt;/sub>y&lt;sub>i&lt;/sub> = 0+0+4+6+20 = 30，Sxy = 30 − 5·2·1.6 = 30 − 16 = &lt;b>14&lt;/b>&lt;/li>
    &lt;li>Σy&lt;sub>i&lt;/sub>&lt;sup>2&lt;/sup> = 1+0+4+4+25 = 34，Syy = 34 − 5·1.6² = 34 − 12.8 = &lt;b>21.2&lt;/b>&lt;/li>
  &lt;/ul>
&lt;/section>

&lt;section>
  &lt;p class=&quot;step&quot;>第 2 步&lt;/p>
  &lt;h2>先处理没有被惩罚的 b&lt;/h2>
  &lt;p>在刚才的分解里，b 只出现在第一块 5(ȳ − a·x̄ − b)² 中。这一块是平方乘正数，恒 ≥ 0，取到 0 当且仅当&lt;/p>
  &lt;p class=&quot;fx key&quot;>b = ȳ − a·x̄ &amp;nbsp;&amp;nbsp;（对固定的 a）&lt;/p>
  &lt;p>第二块 Syy − 2a·Sxy + a²·Sxx 里没有 b，惩罚项 λa² 里也没有 b。所以对这个 a，使 J 最小的 b 就是上面这一个，而且这个结论&lt;b>与 λ 完全无关&lt;/b>。&lt;/p>
  &lt;p>把它代回去看预测值：&lt;/p>
  &lt;p class=&quot;fx&quot;>ŷ(x̄) = a·x̄ + b = a·x̄ + (ȳ − a·x̄) = ȳ&lt;/p>
  &lt;p>也就是说：拟合直线在 x = x̄ 处的取值恒等于 ȳ，既不受 a 影响，也不受 λ 影响。用这组数据讲：&lt;b>直线永远穿过 (2, 1.6)&lt;/b>。&lt;/p>
  &lt;h3>这条也就是“截距为什么会跟着变”的答案&lt;/h3>
  &lt;p>因为 b = ȳ − a·x̄ = 1.6 − 2a。a 每减少 1，b 必须增加 2，直线才能继续压在那个均值点上。b 不是被惩罚项直接推着走的（λa² 里根本没有 b），它是被“必须过均值点”这条约束推着走的。第 3 步会看到：λ 增大使 a 变小，于是 b 变大。&lt;/p>
&lt;/section>

&lt;section>
  &lt;p class=&quot;step&quot;>第 3 步&lt;/p>
  &lt;h2>只剩 a：剖面目标与配方&lt;/h2>
  &lt;p>把 b = 1.6 − 2a 代回，第一块变成 0，J 就只剩一个变量。把这个“b 已取最优”的目标记作 φ(a)：&lt;/p>
  &lt;p class=&quot;fx&quot;>φ(a) = J( a, b(a) ) = Syy − 2a·Sxy + a²·Sxx + λa²&lt;br>= 21.2 − 28a + (10 + λ)a²&lt;/p>
  &lt;p>配方（就是从 a² 的系数提出来的那一步）：&lt;/p>
  &lt;p class=&quot;fx&quot;>φ(a) = (10+λ)[ a&lt;sup>2&lt;/sup> − (28/(10+λ))·a ] + 21.2&lt;br>= (10+λ)[ a − 14/(10+λ) ]&lt;sup>2&lt;/sup> + 21.2 − 196/(10+λ)&lt;/p>
  &lt;p>核对一下系数：括号里 −2a·14/(10+λ) 乘上 (10+λ) 正好是 −28a；常数项 14²/(10+λ) = 196/(10+λ) 被减掉，留在外面。&lt;/p>
  &lt;p>于是得到闭式解：&lt;/p>
  &lt;p class=&quot;fx key&quot;>a* = 14/(10+λ) = Sxy/(Sxx+λ)&lt;br>b* = 1.6 − 2a* = 1.6 − 28/(10+λ)&lt;br>J&lt;sub>min&lt;/sub> = 21.2 − 196/(10+λ)&lt;/p>

  &lt;h3>用四个 λ 核对同一组公式&lt;/h3>
  &lt;table>
    &lt;thead>&lt;tr>&lt;th>λ&lt;/th>&lt;th>a*&lt;/th>&lt;th>b*&lt;/th>&lt;th>SSE = Σ(y−ŷ)²&lt;/th>&lt;th>P = λa²&lt;/th>&lt;th>J = SSE + P&lt;/th>&lt;/tr>&lt;/thead>
    &lt;tbody>
      &lt;tr>&lt;td>0&lt;/td>&lt;td>1.4&lt;/td>&lt;td>−1.2&lt;/td>&lt;td>1.6&lt;/td>&lt;td>0&lt;/td>&lt;td>1.6&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>2&lt;/td>&lt;td>1.1667&lt;/td>&lt;td>−0.7333&lt;/td>&lt;td>2.1444&lt;/td>&lt;td>2.7222&lt;/td>&lt;td>4.8667&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>4&lt;/td>&lt;td>1&lt;/td>&lt;td>−0.4&lt;/td>&lt;td>3.2&lt;/td>&lt;td>4&lt;/td>&lt;td>7.2&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>10&lt;/td>&lt;td>0.7&lt;/td>&lt;td>0.2&lt;/td>&lt;td>6.5&lt;/td>&lt;td>4.9&lt;/td>&lt;td>11.4&lt;/td>&lt;/tr>
    &lt;/tbody>
  &lt;/table>
  &lt;p>读法：λ 从 0 加到 10，a 从 1.4 降到 0.7，b 从 −1.2 升到 0.2；未加惩罚的 SSE 从 1.6 &lt;b>涨&lt;/b>到 6.5（拟合变差了），惩罚项 P 从 0 涨到 4.9，而被最小化的 J 从 1.6 涨到 11.4。λ → ∞ 时 a → 0、b → 1.6，直线退化成水平线 y = ȳ。&lt;/p>
  &lt;p>注意 SSE 与 P 不是同一件事：SSE 只数竖直残差，P 只数斜率大小，J 才是两者相加后被最小化的那个数。所以“J 变大”不等于“拟合误差变大”——中间还隔着惩罚项。&lt;/p>

  &lt;h3>为什么 λ 增大会让斜率变小&lt;/h3>
  &lt;p>在 φ(a) = (10+λ)(a − a*)² + J&lt;sub>min&lt;/sub> 里，a² 的系数是 10+λ。λ 越大，这条抛物线越“陡”，它的最低点就越靠近 a = 0；而 a = 0 恰好是惩罚项 λa² 最偏好的位置。换个说法：λ 加大等于给“偏离 0 的斜率”加价，最优解就向 0 挪。从 a*(λ) = 14/(10+λ) 直接看也一样：分子固定、分母变大，a* 严格递减。&lt;/p>
&lt;/section>

&lt;section>
  &lt;p class=&quot;step&quot;>第 4 步&lt;/p>
  &lt;h2>这是全局最小，且在什么条件下唯一&lt;/h2>
  &lt;p>“令导数为零”只给你候选点：它不排除别处还有极小，也不排除那是鞍点。要把全局性真正证出来，把第 1 步的分解和第 3 步的配方接成一行，对 a、b 一起配方：&lt;/p>
  &lt;p class=&quot;fx key&quot;>J(a,b) = 5( 1.6 − 2a − b )&lt;sup>2&lt;/sup> + (10+λ)( a − 14/(10+λ) )&lt;sup>2&lt;/sup> + [ 21.2 − 196/(10+λ) ]&lt;/p>
  &lt;p>前两项都是“平方 × 正系数”：5 &amp;gt; 0，10+λ ≥ 10 &amp;gt; 0，所以它们都 ≥ 0。因此&lt;/p>
  &lt;ul>
    &lt;li>对任意 (a,b)，都有 J(a,b) ≥ 21.2 − 196/(10+λ)。这条下界与 (a,b) 无关，这就是“全局”两个字的来源。&lt;/li>
    &lt;li>等号成立当且仅当两个平方同时为 0，即 b = 1.6 − 2a 且 a = 14/(10+λ)。联立得唯一的 (a,b)。&lt;/li>
    &lt;li>所以下界被摸到，且只被摸到一次：全局最小、且唯一取到。&lt;/li>
  &lt;/ul>
  &lt;p>另一个角度看同一件事：J 是若干平方（外加 λa²）的和，对 (a,b) 是凸函数；这里还是严格凸的，而严格凸函数的驻点就是唯一的全局最小点。&lt;/p>
  &lt;h3>唯一性到底需要什么条件&lt;/h3>
  &lt;p>第二个平方的系数是 &lt;b>Sxx + λ&lt;/b>。只有它 &amp;gt; 0，配方才能把 a 单独“卡”在一点上。所以唯一性的条件就是&lt;/p>
  &lt;p class=&quot;fx&quot;>Sxx + λ &amp;gt; 0&lt;/p>
  &lt;p>这组数据 Sxx = 10 &amp;gt; 0，所以连 λ = 0 也唯一（那就是普通最小二乘）。如果 Sxx = 0（x 全相同），条件就退化成 λ &amp;gt; 0——这正是第 6 节要用的地方。&lt;/p>
  &lt;h3>用二阶导核对同一件事&lt;/h3>
  &lt;p>你熟悉的另一条路：∂²J/∂a² = 2(Σx&lt;sub>i&lt;/sub>&lt;sup>2&lt;/sup> + λ) = 2(30+λ)，∂²J/∂b² = 2n = 10，∂²J/∂a∂b = 2Σx&lt;sub>i&lt;/sub> = 20。Hessian 的行列式是 4[5(30+λ) − 100] = 20(10+λ) &amp;gt; 0，两个对角元都为正，故正定、J 严格凸。注意行列式里的 10+λ 就是 Sxx + λ——两条路说的是同一件事，但配方还额外告诉了你最小值等于多少。&lt;/p>
&lt;/section>

&lt;section id=&quot;lab&quot;>
  &lt;p class=&quot;step&quot;>第 5 步&lt;/p>
  &lt;h2>动手：把 λ 拖一遍&lt;/h2>
  &lt;p>下面是固定示例的检验台。上一步已经算出 a*、b* 的公式，这里的每个读数都由同一个函数从 (λ, 数据集) 现算，与前面表格用的是同一组公式；图只负责让你看见残差在哪、直线怎么转、剖面曲线的曲率怎么变，理由仍在上面的配方里。&lt;/p>
  &lt;div class=&quot;panel&quot;>
    &lt;div class=&quot;figwrap&quot;>
      &lt;p class=&quot;fighead&quot;>图 A · 散点、拟合直线与五条残差&lt;/p>
      &lt;svg id=&quot;fit&quot; viewBox=&quot;0 0 640 400&quot; role=&quot;img&quot; aria-label=&quot;五个观测点、当前 λ 下的拟合直线、竖直残差，以及均值点 (2, 1.6)&quot;>&lt;/svg>
      &lt;p class=&quot;figcap&quot; id=&quot;fitnote&quot;>&lt;/p>
    &lt;/div>
    &lt;div class=&quot;figwrap&quot;>
      &lt;p class=&quot;fighead&quot;>图 B · 剖面目标 φ(a) = min&lt;sub>b&lt;/sub> J(a,b)&lt;/p>
      &lt;svg id=&quot;prof&quot; viewBox=&quot;0 0 640 400&quot; role=&quot;img&quot; aria-label=&quot;以 a 为横轴、以已经把 b 取到最优后的 J 为纵轴的曲线，以及最小值水平线与顶点&quot;>&lt;/svg>
      &lt;p class=&quot;figcap&quot; id=&quot;profnote&quot;>&lt;/p>
    &lt;/div>
  &lt;/div>
  &lt;div class=&quot;controls&quot;>
    &lt;div class=&quot;ctl&quot;>
      &lt;label for=&quot;lam&quot;>λ（惩罚强度）&lt;/label>
      &lt;output id=&quot;lam-out&quot; for=&quot;lam&quot;>&lt;/output>
      &lt;input id=&quot;lam&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; value=&quot;2&quot; data-presentation-parameter=&quot;lambda&quot; aria-label=&quot;惩罚强度 λ，0 到 10，步长 0.5&quot;>
    &lt;/div>
    &lt;div class=&quot;ctl&quot;>
      &lt;label for=&quot;ds&quot;>数据集&lt;/label>
      &lt;select id=&quot;ds&quot; data-presentation-parameter=&quot;dataset&quot; aria-label=&quot;选择数据集&quot;>
        &lt;option value=&quot;main&quot;>常规：x = (0,1,2,3,4)，y = (−1,0,2,2,5)&lt;/option>
        &lt;option value=&quot;degenerate&quot;>退化：五个 x 全为 2，y 同上&lt;/option>
      &lt;/select>
    &lt;/div>
  &lt;/div>
  &lt;div id=&quot;readout&quot; data-teaching-region=&quot;result&quot;>
    &lt;div class=&quot;metrics&quot; id=&quot;metrics&quot;>&lt;/div>
    &lt;div class=&quot;track&quot; id=&quot;bar&quot; aria-hidden=&quot;true&quot;>&lt;i id=&quot;seg-sse&quot;>&lt;/i>&lt;i id=&quot;seg-pen&quot;>&lt;/i>&lt;/div>
    &lt;div class=&quot;bar-leg&quot;>
      &lt;span>&lt;i class=&quot;sw&quot; style=&quot;background:#1a7f76&quot;>&lt;/i>SSE：未加惩罚的误差平方和&lt;/span>
      &lt;span>&lt;i class=&quot;sw&quot; style=&quot;background:#b5762a&quot;>&lt;/i>P = λa²：惩罚项&lt;/span>
    &lt;/div>
    &lt;p class=&quot;figcap&quot; id=&quot;bar-ref&quot;>&lt;/p>
    &lt;p id=&quot;reading&quot; aria-live=&quot;polite&quot;>&lt;/p>
  &lt;/div>
  &lt;p class=&quot;figcap&quot;>条形长度按本组数据在 λ∈[0,10] 内最大的 J 归一，所以同一数据集内滑动 λ 时，条形的总长与分段比例都可以横向比较；换数据集会换满格标准，不能拿两组的条长直接比大小。&lt;/p>
&lt;/section>

&lt;section>
  &lt;p class=&quot;step&quot;>第 6 步&lt;/p>
  &lt;h2>换一组数据：五个 x 全等于 2&lt;/h2>
  &lt;p>现在把 x 全部改成 2，y 保持不变：(2,−1), (2,0), (2,2), (2,2), (2,5)。均值没变：x̄ = 2，ȳ = 1.6；Syy = 21.2 也没变。变的是两个中心化交叉核：&lt;/p>
  &lt;p class=&quot;fx&quot;>Sxx = Σ(2−2)&lt;sup>2&lt;/sup> = 0，&amp;nbsp;Sxy = Σ(2−2)(y&lt;sub>i&lt;/sub>−ȳ) = 0&lt;/p>
  &lt;p>这一步改动的实质是：a·x&lt;sub>i&lt;/sub> + b = 2a + b 对每个点都等于同一个数，两个参数被焊成了一个组合&lt;/p>
  &lt;p class=&quot;fx key&quot;>c = 2a + b&lt;/p>
  &lt;p>模型能对数据说的话只剩下这一个数 c。第 1 步的分解在这里照样成立（此时 ȳ − a·x̄ − b = 1.6 − c）：&lt;/p>
  &lt;p class=&quot;fx&quot;>J(a,b) = 5(c − 1.6)&lt;sup>2&lt;/sup> + Syy + λa&lt;sup>2&lt;/sup> = 21.2 + 5(2a + b − 1.6)&lt;sup>2&lt;/sup> + λa&lt;sup>2&lt;/sup>&lt;/p>

  &lt;h3>λ = 0：无穷多条同样好的直线&lt;/h3>
  &lt;p>此时 J = 21.2 + 5(c − 1.6)²，最小当且仅当 c = 1.6，也就是 2a + b = 1.6。满足这条等式的 (a,b) 有无穷多组：&lt;b>a 取任意数，b 取 1.6 − 2a&lt;/b> 即可。每一条这样的直线都过 (2, 1.6)，在每个点上都预测 1.6，SSE 都是 21.2，J 都是 21.2。&lt;/p>
  &lt;p>于是答案必须分两半说：数据能确定 &lt;b>c = 1.6&lt;/b>（以及由此得到的预测值 1.6），确定不了 &lt;b>a 和 b 各自&lt;/b>是多少。问“最优直线是哪一条”，此时没有唯一答案。&lt;/p>
  &lt;p>这也解释了第 3 步的公式为什么在这里“失效”：a* = Sxy/(Sxx+λ) = 0/0，在 λ = 0 处没有定义。公式没有定义的地方，正好就是不唯一的地方——这不是巧合。&lt;/p>

  &lt;h3>λ &amp;gt; 0：唯一，而且是 a = 0&lt;/h3>
  &lt;p>J = 21.2 + 5(2a + b − 1.6)² + λa²。第一项只关心 2a + b 是否等于 1.6；一旦满足它，J 就退化成 21.2 + λa²，而 λ &amp;gt; 0 时这个量只在 a = 0 取最小，于是 b = 1.6。对应直线 y = 1.6，也就是过 (2, 1.6) 的水平线，J = 21.2。用第 3 步的公式也一致：a* = Sxy/(Sxx+λ) = 0/λ = 0。&lt;/p>

  &lt;h3>那么，正则化在“x 没有变化”时解决了什么&lt;/h3>
  &lt;p>它把“无穷多条同样好的直线”缩小成“一条”，靠的是给斜率定价：在所有 SSE 相同的候选里，挑斜率绝对值最小的那条（a = 0）。这解决的是&lt;b>解不唯一 / 参数不可识别&lt;/b>。&lt;/p>
  &lt;p>它没有做到、也不可能做到的事，要一起说清楚：&lt;/p>
  &lt;ul>
    &lt;li>&lt;b>没有改善拟合&lt;/b>：SSE 从 21.2 到 21.2，一点没降，P 也恒为 0（因为 a = 0）。&lt;/li>
    &lt;li>&lt;b>没有提供关于斜率的信息&lt;/b>：a = 0 是惩罚项选的，不是数据选的。λ 换成任何正数，a 仍然是 0。&lt;/li>
    &lt;li>&lt;b>没有让预测变可靠&lt;/b>：在 x = 2 处的预测仍是 1.6；若拿去别的 x 上预测，那条水平线完全来自“斜率为 0”这个人为选择，数据并没有支持。&lt;/li>
  &lt;/ul>
  &lt;p>所以在交互里把 λ 拖到 0 再看退化数据时，读数会写“不唯一”，图上画的是同一族里的几个例子——因为此时给出一个具体的最优 a 就是在编造信息。&lt;/p>
&lt;/section>

&lt;section>
  &lt;p class=&quot;step&quot;>第 7 步&lt;/p>
  &lt;h2>四个问题的答案，与一张自复现清单&lt;/h2>
  &lt;div class=&quot;qa&quot;>
    &lt;div>&lt;b>1. λ 增大，为什么最优斜率变小？&lt;/b>&lt;span>φ(a) 里 a² 的系数是 10+λ，λ 越大抛物线越陡，顶点 a* = 14/(10+λ) 越靠近 0；机理是惩罚项提高了“偏离 0 的斜率”的价格。&lt;/span>&lt;/div>
    &lt;div>&lt;b>2. 惩罚只打 a，为什么 b 也变？&lt;/b>&lt;span>b 不自由：直线必须过 (2, 1.6)，所以 b = 1.6 − 2a。a 每降 1，b 必须升 2。b 的移动来自这条约束，不来自惩罚项。&lt;/span>&lt;/div>
    &lt;div>&lt;b>3. 为什么恒过均值点？&lt;/b>&lt;span>b 不被惩罚，固定 a 时 J 中只有 5(ȳ − a·x̄ − b)² 含 b；它 ≥ 0 且可被 b = ȳ − a·x̄ 取到 0，与 λ 无关。等价说法：有截距时残差和为零。&lt;/span>&lt;/div>
    &lt;div>&lt;b>4. x 全相同时，正则化解决什么？&lt;/b>&lt;span>把 2a + b = 1.6 这一族无穷多解收成 a = 0、b = 1.6 一个解，解决参数不可识别；它不改善 SSE（恒为 21.2），也不提供任何斜率信息。&lt;/span>&lt;/div>
  &lt;/div>
  &lt;h3>自己重做一遍的六步&lt;/h3>
  &lt;ol>
    &lt;li>算 x̄ = 2、ȳ = 1.6，再用 Σx&lt;sub>i&lt;/sub>² − n x̄²、Σx&lt;sub>i&lt;/sub>y&lt;sub>i&lt;/sub> − n x̄ȳ、Σy&lt;sub>i&lt;/sub>² − n ȳ² 交叉核对 Sxx = 10、Sxy = 14、Syy = 21.2。&lt;/li>
    &lt;li>写出 Σr&lt;sub>i&lt;/sub>² = 5(ȳ − a·x̄ − b)² + Syy − 2a·Sxy + a²·Sxx，并说明交叉项消失是因为 Σ(y&lt;sub>i&lt;/sub>−ȳ) = 0、Σ(x&lt;sub>i&lt;/sub>−x̄) = 0。&lt;/li>
    &lt;li>固定 a 求 b*，并验证 ŷ(x̄) = ȳ，说明这一步用到了“b 不被惩罚”。&lt;/li>
    &lt;li>代回、配方得 a* = 14/(10+λ)，对 λ = 0、2、4、10 各算一遍 a*、b*、SSE、P、J，与第 3 步的表格对齐。&lt;/li>
    &lt;li>写出完整配方，指出两个非负项、下界 J&lt;sub>min&lt;/sub> 与唯一的取等点；说出唯一性条件 Sxx + λ &amp;gt; 0。&lt;/li>
    &lt;li>换成 x 全为 2，写出 c = 2a + b，说明 λ = 0 时解集是一整族、λ &amp;gt; 0 时唯一为 a = 0、b = 1.6，并解释 SSE 为什么一直是 21.2。&lt;/li>
  &lt;/ol>
&lt;/section>

&lt;footer>
  &lt;p>&lt;b>适用范围。&lt;/b>数值与结论都针对这一组固定数据（x = 0,1,2,3,4；y = −1,0,2,2,5）和这一个目标函数：误差用平方之和（不除以 n），惩罚只作用于斜率 a 且为二次型，λ ≥ 0。第 6 节的退化数据另起一组固定条件，不与主数据的 λ 变化混成同一次比较。图形呈现的是残差位置、直线转动与剖面曲率，它们帮助你观察，但推导与唯一性的依据在正文的恒等式、配方和非负项里。&lt;/p>
&lt;/footer>
&lt;/main>

&lt;script>
&quot;use strict&quot;;
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var DATA = {
    main: { x: [0,1,2,3,4], y: [-1,0,2,2,5] },
    degenerate: { x: [2,2,2,2,2], y: [-1,0,2,2,5] }
  };
  var C = {
    ink: &quot;#20302e&quot;, muted: &quot;#6d7d78&quot;, accent: &quot;#1a7f76&quot;, accent2: &quot;#b5762a&quot;,
    line: &quot;#cfd9d1&quot;, soft: &quot;#e7ebe4&quot;, pt: &quot;#8d9c96&quot;, grid: &quot;#eaeee7&quot;, axis: &quot;#bcc9c1&quot;
  };

  function stats(key){
    var d = DATA[key] || DATA.main, n = d.x.length, i, sx = 0, sy = 0;
    for (i = 0; i &lt; n; i++){ sx += d.x[i]; sy += d.y[i]; }
    var xb = sx / n, yb = sy / n, sxx = 0, sxy = 0, syy = 0;
    for (i = 0; i &lt; n; i++){
      var dx = d.x[i] - xb, dy = d.y[i] - yb;
      sxx += dx * dx; sxy += dx * dy; syy += dy * dy;
    }
    return { n: n, xb: xb, yb: yb, sxx: sxx, sxy: sxy, syy: syy, x: d.x, y: d.y };
  }
  var STATS = { main: stats(&quot;main&quot;), degenerate: stats(&quot;degenerate&quot;) };

  function model(lam, key){
    var s = STATS[key] || STATS.main;
    var denom = s.sxx + lam;
    var unique = denom > 1e-9;
    var m = {
      key: key, lam: lam, n: s.n, xb: s.xb, yb: s.yb,
      sxx: s.sxx, sxy: s.sxy, syy: s.syy, x: s.x, y: s.y,
      denom: denom, unique: unique, a: null, b: null
    };
    m.phi = function(av){
      return s.syy - 2 * av * s.sxy + av * av * (s.sxx + lam);
    };
    if (unique){
      m.a = s.sxy / denom;
      m.b = s.yb - m.a * s.xb;
      m.sse = s.syy - 2 * m.a * s.sxy + m.a * m.a * s.sxx;
      m.pen = lam * m.a * m.a;
      m.J = m.sse + m.pen;
      m.jmin = s.syy - s.sxy * s.sxy / denom;
    } else {
      m.sse = s.syy;
      m.pen = 0;
      m.J = s.syy;
      m.jmin = s.syy;
    }
    return m;
  }

  function fmt(v, d){
    var n = Number(v);
    if (!isFinite(n)) return &quot;—&quot;;
    var p = (d === undefined) ? 4 : d;
    return Number(n.toFixed(p)).toString();
  }
  function line(x1,y1,x2,y2,c,w,dash){
    return '&lt;line x1=&quot;'+x1.toFixed(1)+'&quot; y1=&quot;'+y1.toFixed(1)+'&quot; x2=&quot;'+x2.toFixed(1)+'&quot; y2=&quot;'+y2.toFixed(1)+'&quot; stroke=&quot;'+c+'&quot; stroke-width=&quot;'+(w||1)+'&quot;'+(dash?' stroke-dasharray=&quot;'+dash+'&quot;':'')+'/>';
  }
  function circ(cx,cy,r,f,extra){
    return '&lt;circle cx=&quot;'+cx.toFixed(1)+'&quot; cy=&quot;'+cy.toFixed(1)+'&quot; r=&quot;'+r+'&quot; fill=&quot;'+f+'&quot;'+(extra||'')+'/>';
  }
  function txt(x,y,s,c,size,anchor){
    return '&lt;text x=&quot;'+x.toFixed(1)+'&quot; y=&quot;'+y.toFixed(1)+'&quot; fill=&quot;'+c+'&quot; font-size=&quot;'+(size||13)+'&quot; text-anchor=&quot;'+(anchor||'start')+'&quot; font-family=&quot;Segoe UI,Microsoft YaHei,sans-serif&quot;>'+s+'&lt;/text>';
  }

  /* ---------- 图 A：散点 + 直线 + 残差 ---------- */
  var AW = 640, AH = 400, AML = 58, AMR = 24, AMT = 24, AMB = 48;
  var XMIN = -0.45, XMAX = 4.45, YMIN = -2.6, YMAX = 6.2;
  var APW = AW - AML - AMR, APH = AH - AMT - AMB;
  function PX(x){ return AML + (x - XMIN) / (XMAX - XMIN) * APW; }
  function PY(y){ return AMT + (YMAX - y) / (YMAX - YMIN) * APH; }

  function drawFit(m){
    var g = &quot;&quot;, t, i;
    for (t = -2; t &lt;= 6; t++){
      g += line(AML, PY(t), AML + APW, PY(t), t === 0 ? C.axis : C.grid, 1);
      g += txt(AML - 9, PY(t) + 4, String(t), C.muted, 12, &quot;end&quot;);
    }
    for (t = 0; t &lt;= 4; t++){
      g += line(PX(t), AMT, PX(t), AMT + APH, C.grid, 1);
      g += txt(PX(t), AMT + APH + 19, String(t), C.muted, 12, &quot;middle&quot;);
    }
    g += txt(AML + APW / 2, AMT + APH + 40, &quot;x&quot;, C.muted, 13, &quot;middle&quot;);
    g += txt(AML - 9, AMT - 8, &quot;y&quot;, C.muted, 13, &quot;end&quot;);
    g += '&lt;defs>&lt;clipPath id=&quot;clipFit&quot;>&lt;rect x=&quot;'+AML+'&quot; y=&quot;'+AMT+'&quot; width=&quot;'+APW+'&quot; height=&quot;'+APH+'&quot;/>&lt;/clipPath>&lt;/defs>';

    var inner = &quot;&quot;;
    if (!m.unique){
      var slopes = [-0.8, 0, 1.3], j;
      for (j = 0; j &lt; slopes.length; j++){
        var s0 = slopes[j];
        inner += line(PX(XMIN), PY(s0 * XMIN + m.yb), PX(XMAX), PY(s0 * XMAX + m.yb), &quot;#a9b6af&quot;, 2.4, &quot;7 6&quot;);
      }
    } else {
      inner += line(PX(XMIN), PY(m.a * XMIN + m.b), PX(XMAX), PY(m.a * XMAX + m.b), C.accent, 3.2);
    }
    for (i = 0; i &lt; m.n; i++){
      var xi = m.x[i], yi = m.y[i];
      var yhat = m.unique ? (m.a * xi + m.b) : m.yb;
      inner += line(PX(xi), PY(yi), PX(xi), PY(yhat), &quot;#5f7d74&quot;, 2.6);
    }
    for (i = 0; i &lt; m.n; i++){
      inner += circ(PX(m.x[i]), PY(m.y[i]), 5.5, C.pt, ' stroke=&quot;white&quot; stroke-width=&quot;1.6&quot;');
    }
    inner += circ(PX(m.xb), PY(m.yb), 7.5, &quot;none&quot;, ' stroke=&quot;'+C.accent2+'&quot; stroke-width=&quot;2.6&quot;');
    g += '&lt;g clip-path=&quot;url(#clipFit)&quot;>' + inner + '&lt;/g>';
    g += txt(PX(m.xb) + 13, PY(m.yb) + 22, &quot;均值点 (2, 1.6)&quot;, C.accent2, 12, &quot;start&quot;);

    if (m.unique){
      g += txt(AML + 4, AMT + 16, &quot;ŷ = &quot; + fmt(m.a,3) + &quot;·x &quot; + (m.b &lt; 0 ? &quot;− &quot; + fmt(Math.abs(m.b),3) : &quot;+ &quot; + fmt(m.b,3)), C.accent, 13, &quot;start&quot;);
    } else {
      g += txt(AML + 4, AMT + 16, &quot;不唯一：过 (2, 1.6) 的每条直线都同样好&quot;, C.accent2, 13, &quot;start&quot;);
    }
    return g;
  }

  /* ---------- 图 B：剖面目标 ---------- */
  var BAMIN = -0.2, BAMAX = 2.2;
  function drawProf(m){
    var W = 640, H = 400, ML = 66, MR = 26, MT = 28, MB = 54;
    var PW = W - ML - MR, PH = H - MT - MB;
    var m0 = model(0, m.key);
    var i, a, v, pts = [], ref = [], mx = 0;
    var K = 90;
    for (i = 0; i &lt;= K; i++){
      a = BAMIN + (BAMAX - BAMIN) * i / K;
      v = m.phi(a);
      pts.push([a, v]);
      if (v > mx) mx = v;
      var v0 = m0.phi(a);
      ref.push([a, v0]);
      if (v0 > mx) mx = v0;
    }
    var yTop = Math.max(5, Math.ceil(mx / 5) * 5);
    function BX(av){ return ML + (av - BAMIN) / (BAMAX - BAMIN) * PW; }
    function BY(vv){ return MT + (1 - vv / yTop) * PH; }

    var g = &quot;&quot;, t;
    for (t = 0; t &lt;= yTop; t += yTop / 5){
      g += line(ML, BY(t), ML + PW, BY(t), t === 0 ? C.axis : C.grid, 1);
      g += txt(ML - 9, BY(t) + 4, fmt(t, 1), C.muted, 12, &quot;end&quot;);
    }
    for (t = 0; t &lt;= 2.0001; t += 0.5){
      g += line(BX(t), MT, BX(t), MT + PH, C.grid, 1);
      g += txt(BX(t), MT + PH + 19, fmt(t, 1), C.muted, 12, &quot;middle&quot;);
    }
    g += txt(ML + PW / 2, MT + PH + 40, &quot;a（斜率）&quot;, C.muted, 13, &quot;middle&quot;);
    g += txt(ML - 9, MT - 10, &quot;φ(a)&quot;, C.muted, 13, &quot;end&quot;);

    function curve(list, color, w, dash){
      var d = &quot;&quot;, k;
      for (k = 0; k &lt; list.length; k++){
        d += (k ? &quot;L&quot; : &quot;M&quot;) + BX(list[k][0]).toFixed(1) + &quot;,&quot; + BY(list[k][1]).toFixed(1) + &quot; &quot;;
      }
      return '&lt;path d=&quot;' + d + '&quot; fill=&quot;none&quot; stroke=&quot;' + color + '&quot; stroke-width=&quot;' + w + '&quot; stroke-linecap=&quot;round&quot;' + (dash ? ' stroke-dasharray=&quot;' + dash + '&quot;' : '') + '/>';
    }

    var inner = &quot;&quot;;
    inner += curve(ref, &quot;#b9c4bc&quot;, 2, &quot;7 6&quot;);
    inner += curve(pts, C.accent, 3.2, null);
    inner += line(ML, BY(m.jmin), ML + PW, BY(m.jmin), C.accent2, 2, &quot;6 5&quot;);

    if (m.unique){
      inner += circ(BX(m.a), BY(m.jmin), 6.5, C.accent, ' stroke=&quot;white&quot; stroke-width=&quot;2&quot;');
      inner += circ(BX(m.a), BY(m.jmin), 12, &quot;none&quot;, ' stroke=&quot;'+C.accent2+'&quot; stroke-width=&quot;1.6&quot;');
    } else {
      inner += circ(BX(1.0), BY(m.jmin), 6.5, C.accent2, ' stroke=&quot;white&quot; stroke-width=&quot;2&quot;');
    }
    g += '&lt;g clip-path=&quot;none&quot;>' + inner + '&lt;/g>';

    g += txt(ML + 8, MT + 14, &quot;浅灰：λ = 0 的剖面（参照）&quot;, &quot;#8d9c96&quot;, 12, &quot;start&quot;);
    g += txt(ML + 8, MT + 32, &quot;深绿：当前 λ = &quot; + fmt(m.lam, 1), C.accent, 12, &quot;start&quot;);
    g += txt(ML + PW - 4, BY(m.jmin) - 8, &quot;最小值 &quot; + fmt(m.jmin), C.accent2, 12, &quot;end&quot;);
    if (m.unique){
      g += txt(BX(m.a) + 10, BY(m.jmin) + 22, &quot;顶点 a* = &quot; + fmt(m.a), C.ink, 12.5, &quot;start&quot;);
    } else {
      g += txt(ML + PW / 2, MT + PH - 14, &quot;整条水平线：每个 a 都取到同一个最小值&quot;, C.accent2, 12.5, &quot;middle&quot;);
    }
    return g;
  }

  /* ---------- 状态 ---------- */
  var API = window.presentation || {};
  function coerceLam(v){
    var n = Number(v);
    if (!isFinite(n)) n = 2;
    n = Math.round(n * 2) / 2;
    return Math.min(10, Math.max(0, n));
  }
  function coerceDs(v){ return v === &quot;degenerate&quot; ? &quot;degenerate&quot; : &quot;main&quot;; }
  var init = API.initialState || {};
  var state = {
    lambda: coerceLam(init.lambda === undefined ? 2 : init.lambda),
    dataset: coerceDs(init.dataset)
  };

  function barRef(key){
    var r = 0, l;
    for (l = 0; l &lt;= 10.0001; l += 0.5){
      var mm = model(Math.round(l * 2) / 2, key);
      if (mm.J > r) r = mm.J;
    }
    return r || 1;
  }

  function render(){
    var m = model(state.lambda, state.dataset);

    $(&quot;fit&quot;).innerHTML = drawFit(m);
    $(&quot;prof&quot;).innerHTML = drawProf(m);

    if (m.unique &amp;&amp; m.key === &quot;main&quot;){
      $(&quot;fitnote&quot;).textContent = &quot;竖直细线是五个残差 yᵢ − ŷᵢ；直线转动时它始终穿过橙色圈出的均值点 (2, 1.6)，因为 b 被固定在 1.6 − 2a。&quot;;
    } else if (m.unique){
      $(&quot;fitnote&quot;).textContent = &quot;五个点全落在 x = 2 这一列。λ > 0 时唯一的解是水平线 y = 1.6，所有残差都从各点拉到 1.6。&quot;;
    } else {
      $(&quot;fitnote&quot;).textContent = &quot;不唯一：过 (2, 1.6) 的每条直线都同样好。三条虚线只是其中三个例子（斜率 −0.8、0、1.3），不是“最优的三条”。&quot;;
    }

    if (m.unique &amp;&amp; m.key === &quot;main&quot;){
      $(&quot;profnote&quot;).textContent = &quot;浅灰是 λ = 0 的剖面（参照），深绿是当前 λ。λ 增大时曲线变陡、顶点左移，最优斜率因此变小；两条曲线的差就是惩罚项 λa² 造成的。&quot;;
    } else if (m.unique){
      $(&quot;profnote&quot;).textContent = &quot;λ = 0 的剖面在这里是一条水平线（任何 a 都一样好）；λ > 0 把它变成开口向上的抛物线，最低点落在 a = 0。这就是“唯一性由 λ 提供”的样子。&quot;;
    } else {
      $(&quot;profnote&quot;).textContent = &quot;当前曲线与 λ = 0 的参照曲线重合，整个是水平的：每个 a 都取到同一个最小值 21.2，剖面图给不出唯一的 a*。&quot;;
    }

    var M = [];
    if (m.unique){
      M.push([&quot;斜率 a*&quot;, fmt(m.a)]);
      M.push([&quot;截距 b*&quot;, fmt(m.b)]);
      M.push([&quot;ŷ(x̄) = 2a* + b*&quot;, fmt(m.a * m.xb + m.b)]);
      M.push([&quot;SSE（未加惩罚）&quot;, fmt(m.sse)]);
      M.push([&quot;P = λa²&quot;, fmt(m.pen)]);
      M.push([&quot;J = SSE + P&quot;, fmt(m.J)]);
    } else {
      M.push([&quot;斜率 a*&quot;, &quot;不唯一&quot;]);
      M.push([&quot;截距 b*&quot;, &quot;1.6 − 2a&quot;]);
      M.push([&quot;每个点的预测&quot;, &quot;1.6&quot;]);
      M.push([&quot;SSE（未加惩罚）&quot;, fmt(m.sse)]);
      M.push([&quot;P = λa²&quot;, &quot;0&quot;]);
      M.push([&quot;J = SSE + P&quot;, fmt(m.J)]);
    }
    $(&quot;metrics&quot;).innerHTML = M.map(function(p){
      return '&lt;div>&lt;span>' + p[0] + '&lt;/span>&lt;output>' + p[1] + '&lt;/output>&lt;/div>';
    }).join(&quot;&quot;);

    var ref = barRef(m.key);
    var wSse = Math.max(0, Math.min(100, m.sse / ref * 100));
    var wPen = Math.max(0, Math.min(100 - wSse, m.pen / ref * 100));
    $(&quot;seg-sse&quot;).style.background = C.accent;
    $(&quot;seg-sse&quot;).style.width = wSse.toFixed(2) + &quot;%&quot;;
    $(&quot;seg-pen&quot;).style.background = C.accent2;
    $(&quot;seg-pen&quot;).style.width = wPen.toFixed(2) + &quot;%&quot;;
    $(&quot;bar-ref&quot;).textContent = &quot;满格 = 本组数据在 λ∈[0,10] 内最大的 J = &quot; + fmt(ref) + &quot;；当前 J = &quot; + fmt(m.J) + &quot;（SSE + P）。&quot;;

    var read = &quot;&quot;;
    if (m.unique &amp;&amp; m.key === &quot;main&quot;){
      read = &quot;λ = &quot; + fmt(m.lam, 1) + &quot;：a* = &quot; + fmt(m.a) + &quot;，b* = &quot; + fmt(m.b) + &quot;。未加惩罚的 SSE = &quot; + fmt(m.sse);
      if (m.lam === 0){
        read += &quot;（λ = 0 无惩罚，这已经是最小可能值 1.6；解仍唯一，因为 Sxx = 10 > 0）&quot;;
      } else {
        read += &quot;（λ = 0 时可做到 1.6，这里为了把 a 从 1.4 拉向 0，多付了 &quot; + fmt(m.sse - 1.6) + &quot; 的平方误差）&quot;;
      }
      read += &quot;；惩罚项 P = &quot; + fmt(m.pen) + &quot;；J = &quot; + fmt(m.J) + &quot;。直线仍过 (2, 1.6)。&quot;;
    } else if (m.unique){
      read = &quot;λ = &quot; + fmt(m.lam, 1) + &quot; > 0：唯一解 a* = 0、b* = 1.6，直线是水平线 y = 1.6（仍过 (2, 1.6)）。SSE = &quot; + fmt(m.sse) + &quot;，P = 0，J = &quot; + fmt(m.J) + &quot;；与 λ = 0 时的 SSE 21.2 完全一样，正则化没有改善拟合。&quot;;
    } else {
      read = &quot;λ = 0：不唯一。数据只能定出 2a + b = 1.6；a 可以任取，取定 a 后 b = 1.6 − 2a。图中三条虚线只是这一族里的三个例子，它们的 SSE 都是 &quot; + fmt(m.sse) + &quot;、J 都是 &quot; + fmt(m.J) + &quot;，没有哪一条更好。&quot;;
    }
    $(&quot;reading&quot;).textContent = read;

    sync();
  }

  function sync(){
    $(&quot;lam&quot;).value = String(state.lambda);
    $(&quot;lam-out&quot;).textContent = &quot;λ = &quot; + fmt(state.lambda, 1);
    $(&quot;ds&quot;).value = state.dataset;
  }

  $(&quot;lam&quot;).addEventListener(&quot;input&quot;, function(e){
    state.lambda = coerceLam(e.target.value);
    render();
  });
  $(&quot;lam&quot;).addEventListener(&quot;change&quot;, function(){
    sync();
    if (API.commitState) API.commitState();
  });
  $(&quot;ds&quot;).addEventListener(&quot;change&quot;, function(e){
    state.dataset = coerceDs(e.target.value);
    render();
    if (API.commitState) API.commitState();
  });

  if (API.registerStateReader){
    API.registerStateReader(function(){
      var m = model(state.lambda, state.dataset);
      return {
        values: { lambda: state.lambda, dataset: state.dataset },
        visible_step: m.unique ? &quot;unique&quot; : &quot;nonunique&quot;,
        observation: {
          summary: $(&quot;reading&quot;).textContent,
          state: {
            lambda: state.lambda,
            dataset: state.dataset,
            unique: m.unique,
            a: m.unique ? Number(m.a.toFixed(4)) : null,
            b: m.unique ? Number(m.b.toFixed(4)) : null,
            sse: Number(m.sse.toFixed(4)),
            penalty: Number(m.pen.toFixed(4)),
            J: Number(m.J.toFixed(4))
          }
        }
      };
    });
  }
  if (API.registerStateRestorer){
    API.registerStateRestorer(function(saved){
      var v = (saved &amp;&amp; saved.values &amp;&amp; (saved.values.page || saved.values)) || {};
      state.lambda = coerceLam(v.lambda === undefined ? 2 : v.lambda);
      state.dataset = coerceDs(v.dataset);
      render();
    });
  }
  if (API.registerActionHandler){
    API.registerActionHandler(function(action){
      if (action &amp;&amp; action.kind === &quot;set_parameters&quot;){
        var v = action.values || {};
        if (&quot;lambda&quot; in v) state.lambda = coerceLam(v.lambda);
        if (&quot;dataset&quot; in v) state.dataset = coerceDs(v.dataset);
        render();
      }
    });
  }

  render();
})();
&lt;/script>

&lt;/body>&lt;/html>"></iframe></body></html>
