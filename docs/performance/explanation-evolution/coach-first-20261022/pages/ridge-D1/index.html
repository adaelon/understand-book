&lt;body>
&lt;main>
&lt;header>
  &lt;p class=&quot;tag&quot;>全篇共用 · 五个固定点、一个目标函数&lt;/p>
  &lt;h1>带惩罚的直线拟合：从 J(a,b) 推到 a*(λ)、b*(λ)&lt;/h1>
  &lt;p class=&quot;lead&quot;>五个固定点、一个目标函数。下面从残差分解开始，一步步推到最优斜率与截距；再把 λ 和退化数据放回同一套公式里核对，图形与读数只用来检验推导，不用来代替推导。&lt;/p>
&lt;/header>

&lt;section class=&quot;block&quot;>
  &lt;p class=&quot;tag&quot;>主示例 · x 有变化&lt;/p>
  &lt;h2>1. 固定的数据与要最小化的 J&lt;/h2>
  &lt;p>全页只用一组数据：x=(0,1,2,3,4)，y=(−1,0,2,2,5)，共五个点。模型是 ŷ=a·x+b，其中 a 是斜率、b 是截距。要最小化的是&lt;/p>
  &lt;div class=&quot;formula&quot;>J(a,b) = Σᵢ₌₁⁵ [yᵢ − (a·xᵢ + b)]² + λa²,  λ ≥ 0&lt;/div>
  &lt;p>第一项把五个残差平方逐个相加，每个残差按 1 计入一次，没有除以观测数。第二项只含 a。若改成“误差平方的平均值”，整个目标会被除以 5，λ 的相对强度随之改变；本页全部读数都按总和口径，λ 的取值 0–10 也在这个口径下理解。&lt;/p>
  &lt;p>前面还会反复用到两个平均值：x̄ = 10/5 = 2，ȳ = 8/5 = 1.6。把每个点相对这两个平均值的偏差列出来，后面所需的三个量就一次性到手：&lt;/p>
  &lt;div class=&quot;tablewrap&quot;>
  &lt;table>
    &lt;thead>&lt;tr>&lt;th>i&lt;/th>&lt;th>xᵢ&lt;/th>&lt;th>yᵢ&lt;/th>&lt;th>xᵢ−x̄&lt;/th>&lt;th>yᵢ−ȳ&lt;/th>&lt;th>(xᵢ−x̄)²&lt;/th>&lt;th>(xᵢ−x̄)(yᵢ−ȳ)&lt;/th>&lt;/tr>&lt;/thead>
    &lt;tbody>
      &lt;tr>&lt;td>1&lt;/td>&lt;td>0&lt;/td>&lt;td>−1&lt;/td>&lt;td>−2&lt;/td>&lt;td>−2.6&lt;/td>&lt;td>4&lt;/td>&lt;td>5.2&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>2&lt;/td>&lt;td>1&lt;/td>&lt;td>0&lt;/td>&lt;td>−1&lt;/td>&lt;td>−1.6&lt;/td>&lt;td>1&lt;/td>&lt;td>1.6&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>3&lt;/td>&lt;td>2&lt;/td>&lt;td>2&lt;/td>&lt;td>0&lt;/td>&lt;td>0.4&lt;/td>&lt;td>0&lt;/td>&lt;td>0&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>4&lt;/td>&lt;td>3&lt;/td>&lt;td>2&lt;/td>&lt;td>1&lt;/td>&lt;td>0.4&lt;/td>&lt;td>1&lt;/td>&lt;td>0.4&lt;/td>&lt;/tr>
      &lt;tr>&lt;td>5&lt;/td>&lt;td>4&lt;/td>&lt;td>5&lt;/td>&lt;td>2&lt;/td>&lt;td>3.4&lt;/td>&lt;td>4&lt;/td>&lt;td>6.8&lt;/td>&lt;/tr>
    &lt;/tbody>
    &lt;tfoot>&lt;tr>&lt;td>合计&lt;/td>&lt;td>10&lt;/td>&lt;td>8&lt;/td>&lt;td>0&lt;/td>&lt;td>0&lt;/td>&lt;td>10&lt;/td>&lt;td>14&lt;/td>&lt;/tr>&lt;/tfoot>
  &lt;/table>
  &lt;/div>
  &lt;p class=&quot;small&quot;>窄屏下这张表可以左右滑动，查看全部七列。&lt;/p>
  &lt;p>最后一行给出三个后面一直要用的量：&lt;/p>
  &lt;div class=&quot;formula&quot;>Sxx = Σ(xᵢ−x̄)² = 10
Sxy = Σ(xᵢ−x̄)(yᵢ−ȳ) = 14
Syy = Σ(yᵢ−ȳ)² = 21.2&lt;/div>
  &lt;p class=&quot;small&quot;>这三个 S 都是总和，不除以 n，与 J 第一项同口径。λ 的起点 2 只是交互的初始位置；本节到第 4 节的推导对任意 λ ≥ 0 成立。&lt;/p>
&lt;/section>

&lt;section class=&quot;block&quot;>
  &lt;p class=&quot;tag&quot;>主示例 · 第 2–4 节都用这一组数&lt;/p>
  &lt;h2>2. 先解 b：把残差拆成“中心化部分 + 常数偏移”&lt;/h2>
  &lt;p>每个残差可以写成同一个中心的偏差加上一个对全部 i 都相同的偏移。做法是给每个残差同时加上再减去 ȳ 与 a·x̄：&lt;/p>
  &lt;div class=&quot;formula&quot;>yᵢ − a·xᵢ − b = [ (yᵢ − ȳ) − a(xᵢ − x̄) ] − δ,   δ = ȳ − a·x̄ − b&lt;/div>
  &lt;p>δ 与 i 无关，它只取决于 (a, b) 这一对系数。把两边平方再对 i 求和，逐项展开：&lt;/p>
  &lt;div class=&quot;formula&quot;>Σ rᵢ² = Σ[(yᵢ−ȳ) − a(xᵢ−x̄)]² − 2δ·Σ[(yᵢ−ȳ) − a(xᵢ−x̄)] + 5δ²&lt;/div>
  &lt;p>中间那一整项为零，依据是两个中心化偏差的合计都是零：Σ(yᵢ−ȳ) = (−2.6)+(−1.6)+0.4+0.4+3.4 = 0，Σ(xᵢ−x̄) = (−2)+(−1)+0+1+2 = 0。于是 Σ[(yᵢ−ȳ) − a(xᵢ−x̄)] = 0 − a·0 = 0，交叉项 −2δ·0 消失。它消失的原因是这两个和为零，与 a、b 取什么值无关。&lt;/p>
  &lt;p>第一个平方和再展开一次。把 (yᵢ−ȳ) 与 a(xᵢ−x̄) 各自平方、再减两倍乘积：Σ(yᵢ−ȳ)² = Syy，乘积项给出 Σ(xᵢ−x̄)(yᵢ−ȳ) = Sxy，而单独的 Σ(xᵢ−x̄)·ȳ 与 x̄·Σ(yᵢ−ȳ) 都含一个零和，所以只剩&lt;/p>
  &lt;div class=&quot;formula&quot;>Σ[(yᵢ−ȳ) − a(xᵢ−x̄)]² = Syy − 2a·Sxy + a²·Sxx&lt;/div>
  &lt;p>把两段合起来，J 被改写成一个等价的形式：&lt;/p>
  &lt;div class=&quot;formula&quot;>J(a,b) = (Syy − 2a·Sxy + a²·Sxx) + 5(ȳ − a·x̄ − b)² + λa²&lt;/div>
  &lt;p>括号外的第二项 5(ȳ − a·x̄ − b)² 对任何 a 都 ≥ 0，并且只在 b = ȳ − a·x̄ 时取零。所以给定 a，使 J 最小的 b 唯一，而且可以写下来：&lt;/p>
  &lt;div class=&quot;formula&quot;>b*(a) = ȳ − a·x̄ = 1.6 − 2a&lt;/div>
  &lt;p>求导给出同一条结论：∂J/∂b = −2Σ(yᵢ − a·xᵢ − b) = −2·5·δ，令它为零正好是 δ = 0。两种说法都在讲同一件事——最优点上残差之和为零。&lt;/p>
  &lt;p>这条结论有一个可以直接读出来的几何含义。把 b*(a) 代回模型：ŷ = a·x + (ȳ − a·x̄)。在 x = x̄ 处，ŷ = a·x̄ + ȳ − a·x̄ = ȳ，所以最优直线总要经过均值点 (2, 1.6)。惩罚项 λa² 里没有 b，因此这个关系与 λ 无关：λ 从 0 加到 10，直线始终穿过 (2, 1.6)。&lt;/p>
&lt;/section>

&lt;section class=&quot;block&quot;>
  &lt;h2>3. 代入 b：J 变成关于 a 的一元二次函数&lt;/h2>
  &lt;p>把 b*(a) 代回，δ = 0，那个平方项整段消失，只剩 a 的二次式。代入 Sxx=10、Sxy=14、Syy=21.2：&lt;/p>
  &lt;div class=&quot;formula&quot;>J(a, b*(a)) = Syy − 2a·Sxy + (Sxx + λ)a² = 21.2 − 28a + (10 + λ)a²&lt;/div>
  &lt;p>把 (10+λ) 提出来配方：&lt;/p>
  &lt;div class=&quot;formula&quot;>J = (10+λ)·(a − 14/(10+λ))² + 21.2 − 196/(10+λ)&lt;/div>
  &lt;p>顶点位置就是最优斜率，再代回 b*(a) 得截距：&lt;/p>
  &lt;div class=&quot;formula&quot;>a*(λ) = Sxy/(Sxx+λ) = 14/(10+λ) = 1.4 · 10/(10+λ)
b*(λ) = ȳ − x̄·a* = 1.6 − 2·a*&lt;/div>
  &lt;p>λ 为什么改变斜率，可以从 ∂J/∂a = −2·Sxy + 2(Sxx+λ)a = 0 这个平衡读出来：&lt;/p>
  &lt;div class=&quot;formula&quot;>Sxx·a + λ·a = Sxy,  即  10a + λa = 14&lt;/div>
  &lt;p>左边第一项是数据把 a 往 1.4 推的强度，它正比于 Sxy；第二项是惩罚把 a 往 0 拉的强度，它正比于 λ。λ 增大后，同样大小的 a 会带来更大的回拉，平衡点就向左移。把它解出来也能看到同一件事：a* = 1.4·10/(10+λ)，收缩因子 10/(10+λ) 随 λ 增大而减小，λ→∞ 时 a*→0。&lt;/p>
  &lt;p>截距跟着变，依据是直线被钉在均值点上。b* = 1.6 − 2a*：a* 减小时 2a* 减小，b* 就增大。λ 取 0、2、10 时，a* 分别是 1.4、7/6≈1.167、0.7，b* 相应是 −1.2、−11/15≈−0.733、0.2。斜率越平，为了仍然经过 (2, 1.6)，截距就得越高。&lt;/p>
&lt;/section>

&lt;section class=&quot;block&quot;>
  &lt;h2>4. 为什么是全局最小，以及什么时候唯一&lt;/h2>
  &lt;p>上面那一步配方可以对任意 (a, b) 写成恒等式。这是本页的主证据，因为它不依赖“先求导、再比较”的顺序：&lt;/p>
  &lt;div class=&quot;formula&quot;>J(a,b) − J_min(λ) = (Sxx+λ)(a − a*)² + 5(ȳ − a·x̄ − b)²
其中  J_min(λ) = Syy − Sxy²/(Sxx+λ) = 21.2 − 196/(10+λ)&lt;/div>
  &lt;p>用法是逐项比较。右边两项都是平方乘以正系数：(Sxx+λ) = 10+λ ≥ 10，另一项系数是 5。所以对平面上的每一点都有 J(a,b) ≥ J_min(λ)，并且等号成立必须两个平方同时为零。三件事一次得到：&lt;/p>
  &lt;ul class=&quot;recap&quot;>
    &lt;li>全局：下界对每个 (a, b) 成立，不是某点附近的局部结论。&lt;/li>
    &lt;li>取到：把 (a*, b*) 代入左边，两个平方都是 0+0，所以 J − J_min = 0，下界确实被某对系数取到。&lt;/li>
    &lt;li>唯一：系数为正，两个平方同时为零只可能发生在 a = a* 且 b = ȳ − a·x̄，所以最小点只有一个。&lt;/li>
  &lt;/ul>
  &lt;p>唯一性依赖的条件在这里很清楚：只要 Sxx+λ &amp;gt; 0，第一项就只在 a = a* 时为零。本例 Sxx=10、λ ≥ 0，条件恒成立，因此每一条最优直线都是唯一的。下一节会把 Sxx 换成 0，这条判据立刻变成分界线。&lt;/p>
  &lt;p>数值核对（λ=2）：a* = 7/6 ≈ 1.1667，b* = −11/15 ≈ −0.7333；SSE = 21.2 − 28·(7/6) + 10·(49/36) = 193/90 ≈ 2.1444；惩罚项 λa² = 2·(49/36) = 49/18 ≈ 2.7222；两者相加 J = 73/15 ≈ 4.8667。用闭合公式另一条路算：J_min = 21.2 − 196/12 = 21.2 − 16.3333 = 4.8667。两条路给出同一个数，下面交互的读数就是按这两条路分别计算、再对照显示的。&lt;/p>
&lt;/section>

&lt;section class=&quot;block&quot; id=&quot;lab&quot;>
  &lt;p class=&quot;tag&quot;>交互 · 两套数据共用同一段计算&lt;/p>
  &lt;h2>5. 只改变 λ，其余条件固定&lt;/h2>
  &lt;p>下面的图和上面用的是同一组数字：同一个 Sxx=10、Sxy=14、Syy=21.2，同一个 J。滑块只改 λ；数据集下拉会整组换掉 x，并在标题与读数里标出当前用的是哪一组。初始 λ=2。&lt;/p>
  &lt;div class=&quot;lab&quot;>
    &lt;div class=&quot;controls&quot;>
      &lt;label class=&quot;ctl&quot; for=&quot;lambda&quot;>&lt;span>λ：惩罚强度（0–10，步长 0.5）&lt;/span>&lt;output id=&quot;lambda-out&quot;>2&lt;/output>&lt;input id=&quot;lambda&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;10&quot; step=&quot;0.5&quot; data-presentation-parameter=&quot;lambda&quot; aria-label=&quot;惩罚强度 λ，从 0 到 10，步长 0.5&quot;>&lt;/label>
      &lt;label class=&quot;ctl&quot; for=&quot;dataset&quot;>&lt;span>数据集&lt;/span>&lt;select id=&quot;dataset&quot; data-presentation-parameter=&quot;dataset&quot;>&lt;option value=&quot;main&quot;>主示例：x = 0,1,2,3,4&lt;/option>&lt;option value=&quot;degen&quot;>退化数据：五个 x 都等于 2&lt;/option>&lt;/select>&lt;/label>
      &lt;label class=&quot;ctl&quot; for=&quot;demoA&quot;>&lt;span>示例 a（仅退化数据、λ=0 时可用）&lt;/span>&lt;output id=&quot;demoA-out&quot;>1&lt;/output>&lt;input id=&quot;demoA&quot; type=&quot;range&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.5&quot; data-presentation-parameter=&quot;demoA&quot; aria-label=&quot;示例斜率 a，仅用于退化数据在 λ 等于 0 时画出一条解&quot;>&lt;/label>
      &lt;div class=&quot;presets&quot;>
        &lt;button type=&quot;button&quot; data-preset=&quot;0&quot;>λ = 0&lt;/button>
        &lt;button type=&quot;button&quot; data-preset=&quot;2&quot;>λ = 2&lt;/button>
        &lt;button type=&quot;button&quot; data-preset=&quot;10&quot;>λ = 10&lt;/button>
        &lt;button type=&quot;button&quot; id=&quot;reset&quot; data-presentation-action=&quot;reset&quot;>重置（λ=2，主示例）&lt;/button>
      &lt;/div>
    &lt;/div>
    &lt;p id=&quot;phase&quot; class=&quot;status&quot; role=&quot;status&quot;>&lt;/p>
    &lt;svg id=&quot;scene&quot; viewBox=&quot;0 0 720 380&quot; role=&quot;img&quot; aria-label=&quot;观测点、当前拟合直线、每个点的残差与均值点&quot;>&lt;/svg>
    &lt;p class=&quot;small&quot; id=&quot;scene-note&quot;>&lt;/p>
    &lt;div class=&quot;curves&quot;>
      &lt;figure>&lt;svg id=&quot;curveA&quot; viewBox=&quot;0 0 360 200&quot; role=&quot;img&quot; aria-label=&quot;最优斜率随 λ 的变化&quot;>&lt;/svg>&lt;figcaption id=&quot;capA&quot;>&lt;/figcaption>&lt;/figure>
      &lt;figure>&lt;svg id=&quot;curveB&quot; viewBox=&quot;0 0 360 200&quot; role=&quot;img&quot; aria-label=&quot;最优截距随 λ 的变化&quot;>&lt;/svg>&lt;figcaption id=&quot;capB&quot;>&lt;/figcaption>&lt;/figure>
    &lt;/div>
    &lt;div id=&quot;lab-readout&quot;>
      &lt;div class=&quot;metrics&quot;>
        &lt;div>&lt;span>斜率 a*&lt;/span>&lt;output id=&quot;out-a&quot;>&lt;/output>&lt;/div>
        &lt;div>&lt;span>截距 b*&lt;/span>&lt;output id=&quot;out-b&quot;>&lt;/output>&lt;/div>
        &lt;div>&lt;span>未加惩罚 SSE = Σrᵢ²&lt;/span>&lt;output id=&quot;out-sse&quot;>&lt;/output>&lt;/div>
        &lt;div>&lt;span>惩罚项 λa²&lt;/span>&lt;output id=&quot;out-pen&quot;>&lt;/output>&lt;/div>
        &lt;div>&lt;span>目标 J = SSE + λa²&lt;/span>&lt;output id=&quot;out-j&quot;>&lt;/output>&lt;/div>
        &lt;div>&lt;span>闭合公式 J_min&lt;/span>&lt;output id=&quot;out-jmin&quot;>&lt;/output>&lt;/div>
      &lt;/div>
      &lt;p id=&quot;out-note&quot; class=&quot;readline&quot;>&lt;/p>
      &lt;p id=&quot;out-check&quot; class=&quot;small&quot;>&lt;/p>
    &lt;/div>
  &lt;/div>
  &lt;p>建议的观察顺序：先把 λ 拉到 0，读数会给出 a*=1.4、b*=−1.2，也就是未加惩罚的最小二乘解；再每次加 0.5，看 a* 减小、b* 增大，直线绕均值点 (2, 1.6) 旋转；同时对照 SSE 与 J 两行，它们之差正是 λa²。切到退化数据后，λ&amp;gt;0 与 λ=0 的读数口径完全不同，第 6 节解释这个差别。&lt;/p>
&lt;/section>

&lt;section class=&quot;block&quot;>
  &lt;p class=&quot;tag&quot;>退化数据 · x 全部等于 2&lt;/p>
  &lt;h2>6. 五个 x 都是 2：预测唯一，直线不唯一&lt;/h2>
  &lt;p>把 x 换成 (2,2,2,2,2)，y 仍是 (−1,0,2,2,5)。平均值不变：x̄=2、ȳ=1.6；但两个中心化量变成 0：Sxx = Σ(2−2)² = 0，Sxy = Σ(2−2)(yᵢ−ȳ) = 0，而 Syy 仍是 21.2。&lt;/p>
  &lt;p>因为所有 x 相同，模型在每个观测横坐标上都给出同一个数，把它记作 c：&lt;/p>
  &lt;div class=&quot;formula&quot;>c = 2a + b = ŷ（所有点共同的预测值）&lt;/div>
  &lt;p>把 Sxx = 0、Sxy = 0 代入第 4 节的那个恒等式，J 自动变成&lt;/p>
  &lt;div class=&quot;formula&quot;>J(a,b) = 21.2 + 5(1.6 − 2a − b)² + λa²,   J_min = Syy = 21.2&lt;/div>
  &lt;p>λ = 0 时，λa² 整段消失，只剩 J = 21.2 + 5(1.6 − 2a − b)²。要取最小值只需要 2a + b = 1.6，此时 J = 21.2；a 可以是任意实数，对应 b = 1.6 − 2a。每一条这样的直线在唯一的横坐标 x = 2 上给出的预测都是 ŷ = 1.6，残差、SSE、J 全都一样。能够确定的是预测值与目标值 21.2，a 与 b 都不被数据确定：同样好的直线有无穷多条。这正是第 4 节判据的边界：Sxx+λ = 0+0 = 0，第一项整段消失，唯一性随之丢失。&lt;/p>
  &lt;p>λ &amp;gt; 0 时，λa² 回来把 a 单独定住。两个系数 λ 与 5 都为正，两个平方要同时为零才取到最小值，于是 a = 0，再由 2a + b = 1.6 得 b = 1.6。系数唯一：直线变成水平线 ŷ = 1.6。&lt;/p>
  &lt;div class=&quot;note&quot;>λ &amp;gt; 0 时的最小值仍是 J = 21.2，与 λ = 0 时相同。罚项没有压低目标值——λ = 0 时的最好预测已经取到；它改变的是参数的唯一性：λ = 0 时无穷多组 (a, b) 给出同一个预测，λ &amp;gt; 0 时只剩一组。x 没有变化时，数据对 a 不提供任何约束，惩罚补上的是一条选取规则（把 a 定为 0），截距随之落回 ȳ。&lt;/div>
  &lt;p>在交互里切换到这个数据集、把 λ 拖到 0，读数只会给出确定的那几项：c = 2a+b = 1.6、SSE = 21.2、J = 21.2；a 显示为“不唯一”，b 显示为 b = 1.6 − 2a。此时“示例 a”滑块才可用，它画出一条具体的解，用来验证换成别的 a 之后预测值、SSE 与 J 都不变。&lt;/p>
&lt;/section>

&lt;section class=&quot;block&quot;>
  &lt;p class=&quot;tag&quot;>回顾 · 主示例与退化数据&lt;/p>
  &lt;h2>7. 读完应该能自己讲清的四点&lt;/h2>
  &lt;ul class=&quot;recap&quot;>
    &lt;li>&lt;strong>增大 λ 为什么改变斜率。&lt;/strong>正规方程是 10a + λa = 14，把数据项 Sxy 分摊到更大的分母上；等价地看，惩罚对 a 的拉力 λa 随 λ 增大，平衡点 a* = 14/(10+λ) 向 0 移动，收缩因子 10/(10+λ) 随 λ 减小。&lt;/li>
    &lt;li>&lt;strong>截距为什么也跟着变。&lt;/strong>b* = 1.6 − 2a*。直线必须经过均值点，斜率变小时截距必须变大，才能继续经过 (2, 1.6)：λ 从 0 到 10，a* 从 1.4 降到 0.7，b* 从 −1.2 升到 0.2。&lt;/li>
    &lt;li>&lt;strong>为什么仍经过均值点。&lt;/strong>∂J/∂b = 0 给出 Σrᵢ = 0，等价于 ȳ = a·x̄ + b，于是在 x = x̄ 处 ŷ = ȳ。惩罚项只含 a，这条关系对每个 λ ≥ 0 都成立。&lt;/li>
    &lt;li>&lt;strong>x 没有变化时正则化解决了什么。&lt;/strong>预测值 c = 2a+b 已经唯一且取到最好（SSE = 21.2）；不确定的是参数：λ = 0 时任何满足 2a+b = 1.6 的直线都同样好，λ &amp;gt; 0 时由 λa² 选出 a = 0、b = 1.6。它解决的是参数的可识别性。&lt;/li>
  &lt;/ul>
  &lt;p class=&quot;small&quot;>自己复现时可以按这五步走：① 算 x̄、ȳ、Sxx、Sxy、Syy（都是总和）；② 把残差写成 [(yᵢ−ȳ) − a(xᵢ−x̄)] − δ，用两个零和消掉交叉项；③ 由 5δ² ≥ 0 得 b*(a) = ȳ − a·x̄；④ 代入得 Syy − 2aSxy + (Sxx+λ)a²，配方读出 a*、b*；⑤ 用同一配方写成 J − J_min 的两个平方，确认全局最小与唯一性条件 Sxx+λ &amp;gt; 0。&lt;/p>
  &lt;footer>本页全部段落使用同一组 x、y 与同一个 J：第 1–5 节是主示例（x 有变化），第 6 节是退化数据（五个 x 都等于 2），第 7 节同时回顾两者。所有读数按误差平方的总和口径，惩罚只进入斜率 a；图形与读数由同一段计算生成。&lt;/footer>
&lt;/section>
&lt;/main>
&lt;script>
&quot;use strict&quot;;
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var C = { ink: &quot;#22383c&quot;, muted: &quot;#647a76&quot;, accent: &quot;#12766f&quot;, gold: &quot;#b4782f&quot;, coral: &quot;#c1563f&quot;, line: &quot;#d6ded6&quot;, grid: &quot;#e8ede6&quot; };
  var DATA = {
    main: { xs: [0, 1, 2, 3, 4], ys: [-1, 0, 2, 2, 5], name: &quot;主示例：x = 0,1,2,3,4&quot; },
    degen: { xs: [2, 2, 2, 2, 2], ys: [-1, 0, 2, 2, 5], name: &quot;退化数据：五个 x 都等于 2&quot; }
  };
  function f(v, d) { d = (d === undefined) ? 3 : d; return (!isFinite(v)) ? &quot;—&quot; : Number(v.toFixed(d)).toString(); }

  function stats(key) {
    var d = DATA[key], n = d.xs.length, sx = 0, sy = 0, i;
    for (i = 0; i &lt; n; i++) { sx += d.xs[i]; sy += d.ys[i]; }
    var xbar = sx / n, ybar = sy / n, sxx = 0, sxy = 0, syy = 0;
    for (i = 0; i &lt; n; i++) {
      var dx = d.xs[i] - xbar, dy = d.ys[i] - ybar;
      sxx += dx * dx; sxy += dx * dy; syy += dy * dy;
    }
    return { n: n, xs: d.xs, ys: d.ys, xbar: xbar, ybar: ybar, sxx: sxx, sxy: sxy, syy: syy, name: d.name };
  }

  var defaults = { lambda: 2, dataset: &quot;main&quot;, demoA: 1 };
  var state = { lambda: defaults.lambda, dataset: defaults.dataset, demoA: defaults.demoA };
  var init = (window.presentation &amp;&amp; window.presentation.initialState) || {};
  if (&quot;lambda&quot; in init) { state.lambda = Number(init.lambda); }
  if (&quot;dataset&quot; in init &amp;&amp; DATA[init.dataset]) { state.dataset = init.dataset; }
  if (&quot;demoA&quot; in init) { state.demoA = Number(init.demoA); }
  state.lambda = Math.min(10, Math.max(0, isFinite(state.lambda) ? state.lambda : 2));
  state.demoA = Math.min(2, Math.max(-2, isFinite(state.demoA) ? state.demoA : 1));

  function solve() {
    var S = stats(state.dataset), lam = state.lambda, a = null, b = 0, uniqueA = false, jmin = S.syy;
    if (S.sxx > 0) {
      a = S.sxy / (S.sxx + lam);
      b = S.ybar - S.xbar * a;
      uniqueA = true;
      jmin = S.syy - S.sxy * S.sxy / (S.sxx + lam);
    } else if (lam > 0) {
      a = 0; b = S.ybar; uniqueA = true; jmin = S.syy;
    } else {
      a = null; b = S.ybar - S.xbar * state.demoA; uniqueA = false; jmin = S.syy;
    }
    var aDraw = (a === null) ? state.demoA : a;
    var sse = 0, i;
    for (i = 0; i &lt; S.n; i++) {
      var r = S.ys[i] - (aDraw * S.xs[i] + b);
      sse += r * r;
    }
    var penalty = lam * aDraw * aDraw;
    return { S: S, lam: lam, a: a, b: b, aDraw: aDraw, uniqueA: uniqueA, sse: sse, penalty: penalty, j: sse + penalty, jmin: jmin };
  }

  var VX = function (x) { return 60 + (x + 0.5) * 120; };
  var VY = function (y) { return 340 - (y + 2.5) * 34; };

  function lineEq(m) {
    var b = m.b, sign = b &lt; 0 ? &quot;−&quot; : &quot;+&quot;;
    return &quot;ŷ = &quot; + f(m.aDraw) + &quot;·x &quot; + sign + &quot; &quot; + f(Math.abs(b));
  }

  function drawScene(m) {
    var S = m.S, i, h = &quot;&quot;;
    h += '&lt;defs>&lt;clipPath id=&quot;plotclip&quot;>&lt;rect x=&quot;60&quot; y=&quot;34&quot; width=&quot;600&quot; height=&quot;306&quot;/>&lt;/clipPath>&lt;/defs>';
    for (var yv = -2; yv &lt;= 6; yv++) {
      h += '&lt;line x1=&quot;60&quot; y1=&quot;' + VY(yv) + '&quot; x2=&quot;660&quot; y2=&quot;' + VY(yv) + '&quot; stroke=&quot;' + (yv === 0 ? C.line : C.grid) + '&quot;/>';
      h += '&lt;text x=&quot;52&quot; y=&quot;' + (VY(yv) + 6) + '&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;18&quot; text-anchor=&quot;end&quot;>' + yv + &quot;&lt;/text>&quot;;
    }
    for (var xv = 0; xv &lt;= 4; xv++) {
      h += '&lt;line x1=&quot;' + VX(xv) + '&quot; y1=&quot;34&quot; x2=&quot;' + VX(xv) + '&quot; y2=&quot;340&quot; stroke=&quot;' + C.grid + '&quot;/>';
      h += '&lt;text x=&quot;' + VX(xv) + '&quot; y=&quot;358&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;18&quot; text-anchor=&quot;middle&quot;>' + xv + &quot;&lt;/text>&quot;;
    }
    h += '&lt;text x=&quot;676&quot; y=&quot;358&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;17&quot;>x&lt;/text>';
    h += '&lt;text x=&quot;60&quot; y=&quot;24&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;17&quot;>y&lt;/text>';

    var body = &quot;&quot;;
    for (i = 0; i &lt; S.n; i++) {
      var fit = m.aDraw * S.xs[i] + m.b;
      var px = VX(S.xs[i]);
      body += '&lt;line x1=&quot;' + px + '&quot; y1=&quot;' + VY(S.ys[i]) + '&quot; x2=&quot;' + px + '&quot; y2=&quot;' + VY(fit) + '&quot; stroke=&quot;' + C.coral + '&quot; stroke-width=&quot;2&quot;/>';
      body += '&lt;circle cx=&quot;' + px + '&quot; cy=&quot;' + VY(fit) + '&quot; r=&quot;3&quot; fill=&quot;' + C.coral + '&quot;/>';
    }
    var y1 = m.aDraw * (-0.5) + m.b, y2 = m.aDraw * 4.5 + m.b;
    body += '&lt;line x1=&quot;' + VX(-0.5) + '&quot; y1=&quot;' + VY(y1) + '&quot; x2=&quot;' + VX(4.5) + '&quot; y2=&quot;' + VY(y2) + '&quot; stroke=&quot;' + C.gold + '&quot; stroke-width=&quot;3.5&quot;/>';
    var seen = {};
    for (i = 0; i &lt; S.n; i++) {
      var key = S.xs[i] + &quot;|&quot; + S.ys[i];
      var c = seen[key] || 0; seen[key] = c + 1;
      var off = 0;
      if (c > 0) { off = (c % 2 === 1) ? 7 * Math.ceil(c / 2) : -7 * Math.ceil(c / 2); }
      body += '&lt;circle cx=&quot;' + (VX(S.xs[i]) + off) + '&quot; cy=&quot;' + VY(S.ys[i]) + '&quot; r=&quot;6&quot; fill=&quot;' + C.accent + '&quot; stroke=&quot;#fffdf6&quot; stroke-width=&quot;1.5&quot;/>';
    }
    var mx = VX(S.xbar), my = VY(S.ybar);
    body += '&lt;path d=&quot;M ' + mx + ' ' + (my - 9) + ' L ' + (mx + 9) + ' ' + my + ' L ' + mx + ' ' + (my + 9) + ' L ' + (mx - 9) + ' ' + my + ' Z&quot; fill=&quot;none&quot; stroke=&quot;' + C.ink + '&quot; stroke-width=&quot;2&quot;/>';
    body += '&lt;text x=&quot;' + (mx + 16) + '&quot; y=&quot;' + (my + 26) + '&quot; fill=&quot;' + C.ink + '&quot; font-size=&quot;18&quot;>均值点 (2, 1.6)&lt;/text>';
    h += '&lt;g clip-path=&quot;url(#plotclip)&quot;>' + body + &quot;&lt;/g>&quot;;

    h += '&lt;rect x=&quot;452&quot; y=&quot;10&quot; width=&quot;22&quot; height=&quot;4&quot; fill=&quot;' + C.gold + '&quot;/>&lt;text x=&quot;480&quot; y=&quot;19&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;16&quot;>拟合直线&lt;/text>';
    h += '&lt;rect x=&quot;566&quot; y=&quot;6&quot; width=&quot;3&quot; height=&quot;16&quot; fill=&quot;' + C.coral + '&quot;/>&lt;text x=&quot;576&quot; y=&quot;19&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;16&quot;>残差&lt;/text>';
    h += '&lt;circle cx=&quot;452&quot; cy=&quot;30&quot; r=&quot;5&quot; fill=&quot;' + C.accent + '&quot;/>&lt;text x=&quot;464&quot; y=&quot;35&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;16&quot;>观测点&lt;/text>';
    return h;
  }

  var CURVE = {
    main: { a: { lo: 0.5, hi: 1.5, ticks: [0.5, 1.0, 1.5] }, b: { lo: -1.4, hi: 0.4, ticks: [-1.2, -0.5, 0.2] } },
    degen: { a: { lo: -0.6, hi: 0.6, ticks: [-0.5, 0, 0.5] }, b: { lo: 1.4, hi: 1.8, ticks: [1.4, 1.6, 1.8] } }
  };

  function panel(kind, m) {
    var W = 360, H = 200, L = 54, R = 16, T = 20, B = 34;
    var cfg = CURVE[state.dataset][kind];
    var lo = cfg.lo, hi = cfg.hi;
    var X = function (l) { return L + (l / 10) * (W - L - R); };
    var Y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
    var h = &quot;&quot;, i;
    for (i = 0; i &lt; cfg.ticks.length; i++) {
      var v = cfg.ticks[i];
      h += '&lt;line x1=&quot;' + L + '&quot; y1=&quot;' + Y(v) + '&quot; x2=&quot;' + (W - R) + '&quot; y2=&quot;' + Y(v) + '&quot; stroke=&quot;' + C.grid + '&quot;/>';
      h += '&lt;text x=&quot;' + (L - 8) + '&quot; y=&quot;' + (Y(v) + 5) + '&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;15&quot; text-anchor=&quot;end&quot;>' + f(v, 1) + &quot;&lt;/text>&quot;;
    }
    [0, 5, 10].forEach(function (l) {
      h += '&lt;text x=&quot;' + X(l) + '&quot; y=&quot;' + (H - 12) + '&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;15&quot; text-anchor=&quot;middle&quot;>' + l + &quot;&lt;/text>&quot;;
    });
    h += '&lt;text x=&quot;' + (W - R) + '&quot; y=&quot;' + (T - 6) + '&quot; fill=&quot;' + C.muted + '&quot; font-size=&quot;14&quot; text-anchor=&quot;end&quot;>λ&lt;/text>';
    h += '&lt;text x=&quot;' + L + '&quot; y=&quot;14&quot; fill=&quot;' + C.ink + '&quot; font-size=&quot;15&quot;>' + (kind === &quot;a&quot; ? &quot;a*(λ)&quot; : &quot;b*(λ)&quot;) + &quot;&lt;/text>&quot;;

    if (state.dataset === &quot;main&quot;) {
      var pts = [];
      for (var l = 0; l &lt;= 10.0001; l += 0.25) {
        var value = (kind === &quot;a&quot;) ? 14 / (10 + l) : 1.6 - 28 / (10 + l);
        pts.push(X(l).toFixed(1) + &quot;,&quot; + Y(value).toFixed(1));
      }
      h += '&lt;path d=&quot;M' + pts.join(&quot; L&quot;) + '&quot; fill=&quot;none&quot; stroke=&quot;' + C.gold + '&quot; stroke-width=&quot;2.5&quot;/>';
    } else {
      var cv = (kind === &quot;a&quot;) ? 0 : 1.6;
      h += '&lt;line x1=&quot;' + X(0) + '&quot; y1=&quot;' + Y(cv) + '&quot; x2=&quot;' + X(10) + '&quot; y2=&quot;' + Y(cv) + '&quot; stroke=&quot;' + C.gold + '&quot; stroke-width=&quot;2.5&quot;/>';
      h += '&lt;line x1=&quot;' + X(0) + '&quot; y1=&quot;' + T + '&quot; x2=&quot;' + X(0) + '&quot; y2=&quot;' + Y(lo) + '&quot; stroke=&quot;' + C.coral + '&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 4&quot;/>';
      h += '&lt;text x=&quot;' + (L + 10) + '&quot; y=&quot;' + (T + 18) + '&quot; fill=&quot;' + C.coral + '&quot; font-size=&quot;14&quot;>λ=0：' + (kind === &quot;a&quot; ? &quot;a 任意&quot; : &quot;b 任意&quot;) + &quot;&lt;/text>&quot;;
      h += '&lt;circle cx=&quot;' + X(0) + '&quot; cy=&quot;' + Y(cv) + '&quot; r=&quot;4.5&quot; fill=&quot;#fffdf6&quot; stroke=&quot;' + C.gold + '&quot; stroke-width=&quot;2&quot;/>';
    }
    var lam = state.lambda;
    h += '&lt;line x1=&quot;' + X(lam) + '&quot; y1=&quot;' + T + '&quot; x2=&quot;' + X(lam) + '&quot; y2=&quot;' + Y(lo) + '&quot; stroke=&quot;' + C.accent + '&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;3 4&quot;/>';
    if (state.dataset === &quot;main&quot;) {
      var mv = (kind === &quot;a&quot;) ? 14 / (10 + lam) : 1.6 - 28 / (10 + lam);
      h += '&lt;circle cx=&quot;' + X(lam) + '&quot; cy=&quot;' + Y(mv) + '&quot; r=&quot;5&quot; fill=&quot;' + C.accent + '&quot;/>';
    } else if (lam > 0) {
      h += '&lt;circle cx=&quot;' + X(lam) + '&quot; cy=&quot;' + Y(kind === &quot;a&quot; ? 0 : 1.6) + '&quot; r=&quot;5&quot; fill=&quot;' + C.accent + '&quot;/>';
    }
    return h;
  }

  function render() {
    var m = solve(), S = m.S;
    $(&quot;scene&quot;).innerHTML = drawScene(m);
    $(&quot;curveA&quot;).innerHTML = panel(&quot;a&quot;, m);
    $(&quot;curveB&quot;).innerHTML = panel(&quot;b&quot;, m);

    $(&quot;dataset&quot;).value = state.dataset;
    $(&quot;lambda&quot;).value = String(state.lambda);
    $(&quot;lambda-out&quot;).textContent = f(state.lambda, 1);
    $(&quot;demoA&quot;).value = String(state.demoA);
    $(&quot;demoA-out&quot;).textContent = f(state.demoA, 1);
    var demoActive = (state.dataset === &quot;degen&quot; &amp;&amp; state.lambda === 0);
    $(&quot;demoA-out&quot;).textContent = demoActive ? f(state.demoA, 1) : f(state.demoA, 1) + &quot;（不生效）&quot;;

    $(&quot;out-a&quot;).textContent = m.uniqueA ? f(m.a) : &quot;不唯一&quot;;
    $(&quot;out-b&quot;).textContent = m.uniqueA ? f(m.b) : &quot;b = 1.6 − 2a&quot;;
    $(&quot;out-sse&quot;).textContent = f(m.sse);
    $(&quot;out-pen&quot;).textContent = f(m.penalty);
    $(&quot;out-j&quot;).textContent = f(m.j);
    $(&quot;out-jmin&quot;).textContent = f(m.jmin);

    var note, check;
    if (state.dataset === &quot;main&quot;) {
      note = &quot;主示例，λ=&quot; + f(state.lambda, 1) + &quot;：a* = 14/(10+λ) = &quot; + f(m.a) + &quot;，b* = 1.6 − 2a* = &quot; + f(m.b) + &quot;；收缩因子 10/(10+λ) = &quot; + f(10 / (10 + state.lambda), 3) + &quot;。直线始终经过均值点 (2, 1.6)。&quot;;
      check = &quot;核对：SSE + λa² = &quot; + f(m.j) + &quot;，闭合公式 J_min = 21.2 − 196/(10+λ) = &quot; + f(m.jmin) + &quot;，两条路径一致。&quot;;
      $(&quot;phase&quot;).textContent = &quot;第 1–5 节的口径：Sxx=10>0，最优系数对每个 λ 唯一&quot;;
      $(&quot;phase&quot;).className = &quot;status&quot;;
      $(&quot;capA&quot;).textContent = &quot;a*(λ) = 14/(10+λ)：λ 越大，斜率越接近 0；竖虚线标出当前 λ。&quot;;
      $(&quot;capB&quot;).textContent = &quot;b*(λ) = 1.6 − 2a*：a* 变小，截距就变大，直线仍过 (2, 1.6)。&quot;;
    } else if (state.lambda > 0) {
      note = &quot;退化数据，λ=&quot; + f(state.lambda, 1) + &quot;>0：罚项 λa² 把 a 定在 0，b = 1.6 − 2a = &quot; + f(m.b) + &quot;；系数唯一，直线水平于 ŷ = 1.6。&quot;;
      check = &quot;核对：SSE = 21.2，λa² = 0，J = &quot; + f(m.j) + &quot;，与 J_min = Syy = 21.2 相同。罚项没有压低目标值，它只选出唯一的那组系数。&quot;;
      $(&quot;phase&quot;).textContent = &quot;退化数据，λ>0：a、b 都唯一（a=0，b=1.6）&quot;;
      $(&quot;phase&quot;).className = &quot;status&quot;;
      $(&quot;capA&quot;).textContent = &quot;λ>0 时 a* 恒为 0；λ=0 处 a 不被确定（左侧珊瑚虚线）。&quot;;
      $(&quot;capB&quot;).textContent = &quot;λ>0 时 b* 恒为 1.6；λ=0 时 b = 1.6 − 2a 随 a 一起不唯一。&quot;;
    } else {
      note = &quot;退化数据，λ=0：只能确定 c = 2a+b = 1.6（每个 x 上的预测值）。a 任意，b = 1.6 − 2a。当前按示例 a = &quot; + f(state.demoA, 1) + &quot; 画出一条解；把 a 改成别的值，预测、残差、SSE、J 都不变。&quot;;
      check = &quot;核对：任何满足 b = 1.6 − 2a 的直线都给出 SSE = J = 21.2 = J_min；图中这条直线只是一条解，不是唯一解。&quot;;
      $(&quot;phase&quot;).textContent = &quot;退化数据，λ=0：a、b 不唯一（同样好的直线有无穷多条）&quot;;
      $(&quot;phase&quot;).className = &quot;status warn&quot;;
      $(&quot;capA&quot;).textContent = &quot;λ=0 处 a 不被确定（珊瑚虚线）；λ>0 后 a* 才被罚项定为 0。&quot;;
      $(&quot;capB&quot;).textContent = &quot;λ=0 处 b = 1.6 − 2a 随 a 变化；λ>0 后 b* 定为 1.6。&quot;;
    }
    $(&quot;out-note&quot;).textContent = note;
    $(&quot;out-check&quot;).textContent = check;
    $(&quot;scene-note&quot;).textContent = &quot;图：&quot; + DATA[state.dataset].name + &quot;；圆点是观测，金色是当前直线 &quot; + lineEq(m) + &quot;，珊瑚竖线是每个点的残差，菱形是均值点 (2, 1.6)。&quot; + (m.uniqueA ? &quot;&quot; : &quot;图中这条线按示例 a 画出，它不是唯一解；统一 x 上完全重合的点略微错开显示。&quot;);
  }

  function commit() {
    if (window.presentation &amp;&amp; window.presentation.commitState) { window.presentation.commitState(); }
  }
  function set(partial) {
    if (&quot;lambda&quot; in partial) { state.lambda = Math.min(10, Math.max(0, Number(partial.lambda))); }
    if (&quot;dataset&quot; in partial &amp;&amp; DATA[partial.dataset]) { state.dataset = partial.dataset; }
    if (&quot;demoA&quot; in partial) { state.demoA = Math.min(2, Math.max(-2, Number(partial.demoA))); }
    render();
  }

  $(&quot;lambda&quot;).addEventListener(&quot;input&quot;, function (e) { set({ lambda: e.target.value }); });
  $(&quot;lambda&quot;).addEventListener(&quot;change&quot;, commit);
  $(&quot;demoA&quot;).addEventListener(&quot;input&quot;, function (e) { set({ demoA: e.target.value }); });
  $(&quot;demoA&quot;).addEventListener(&quot;change&quot;, commit);
  $(&quot;dataset&quot;).addEventListener(&quot;change&quot;, function (e) { set({ dataset: e.target.value }); commit(); });

  var presetButtons = document.querySelectorAll(&quot;[data-preset]&quot;);
  for (var bi = 0; bi &lt; presetButtons.length; bi++) {
    presetButtons[bi].addEventListener(&quot;click&quot;, function (e) {
      set({ lambda: Number(e.currentTarget.getAttribute(&quot;data-preset&quot;)) });
      commit();
    });
  }
  $(&quot;reset&quot;).addEventListener(&quot;click&quot;, function () {
    state.lambda = defaults.lambda; state.dataset = defaults.dataset; state.demoA = defaults.demoA;
    render(); commit();
  });

  if (window.presentation &amp;&amp; window.presentation.registerStateReader) {
    window.presentation.registerStateReader(function () {
      var m = solve();
      return {
        values: { lambda: state.lambda, dataset: state.dataset, demoA: state.demoA },
        visible_step: state.dataset + &quot;@lambda=&quot; + f(state.lambda, 1),
        observation: {
          summary: m.uniqueA
            ? &quot;λ=&quot; + f(state.lambda, 1) + &quot;，&quot; + DATA[state.dataset].name + &quot;：a*=&quot; + f(m.a) + &quot;，b*=&quot; + f(m.b) + &quot;，SSE=&quot; + f(m.sse) + &quot;，J=&quot; + f(m.j) + &quot;。&quot;
            : &quot;λ=0，退化数据：a 不唯一（图示示例 a=&quot; + f(state.demoA, 1) + &quot;，b=1.6−2a），预测值恒为 1.6，SSE=J=21.2。&quot;,
          state: {
            lambda: state.lambda, dataset: state.dataset, demo_a: state.demoA,
            unique: m.uniqueA,
            a: m.uniqueA ? m.a : null,
            b: m.uniqueA ? m.b : null,
            sse: m.sse, penalty: m.penalty, j: m.j
          }
        }
      };
    });
  }
  if (window.presentation &amp;&amp; window.presentation.registerStateRestorer) {
    window.presentation.registerStateRestorer(function (saved) {
      var v = (saved &amp;&amp; saved.values &amp;&amp; saved.values.page) || (saved &amp;&amp; saved.values) || {};
      if (&quot;lambda&quot; in v) { state.lambda = Math.min(10, Math.max(0, Number(v.lambda))); }
      if (v.dataset &amp;&amp; DATA[v.dataset]) { state.dataset = v.dataset; }
      if (&quot;demoA&quot; in v) { state.demoA = Math.min(2, Math.max(-2, Number(v.demoA))); }
      render();
    });
  }
  if (window.presentation &amp;&amp; window.presentation.registerActionHandler) {
    window.presentation.registerActionHandler(function (action) {
      if (!action) { return; }
      if (action.kind === &quot;set_parameters&quot;) {
        var v = action.values || {}, next = {};
        if (&quot;lambda&quot; in v) { next.lambda = v.lambda; }
        if (&quot;dataset&quot; in v) { next.dataset = v.dataset; }
        if (&quot;demoA&quot; in v) { next.demoA = v.demoA; }
        set(next);
      } else if (action.kind === &quot;invoke&quot; &amp;&amp; action.action_id === &quot;reset&quot;) {
        state.lambda = defaults.lambda; state.dataset = defaults.dataset; state.demoA = defaults.demoA;
        render();
      }
    });
  }

  render();
})();
&lt;/script>
&lt;/body>&lt;/html>"></iframe></body></html>
