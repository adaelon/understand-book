&lt;h1>一个中间量被用两次，反向传播怎样不漏算&lt;/h1>
&lt;p class=&quot;sub&quot;>模型固定为：u = x·y，v = u + x，L = v² + 3u。u 同时供给 v 和 3u；x 同时进入 u 和 v。默认输入 x = 2，y = 3。&lt;/p>

&lt;section id=&quot;structure&quot;>
  &lt;h2>这个图里，谁用了谁的结果&lt;/h2>
  &lt;div class=&quot;eqblk&quot;>u = x·y　　v = u + x　　L = v² + 3u&lt;/div>
  &lt;p>u 只计算一次，却被两个下游取用：v = u + x 取一次，L 里的 3u 再取一次。x 也出现在两处：它进入 u = x·y，又直接进入 v = u + x。&lt;/p>
  &lt;p>一句话答案：反向传播从 L 出发，按与前面相反的顺序走；走到被多处使用过的量时，先把各条路径回来的贡献加在一起，再用这个总数乘入边的局部导数，继续往上游传。默认输入下最终得到 dL/dx = 73，dL/dy = 38。&lt;/p>
  &lt;h3>图上会出现三种不同的量，先分清&lt;/h3>
  &lt;ul>
    &lt;li>节点里的大字：这个节点的前向数值，例如 u = 6。&lt;/li>
    &lt;li>边上的小框：这条边的局部导数，例如 ∂u/∂x = y = 3。它只描述这条边两端的两个量之间的关系。&lt;/li>
    &lt;li>节点下面的蓝字：这个节点对 L 的总导数，例如 dL/du = 19。它把从 L 回到这里的所有路径都算进去了。&lt;/li>
  &lt;/ul>
  &lt;p>反向的顺序由依赖决定：一个节点的总导数要用它下游节点的总导数来算，所以先算靠近 L 的节点。u 的总导数需要用到 dL/dv，因此 v 必须先算完，u 才能把两路信息相加。&lt;/p>
&lt;/section>

&lt;section id=&quot;demo&quot;>
  &lt;h2>一步一步走：前向求值，反向传导数&lt;/h2>

  &lt;div class=&quot;status&quot; id=&quot;status&quot; aria-live=&quot;polite&quot;>&lt;/div>

    &lt;div class=&quot;field&quot;>&lt;label for=&quot;yRange&quot;>y&lt;/label>&lt;input id=&quot;yRange&quot; type=&quot;range&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;3&quot;>&lt;output class=&quot;readout&quot; id=&quot;yOut&quot;>3&lt;/output>&lt;/div>
  &lt;/div>
  &lt;div class=&quot;btns&quot;>

    &lt;button id=&quot;startBtn&quot; type=&quot;button&quot;>从第 0 步开始&lt;/button>

    &lt;div class=&quot;node&quot; id=&quot;node-u&quot;>&lt;div class=&quot;nname&quot;>u &lt;span class=&quot;nform&quot;>= x·y&lt;/span>&lt;/div>&lt;div class=&quot;nval&quot; id=&quot;val-u&quot;>6&lt;/div>&lt;div class=&quot;ngrad pending&quot; id=&quot;grad-u&quot;>dL/du = ?&lt;/div>&lt;div class=&quot;nnote&quot; id=&quot;note-u&quot;>&lt;/div>&lt;/div>

    &lt;div class=&quot;node&quot; id=&quot;node-L&quot;>&lt;div class=&quot;nname&quot;>L &lt;span class=&quot;nform&quot;>= v² + 3u&lt;/span>&lt;/div>&lt;div class=&quot;nval&quot; id=&quot;val-L&quot;>82&lt;/div>&lt;div class=&quot;ngrad pending&quot; id=&quot;grad-L&quot;>dL/dL = ?&lt;/div>&lt;div class=&quot;nnote&quot; id=&quot;note-L&quot;>&lt;/div>&lt;/div>
    &lt;div class=&quot;elabel pending&quot; id=&quot;lbl-e-xu&quot;>&lt;/div>
    &lt;div class=&quot;elabel pending&quot; id=&quot;lbl-e-yu&quot;>&lt;/div>
    &lt;div class=&quot;elabel pending&quot; id=&quot;lbl-e-uv&quot;>&lt;/div>
    &lt;div class=&quot;elabel pending&quot; id=&quot;lbl-e-xv&quot;>&lt;/div>
    &lt;div class=&quot;elabel pending&quot; id=&quot;lbl-e-vl&quot;>&lt;/div>
    &lt;div class=&quot;elabel pending&quot; id=&quot;lbl-e-ul&quot;>&lt;/div>
  &lt;/div>

  &lt;div class=&quot;deplist&quot; id=&quot;deplist&quot;>
    &lt;p class=&quot;note&quot;>屏幕较窄时用这份列表代替图：每行是一条边，左端是上游，右端是下游。&lt;/p>
  &lt;/div>
  &lt;div class=&quot;nodetotals&quot; id=&quot;nodetotals&quot;>&lt;/div>

  &lt;div class=&quot;stepPanel&quot;>&lt;h3 id=&quot;stepTitle&quot;>在 x 汇合&lt;/h3>&lt;p id=&quot;stepBody&quot;>&lt;/p>&lt;/div>

  &lt;div class=&quot;resultBox&quot;>
    &lt;div class=&quot;item&quot;>&lt;span class=&quot;rl&quot;>dL/dx&lt;/span>&lt;span class=&quot;rv&quot; id=&quot;rdx&quot;>?&lt;/span>&lt;/div>
    &lt;div class=&quot;item&quot;>&lt;span class=&quot;rl&quot;>dL/dy&lt;/span>&lt;span class=&quot;rv&quot; id=&quot;rdy&quot;>?&lt;/span>&lt;/div>
    &lt;div class=&quot;item&quot;>&lt;span class=&quot;rl&quot;>dL/du&lt;/span>&lt;span class=&quot;rv&quot; id=&quot;rdu&quot;>?&lt;/span>&lt;/div>
    &lt;div class=&quot;rnote&quot;>dL/du 是中间量 u 的总导数：v 支路与 3u 直接项的贡献相加。dL/dx 再把 u 支路与 v 直连两份加在一起。&lt;/div>
  &lt;/div>

  &lt;div class=&quot;ledger&quot;>&lt;h3>计算记录（按当前输入）&lt;/h3>&lt;ol id=&quot;ledgerList&quot;>&lt;/ol>&lt;/div>
  &lt;p class=&quot;note&quot;>还没走到的步骤不会提前写进这份记录，所以它始终只包含已经算过的量。&lt;/p>
&lt;/section>

&lt;section id=&quot;merge&quot;>
  &lt;h2>两份信息为什么要相加&lt;/h2>
  &lt;p>拿 u 做一次小实验。假设 u 从当前值增加一个很小的量 Δ，这件事会同时影响 L 的两处：v = u + x 跟着增加 Δ，于是 v² 增加大约 2v·Δ；同时 3u 这一项增加 3Δ。&lt;/p>
  &lt;p>L 的总变化就是这两部分之和，系数加在一起是 2v + 3。所以 L 对 u 的变化率等于 2v + 3：两处效应同时发生，少算任何一项，就漏掉了那部分变化。&lt;/p>
  &lt;div class=&quot;eqblk&quot; id=&quot;mergeDelta&quot;>&lt;/div>
  &lt;p>换成路径的说法：从 L 到 u 有两条路。每条路上的局部导数相乘，得到这条路的贡献；同一个节点收到的所有路径贡献相加，才是这个节点的总导数。&lt;/p>
  &lt;table class=&quot;tbl&quot;>
    &lt;thead>&lt;tr>&lt;th>从 L 到 u 的路径&lt;/th>&lt;th>沿路相乘&lt;/th>&lt;th>贡献&lt;/th>&lt;/tr>&lt;/thead>
    &lt;tbody id=&quot;mergeRows&quot;>&lt;/tbody>
  &lt;/table>
  &lt;p>节点 x 也按同样的规则处理：它从 u 支路收到一份，从 v 直连收到另一份，两份相加才是 dL/dx。&lt;/p>
&lt;/section>

&lt;section id=&quot;missing&quot;>
  &lt;h2>漏掉一条贡献，会错在哪里&lt;/h2>
  &lt;p>假设在 x 这个汇合点只把 u 支路的贡献算进去。你会得到一个比正确值小的数，因为 x 还直接进入 v：x 变一点，v 立刻跟着变，这部分完全不经过 u。漏掉的正是这条路径的贡献。&lt;/p>
  &lt;table class=&quot;tbl&quot;>
    &lt;thead>&lt;tr>&lt;th>做法&lt;/th>&lt;th>得到的 dL/dx&lt;/th>&lt;th>与正确值之差&lt;/th>&lt;/tr>&lt;/thead>
    &lt;tbody id=&quot;missRows&quot;>&lt;/tbody>
  &lt;/table>
  &lt;p>判断有没有漏，办法很具体：数一数每个节点有几条出边。u 有两条（通向 v 和 L），x 有两条（通向 u 和 v）。到达这种节点时，必须把各条出边回来的贡献都收齐再相加。只有一条出边的节点（本例的 v）不需要相加。&lt;/p>
  &lt;p id=&quot;missNote&quot; class=&quot;note&quot;>&lt;/p>
&lt;/section>

&lt;section id=&quot;zero&quot;>
  &lt;h2>负数和零贡献的意思&lt;/h2>
  &lt;p>局部导数可以是负数。∂u/∂x = y，当 y 为负时它就是负数，u 支路给 x 的贡献也带负号。两份贡献符号相反时会部分抵消，相加的结果可能比每一份的绝对值都小，这正是正确的答案。&lt;/p>
  &lt;p>局部导数为 0 时，这条边回传 0。这只说明这条边此刻没有传递影响：节点自己的总导数仍然可能非零，并继续沿别的边往回走。&lt;/p>
  &lt;p>两个可以直接点开的对照：&lt;/p>
  &lt;ul>
    &lt;li>取 y = 0：∂u/∂x = y = 0，u 支路对 x 的贡献变成 0；但 dL/du = 2v + 3 仍然非零，并通过 ∂u/∂y = x 继续传给 y。&lt;/li>
    &lt;li>取 x = 0：v = 0，于是 ∂L/∂v = 2v = 0，v 支路对 u 的贡献为 0；u 仍然从 3u 那一项收到 3，所以 dL/du = 3，没有变成 0。&lt;/li>
  &lt;/ul>
  &lt;p>负数可以这样核对（这一句固定用 x = -1、y = 2 说明）：u = -2，v = -3，∂L/∂v = 2v = -6，dL/du = -6 + 3 = -3，dL/dx = -3×2 + (-6) = -12。把 x、y 代入展开式 L = (xy + x)² + 3xy 也得到 -12。&lt;/p>
&lt;/section>

&lt;section id=&quot;check&quot;>
  &lt;h2>独立核对：把 L 直接写成 x、y 的函数&lt;/h2>
  &lt;p>把 u 和 v 代进 L = v² + 3u。因为 v = xy + x，所以 L = (xy + x)² + 3xy。这条式子只含 x 和 y，可以直接求偏导，不经过任何回传规则。&lt;/p>
  &lt;div class=&quot;eqblk&quot; id=&quot;checkX&quot;>&lt;/div>
  &lt;div class=&quot;eqblk&quot; id=&quot;checkY&quot;>&lt;/div>
  &lt;p id=&quot;checkVerdict&quot;>&lt;/p>
  &lt;p>再用中心差分估一次（h = 0.001，纯数值，不参与上面的代数推导）：&lt;/p>
  &lt;div class=&quot;eqblk&quot; id=&quot;checkNum&quot;>&lt;/div>
  &lt;p class=&quot;note&quot;>本页只讨论这一个实数模型：某一组输入下的前向值与偏导，不涉及矩阵、网络层或实现性能。&lt;/p>
&lt;/section>

&lt;/div>
&lt;script>
(function(){
&quot;use strict&quot;;
var $=function(id){return document.getElementById(id);};
var TOTAL=11;
var state={x:2,y:3,step:11};
var TITLES=['读出输入','算 u','算 v','算 L','反向起点','L 的两条出边','传到 v','v 把信息分给两个来源','在 u 汇合','u 的两条入边','传回输入','在 x 汇合'];
var ACTIVE={0:['x','y'],1:['u'],2:['v'],3:['L'],4:['L'],5:['L'],6:['v'],7:['v'],8:['u'],9:['u'],10:['u'],11:['x','y']};

function fmt(n){var r=Math.round(n*10000)/10000;if(Object.is(r,-0)){r=0;}return String(r);}
function rev(n){return state.step>=n;}

function calc(){
  var x=state.x,y=state.y;
  var u=x*y,v=u+x,L=v*v+3*u;
  var dLv=2*v,dLuD=3,gv=dLv,cUu=gv,gu=cUu+dLuD;
  var cUx=gu*y,cUy=gu*x,cVx=gv;
  return {x:x,y:y,u:u,v:v,L:L,gL:1,dLv:dLv,dLuD:dLuD,gv:gv,cUu:cUu,gu:gu,cUx:cUx,cUy:cUy,cVx:cVx,gx:cUx+cVx,gy:cUy};
}

var EDGES=[
 {id:'e-xu',from:'x',to:'u',revL:9,revB:10,t:0.5,off:24,
  l1:function(d){return '∂u/∂x = y = '+(rev(9)?fmt(d.y):'?');},
  l2:function(d){return '回传 '+fmt(d.gu)+'×'+fmt(d.y)+' = '+fmt(d.cUx);}},
 {id:'e-yu',from:'y',to:'u',revL:9,revB:10,t:0.5,off:24,
  l1:function(d){return '∂u/∂y = x = '+(rev(9)?fmt(d.x):'?');},
  l2:function(d){return '回传 '+fmt(d.gu)+'×'+fmt(d.x)+' = '+fmt(d.cUy);}},
 {id:'e-uv',from:'u',to:'v',revL:7,revB:7,t:0.44,off:26,
  l1:function(){return '∂v/∂u = 1';},
  l2:function(d){return '回传 '+fmt(d.gv)+'×1 = '+fmt(d.cUu);}},
 {id:'e-xv',from:'x',to:'v',revL:7,revB:7,t:0.66,off:24,
  l1:function(){return '∂v/∂x = 1';},
  l2:function(d){return '回传 '+fmt(d.gv)+'×1 = '+fmt(d.cVx);}},
 {id:'e-vl',from:'v',to:'L',revL:5,revB:6,t:0.5,off:26,
  l1:function(d){return '∂L/∂v = 2v = '+(rev(5)?fmt(d.dLv):'?');},
  l2:function(d){return '回传 1×'+fmt(d.dLv)+' = '+fmt(d.gv);}},
 {id:'e-ul',from:'u',to:'L',revL:5,revB:8,t:0.6,off:26,
  l1:function(){return '∂L/∂u（3u 项）= '+(rev(5)?'3':'?');},
  l2:function(){return '回传 1×3 = 3';}}
];

function drawEdges(){
  var graph=$('graph'),svg=$('edges');
  if(!graph||svg===null)return;
  if(graph.offsetParent===null)return;
  var gr=graph.getBoundingClientRect();
  var W=Math.round(gr.width),H=Math.round(gr.height);
  if(W&lt;10||H&lt;10)return;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  var out=['&lt;defs>&lt;marker id=&quot;ah&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;5.5&quot; markerHeight=&quot;5.5&quot; orient=&quot;auto&quot;>&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;#9aa9bb&quot;>&lt;/path>&lt;/marker>&lt;marker id=&quot;ahb&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;5.5&quot; markerHeight=&quot;5.5&quot; orient=&quot;auto&quot;>&lt;path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;#2f6fd0&quot;>&lt;/path>&lt;/marker>&lt;/defs>'];
  EDGES.forEach(function(e){
    var a=$('node-'+e.from),b=$('node-'+e.to);
    if(!a||!b)return;
    var ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    var p1x=ra.left-gr.left+ra.width/2,p1y=ra.top-gr.top+ra.height/2;
    var p2x=rb.left-gr.left+rb.width/2,p2y=rb.top-gr.top+rb.height/2;
    var dx=p2x-p1x,dy=p2y-p1y,len=Math.sqrt(dx*dx+dy*dy)||1;
    out.push('&lt;line x1=&quot;'+p1x+'&quot; y1=&quot;'+p1y+'&quot; x2=&quot;'+p2x+'&quot; y2=&quot;'+p2y+'&quot; stroke=&quot;#9aa9bb&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;>&lt;/line>');
    if(rev(e.revB)){
      var ax=p1x+dx*0.9,ay=p1y+dy*0.9,bx=p1x+dx*0.1,by=p1y+dy*0.1;
      out.push('&lt;line x1=&quot;'+ax+'&quot; y1=&quot;'+ay+'&quot; x2=&quot;'+bx+'&quot; y2=&quot;'+by+'&quot; stroke=&quot;#2f6fd0&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot; marker-end=&quot;url(#ahb)&quot;>&lt;/line>');
    }
    var lbl=$('lbl-'+e.id);
    if(lbl){
      var mx=p1x+dx*e.t,my=p1y+dy*e.t;
      var nx=-dy/len,ny=dx/len;
      lbl.style.left=(mx+nx*e.off)+'px';
      lbl.style.top=(my+ny*e.off)+'px';
    }
  });
  svg.innerHTML=out.join('');
}

function grad(n,on,text,note){
  var g=$('grad-'+n),nt=$('note-'+n);
  if(g){g.textContent=text;g.className='ngrad'+(on?'':' pending');}
  if(nt){nt.textContent=note||'';}
}

function render(){
  var d=calc(),s=state.step;

  $('xRange').value=String(d.x);$('yRange').value=String(d.y);
  $('xOut').textContent=fmt(d.x);$('yOut').textContent=fmt(d.y);

  var phase=s&lt;=3?'前向':'反向';
  $('status').innerHTML='&lt;span class=&quot;chip strong&quot;>x = '+fmt(d.x)+'&lt;/span>&lt;span class=&quot;chip strong&quot;>y = '+fmt(d.y)+'&lt;/span>&lt;span class=&quot;chip&quot;>第 '+s+' / '+TOTAL+' 步&lt;/span>&lt;span class=&quot;chip&quot;>'+phase+'：'+TITLES[s]+'&lt;/span>';

  var shown={x:true,y:true,u:s>=1,v:s>=2,L:s>=3};
  ['x','y','u','v','L'].forEach(function(n){
    var el=$('val-'+n);
    el.textContent=shown[n]?fmt(d[n]):'?';
    el.className='nval'+(shown[n]?'':' pending');
    var card=$('node-'+n);
    card.classList.toggle('active',(ACTIVE[s]||[]).indexOf(n)>=0);
    card.classList.toggle('merge',(n==='u'&amp;&amp;s>=8)||(n==='x'&amp;&amp;s>=11));
  });

  grad('L',s>=4,'dL/dL = '+(s>=4?fmt(d.gL):'?'),s>=4?'回传起点':'');
  grad('v',s>=6,'dL/dv = '+(s>=6?fmt(d.gv):'?'),'');
  grad('u',s>=8,'dL/du = '+(s>=8?fmt(d.gu):'?'),s>=8?(fmt(d.cUu)+'（来自 v） + 3'):'');
  grad('x',s>=11,'dL/dx = '+(s>=11?fmt(d.gx):'?'),s>=11?(fmt(d.cUx)+' + '+fmt(d.cVx)):(s>=7?'已收到 '+fmt(d.cVx):''));
  grad('y',s>=11,'dL/dy = '+(s>=11?fmt(d.gy):'?'),s>=11?'只有一条路径':'');

  EDGES.forEach(function(e){
    var el=$('lbl-'+e.id);
    if(!el)return;
    var html='&lt;span class=&quot;l1&quot;>'+e.l1(d)+'&lt;/span>';
    if(s>=e.revB){html+='&lt;span class=&quot;l2&quot;>'+e.l2(d)+'&lt;/span>';}
    el.innerHTML=html;
    el.className='elabel'+(s>=e.revL?'':' pending')+(s>=e.revB?' back':'');
  });

  var rows=[
    {e:'x → u',l:'∂u/∂x = y = '+(s>=9?fmt(d.y):'?'),b:s>=10?('回传 '+fmt(d.gu)+'×'+fmt(d.y)+' = '+fmt(d.cUx)):'待回传',on:s>=10},
    {e:'y → u',l:'∂u/∂y = x = '+(s>=9?fmt(d.x):'?'),b:s>=10?('回传 '+fmt(d.gu)+'×'+fmt(d.x)+' = '+fmt(d.cUy)):'待回传',on:s>=10},
    {e:'u → v',l:'∂v/∂u = 1',b:s>=7?('回传 '+fmt(d.gv)+'×1 = '+fmt(d.cUu)):'待回传',on:s>=7},
    {e:'x → v',l:'∂v/∂x = 1',b:s>=7?('回传 '+fmt(d.gv)+'×1 = '+fmt(d.cVx)):'待回传',on:s>=7},
    {e:'v → L',l:'∂L/∂v = 2v = '+(s>=5?fmt(d.dLv):'?'),b:s>=6?('回传 1×'+fmt(d.dLv)+' = '+fmt(d.gv)):'待回传',on:s>=6},
    {e:'u → L',l:'∂L/∂u（3u 项）= '+(s>=5?'3':'?'),b:s>=8?'回传 1×3 = 3':'待回传',on:s>=8}
  ];
  var html='';
  rows.forEach(function(r){
    html+='&lt;div class=&quot;dep&quot;>&lt;span class=&quot;e&quot;>'+r.e+'&lt;/span>&lt;span class=&quot;l&quot;>'+r.l+'&lt;/span>&lt;span class=&quot;b'+(r.on?'':' pending')+'&quot;>'+r.b+'&lt;/span>&lt;/div>';
  });
  $('deplist').innerHTML='&lt;p class=&quot;note&quot;>屏幕较窄时用这份列表代替图：每行是一条边，左端是上游，右端是下游。&lt;/p>'+html;

  var tots=[['dL/dL',s>=4?fmt(d.gL):'?'],['dL/dv',s>=6?fmt(d.gv):'?'],['dL/du',s>=8?fmt(d.gu):'?'],['dL/dx',s>=11?fmt(d.gx):'?'],['dL/dy',s>=11?fmt(d.gy):'?']];
  var t='';
  tots.forEach(function(x){
    t+='&lt;span class=&quot;tot'+(x[1]==='?'?' pending':'')+'&quot;>'+x[0]+' = '+x[1]+'&lt;/span>';
  });
  $('nodetotals').innerHTML=t;

  var body=[];
  body[0]='先把 x = '+fmt(d.x)+'、y = '+fmt(d.y)+' 放进图里。前向的顺序由依赖决定：u 只等 x 和 y；v 还要等 u；L 最后等 v。';
  body[1]='u = x·y = '+fmt(d.x)+' × '+fmt(d.y)+' = &lt;b>'+fmt(d.u)+'&lt;/b>。同一份 u 会被两个下游取用：v = u + x 取一次，L = v² + 3u 里的 3u 再取一次。';
  body[2]='v = u + x = '+fmt(d.u)+' + '+fmt(d.x)+' = &lt;b>'+fmt(d.v)+'&lt;/b>。v 有两个来源：u 和 x。';
  body[3]='L = v² + 3u = '+fmt(d.v)+'² + 3×'+fmt(d.u)+' = '+fmt(d.v*d.v)+' + '+fmt(3*d.u)+' = &lt;b>'+fmt(d.L)+'&lt;/b>。前向结束，五个节点都有数值。';
  body[4]='反向从 L 开始，先记 dL/dL = 1，这是整条回传的起点。顺序与前向相反：u 的总导数要用到 dL/dv，所以 v 必须先算完，u 才能把两路信息相加。';
  body[5]='L 沿两条边接收上游的量：经 v² 那条边，局部导数是 ∂L/∂v = 2v = '+fmt(d.dLv)+'；经 3u 那条边，局部导数是 ∂L/∂u = 3。局部导数只描述一条边两端的两个量，它还没有和回传值相乘。';
  body[6]='v 只通过一条路影响 L，所以 dL/dv = 1 × 2v = &lt;b>'+fmt(d.gv)+'&lt;/b>。路径只有一条时，这个节点只收到一份贡献，总导数就等于它。';
  body[7]='v = u + x 有两条入边，回传值要分给两个上游：沿 u 方向 '+fmt(d.gv)+' × 1 = '+fmt(d.cUu)+'；沿 x 方向 '+fmt(d.gv)+' × 1 = '+fmt(d.cVx)+'。这两份去往不同的汇合点，先分别记下。';
  body[8]='u 被用了两次，两份信息在这里相加：来自 v 的 '+fmt(d.cUu)+'，加上 3u 直接给 u 的 3，得到 dL/du = '+fmt(d.cUu)+' + 3 = &lt;b>'+fmt(d.gu)+'&lt;/b>。到这一步，u 才有可以继续往前传的总导数。';
  body[9]='u = x·y 的两条入边局部导数：∂u/∂x = y = '+fmt(d.y)+'；∂u/∂y = x = '+fmt(d.x)+'。求偏导时，另一个输入当作常数。';
  body[10]='用同一个 dL/du = '+fmt(d.gu)+' 分别乘两条边的局部导数：x 从 u 支路得到 '+fmt(d.gu)+' × '+fmt(d.y)+' = '+fmt(d.cUx)+'；y 得到 '+fmt(d.gu)+' × '+fmt(d.x)+' = '+fmt(d.cUy)+'。';
  body[11]='x 也有两条出边，两份贡献在 x 汇合：u 支路 '+fmt(d.cUx)+' + v 直连 '+fmt(d.cVx)+' = &lt;b>'+fmt(d.gx)+'&lt;/b>。y 只有一条路径，所以 dL/dy = '+fmt(d.cUy)+'。';
  $('stepTitle').textContent=s+' / '+TOTAL+' · '+TITLES[s];
  $('stepBody').innerHTML=body[s];

  $('rdx').textContent=s>=11?fmt(d.gx):'?';
  $('rdy').textContent=s>=11?fmt(d.gy):'?';
  $('rdu').textContent=s>=8?fmt(d.gu):'?';

  var lines=[];
  lines.push('输入：x = '+fmt(d.x)+'，y = '+fmt(d.y));
  if(s>=1){lines.push('u = x·y = '+fmt(d.x)+'×'+fmt(d.y)+' = '+fmt(d.u));}
  if(s>=2){lines.push('v = u + x = '+fmt(d.u)+'+'+fmt(d.x)+' = '+fmt(d.v));}
  if(s>=3){lines.push('L = v² + 3u = '+fmt(d.v)+'² + 3×'+fmt(d.u)+' = '+fmt(d.L));}
  if(s>=4){lines.push('种子：dL/dL = 1');}
  if(s>=5){lines.push('边 v→L 的局部导数 ∂L/∂v = 2v = '+fmt(d.dLv)+'；边 u→L 的局部导数 ∂L/∂u = 3');}
  if(s>=6){lines.push('dL/dv = 1 × 2v = '+fmt(d.gv));}
  if(s>=7){lines.push('u→v 回传 '+fmt(d.gv)+'×1 = '+fmt(d.cUu)+'；x→v 回传 '+fmt(d.gv)+'×1 = '+fmt(d.cVx));}
  if(s>=8){lines.push('dL/du = '+fmt(d.cUu)+'（来自 v）+ 3（来自 3u）= '+fmt(d.gu));}
  if(s>=9){lines.push('∂u/∂x = y = '+fmt(d.y)+'；∂u/∂y = x = '+fmt(d.x));}
  if(s>=10){lines.push('x 从 u 支路得到 '+fmt(d.gu)+'×'+fmt(d.y)+' = '+fmt(d.cUx)+'；y 得到 '+fmt(d.gu)+'×'+fmt(d.x)+' = '+fmt(d.cUy));}
  if(s>=11){lines.push('dL/dx = '+fmt(d.cUx)+' + '+fmt(d.cVx)+' = '+fmt(d.gx)+'；dL/dy = '+fmt(d.cUy));}
  var lo='';
  lines.forEach(function(t){lo+='&lt;li>'+t+'&lt;/li>';});
  $('ledgerList').innerHTML=lo;

  var mrow='';
  mrow+='&lt;tr>&lt;td>L ← v ← u&lt;/td>&lt;td>∂L/∂v × ∂v/∂u = '+fmt(d.dLv)+' × 1 = '+fmt(d.dLv)+'&lt;/td>&lt;td class=&quot;num&quot;>'+fmt(d.cUu)+'&lt;/td>&lt;/tr>';
  mrow+='&lt;tr>&lt;td>L ← u（3u 这一项）&lt;/td>&lt;td>∂L/∂u = '+fmt(d.dLuD)+'&lt;/td>&lt;td class=&quot;num&quot;>'+fmt(d.dLuD)+'&lt;/td>&lt;/tr>';
  mrow+='&lt;tr>&lt;td>合计 = 节点 u 的总导数&lt;/td>&lt;td>'+fmt(d.cUu)+' + '+fmt(d.dLuD)+'&lt;/td>&lt;td class=&quot;num&quot;>dL/du = '+fmt(d.gu)+'&lt;/td>&lt;/tr>';
  $('mergeRows').innerHTML=mrow;
  $('mergeDelta').innerHTML='设 u 增加 0.01：v 增加 0.01，v² 增加约 2v×0.01 = '+fmt(2*d.v*0.01)+'；3u 增加 3×0.01 = '+fmt(3*0.01)+'；L 共增加约 '+fmt((2*d.v+3)*0.01)+' = (2v + 3)×0.01。';

  var miss='';
  miss+='&lt;tr>&lt;td>只保留 u 支路&lt;/td>&lt;td class=&quot;num&quot;>'+fmt(d.cUx)+'&lt;/td>&lt;td class=&quot;num&quot;>少 '+fmt(d.cVx)+'&lt;/td>&lt;/tr>';
  miss+='&lt;tr>&lt;td>只保留 v 直连&lt;/td>&lt;td class=&quot;num&quot;>'+fmt(d.cVx)+'&lt;/td>&lt;td class=&quot;num&quot;>少 '+fmt(d.cUx)+'&lt;/td>&lt;/tr>';
  miss+='&lt;tr>&lt;td>两条都保留（正确）&lt;/td>&lt;td class=&quot;num&quot;>'+fmt(d.gx)+'&lt;/td>&lt;td class=&quot;num&quot;>—&lt;/td>&lt;/tr>';
  $('missRows').innerHTML=miss;
  var zeroNow=(d.cUx===0||d.cVx===0);
  $('missNote').textContent=zeroNow
    ? '当前输入下有一条贡献正好是 0（'+(d.cUx===0?'u 支路':'v 直连')+'）。这时漏掉它，数值上不会变，但规则没有变：仍然要把这条边算进来，只是这一项加的是 0。'
    : '当前输入下两份贡献都是非零的，所以任意漏掉一条，结果都会直接偏掉被漏掉的那一份。';

  var A=d.v,yp1=d.y+1,bx=2*A*yp1,cx=3*d.y,by=2*A*d.x,cy=3*d.x;
  var gxCheck=bx+cx,gyCheck=by+cy;
  $('checkX').innerHTML='∂L/∂x = 2(xy + x)(y + 1) + 3y = 2·'+fmt(A)+'·'+fmt(yp1)+' + '+fmt(cx)+' = '+fmt(bx)+' + '+fmt(cx)+' = &lt;b>'+fmt(gxCheck)+'&lt;/b>';
  $('checkY').innerHTML='∂L/∂y = 2(xy + x)·x + 3x = 2·'+fmt(A)+'·'+fmt(d.x)+' + '+fmt(cy)+' = '+fmt(by)+' + '+fmt(cy)+' = &lt;b>'+fmt(gyCheck)+'&lt;/b>';
  var ok=Math.abs(gxCheck-d.gx)&lt;1e-6&amp;&amp;Math.abs(gyCheck-d.gy)&lt;1e-6;
  $('checkVerdict').innerHTML=ok
    ? '展开求导得到 ∂L/∂x = '+fmt(gxCheck)+'、∂L/∂y = '+fmt(gyCheck)+'，与上面反向传播的 dL/dx = '+fmt(d.gx)+'、dL/dy = '+fmt(d.gy)+' 相同。两条完全不同的算法给出同一个数。'
    : '展开求导得到 '+fmt(gxCheck)+' 与 '+fmt(gyCheck)+'，反向传播给出 '+fmt(d.gx)+' 与 '+fmt(d.gy)+'，两者不一致。';

  function Lf(x,y){var t=x*y+x;return t*t+3*x*y;}
  var h=0.001;
  var nX=(Lf(d.x+h,d.y)-Lf(d.x-h,d.y))/(2*h);
  var nY=(Lf(d.x,d.y+h)-Lf(d.x,d.y-h))/(2*h);
  $('checkNum').innerHTML='dL/dx ≈ '+nX.toFixed(4)+'（差分），解析值 '+fmt(d.gx)+'&lt;br>dL/dy ≈ '+nY.toFixed(4)+'（差分），解析值 '+fmt(d.gy);

  document.querySelectorAll('.preset').forEach(function(b){
    var on=(parseFloat(b.getAttribute('data-x'))===d.x&amp;&amp;parseFloat(b.getAttribute('data-y'))===d.y);
    b.classList.toggle('on',on);
  });

  $('prevBtn').disabled=(s&lt;=0);
  $('nextBtn').disabled=(s>=TOTAL);

  drawEdges();
}

function setStep(v){state.step=Math.max(0,Math.min(TOTAL,v));render();}
function snap(v){return Math.round(v*2)/2;}

$('nextBtn').onclick=function(){setStep(state.step+1);};
$('prevBtn').onclick=function(){setStep(state.step-1);};
$('startBtn').onclick=function(){setStep(0);};
$('allBtn').onclick=function(){setStep(TOTAL);};
$('xRange').oninput=function(){state.x=snap(parseFloat(this.value));render();};
$('yRange').oninput=function(){state.y=snap(parseFloat(this.value));render();};
document.querySelectorAll('.preset').forEach(function(b){
  b.onclick=function(){
    state.x=snap(parseFloat(b.getAttribute('data-x')));
    state.y=snap(parseFloat(b.getAttribute('data-y')));
    render();
  };
});

var init=(window.presentation&amp;&amp;window.presentation.initialState)||{};
if(typeof init.x==='number'){state.x=init.x;}
if(typeof init.y==='number'){state.y=init.y;}
if(typeof init.step==='number'){state.step=init.step;}

if(window.presentation&amp;&amp;window.presentation.registerStateReader){
  window.presentation.registerStateReader(function(){
    return {values:{x:state.x,y:state.y,step:state.step},visible_step:String(state.step)+' / '+TOTAL};
  });
}
if(window.presentation&amp;&amp;window.presentation.registerStateRestorer){
  window.presentation.registerStateRestorer(function(saved){
    var v=((saved&amp;&amp;saved.values&amp;&amp;saved.values.page)?saved.values.page:((saved&amp;&amp;saved.values)?saved.values:{}));
    if(typeof v.x==='number'){state.x=snap(Math.max(-3,Math.min(3,v.x)));}
    if(typeof v.y==='number'){state.y=snap(Math.max(-3,Math.min(3,v.y)));}
    if(typeof v.step==='number'){state.step=Math.max(0,Math.min(TOTAL,Math.round(v.step)));}
    render();
  });
}

window.addEventListener('resize',function(){drawEdges();});
window.addEventListener('load',function(){render();});
render();
})();
&lt;/script>
