[package]
name = "runtime"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
schemars = "0.8"
artifact-tools = { path = "../artifact-tools" }
base-schema = { path = "../base-schema" }
book-tool-contracts = { path = "../book-tool-contracts" }
read-tools = { path = "../read-tools" }
memory = { path = "../memory" }
reader = { path = "../reader" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
httpdate = "1"
url = "2"
dotenvy = "0.15"
ts-rs = "10"
uuid = { version = "1", features = ["v7"] }
azure_core = "1"
azure_identity = "1"
google-cloud-auth = "1"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
crc32fast = "1"
base64 = "0.22"

[build-dependencies]
serde_json = "1"
