<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Understand Book · 登录</title><link rel="stylesheet" href="/auth.css"><script type="module" src="/auth.js"></script></head>
<body><main><select id="language" aria-label="Language / 语言"><option value="zh-CN">中文</option><option value="en">English</option></select><p class="eyebrow">UNDERSTAND BOOK</p><h1 data-en="Back to your reading">回到你的阅读</h1><p data-en="Sign in with your verified email or existing account.">使用已验证邮箱或现有账号登录。</p>
<form id="login"><label><span data-en="Email or username">邮箱或账号</span><input name="username" autocomplete="username" required maxlength="254"></label><label><span data-en="Password">密码</span><input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button data-en="Sign in">登录</button></form>
<p><span data-en="On the main reading site, you can ">请在正式阅读站点使用</span><a href="/?account=register" data-en="create an account">注册账号</a><span data-en=" or ">或</span><a href="/?account=forgot-password" data-en="reset your password">找回密码</a><span data-en=".">。</span></p><p id="notice" role="status" aria-live="polite"></p><section id="library" hidden><div class="account"><p id="identity"></p><button id="logout" type="button" data-en="Sign out">退出登录</button></div><p data-en="Link your email in Personal settings on the main reading site.">绑定邮箱请在正式阅读站点的“个人设置”中操作。</p><h2 data-en="Your library">你的书库</h2><ul id="books"></ul><p id="empty" hidden data-en="No reading materials are available yet. Contact your administrator for access.">暂时没有可阅读的材料，请联系管理员授权。</p></section></main></body></html>
