[package]
name = "base-schema"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# Media timestamps and edge-aligned normalized crops must survive JSON roundtrips.
serde_json = { version = "1", features = ["float_roundtrip"] }
ts-rs = "10"
schemars = "0.8"
